<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xMOTION</title>
<style>
  html,body{height:100%;margin:0;background:#0d0d10;overflow:hidden;}
  .hero{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  /* 中央の赤い光。ゆっくり脈打つ */
  .glow{
    position:absolute; width:min(700px,62vw); height:min(700px,62vw); border-radius:50%;
    background:radial-gradient(circle, rgba(255,56,92,.18) 0%, transparent 65%);
    top:calc(50% - 12.5vh); left:50%; transform:translate(-50%,-55%);
    pointer-events:none;
    will-change:transform,opacity;
    animation:glowPulse 4s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{ opacity:.7; transform:translate(-50%,-55%) scale(1); }
    50%    { opacity:1;  transform:translate(-50%,-55%) scale(1.12); }
  }
  /* xMOTION のロゴ。登場したあと、ゆっくり光が横切る。
     文字はフォントに頼らず、Inter Black のアウトライン（SVG）をマスクにして塗る。
     フォントで組むと端末ごとに別の書体（iPhone は SF、Windows は Arial など）に置き換わり、
     静止画（ポスター）と動く版で字形も幅も変わってしまうため。
     大きさは iframe の高さ基準（vh）。ポスターはパネルの高さに合わせて拡大されるので、
     高さ基準にしておけば、どの画面でも静止画と動く版のロゴが同じ大きさ・位置になる。
     幅が足りない縦長の画面（スマホ）では幅基準（84vw）に切り替わる。
     置き場所はパネル下部の見出し・本文に重ならないよう、中央より上（margin-bottom の半分だけ上がる）。

    animation:logoIn 1s cubic-bezier(.2,.8,.2,1) both,
              logoShine 6s linear 1s infinite;
  }
  /* 登場: transform / opacity / blur だけを動かす（レイアウトが毎フレーム走る値を動かすとカクつく） */
  @keyframes logoIn{
    0%  { opacity:0; transform:translateY(40px) scale(.9); filter:blur(8px); }
    100%{ opacity:1; transform:translateY(0)    scale(1);  filter:blur(0); }
  }
  /* シャイン: 左→右へ一方向に流し、文字の外に出てから見えないまま先頭へ戻る
     （往復させると光が行って帰ってくる不自然な動きになる） */
  @keyframes logoShine{
    0%   { background-position:150% 0; }
    55%  { background-position:-50% 0; }
    100% { background-position:-50% 0; }
  }
  /* 縦長（スマホ）は見出しが画面の中ほどから始まるので、さらに上へ */
  @media (max-aspect-ratio:1/1){
    .mark{margin-bottom:34vh;}
    .glow{top:calc(50% - 17vh);}
  }
  @media (prefers-reduced-motion:reduce){
    .mark,.glow{animation:none;}
  }

<body>
<div class="hero">
  <div class="glow"></div>
  <h1 class="mark" role="img" aria-label="xMOTION"></h1>
</div>
</body>
