<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GREEN×EXPO 2027 什器3Dエディター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2b26; --ink-soft:#4a5750;
    --paper:#f6f4ee; --paper-2:#ffffff;
    --line:#d8d4c6;
    --forest:#2e5c4c; --forest-deep:#1c3e33;
    --gold:#b8912f;
  }
  *{box-sizing:border-box; margin:0;}
  html,body{height:100%;}
  body{
    font-family:'Noto Sans JP',sans-serif; color:var(--ink);
    background:var(--paper); overflow:hidden;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:20px;
    padding:10px 20px; border-bottom:1px solid var(--line);
    background:var(--paper-2);
    flex-wrap:wrap;
  }
  header h1{
    font-family:'Noto Serif JP',serif; font-size:17px; color:var(--forest-deep);
    letter-spacing:.02em; white-space:nowrap;
  }
  header h1 small{ display:block; font-family:'Noto Sans JP'; font-size:10px; color:var(--gold); letter-spacing:.16em; font-weight:600; }
  .fixtabs{ display:flex; gap:6px; flex:1; min-width:0; }
  .fixtab{
    font:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
    padding:8px 14px; border-radius:999px; border:1px solid var(--line);
    background:transparent; color:var(--ink-soft); white-space:nowrap;
    transition:all .15s;
  }
  .fixtab:hover{ border-color:var(--forest); color:var(--forest); }
  .fixtab.on{ background:var(--forest); border-color:var(--forest); color:#fff; }

  main{ flex:1; display:flex; min-height:0; }
  aside{
    width:280px; overflow-y:auto; background:var(--paper-2);
    border-right:1px solid var(--line); padding:16px;
  }
  aside.right{ width:320px; border-right:none; border-left:1px solid var(--line); }

  .osec{ margin-bottom:22px; }
  .osec h3{
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--forest); font-weight:600; margin-bottom:10px;
    padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .osec h4{ font-size:12px; color:var(--ink-soft); margin:12px 0 6px; font-weight:600; }
  .onote{ font-size:11px; color:var(--ink-soft); margin-top:6px; }

  .choices{ display:flex; flex-direction:column; gap:6px; }
  .choice{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:8px 12px; border:1px solid var(--line); border-radius:6px;
    font-size:12.5px; cursor:pointer; transition:all .12s;
  }
  .choice:hover{ border-color:var(--forest); }
  .choice.on{ border-color:var(--forest); background:rgba(46,92,76,.07); font-weight:600; }
  .choice em{ font-style:normal; font-size:11.5px; color:var(--gold); font-weight:600; white-space:nowrap; }

  .checkrow{
    display:flex; align-items:center; gap:10px;
    padding:8px 10px; border:1px solid var(--line); border-radius:6px;
    margin-bottom:6px; font-size:12.5px; cursor:pointer; transition:all .12s;
  }
  .checkrow:hover{ border-color:var(--forest); }
  .checkrow.on{ border-color:var(--forest); background:rgba(46,92,76,.07); }
  .checkrow input{ accent-color:var(--forest); }
  .ck-label{ flex:1; }
  .ck-label small{ display:block; font-size:10.5px; color:var(--ink-soft); font-weight:400; }
  .checkrow em{ font-style:normal; font-size:11px; color:var(--gold); font-weight:600; white-space:nowrap; }

  .slider-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12px; }
  .sl-label{ width:auto; min-width:16px; color:var(--ink-soft); font-weight:600; }
  .slider-row input{ flex:1; accent-color:var(--forest); min-width:0; }
  .sl-val{ min-width:52px; text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }

  .swatches{ display:flex; gap:8px; }
  .swatch{
    width:34px; height:34px; border-radius:50%; cursor:pointer;
    border:2px solid var(--line); transition:all .12s;
  }
  .swatch.on{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(184,145,47,.35); }

  #viewport{ flex:1; position:relative; min-width:0; }
  #viewport canvas{ display:block; }
  #tooltip{
    position:absolute; pointer-events:none; z-index:5;
    background:rgba(28,62,51,.94); color:#f6f4ee;
    padding:7px 12px; border-radius:6px; font-size:12px;
    display:flex; flex-direction:column; gap:2px;
  }
  #tooltip span{ color:#d8b95c; font-size:11px; }

  .toolbar{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px; z-index:4;
    background:rgba(255,255,255,.92); border:1px solid var(--line);
    border-radius:999px; padding:8px 14px;
    backdrop-filter:blur(6px);
    box-shadow:0 6px 24px rgba(31,43,38,.12);
    flex-wrap:wrap; justify-content:center;
  }
  .tbtn{
    font:inherit; font-size:11.5px; font-weight:600; cursor:pointer;
    padding:6px 12px; border-radius:999px; border:1px solid var(--line);
    background:#fff; color:var(--ink-soft); white-space:nowrap; transition:all .12s;
  }
  .tbtn:hover{ border-color:var(--forest); color:var(--forest); }
  .tbtn.on{ background:var(--forest); border-color:var(--forest); color:#fff; }
  .tb-exp{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-soft); font-weight:600; }
  .tb-exp input{ width:90px; accent-color:var(--forest); }
  .tb-sep{ width:1px; height:20px; background:var(--line); }

  /* 見積パネル */
  .est-head h2{ font-family:'Noto Serif JP',serif; font-size:16px; color:var(--forest-deep); }
  .est-head p{ font-size:11px; color:var(--ink-soft); margin:4px 0 14px; }
  table.bom{ width:100%; border-collapse:collapse; font-size:12px; }
  table.bom td{ padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.bom td small{ display:block; font-size:10px; color:var(--ink-soft); }
  table.bom td.num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; font-weight:500; }
  table.bom tr.hl{ background:rgba(184,145,47,.14); }
  table.bom tr[data-part]{ cursor:default; }
  table.bom tr[data-part]:hover{ background:rgba(46,92,76,.06); }

  .sums{ margin-top:14px; font-size:12.5px; }
  .sums div{ display:flex; justify-content:space-between; padding:5px 0; }
  .sums .total{
    border-top:2px solid var(--forest-deep); margin-top:6px; padding-top:10px;
    font-size:16px; font-weight:700; color:var(--forest-deep);
  }
  .sums .total span:last-child{ font-variant-numeric:tabular-nums; }
  .est-note{ font-size:10.5px; color:var(--ink-soft); margin-top:12px; line-height:1.7; }
  .est-actions{ display:flex; gap:8px; margin-top:14px; }
  .ebtn{
    flex:1; font:inherit; font-size:12px; font-weight:600; cursor:pointer;
    padding:9px 0; border-radius:6px; border:1px solid var(--forest);
    background:var(--forest); color:#fff; transition:background .15s;
  }
  .ebtn:hover{ background:var(--forest-deep); }
  .ebtn.ghost{ background:transparent; color:var(--forest); }
  .ebtn.ghost:hover{ background:rgba(46,92,76,.08); }

  @media (max-width:1100px){
    aside{ width:240px; }
    aside.right{ width:270px; }
  }
</style>
</head>
<body>

<header>
  <h1><small>GREEN × EXPO 2027</small>展示什器 3Dエディター</h1>
  <div class="fixtabs">
    <button class="fixtab" data-fx="carbon">01 カーボン</button>
    <button class="fixtab" data-fx="quiz">02 クイズ</button>
    <button class="fixtab" data-fx="water">03 水運び</button>
    <button class="fixtab" data-fx="wall">04 ウォール</button>
    <button class="fixtab" data-fx="animal">05 アニマル</button>
    <button class="fixtab" data-fx="dark">06 ダーク</button>
    <button class="fixtab" data-fx="orbit">07 オービット</button>
  </div>
  <button class="tbtn" id="btnReset">初期構成に戻す</button>
</header>

<main>
  <aside id="options"></aside>

  <div id="viewport">
    <div id="tooltip" hidden></div>
    <div class="toolbar">
      <button class="tbtn on" id="btnPreview">動作プレビュー</button>
      <span class="tb-exp">分解 <input type="range" id="explodeRange" min="0" max="100" value="0"></span>
      <button class="tbtn" id="btnDims">寸法</button>
      <button class="tbtn" id="btnRot">自動回転</button>
      <span class="tb-sep"></span>
      <button class="tbtn" id="btnViewIso">全景</button>
      <button class="tbtn" id="btnViewBack">背面</button>
      <button class="tbtn" id="btnViewFront">正面</button>
      <button class="tbtn" id="btnViewSide">側面</button>
      <button class="tbtn" id="btnViewTop">俯瞰</button>
      <span class="tb-sep"></span>
      <button class="tbtn" id="btnShot">PNG保存</button>
      <button class="tbtn" id="btnShot4">4面PNG一括</button>
    </div>
  </div>

  <aside class="right">
    <div class="est-head">
      <h2 id="estTitle">—</h2>
      <p id="estClient">—</p>
    </div>
    <table class="bom"><tbody id="bomBody"></tbody></table>
    <div class="sums">
      <div><span>1台あたり小計</span><span id="sumUnit">—</span></div>
      <div><span>台数計</span><span id="sumQty">—</span></div>
      <div><span>設計・デザイン費(15%)</span><span id="sumDesign">—</span></div>
      <div><span>運搬・施工費</span><span id="sumInstall">—</span></div>
      <div><span>消費税(10%)</span><span id="sumTax">—</span></div>
      <div class="total"><span>概算合計(税込)</span><span id="sumTotal">—</span></div>
    </div>
    <p class="est-note">※ 単価は一般的な展示什器の概算レンジによる参考値です。仕様確定時は実見積をご依頼ください。パーツにカーソルを合わせると3Dモデル上でハイライトされます。</p>
    <div class="est-actions">
      <button class="ebtn" id="btnCsv">見積CSV出力</button>
    </div>
  </aside>
</main>
