<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink on White</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#ffffff;overflow:hidden}
#ink{
  position:fixed;inset:0;
  width:100%;height:100%;
  display:block;
  touch-action:none;
  pointer-events:none;
  cursor:none;
}
html,body{cursor:none}
</style>
</head>
<body>
<canvas id="ink"></canvas>

<script>
// Ink stirring simulation — WebGL2 port of the vgpu/WebGPU "fluid" example
// (pressure-projected Navier-Stokes solver with dye advection), re-shaded as
// ink pigments settling into washi paper. The math, constants and pass order
// mirror the WebGPU original 1:1 so the look is identical, but it runs on
// WebGL2 (EXT_color_buffer_float), i.e. in the same browsers as the rest of
// the site — no WebGPU required.
//
// Dye channels carry pigment amounts, not RGB: r = yellow ink, g = blue ink,
// b = green ink, a = red ink. Display converts pigment density to color with
// Beer-Lambert absorption against paper white, so overlapping inks mix
// subtractively the way real ink does.
'use strict';

const GRID = [128, 72];
const DYE = [GRID[0] * 4, GRID[1] * 4];

const canvas = document.getElementById('ink');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) throw new Error('WebGL2 unavailable');
if (!gl.getExtension('EXT_color_buffer_float')) throw new Error('EXT_color_buffer_float unavailable');

/* ---------- shader plumbing ---------- */
const VS = `#version 300 es
const vec2 P[3] = vec2[3](vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));
void main(){ gl_Position = vec4(P[gl_VertexID], 0., 1.); }`;

const COMMON = `#version 300 es
precision highp float;
precision highp int;
uniform ivec2 uSize;        // このパスの格子サイズ
uniform ivec2 uGridSize;    // 速度格子
uniform ivec2 uDyeSize;     // 染料格子
uniform int  uStep;
uniform float uPointerActive;
uniform vec2 uPointerFrom;
uniform vec2 uPointerTo;
uniform vec2 uPointerVelocity;
uniform vec4 uPointerColor;
uniform vec4 uIdleA;
uniform vec4 uIdleB;
uniform vec4 uIdleC;
uniform vec4 uIdleD;
out vec4 o;

vec2 cell_uv(ivec2 p, ivec2 size){ return (vec2(p) + 0.5) / vec2(size); }

float segment_weight(vec2 p, vec2 a, vec2 b, float radius_squared, float aspect){
  vec2 scale = vec2(aspect, 1.0);
  vec2 point = p * scale;
  vec2 origin = a * scale;
  vec2 delta = (b - a) * scale;
  float t = clamp(dot(point - origin, delta) / max(dot(delta, delta), 1e-7), 0.0, 1.0);
  vec2 d = point - (origin + t * delta);
  return exp(-dot(d, d) / radius_squared);
}

float emitter_weight(vec2 p, vec4 emitter, float aspect){
  vec2 d = (p - emitter.xy) * vec2(aspect, 1.0);
  return exp(-dot(d, d) / emitter.w) * emitter.z;
}
`;

// index_of と同じ端クランプの texelFetch
const FETCH = `
vec4 fetchc(sampler2D t, ivec2 p, ivec2 size){
  return texelFetch(t, clamp(p, ivec2(0), size - 1), 0);
}
vec4 bilerp(sampler2D t, vec2 p, ivec2 size){
  vec2 coord = clamp(p * vec2(size) - 0.5, vec2(0), vec2(size) - 1.0);
  ivec2 cell = ivec2(floor(coord));
  vec2 f = fract(coord);
  vec4 b0 = mix(fetchc(t, cell, size),               fetchc(t, cell + ivec2(1,0), size), f.x);
  vec4 b1 = mix(fetchc(t, cell + ivec2(0,1), size),  fetchc(t, cell + ivec2(1,1), size), f.x);
  return mix(b0, b1, f.y);
}
`;

const ADVECT_VELOCITY = COMMON + `uniform sampler2D uSrc;` + FETCH + `
void main(){
  ivec2 cell = ivec2(gl_FragCoord.xy);
  vec2 p = cell_uv(cell, uGridSize);
  float aspect = float(uGridSize.x) / float(uGridSize.y);
  float dt = 1.0 / 60.0;
  vec2 source_velocity = fetchc(uSrc, cell, uGridSize).xy;
  vec2 backtrace = clamp(p - dt * source_velocity, 0.5 / vec2(uGridSize), 1.0 - 0.5 / vec2(uGridSize));
  vec2 velocity = 0.98 * bilerp(uSrc, backtrace, uGridSize).xy;

  float weight_a = emitter_weight(p, uIdleA, aspect);
  float weight_b = emitter_weight(p, uIdleB, aspect);
  float weight_c = emitter_weight(p, uIdleC, aspect);
  float weight_d = emitter_weight(p, uIdleD, aspect);
  float time = float(uStep) / 60.0;
  vec2 tangent_a = vec2(0.28 * 0.73 * cos(0.73 * time), 0.22 * 1.09 * cos(1.09 * time + 0.4));
  vec2 tangent_b = vec2(0.26 * 0.61 * cos(0.61 * time + 3.14159265), 0.24 * 0.97 * cos(0.97 * time + 2.1));
  vec2 tangent_c = vec2(0.24 * 0.53 * cos(0.53 * time + 1.3), 0.26 * 0.83 * cos(0.83 * time + 4.0));
  vec2 tangent_d = vec2(0.27 * 0.43 * cos(0.43 * time + 2.6), 0.21 * 1.19 * cos(1.19 * time + 5.1));
  velocity += dt * (weight_a * (2.6 * tangent_a + 2.0 * vec2(-tangent_a.y, tangent_a.x))
                  + weight_b * (2.6 * tangent_b - 2.0 * vec2(-tangent_b.y, tangent_b.x))
                  + weight_c * (2.6 * tangent_c + 2.0 * vec2(-tangent_c.y, tangent_c.x))
                  + weight_d * (2.6 * tangent_d - 2.0 * vec2(-tangent_d.y, tangent_d.x)));

  if (uPointerActive > 0.0) {
    float weight = segment_weight(p, uPointerFrom, uPointerTo, 0.0035, aspect);
    velocity += weight * uPointerVelocity * 1.15;
  }

  float speed = length(velocity);
  if (speed > 2.5) { velocity *= 2.5 / speed; }
  o = vec4(velocity, 0., 1.);
}`;

const CURL = COMMON + `uniform sampler2D uVel;` + FETCH + `
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  float left   = fetchc(uVel, p - ivec2(1,0), uGridSize).y;
  float right  = fetchc(uVel, p + ivec2(1,0), uGridSize).y;
  float top    = fetchc(uVel, p + ivec2(0,1), uGridSize).x;
  float bottom = fetchc(uVel, p - ivec2(0,1), uGridSize).x;
  o = vec4(0.5 * (right - left - top + bottom), 0., 0., 1.);
}`;

const VORTICITY = COMMON + `uniform sampler2D uSrc; uniform sampler2D uCurl;` + FETCH + `
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  float left   = abs(fetchc(uCurl, p - ivec2(1,0), uGridSize).x);
  float right  = abs(fetchc(uCurl, p + ivec2(1,0), uGridSize).x);
  float top    = abs(fetchc(uCurl, p + ivec2(0,1), uGridSize).x);
  float bottom = abs(fetchc(uCurl, p - ivec2(0,1), uGridSize).x);
  float center = fetchc(uCurl, p, uGridSize).x;

  vec2 force = 0.5 * vec2(top - bottom, right - left);
  force /= length(force) + 0.0001;
  force *= 20.0 * center;
  force.y *= -1.0;

  vec2 velocity = fetchc(uSrc, p, uGridSize).xy + force / 60.0;
  float speed = length(velocity);
  if (speed > 2.5) { velocity *= 2.5 / speed; }
  o = vec4(velocity, 0., 1.);
}`;

const DIVERGENCE = COMMON + `uniform sampler2D uVel;` + FETCH + `
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  ivec2 last = uGridSize - 1;
  float l = p.x == 0      ? 0.0 : fetchc(uVel, p - ivec2(1,0), uGridSize).x;
  float r = p.x == last.x ? 0.0 : fetchc(uVel, p + ivec2(1,0), uGridSize).x;
  float b = p.y == 0      ? 0.0 : fetchc(uVel, p - ivec2(0,1), uGridSize).y;
  float t = p.y == last.y ? 0.0 : fetchc(uVel, p + ivec2(0,1), uGridSize).y;
  o = vec4((r - l) * .5 * float(uGridSize.x) + (t - b) * .5 * float(uGridSize.y), 0., 0., 1.);
}`;

const PRESSURE = COMMON + `uniform sampler2D uSrc; uniform sampler2D uDiv; uniform float uDecay;` + FETCH + `
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  float center = fetchc(uSrc, p, uGridSize).x;
  ivec2 last = uGridSize - 1;
  float left   = (p.x == 0      ? center : fetchc(uSrc, p - ivec2(1,0), uGridSize).x) * uDecay;
  float right  = (p.x == last.x ? center : fetchc(uSrc, p + ivec2(1,0), uGridSize).x) * uDecay;
  float bottom = (p.y == 0      ? center : fetchc(uSrc, p - ivec2(0,1), uGridSize).x) * uDecay;
  float top    = (p.y == last.y ? center : fetchc(uSrc, p + ivec2(0,1), uGridSize).x) * uDecay;
  float wx = float(uGridSize.x * uGridSize.x);
  float wy = float(uGridSize.y * uGridSize.y);
  float divergence = fetchc(uDiv, p, uGridSize).x;
  o = vec4(((left + right) * wx + (bottom + top) * wy - divergence) / (2.0 * wx + 2.0 * wy), 0., 0., 1.);
}`;

const PROJECT = COMMON + `uniform sampler2D uSrc; uniform sampler2D uPr;` + FETCH + `
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  ivec2 last = uGridSize - 1;
  float c = fetchc(uPr, p, uGridSize).x;
  float l = p.x == 0      ? c : fetchc(uPr, p - ivec2(1,0), uGridSize).x;
  float r = p.x == last.x ? c : fetchc(uPr, p + ivec2(1,0), uGridSize).x;
  float b = p.y == 0      ? c : fetchc(uPr, p - ivec2(0,1), uGridSize).x;
  float t = p.y == last.y ? c : fetchc(uPr, p + ivec2(0,1), uGridSize).x;
  vec2 u = fetchc(uSrc, p, uGridSize).xy - vec2(
    (r - l) * .5 * float(uGridSize.x),
    (t - b) * .5 * float(uGridSize.y)
  );
  if (p.x == 0      && u.x < 0.0) { u.x = 0.0; }
  if (p.x == last.x && u.x > 0.0) { u.x = 0.0; }
  if (p.y == 0      && u.y < 0.0) { u.y = 0.0; }
  if (p.y == last.y && u.y > 0.0) { u.y = 0.0; }
  float s = length(u);
  if (s > 2.5) { u *= 2.5 / s; }
  o = vec4(u, 0., 1.);
}`;

const ADVECT_DYE = COMMON + `uniform sampler2D uSrc; uniform sampler2D uVel;` + FETCH + `
void main(){
  ivec2 cell = ivec2(gl_FragCoord.xy);
  vec2 p = cell_uv(cell, uDyeSize);
  float aspect = float(uGridSize.x) / float(uGridSize.y);
  vec2 vel = bilerp(uVel, p, uGridSize).xy;
  vec2 backtrace = clamp(p - vel / 60.0, 0.5 / vec2(uDyeSize), 1.0 - 0.5 / vec2(uDyeSize));
  // Slower fade than the reference: ink stains the paper and lingers.
  vec4 color = 0.978 * bilerp(uSrc, backtrace, uDyeSize);

  // Idle droppers feed the brand inks.
  color += vec4(1.0, 0.0, 0.0, 0.0) * emitter_weight(p, uIdleA, aspect) * 0.085;
  color += vec4(0.0, 1.0, 0.0, 0.0) * emitter_weight(p, uIdleB, aspect) * 0.08;
  color += vec4(0.0, 0.0, 1.0, 0.0) * emitter_weight(p, uIdleC, aspect) * 0.08;
  color += vec4(0.0, 0.0, 0.0, 1.0) * emitter_weight(p, uIdleD, aspect) * 0.075;
  if (uPointerActive > 0.0) {
    float weight = segment_weight(p, uPointerFrom, uPointerTo, 0.002, aspect);
    color += uPointerColor * weight * 0.26;
  }

  o = clamp(color, vec4(0), vec4(4));
}`;

const DISPLAY = COMMON + `uniform sampler2D uDye; uniform vec2 uOut;` + FETCH + `
float hashf(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main(){
  vec2 uv = gl_FragCoord.xy / uOut;   // WebGL は原点が左下で、ソルバの +Y と一致する
  vec4 pigment = bilerp(uDye, uv, uDyeSize);

  // Beer-Lambert absorption per ink against paper white.
  // Coefficients are -ln(ink color): yellow #F6C90E, blue #2563EB, green #21A85C, red #D7263D.
  vec3 absorb_yellow = vec3(0.036, 0.238, 2.90);
  vec3 absorb_blue   = vec3(1.93, 0.947, 0.081);
  vec3 absorb_green  = vec3(2.05, 0.417, 1.02);
  vec3 absorb_red    = vec3(0.171, 1.90, 1.43);
  vec3 optical_depth = absorb_yellow * pigment.r
                     + absorb_blue   * pigment.g
                     + absorb_green  * pigment.b
                     + absorb_red    * pigment.a;
  vec3 color = vec3(1.0) * exp(-optical_depth);

  float grain = 0.985 + 0.03 * hashf(floor(gl_FragCoord.xy));
  vec2 duv = uv - 0.5;
  float vignette = 0.94 + 0.06 * pow(max(0.0, 1.0 - dot(duv, duv) * 1.6), 1.5);
  o = vec4(color * grain * vignette, 1.0);
}`;

function makeProgram(fsSrc) {
  function sh(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

function makeTarget(w, h, internal, format) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, internal, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('FBO incomplete');
  return { tex, fb, w, h };
}
function pingPong(w, h, internal) {
  let a = makeTarget(w, h, internal), b = makeTarget(w, h, internal);
  return { get read(){ return a; }, get write(){ return b; }, swap(){ const t = a; a = b; b = t; } };
}

const velocity = pingPong(GRID[0], GRID[1], gl.RG16F);
const pressure = pingPong(GRID[0], GRID[1], gl.R16F);
const dye      = pingPong(DYE[0], DYE[1], gl.RGBA16F);
const divergence = makeTarget(GRID[0], GRID[1], gl.R16F);
const curlT      = makeTarget(GRID[0], GRID[1], gl.R16F);

const progs = {
  advectVelocity: makeProgram(ADVECT_VELOCITY),
  curl: makeProgram(CURL),
  vorticity: makeProgram(VORTICITY),
  divergence: makeProgram(DIVERGENCE),
  pressure: makeProgram(PRESSURE),
  project: makeProgram(PROJECT),
  advectDye: makeProgram(ADVECT_DYE),
  display: makeProgram(DISPLAY),
};

const uCache = new Map();
function U(prog, name) {
  let m = uCache.get(prog);
  if (!m) { m = {}; uCache.set(prog, m); }
  if (!(name in m)) m[name] = gl.getUniformLocation(prog, name);
  return m[name];
}

let inputUniformValues = null;   // 初回描画（ステップ前）用に後で初期化する
function usePass(prog, target, textures) {
  gl.useProgram(prog);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, target ? target.w : canvas.width, target ? target.h : canvas.height);
  gl.uniform2i(U(prog, 'uGridSize'), GRID[0], GRID[1]);
  gl.uniform2i(U(prog, 'uDyeSize'), DYE[0], DYE[1]);
  const iu = inputUniformValues;
  gl.uniform1i(U(prog, 'uStep'), iu.step);
  gl.uniform1f(U(prog, 'uPointerActive'), iu.pointer_active);
  gl.uniform2f(U(prog, 'uPointerFrom'), iu.pointer_from[0], iu.pointer_from[1]);
  gl.uniform2f(U(prog, 'uPointerTo'), iu.pointer_to[0], iu.pointer_to[1]);
  gl.uniform2f(U(prog, 'uPointerVelocity'), iu.pointer_velocity[0], iu.pointer_velocity[1]);
  gl.uniform4f(U(prog, 'uPointerColor'), 0, 0, 0, 0);
  gl.uniform4f(U(prog, 'uIdleA'), iu.idle_a[0], iu.idle_a[1], iu.idle_a[2], iu.idle_a[3]);
  gl.uniform4f(U(prog, 'uIdleB'), iu.idle_b[0], iu.idle_b[1], iu.idle_b[2], iu.idle_b[3]);
  gl.uniform4f(U(prog, 'uIdleC'), iu.idle_c[0], iu.idle_c[1], iu.idle_c[2], iu.idle_c[3]);
  gl.uniform4f(U(prog, 'uIdleD'), iu.idle_d[0], iu.idle_d[1], iu.idle_d[2], iu.idle_d[3]);
  let unit = 0;
  for (const [name, t] of textures) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t.tex);
    gl.uniform1i(U(prog, name), unit);
    unit++;
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- simulation step (パスの順序は WebGPU 版と同一) ---------- */
let step = 0;
let lastInputStep = -1000;

function stepInk(input) {
  if (input && input.active) lastInputStep = step;
  inputUniformValues = inputUniforms(input);

  usePass(progs.advectVelocity, velocity.write, [['uSrc', velocity.read]]);
  velocity.swap();

  usePass(progs.curl, curlT, [['uVel', velocity.read]]);
  usePass(progs.vorticity, velocity.write, [['uSrc', velocity.read], ['uCurl', curlT]]);
  velocity.swap();

  usePass(progs.divergence, divergence, [['uVel', velocity.read]]);
  for (let i = 0; i < 3; i++) {
    gl.useProgram(progs.pressure);
    gl.uniform1f(U(progs.pressure, 'uDecay'), i === 0 ? 0.8 : 1);
    usePass(progs.pressure, pressure.write, [['uSrc', pressure.read], ['uDiv', divergence]]);
    pressure.swap();
  }

  usePass(progs.project, velocity.write, [['uSrc', velocity.read], ['uPr', pressure.read]]);
  velocity.swap();

  usePass(progs.advectDye, dye.write, [['uSrc', dye.read], ['uVel', velocity.read]]);
  dye.swap();
  step++;
  if (input) input.consumeStep();
}

function renderInk() {
  gl.useProgram(progs.display);
  gl.uniform2f(U(progs.display, 'uOut'), canvas.width, canvas.height);
  usePass(progs.display, null, [['uDye', dye.read]]);
}

function inputUniforms(input) {
  const time = step / 60;
  const [a, b, c, d] = idleEmitters(step);
  const ramp = Math.min(1, (step + 1) / 24);
  let pointerVelocity = (input && input.velocity) || [0, 0];
  if (input && input.active && Math.hypot(pointerVelocity[0], pointerVelocity[1]) < 0.02) {
    pointerVelocity = [0.16 * Math.cos(time * 5), 0.16 * Math.sin(time * 5)];
  }
  return {
    step: step,
    pointer_active: input && input.active ? 1 : 0,
    pointer_from: (input && input.from) || [0.5, 0.5],
    pointer_to: (input && input.to) || [0.5, 0.5],
    pointer_velocity: pointerVelocity,
    idle_a: [a[0], a[1], ramp, 0.006],
    idle_b: [b[0], b[1], ramp, 0.0055],
    idle_c: [c[0], c[1], ramp, 0.0058],
    idle_d: [d[0], d[1], ramp, 0.0056],
  };
}

function idleEmitters(s) {
  const t = s / 60;
  return [
    [0.5 + 0.28 * Math.sin(0.73 * t), 0.5 + 0.22 * Math.sin(1.09 * t + 0.4)],
    [0.5 + 0.26 * Math.sin(0.61 * t + Math.PI), 0.5 + 0.24 * Math.sin(0.97 * t + 2.1)],
    [0.5 + 0.24 * Math.sin(0.53 * t + 1.3), 0.5 + 0.26 * Math.sin(0.83 * t + 4.0)],
    [0.5 + 0.27 * Math.sin(0.43 * t + 2.6), 0.5 + 0.21 * Math.sin(1.19 * t + 5.1)],
  ];
}

/* ---------- 自動かき混ぜ（WebGPU版と同一） ---------- */
function createAutoStir() {
  let s = 0;
  const dt = 1 / 60;
  const pointAt = (time) => {
    const centerX = 0.50 + 0.035 * Math.sin(time * 0.17) + 0.012 * Math.sin(time * 0.41);
    const centerY = 0.50 + 0.030 * Math.cos(time * 0.21) + 0.010 * Math.sin(time * 0.37);
    const radiusX = 0.205 + 0.030 * Math.sin(time * 0.13);
    const radiusY = 0.165 + 0.024 * Math.cos(time * 0.11);
    const angle = 0.72 * time + 0.16 * Math.sin(time * 0.23);
    return [centerX + radiusX * Math.cos(angle), centerY + radiusY * Math.sin(angle)];
  };
  const state = () => {
    const time = s * dt;
    const from = pointAt(Math.max(0, time - dt));
    const to = pointAt(time);
    const velocity = [
      Math.max(-2.5, Math.min(2.5, (to[0] - from[0]) / dt * 1.35)),
      Math.max(-2.5, Math.min(2.5, (to[1] - from[1]) / dt * 1.35)),
    ];
    return { from, to, velocity };
  };
  return {
    get active() { return true; },
    get from() { return state().from; },
    get to() { return state().to; },
    get velocity() { return state().velocity; },
    consumeStep() { s++; },
  };
}

/* ---------- bootstrap ---------- */
const FIXED_STEP = 1 / 60;
const input = createAutoStir();
inputUniformValues = inputUniforms(null);   // ステップ前の描画でも uniforms が揃っているように

function resize() {
  const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  const w = Math.floor(canvas.clientWidth * dpr) || 1;
  const h = Math.floor(canvas.clientHeight * dpr) || 1;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
window.addEventListener('resize', resize);
resize();

let accumulator = 0;
let previous = performance.now();
function tick(now) {
  if (!document.hidden) {
    accumulator = Math.min(accumulator + Math.min((now - previous) / 1000, 1 / 30), 3 * FIXED_STEP);
    let steps = 0;
    while (accumulator >= FIXED_STEP && steps < 2) {
      stepInk(input);
      accumulator -= FIXED_STEP;
      steps++;
    }
    if (steps === 2) accumulator = 0;
    resize();
    renderInk();
  }
  previous = now;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
