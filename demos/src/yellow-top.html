import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.min.js";

/* ============================================================
   YELLOW — HP TOP VIEW / Shibuya Station BIM-style digital twin
   interactions: orbit (drag) + zoom (wheel / pinch) only
   ============================================================ */

const D = window.__EMBEDDED_DATA;
const CX = -11920.2, CY = -37931.79;      // EPSG:6677 -> local origin
const SP = 30 * 1.15;                     // vertical spacing per level (slightly exploded)
const FLOOR_KEYS = ["B5", "B4", "B3", "B2", "B1", "0", "1", "2", "3"];
const KEY_LEVEL = { B5: -5, B4: -4, B3: -3, B2: -2, B1: -1, 0: 0, 1: 1, 2: 2, 3: 3 };
const LEVELS = FLOOR_KEYS.map(k => KEY_LEVEL[k]);
const levelLabel = l => (l >= 0 ? `${l + 1}F` : `B${-l}`);

/* ---------- palette (neon point-cloud night look, from the first prototype) ---------- */
const COL = {
  fog: 0x04060c,
  fill: 0x0a1018,
  highlight: 0xffd21c,
  building: 0x46597a,
  outline: 0xd166ff,
  network: 0x00e5ff,
  networkNode: 0x9ff3ff,
};
const LEVEL_COLORS = {
  3: 0xff9db1, 2: 0xffc36e, 1: 0xffe66e, 0: 0x7ef0ff,
  "-1": 0x7fb2ff, "-2": 0xb48dff, "-3": 0xff8df0, "-4": 0x9dffb0, "-5": 0xffa26e,
};

/* ---------- renderer / scene / camera ---------- */
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(COL.fog, 1900, 5200);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 2, 24000);
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xcfdcf0, 0x141821, 0.85));
const sun = new THREE.DirectionalLight(0xeef3fb, 1.1);
sun.position.set(600, 1100, -400);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8fa8cc, 0.3);
fill.position.set(-500, 300, 700);
scene.add(fill);

/* model root — scale.y animates the "2D plan -> 3D model" extrusion intro */
const model = new THREE.Group();
scene.add(model);

/* ---------- geometry helpers ---------- */
const rotX = new THREE.Matrix4().makeRotationX(-Math.PI / 2);

function ringToPath(ring, Cls) {
  const p = new Cls();
  ring.forEach(([x, y], i) => (i === 0 ? p.moveTo(x - CX, y - CY) : p.lineTo(x - CX, y - CY)));
  p.closePath();
  return p;
}
function polygonGeometry(rings, depth) {
  if (!rings[0] || rings[0].length < 4) return null;
  const shape = ringToPath(rings[0], THREE.Shape);
  for (let r = 1; r < rings.length; r++)
    if (rings[r].length >= 4) shape.holes.push(ringToPath(rings[r], THREE.Path));
  try {
    const g = new THREE.ExtrudeGeometry(shape, { steps: 1, depth, bevelEnabled: false });
    g.applyMatrix4(rotX);
    return g;
  } catch {
    return null;
  }
}
function mergeGeometries(geos) {
  let count = 0;
  geos.forEach(g => (count += g.attributes.position.count));
  const pos = new Float32Array(count * 3);
  const nor = new Float32Array(count * 3);
  let off = 0;
  geos.forEach(g => {
    pos.set(g.attributes.position.array, off);
    nor.set(g.attributes.normal.array, off);
    off += g.attributes.position.count * 3;
    g.dispose();
  });
  const m = new THREE.BufferGeometry();
  m.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  m.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
  return m;
}
function featurePolygons(fc) {
  const out = [];
  fc.features.forEach(f => {
    const g = f.geometry;
    if (!g) return;
    if (g.type === "Polygon") out.push(g.coordinates);
    else if (g.type === "MultiPolygon") g.coordinates.forEach(c => out.push(c));
  });
  return out;
}

/* ---------- build-time frame yield (keeps the tab responsive) ---------- */
const tick = () => new Promise(r => requestAnimationFrame(r));

/* ---------- area-weighted surface sampling (LiDAR-like point cloud) ---------- */
function sampleSurface(geo, density, cap) {
  const pos = geo.attributes.position.array;
  const triCount = pos.length / 9;
  const cum = new Float32Array(triCount);
  let total = 0;
  for (let i = 0; i < triCount; i++) {
    const o = i * 9;
    const abx = pos[o + 3] - pos[o], aby = pos[o + 4] - pos[o + 1], abz = pos[o + 5] - pos[o + 2];
    const acx = pos[o + 6] - pos[o], acy = pos[o + 7] - pos[o + 1], acz = pos[o + 8] - pos[o + 2];
    const cx = aby * acz - abz * acy, cy = abz * acx - abx * acz, cz = abx * acy - aby * acx;
    total += 0.5 * Math.sqrt(cx * cx + cy * cy + cz * cz);
    cum[i] = total;
  }
  const count = Math.max(200, Math.min(cap, Math.round(total * density)));
  const out = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = Math.random() * total;
    let lo = 0, hi = triCount - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; cum[m] < r ? (lo = m + 1) : (hi = m); }
    const o = lo * 9;
    let u = Math.random(), v = Math.random();
    if (u + v > 1) { u = 1 - u; v = 1 - v; }
    out[i * 3]     = pos[o]     + (pos[o + 3] - pos[o])     * u + (pos[o + 6] - pos[o])     * v;
    out[i * 3 + 1] = pos[o + 1] + (pos[o + 4] - pos[o + 1]) * u + (pos[o + 7] - pos[o + 1]) * v;
    out[i * 3 + 2] = pos[o + 2] + (pos[o + 5] - pos[o + 2]) * u + (pos[o + 8] - pos[o + 2]) * v;
  }
  return out;
}

/* ---------- station floors ---------- */
const levelEntries = []; // { level, group, baseY, mats:[], edgeMat, mix }

function buildLevel(key) {
  const level = KEY_LEVEL[key];
  const group = new THREE.Group();
  const baseY = level * SP;
  group.position.y = baseY;
  model.add(group);

  const baseColor = new THREE.Color(LEVEL_COLORS[level] ?? 0x7fb2ff);
  const fillMat = new THREE.MeshBasicMaterial({ color: COL.fill, transparent: true, opacity: 0.38, depthWrite: false });
  const edgeMat = new THREE.LineBasicMaterial({
    color: baseColor.clone(), transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const pointMat = new THREE.PointsMaterial({
    color: baseColor.clone(), size: 1.2, map: dotTexture, sizeAttenuation: true,
    transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false,
  });

  const clouds = [];
  const kinds = [
    { fc: D[`./data/ShibuyaTerminal/ShibuyaTerminal_${key}_Space.geojson`], depth: 5, density: 0.16, cap: 11000 },
    { fc: D[`./data/ShibuyaTerminal/ShibuyaTerminal_${key}_Floor.geojson`], depth: 0.5, density: 0.1, cap: 6000 },
  ];
  kinds.forEach(({ fc, depth, density, cap }) => {
    if (!fc) return;
    const geos = featurePolygons(fc).map(r => polygonGeometry(r, depth)).filter(Boolean);
    if (!geos.length) return;
    const merged = mergeGeometries(geos);
    group.add(new THREE.Mesh(merged, fillMat));
    group.add(new THREE.LineSegments(new THREE.EdgesGeometry(merged, 25), edgeMat));
    clouds.push(sampleSurface(merged, density, cap));
  });
  if (clouds.length) {
    const n = clouds.reduce((t, c) => t + c.length, 0);
    const all = new Float32Array(n);
    let off = 0;
    clouds.forEach(c => { all.set(c, off); off += c.length; });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(all, 3));
    group.add(new THREE.Points(geo, pointMat));
  }

  levelEntries.push({ level, group, baseY, baseColor, pointMat, edgeMat, mix: 0 });
}

/* ---------- pedestrian network (cyan neon layer; flow particles stay station-focused) ---------- */
const NET_R2 = 480 * 480;
const nearStation = (x, z) => x * x + z * z < NET_R2;

function buildNetwork() {
  const ords = new Map();
  const nodePos = [];
  D["./data/nw/Shibuya_node.geojson"].features.forEach(f => {
    const o = f.properties.ordinal ?? 0;
    ords.set(f.properties.node_id, o);
    const [x, y] = f.geometry.coordinates;
    const px = x - CX, pz = -(y - CY);
    nodePos.push(px, o * SP + 1.6, pz);
  });

  const seg = [];
  D["./data/nw/Shibuya_link.geojson"].features.forEach(f => {
    const cs = f.geometry.coordinates;
    const a = ords.get(f.properties.start_id);
    const b = ords.get(f.properties.end_id);
    const pts = cs.map((c, i) => {
      let o;
      if (a == null && b == null) o = 0;
      else if (a != null && b == null) o = a;
      else if (a == null) o = b;
      else if (i === 0) o = a;
      else if (i === cs.length - 1 || a === b) o = b;
      else o = (a + b) / 2;
      return [c[0] - CX, o * SP + 1.6, -(c[1] - CY)];
    });
    for (let i = 0; i < pts.length - 1; i++) seg.push(...pts[i], ...pts[i + 1]);
    if (pts.length >= 2 && pts.every(p => nearStation(p[0], p[2]))) registerFlowLink(netFlowLinks, pts.flat());
  });

  const lineGeo = new THREE.BufferGeometry();
  lineGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(seg), 3));
  model.add(new THREE.LineSegments(
    lineGeo,
    new THREE.LineBasicMaterial({
      color: COL.network, transparent: true, opacity: 0.26,
      blending: THREE.AdditiveBlending, depthWrite: false,
    })
  ));

  const ptGeo = new THREE.BufferGeometry();
  ptGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(nodePos), 3));
  model.add(new THREE.Points(
    ptGeo,
    new THREE.PointsMaterial({
      color: COL.networkNode, size: 0.8, map: dotTexture, transparent: true, opacity: 0.4,
      blending: THREE.AdditiveBlending, depthWrite: false,
    })
  ));
}

/* ---------- station ground outline ---------- */
function buildOutline() {
  const seg = [];
  D["./data/fg.geojson"].features.forEach(f => {
    const g = f.geometry;
    if (!g) return;
    (g.type === "MultiLineString" ? g.coordinates : [g.coordinates]).forEach(line => {
      for (let i = 0; i < line.length - 1; i++)
        seg.push(
          line[i][0] - CX, 0.4, -(line[i][1] - CY),
          line[i + 1][0] - CX, 0.4, -(line[i + 1][1] - CY)
        );
    });
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(seg), 3));
  model.add(new THREE.LineSegments(
    geo,
    new THREE.LineBasicMaterial({ color: COL.outline, transparent: true, opacity: 0.2, depthWrite: false })
  ));
}

/* ---------- surrounding city (ghost context) ---------- */
async function buildCity() {
  const items = D["./data/urban/buildings.json"];
  const geos = [];
  const CHUNK = 900;
  for (let i = 0; i < items.length; i += CHUNK) {
    items.slice(i, i + CHUNK).forEach(({ h, r }) => {
      if (!r || r.length < 3) return;
      const shape = new THREE.Shape();
      r.forEach(([x, y], j) => (j === 0 ? shape.moveTo(x, y) : shape.lineTo(x, y)));
      shape.closePath();
      try {
        const g = new THREE.ExtrudeGeometry(shape, { steps: 1, depth: h || 8, bevelEnabled: false });
        g.applyMatrix4(rotX);
        geos.push(g);
      } catch { /* skip broken ring */ }
    });
    await tick();
  }
  if (!geos.length) return;
  const merged = mergeGeometries(geos);
  const mesh = new THREE.Mesh(
    merged,
    new THREE.MeshLambertMaterial({ color: COL.building, transparent: true, opacity: 0.3, depthWrite: false })
  );
  mesh.renderOrder = -1;
  model.add(mesh);
}

/* ---------- rail lines (per-operator colors, like the first prototype) ---------- */
function buildRails() {
  const byColor = new Map();
  D["./data/urban/rails.json"].forEach(({ c, lv, p }) => {
    const y = lv === "t" ? -22 : lv === "b" ? 6 : 0.8;
    if (!byColor.has(c)) byColor.set(c, []);
    const seg = byColor.get(c);
    for (let i = 0; i < p.length - 1; i++)
      seg.push(p[i][0], y, -p[i][1], p[i + 1][0], y, -p[i + 1][1]);
    if (p.length >= 2) registerFlowLink(railFlowLinks, p.flatMap(v => [v[0], y, -v[1]]), c);
  });
  byColor.forEach((seg, color) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(seg), 3));
    model.add(new THREE.LineSegments(
      geo,
      new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.5 })
    ));
  });
}

/* ---------- animated data flows (multi-color particles) ---------- */
const netFlowLinks = [];   // pedestrian network near the station
const railFlowLinks = [];  // rail polylines, each with its real line color
const FLOW_COLORS = ["#f5c400", "#00a8c9", "#ff7a3d", "#22b573", "#8a63d2", "#e8488a", "#f5c400"];

function registerFlowLink(list, flat, color = null) {
  const cum = [0];
  for (let i = 3; i < flat.length; i += 3) {
    const dx = flat[i] - flat[i - 3], dy = flat[i + 1] - flat[i - 2], dz = flat[i + 2] - flat[i - 1];
    cum.push(cum[cum.length - 1] + Math.hypot(dx, dy, dz));
  }
  const len = cum[cum.length - 1];
  if (len > 2) list.push({ pts: flat, cum, len, color });
}

const dotTexture = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 30);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.5, "rgba(255,255,255,0.9)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad;
  g.beginPath();
  g.arc(32, 32, 30, 0, Math.PI * 2);
  g.fill();
  return new THREE.CanvasTexture(c);
})();

class FlowSystem {
  // loop=false: respawn on a random link when the end is reached (multi-color swarm)
  // loop=true:  wrap around on the same link, keeping its per-link color (rail comets)
  constructor(links, { count, size, opacity, speedMin, speedMax, colors = null, loop = false }) {
    this.links = links;
    this.speedMin = speedMin;
    this.speedMax = speedMax;
    this.loop = loop;
    this.count = count;
    const cdf = [];
    let acc = 0;
    links.forEach(l => { acc += l.len; cdf.push(acc); });
    this.cdf = cdf;
    this.total = acc;
    this.pos = new Float32Array(count * 3);
    const col = new Float32Array(count * 3);
    const c = new THREE.Color();
    this.parts = new Array(count);
    for (let i = 0; i < count; i++) {
      const p = this.spawn();
      this.parts[i] = p;
      c.set(colors ? colors[(Math.random() * colors.length) | 0] : links[p.li].color || "#888");
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    const geo = new THREE.BufferGeometry();
    this.attr = new THREE.BufferAttribute(this.pos, 3);
    this.attr.setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute("position", this.attr);
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    this.obj = new THREE.Points(geo, new THREE.PointsMaterial({
      size, map: dotTexture, vertexColors: true, transparent: true,
      opacity, depthWrite: false, blending: THREE.AdditiveBlending,
    }));
    model.add(this.obj);
  }
  pickLink() {
    const r = Math.random() * this.total;
    let lo = 0, hi = this.cdf.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; this.cdf[m] < r ? (lo = m + 1) : (hi = m); }
    return lo;
  }
  spawn() {
    const li = this.pickLink();
    return {
      li, d: Math.random() * this.links[li].len,
      dir: Math.random() < 0.5 ? -1 : 1,
      speed: this.speedMin + Math.random() * (this.speedMax - this.speedMin),
    };
  }
  update(dt) {
    for (let i = 0; i < this.count; i++) {
      let p = this.parts[i];
      let l = this.links[p.li];
      p.d += p.dir * p.speed * dt;
      if (p.d < 0 || p.d > l.len) {
        if (this.loop) {
          p.d = p.d < 0 ? l.len : 0;
        } else {
          const np = this.spawn();
          np.speed = p.speed;
          this.parts[i] = p = np;
          l = this.links[p.li];
        }
      }
      const { pts, cum } = l;
      let s = 0;
      while (s < cum.length - 2 && cum[s + 1] < p.d) s++;
      const t = (p.d - cum[s]) / (cum[s + 1] - cum[s] || 1);
      const a = s * 3, b = a + 3;
      this.pos[i * 3] = pts[a] + (pts[b] - pts[a]) * t;
      this.pos[i * 3 + 1] = pts[a + 1] + (pts[b + 1] - pts[a + 1]) * t;
      this.pos[i * 3 + 2] = pts[a + 2] + (pts[b + 2] - pts[a + 2]) * t;
    }
    this.attr.needsUpdate = true;
  }
}

const flowSystems = [];
function buildFlows() {
  if (netFlowLinks.length)
    flowSystems.push(new FlowSystem(netFlowLinks, {
      count: 850, size: 4.4, opacity: 0.95, speedMin: 9, speedMax: 24, colors: FLOW_COLORS,
    }));
  if (railFlowLinks.length)
    flowSystems.push(new FlowSystem(railFlowLinks, {
      count: 300, size: 7, opacity: 0.9, speedMin: 60, speedMax: 140, loop: true,
    }));
}

/* ---------- autonomous cinematic hero camera ---------- */
const TARGET = new THREE.Vector3(0, -0.6 * SP, 0);
const BASE_TARGET = new THREE.Vector3(0, -0.6 * SP, 0);
const view = { theta: -2.45, phi: 1.02, radius: 820 };
const goal = { theta: -2.45, phi: 1.02, radius: 820 };
let introT0 = null, introDone = false, autoElapsed = 0;

// Hero motion: slow side-to-side camera trucking with a very small orbital drift.
// All curves are periodic, so the autonomous section loops without a jump.
const HERO = {
  period: 16.0,       // seconds per full loop
  lateral: 220,       // left/right travel
  depth: 50,          // subtle forward/back drift
  thetaAmp: 0.10,     // slight yaw variation
  phiAmp: 0.025,      // slight elevation variation
  radiusAmp: 26       // subtle breathing zoom
};

function finishIntro() {
  if (introDone) return;
  introDone = true;
  model.scale.y = 1;
  autoElapsed = 0;
}

function updateHeroCamera(dt) {
  autoElapsed += dt;
  const p = (autoElapsed / HERO.period) * Math.PI * 2;

  // Move the focal point horizontally so the scene glides across the hero.
  TARGET.x = BASE_TARGET.x + Math.sin(p) * HERO.lateral;
  TARGET.z = BASE_TARGET.z + Math.sin(p * 2) * HERO.depth;

  goal.theta = -2.45 + Math.sin(p + Math.PI * 0.25) * HERO.thetaAmp;
  goal.phi = 1.02 + Math.sin(p * 2 + Math.PI * 0.35) * HERO.phiAmp;
  goal.radius = 820 + Math.cos(p) * HERO.radiusAmp;

  const k = Math.min(1, dt * 2.4);
  view.theta += (goal.theta - view.theta) * k;
  view.phi += (goal.phi - view.phi) * k;
  view.radius += (goal.radius - view.radius) * k;
}

function applyCamera() {
  camera.position.set(
    TARGET.x + view.radius * Math.sin(view.phi) * Math.sin(view.theta),
    TARGET.y + view.radius * Math.cos(view.phi),
    TARGET.z + view.radius * Math.sin(view.phi) * Math.cos(view.theta)
  );
  camera.lookAt(TARGET);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- floor scan (yellow highlight sweep) ---------- */
let scanIdx = LEVELS.indexOf(0), scanTimer = 0;
const SCAN_PERIOD = 3.4;

const cHighlight = new THREE.Color(COL.highlight);

function updateScan(dt) {
  if (!introDone) return;
  scanTimer += dt;
  if (scanTimer >= SCAN_PERIOD) {
    scanTimer = 0;
    scanIdx = (scanIdx + 1) % LEVELS.length;
  }
  const active = LEVELS[scanIdx];
  levelEntries.forEach(en => {
    const t = active === en.level ? 1 : 0;
    en.mix += (t - en.mix) * Math.min(1, dt * 5);
    if (en.mix < 0.004 && t === 0) return;
    en.pointMat.color.lerpColors(en.baseColor, cHighlight, en.mix);
    en.edgeMat.color.lerpColors(en.baseColor, cHighlight, en.mix);
    en.pointMat.opacity = 0.55 + en.mix * 0.35;
    en.edgeMat.opacity = 0.3 + en.mix * 0.4;
    en.group.position.y = en.baseY + en.mix * 4;
  });
}

/* ---------- intro: top-down plan -> extruded 3D axonometric ---------- */
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const INTRO = { theta0: -3.25, phi0: 0.09, r0: 1500, ms: 3000 };

function updateIntro(now) {
  if (introDone) return;
  if (introT0 === null) introT0 = now;
  const t = Math.min(1, (now - introT0) / INTRO.ms);
  const e = easeInOut(t);
  view.theta = goal.theta = INTRO.theta0 + (-2.45 - INTRO.theta0) * e;
  view.phi = goal.phi = INTRO.phi0 + (1.02 - INTRO.phi0) * e;
  view.radius = goal.radius = INTRO.r0 + (820 - INTRO.r0) * e;
  model.scale.y = Math.max(0.012, easeOut(Math.min(1, t * 1.25)));
  if (t >= 1) finishIntro();
}

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);

  updateIntro(now);

  if (introDone) {
    updateHeroCamera(dt);
  }
  applyCamera();
  updateScan(dt);
  flowSystems.forEach(f => f.update(dt));
  renderer.render(scene, camera);
}

/* ---------- boot ---------- */
(async () => {
  try {
    for (const key of FLOOR_KEYS) {
      buildLevel(key);
      await tick();
    }
    buildNetwork(); await tick();
    buildOutline(); await tick();
    buildRails(); await tick();
    await buildCity();
    buildFlows();

    model.scale.y = 0.012;
    applyCamera();
    renderer.render(scene, camera);
    canvas.classList.add("show");

    requestAnimationFrame(frame);
  } catch (err) {
    console.error(err);
  }
})();
</script>
