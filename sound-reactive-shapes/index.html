<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound-reactive shapes</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/ui.css" />
</head>

<body class="loading">
  <canvas id="canvas"></canvas>

  <div id="overlay">

    <div id="header">
      <div id="title">Sound-reactive shapes</div>
      <div id="sections">
        <button class="section-tab active" data-section="amplitude">Amplitude</button>
        <button class="section-tab" data-section="history">History</button>
        <button class="section-tab" data-section="frequency">Frequency</button>
        <button class="section-tab" data-section="form">Form</button>
      </div>
    </div>

    <div id="audio-panel">
      <div id="audio-buttons">
        <button class="icon-btn" id="play-btn" title="Play / pause"></button>
        <button class="icon-btn" id="demo-btn">Generated</button>
        <label class="icon-btn" for="file-input">Audio file</label>
        <input type="file" id="file-input" accept="audio/*" />
        <button class="icon-btn" id="mic-btn">Mic</button>
      </div>
      <div class="param-row">
        <span class="param-label">Gain</span>
        <input type="range" id="gain" min="0.3" max="3" step="0.05" value="1" />
        <span class="param-val" id="gain-val">1.00</span>
      </div>
      <div id="audio-status"></div>
    </div>

    <div id="bottom-left">
      <!-- Sliders are rebuilt per deformation mode by main.js -->
      <div id="param-panel"></div>

      <div id="selects">
        <div id="category-row">
          <select id="category-select" class="bar-select">
            <option value="sdf">SDF shapes</option>
            <option value="platonic" selected>Platonic</option>
            <option value="scalar">Scalar fields</option>
            <option value="moving">Moving scalar</option>
          </select>
        </div>
        <div><select id="shape-select" class="bar-select"></select></div>
        <div><select id="mode-select" class="bar-select"></select></div>
        <div>
          <select id="lighting-select" class="bar-select">
            <option value="0" selected>Rim lighting</option>
            <option value="1">Amplitude flash</option>
            <option value="2">Environment map</option>
          </select>
        </div>
      </div>
    </div>

    <div id="bottom-right">
      <div class="panel-heading">Bloom</div>
      <div class="param-row">
        <span class="param-label">Strength</span>
        <input type="range" id="bloom-strength" min="0" max="3" step="0.05" value="0.25" />
        <span class="param-val" id="bloom-strength-val">0.25</span>
      </div>
      <div class="param-row">
        <span class="param-label">Threshold</span>
        <input type="range" id="bloom-threshold" min="0" max="1" step="0.01" value="0.10" />
        <span class="param-val" id="bloom-threshold-val">0.10</span>
      </div>
      <button class="icon-btn" id="aa-btn">4× SSAA</button>
    </div>

  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
