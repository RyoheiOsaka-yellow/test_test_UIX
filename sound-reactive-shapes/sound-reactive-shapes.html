// (https://iquilezles.org/articles/distfunctions/, MIT).
// Every function returns the signed distance from p to the surface.

float sdSphere(vec3 p, float r) {
  return length(p) - r;
}

float sdBox(vec3 p, vec3 b) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

float sdRoundBox(vec3 p, vec3 b, float r) {
  vec3 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r;
}

float sdBoxFrame(vec3 p, vec3 b, float e) {
  p = abs(p) - b;
  vec3 q = abs(p + e) - e;
  return min(min(
    length(max(vec3(p.x, q.y, q.z), 0.0)) + min(max(p.x, max(q.y, q.z)), 0.0),
    length(max(vec3(q.x, p.y, q.z), 0.0)) + min(max(q.x, max(p.y, q.z)), 0.0)),
    length(max(vec3(q.x, q.y, p.z), 0.0)) + min(max(q.x, max(q.y, p.z)), 0.0));
}

float sdTorus(vec3 p, vec2 t) {
  vec2 q = vec2(length(p.xz) - t.x, p.y);
  return length(q) - t.y;
}

// sc is the sin/cos of the aperture half-angle
float sdCappedTorus(vec3 p, vec2 sc, float ra, float rb) {
  p.x = abs(p.x);
  float k = (sc.y * p.x > sc.x * p.y) ? dot(p.xy, sc) : length(p.xy);
  return sqrt(dot(p, p) + ra * ra - 2.0 * ra * k) - rb;
}

float sdLink(vec3 p, float le, float r1, float r2) {
  vec3 q = vec3(p.x, max(abs(p.y) - le, 0.0), p.z);
  return length(vec2(length(q.xy) - r1, q.z)) - r2;
}

// c.xy is the axis offset, c.z the radius
float sdCylinder(vec3 p, vec3 c) {
  return length(p.xz - c.xy) - c.z;
}

// c is the sin/cos of the apex half-angle, h the height
float sdCone(vec3 p, vec2 c, float h) {
  vec2 q = h * vec2(c.x / c.y, -1.0);
  vec2 w = vec2(length(p.xz), p.y);
  vec2 a = w - q * clamp(dot(w, q) / dot(q, q), 0.0, 1.0);
  vec2 b = w - q * vec2(clamp(w.x / q.x, 0.0, 1.0), 1.0);
  float k = sign(q.y);
  float d = min(dot(a, a), dot(b, b));
  float s = max(k * (w.x * q.y - w.y * q.x), k * (w.y - q.y));
  return sqrt(d) * sign(s);

float sdInfiniteCone(vec3 p, vec2 c) {
  vec2 q = vec2(length(p.xz), -p.y);
  float d = length(q - c * max(dot(q, c), 0.0));
  return d * ((q.x * c.y - q.y * c.x < 0.0) ? -1.0 : 1.0);
}

float sdHexPrism(vec3 p, vec2 h) {
  const vec3 k = vec3(-0.8660254, 0.5, 0.57735);
  p = abs(p);
  p.xy -= 2.0 * min(dot(k.xy, p.xy), 0.0) * k.xy;
  vec2 d = vec2(
    length(p.xy - vec2(clamp(p.x, -k.z * h.x, k.z * h.x), h.x)) * sign(p.y - h.x),
    p.z - h.y);
  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));

float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
  vec3 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - r;
}

float sdVerticalCapsule(vec3 p, float h, float r) {

  return length(p) - r;
}

float sdCappedCylinder(vec3 p, float r, float h) {
  vec2 d = abs(vec2(length(p.xz), p.y)) - vec2(r, h);
  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));

// Arbitrarily oriented capped cylinder from a to b
float sdCappedCylinder(vec3 p, vec3 a, vec3 b, float r) {
  vec3 ba = b - a;
  vec3 pa = p - a;
  float baba = dot(ba, ba);
  float paba = dot(pa, ba);
  float x = length(pa * baba - ba * paba) - r * baba;
  float y = abs(paba - baba * 0.5) - baba * 0.5;
  float x2 = x * x;
  float y2 = y * y * baba;
  float d = (max(x, y) < 0.0)
    ? -min(x2, y2)
    : (((x > 0.0) ? x2 : 0.0) + ((y > 0.0) ? y2 : 0.0));

float sdRoundedCylinder(vec3 p, float ra, float rb, float h) {
  vec2 d = vec2(length(p.xz) - 2.0 * ra + rb, abs(p.y) - h);
  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - rb;
}

float sdCappedCone(vec3 p, float h, float r1, float r2) {
  vec2 q = vec2(length(p.xz), p.y);
  vec2 k1 = vec2(r2, h);
  vec2 k2 = vec2(r2 - r1, 2.0 * h);
  vec2 ca = vec2(q.x - min(q.x, (q.y < 0.0) ? r1 : r2), abs(q.y) - h);
  vec2 cb = q - k1 + k2 * clamp(dot(k1 - q, k2) / dot(k2, k2), 0.0, 1.0);
  float s = (cb.x < 0.0 && ca.y < 0.0) ? -1.0 : 1.0;
  return s * sqrt(min(dot(ca, ca), dot(cb, cb)));
}

// Arbitrarily oriented capped cone from a to b
float sdCappedCone(vec3 p, vec3 a, vec3 b, float ra, float rb) {
  float rba = rb - ra;
  float baba = dot(b - a, b - a);
  float papa = dot(p - a, p - a);
  float paba = dot(p - a, b - a) / baba;
  float x = sqrt(max(papa - paba * paba * baba, 0.0));
  float cax = max(0.0, x - ((paba < 0.5) ? ra : rb));
  float cay = abs(paba - 0.5) - 0.5;
  float k = rba * rba + baba;
  float f = clamp((rba * (x - ra) + paba * baba) / k, 0.0, 1.0);
  float cbx = x - ra - f * rba;
  float cby = paba - f;
  float s = (cbx < 0.0 && cay < 0.0) ? -1.0 : 1.0;
  return s * sqrt(min(cax * cax + cay * cay * baba, cbx * cbx + cby * cby * baba));
}

// c is the sin/cos of the cone half-angle, ra the sphere radius
float sdSolidAngle(vec3 p, vec2 c, float ra) {
  vec2 q = vec2(length(p.xz), p.y);
  float l = length(q) - ra;
  float m = length(q - c * clamp(dot(q, c), 0.0, ra));
  return max(l, m * sign(c.y * q.x - c.x * q.y));
}

float sdCutSphere(vec3 p, float r, float h) {
  float w = sqrt(max(r * r - h * h, 0.0));
  vec2 q = vec2(length(p.xz), p.y);
  float s = max((h - r) * q.x * q.x + w * w * (h + r - 2.0 * q.y), h * q.x - w * q.y);
  return (s < 0.0) ? length(q) - r
       : (q.x < w) ? h - q.y
       : length(q - vec2(w, h));
}

float sdCutHollowSphere(vec3 p, float r, float h, float t) {
  float w = sqrt(max(r * r - h * h, 0.0));
  vec2 q = vec2(length(p.xz), p.y);
  return ((h * q.x < w * q.y) ? length(q - vec2(w, h)) : abs(length(q) - r)) - t;
}

float sdDeathStar(vec3 p2, float ra, float rb, float d) {
  float a = (ra * ra - rb * rb + d * d) / (2.0 * d);
  float b = sqrt(max(ra * ra - a * a, 0.0));
  vec2 p = vec2(p2.x, length(p2.yz));
  if (p.x * b - p.y * a > d * max(b - p.y, 0.0)) {
    return length(p - vec2(a, b));
  }
  return max(length(p) - ra, -(length(p - vec2(d, 0.0)) - rb));
}

float sdRoundCone(vec3 p, float r1, float r2, float h) {
  vec2 q = vec2(length(p.xz), p.y);
  float b = (r1 - r2) / h;
  float a = sqrt(max(1.0 - b * b, 0.0));
  float k = dot(q, vec2(-b, a));
  if (k < 0.0) return length(q) - r1;
  if (k > a * h) return length(q - vec2(0.0, h)) - r2;
  return dot(q, vec2(a, b)) - r1;
}

// Arbitrarily oriented round cone from a to b
float sdRoundCone(vec3 p, vec3 a, vec3 b, float r1, float r2) {
  vec3 ba = b - a;
  float l2 = dot(ba, ba);
  float rr = r1 - r2;
  float a2 = l2 - rr * rr;
  float il2 = 1.0 / l2;
  vec3 pa = p - a;
  float y = dot(pa, ba);
  float z = y - l2;
  vec3 w = pa * l2 - ba * y;
  float x2 = dot(w, w);
  float y2 = y * y * l2;
  float z2 = z * z * l2;
  float k = sign(rr) * rr * rr * x2;
  if (sign(z) * a2 * z2 > k) return sqrt(max(x2 + z2, 0.0)) * il2 - r2;
  if (sign(y) * a2 * y2 < k) return sqrt(max(x2 + y2, 0.0)) * il2 - r1;
  return (sqrt(max(x2 * a2 * il2, 0.0)) + y * rr) * il2 - r1;
}

float sdVesicaSegment(vec3 p, vec3 a, vec3 b, float w) {
  vec3 c = (a + b) * 0.5;
  float l = length(b - a);
  vec3 v = (b - a) / l;
  float y = dot(p - c, v);
  vec2 q = vec2(length(p - c - y * v), abs(y));
  float r = 0.5 * l;
  float d = 0.5 * (r * r - w * w) / w;
  vec3 h = (r * q.x < d * (q.y - r))
    ? vec3(0.0, r, 0.0)
    : vec3(-d, 0.0, d + w);
  return length(q - h.xy) - h.z;

float sdRhombus(vec3 p, float la, float lb, float h, float ra) {
  p = abs(p);
  vec2 b = vec2(la, lb);
  float f = clamp((dot(b, b - 2.0 * p.xz)) / dot(b, b), -1.0, 1.0);
  vec2 q = vec2(
    length(p.xz - 0.5 * b * vec2(1.0 - f, 1.0 + f)) *
      sign(p.x * b.y + p.z * b.x - b.x * b.y) - ra,
    p.y - h);
  return min(max(q.x, q.y), 0.0) + length(max(q, 0.0));
}

float sdOctahedron(vec3 p, float s) {
  p = abs(p);
  float m = p.x + p.y + p.z - s;
  vec3 q;
  if      (3.0 * p.x < m) q = p.xyz;
  else if (3.0 * p.y < m) q = p.yzx;
  else if (3.0 * p.z < m) q = p.zxy;

  return length(vec3(q.x, q.y - s + k, q.z - k));

float sdOctahedronFast(vec3 p, float s) {

// functions, so the ray is stepped at a fixed rate and every sign change is
// bisected. Marching is confined to a display sphere so unbounded surfaces
// (paraboloids, gyroids) stay inside a readable volume.
//
// Requires a forward declaration in the including file: float surfaceF(vec3 p);

vec2 raySphere(vec3 ro, vec3 rd, float r) {
  float b = dot(ro, rd);
  float c = dot(ro, ro) - r * r;
  float h = b * b - c;
  if (h < 0.0) return vec2(1.0, -1.0);
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}

vec3 calcNormal(vec3 p) {
  const float eps = 0.002;
  const vec2 k = vec2(1.0, -1.0);
  return normalize(
    k.xyy * surfaceF(p + k.xyy * eps) +
    k.yyx * surfaceF(p + k.yyx * eps) +
    k.yxy * surfaceF(p + k.yxy * eps) +
    k.xxx * surfaceF(p + k.xxx * eps)
  );

const float SPHERE_R   = 1.58;
const float EXT_MARGIN = 1.5;

bool castRay(vec3 ro, vec3 rd, out float t, out vec3 nor) {
  vec2 tb = raySphere(ro, rd, SPHERE_R);
  if (tb.x > tb.y) return false;
  float tMin = max(tb.x, 0.01);
  float tMax = tb.y + EXT_MARGIN;
  float dt   = 0.030;
  t = tMin;
  float prevF = surfaceF(ro + rd * t);
  for (int i = 0; i < 400; i++) {
    t += dt;
    if (t > tMax) return false;
    float F = surfaceF(ro + rd * t);
    if (prevF * F < 0.0) {
      float t0 = t - dt, t1 = t, F0 = prevF;
      for (int j = 0; j < 8; j++) {
        float tm = 0.5 * (t0 + t1);
        float Fm = surfaceF(ro + rd * tm);
        if (F0 * Fm <= 0.0) { t1 = tm; } else { t0 = tm; F0 = Fm; }
      }
      float tHit = 0.5 * (t0 + t1);
      if (length(ro + rd * tHit) <= SPHERE_R) {
        t   = tHit;
        nor = calcNormal(ro + rd * t);
        if (dot(nor, -rd) < 0.0) nor = -nor;

      t     = t1;
      prevF = F;

  "platonic-functions.glsl": `// The five Platonic solids as SDFs, each normalised to circumradius 1 so that
// dual pairs can be cross-faded against each other without a size jump.

const float PHI = 1.61803398875;
const float S3  = 0.57735027;  // 1/sqrt(3)

mat3 rotX(float a) {
  float c = cos(a), s = sin(a);
  return mat3(1.0, 0.0, 0.0,  0.0, c, -s,  0.0, s, c);
}

mat3 rotY(float a) {
  float c = cos(a), s = sin(a);
  return mat3(c, 0.0, s,  0.0, 1.0, 0.0,  -s, 0.0, c);
}

float sdCube(vec3 p) {
  vec3 q = abs(p) - vec3(S3);
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

// Unit-circumradius octahedron — distinct from sdOctahedron(vec3, float) in sdf-functions.
float sdOctahedronUnit(vec3 p) {
  p = abs(p);
  float m = p.x + p.y + p.z - 1.0;
  vec3 q;
  if      (3.0 * p.x < m) q = p.xyz;
  else if (3.0 * p.y < m) q = p.yzx;
  else if (3.0 * p.z < m) q = p.zxy;
  else                    return m * S3;
  float k = clamp(0.5 * (q.z - q.y + 1.0), 0.0, 1.0);
  return length(vec3(q.x, q.y - 1.0 + k, q.z - k));
}

float sdTetrahedron(vec3 p) {
  float d = max(max(p.x + p.y - p.z, p.x - p.y + p.z),
                max(-p.x + p.y + p.z, -p.x - p.y - p.z));
  return d * S3 - 0.33333333;
}

// The tetrahedron's own dual — the same solid, point-reflected through the origin.
float sdDualTetrahedron(vec3 p) {
  float d = max(max(p.x + p.y + p.z, p.x - p.y - p.z),
                max(-p.x + p.y - p.z, -p.x - p.y + p.z));
  return d * S3 - 0.33333333;
}

float sdDodecahedron(vec3 p) {
  const float N   = 1.90211303;   // |(1, PHI)| * PHI, the face-plane normaliser
  const float RIN = 0.79465448;   // inradius at circumradius 1
  vec3 q = abs(p);
  float a = (q.y + PHI * q.z) / N;
  float b = (q.x + PHI * q.y) / N;
  float c = (PHI * q.x + q.z) / N;
  return max(max(a, b), c) - RIN;
}

float sdIcosahedron(vec3 p) {
  const float RIN = 0.79465448;
  vec3 q = abs(p);
  float dA = (q.x + q.y + q.z) * S3;
  float dB = (PHI * q.y + q.z / PHI) * S3;
  float dC = (q.x / PHI + PHI * q.z) * S3;
  float dD = (PHI * q.x + q.y / PHI) * S3;
  return max(max(dA, dB), max(dC, dD)) - RIN;
}

// The whole family shares a slow Y-axis rotation so every surface can be read from
// all sides. Defines surfaceF(); the including shader renames it to baseScalarF()
// so that the deformation pass can wrap it.

float surfaceF(vec3 p) {
  float rot = iTime * 0.22;
  float cr = cos(rot), sr = sin(rot);
  vec3 q = vec3(cr * p.x + sr * p.z, p.y, -sr * p.x + cr * p.z);
  float x = q.x, y = q.y, z = q.z;
  float t = iTime;

  // 1. Traveling radial damped cosine — a damped radial wave whose phase advances with time
  if (u_surfaceIndex == 1) {
    float r = length(vec2(x, z));
    return y - 0.52 * exp(-r * 1.1) * cos(5.5 * r - 2.2 * t);
  }

  // 2. Pulsing torus — the major radius breathes while azimuthal waves travel around the tube
  if (u_surfaceIndex == 2) {
    float theta = atan(z, x);
    float R   = 0.58 + 0.13 * sin(t * 0.70) + 0.05 * sin(t * 1.83);
    float r_t = 0.10 + 0.048 * sin(3.0 * theta - t * 1.10) + 0.022 * sin(7.0 * theta + t * 0.68);
    float qr  = length(vec2(x, z)) - R;
    return qr * qr + y * y - r_t * r_t;
  }

  // 3. Traveling sinusoidal surface — product of two traveling sinusoids
  if (u_surfaceIndex == 3) {
    return y - 0.38 * sin(2.1 * x + t * 1.1) * cos(2.1 * z + t * 0.7);
  }

  // 4. Oscillating spheroid — quadrupolar mode alternating prolate/oblate via P₂(cos θ)
  if (u_surfaceIndex == 4) {
    float rlen = length(q);
    float ct = rlen > 0.001 ? q.y / rlen : 0.0;
    float P2 = 0.5 * (3.0 * ct * ct - 1.0);
    float amp = 0.16 * sin(t * 0.85) + 0.07 * sin(t * 2.13 + 1.0);
    return rlen - (0.70 + amp * P2);
  }

  // 5. Pulsing saddle — the amplitude of x² − z² breathes
  if (u_surfaceIndex == 5) {
    float A = 0.70 + 0.30 * sin(t * 0.75);
    return y - A * (x * x - z * z);
  }

  // 6. Pulsing gyroid — triply periodic minimal surface; the spatial scale k(t) oscillates
  if (u_surfaceIndex == 6) {
    float k = 1.45 + 0.42 * sin(t * 0.50);
    return cos(k * x) * sin(k * y) + cos(k * y) * sin(k * z) + cos(k * z) * sin(k * x);
  }

  // 7. Oscillating Schwarz P — triply periodic minimal surface; the threshold c(t) shifts
  if (u_surfaceIndex == 7) {
    float c = 0.88 * sin(t * 0.55);
    return cos(2.0 * x) + cos(2.0 * y) + cos(2.0 * z) - c;
  }

  // 8. Pulsing lemniscate — (x²+y²+z²)² = a²(x²−z²) with an oscillating axis a(t)
  if (u_surfaceIndex == 8) {
    float a = 0.55 + 0.18 * sin(t * 0.85);
    float r2 = dot(q, q);
    return r2 * r2 - a * a * (x * x - z * z);
  }

  // 9. Tilting ellipsoid — elongated along Y; the long axis tilts while the axes breathe
  if (u_surfaceIndex == 9) {
    float wobble = 0.52 * sin(t * 0.47);
    float cw = cos(wobble), sw = sin(wobble);
    vec3 pw = vec3(cw * x + sw * y, -sw * x + cw * y, z);
    float a = 0.54 + 0.18 * sin(t * 0.70);
    float b = 0.96 + 0.26 * sin(t * 1.13 + 1.0);
    float c = 0.54 + 0.16 * sin(t * 0.85 + 2.1);

  if (u_surfaceIndex == 10) {

    float u = x * s, v = y * s, w = z * s;
    float c = 10.5 + 3.2 * sin(t * 0.45);

  // 11. Pulsing Chmutov T₄ — sum of 4th Chebyshev polynomials; the scale s(t) oscillates
  if (u_surfaceIndex == 11) {
    float s = 1.02 + 0.13 * sin(t * 0.58);
    float u = x * s, v = y * s, w = z * s;
    float T4u = 8.0*u*u*u*u - 8.0*u*u + 1.0;
    float T4v = 8.0*v*v*v*v - 8.0*v*v + 1.0;
    float T4w = 8.0*w*w*w*w - 8.0*w*w + 1.0;

  if (u_surfaceIndex == 12) {
    float wave = y + 0.18 * sin(4.5 * y - 1.6 * t);
    return x * x + z * z - wave * wave;
  }

  // 13. Pulsing Gaussian — the height and width of a radial bump oscillate
  if (u_surfaceIndex == 13) {
    float A     = 0.52 + 0.32 * sin(t * 0.90);
    float sigma = 0.22 + 0.10 * sin(t * 1.30 + 1.0);
    return y - A * exp(-(x * x + z * z) / (sigma * sigma));
  }

  // 14. Oscillating Schoen I-WP — triply periodic surface; c(t) sweeps through the family
  if (u_surfaceIndex == 14) {
    float c = 0.80 * sin(t * 0.50);
    return cos(2.0*x)*cos(2.0*y) + cos(2.0*y)*cos(2.0*z) + cos(2.0*z)*cos(2.0*x) - c;

  // 15. Tilting saddle — the cross term A(t)·xz rotates the principal curvature axes
  if (u_surfaceIndex == 15) {
    float A = 1.20 * sin(t * 0.65);
    return y - 0.72 * (x * x - z * z + A * x * z);
  }

  // 16. Rotating torus — the tube radius is modulated around the ring angle
  if (u_surfaceIndex == 16) {
    float theta  = atan(z, x);
    float r_tube = 0.10 + 0.06 * sin(4.0 * theta - t * 0.95);

  if (u_surfaceIndex == 18) {
    float A = 0.28 * sin(t * 0.72);

  if (u_surfaceIndex == 20) {

    float b = 0.80 * cos(ph + 0.55);

  }

}

  "rim-lighting.glsl": `// Rim (back) lighting with subsurface scattering — bright silhouette edges plus a
// thin-area glow. Injected into a fragment shader via the // INCLUDE_RIM_LIGHTING marker.
//
// Required uniforms (declared by the including shader):
//   uniform float u_rimPow;     — rim edge exponent      (default 3.0)
//   uniform float u_base;       — face-on ambient        (default 0.0)
//   uniform float u_sssDensity; — SSS thickness falloff  (default 2.5)
//   uniform float u_sssStr;     — SSS strength           (default 0.3)
//
// Usage: vec3 col = rimLight(pos, nor, rd, thickness);
//   nor       — normal facing the camera (flip two-sided normals before calling)
//   rd        — normalised ray direction, pointing away from the camera
//   thickness — distance through the interior to the back face. Pass a large value
//               (e.g. 100.0) on open surfaces to suppress SSS.
//
// Background is vec3(0.0). Gamma is applied by the caller.

vec3 rimLight(vec3 pos, vec3 nor, vec3 rd, float thickness) {
  float NdotV = abs(dot(nor, -rd));
  float rim   = pow(1.0 - NdotV, u_rimPow);
  float base  = NdotV * NdotV * u_base;
  float sss   = exp(-thickness * u_sssDensity);
  return vec3(base)
       + vec3(0.92, 0.96, 1.00) * rim
       + vec3(0.92, 0.96, 1.00) * sss * u_sssStr;
}

// Two orbiting key lights circle the shape at different rates; the left channel
// drives one and the right channel the other, so a stereo mix lights the shape
// from two independently moving directions. Both terms scale with amplitude²,
// which keeps quiet passages dark without crushing transients.
//
// Required uniforms: iTime, u_ampL, u_ampR, u_envMap, u_sssDensity, u_sssStr, PI.

vec3 sampleEnvMap(vec3 dir) {
  float u = atan(dir.z, dir.x) * (0.5 / PI) + 0.5 + iTime * 0.02;
  float v = asin(clamp(dir.y, -1.0, 1.0)) / PI + 0.5;
  return texture2D(u_envMap, vec2(u, v)).rgb;
}

// Two-light rig evaluated against a material colour.
// spec is the specular weight: 0.45 for the flat flash material, 0.35 for env.
vec3 _twoLightRig(vec3 mat, vec3 nor, vec3 rd, float specWeight, float specTint) {
  float a1  = iTime * 3.5;
  vec3  ld1 = normalize(vec3(sin(a1), 0.35, cos(a1)));
  vec3  h1  = normalize(ld1 - rd);
  vec3  c1  = mat * max(dot(nor, ld1), 0.0) * 0.85
            + vec3(specTint) * pow(max(dot(nor, h1), 0.0), 56.0) * specWeight;

  float a2  = iTime * 2.1 + 1.9;
  vec3  ld2 = normalize(vec3(sin(a2), 0.20, cos(a2)));
  vec3  h2  = normalize(ld2 - rd);
  vec3  c2  = mat * max(dot(nor, ld2), 0.0) * 0.85
            + vec3(specTint) * pow(max(dot(nor, h2), 0.0), 56.0) * specWeight;

  float aL2 = u_ampL * u_ampL;
  float aR2 = u_ampR * u_ampR;
  // The floor on the left term keeps a faint reading of the shape during silence.
  return c1 * max(aL2, 0.015) + c2 * aR2;
}

// Flat white material — the shape reads as a lamp flashing on every transient.
vec3 flashLight(vec3 nor, vec3 rd) {
  return _twoLightRig(vec3(0.88), nor, rd, 0.45, 0.45);
}

// direction, and a thickness-based SSS term lets thin areas glow through.
vec3 envLight(vec3 nor, vec3 rd, float thickness) {
  vec3  mat = sampleEnvMap(nor);
  vec3  lit = _twoLightRig(mat, nor, rd, 0.35, 0.50);
  float amp = max(u_ampL * u_ampL, 0.015) + u_ampR * u_ampR;

vec3 envBackground(vec3 rd) {
  float amp = (max(u_ampL * u_ampL, 0.015) + u_ampR * u_ampR) * 0.6;
  return sampleEnvMap(rd) * amp;
}

  async useMic() {
    this._ensureContext();
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    this._disconnectSource();
    this._connect(this.ctx.createMediaStreamSource(stream), { audible: false });
    this.sourceKind = 'mic';
    this.micStream = stream;
    await this.ctx.resume();
    this.isPlaying = true;
  }

  async useDemo() {
    this._ensureContext();
    this._disconnectSource();
    const out = this.ctx.createGain();
    out.gain.value = 0.8;
    this._connect(out, { audible: true });
    this.demo = new DemoTrack(this.ctx, out);
    this.sourceKind = 'demo';
    await this.play();
  }

  async play() {
    if (!this.ctx) return;
    await this.ctx.resume();
    if (this.mediaEl) await this.mediaEl.play();
    if (this.demo) this.demo.start();
    this.isPlaying = true;
  }

  pause() {
    if (this.mediaEl) this.mediaEl.pause();
    if (this.demo) this.demo.stop();
    if (this.sourceKind === 'mic' && this.ctx) this.ctx.suspend();
    this.isPlaying = false;
  }

  async toggle() {
    if (this.isPlaying) this.pause(); else await this.play();
    return this.isPlaying;
  }

  // ── Per-frame analysis ─────────────────────────────────────────────────────

  _channelAmp(analyser) {
    analyser.getFloatTimeDomainData(this.timeBuf);
    // Only the newest samples are measured. Averaging the analyser's full 2048-
    // sample window (~46 ms) smears attacks into the sustain behind them, which
    // is exactly the detail these deformations are meant to be tight on.
    const n = this.timeBuf.length;
    const from = n - AMP_WINDOW;
    let sum = 0;
    for (let i = from; i < n; i++) sum += this.timeBuf[i] * this.timeBuf[i];
    const rms = Math.sqrt(sum / AMP_WINDOW);
    if (rms < 1e-5) return 0;
    const db = 20 * Math.log10(rms);
    return Math.max(0, Math.min(1, ((db + AMP_FLOOR_DB) / AMP_FLOOR_DB) * this.gain));
  }

  // Reduce the linear spectrum to mel bands. Each band takes the peak of its
  // range so narrow transients survive the downsampling, then dB is mapped onto
  // 0–1 across the window above.
  _channelFFT(analyser, out) {
    analyser.getFloatFrequencyData(this.freqBuf);
    const span = FFT_MAX_DB - FFT_MIN_DB;
    for (let i = 0; i < BINS; i++) {
      let peak = -Infinity;
      for (let b = this.melStart[i]; b < this.melEnd[i]; b++) {
        if (this.freqBuf[b] > peak) peak = this.freqBuf[b];
      }
      out[i] = Math.max(0, Math.min(1, (peak - FFT_MIN_DB) / span));
    }
  }

  _pushHistory() {
    this.histL[this.head] = this.ampL;
    this.histR[this.head] = this.ampR;
    this.histMono[this.head] = this.ampMono;
    const base = this.head * BINS;
    for (let i = 0; i < BINS; i++) this.spec[base + i] = this.fftMono[i];
    this.head = (this.head + 1) % HIST;
  }

  // `now` is a performance.now() timestamp. The ring buffer advances on a fixed
  // 60 Hz clock rather than once per rendered frame, so the window stays ~4
  // seconds of *audio* whatever the render rate — otherwise a machine drawing at
  // 20 fps would spread 13 seconds across the same geometry.
  update(now = performance.now()) {
    if (!this.ctx) return;
    this.pushed = 0;

    this.ampL = this._channelAmp(this.analyserL);
    this.ampR = this._channelAmp(this.analyserR);
    this.ampMono = (this.ampL + this.ampR) * 0.5;

    this._channelFFT(this.analyserL, this.fftL);
    this._channelFFT(this.analyserR, this.fftR);
    for (let i = 0; i < BINS; i++) {
      this.fftMono[i] = (this.fftL[i] + this.fftR[i]) * 0.5;
    }

    const step = 1000 / FPS;
    if (this._nextPush === undefined) this._nextPush = now;
    let steps = Math.floor((now - this._nextPush) / step) + 1;
    if (steps > MAX_CATCHUP) {
      // Long stall: skip ahead rather than replaying stale readings.
      steps = MAX_CATCHUP;
      this._nextPush = now;
    }
    this._nextPush += steps * step;
    for (let i = 0; i < steps; i++) this._pushHistory();
    this.pushed = steps;
  }

  // Amplitude `age` frames ago, 0 being the frame just written
  histAt(buf, age) {
    return buf[(this.head - 1 - age + HIST * 2) % HIST];
  }
}

// ── Built-in generated track ─────────────────────────────────────────────────
// A short four-bar loop — kick, hat, bass and a drifting pad — so the page has
// something to react to before the user supplies audio of their own. It is
// deliberately wide-band: the kick drives the low mel bands, the hat the top,
// and the pad fills the middle, which exercises every frequency mode.

class DemoTrack {
  constructor(ctx, out) {
    this.ctx = ctx;
    this.out = out;
    this.running = false;
    this.step = 0;
    this.nextTime = 0;
    this.bpm = 124;
    this.timer = null;
    this.pad = null;
  }

  start() {
    if (this.running) return;
    this.running = true;
    this.nextTime = this.ctx.currentTime + 0.08;
    this._startPad();
    this.timer = setInterval(() => this._schedule(), 25);
  }

  stop() {
    this.running = false;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (this.pad) {
      for (const n of this.pad.nodes) { try { n.stop(); } catch { /* already stopped */ } }
      this.pad = null;
    }
  }

  // Two sustained layers that never stop: a filtered saw drone for the mid bands
  // and a quiet high-passed noise bed for the top. Drum hits alone leave most of
  // the spectrum empty between transients, which makes the frequency and
  // spectrogram modes read as blank — these keep every band alive.
  _startPad() {
    const t = this.ctx.currentTime;
    const nodes = [];

    // Drone: four detuned saws through a slowly sweeping resonant lowpass
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 900;
    filter.Q.value = 6;

    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 0.07;
    lfoGain.gain.value = 780;
    lfo.connect(lfoGain).connect(filter.frequency);
    lfo.start(t);
    nodes.push(lfo);

    const padGain = this.ctx.createGain();
    padGain.gain.value = 0.12;
    filter.connect(padGain).connect(this.out);

    for (const hz of [110, 164.81, 220, 277.18]) {
      const o = this.ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = hz;
      o.detune.value = (Math.random() - 0.5) * 14;
      o.connect(filter);
      o.start(t);
      nodes.push(o);
    }

    // Sub: a quiet low sine so the bottom mel bands carry continuous energy the
    // way a real mix does. Without it those bands only see the kick's transient
    // and the spectral modes read as flat at the bottom.
    const sub = this.ctx.createOscillator();
    const subGain = this.ctx.createGain();
    sub.type = 'sine';
    sub.frequency.value = 46;
    subGain.gain.value = 0.30;
    sub.connect(subGain).connect(this.out);
    sub.start(t);
    nodes.push(sub);

    // Air: a looping noise buffer through a bandpass that drifts across the top
    // two octaves, so the highest mel bands always have something to show.
    const len = Math.ceil(this.ctx.sampleRate * 2);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const noise = this.ctx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;

    const air = this.ctx.createBiquadFilter();
    air.type = 'bandpass';
    air.frequency.value = 5000;
    air.Q.value = 0.7;

    const airLfo = this.ctx.createOscillator();
    const airLfoGain = this.ctx.createGain();
    airLfo.frequency.value = 0.11;
    airLfoGain.gain.value = 3200;
    airLfo.connect(airLfoGain).connect(air.frequency);
    airLfo.start(t);
    nodes.push(airLfo);

    const airGain = this.ctx.createGain();
    airGain.gain.value = 0.075;
    noise.connect(air).connect(airGain).connect(this.out);
    noise.start(t);
    nodes.push(noise);

    this.pad = { nodes };
  }

  // Look ahead ~120 ms and queue any steps that fall inside the window. The
  // interval timer is too coarse to trigger notes directly, so it only ever
  // schedules them against the audio clock.
  _schedule() {
    if (!this.running) return;
    const stepDur = 60 / this.bpm / 4;   // sixteenth notes
    while (this.nextTime < this.ctx.currentTime + 0.12) {
      this._playStep(this.step % 16, this.nextTime);
      this.step++;
      this.nextTime += stepDur;
    }
  }

  _playStep(s, t) {
    if (s % 4 === 0) this._kick(t);
    if (s % 4 === 2) this._hat(t, 0.05);
    if (s % 2 === 1) this._hat(t, 0.018);
    if (s === 6 || s === 14) this._snare(t);
    // Offbeat bass, skipping the downbeat so the kick reads cleanly
    if (s % 4 === 2 || s === 7) this._bass(t, [55, 61.74, 73.42, 82.41][(s >> 2) & 3]);
  }

  _env(node, t, peak, attack, decay) {
    const g = node.gain;
    g.setValueAtTime(0.0001, t);
    g.exponentialRampToValueAtTime(peak, t + attack);
    g.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  }

  _kick(t) {
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.13);
    this._env(g, t, 1.0, 0.004, 0.30);
    o.connect(g).connect(this.out);
    o.start(t);
    o.stop(t + 0.4);
  }

  _bass(t, hz) {
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    const f = this.ctx.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.value = hz;
    f.type = 'lowpass';
    f.frequency.setValueAtTime(1400, t);
    f.frequency.exponentialRampToValueAtTime(260, t + 0.18);
    this._env(g, t, 0.55, 0.006, 0.20);
    o.connect(f).connect(g).connect(this.out);
    o.start(t);
    o.stop(t + 0.3);
  }

  _noiseBurst(t, peak, decay, hp) {
    const len = Math.ceil(this.ctx.sampleRate * (decay + 0.05));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = hp;
    const g = this.ctx.createGain();
    this._env(g, t, peak, 0.002, decay);
    src.connect(f).connect(g).connect(this.out);
    src.start(t);
    src.stop(t + decay + 0.05);
  }

  _hat(t, peak) { this._noiseBurst(t, peak * 1.6, 0.045, 7000); }
  _snare(t)     { this._noiseBurst(t, 0.50, 0.16, 1600); }
}

import * as THREE from 'three';

// ── Shader assembly ─────────────────────────────────────────────────────────

const SHADER_DIR = './shaders/';

// The single-file build (build.mjs) inlines every shader into this global, so the
// page can run straight off the filesystem. Served from a directory, the global
// is absent and the shaders are fetched as normal.
async function loadText(name) {
  const inlined = globalThis.__SHADER_SOURCES?.[name];
  if (inlined !== undefined) return inlined;
  const res = await fetch(SHADER_DIR + name);
  if (!res.ok) throw new Error(`could not load ${name}: ${res.status}`);
  return res.text();
}

function inject(template, parts) {
  let src = template;
  for (const [marker, body] of Object.entries(parts)) src = src.replace(marker, body);
  return src;
}

// ── App ─────────────────────────────────────────────────────────────────────

async function init() {
  const canvas = document.getElementById('canvas');
  const $ = (id) => document.getElementById(id);

  const [
    vertSrc, sdfFuncSrc, sdfMarcherSrc, scalarMarcherSrc, platonicFuncSrc,
    movingScalarSrc, rimLightSrc, lightingSrc, deformSrc,
    fragSdfTmpl, fragPlatonicTmpl, fragScalarTmpl, fragMovingTmpl, fragFormTmpl,
  ] = await Promise.all([
    'vertex.glsl', 'sdf-functions.glsl', 'sdf-marcher.glsl', 'scalar-marcher.glsl',
    'platonic-functions.glsl', 'moving-scalar-functions.glsl', 'rim-lighting.glsl',
    'lighting.glsl', 'deform.glsl', 'fragment-sdf.glsl', 'fragment-platonic.glsl',
    'fragment-scalar.glsl', 'fragment-moving.glsl', 'fragment-form.glsl',
  ].map(loadText));

  // The moving-scalar library and the fragment shader both want to own
  // `surfaceF`; rename the library's copy so the deformation wrapper can call it.
  const movingRenamed = movingScalarSrc.replace(/\bsurfaceF\b/g, 'baseScalarF');

  const fragSdf = inject(fragSdfTmpl, {
    '// INCLUDE_SDF_FUNCTIONS': sdfFuncSrc,
    '// INCLUDE_RIM_LIGHTING': rimLightSrc,
    '// INCLUDE_LIGHTING': lightingSrc,
    '// INCLUDE_SDF_MARCHER': sdfMarcherSrc,
    '// INCLUDE_DEFORM': deformSrc,
  });
  const fragPlatonic = inject(fragPlatonicTmpl, {
    '// INCLUDE_PLATONIC_FUNCTIONS': platonicFuncSrc,
    '// INCLUDE_RIM_LIGHTING': rimLightSrc,
    '// INCLUDE_LIGHTING': lightingSrc,
    '// INCLUDE_SDF_MARCHER': sdfMarcherSrc,
    '// INCLUDE_DEFORM': deformSrc,
  });
  const fragScalar = inject(fragScalarTmpl, {
    '// INCLUDE_RIM_LIGHTING': rimLightSrc,
    '// INCLUDE_LIGHTING': lightingSrc,
    '// INCLUDE_SCALAR_MARCHER': scalarMarcherSrc,
    '// INCLUDE_DEFORM': deformSrc,
  });
  const fragMoving = inject(fragMovingTmpl, {
    '// INCLUDE_RIM_LIGHTING': rimLightSrc,
    '// INCLUDE_LIGHTING': lightingSrc,
    '// INCLUDE_SCALAR_MARCHER': scalarMarcherSrc,
    '// INCLUDE_DEFORM': deformSrc,
    '// INCLUDE_MOVING_SCALAR_FUNCTIONS': movingRenamed,
  });
  const fragForm = inject(fragFormTmpl, {
    '// INCLUDE_RIM_LIGHTING': rimLightSrc,
    '// INCLUDE_LIGHTING': lightingSrc,
  });

  // ── Data textures ─────────────────────────────────────────────────────────
  // 1 × 256 amplitude history: r = L, g = R, b = mono. Row 0 is the current
  // frame and row 255 is ~4 s ago, so the shader reads v = 0 as "now".
  const histBuf = new Uint8Array(HIST * 4);
  const histTex = new THREE.DataTexture(histBuf, 1, HIST, THREE.RGBAFormat);
  histTex.magFilter = histTex.minFilter = THREE.LinearFilter;
  histTex.needsUpdate = true;

  // 128 × 1 current mel spectrum: r = mono, g = right channel.
  const fftBuf = new Uint8Array(BINS * 4);
  const fftTex = new THREE.DataTexture(fftBuf, BINS, 1, THREE.RGBAFormat);
  fftTex.magFilter = fftTex.minFilter = THREE.LinearFilter;
  fftTex.needsUpdate = true;

  // 128 × 256 spectrogram, written as a ring buffer. u_histHead tells the shader
  // where "now" currently sits, so no rows ever have to be shifted.
  const specBuf = new Uint8Array(BINS * HIST * 4);
  const specTex = new THREE.DataTexture(specBuf, BINS, HIST, THREE.RGBAFormat);
  specTex.magFilter = specTex.minFilter = THREE.LinearFilter;
  specTex.wrapS = THREE.ClampToEdgeWrapping;
  specTex.wrapT = THREE.RepeatWrapping;
  specTex.needsUpdate = true;

  const envTex = buildEnvMapTexture(THREE, 256, 128);

  // ── Renderer ──────────────────────────────────────────────────────────────

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  const shared = {
    iResolution: { value: new THREE.Vector2(1, 1) },
    iTime: { value: 0 },
    u_ampL: { value: 0 }, u_ampR: { value: 0 }, u_ampMono: { value: 0 },
    u_ssaa: { value: 0 },
    u_lighting: { value: 0 },
    u_deformMode: { value: 3 },
    u_histTex: { value: histTex },
    u_fftTex: { value: fftTex },
    u_envMap: { value: envTex },
    u_rimPow: { value: 3.0 },
    u_base: { value: 0.0 },
    u_sssDensity: { value: 2.5 },
    u_sssStr: { value: 0.3 },
    u_deformP1: { value: 0.55 },
    u_deformP2: { value: 0.55 },
    u_histDuration: { value: 1.0 },
    u_histSoften: { value: 0.0 },
    u_twistAxisX: { value: 0.0 },
    u_twistAxisZ: { value: 0.0 },
    u_ctrlN: { value: 2.0 },
  };

  const uniforms = {
    sdf:      { ...shared, u_shapeIndex: { value: 1 } },
    platonic: { ...shared, u_pair: { value: 2 }, u_t: { value: 0 } },
    scalar:   { ...shared, u_surfaceIndex: { value: 1 } },
    moving:   { ...shared, u_surfaceIndex: { value: 1 } },
    form:     { ...shared, u_mode: { value: 1 }, u_intensity: { value: 1.0 },
                u_specTex: { value: specTex }, u_histHead: { value: 0 } },
  };

  function makeScene(fragSrc, u) {
    const scene = new THREE.Scene();
    scene.add(new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.ShaderMaterial({ uniforms: u, vertexShader: vertSrc, fragmentShader: fragSrc }),
    ));
    return scene;
  }

  const scenes = {
    sdf: makeScene(fragSdf, uniforms.sdf),
    platonic: makeScene(fragPlatonic, uniforms.platonic),
    scalar: makeScene(fragScalar, uniforms.scalar),
    moving: makeScene(fragMoving, uniforms.moving),
    form: makeScene(fragForm, uniforms.form),
  };

  const renderPass = new RenderPass(scenes.platonic, cam);
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.25, 0.5, 0.1);
  const composer = new EffectComposer(renderer);
  composer.addPass(renderPass);
  composer.addPass(bloomPass);

  function resize() {
    const w = Math.max(1, canvas.clientWidth);
    const h = Math.max(1, canvas.clientHeight);
    // SSAA already costs 4 rays per pixel, so the backing store stays at 1× when
    // it is on and only takes the display's pixel ratio when it is off.
    const dpr = shared.u_ssaa.value ? 1 : Math.min(window.devicePixelRatio || 1, 1.5);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    composer.setPixelRatio(dpr);
    composer.setSize(w, h);
    bloomPass.setSize(w * dpr, h * dpr);
    for (const u of Object.values(uniforms)) u.iResolution.value.set(w * dpr, h * dpr);
  }
  window.addEventListener('resize', resize);

  // ── State ─────────────────────────────────────────────────────────────────

  const state = {
    section: 'amplitude',   // amplitude | history | frequency | form
    category: 'platonic',   // sdf | platonic | scalar | moving
    shapeIndex: 2,          // index into the active category's list
    mode: 3,
    formMode: 1,
  };

  const audio = new AudioEngine();

  function activeKey() { return state.section === 'form' ? 'form' : state.category; }

  function syncScene() {
    renderPass.scene = scenes[activeKey()];
  }

  // Every uniform object shares the same value holders for the common uniforms,
  // so writing through one is enough — but shape indices are per-family.
  function applyShape(index) {
    if (state.category === 'sdf') uniforms.sdf.u_shapeIndex.value = index + 1;
    else if (state.category === 'platonic') uniforms.platonic.u_pair.value = index;
    else if (state.category === 'scalar') uniforms.scalar.u_surfaceIndex.value = index + 1;
    else uniforms.moving.u_surfaceIndex.value = index + 1;
  }

  // ── UI ────────────────────────────────────────────────────────────────────

  const sectionTabs = document.querySelectorAll('[data-section]');
  const categoryRow = $('category-row');
  const categorySel = $('category-select');
  const shapeSel = $('shape-select');
  const modeSel = $('mode-select');
  const lightingSel = $('lighting-select');
  const paramPanel = $('param-panel');

  function buildParamPanel() {
    const key = state.section === 'form' ? 'form' : state.mode;
    paramPanel.innerHTML = '';
    for (const [pid, label, min, max, step, def] of MODE_PARAMS[key]) {
      const row = document.createElement('div');
      row.className = 'param-row';

      const name = document.createElement('span');
      name.className = 'param-label';
      name.textContent = label;

      const input = document.createElement('input');
      input.type = 'range';
      input.min = min; input.max = max; input.step = step; input.value = def;

      const val = document.createElement('span');
      val.className = 'param-val';

      const uniformName = PARAM_UNIFORM[pid];
      const write = () => {
        const v = parseFloat(input.value);
        val.textContent = step >= 1 ? v.toFixed(0) : v.toFixed(2);
        // u_intensity lives only on the form uniforms; the rest are shared.
        const target = uniformName === 'u_intensity' ? uniforms.form : uniforms.sdf;
        target[uniformName].value = v;
      };
      input.addEventListener('input', write);
      write();

      row.append(name, input, val);
      paramPanel.appendChild(row);
    }
  }

  function populateShapes() {
    const list = state.section === 'form' ? FORM_MODES : CATEGORY_SHAPES[state.category];
    shapeSel.innerHTML = '';
    list.forEach((label, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = label;
      shapeSel.appendChild(opt);
    });
  }

  function populateModes() {
    modeSel.innerHTML = '';
    if (state.section === 'form') return;
    for (const { id, name } of SECTION_MODES[state.section]) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = name;
      modeSel.appendChild(opt);
    }
    modeSel.value = String(state.mode);
  }

  function selectSection(section) {
    state.section = section;
    sectionTabs.forEach((el) => el.classList.toggle('active', el.dataset.section === section));

    const isForm = section === 'form';
    categoryRow.style.display = isForm ? 'none' : '';
    modeSel.parentElement.style.display = isForm ? 'none' : '';
    document.body.classList.toggle('form-section', isForm);

    if (!isForm) {
      // Keep the current deformation if it belongs to this section (so the
      // opening state survives), otherwise fall back to the section's first.
      const modes = SECTION_MODES[section];
      if (!modes.some((m) => m.id === state.mode)) state.mode = modes[0].id;
      shared.u_deformMode.value = state.mode;
    }

    populateShapes();
    populateModes();

    if (isForm) {
      shapeSel.value = String(state.formMode - 1);
      uniforms.form.u_mode.value = state.formMode;
    } else {
      // Amplitude, History and Frequency all deform the same catalogue, so
      // moving between them keeps whatever shape is already on screen.
      shapeSel.value = String(state.shapeIndex);
      applyShape(state.shapeIndex);
    }
    buildParamPanel();
    syncScene();
  }

  for (const tab of sectionTabs) {
    tab.addEventListener('click', () => selectSection(tab.dataset.section));
  }

  categorySel.addEventListener('change', () => {
    state.category = categorySel.value;
    // Shape indices are per-category, so a new catalogue starts from the top.
    state.shapeIndex = 0;
    populateShapes();
    shapeSel.value = '0';
    applyShape(0);
    syncScene();
  });

  shapeSel.addEventListener('change', () => {
    const i = parseInt(shapeSel.value, 10);
    if (state.section === 'form') {
      state.formMode = i + 1;
      uniforms.form.u_mode.value = state.formMode;
    } else {
      state.shapeIndex = i;
      applyShape(i);
    }
  });

  modeSel.addEventListener('change', () => {
    state.mode = parseInt(modeSel.value, 10);
    shared.u_deformMode.value = state.mode;
    buildParamPanel();
  });

  lightingSel.addEventListener('change', () => {
    shared.u_lighting.value = parseInt(lightingSel.value, 10);
  });

  // Bloom
  const bindBloom = (id, apply) => {
    const el = $(id);
    const out = $(id + '-val');
    const write = () => {
      const v = parseFloat(el.value);
      out.textContent = v.toFixed(2);
      apply(v);
    };
    el.addEventListener('input', write);
    write();
  };
  bindBloom('bloom-strength', (v) => { bloomPass.strength = v; });
  bindBloom('bloom-threshold', (v) => { bloomPass.threshold = v; });

  // Anti-aliasing
  const aaBtn = $('aa-btn');
  aaBtn.addEventListener('click', () => {
    shared.u_ssaa.value = shared.u_ssaa.value ? 0 : 1;
    aaBtn.classList.toggle('on', !!shared.u_ssaa.value);
    resize();
  });

  // ── Audio controls ────────────────────────────────────────────────────────

  const playBtn = $('play-btn');
  const status = $('audio-status');
  const PLAY = '<svg width="12" height="14" viewBox="0 0 14 16" fill="currentColor"><polygon points="0,0 14,8 0,16"/></svg>';
  const PAUSE = '<svg width="12" height="14" viewBox="0 0 12 16" fill="currentColor"><rect x="0" width="4" height="16"/><rect x="8" width="4" height="16"/></svg>';

  function refreshTransport(label) {
    playBtn.innerHTML = audio.isPlaying ? PAUSE : PLAY;
    if (label) status.textContent = label;
  }

  playBtn.addEventListener('click', async () => {
    // Nothing is connected until the first gesture — browsers will not start an
    // AudioContext before one.
    if (audio.sourceKind === 'none') await audio.useDemo();
    else await audio.toggle();
    refreshTransport();
  });

  $('demo-btn').addEventListener('click', async () => {
    await audio.useDemo();
    refreshTransport('Generated track');
  });

  $('file-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    await audio.useFile(file);
    refreshTransport(file.name);
  });

  $('mic-btn').addEventListener('click', async () => {
    try {
      await audio.useMic();
      refreshTransport('Microphone');
    } catch {
      status.textContent = 'Microphone unavailable';
    }
  });

  const gainInput = $('gain');
  const writeGain = () => {
    audio.gain = parseFloat(gainInput.value);
    $('gain-val').textContent = audio.gain.toFixed(1);
  };
  gainInput.addEventListener('input', writeGain);
  writeGain();

  // ── Texture upload ────────────────────────────────────────────────────────

  const toByte = (v) => Math.round(Math.max(0, Math.min(1, v)) * 255);

  function uploadTextures() {
    // Amplitude history, newest first.
    for (let row = 0; row < HIST; row++) {
      const o = row * 4;
      histBuf[o]     = toByte(audio.histAt(audio.histL, row));
      histBuf[o + 1] = toByte(audio.histAt(audio.histR, row));
      histBuf[o + 2] = toByte(audio.histAt(audio.histMono, row));
      histBuf[o + 3] = 255;
    }
    histTex.needsUpdate = true;

    for (let i = 0; i < BINS; i++) {
      const o = i * 4;
      fftBuf[o]     = toByte(audio.fftMono[i]);
      fftBuf[o + 1] = toByte(audio.fftR[i]);
      fftBuf[o + 2] = toByte(audio.fftL[i]);
      fftBuf[o + 3] = 255;
    }
    fftTex.needsUpdate = true;

    // Only the rows the engine wrote this tick need refreshing; the rest of the
    // ring buffer is still valid from previous frames. On a slow frame the
    // engine may have advanced several rows at once.
    for (let k = 0; k < audio.pushed; k++) {
      const row = (audio.head - 1 - k + HIST * 2) % HIST;
      const src = row * BINS;
      const dst = row * BINS * 4;
      for (let i = 0; i < BINS; i++) {
        const o = dst + i * 4;
        const v = toByte(audio.spec[src + i]);
        specBuf[o] = specBuf[o + 1] = specBuf[o + 2] = v;
        specBuf[o + 3] = 255;
      }
    }
    if (audio.pushed) specTex.needsUpdate = true;
    uniforms.form.u_histHead.value = audio.head / HIST;
  }

  // ── Frame loop ────────────────────────────────────────────────────────────

  const start = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);

    audio.update(now);
    uploadTextures();

    shared.iTime.value = (now - start) / 1000;
    shared.u_ampL.value = audio.ampL;
    shared.u_ampR.value = audio.ampR;
    shared.u_ampMono.value = audio.ampMono;

    // Platonic pairs cross-fade between a solid and its dual on a slow cycle.
    uniforms.platonic.u_t.value =
      0.5 - 0.5 * Math.cos((shared.iTime.value / 5.0) * Math.PI * 2);

    composer.render();
  }

  // Handle for the console: lets the visualisation be driven from a script, and
  // makes the live analysis values inspectable while tuning.
  window.soundReactiveShapes = { audio, uniforms, shared, state, scenes, composer };

  resize();
  categorySel.value = state.category;
  selectSection(state.section);
  refreshTransport('Press play for the generated track');
  document.body.classList.remove('loading');
  requestAnimationFrame(frame);
}

init().catch((err) => {
  console.error(err);
  const el = document.getElementById('audio-status');
  if (el) el.textContent = `Failed to start: ${err.message}`;
  document.body.classList.remove('loading');
});

  </script>
</body>
</html>
