<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Jacquard — grid sequencer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2316161a'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%23e8e8e4'/%3E%3Crect x='9' y='9' width='4' height='4' fill='%23e8e8e4'/%3E%3C/svg%3E">
<!-- Built from the sources in this directory by build.mjs. Edit those, not this. -->
<style>
/* Flat and monochrome throughout, with the palette and the cell pitch taken from
   mockup.html: a cell is 30x32 with a 4px gutter, the rail is a 2px dot every 7px at
   35%, and a jump link is a 1px grey line offset half a cell so that it reads as a
   layer of its own.

   The chrome is the one place where layout values are the real sizes and no transform
   is applied, which is what keeps 1px borders and corner radii on the pixel grid
   beside a plane that is panned about freely. */

:root {
  --bg: #16161a;
  --note-line: #e8e8e4;
  --note-text: #f2f2ee;
  --marker: #9a9a96;
  --dot: #4e4e54;
  --ctrl-bg: #34343c;
  --ctrl-bg-hover: #44444e;
  --link: #86868c;

  --panel: #1e1e24;
  --panel-line: #3a3a44;
  --label: #9a9a96;
  --fill: #6c6c76;
  --fill-active: #84848e;

  --cell-w: 30px;
  --cell-h: 32px;
  --gap: 4px;
  --row-h: 20px;
  --type: 11px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--note-text);
  font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}

#root { position: fixed; inset: 0; }

/* The plane */

.plane-area {
  position: absolute;
  inset: 0;
  overflow: hidden;
  touch-action: none;
  cursor: default;
}

.visualizer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.plane {
  position: absolute;
  left: 0;
  top: 0;
  transform: translate(0, 0);
}

.cell {
  position: absolute;
  width: var(--cell-w);
  height: var(--cell-h);
  display: grid;
  place-items: center;
  border-radius: 5px;
  user-select: none;
  z-index: 1;
  line-height: 1;
}

.cell.lattice { color: var(--dot); font-size: 13px; }
.cell.marker { color: var(--marker); }

.cell.tile {
  border: 1px solid var(--note-line);
  background: var(--bg);
  color: var(--note-text);
  font-size: 13px;
}

.cell.control-tile:not(.inverted) { background: var(--ctrl-bg); }

.cell.inverted {
  background: var(--note-line);
  color: var(--bg);
}

.cell:not(.inverted):hover { background: #ffffff14; }
.cell.control-tile:not(.inverted):hover { background: var(--ctrl-bg-hover); }
.cell.inverted:hover { background: #ffffff; }

.cell .label { white-space: nowrap; }

.cell .stack {
  display: grid;
  grid-template-rows: 1fr 1fr;
  place-items: center;
  width: 100%;
  height: 100%;
}

.cell .length { font-size: 9px; opacity: 0.7; letter-spacing: 0.02em; }

/* The accidental gutter stands only on the notes that have an accidental: what it
   holds is four 1px strokes, so it is a fixed five pixels rather than a share of the
   type size. */
.cell .accidental {
  position: relative;
  display: inline-block;
  width: 5px;
  height: 1em;
  vertical-align: baseline;
  overflow: visible;
}

.cell .accidental > span {
  position: absolute;
  left: 50%;
  bottom: 0.42em;
  transform: translateX(-50%);
  font-size: 0.62em;
  line-height: 1;
}

/* Chain lines join cells of the same stack, and only those. */
.cell.linked::before {
  content: "";
  position: absolute;
  left: 50%;
  top: calc(-1 * var(--gap) - 1px);
  width: 1px;
  height: calc(var(--gap) + 2px);
  background: var(--note-line);
  transform: translateX(-50%);
}

.cell.playing {
  box-shadow: 0 0 0 1px var(--note-text), 0 0 12px #f2f2ee55;
}

.rail {
  position: absolute;
  height: 2px;
  transform: translateY(-50%);
  background-image: repeating-linear-gradient(to right,
    var(--note-line) 0 2px, transparent 2px 7px);
  opacity: 0.35;
  z-index: 0;
  pointer-events: none;
}

.links {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  fill: none;
  stroke: var(--link);
  stroke-width: 1px;
  stroke-linecap: round;
  stroke-linejoin: round;
  z-index: 0;
  pointer-events: none;
}

.cursor-box, .drop-box {
  position: absolute;
  width: var(--cell-w);
  height: var(--cell-h);
  border-radius: 5px;
  pointer-events: none;
  z-index: 2;
}

.cursor-box { outline: 1px solid var(--note-text); outline-offset: 1px; }
.drop-box { display: none; outline: 1px dashed var(--note-text); outline-offset: 2px; }

/* Columns. The cursor's panels hang from the top right, the send effects on the inside
   of that column, the channels in the one corner the cursor's panels never reach, and
   the live effects across the bottom where both thumbs already are. */

.column {
  position: absolute;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 3;
}

.column.right { top: 8px; right: 8px; width: 232px; max-height: calc(100% - 16px);
                overflow-y: auto; }
.column.inner { top: 8px; right: 252px; width: 200px; max-height: calc(100% - 16px);
                overflow-y: auto; }
.column.left { top: 8px; left: 8px; width: 168px; }

.centre {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 4;
}

.bottom {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;
}

.stack-panels { display: flex; flex-direction: column; gap: 8px; }

/* Panels */

.panel {
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: var(--type);
}

.panel-header {
  height: var(--row-h);
  display: flex;
  align-items: center;
  color: var(--note-text);
  font-size: var(--type);
  letter-spacing: 0.04em;
}

.panel-rule { height: 1px; background: var(--panel-line); }

.heading {
  height: var(--row-h);
  display: flex;
  align-items: center;
  color: var(--label);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 10px;
}

.note { margin: 0; color: var(--label); line-height: 1.4; font-size: 10px; }

.row { display: flex; gap: 4px; align-items: center; }

.transport { display: flex; flex-direction: column; gap: 4px;
             background: var(--panel); border: 1px solid var(--panel-line);
             border-radius: 6px; padding: 8px; }

.switches { display: flex; flex-wrap: wrap; gap: 4px; }

.status { color: var(--label); font-size: 10px; min-height: 12px; }

/* Controls */

.control {
  font-family: inherit;
  font-size: var(--type);
  color: var(--note-text);
  background: var(--ctrl-bg);
  border: 1px solid var(--panel-line);
  border-radius: 3px;
  height: var(--row-h);
  padding: 0 8px;
  cursor: pointer;
  letter-spacing: 0.03em;
}

.control:hover:not(:disabled) { background: var(--ctrl-bg-hover); }
.control:disabled { opacity: 0.35; cursor: default; }

.control.small { padding: 0 6px; font-size: 10px; }
.control.play { height: 26px; font-size: 13px; }
.control.danger { color: #f0c8c8; }

.control.toggle.on, .control.hold.held {
  background: var(--note-line);
  color: var(--bg);
  border-color: var(--note-line);
}

.control.toggle.idle { opacity: 0.4; }

.palette { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

.laps { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }

.control.lap {
  height: 18px;
  padding: 0;
  font-size: 9px;
  color: var(--label);
}

.control.lap.on { background: var(--note-line); color: var(--bg); }

.stepper { display: flex; align-items: center; gap: 4px; height: var(--row-h); }
.stepper .caption { color: var(--label); flex: 0 0 auto; }
.stepper .readout {
  flex: 1;
  min-width: 34px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* A number is a bar, not a field. */

.value-bar {
  position: relative;
  height: var(--row-h);
  background: #2a2a32;
  border: 1px solid var(--panel-line);
  border-radius: 3px;
  display: flex;
  align-items: center;
  padding: 0 6px;
  overflow: hidden;
  cursor: ew-resize;
  user-select: none;
  touch-action: none;
}

.value-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  background: var(--fill);
}

.value-bar:hover .value-fill { background: var(--fill-active); }

.value-label { position: relative; color: var(--note-text); flex: 1; }
.value-readout { position: relative; color: var(--note-text); opacity: 0.85; }

.value-bar.idle .value-label,
.value-bar.idle .value-readout { opacity: 0.4; }
.value-bar.idle .value-fill { opacity: 0.25; }

/* The live effects: six columns of two, the smaller of each pair on top. */

.live-panel { flex-direction: row; gap: 6px; }
.live-column { display: flex; flex-direction: column; gap: 4px; }
.live-column .control { width: 78px; }

/* A fingertip covers about nine millimetres of glass whatever is under it, so what
   grows on a touch screen is the targets and not the air between them. */

@media (pointer: coarse) {
  :root { --row-h: 30px; --type: 13px; }
  .column.right { width: 268px; }
  .column.inner { right: 288px; width: 236px; }
  .live-column .control { width: 92px; }
}

/* ---------------------------------------------------------------------------
   The rack theme.

   The plane is the same plane and the chrome is the same chrome: what this adds
   is the reading that a lane is a module. The ground a lane owns was already a
   rectangle — the rail from the head to the terminator, as deep as its deepest
   stack — so a panel is drawn on it, screwed to a rail, coloured by the channel
   it sounds on, and the jump links become the patch cables they always were.

   Nothing here is a second layout. Every metric is still the one the flat theme
   uses, because the cell pitch is what the whole plane is derived from; what

body[data-theme="rack"] {

  --panel-line: #16161a;

  --fill-active: #f0a63b;

body[data-theme="rack"] .plane-area {

    repeating-linear-gradient(94deg,

    linear-gradient(180deg, #2b1d12 0%, #1d140c 55%, #241810 100%);

/* The module a lane stands on: a panel, four screws, a coloured strip along the
   top and its own name in silkscreen at the bottom left. */
body[data-theme="rack"] .module {
  display: block;
  border-radius: 4px;
  border: 1px solid #0e0e11;
  border-top: 3px solid hsl(var(--hue, 0) 52% 46%);
  background-image:
    radial-gradient(circle 2.5px at 6px 6px, #b6b6bd 45%, #5c5c64 62%, transparent 63%),
    radial-gradient(circle 2.5px at calc(100% - 6px) 6px, #b6b6bd 45%, #5c5c64 62%, transparent 63%),
    radial-gradient(circle 2.5px at 6px calc(100% - 6px), #b6b6bd 45%, #5c5c64 62%, transparent 63%),
    radial-gradient(circle 2.5px at calc(100% - 6px) calc(100% - 6px), #b6b6bd 45%, #5c5c64 62%, transparent 63%),
    repeating-linear-gradient(90deg,
      rgba(255, 255, 255, 0.024) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, #4b4b55 0%, #3c3c46 42%, #33333c 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    inset 0 -1px 0 rgba(0, 0, 0, 0.5),
    0 6px 14px rgba(0, 0, 0, 0.45);
}

body[data-theme="rack"] .module::after {
  content: attr(data-name);
  position: absolute;
  left: 20px;
  bottom: 2px;
  font-size: 8px;
  letter-spacing: 0.18em;
  color: hsl(var(--hue, 0) 30% 78%);
  opacity: 0.55;
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  pointer-events: none;
}

.module { position: absolute; display: none; z-index: 0; pointer-events: none; }

/* A cell is a component screwed to that panel rather than a box drawn on paper. */
body[data-theme="rack"] .cell.tile {
  border-color: rgba(255, 255, 255, 0.32);
  background: linear-gradient(180deg, #232329 0%, #16161b 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.09),
    0 1px 2px rgba(0, 0, 0, 0.55);
  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
}

body[data-theme="rack"] .cell.control-tile:not(.inverted) {
  background: linear-gradient(180deg,
    hsl(var(--hue, 0) 20% 30%) 0%, hsl(var(--hue, 0) 22% 19%) 100%);
}

/* The four cells that do something other than move right are the panel's own
   plate: a lane says what it is at its ends, so those are the ones that carry
   the colour. */
body[data-theme="rack"] .cell.inverted {
  background: linear-gradient(180deg,
    hsl(var(--hue, 0) 58% 62%) 0%, hsl(var(--hue, 0) 62% 44%) 100%);
  border-color: hsl(var(--hue, 0) 45% 72%);
  color: #17110c;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.28);

    0 1px 3px rgba(0, 0, 0, 0.6);

body[data-theme="rack"] .cell.lattice { color: #52453a; }
body[data-theme="rack"] .cell.marker { color: #7e756a; }

   readable across the room. */
body[data-theme="rack"] .cell.playing {
  box-shadow:
    0 0 0 1px hsl(var(--hue, 0) 90% 70%),
    0 0 16px hsl(var(--hue, 0) 95% 58% / 0.75),
    inset 0 0 10px hsl(var(--hue, 0) 90% 55% / 0.35);
}

body[data-theme="rack"] .rail {
  background-image: repeating-linear-gradient(to right,
    hsl(var(--hue, 0) 45% 72%) 0 2px, transparent 2px 7px);
  opacity: 0.5;
}

/* Patch cables: thick, coloured by what travels down them, and hanging over the
   panels rather than ruled between two cells. */
body[data-theme="rack"] .links path {
  stroke: hsl(var(--hue, 0) 65% 58%);
  stroke-width: 3px;
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.55));
}

body[data-theme="rack"] .links .jack {
  fill: #d8d5cd;
  stroke: #14141a;
  stroke-width: 1.5px;
}

body[data-theme="rack"] .cursor-box {
  outline-color: #ffd27a;
  box-shadow: 0 0 10px rgba(255, 190, 90, 0.35);
}

/* The chrome, on the same terms: a panel is a panel. */
body[data-theme="rack"] .panel,
body[data-theme="rack"] .transport {
  border-color: #0e0e11;
  background-image:
    radial-gradient(circle 2.5px at 7px 7px, #b6b6bd 45%, #5c5c64 62%, transparent 63%),
    radial-gradient(circle 2.5px at calc(100% - 7px) 7px, #b6b6bd 45%, #5c5c64 62%, transparent 63%),
    radial-gradient(circle 2.5px at 7px calc(100% - 7px), #b6b6bd 45%, #5c5c64 62%, transparent 63%),
    radial-gradient(circle 2.5px at calc(100% - 7px) calc(100% - 7px), #b6b6bd 45%, #5c5c64 62%, transparent 63%),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.022) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, #474751 0%, #3a3a44 45%, #31313a 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.13),
    0 8px 18px rgba(0, 0, 0, 0.5);
  padding: 10px 12px;
}

body[data-theme="rack"] .panel-header {
  color: #f4f2ec;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.14em;
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.55);
}

body[data-theme="rack"] .panel-rule {
  background: linear-gradient(90deg, #d8912f, rgba(216, 145, 47, 0.15));
  height: 2px;
}

body[data-theme="rack"] .heading,
body[data-theme="rack"] .note,
body[data-theme="rack"] .value-label,
body[data-theme="rack"] .stepper .caption {
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  letter-spacing: 0.08em;
}

/* A bar is a slot cut into the panel with a lamp behind it. */
body[data-theme="rack"] .value-bar {
  background: linear-gradient(180deg, #101014 0%, #1b1b21 100%);
  border-color: #0c0c10;
  box-shadow:
    inset 0 1px 2px rgba(0, 0, 0, 0.8),
    0 1px 0 rgba(255, 255, 255, 0.08);
}

body[data-theme="rack"] .value-fill {
  background:
    repeating-linear-gradient(90deg,
      rgba(0, 0, 0, 0.3) 0 1px, transparent 1px 4px),
    linear-gradient(180deg, #b8791f 0%, #7d4f10 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 210, 140, 0.55),
    0 0 10px rgba(210, 140, 50, 0.35);
}

body[data-theme="rack"] .value-label,
body[data-theme="rack"] .value-readout {
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
}

body[data-theme="rack"] .value-readout {
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  color: #ffd694;
  text-shadow: 0 0 6px rgba(255, 190, 100, 0.5);
}

body[data-theme="rack"] .control {
  background: linear-gradient(180deg, #52525d 0%, #3a3a44 100%);
  border-color: #101014;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.18),
    0 2px 3px rgba(0, 0, 0, 0.45);
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  letter-spacing: 0.06em;
}

body[data-theme="rack"] .control:hover:not(:disabled) {
  background: linear-gradient(180deg, #5e5e6a 0%, #45454f 100%);
}

/* A switch that is on is a lamp, not a swapped pair of colours. */
body[data-theme="rack"] .control.toggle.on,
body[data-theme="rack"] .control.hold.held,
body[data-theme="rack"] .control.lap.on {
  background: linear-gradient(180deg, #ffc86a 0%, #d1830f 100%);
  border-color: #7a4c06;
  color: #1b1206;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.45),

}

body[data-theme="rack"] .control.play {
  background: linear-gradient(180deg, #6f7a5e 0%, #48513a 100%);
  color: #eaf3d8;
}

body[data-theme="rack"] .status {
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  color: #cbb894;
}

body[data-theme="rack"] .live-panel .control {
  height: calc(var(--row-h) + 4px);
}

// the synth can leave holding the wrong number.
function readTile(token, number, version) {
  const colon = token.indexOf(':')
  const head = colon < 0 ? token : token.slice(0, colon)
  const args = colon < 0 ? '' : token.slice(colon + 1)

  switch (head) {
    case 'PABS': return readLock(new AbsoluteParamTile(), args, number, version)

    // A version 3 PACC becomes the relative lock it was a running total of, which is
    // as close as a file from before the change can get.
    case 'PREL':
    case 'PACC':
      return readLock(new RelativeParamTile(), args, number, version)

    case 'GCYC': {
      const parts = args.split(',')
      const gate = new CycleGateTile()
      if (parts.length > 0 && parts[0] !== '') gate.period = readInt(parts[0])
      if (parts.length > 1) readLaps(gate, parts[1])
      return gate
    }

    case 'GPRB':
      return new ProbGateTile(readFloat(args))

    case 'JUMP': return new JumpTile()
  }

  // Anything else has to be a note, which is the one tile whose token is its own
  // value.
  const slash = token.indexOf('/')
  const name = slash < 0 ? token : token.slice(0, slash)

  const note = Pitch.tryParse(name)
  if (note == null) throw fail(number, 'cannot read the tile ' + token)

  return new NoteTile(note, slash < 0 ? 1 : readFloat(token.slice(slash + 1)))
}

// The laps a cycle gate fires on, in either of the two spellings the format has had.
// A run of digits as long as the period is the pattern version 9 writes; anything
// else is the single lap a version 8 file names by number.
function readLaps(gate, text) {
  if (text.length === gate.period && /^[01]+$/.test(text)) {
    gate.pattern = text
    return
  }

  gate.pattern = ''
  gate.setFires(readInt(text), true)
}

// Targets a file may still name that the synth no longer has. This is every key
// ParamTargets has ever dropped, which is what it has to be: a target leaving
// ParamTargets belongs in this list in the same change.
const Retired = ['detune', 'cardecay', 'carsustain']

// A run of key,value pairs, or nothing at all for a lock that holds no parameter.
function readLock(tile, args, number, version) {
  if (args.length === 0) return tile

  const parts = args.split(',')

  for (let i = 0; i < parts.length; i += 2) {
    const target = ParamTargets.parse(parts[i])

    if (target < 0) {
      if (!Retired.includes(parts[i]))
        throw fail(number, 'unknown lock target ' + parts[i])
      continue
    }

    let value = i + 1 < parts.length ? readFloat(parts[i + 1]) : 0

    // An absolute lock holds the parameter itself, so version 10's change of units
    // reaches it exactly as it reaches the patch line. A relative one holds a shift
    // and is left as written.
    if (version < 10 && target === ParamTargets.ModDecay &&
        tile instanceof AbsoluteParamTile) value = decaySlope(value)

    tile.engage(target, value)
  }

  // A lock that named only retired parameters has nothing left to do, so it goes
  // rather than staying on the plane as an empty one. A lock written empty is a
  // different thing and was returned above.
  return tile.isEmpty ? null : tile
}

// Which channel the line is for. A version 2 file has one patch line for the whole
// project, so its first token is already a key=value pair; that line goes into every
// channel, which is exactly what it used to mean.
function readPatchLine(project, tokens, version) {
  if (tokens.length > 1 && !tokens[1].includes('=')) {
    const channel = clampChannel(readInt(tokens[1]))
    readPatch(project.patches.at(channel), tokens, 2, version)
    return
  }

  for (let channel = 1; channel <= Channels; channel++)
    readPatch(project.patches.at(channel), tokens, 1, version)
}

// A version 9 FM decay in seconds as the slope version 10 holds in its place.
//
// The old parameter was the time the modulation took to reach zero along a curve
// that spent five e-foldings getting there, so its time constant was a fifth of it.
// The new one is a plain exponential whose time constant is a tenth of a second at
// the middle of its travel. Equating the two gives this.
const decaySlope = seconds => seconds / (5 * 0.1 + seconds)

function readPatch(patch, tokens, from, version) {
  for (let i = from; i < tokens.length; i++) {
    const [key, text] = split(tokens[i])
    const value = readFloat(text)

    switch (key) {
      case 'level': patch.level = value; break
      case 'pan': patch.pan = value; break
      case 'gate': patch.gateScale = value; break
      case 'mratio': patch.modulatorRatio = value; break
      case 'index': patch.modulationIndex = value; break
      case 'fb': patch.feedback = value; break
      case 'md':
        patch.modulatorDecay = version < 10 ? decaySlope(value) : value
        break
      case 'ca': patch.carrierAttack = value; break
      case 'cr': patch.carrierRelease = value; break
      case 'ps': patch.pitchSweep = value; break
      case 'pd': patch.pitchDecay = value; break
      case 'rsend': patch.reverbSend = value; break
      case 'dsend': patch.delaySend = value; break
    }
  }
}

// The one fx line. Unknown keys are skipped and missing ones keep the default the
// project was created with: a version 6 file has no line here at all and reads as a
// project whose effects have never been touched.
function readFx(fx, tokens) {
  for (let i = 1; i < tokens.length; i++) {
    const [key, text] = split(tokens[i])
    const value = readFloat(text)

    switch (key) {
      case 'rsize': fx.reverbSize = value; break
      case 'rdamp': fx.reverbDamp = value; break
      case 'rwidth': fx.reverbWidth = value; break
      case 'dbeats': fx.delayBeats = value; break
      case 'dfb': fx.delayFeedback = value; break
      case 'dtone': fx.delayTone = value; break
      case 'dspread': fx.delaySpread = value; break
    }
  }
}

function readLimiter(limiter, tokens) {
  for (let i = 1; i < tokens.length; i++) {
    const [key, text] = split(tokens[i])
    const value = readFloat(text)

    switch (key) {
      case 'drive': limiter.drive = value; break
      case 'ceiling': limiter.ceiling = value; break
      case 'attack': limiter.attack = value; break
      case 'release': limiter.release = value; break
    }
  }
}

// Token helpers

function split(token) {
  const equals = token.indexOf('=')
  return equals < 0 ? [token, ''] : [token.slice(0, equals), token.slice(equals + 1)]
}

function arg(tokens, index, number) {
  if (index >= tokens.length) throw fail(number, 'missing argument')
  return tokens[index]
}

function readPoint(text, number) {
  const parts = text.split(',')
  if (parts.length !== 2) throw fail(number, 'expected x,y')
  return point(readInt(parts[0]), readInt(parts[1]))
}

const readInt = text => {
  const value = parseInt(text, 10)
  return Number.isFinite(value) ? value : 0
}

const readFloat = text => {
  const value = parseFloat(text)
  return Number.isFinite(value) ? value : 0
}

const fail = (line, message) => new Error('line ' + (line + 1) + ': ' + message)

Object.assign(__exports, { Version, Extension, write, read });
};
