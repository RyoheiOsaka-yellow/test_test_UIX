'use strict';
const $=s=>document.getElementById(s),canvas=$('view');
function fail(msg,detail){$('error').style.display='block';$('error').textContent=msg;throw Error(detail||msg)}
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
if(!gl)fail('WebGL2を利用できません。最新のブラウザでハードウェアアクセラレーションを有効にして開いてください。');

// Render targets: HDR (half float) when the device can render to it, otherwise RGBA8 with Reinhard encoding.
function tex(w,h,fmt){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texStorage2D(gl.TEXTURE_2D,1,fmt,w,h);for(const[k,v]of[[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);return t}
function rbuf(samples,fmt,w,h){const r=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,r);if(samples)gl.renderbufferStorageMultisample(gl.RENDERBUFFER,samples,fmt,w,h);else gl.renderbufferStorage(gl.RENDERBUFFER,fmt,w,h);return r}
function fbo(color,depth){const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);if(color instanceof WebGLTexture)gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,color,0);else if(color)gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,color);if(depth)gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,depth);const ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;gl.bindFramebuffer(gl.FRAMEBUFFER,null);if(!ok)gl.deleteFramebuffer(f);return ok?f:null}
let HDR=false;if(gl.getExtension('EXT_color_buffer_float')||gl.getExtension('EXT_color_buffer_half_float')){const t=tex(4,4,gl.RGBA16F),f=fbo(t);HDR=!!f;if(f)gl.deleteFramebuffer(f);gl.deleteTexture(t)}
const FMT=HDR?gl.RGBA16F:gl.RGBA8;let SAMPLES=[...(gl.getInternalformatParameter(gl.RENDERBUFFER,FMT,gl.SAMPLES)||[])].find(s=>s<=4)||0;

// ---------- Shaders ----------
const HEAD=`#version 300 es
precision highp float;
#define HDR ${HDR?1:0}
vec3 enc(vec3 c){
#if HDR
return c;
#else
return c/(1.+c);
#endif
}
vec3 dec(vec3 c){
#if HDR
return c;
#else
return c/max(1.-c,vec3(1e-3));
#endif
}
`;
const INST=`layout(location=0)in vec3 p;layout(location=1)in vec3 n;layout(location=2)in float u;layout(location=3)in vec4 i0;layout(location=4)in vec4 i1;layout(location=5)in vec4 i2;layout(location=6)in vec4 i3;uniform mat4 vp;`;
// Instance matrices carry three effect values in their unused bottom row: x = intensity, y = flow phase, z = flow amount.
const VS_SCENE=`#version 300 es
${INST}out vec3 P,N,F;out float U;
void main(){vec3 a=i0.xyz,b=i1.xyz,c=i2.xyz;P=mat3(a,b,c)*p+i3.xyz;N=mat3(a/dot(a,a),b/dot(b,b),c/dot(c,c))*n;U=u;F=vec3(i0.w,i1.w,i2.w);gl_Position=vp*vec4(P,1.);}`;
const VS_SHADOW=`#version 300 es
${INST}void main(){gl_Position=vp*vec4(mat3(i0.xyz,i1.xyz,i2.xyz)*p+i3.xyz,1.);}`;
const FS_SHADOW=`#version 300 es
precision mediump float;void main(){}`;
const FS_SCENE=HEAD+`in vec3 P,N,F;in float U;out vec4 o;
uniform vec3 eye,base,cA,cB,cC;uniform float kind,metal,rough,edge,emitK,emitSel,umode,time,illum,neon,scanY,scanK,rimK;uniform mat4 lightVP;uniform highp sampler2DShadow shadowMap;
vec3 ec(){return emitSel<.5?cA:emitSel<1.5?cB:cC;}
float shade(){vec4 q=lightVP*vec4(P,1.);vec3 s=q.xyz/q.w*.5+.5;if(s.x<0.||s.x>1.||s.y<0.||s.y>1.)return 1.;float r=0.;for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)r+=texture(shadowMap,vec3(s.xy+vec2(x,y)/2048.,s.z-.0012));return mix(.16,1.,r/9.);}
vec3 brdf(vec3 n,vec3 v,vec3 l,vec3 radiance,vec3 base,float r,float m){vec3 h=normalize(v+l);float nv=max(dot(n,v),.001),nl=max(dot(n,l),0.),nh=max(dot(n,h),0.),hv=max(dot(h,v),0.);float a=r*r,aa=a*a;float d=aa/(3.14159*pow(nh*nh*(aa-1.)+1.,2.));float k=(r+1.)*(r+1.)/8.;float g=nv/(nv*(1.-k)+k)*nl/(nl*(1.-k)+k);vec3 f0=mix(vec3(.04),base,m),f=f0+(1.-f0)*pow(1.-hv,5.);return ((1.-f)*(1.-m)*base/3.14159+d*g*f/(4.*nv*max(nl,.001)))*radiance*nl;}
// Synthetic studio: overhead softboxes, neon wall bars and a horizon line for chrome to reflect.
vec3 env(vec3 r,float ro){float w=.015+ro*.3,k=1./(1.+ro*7.);vec3 c=mix(vec3(.001,.0018,.003),vec3(.003,.006,.01),smoothstep(-.4,.6,r.y));
 if(r.y>.05){vec2 q=r.xz/r.y;float up=smoothstep(.05,.3,r.y);
  c+=vec3(3.2,3.4,3.7)*k*smoothstep(.08+w,.08,abs(q.y-.3))*smoothstep(2.6+w*5.,2.6,abs(q.x))*up;
  c+=cA*1.1*k*smoothstep(.04+w,.04,abs(q.y+.5))*smoothstep(2.+w*5.,2.,abs(q.x))*up;
  c+=cC*1.2*k*smoothstep(.03+w,.03,abs(q.x-.9))*smoothstep(1.4+w*4.,1.4,abs(q.y))*up;}
 float az=atan(r.z,r.x);for(int i=0;i<5;i++){float a=-3.+float(i)*1.3,d=abs(mod(az-a+3.14159,6.28318)-3.14159);c+=(i==4?cA*.8:cC*.6)*k*smoothstep(.025+w,.025,d)*smoothstep(.7,.3,abs(r.y-.05));}
 return c+cA*.25*k*exp(-pow((r.y+.03)/(.01+w*.4),2.));}
void main(){float fw=max(fwidth(U),1e-5),el=(1.-smoothstep(.6,1.9,(1.-U)/fw))*(1.-smoothstep(.1,.3,fw));
 vec3 n=normalize(N),v=normalize(eye-P);if(!gl_FrontFacing)n=-n;float nv=clamp(dot(n,v),0.,1.);vec3 r=reflect(-v,n),col;
 if(kind>3.5){float f=pow(1.-nv,3.);col=cA*(f*.6+.01)*emitK*neon+env(r,.04)*f*.25;if(umode>.5&&umode<1.5)col+=cA*el*1.3*neon;o=vec4(enc(col),1.);return;}
 if(kind>2.5){col=mix(ec(),cC,pow(nv,4.))*emitK*F.x*neon*pow(nv,1.5);o=vec4(enc(col),1.);return;}
 if(kind>1.5){o=vec4(enc(ec()*emitK*F.x*neon),1.);return;}
 if(kind>.5){vec3 e=ec()*emitK*F.x*neon;o=vec4(enc(e*(.4+.8*pow(nv,.8))+env(r,.1)*.04),1.);return;}
 vec3 f0=mix(vec3(.04),base,metal),fr=f0+(max(vec3(1.-rough),f0)-f0)*pow(1.-nv,5.)*(.35+.65*metal);
 col=env(r,rough)*fr*illum+base*(1.-metal)*(.006+.02*max(n.y,0.))*illum;
 col+=brdf(n,v,normalize(vec3(-.6,1.,1.2)),vec3(1.7,1.8,2.)*illum,base,rough,metal)*shade();
 col+=brdf(n,v,normalize(vec3(1.,.35,-.9)),cA*.9*illum,base,rough,metal);
 col+=brdf(n,v,normalize(vec3(-1.,-.15,-.2)),cB*.35*illum,base,rough,metal);
 col+=cA*pow(1.-nv,4.)*rimK*neon;
 if(umode>.5&&umode<1.5)col+=cA*F.x*neon*(U>1.5?2.4:edge*el*2.2*(.75+.25*sin(dot(P,vec3(1.3,.7,.9))*2.-time*3.)));
 if(umode>1.5&&abs(F.z)>0.){float g;if(F.x>1.5)g=smoothstep(.07,0.,abs(fract(U*(F.x-2.)*2.5-time*F.y)-.5))*1.4;else{float x=U-F.y;g=exp(-x*x*160.)*2.6+.04;}col+=(F.z>0.?cB:cA)*g*abs(F.z)*neon;}
 if(scanK>0.){float d=P.y-scanY;col+=cA*scanK*neon*(exp(-d*d*700.)*5.+(d>0.?exp(-d*1.6)*(.01+.35*pow(abs(sin(P.y*12.566)),60.)):0.));}
 o=vec4(enc(col),1.);}`;
const VS_FLOOR=`#version 300 es
layout(location=0)in vec3 p;uniform mat4 vp;out vec3 P;void main(){P=p;gl_Position=vp*vec4(p,1.);}`;
// Tron grid: 1 m minor / 5 m major lines, concentric rings under the engine and ripples on every ignition.
const FS_FLOOR=HEAD+`in vec3 P;out vec4 o;uniform vec3 cA,cB;uniform float neon;uniform vec4 rip;
float line(float x,float s,float wd){float w=fwidth(x)/s,g=abs(fract(x/s-.5)-.5)-wd/s;return (1.-smoothstep(0.,w*1.3,g))*smoothstep(.5,.08,w);}
void main(){vec2 q=P.xz;float r=length(q),fade=exp(-r*.05),near=exp(-r*r*.02);
 fade=exp(-r*.075);vec3 c=cA*(max(line(q.x,1.,.002),line(q.y,1.,.002))*.06+max(line(q.x,5.,.008),line(q.y,5.,.008))*.22)*fade;
 c+=cA*line(r,1.5,.004)*.4*near;
 for(int i=0;i<4;i++){float t=rip[i];if(t<0.||t>5.)continue;float R=2.4+t*5.;c+=cB*exp(-pow((r-R)/.07,2.))*exp(-t*.9)*.9*fade;}
 c+=cA*.01*near+vec3(.0004,.0008,.0015);o=vec4(enc(c*neon),1.);}`;
const VS_FULL=`#version 300 es
out vec2 v;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));v=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;
// Bloom: 13-tap downsample with Karis average + soft threshold on the first level, tent upsample back up.
const FS_DOWN=HEAD+`in vec2 v;out vec4 o;uniform sampler2D src;uniform vec2 tx;uniform float first,thr;
vec3 s(float x,float y){return dec(texture(src,v+vec2(x,y)*tx).rgb);}float lum(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
void main(){vec3 a=s(-2.,2.),b=s(0.,2.),c=s(2.,2.),d=s(-2.,0.),e=s(0.,0.),f=s(2.,0.),g=s(-2.,-2.),h=s(0.,-2.),i=s(2.,-2.),j=s(-1.,1.),k=s(1.,1.),l=s(-1.,-1.),m=s(1.,-1.),r;
 if(first>.5){vec3 g0=(a+b+d+e)*.25,g1=(b+c+e+f)*.25,g2=(d+e+g+h)*.25,g3=(e+f+h+i)*.25,g4=(j+k+l+m)*.25;float w0=.125/(1.+lum(g0)),w1=.125/(1.+lum(g1)),w2=.125/(1.+lum(g2)),w3=.125/(1.+lum(g3)),w4=.5/(1.+lum(g4));
  r=(g0*w0+g1*w1+g2*w2+g3*w3+g4*w4)/(w0+w1+w2+w3+w4);float br=max(r.r,max(r.g,r.b)),kn=thr*.5,sf=clamp(br-thr+kn,0.,2.*kn);sf=sf*sf/(4.*kn+1e-4);r*=max(sf,br-thr)/max(br,1e-4);}
 else r=e*.125+(a+c+g+i)*.03125+(b+d+f+h)*.0625+(j+k+l+m)*.125;
 o=vec4(enc(max(r,0.)),1.);}`;
const FS_UP=HEAD+`in vec2 v;out vec4 o;uniform sampler2D src,base;uniform vec2 tx;
vec3 s(float x,float y){return dec(texture(src,v+vec2(x,y)*tx).rgb);}
void main(){vec3 r=(s(-1.,1.)+s(1.,1.)+s(-1.,-1.)+s(1.,-1.)+2.*(s(0.,1.)+s(0.,-1.)+s(-1.,0.)+s(1.,0.))+4.*s(0.,0.))/16.;o=vec4(enc(dec(texture(base,v).rgb)+r*.85),1.);}`;
const FS_COMP=HEAD+`in vec2 v;out vec4 o;uniform sampler2D scene,bloom;uniform float bloomK,time;
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){vec2 d=v-.5;float r2=dot(d,d);vec2 ca=d*r2*.006;
 vec3 c=vec3(dec(texture(scene,v+ca).rgb).r,dec(texture(scene,v).rgb).g,dec(texture(scene,v-ca).rgb).b)+dec(texture(bloom,v).rgb)*bloomK;
 c=aces(c*.95)*(1.-smoothstep(.1,.6,r2)*.5);c=pow(c,vec3(1./2.2));
 c+=(fract(sin(dot(gl_FragCoord.xy+fract(time)*91.,vec2(12.9898,78.233)))*43758.5453)-.5)*(2./255.);o=vec4(c,1.);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))fail('描画の初期化に失敗しました。別のブラウザでお試しください。',gl.getShaderInfoLog(s));return s}
function program(vs,fs){const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))fail('描画の初期化に失敗しました。別のブラウザでお試しください。',gl.getProgramInfoLog(p));const u={};for(let i=0;i<gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);i++){const a=gl.getActiveUniform(p,i);u[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(p,a.name)}return{p,u}}
const SCENE=program(VS_SCENE,FS_SCENE),SHADOW=program(VS_SHADOW,FS_SHADOW),FLOOR=program(VS_FLOOR,FS_FLOOR),DOWN=program(VS_FULL,FS_DOWN),UP=program(VS_FULL,FS_UP),COMP=program(VS_FULL,FS_COMP);
