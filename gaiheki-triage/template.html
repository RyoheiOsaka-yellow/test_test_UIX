<title>外壁写真 仕分けデスク</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* layout: 3つの面だけ。左=物件の列、中央=写真と場所、右=判断。枠と色は最小限、色が付くのは状態と検知だけ。 */
:root{
  --bg:#edf0f4; --surface:#ffffff; --surface2:#f3f5f8; --ink:#15212e; --ink2:#5b6a79; --ink3:#93a0ad; --line:#dfe4ea;
  --accent:#2b3fbf; --accent-ink:#ffffff;
  --auto:#0b7f63; --human:#a86200; --other:#56677a; --ret:#b92e49;
  --photo-bg:#10161d;
  --c-fade:#ffb020; --c-crack:#ff4d6d; --c-lift:#b78cff; --c-joint:#2fd6c0; --c-jointcut:#4da3ff; --c-ext:#e8e8e8; --c-stain:#a5d65c;
  --f-display:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#17202a; --surface2:#1e2934; --ink:#e7edf3; --ink2:#a3b1bf; --ink3:#6f7e8b; --line:#273341;
  --accent:#93a4ff; --accent-ink:#0e141b;
  --auto:#45d1ab; --human:#f3b352; --other:#a6b6c6; --ret:#ff8399; --photo-bg:#070a0e; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#17202a; --surface2:#1e2934; --ink:#e7edf3; --ink2:#a3b1bf; --ink3:#6f7e8b; --line:#273341;
  --accent:#93a4ff; --accent-ink:#0e141b;
  --auto:#45d1ab; --human:#f3b352; --other:#a6b6c6; --ret:#ff8399; --photo-bg:#070a0e; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto}
.muted{color:var(--ink2)}
.label{font-size:12px;color:var(--ink2);font-weight:500}
.b-auto{--k:var(--auto)} .b-human{--k:var(--human)} .b-other{--k:var(--other)} .b-ret{--k:var(--ret)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--k);flex:none;display:inline-block}
.panel{background:var(--surface);border-radius:14px}

.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px;padding-block:18px 16px}
.top h1{font-family:var(--f-display);font-weight:900;font-size:18px;letter-spacing:.02em;margin-right:auto}
.steps{display:flex;gap:8px;font-size:12px;color:var(--ink3)}
.steps li+li::before{content:"›";margin-right:8px}
.steps li.on{color:var(--ink);font-weight:700}
.steps li.done{color:var(--ink2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:9px;font-weight:700;font-size:13px;background:var(--surface2);white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{padding:14px 28px;font-size:15px}
.btn.quiet{background:none;color:var(--ink2);padding:8px 10px;font-weight:500}
.btn.quiet:hover{color:var(--ink)}
.btn kbd{font:500 10px var(--f-mono);opacity:.65}

/* 1 取り込み */
#v-upload{max-width:640px;margin:6vh auto 0;display:grid;gap:22px}
#v-upload h2{font-family:var(--f-display);font-size:26px;font-weight:900;line-height:1.35;text-wrap:balance;word-break:auto-phrase}
.files{display:grid;gap:1px;background:var(--line);border-radius:14px;overflow:hidden}
.files:empty{display:none}
.file{background:var(--surface);padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.file b{word-break:break-all}
.file small{color:var(--ink2);font-size:12px;grid-column:1}
.file .rm{grid-row:1 / span 2;grid-column:2;color:var(--ink3);font-size:18px;width:32px;height:32px;border-radius:8px}
.file .rm:hover{background:var(--surface2);color:var(--ink)}
.file .up{grid-column:1 / -1;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.file .up i{display:block;height:100%;background:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.go{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#v-upload .note{font-size:12px;color:var(--ink2)}

/* 2 検知 */
#v-scan{max-width:980px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 240px;align-items:start}
.scanner{padding:16px;display:grid;gap:12px}
.scan-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.scan-head b{font-family:var(--f-display);font-size:15px}
.stage{position:relative;background:var(--photo-bg);border-radius:10px;overflow:hidden;aspect-ratio:4/3;width:100%;max-height:58vh;margin:0 auto}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.scanline{position:absolute;left:0;right:0;height:18%;top:-18%;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--c-joint) 30%,transparent));border-bottom:2px solid var(--c-joint);animation:scan 1.1s linear infinite;pointer-events:none}
@keyframes scan{to{top:100%}}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s linear}
.scan-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--ink2)}
.lanes{display:grid;gap:8px}
.lane{padding:12px 14px;display:grid;gap:8px}
.lane header{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.lane header .num{margin-left:auto;font-size:18px}
.lane .chips{display:flex;flex-wrap:wrap;gap:3px;min-height:26px}
.lane .chips img{width:32px;height:24px;object-fit:cover;border-radius:3px;animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.3) translateY(-8px);opacity:0}}

/* 3 仕分け */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:14px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--surface);border-radius:12px}
.tab{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink2)}
.tab .num{font-weight:600;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab[aria-selected="true"] .num{color:var(--bg)}
.bar .rev{margin-left:auto;font-size:12px;color:var(--ink2)}

.desk{display:grid;grid-template-columns:264px minmax(0,1fr) 332px;gap:14px;align-items:start}
.list{padding:6px;display:grid;gap:2px;max-height:calc(100vh - 32px);overflow:auto;align-content:start}
.list .lhead{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 4px 10px;min-height:36px;font-size:12px;color:var(--ink2)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:9px;text-align:left;width:100%}
.row:hover{background:var(--surface2)}
.row img{width:52px;height:39px;object-fit:cover;border-radius:5px;background:var(--photo-bg);display:block}
.row b{display:block;font-size:13px;line-height:1.4}
.row span.cm{display:block;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row[aria-current="true"]{background:var(--surface2);box-shadow:inset 3px 0 0 var(--ink)}
.row.decided{opacity:.55}
.row .st{font-size:11px;font-weight:700;color:var(--auto)} .row .st.ret{color:var(--ret)}
.jdg{font-weight:700;color:var(--human)} .jdg.x{color:var(--ret)} .jdg.o{color:var(--auto)}

.work{padding:18px;display:grid;gap:16px;min-width:0}
.bhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.bhead h2{font-family:var(--f-display);font-weight:900;font-size:20px}
.bhead p{font-size:12px;color:var(--ink2)}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}
.shots{display:grid;gap:8px;min-width:0}
.photo{position:relative;background:var(--photo-bg);border-radius:10px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.photo img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.zoom{position:absolute;right:8px;top:8px;font-size:11px;font-weight:500;padding:3px 10px;border-radius:4px;background:rgba(10,14,18,.72);color:#fff}
.zoom:hover{background:rgba(10,14,18,.9)}
.tag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;background:rgba(10,14,18,.72);color:#fff}
.photo .na{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,18,.6);color:#fff;font-weight:700;text-align:center;font-size:13px}
.photo .na small{display:block;font-weight:400;opacity:.85}
.box{position:absolute;border:2px solid var(--c);border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.45);cursor:pointer;transition:background .15s}
.box.low{border-style:dashed}
.box b{position:absolute;left:-2px;top:-2px;background:var(--c);color:#10161d;font:600 11px var(--f-mono);min-width:18px;height:18px;display:grid;place-items:center;border-radius:3px 0 3px 0}
.box.big b{width:auto;padding:0 7px;height:22px;font-size:12px;white-space:nowrap}
.box.hot{background:color-mix(in srgb,var(--c) 28%,transparent)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumb{position:relative;border-radius:7px;overflow:hidden;background:var(--photo-bg);aspect-ratio:4/3;opacity:.75}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.dim img{opacity:.35;filter:grayscale(1)}
.thumb[aria-pressed="true"]{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.thumb span{position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:2px 6px;background:rgba(10,14,18,.72);color:#fff;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan{display:grid;gap:8px;align-content:start;min-width:0}
.plan svg{width:100%;height:auto;display:block;background:var(--surface2);border-radius:10px}
.plan svg text{font-family:var(--f-body);fill:var(--ink2);font-size:13px}
.pin{cursor:pointer}
.plan svg .pin text{fill:#10161d;font:600 13px var(--f-mono)}
.pin.hot circle{stroke:var(--ink);stroke-width:3}
.unk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink2)}
.n{width:18px;height:18px;border-radius:50%;background:var(--c);color:#10161d;display:inline-grid;place-items:center;font:600 10px var(--f-mono);flex:none}
.unk button.hot .n{box-shadow:0 0 0 2px var(--ink)}

.judge{padding:18px;display:grid;gap:16px;min-width:0}
.judge .status{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--k)}
.judge h3{font-family:var(--f-display);font-size:16px;font-weight:700;line-height:1.5;word-break:auto-phrase}
.more{display:grid;gap:4px;font-size:12px;color:var(--ink2)}
.more li{padding-left:12px;position:relative}
.more li::before{content:"";position:absolute;left:0;top:.75em;width:4px;height:4px;border-radius:50%;background:var(--ink3)}
.sec{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.cmt{font-size:15px;font-weight:700;word-break:break-all}
.cmt.empty{color:var(--ret)}
.find{display:grid;gap:2px}
.find li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:5px 6px;margin-inline:-6px;border-radius:7px;cursor:pointer}
.find li:hover,.find li.hot{background:var(--surface2)}
.find small{display:block;color:var(--ink2);font-size:11px}
.conf{font:500 12px var(--f-mono)} .conf.low{color:var(--human)}
details summary{cursor:pointer;font-size:12px;color:var(--ink2);font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"修正する";color:var(--accent);font-weight:700}
details[open] summary::after{content:"閉じる"}
.wb{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wb button{padding:5px 10px;border-radius:999px;font-size:12px;background:var(--surface2);color:var(--ink3)}
.wb button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wbsum{color:var(--ink);font-weight:700}
.acts{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px}
.acts .ret{color:var(--ret)}
.done{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--auto)} .done.ret{color:var(--ret)}

/* 拡大表示 */
.lb{position:fixed;inset:0;z-index:50;background:rgba(7,10,14,.92);color:#fff;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb header{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;font-size:13px}
.lb header b{margin-right:auto;font-family:var(--f-display);font-size:15px}
.lb .lbtn{color:#fff;background:rgba(255,255,255,.12);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:500}
.lb .lbtn:hover{background:rgba(255,255,255,.22)}
.lb .lbtn[aria-pressed="false"]{opacity:.6}
.lb .mid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:0}
.lb .nav{width:44px;height:44px;border-radius:50%;font-size:20px;padding:0}
.lb .nav:disabled{opacity:.2;cursor:default}
.lb .frame{position:relative;aspect-ratio:4/3;width:min(100%,calc((100vh - 190px)*4/3));margin:0 auto;background:#000;border-radius:8px;overflow:hidden}
.lb .frame img{width:100%;height:100%;object-fit:contain;display:block}
.lb footer{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font-size:12px;min-height:22px;color:rgba(255,255,255,.85)}
.lb footer span{display:inline-flex;align-items:center;gap:6px}
.lb footer .n{display:inline-grid}
@media (max-width:760px){.lb .mid{gap:6px} .lb .nav{width:30px;height:30px;font-size:16px}}

/* 自動化マップ */
.map{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));align-items:start}
.col{padding:18px;display:grid;gap:12px;align-content:start}
.col h3{font-family:var(--f-display);font-size:16px;display:flex;align-items:center;gap:8px}
.col>p{font-size:12px;color:var(--ink2)}
.col ul{display:grid;gap:10px}
.col li{font-size:13px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:1px}
.col li small{color:var(--ink2);font-size:12px}
.col li .num{font-size:12px;color:var(--ink2)}

.foot{margin-top:20px;font-size:11px;color:var(--ink3);text-align:center}

@media (max-width:1080px){
  .desk{grid-template-columns:240px minmax(0,1fr)} .judge{grid-column:1 / -1}
  .map{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .desk,.map,#v-scan,.viewer{grid-template-columns:minmax(0,1fr)}
  .list{max-height:none;grid-auto-flow:column;grid-auto-columns:200px;overflow-x:auto}
  .list .lhead{display:none}
  .lanes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar .rev{margin-left:0}
  #v-upload{margin-top:8px} #v-upload h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1>外壁写真 仕分けデスク</h1>
    <ol class="steps" id="steps"><li>取り込み</li><li>自動検知</li><li>仕分け・確認</li></ol>
  </header>

  <main id="v-upload">
    <h2>台帳と写真を読み込み、人が見るべきものだけを選り分けます</h2>
    <div class="files">
      <div class="file"><b>建物写真確認台帳_20261116_1709.xlsx</b>
        <small><span class="num" data-n="rows"></span> 棟・写真 <span class="num" data-n="photos"></span> 枚（外壁・外壁目地の ▲ ×、築13〜14年）</small></div>
      <div class="file"><b>建物不具合写真（参考）.xlsx</b>
        <small>見本写真 <span class="num">64</span> 枚・5分類（AIの判定基準に使用）</small></div>
    </div>
    <div class="go"><button class="btn primary big" id="start">検知を開始</button><button class="btn quiet" id="skip0">結果だけ見る</button></div>
    <p class="note">このデモでは <span class="num" id="nB"></span> 棟・<span class="num" id="nP"></span> 枚を抽出して実行します。</p>
  </main>

  <main id="v-scan" hidden>
    <section class="panel scanner">
      <div class="scan-head"><b id="scName">準備中…</b><span class="num muted" id="scCount"></span></div>
      <div class="stage"><img id="scImg" alt=""><div id="scBoxes"></div><div class="scanline"></div></div>
      <div class="prog"><i id="scProg"></i></div>
      <div class="scan-foot"><span id="scStep"></span><button class="btn quiet" id="skip1">スキップ</button></div>
    </section>
    <section class="lanes" id="lanes"></section>
  </main>

  <main id="v-sort" hidden>
    <div class="bar">
      <div class="tabs" id="tabs" role="tablist"></div>
      <span class="rev" id="rev"></span>
      <button class="btn quiet" id="swMap">自動化マップ</button>
    </div>
    <div class="desk" id="desk">
      <nav class="panel list" id="list" aria-label="物件一覧"></nav>
      <section class="panel work" id="work"></section>
      <aside class="panel judge" id="judge"></aside>
    </div>
    <div class="map" id="map" hidden></div>
  </main>
  <div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="写真の拡大表示">
    <header><b id="lbTitle"></b><span class="num" id="lbCount"></span><button class="lbtn" id="lbBoxes" aria-pressed="true">検知枠</button><button class="lbtn" id="lbClose">閉じる</button></header>
    <div class="mid"><button class="lbtn nav" id="lbPrev" aria-label="前の写真">‹</button><div class="frame" id="lbFrame"></div><button class="lbtn nav" id="lbNext" aria-label="次の写真">›</button></div>
    <footer id="lbFoot"></footer>
  </div>
  <p class="foot">プロトタイプ：検知枠・確信度・仕分け理由は事前に作成したサンプルです。</p>
</div>

<script>
const DATA = /*__DATA__*/null;
const $ = (s, r = document) => r.querySelector(s);
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n) => Number(n).toLocaleString('ja-JP');
const TH = 0.75;
const BK = { human: '人の目で確認', auto: 'AI判定済み', other: '対象外', ret: '差し戻し' };
const ORDER = ['human', 'auto', 'other', 'ret'];
const CAT = { fade: '退色・変色', crack: 'ヒビ・割れ', lift: '浮き・反り・膨れ', joint: '目地劣化', jointcut: '目地切れ・変形', ext: '付帯部・その他', stain: '汚れ・コケ・白華' };
const FIVE = ['fade', 'crack', 'lift', 'joint', 'jointcut'];
const SLOT = ['建物外観', 'その他 写真1', 'その他 写真2'];
const FACE = { N: '北面', S: '南面', E: '東面', W: '西面', SW: '南西角', gable: '妻面', unit102: '102号室前' };
const S = DATA.stats, B = DATA.b;
B.forEach(b => { let n = 0; b.photos.forEach((p, pi) => p.dets.forEach(d => { d.id = ++n; d.pi = pi; })); b.dets = b.photos.flatMap(p => p.dets); });
const by = (k) => B.filter(b => b.bucket === k);
const state = { bucket: 'human', no: null, photo: 0, hot: null, dec: {}, edit: {}, fixOpen: false };

function show(v) {
  const vs = ['upload', 'scan', 'sort'], idx = vs.indexOf(v);
  vs.forEach(k => { $('#v-' + k).hidden = k !== v; });
  [...$('#steps').children].forEach((li, i) => { li.className = i === idx ? 'on' : i < idx ? 'done' : ''; });
  window.scrollTo(0, 0);
}
const jdg = (j) => `<span class="jdg ${j === '×' ? 'x' : (j === '○' || j === '◎') ? 'o' : ''}">${esc(j)}</span>`;
function boxes(p, hot, big) {
  return p.dets.map(d => {
    const [x, y, w, h] = d.box;
    return `<button class="box ${big ? 'big' : ''} ${d.conf < TH ? 'low' : ''} ${hot === d.id ? 'hot' : ''}" data-det="${d.id}" style="--c:var(--c-${d.c});left:${x * 100}%;top:${y * 100}%;width:${w * 100}%;height:${h * 100}%" aria-label="${esc(d.t)}"><b>${big ? `${d.id} ${CAT[d.c]} ${Math.round(d.conf * 100)}%` : d.id}</b></button>`;
  }).join('');
}

/* 1 取り込み */
function initUpload() {
  document.querySelectorAll('[data-n]').forEach(e => e.textContent = fmt(S[e.dataset.n]));
  $('#nB').textContent = B.length; $('#nP').textContent = B.reduce((a, b) => a + b.photos.length, 0);
  $('#start').onclick = runScan; $('#skip0').onclick = openSort;
}

/* 2 検知 */
let scanTimer = null;
function runScan() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return openSort();
  show('scan');
  $('#lanes').innerHTML = ORDER.map(k => `<div class="panel lane b-${k}" data-k="${k}"><header><i class="dot"></i>${BK[k]}<span class="num">0</span></header><div class="chips"></div></div>`).join('');
  const seq = [...B].sort((a, b) => a.no - b.no).flatMap(b => b.photos.map((p, i) => ({ b, p, last: i === b.photos.length - 1 })));
  const pre = 20; let tick = 0;
  clearInterval(scanTimer);
  scanTimer = setInterval(() => {
    tick++;
    if (tick <= pre) {
      const t = tick / pre;
      $('#scName').textContent = '台帳を読み込み中…';
      $('#scStep').textContent = t < .5 ? `写真を抽出 ${fmt(Math.round(S.photos * t * 2))} 枚` : `台帳の行と紐付け ${fmt(Math.round(S.rows * (t - .5) * 2))} 棟`;
      $('#scProg').style.width = (t * 12) + '%'; return;
    }
    const i = tick - pre - 1;
    if (i >= seq.length) {
      clearInterval(scanTimer); $('#scName').textContent = '仕分けが完了しました'; $('#scStep').textContent = '';
      setTimeout(() => { if (!$('#v-scan').hidden) openSort(); }, 900); return;
    }
    const { b, p, last } = seq[i];
    $('#scImg').src = p.src;
    $('#scBoxes').innerHTML = p.kind === 'na' ? `<span class="tag">対象外：${esc(p.label)}</span>` : boxes(p);
    $('#scName').textContent = `${b.name}・${SLOT[p.slot]}`;
    $('#scCount').textContent = `${i + 1} / ${seq.length}`;
    $('#scStep').textContent = '見本写真・BKコメントと照合して仕分け中';
    $('#scProg').style.width = (12 + (i + 1) / seq.length * 88) + '%';
    if (last) {
      const lane = $(`.lane[data-k="${b.bucket}"]`);
      $('.num', lane).textContent = +$('.num', lane).textContent + 1;
      $('.chips', lane).appendChild(el(`<img src="${b.photos[0].src}" alt="">`));
    }
  }, 130);
  $('#skip1').onclick = () => { clearInterval(scanTimer); openSort(); };
}

/* 3 仕分け */
function openSort() { show('sort'); select(by(state.bucket)[0].no, true); renderSort(); }
const cur = () => B.find(b => b.no === state.no);
const baseVals = (b) => Object.fromEntries(FIVE.map(c => [c, b.dets.some(d => d.c === c && d.conf >= TH)]));
const wbVals = (b) => state.edit[b.no] || baseVals(b);
function renderSort() {
  $('#tabs').innerHTML = ORDER.map(k => `<button class="tab b-${k}" role="tab" aria-selected="${state.bucket === k}" data-k="${k}"><i class="dot"></i>${BK[k]}<span class="num">${by(k).length}</span></button>`).join('');
  const hs = by('human');
  $('#rev').innerHTML = `目視確認 <b class="num">${hs.filter(b => state.dec[b.no]).length} / ${hs.length}</b>`;
  renderList(); renderDetail();
}
function renderList() {
  const items = by(state.bucket), left = items.filter(b => !state.dec[b.no]).length;
  $('#list').innerHTML = `<div class="lhead"><span>${items.length} 棟</span>${state.bucket === 'auto' && left ? `<button class="btn quiet" id="bulk">まとめて確定</button>` : ''}</div>` + items.map(b => {
    const d = state.dec[b.no];
    return `<button class="row ${d ? 'decided' : ''}" data-no="${b.no}" aria-current="${b.no === state.no}"><img src="${b.photos[0].src}" alt="">
      <span><b>${esc(b.name)}</b><span class="cm">${b.comment === '0' ? 'コメント未入力' : esc(b.comment)}</span></span>
      ${d ? `<span class="st ${d === 'ret' ? 'ret' : ''}">${d === 'ret' ? '差戻' : '済'}</span>` : jdg(b.now)}</button>`;
  }).join('');
  if ($('#bulk')) $('#bulk').onclick = () => { items.forEach(b => state.dec[b.no] = state.dec[b.no] || 'ok'); renderSort(); };
}
function planSVG(b) {
  const X0 = 50, X1 = 250, Y0 = 44, Y1 = 116, pos = { N: [150, Y0], S: [150, Y1], E: [X1, 80], W: [X0, 80], SW: [X0, Y1], gable: [X1, 80], unit102: [X0 + 200 * 1.5 / 4, Y1] };
  const used = {};
  const pins = b.dets.filter(d => d.face).map(d => {
    let [x, y] = pos[d.face]; const n = used[d.face] = (used[d.face] || 0) + 1;
    if (n > 1) { if (d.face === 'N' || d.face === 'S') x += (n - 1) * 26; else y -= (n - 1) * 26; }
    return `<g class="pin ${state.hot === d.id ? 'hot' : ''}" data-det="${d.id}" tabindex="0" role="button" aria-label="${esc(FACE[d.face] + ' ' + d.t)}">
      <circle cx="${x}" cy="${y}" r="12" fill="var(--c-${d.c})" stroke="var(--surface2)" stroke-width="2"/><text x="${x}" y="${y + 4.5}" text-anchor="middle">${d.id}</text></g>`;
  }).join('');
  return `<svg viewBox="14 8 272 148" role="img" aria-label="建物の模式配置図">
    <rect x="${X0}" y="${Y0}" width="${X1 - X0}" height="${Y1 - Y0}" rx="2" fill="var(--surface)" stroke="var(--ink3)" stroke-width="1.5"/>
    <text x="150" y="26" text-anchor="middle">北</text><text x="150" y="146" text-anchor="middle">南</text>
    <text x="26" y="84" text-anchor="middle">西</text><text x="274" y="84" text-anchor="middle">東</text>${pins}</svg>`;
}
function renderDetail() {
  const b = cur(); if (!b) return;
  const p = b.photos[state.photo] || b.photos[0];
  const unk = b.dets.filter(d => !d.face), located = b.dets.length - unk.length;
  $('#work').innerHTML = `
    <div class="bhead"><h2>${esc(b.name)}</h2>
      <p>${esc(b.office)}・${esc(b.struct)}・築${esc(b.age)}・前回 ${jdg(b.prev)} → 今回 ${jdg(b.now)}</p></div>
    <div class="viewer">
      <div class="shots">
        <div class="photo"><img src="${p.src}" alt="${SLOT[p.slot]}"><span class="tag">${SLOT[p.slot]}</span><button class="zoom" data-zoom>拡大</button>
          ${p.kind === 'na' ? `<div class="na"><div>外壁の写真ではありません<small>「${esc(p.label)}」と判定し、検知から除外</small></div></div>` : boxes(p, state.hot)}</div>
        <div class="thumbs">${b.photos.map((x, i) => `<button class="thumb ${x.kind === 'na' ? 'dim' : ''}" aria-pressed="${i === state.photo}" data-pi="${i}"><img src="${x.src}" alt="${SLOT[x.slot]}">${x.kind === 'na' ? `<span>対象外・${esc(x.label)}</span>` : ''}</button>`).join('')}</div>
      </div>
      <div class="plan"><span class="label">場所${located ? '' : '（コメントに記載なし）'}</span>${planSVG(b)}
        ${unk.length && located ? `<div class="unk"><span>位置不明</span>${unk.map(d => `<button data-det="${d.id}" class="${state.hot === d.id ? 'hot' : ''}" style="--c:var(--c-${d.c})"><span class="n">${d.id}</span></button>`).join('')}</div>` : ''}
        <span class="label" style="font-weight:400">コメントの方位から配置した模式図です。</span>
      </div>
    </div>`;

  const extra = b.why.slice(1).map(w => w[1]);
  if (b.prev !== b.now) extra.push(`前回 ${b.prev} から今回 ${b.now} に判定が変化`);
  if (b.struct === '#N/A' && b.bucket !== 'ret') extra.push('構造区分が #N/A（建物マスタと不整合）');
  const v = wbVals(b), ed = !!state.edit[b.no], d = state.dec[b.no], on = FIVE.filter(c => v[c]);
  $('#judge').className = 'panel judge b-' + b.bucket;
  $('#judge').innerHTML = `
    <div style="display:grid;gap:8px"><div class="status"><i class="dot"></i>${BK[b.bucket]}</div>
      <h3>${esc(b.why[0][1])}</h3>
      ${extra.length ? `<ul class="more">${extra.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}</div>
    <div class="sec"><span class="label">現地コメント</span><div class="cmt ${b.comment === '0' ? 'empty' : ''}">${b.comment === '0' ? '未入力（0）' : esc(b.comment)}</div></div>
    <div class="sec"><span class="label">AIの検知</span>
      ${b.dets.length ? `<ul class="find">${b.dets.map(x => `<li data-det="${x.id}" class="${state.hot === x.id ? 'hot' : ''}" style="--c:var(--c-${x.c})"><span class="n">${x.id}</span>
        <span>${esc(x.t)}<small>${CAT[x.c]}${x.face ? '・' + FACE[x.face] : ''}</small></span><span class="conf ${x.conf < TH ? 'low' : ''}">${Math.round(x.conf * 100)}%</span></li>`).join('')}</ul>` : '<span class="muted">検知なし</span>'}</div>
    <div class="sec"><details ${state.fixOpen || ed ? 'open' : ''}><summary><span>台帳に記入：<span class="wbsum">${on.length ? on.map(c => CAT[c]).join('、') : 'なし'}</span>${ed ? '（修正済み）' : ''}</span></summary>
      <div class="wb">${FIVE.map(c => `<button data-cat="${c}" aria-pressed="${v[c]}">${CAT[c]}</button>`).join('')}</div></details></div>
    ${d ? `<div class="done ${d === 'ret' ? 'ret' : ''}"><span>${d === 'ret' ? '現地へ差し戻しました' : d === 'fix' ? '修正して確定しました' : '確定しました'}</span><button class="btn quiet" data-act="undo">取り消す</button></div>`
        : `<div class="acts"><button class="btn primary" data-act="ok">${ed ? '修正して確定' : '確定'} <kbd>A</kbd></button><button class="btn ret" data-act="ret">差し戻し <kbd>R</kbd></button></div>`}`;
  $('#judge details').ontoggle = (e) => { state.fixOpen = e.target.open; };
}
function setHot(id) { const d = cur().dets.find(x => x.id === id); state.hot = id; if (d) state.photo = d.pi; renderDetail(); }
function act(a) {
  const b = cur();
  if (a === 'undo') delete state.dec[b.no];
  else { state.dec[b.no] = a === 'ret' ? 'ret' : state.edit[b.no] ? 'fix' : 'ok'; const nx = by(state.bucket).find(x => !state.dec[x.no]); if (nx) select(nx.no, true); }
  renderSort();
}
function select(no, quiet) {
  state.no = no; state.hot = null; state.fixOpen = false;
  const i = cur().photos.findIndex(p => p.dets.length); state.photo = i > 0 ? i : 0;
  if (!quiet) { renderList(); renderDetail(); }
}
function move(dir) { const items = by(state.bucket), n = items[items.findIndex(b => b.no === state.no) + dir]; if (n) { select(n.no); const c = $(`.row[data-no="${n.no}"]`); if (c) c.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } }
function setView(map) { $('#desk').hidden = map; $('#map').hidden = !map; $('#swMap').textContent = map ? '← 仕分けに戻る' : '自動化マップ'; }

/* 拡大表示 */
let lbBoxes = true, lbFrom = null;
function renderLb() {
  const b = cur(), p = b.photos[state.photo];
  $('#lbTitle').textContent = `${b.name}・${SLOT[p.slot]}${p.kind === 'na' ? '（対象外：' + p.label + '）' : ''}`;
  $('#lbCount').textContent = `${state.photo + 1} / ${b.photos.length}`;
  $('#lbFrame').innerHTML = `<img src="${p.src}" alt="${SLOT[p.slot]}">${lbBoxes ? boxes(p, state.hot, true) : ''}`;
  $('#lbFoot').innerHTML = p.dets.length ? p.dets.map(d => `<span style="--c:var(--c-${d.c})"><span class="n">${d.id}</span>${esc(d.t)}</span>`).join('') : '<span>この写真に検知はありません</span>';
  $('#lbBoxes').setAttribute('aria-pressed', lbBoxes); $('#lbBoxes').hidden = !p.dets.length;
  $('#lbPrev').disabled = state.photo === 0; $('#lbNext').disabled = state.photo === b.photos.length - 1;
}
function openLb() { lbFrom = document.activeElement; $('#lb').hidden = false; renderLb(); $('#lbClose').focus(); }
function closeLb() { $('#lb').hidden = true; renderDetail(); if (lbFrom && lbFrom.isConnected) lbFrom.focus(); }
function lbMove(d) { const n = state.photo + d; if (n < 0 || n >= cur().photos.length) return; state.photo = n; state.hot = null; renderLb(); }
function initLb() {
  $('#lbClose').onclick = closeLb; $('#lbPrev').onclick = () => lbMove(-1); $('#lbNext').onclick = () => lbMove(1);
  $('#lbBoxes').onclick = () => { lbBoxes = !lbBoxes; renderLb(); };
  $('#lb').onclick = (e) => { if (e.target.id === 'lb' || e.target.classList.contains('mid')) return closeLb(); const t = e.target.closest('[data-det]'); if (t) { state.hot = +t.dataset.det; renderLb(); } };
}

function initSort() {
  $('#tabs').onclick = (e) => { const t = e.target.closest('.tab'); if (!t) return; state.bucket = t.dataset.k; select(by(state.bucket)[0].no, true); setView(false); renderSort(); };
  $('#list').onclick = (e) => { const c = e.target.closest('.row'); if (c) select(+c.dataset.no); };
  $('#v-sort').addEventListener('click', (e) => {
    if (e.target.closest('[data-zoom]') || e.target.matches('.photo img')) return openLb();
    const t = e.target.closest('[data-det]'); if (t) return setHot(+t.dataset.det);
    const th = e.target.closest('.thumb'); if (th) { state.photo = +th.dataset.pi; state.hot = null; return renderDetail(); }
    const a = e.target.closest('[data-act]'); if (a) return act(a.dataset.act);
    const c = e.target.closest('[data-cat]'); if (c) { const b = cur(), v = { ...wbVals(b) }; v[c.dataset.cat] = !v[c.dataset.cat]; const same = FIVE.every(k => v[k] === baseVals(b)[k]); if (same) delete state.edit[b.no]; else state.edit[b.no] = v; state.fixOpen = true; delete state.dec[b.no]; renderSort(); }
  });
  $('#v-sort').addEventListener('keydown', (e) => { const t = e.target.closest('.pin'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); setHot(+t.dataset.det); } });
  document.addEventListener('keydown', (e) => {
    if (!$('#lb').hidden) {
      if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') lbMove(-1); else if (e.key === 'ArrowRight') lbMove(1);
      return;
    }
    if ($('#v-sort').hidden || !$('#map').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'j' || e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (k === 'k' || e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (k === 'a' && !state.dec[state.no]) act('ok');
    else if (k === 'r' && !state.dec[state.no]) act('ret');
  });
  $('#swMap').onclick = () => setView($('#map').hidden);
  renderMap();
}
function renderMap() {
  const n = (k) => `<span class="num">${fmt(S[k] || 0)} 件 / ${fmt(S.rows)} 棟</span>`, kw = (k) => `<span class="num">コメント該当 ${fmt(S[k])} 件</span>`;
  const cols = [
    ['auto', '自動でできる', 'ルールと照合だけで完結', [
      ['台帳の行と写真の紐付け', `写真 ${fmt(S.photos)} 枚をセル位置から対応付け`, ''],
      ['コメント未入力の検出', '「0」や空欄', n('noComment')],
      ['建物マスタ不整合の検出', '構造区分が #N/A', n('structNA')],
      ['前回判定からの悪化', '○・◎ → ▲・×', n('worsened')],
      ['写真枚数の不足', '「その他 写真2」なし', n('twoPhotos')],
      ['5分類外の振り分け', '水切り・モール、汚れ・コケ・白華などのみ', n('outOfFive')],
      ['対象外写真の除外', '駐車場・植栽・掲示板など', ''],
    ]],
    ['auto', 'AIで判定できる', '接写があり確信度75%以上なら自動記入', [
      ['目地切れ・変形', '破断や隙間は形が明確', kw('kw_jointcut')],
      ['ヒビ・割れ', '柄の強い外壁材では精度が落ちる', kw('kw_crack')],
      ['目地劣化', 'シーリングの痩せ・ひび', kw('kw_joint')],
      ['工事中・足場の検知', '修繕対応中として別管理', ''],
      ['コメントの5分類への分類', '自由記述を分類', `<span class="num">分類不能 ${fmt(S.unclassified)} 件</span>`],
    ]],
    ['human', '人の目が必要', 'AIは候補と根拠を示し、人が決める', [
      ['×判定（要修繕）の確定', '費用が発生する判断', n('batsu')],
      ['○ から × への2段階悪化', '誤入力か急な劣化か', n('worsened2')],
      ['退色・変色', '天候・露出で見え方が変わる', kw('kw_fade')],
      ['浮き・反り・膨れ', '凹凸は正対写真に写りにくい', kw('kw_lift')],
      ['コメントと写真の不一致', '記載にない不具合／写っていない箇所', ''],
    ]],
    ['ret', '今のデータではできない', '運用の変更が必要', [
      ['撮影位置の特定', '方位・位置情報も図面もない', ''],
      ['寸法・クラック幅', '写真は193×145pxの縮小版', ''],
      ['写っていない箇所の判定', '再撮影の依頼まで', ''],
      ['前回写真との比較', '前回分の写真がない', ''],
    ]],
  ];
  $('#map').innerHTML = cols.map(([k, t, d, items]) => `<section class="panel col b-${k}"><h3><i class="dot"></i>${t}</h3><p>${d}</p><ul>${items.map(i => `<li><b>${i[0]}</b><small>${i[1]}</small>${i[2]}</li>`).join('')}</ul></section>`).join('');
}

initUpload(); initSort(); initLb(); show('upload');
</script>
