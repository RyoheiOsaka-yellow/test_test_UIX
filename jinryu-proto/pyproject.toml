[project]
name = "jinryu"
version = "0.1.0"
description = "人流ポテンシャル評価プロトタイプ: メッシュ人流を建物・道路リンクに再配分し、不動産・自治体向けスコアを返すエンジン"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "networkx>=3.3",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "matplotlib>=3.9",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
jinryu = "jinryu.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jinryu"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/jinryu/cli.py" = ["B008"]  # typer.Option をデフォルト引数に置く慣用

[tool.pytest.ini_options]
testpaths = ["tests"]
