<title>人流ポテンシャル 岡山</title>
<meta name="description" content="1kmメッシュ人流を建物・街路に再配分した通行量推定。岡山市中心部、サーバ不要の単一HTMLデモ" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" />
<style>
/*__MAPLIBRE_CSS__*/
:root {
  --bg:#101820; --panel:#172230; --panel2:#0d141c; --fg:#e8eef4; --muted:#93a1b0; --line:#2b3a4a;
  --accent:#f2a93b; --accent-ink:#1a1206; --good:#3ecf7a; --warn:#e6c04a; --bad:#ef6b6b;
  --font: "Noto Sans JP", -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#101820; } }
:root[data-theme="dark"] { --bg:#101820; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--fg); font-family:var(--font); font-size:13px; line-height:1.5; overflow:hidden; }
* { box-sizing:border-box; }
#topbar { display:flex; align-items:center; gap:16px; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
.brand { font-weight:700; font-size:15px; letter-spacing:.02em; } .brand small { color:var(--muted); font-weight:400; font-size:11px; margin-left:8px; }
.ctl { display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--muted); }
.ctl select, .ctl button, input.num { background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:3px 6px; font-size:12px; font-family:inherit; }
.ctl button, button.act { cursor:pointer; background:var(--accent); color:var(--accent-ink); border:none; font-weight:700; }
.ctl button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:400; }
button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
#main { display:flex; height:calc(100% - 46px); }
#map { flex:1; min-width:0; }
#panel { width:400px; max-width:45vw; overflow:auto; background:var(--panel); border-left:1px solid var(--line); padding:14px 16px; }
#panel h2 { font-size:15px; margin:0 0 8px; text-wrap:balance; } #panel h3 { font-size:12px; margin:14px 0 6px; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; }
.note { color:var(--muted); font-size:12px; }
.kpi { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0; }
.kpi div { background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
.kpi .v { font-size:21px; font-weight:700; font-family:var(--mono); font-variant-numeric:tabular-nums; } .kpi .l { color:var(--muted); font-size:11px; }
.bars { display:flex; gap:6px; align-items:flex-end; height:90px; margin:6px 0 20px; }
.bars div { flex:1; background:#3b82f6; position:relative; min-height:2px; border-radius:2px 2px 0 0; }
.bars div span { position:absolute; bottom:-16px; left:0; right:0; text-align:center; font-size:10px; color:var(--muted); }
.bars div b { position:absolute; top:-16px; left:0; right:0; text-align:center; font-size:10px; font-family:var(--mono); }
.mix { display:flex; height:14px; border-radius:3px; overflow:hidden; margin:4px 0; } .mix div { height:100%; }
.mixl { display:flex; gap:10px; font-size:11px; color:var(--muted); flex-wrap:wrap; } .sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin-right:3px; }
table.t { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; } table.t td, table.t th { padding:3px 4px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
table.t tr.row { cursor:pointer; } table.t tr.row:hover { background:#22303f; }
.tw { overflow-x:auto; }
input.num { width:78px; }
.conf-high { color:var(--good) } .conf-mid { color:var(--warn) } .conf-low { color:var(--bad) }
#panel-sources { margin-top:18px; border-top:1px solid var(--line); padding-top:8px; font-size:11px; color:var(--muted); }
.lg { display:inline-block; width:26px; height:6px; margin-right:6px; vertical-align:middle; border-radius:3px; }
.gov-only, .re-only { display:none; } body.gov .gov-only { display:inline; } body.realestate .re-only { display:inline; }
button.small { background:var(--accent); color:var(--accent-ink); border:none; border-radius:4px; padding:4px 10px; cursor:pointer; font-weight:700; font-family:inherit; }
button.small.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:400; }
.maplibregl-popup-content { color:#111; font-size:12px; }
.maplibregl-ctrl-attrib { font-size:10px; }
@media (max-width: 760px) { #main { flex-direction:column; } #panel { width:100%; max-width:none; height:45%; border-left:none; border-top:1px solid var(--line); } #map { height:55%; } }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
<!--BODY-->
<header id="topbar">
  <div class="brand">人流ポテンシャル評価 <small>岡山市中心部 · v0.1 スタンドアロン</small></div>
  <div class="ctl">
    <label>モード <select id="mode"><option value="realestate">不動産</option><option value="gov">自治体</option></select></label>
    <label>期間 <select id="period"></select></label>
    <label>平休 <select id="daytype"><option value="weekday">平日</option><option value="holiday">休日</option></select></label>
    <label>時間帯 <select id="timeband"><option value="all">終日</option><option value="day">昼（11–14時台）</option><option value="night">深夜（1–4時台）</option></select></label>
    <label class="gov-only">比較 <select id="periodB"></select> <button id="btnCompare">A→B 差分</button> <button id="btnCompareOff" class="ghost">解除</button></label>
    <label class="re-only"><button id="btnGap">低利用ギャップ検索</button></label>
    <label><input type="checkbox" id="chk3d" checked /> 建物3D</label>
    <label><input type="checkbox" id="chkSites" checked /> 実測地点</label>
  </div>
</header>
<div id="main">
  <div id="map"></div>
  <aside id="panel">
    <div id="panel-empty">
      <h2>使い方</h2>
      <p><b>不動産モード</b>: 建物をクリック → 前面道路の推定通行量・エリア内順位・時間帯プロファイル・来街者構成・簡易売上試算。「低利用ギャップ検索」で通行は多いのに使われていない建物を抽出。</p>
      <p><b>自治体モード</b>: 期間 A/B を選び「差分」で街路通行量の変化を表示。街路をクリックで A/B の値。</p>
      <p class="note">すべて公開統計データからの<b>推定値</b>です。このファイルは単体で動作し、地図データを内蔵しています。</p>
      <div id="legend"></div>
      <div id="calib"></div>
    </div>
    <div id="panel-report" hidden></div>
    <div id="panel-sources"></div>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.0.38/dist.min.js"></script>
<script>
const DATA = /*__DATA__*/;
const BASEMAP = { url: "__BASEMAP_URI__", coords: /*__BASEMAP_COORDS__*/ };
</script>
<script>
(function () {
  const { MapboxOverlay, GeoJsonLayer, PolygonLayer, PathLayer, ScatterplotLayer } = deck;
  const $ = (id) => document.getElementById(id);
  const P = DATA.area.periods;
  const state = { mode: "realestate", period: P[0], periodB: P[P.length - 1], dayType: "weekday", timeBand: "all", compare: false };
  const comboIdx = (q, d, b) => DATA.combos.indexOf(`${q}|${d}|${b}`);
  const fmt = (v, d = 0) => (v == null || Number.isNaN(v) ? "—" : Number(v).toLocaleString("ja-JP", { maximumFractionDigits: d }));
  const usageColor = { retail: [249, 115, 22], office: [59, 130, 246], residential: [148, 163, 184], mixed: [234, 179, 8], hotel: [168, 85, 247], public: [20, 184, 166], industrial: [100, 116, 139], other: [120, 120, 120] };
  const usageJa = { retail: "商業", office: "業務", residential: "住宅", mixed: "店舗併用住宅", hotel: "宿泊", public: "公共", industrial: "工業・倉庫", other: "その他" };
  const pctColor = (p) => { const t = Math.max(0, Math.min(1, (p || 0) / 100)); const s = [[37, 99, 235], [34, 197, 94], [250, 204, 21], [249, 115, 22], [220, 38, 38]]; const i = Math.min(3, Math.floor(t * 4)), f = t * 4 - i; return s[i].map((c, k) => Math.round(c + (s[i + 1][k] - c) * f)); };
  const divColor = (r) => { if (r == null || !isFinite(r)) return [160, 160, 160, 120]; const t = Math.max(-1, Math.min(1, Math.log2(r))); return t < 0 ? [Math.round(255 + 200 * t), Math.round(255 + 120 * t), 255, 220] : [255, Math.round(255 - 200 * t), Math.round(255 - 220 * t), 220]; };

  // ---- データ展開 ----
  const links = DATA.links.map((l) => { const path = []; for (let i = 0; i < l[4].length; i += 2) path.push([l[4][i], l[4][i + 1]]); return { id: l[0], name: l[1], type: l[2], conf: l[3], path, flows: l[5] }; });
  const linkById = new Map(links.map((l) => [l.id, l]));
  const bo = DATA.buildings.origin, bs = DATA.buildings.scale;
  const buildings = DATA.buildings.items.map((b) => { const ring = []; for (let i = 0; i < b[11].length; i += 2) ring.push([bo[0] + b[11][i] * bs, bo[1] + b[11][i + 1] * bs]); ring.push(ring[0]); return { id: b[0], usage: b[1], floors: b[2], height: b[3] || b[2] * 3.5, gfa: b[4], zoning: b[5], front: b[6], popDay: b[7], popNight: b[8], gap: b[9], gfaEst: b[10], ring }; });
  const bById = new Map(buildings.map((b) => [b.id, b]));
  const sites = DATA.sites.map((s) => ({ id: s[0], name: s[1], kind: s[2], block: s[3], direction: s[4], lon: s[5], lat: s[6], obsPeriod: s[7], obsWeekday: s[8] }));
  // 組合せごとの順位（パーセンタイル）を遅延計算
  const sortedCache = {};
  const sortedFlows = (k) => sortedCache[k] || (sortedCache[k] = links.map((l) => l.flows[k]).sort((a, b) => a - b));
  const pctOf = (k, v) => { const arr = sortedFlows(k); let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < v) lo = m + 1; else hi = m; } return (100 * lo) / arr.length; };
  const curK = () => comboIdx(state.period, state.dayType, state.timeBand);
  const cmpK = () => comboIdx(state.periodB, state.dayType, state.timeBand);

  // ---- 地図 ----
  const bb = DATA.area.bbox;
  const map = new maplibregl.Map({
    container: "map",
    style: { version: 8, sources: { base: { type: "image", url: BASEMAP.url, coordinates: BASEMAP.coords } },
      layers: [{ id: "bg", type: "background", paint: { "background-color": "#1a2430" } }, { id: "base", type: "raster", source: "base", paint: { "raster-opacity": 0.8, "raster-saturation": -0.7, "raster-brightness-max": 0.5 } }] },
    center: [(bb[0] + bb[2]) / 2, (bb[1] + bb[3]) / 2 - 0.002], zoom: 14.6, pitch: 45, bearing: -10, antialias: true, attributionControl: false,
  });
  map.addControl(new maplibregl.NavigationControl(), "top-left");
  map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: "地理院タイル | © OpenStreetMap contributors | 人流: 国土交通省 人流オープンデータ（Agoop換算人口） | 建物: PLATEAU 岡山市 | 通行量: 岡山市（CC BY 4.0）" }));
  const overlay = new MapboxOverlay({ interleaved: false, layers: [] });
  map.addControl(overlay);

  function render() {
    const k = curK(), kb = cmpK(), cmp = state.compare;
    const layers = [new PathLayer({
      id: "links", data: links, pickable: true, widthUnits: "meters", widthMinPixels: 1, getPath: (l) => l.path,
      getColor: (l) => { if (cmp) { const a = l.flows[k], b = l.flows[kb]; return divColor(a > 0 ? b / a : null); } const v = l.flows[k]; return v > 0 ? [...pctColor(pctOf(k, v)), 230] : [90, 90, 90, 60]; },
      getWidth: (l) => cmp ? 3 + Math.min(12, Math.abs(l.flows[kb] - l.flows[k]) / 400) : 1.5 + Math.sqrt(l.flows[k] || 0) / 6,
      onClick: (info) => info.object && onLinkClick(info.object), updateTriggers: { getColor: [k, kb, cmp], getWidth: [k, kb, cmp] },
    })];
    if ($("chk3d").checked) layers.push(new PolygonLayer({
      id: "buildings", data: buildings, pickable: true, extruded: true, opacity: 0.55, getPolygon: (b) => b.ring, getElevation: (b) => b.height || 6,
      getFillColor: (b) => [...(usageColor[b.usage] || [120, 120, 120]), 200], onClick: (info) => info.object && showReport(info.object.id),
    }));
    if ($("chkSites").checked) layers.push(new ScatterplotLayer({
      id: "sites", data: sites, pickable: true, radiusUnits: "meters", getRadius: 12, getPosition: (s) => [s.lon, s.lat],
      getFillColor: (s) => (s.kind === "street" ? [255, 255, 255, 230] : [255, 255, 255, 110]), getLineColor: [0, 0, 0, 200], stroked: true, lineWidthMinPixels: 1.5, onClick: (info) => info.object && showSite(info.object),
    }));
    overlay.setProps({ layers, getTooltip: tooltip });
  }
  function tooltip({ object, layer }) {
    if (!object) return null;
    const k = curK();
    if (layer.id === "links") { if (state.compare) { const a = object.flows[k], b = object.flows[cmpK()]; return `${object.name || "(無名)"}\nA ${fmt(a)} → B ${fmt(b)} 人/日（×${a > 0 ? (b / a).toFixed(2) : "—"}）`; } const v = object.flows[k]; return `${object.name || "(無名)"} [${object.type}]\n推定 ${fmt(v)} 人/日（上位 ${fmt(100 - pctOf(k, v))}%）信頼度 ${object.conf}`; }
    if (layer.id === "buildings") return `${usageJa[object.usage] || object.usage} ${object.floors}F 延床 ${fmt(object.gfa)}m²\n滞在人口(平日昼) ${object.popDay == null ? "—(秘匿)" : fmt(object.popDay)} 人`;
    if (layer.id === "sites") return `実測 ${object.id} ${object.name}\n${object.obsPeriod || ""} 平日平均 ${fmt(object.obsWeekday)} 人/日`;
    return null;
  }

  // ---- パネル ----
  function showPanel(html) { $("panel-empty").hidden = true; const r = $("panel-report"); r.hidden = false; r.innerHTML = html; const b = $("back"); if (b) b.onclick = closePanel; }
  function closePanel() { $("panel-report").hidden = true; $("panel-empty").hidden = false; }
  const conf = (c) => `<span class="conf-${c}">${{ high: "高（較正地点 150m 以内）", mid: "中（400m 以内）", low: "低" }[c] || c}</span>`;
  const linksNear = (b) => { // 前面リンク: front_link と、その両端を共有するリンクは含めない（簡易に front のみ）
    return b.front && linkById.has(b.front) ? [linkById.get(b.front)] : []; };

  function showReport(bid, sales) {
    const b = bById.get(bid); if (!b) return;
    const ls = linksNear(b); const q = state.period; const gov = state.mode === "gov";
    const flowAt = (d, tb) => { const k = comboIdx(q, d, tb); return ls.length ? Math.max(...ls.map((l) => l.flows[k])) : 0; };
    const kMain = comboIdx(q, "weekday", "all"); const vMain = flowAt("weekday", "all"); const pct = pctOf(kMain, vMain);
    const prof = [["weekday", "day"], ["weekday", "night"], ["holiday", "day"], ["holiday", "night"]].map(([d, tb]) => ({ d, tb, v: flowAt(d, tb) }));
    const maxv = Math.max(...prof.map((x) => x.v), 1);
    const bars = prof.map((x) => `<div style="height:${Math.max(2, (100 * x.v) / maxv)}%"><b>${fmt(x.v)}</b><span>${x.d === "weekday" ? "平日" : "休日"}${x.tb === "day" ? "昼" : "深夜"}</span></div>`).join("");
    const mix = DATA.origin_mix[q] || []; const mixColors = ["#3b82f6", "#22c55e", "#eab308", "#ef4444"];
    const s = Object.assign({}, DATA.sales, sales || {});
    const cust = Math.round(vMain * s.capture_rate * s.business_days_per_month), yen = Math.round(cust * s.spend_per_customer_yen);
    const c = ls.length ? ls[0].conf : "low";
    showPanel(`
      <h2>${gov ? "街区レポート" : "区画レポート"} <span class="note">${q}</span></h2>
      <div class="note">${usageJa[b.usage] || ""} ${b.floors}F / 延床 ${fmt(b.gfa)} m²${b.gfaEst ? "（推定）" : ""} / ${b.zoning || ""} / 建物ID ${b.id}</div>
      <div class="kpi">
        <div><div class="v">${fmt(vMain)}</div><div class="l">前面道路 推定通行量（平日・終日, 人/日）</div></div>
        <div><div class="v">上位 ${fmt(100 - pct)}%</div><div class="l">エリア内順位（パーセンタイル ${fmt(pct)}）</div></div>
        <div><div class="v">${fmt(flowAt("holiday", "all"))}</div><div class="l">休日・終日（人/日）</div></div>
        <div><div class="v">${b.popDay == null ? "—" : fmt(b.popDay)}</div><div class="l">建物滞在人口 推定（平日昼, 人）</div></div>
      </div>
      <div class="note">信頼度: ${conf(c)}</div>
      <h3>時間帯プロファイル</h3><div class="bars">${bars}</div>
      <h3>来街者構成（市区町村単位・昼）</h3>
      <div class="mix">${mix.map((x, i) => `<div style="width:${(x.share || 0) * 100}%;background:${mixColors[i]}"></div>`).join("")}</div>
      <div class="mixl">${mix.map((x, i) => `<span><span class="sw" style="background:${mixColors[i]}"></span>${x.label} ${fmt((x.share || 0) * 100, 1)}%</span>`).join("")}</div>
      <div class="note">人流オープンデータは市区町村単位の居住地区分のみ。区画単位の構成は商用データで置換予定。</div>
      ${gov ? "" : `
      <h3>低利用ギャップ</h3><div>ギャップスコア <b>${fmt(b.gap, 1)}</b> <span class="note">（通行順位 − 滞在密度順位。高いほど「通行は多いのに使われていない」）</span></div>
      <h3>簡易売上試算 <span class="note" style="text-transform:none">ユーザー入力の仮定に基づく試算</span></h3>
      <div class="note">入店率 <input class="num" id="capture" type="number" step="0.001" value="${s.capture_rate}"> × 客単価 <input class="num" id="spend" type="number" step="100" value="${s.spend_per_customer_yen}"> 円 × 営業日 <input class="num" id="days" type="number" value="${s.business_days_per_month}"> <button class="small" id="recalc">再計算</button></div>
      <div class="kpi"><div><div class="v">${fmt(cust)}</div><div class="l">月間来店 推計（人）</div></div><div><div class="v">¥${fmt(yen)}</div><div class="l">月商 試算</div></div></div>
      <div class="note">推定通行量 × 入店率 × 営業日数 × 客単価。保証値ではありません。</div>`}
      <div style="margin-top:12px"><button class="small" onclick="window.print()">印刷/PDF</button> <button class="small ghost" id="back">閉じる</button></div>`);
    const rc = $("recalc"); if (rc) rc.onclick = () => showReport(bid, { capture_rate: +$("capture").value, spend_per_customer_yen: +$("spend").value, business_days_per_month: +$("days").value });
  }
  function onLinkClick(l) {
    const k = curK();
    if (state.compare) { const kb = cmpK(), a = l.flows[k], b = l.flows[kb]; showPanel(`<h2>街路の変化 <span class="note">${state.period} → ${state.periodB}</span></h2><div class="note">${l.name || "(無名)"} / link ${l.id}</div>
      <div class="kpi"><div><div class="v">${fmt(a)}</div><div class="l">A: ${state.period}（人/日）</div></div><div><div class="v">${fmt(b)}</div><div class="l">B: ${state.periodB}（人/日）</div></div><div><div class="v">${b - a > 0 ? "+" : ""}${fmt(b - a)}</div><div class="l">差分</div></div><div><div class="v">×${a > 0 ? (b / a).toFixed(2) : "—"}</div><div class="l">変化率</div></div></div>
      <div class="note">${areaChangeNote()}</div><div style="margin-top:12px"><button class="small ghost" id="back">閉じる</button></div>`); }
    else { const v = l.flows[k]; showPanel(`<h2>街路 <span class="note">${state.period}</span></h2><div class="note">${l.name || "(無名)"} [${l.type}] link ${l.id}</div>
      <div class="kpi"><div><div class="v">${fmt(v)}</div><div class="l">推定通行量（${state.dayType === "weekday" ? "平日" : "休日"}・${state.timeBand}, 人/日）</div></div><div><div class="v">上位 ${fmt(100 - pctOf(k, v))}%</div><div class="l">エリア内順位</div></div></div>
      <div class="note">信頼度: ${conf(l.conf)}</div><div style="margin-top:12px"><button class="small ghost" id="back">閉じる</button></div>`); }
  }
  function showSite(s) { showPanel(`<h2>実測地点 ${s.id}</h2><div>${s.name}（${s.direction}／${s.kind}）</div><div class="kpi"><div><div class="v">${fmt(s.obsWeekday)}</div><div class="l">実測 平日平均 24h（${s.obsPeriod || "—"}）</div></div></div><div class="note">岡山市 市内中心部歩行者通行量データ（AIカメラ, CC BY 4.0）。地下街・入退場・広場地点は較正に使っていません。</div><div style="margin-top:12px"><button class="small ghost" id="back">閉じる</button></div>`); }
  function areaChangeNote() { const k = curK(), kb = cmpK(); let a = 0, b = 0; for (const l of links) { a += l.flows[k]; b += l.flows[kb]; } return `エリア全体の変化率: ×${a > 0 ? (b / a).toFixed(2) : "—"}（${state.dayType === "weekday" ? "平日" : "休日"}・${state.timeBand}）。2019→2021 はコロナ禍の影響が主因。施策（例: ハレまち通り 1 車線化 2022〜）の評価には 2022 年以降の人流データが必要。`; }
  function runGap() {
    const items = DATA.gap_top[state.period] || DATA.gap_top[P[0]];
    const rows = items.map((x) => `<tr class="row" data-id="${x.building_id}" data-lon="${x.centroid_lon}" data-lat="${x.centroid_lat}"><td>${usageJa[x.usage_class] || x.usage_class}</td><td>${x.floors}F</td><td>${fmt(x.gfa)}</td><td>${fmt(x.front_flow)}</td><td>${fmt(x.flow_pct)}</td><td>${fmt(x.density_pct)}</td><td><b>${fmt(x.gap_score, 1)}</b></td></tr>`).join("");
    showPanel(`<h2>低利用ギャップ検索 <span class="note">${state.period} 平日</span></h2><div class="note">前面通行量のエリア内順位（%）が高く、延床あたり滞在人口の順位（%）が低い商業・業務系建物。行クリックで地図移動＋レポート。</div>
      <div class="tw"><table class="t"><tr><th>用途</th><th>階</th><th>延床m²</th><th>前面通行量</th><th>通行%</th><th>密度%</th><th>ギャップ</th></tr>${rows}</table></div><div style="margin-top:12px"><button class="small ghost" id="back">閉じる</button></div>`);
    document.querySelectorAll("tr.row").forEach((tr) => tr.onclick = () => { map.flyTo({ center: [+tr.dataset.lon, +tr.dataset.lat], zoom: 17.5 }); showReport(tr.dataset.id); });
  }
  function runCompare() { state.compare = true; render(); showPanel(`<h2>施策前後の比較 <span class="note">${state.period} → ${state.periodB}</span></h2><div class="note">青＝減少、赤＝増加（線の太さ＝差分の大きさ）。街路をクリックで A/B の値。</div><div class="note" style="margin-top:8px">${areaChangeNote()}</div><div style="margin-top:12px"><button class="small ghost" id="back">閉じる</button></div>`); }

  // ---- 初期化 ----
  const c = DATA.calibration;
  $("period").innerHTML = P.map((p) => `<option value="${p}">${p}</option>`).join(""); $("periodB").innerHTML = $("period").innerHTML; $("period").value = state.period; $("periodB").value = state.periodB;
  $("calib").innerHTML = `<h3>較正状況</h3><div class="note">実測 ${c.n_sites ?? "—"} 観測（街路 9 地点 × 平休）に対する Spearman: in-sample ${c.spearman_in_sample ?? "—"} / 空間ブロックCV ${c.spearman_block_cv ?? "—"}。距離抵抗 half=${c.half_distance_m ?? "—"}m。<br/>建物 ${fmt(DATA.area.counts.buildings)} 棟・街路リンク ${fmt(DATA.area.counts.links)} 本。</div>`;
  $("legend").innerHTML = `<h3>凡例</h3><div class="note"><span class="lg" style="background:rgb(37,99,235)"></span>通行量 下位 → <span class="lg" style="background:rgb(250,204,21)"></span> → <span class="lg" style="background:rgb(220,38,38)"></span>上位（エリア内パーセンタイル、線の太さ＝通行量）<br/>建物の高さ＝階数、色＝用途（<span style="color:rgb(249,115,22)">商業</span>・<span style="color:rgb(59,130,246)">業務</span>・<span style="color:rgb(148,163,184)">住宅</span>・<span style="color:rgb(234,179,8)">店舗併用</span>・<span style="color:rgb(20,184,166)">公共</span>）<br/>○ 実測地点（岡山市 AIカメラ）</div>`;
  $("panel-sources").innerHTML = `<b>出典</b>: ${DATA.sources.map((s) => s.credit || s.name).join(" / ")}<br/><b>免責</b>: ${DATA.disclaimer.replace(/\n/g, " ")}`;
  function setMode(m) { state.mode = m; document.body.classList.remove("gov", "realestate"); document.body.classList.add(m); if (m !== "gov" && state.compare) { state.compare = false; render(); } }
  $("mode").onchange = (e) => setMode(e.target.value);
  $("period").onchange = (e) => { state.period = e.target.value; state.compare = false; render(); };
  $("periodB").onchange = (e) => { state.periodB = e.target.value; if (state.compare) render(); };
  $("daytype").onchange = (e) => { state.dayType = e.target.value; render(); };
  $("timeband").onchange = (e) => { state.timeBand = e.target.value; render(); };
  $("chk3d").onchange = render; $("chkSites").onchange = render;
  $("btnGap").onclick = runGap; $("btnCompare").onclick = runCompare; $("btnCompareOff").onclick = () => { state.compare = false; render(); closePanel(); };
  setMode("realestate");
  map.on("load", render);
})();
</script>
