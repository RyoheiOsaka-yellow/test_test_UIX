# 福岡エリアの係数（config/coefficients.yaml を上書き）
#
# 福岡市「歩行者交通量等調査」217地点（平日）を教師に推定。目的関数は順位相関（Spearman）。
# 地下歩行空間（天神地下街など 257 リンク・7.2km）を含むネットワークで学習している。
#
# 検証（学習に使っていない地区での順位相関）:
#   地下あり: 天神で学習→博多 0.341 / 博多で学習→天神 0.359   加重平均 0.352
#   地下なし: 天神で学習→博多 0.170 / 博多で学習→天神 0.371   加重平均 0.299
#   → 地下をモデルに入れる効果は +0.05（天神側で特に大きい）
# 空間ブロック交差検証（フォールド内順位相関の加重平均）: 手置き 0.26 → 学習後 0.32
#
# 読み取れること: 街路の歩行者量は延床面積より「店舗・飲食の密度」と駅で決まる。
# 業務用途の集中係数は極端に低く、距離抵抗の半減距離は約 180m と手置き 450m よりかなり局所的。
# 再推定: JINRYU_AREA=fukuoka JINRYU_DATA_DIR=data/fukuoka uv run python notebooks/fit_coefficients.py
od:
  dest_weight:
    retail: 5.553
    office: 0.044
    public: 3.288
    hotel: 0.823
    mixed: 0.185
    other: 0.383
  poi_weight: 653.0
  station_origin_weight: 0.2972
  residential_trip_rate:
    weekday: 0.1033
    holiday: 0.1209
  external:
    origin_factor: 1.232
    dest_factor: 1.232
  half_distance_m: 179
  underground_weight: 50.0
assign:
  stochastic:
    draws: 6
    cost_sigma: 0.5
    seed: 42
calibrate:
  half_distance_grid:
  - 150
  - 180
  - 240
  - 320
  exclude_site_kinds:
  - underground
  - entrance
  - plaza
  max_site_resid_m: 40
