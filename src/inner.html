<title>MORPHOSIS — interactive point cloud</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; }
  #stage { position:fixed; inset:0; width:100%; height:100%; touch-action:none;
           cursor:crosshair; background:#000; }
  .hud { position:fixed; z-index:10; color:#cfd3dc; pointer-events:none;
         font-family:"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
         text-shadow:0 0 6px rgba(0,0,0,.9); user-select:none; -webkit-user-select:none; }
  #stats { top:calc(12px + env(safe-area-inset-top)); left:calc(14px + env(safe-area-inset-left));
           font-size:clamp(8.5px, 1.5vw, 11px); line-height:1.55; letter-spacing:.04em;
           opacity:.85; white-space:pre; }
  #title { top:calc(12px + env(safe-area-inset-top)); right:calc(16px + env(safe-area-inset-right));
           text-align:right; }
  #title .t1 { font-size:clamp(14px, 2.4vw, 17px); letter-spacing:.14em; color:#e8eaf0; }
  #title .t2 { font-size:clamp(8px, 1.4vw, 10px); letter-spacing:.22em; opacity:.55; margin-top:2px; }
  #shapeName { top:calc(60px + env(safe-area-inset-top)); right:calc(16px + env(safe-area-inset-right));
               font-size:clamp(10px, 1.7vw, 12px); letter-spacing:.18em;
               color:#9aa3b5; text-align:right; transition:opacity .4s; }
  #caption { left:0; right:0; bottom:calc(48px + env(safe-area-inset-bottom));
             text-align:center; font-style:italic;
             font-size:clamp(10.5px, 1.8vw, 12.5px); color:#b9bfcc; opacity:.85;
             padding:0 24px; transition:opacity .5s; }
  #hint { left:0; right:0; bottom:calc(26px + env(safe-area-inset-bottom));
          text-align:center; font-size:clamp(8.5px, 1.5vw, 10px);
          letter-spacing:.14em; color:#6d7489; opacity:.7; }
  #fx { left:0; right:0; bottom:calc(92px + env(safe-area-inset-bottom));
        text-align:center; font-size:clamp(13px, 2.2vw, 15px);
        letter-spacing:.3em; color:#fff; opacity:0; transition:opacity .55s;
        text-shadow:0 0 14px rgba(255,120,220,.8); }
  @media (max-width: 420px) {
    #shapeName { top:calc(54px + env(safe-area-inset-top)); }
    #caption { padding:0 14px; }
  }
  #fallback { position:fixed; inset:0; display:none; place-items:center; color:#889;
          font-family:sans-serif; font-size:14px; }
</style>

<canvas id="stage"></canvas>
<div id="stats" class="hud"></div>
<div id="title" class="hud"><div class="t1">MORPHOSIS</div><div class="t2">POINT CLOUD FIELD</div></div>
<div id="shapeName" class="hud"></div>
<div id="caption" class="hud"></div>
<div id="fx" class="hud"></div>
<div id="hint" class="hud">指で触れるとランダムに反応 ／ ダブルタップで変形</div>
<div id="fallback">WebGL2 が利用できない環境です。</div>

<script>
'use strict';
(function(){

// ---------- setup ----------
const canvas = document.getElementById('stage');
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false,
  premultipliedAlpha:true, powerPreference:'high-performance' });
if (!gl) { document.getElementById('fallback').style.display = 'grid'; return; }

const params = new URLSearchParams(location.search);
const coarse = matchMedia('(pointer: coarse)').matches;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COUNT = Math.max(1000, Math.min(600000,
  parseInt(params.get('n') || (coarse ? 150000 : 280000), 10)));

const DPR = Math.min(coarse ? 1.8 : 2, window.devicePixelRatio || 1);
const FOV = 55 * Math.PI / 180;
const MORPH_SEC = 4.2;
const AUTO_SEC = 7.5;
const NTOUCH = 8;

// ---------- shaders ----------
const VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPosFrom;
layout(location=1) in vec3 aPosTo;
layout(location=2) in vec3 aColFrom;
layout(location=3) in vec3 aColTo;
layout(location=4) in vec4 aRand;
uniform mat4 uProj, uModel;
uniform float uTime, uMorph, uPress, uSpin, uSize, uCamDist;
uniform vec3 uPointer, uSweep;
uniform int uMode;
uniform vec4 uTouches[${NTOUCH}];
out vec3 vColor;
out float vAlpha;

float hash1(float n){ return fract(sin(n)*43758.5453123); }

void main(){
  // morph timing: a wave sweeps through space (mixed with per-grain randomness)
  float spatial = clamp(dot(aPosFrom, uSweep)*0.5 + 0.5, 0.0, 1.0);
  float delay = mix(spatial, aRand.x, 0.45);
  float stag = 0.7;
  float tt = clamp(uMorph*(1.0+stag) - delay*stag, 0.0, 1.0);
  float e = tt*tt*tt*(tt*(tt*6.0-15.0)+10.0);

  // curved travel: each grain arcs along its own bowed path
  vec3 travel = aPosTo - aPosFrom;
  vec3 rv = vec3(aRand.y, aRand.z, aRand.w) - 0.5;
  vec3 bowDir = normalize(cross(travel, rv) + vec3(1e-5));
  float bow = e*(1.0-e)*4.0;
  vec3 p = mix(aPosFrom, aPosTo, e)
         + bowDir * bow * min(length(travel), 1.2) * (0.07 + 0.32*aRand.x);

  // gentle streaming while in flight
  p += bow * 0.05 * vec3(
    sin(p.y*2.0 + uTime*0.8 + aRand.y*6.2831),
    sin(p.z*2.2 + uTime*0.7 + aRand.z*6.2831),
    sin(p.x*1.8 + uTime*0.9 + aRand.w*6.2831));

  // slow fluid drift (shared flow field)
  p += 0.014 * vec3(
    sin(p.y*1.8 + uTime*0.60) + sin(p.z*2.3 + uTime*0.42),
    sin(p.z*1.9 + uTime*0.50) + sin(p.x*2.1 + uTime*0.38),
    sin(p.x*1.7 + uTime*0.55) + sin(p.y*2.4 + uTime*0.47));
  // fine granular trickle — the "sand" shimmer
  p += 0.009 * vec3(
    sin(p.x*6.0 + uTime*0.9 + aRand.y*6.2831),
    sin(p.y*5.5 - uTime*0.8 + aRand.z*6.2831),
    sin(p.z*6.5 + uTime*0.7 + aRand.w*6.2831));

  vec3 wp = (uModel * vec4(p, 1.0)).xyz;
  float glow = 0.0;

  if (uMode == 1) { // follow / attract
    vec3 d = uPointer - wp;
    float f = uPress * exp(-dot(d,d)/0.55);
    wp += d * f * (0.78 + 0.15*sin(uTime*2.2 + aRand.y*6.2831));
    vec3 tang = cross(vec3(0.0,0.0,1.0), d);
    wp += tang * f * 0.28 * sin(uTime*1.8 + aRand.z*6.2831);
    glow += f * 0.7;
  } else if (uMode == 2) { // vortex
    vec2 off = wp.xy - uPointer.xy;
    float r2 = dot(off,off);
    float fall = exp(-r2/0.9);
    float ang = uSpin * (0.12 + fall);
    float c = cos(ang), s = sin(ang);
    wp.xy = uPointer.xy + mat2(c,-s,s,c) * off;
    wp.z += fall * uPress * 0.22 * sin(uTime*3.2 + aRand.y*6.2831);
    glow += fall * uPress * 0.55;
  }

  // touch ring buffer: w>0 scatter burst, w<0 expanding ripple
  for (int i = 0; i < ${NTOUCH}; i++) {
    vec4 tch = uTouches[i];
    if (tch.w == 0.0) continue;
    float age = uTime - tch.z;
    if (age < 0.0 || age > 4.5) continue;
    vec2 off = wp.xy - tch.xy;
    if (tch.w < 0.0) { // ripple
      float amp = -tch.w * exp(-age*0.9);
      float r = length(off);
      float band = exp(-pow(r - age*1.5, 2.0)/0.035);
      vec2 dirO = off / max(r, 1e-3);
      wp.xy += dirO * band * amp * 0.30;
      wp.z  += band * amp * 0.45 * (0.4 + aRand.w);
      glow += band * amp * 0.5;
      continue;
    }
    float w = tch.w * exp(-age*1.5);
    if (w < 0.004) continue;
    float infl = exp(-dot(off,off)/0.5);
    if (infl < 0.01) continue;
    float fi = float(i);
    vec3 rdir = normalize(vec3(
      hash1(aRand.x*37.0 + fi*17.0) - 0.5,
      hash1(aRand.y*57.0 + fi*23.0) - 0.5,
      (hash1(aRand.z*71.0 + fi*31.0) - 0.5)*0.8));
    vec3 outward = normalize(vec3(off, 0.15*(aRand.w-0.5)) + vec3(1e-4));
    wp += normalize(mix(outward, rdir, 0.65)) * infl * w * (0.9 + 1.8*aRand.w);
    glow += infl * w * 0.4;
  }

  vec4 mv = vec4(wp.xy, wp.z - uCamDist, 1.0);
  gl_Position = uProj * mv;
  float dist = max(0.2, -mv.z);
  // size skewed small: mostly fine grains, a few brighter specks
  gl_PointSize = clamp(uSize * (0.45 + 1.15*aRand.w*aRand.w) / dist, 1.0, 4.0);

  vColor = mix(aColFrom, aColTo, e)
         + glow * vec3(0.95, 0.9, 0.85)
         + bow * 0.12 * vec3(0.55, 0.45, 0.9);
  vAlpha = 0.42 + 0.45*aRand.z;
}`;

const FS = `#version 300 es
precision mediump float;
in vec3 vColor;
in float vAlpha;
out vec4 frag;
void main(){
  vec2 uv = gl_PointCoord - 0.5;
  float d = dot(uv, uv);
  if (d > 0.25) discard;
  float a = smoothstep(0.24, 0.05, d);
  a *= a * vAlpha; // crisp grain core, fast falloff
  frag = vec4(vColor * a, a);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const U = {};
for (const n of ['uProj','uModel','uTime','uMorph','uPress','uSpin','uSize',
                 'uCamDist','uPointer','uSweep','uMode','uTouches'])
  U[n] = gl.getUniformLocation(prog, n);

// ---------- random palettes ----------
const rnd = Math.random;
const g = () => (rnd() + rnd() + rnd() - 1.5) * 2.0; // ~N(0,1)
const TAU = Math.PI * 2;

function hsl2rgb(h, s, l){
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs((h/60) % 2 - 1));
  const m = l - c/2;
  const [r, gg, b] =
    h < 60  ? [c,x,0] : h < 120 ? [x,c,0] : h < 180 ? [0,c,x] :
    h < 240 ? [0,x,c] : h < 300 ? [x,0,c] : [c,0,x];
  return [r+m, gg+m, b+m];
}

function randomPalette(){
  const h0 = rnd() * 360;
  const t = rnd();
  let h1, h2;
  if (t < 0.4)      { h1 = h0 + 28 + rnd()*40; h2 = h0 + 180 + (rnd()*60 - 30); }
  else if (t < 0.7) { h1 = h0 + 120; h2 = h0 + 240; }
  else              { h1 = h0 + 180; h2 = h0 + 90 + rnd()*40; }
  return [
    hsl2rgb(h0, 0.75 + 0.25*rnd(), 0.55 + 0.10*rnd()),
    hsl2rgb(h1, 0.70 + 0.30*rnd(), 0.60 + 0.12*rnd()),
    hsl2rgb(h2, 0.90,              0.68),
  ];
}

function colorize(col, i, t, pal){
  const [c1, c2, c3] = pal;
  let r, gr, b;
  if (rnd() < 0.12) { [r, gr, b] = c3; }
  else {
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    r  = c1[0] + (c2[0]-c1[0]) * t;
    gr = c1[1] + (c2[1]-c1[1]) * t;
    b  = c1[2] + (c2[2]-c1[2]) * t;
  }
  const br = 0.65 + rnd()*0.65;
  col[i*3]   = Math.min(1, r*br);
  col[i*3+1] = Math.min(1, gr*br);
  col[i*3+2] = Math.min(1, b*br);
}

function fuzz(){ return rnd() < 0.13 ? 0.4 : 0.035; } // dust halo vs surface

// ---------- shapes ----------
const SHAPES = [
  { name:'KNOT-FIELD',
    caption:'位相結び目が自己交差を回避しながら再構成中。',
    gen(pos, col, i, pal){
      const u = rnd()*TAU, s = 0.42, f = fuzz();
      const x = (2 + Math.cos(3*u)) * Math.cos(2*u);
      const y = (2 + Math.cos(3*u)) * Math.sin(2*u);
      const z = Math.sin(3*u);
      pos[i*3]   = x*s + g()*(f*1.4);
      pos[i*3+1] = z*s*1.4 + g()*(f*1.4);
      pos[i*3+2] = y*s + g()*(f*1.4);
      colorize(col, i, u/TAU, pal);
    } },
  { name:'HYPERSPHERE',
    caption:'球面調和が安定解に収束。表面張力は臨界値未満。',
    gen(pos, col, i, pal){
      let x = g(), y = g(), z = g();
      const n = Math.hypot(x, y, z) || 1;
      const r = 1.08, f = fuzz();
      pos[i*3]   = x/n*r + g()*f;
      pos[i*3+1] = y/n*r + g()*f;
      pos[i*3+2] = z/n*r + g()*f;
      colorize(col, i, (y/n + 1) * 0.5, pal);
    } },
  { name:'GALAXY-ARM',
    caption:'角運動量が保存されたまま渦状腕が展開する。',
    gen(pos, col, i, pal){
      if (rnd() < 0.14) {
        pos[i*3] = g()*0.2; pos[i*3+1] = g()*0.14; pos[i*3+2] = g()*0.2;
        colorize(col, i, 0.05, pal);
        return;
      }
      const arm = i % 3;
      const r = 1.38 * Math.pow(rnd(), 0.62);
      const a = -r*2.1 + arm*(TAU/3) + g()*0.2*(0.35 + r*0.5);
      pos[i*3]   = r * Math.cos(a) + g()*0.02;
      pos[i*3+1] = g() * 0.05 * (1.6 - r);
      pos[i*3+2] = r * Math.sin(a) + g()*0.02;
      colorize(col, i, Math.min(1, r/1.35), pal);
    } },
  { name:'TOPO-SHEET',
    caption:'高可塑性の多様体が折り畳みを開始。トポロジーは維持される。',
    gen(pos, col, i, pal){
      const u = (rnd()*2-1) * 1.3, v = (rnd()*2-1) * 1.3, f = fuzz()*0.8;
      const y = 0.42*Math.sin(2.2*u + 0.8)*Math.cos(2.0*v)
              + 0.18*Math.sin(3.4*(u+v));
      pos[i*3]   = u + g()*f;
      pos[i*3+1] = y + g()*f;
      pos[i*3+2] = v + g()*f;
      colorize(col, i, (y + 0.6) / 1.2, pal);
    } },
  { name:'DOUBLE-HELIX',
    caption:'二重らせんの塩基対密度が同期振動している。',
    gen(pos, col, i, pal){
      const t = rnd(), s = t*TAU*2.2, r0 = 0.5, f = fuzz()*0.7;
      const y = t*2.5 - 1.25;
      if (rnd() < 0.1) {
        const k = rnd()*2-1;
        pos[i*3]   = Math.cos(s)*r0*k + g()*0.02;
        pos[i*3+1] = y + g()*0.02;
        pos[i*3+2] = Math.sin(s)*r0*k + g()*0.02;
      } else {
        const ph = (i % 2) * Math.PI;
        pos[i*3]   = Math.cos(s+ph)*r0 + g()*f;
        pos[i*3+1] = y + g()*f;
        pos[i*3+2] = Math.sin(s+ph)*r0 + g()*f;
      }
      colorize(col, i, t, pal);
    } },
  { name:'CARDIOID',
    caption:'情動場が局所的に濃縮。拍動周期は安定。',
    gen(pos, col, i, pal){
      const a = rnd()*TAU, sc = 1.12/17, f = fuzz()*0.7;
      const s3 = Math.sin(a);
      const hx = 16 * s3*s3*s3;
      const hy = 13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a);
      const k = Math.pow(rnd(), 0.35);
      pos[i*3]   = hx*sc*k + g()*f;
      pos[i*3+1] = hy*sc*k + 0.12 + g()*f;
      pos[i*3+2] = g() * (0.06 + 0.16*k);
      colorize(col, i, 1 - k*0.9, pal);
    } },
  { name:'MOBIUS-BAND',
    caption:'向き付け不能な帯が単一の面を巡回している。',
    gen(pos, col, i, pal){
      const u = rnd()*TAU, v = (rnd()*2-1)*0.42, s = 0.92, f = fuzz()*0.6;
      const w = 1 + v*Math.cos(u/2);
      pos[i*3]   = w*Math.cos(u)*s + g()*f;
      pos[i*3+1] = v*Math.sin(u/2)*1.2 + g()*f;
      pos[i*3+2] = w*Math.sin(u)*s + g()*f;
      colorize(col, i, u/TAU, pal);
    } },
  { name:'ROSE-FIELD',
    caption:'花弁状の極曲線が開花フェーズに入った。',
    prep(){ this.k = 3 + 2*((rnd()*3)|0); }, // 3,5,7 petals
    gen(pos, col, i, pal){
      const th = rnd()*TAU, f = fuzz()*0.6;
      const rad = 1.32 * Math.cos(this.k*th);
      const fill = Math.pow(rnd(), 0.4);
      pos[i*3]   = rad*Math.cos(th)*fill + g()*f;
      pos[i*3+1] = rad*Math.sin(th)*fill + g()*f;
      pos[i*3+2] = 0.22*(1-fill) - 0.08 + g()*(0.04 + f*0.5);
      colorize(col, i, fill, pal);
    } },
  { name:'BUTTERFLY-CURVE',
    caption:'鱗粉場が対称軸に沿って羽ばたきを記録。',
    gen(pos, col, i, pal){
      const t = rnd()*12*Math.PI, s = 0.30, f = fuzz()*0.55;
      const st = Math.sin((2*t - Math.PI)/24);
      const r = Math.exp(Math.sin(t)) - 2*Math.cos(4*t) + st*st*st*st*st;
      pos[i*3]   = Math.sin(t)*r*s + g()*f;
      pos[i*3+1] = (Math.cos(t)*r - 0.9)*s + g()*f;
      pos[i*3+2] = g()*0.09;
      colorize(col, i, Math.abs(Math.sin(t)), pal);
    } },
  { name:'RIPPLE-DISC',
    caption:'界面波が同心円状に干渉している。',
    gen(pos, col, i, pal){
      const r = 1.4*Math.sqrt(rnd()), th = rnd()*TAU, f = fuzz()*0.6;
      const y = 0.30*Math.sin(r*7 - 1.2)*Math.exp(-r*0.7);
      pos[i*3]   = r*Math.cos(th) + g()*f;
      pos[i*3+1] = y + g()*(0.02 + f*0.4);
      pos[i*3+2] = r*Math.sin(th) + g()*f;
      colorize(col, i, (y*3 + 0.5), pal);
    } },
  { name:'CONCH-SPIRAL',
    caption:'対数螺旋の成長率は黄金比に漸近する。',
    gen(pos, col, i, pal){
      const t = Math.pow(rnd(), 0.55);
      const th = t * 6.5 * Math.PI;
      const r0 = 0.052 * Math.exp(0.15*th);
      const tube = 0.012 + 0.09*r0;
      pos[i*3]   = r0*Math.cos(th) + g()*tube;
      pos[i*3+1] = 0.62 - th*0.058 + g()*tube;
      pos[i*3+2] = r0*Math.sin(th) + g()*tube;
      colorize(col, i, t, pal);
    } },
  { name:'LISSAJOUS-ORBIT',
    caption:'周波数比 3:2:5 の軌道が閉じた。',
    gen(pos, col, i, pal){
      const t = rnd()*TAU, f = fuzz()*0.6;
      pos[i*3]   = Math.sin(3*t + Math.PI/2)*1.05 + g()*f;
      pos[i*3+1] = Math.sin(2*t)*0.95 + g()*f;
      pos[i*3+2] = Math.sin(5*t + Math.PI/4)*0.6 + g()*f;
      colorize(col, i, t/TAU, pal);
    } },
  { name:'SUPERSHAPE',
    caption:'超公式のパラメータ空間を無作為に探索中。',
    prep(){
      this.m1 = 2 + ((rnd()*7)|0);
      this.m2 = 2 + ((rnd()*7)|0);
      this.n1 = 0.25 + rnd()*1.8;
      this.n2 = 0.4 + rnd()*1.6;
      this.n3 = 0.4 + rnd()*1.6;
    },
    gen(pos, col, i, pal){
      const sf = (ang, m, n1, n2, n3) => {
        const a = Math.abs(Math.cos(m*ang/4));
        const b = Math.abs(Math.sin(m*ang/4));
        const base = Math.pow(a, n2) + Math.pow(b, n3);
        const r = Math.pow(base, -1/n1);
        return isFinite(r) ? Math.min(r, 2.4) : 0;
      };
      const lon = rnd()*TAU - Math.PI;
      const lat = Math.asin(rnd()*2 - 1);
      const r1 = sf(lon, this.m1, this.n1, this.n2, this.n3);
      const r2 = sf(lat, this.m2, this.n1, this.n2, this.n3);
      const s = 0.95, f = fuzz()*0.7;
      pos[i*3]   = r1*Math.cos(lon)*r2*Math.cos(lat)*s + g()*f;
      pos[i*3+1] = r2*Math.sin(lat)*s + g()*f;
      pos[i*3+2] = r1*Math.sin(lon)*r2*Math.cos(lat)*s + g()*f;
      colorize(col, i, (Math.sin(lat) + 1)*0.5, pal);
    } },
  { name:'RING-PLANET',
    caption:'降着円盤が潮汐限界の外側で安定した。',
    gen(pos, col, i, pal){
      const f = fuzz()*0.5;
      if (rnd() < 0.62) { // planet body
        let x = g(), y = g(), z = g();
        const n = Math.hypot(x, y, z) || 1;
        pos[i*3]   = x/n*0.72 + g()*f;
        pos[i*3+1] = y/n*0.72 + g()*f;
        pos[i*3+2] = z/n*0.72 + g()*f;
        colorize(col, i, (y/n + 1)*0.5, pal);
      } else { // ring
        const rr = 1.02 + rnd()*0.45, th = rnd()*TAU;
        pos[i*3]   = rr*Math.cos(th) + g()*0.02;
        pos[i*3+1] = g()*0.015 + (rr - 1.02)*0.18;
        pos[i*3+2] = rr*Math.sin(th) + g()*0.02;
        colorize(col, i, 0.9, pal);
      }
    } },
  { name:'LATTICE-FRAME',
    caption:'立方格子の稜線に確率密度が集中している。',
    gen(pos, col, i, pal){
      const h = 0.85, f = 0.03;
      if (rnd() < 0.12) {
        pos[i*3] = g()*0.45; pos[i*3+1] = g()*0.45; pos[i*3+2] = g()*0.45;
        colorize(col, i, 0.5, pal);
        return;
      }
      const axis = (rnd()*3)|0;
      const s1 = rnd() < 0.5 ? -h : h, s2 = rnd() < 0.5 ? -h : h;
      const t = rnd()*2*h - h;
      const p = axis === 0 ? [t, s1, s2] : axis === 1 ? [s1, t, s2] : [s1, s2, t];
      pos[i*3]   = p[0] + g()*f;
      pos[i*3+1] = p[1] + g()*f;
      pos[i*3+2] = p[2] + g()*f;
      colorize(col, i, (t/h + 1)*0.5, pal);
    } },
];

// ---------- buffers ----------
const posFrom = new Float32Array(COUNT*3), posTo = new Float32Array(COUNT*3);
const colFrom = new Float32Array(COUNT*3), colTo = new Float32Array(COUNT*3);
const rands   = new Float32Array(COUNT*4);
for (let i = 0; i < COUNT*4; i++) rands[i] = rnd();

// intro: from a huge random cloud into the first shape
for (let i = 0; i < COUNT; i++) {
  posFrom[i*3] = g()*1.6; posFrom[i*3+1] = g()*1.6; posFrom[i*3+2] = g()*1.6;
  const b = 0.25 + rnd()*0.3;
  colFrom[i*3] = b; colFrom[i*3+1] = b*0.9; colFrom[i*3+2] = b*1.2;
}
let shapeIdx = (() => {
  const f = parseInt(params.get('f'), 10);
  return Number.isInteger(f) ? ((f % SHAPES.length) + SHAPES.length) % SHAPES.length
                             : (rnd()*SHAPES.length)|0;
})();
function generateInto(pos, col, idx){
  const s = SHAPES[idx];
  if (s.prep) s.prep();
  const pal = randomPalette();
  for (let i = 0; i < COUNT; i++) s.gen(pos, col, i, pal);
}
generateInto(posTo, colTo, shapeIdx);

function makeBuf(arr, loc, size){
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  return b;
}
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const bPosFrom = makeBuf(posFrom, 0, 3);
const bPosTo   = makeBuf(posTo,   1, 3);
const bColFrom = makeBuf(colFrom, 2, 3);
const bColTo   = makeBuf(colTo,   3, 3);
makeBuf(rands, 4, 4);

function upload(buf, arr){
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, arr);
}

// ---------- morph control ----------
let morphT = 0; // plays the intro morph
let autoTimer = 0;
let sweep = [0, 1, 0]; // morph wave direction (random per morph)
function randomSweep(){
  let x = g(), y = g(), z = g();
  const n = Math.hypot(x, y, z) || 1;
  sweep = [x/n, y/n, z/n];
}
randomSweep();

const shapeNameEl = document.getElementById('shapeName');
const captionEl = document.getElementById('caption');
function showShapeText(){
  shapeNameEl.textContent = 'FORM ' + String(shapeIdx+1).padStart(2,'0')
    + ' : ' + SHAPES[shapeIdx].name;
  captionEl.textContent = SHAPES[shapeIdx].caption;
}
showShapeText();

function bakeCurrentInto(fromP, fromC){
  // freeze the currently displayed state, matching the shader's timing math
  const stag = 0.7;
  const [sx, sy, sz] = sweep;
  for (let i = 0; i < COUNT; i++) {
    const j0 = i*3;
    let spatial = (posFrom[j0]*sx + posFrom[j0+1]*sy + posFrom[j0+2]*sz)*0.5 + 0.5;
    spatial = spatial < 0 ? 0 : spatial > 1 ? 1 : spatial;
    const delay = spatial*0.55 + rands[i*4]*0.45;
    let tt = morphT*(1+stag) - delay*stag;
    tt = tt < 0 ? 0 : tt > 1 ? 1 : tt;
    const e = tt*tt*tt*(tt*(tt*6-15)+10);
    for (let k = 0; k < 3; k++) {
      const j = j0+k;
      fromP[j] = posFrom[j] + (posTo[j]-posFrom[j])*e;
      fromC[j] = colFrom[j] + (colTo[j]-colFrom[j])*e;
    }
  }
}

function morphTo(idx){
  if (morphT < 1) {
    bakeCurrentInto(posFrom, colFrom);
  } else {
    posFrom.set(posTo); colFrom.set(colTo);
  }
  shapeIdx = ((idx % SHAPES.length) + SHAPES.length) % SHAPES.length;
  generateInto(posTo, colTo, shapeIdx);
  upload(bPosFrom, posFrom); upload(bColFrom, colFrom);
  upload(bPosTo, posTo);     upload(bColTo, colTo);
  randomSweep();
  morphT = 0; autoTimer = 0;
  showShapeText();
}
function nextShape(){
  let idx = (rnd()*SHAPES.length)|0;
  if (idx === shapeIdx) idx = (idx + 1) % SHAPES.length;
  morphTo(idx);
}

// ---------- interaction (random effect per touch) ----------
const FX_NAMES = ['ばらける', 'ついてくる', 'ぐるぐる', '波紋'];
let mode = 0;
let press = 0, pressTarget = 0;
let spin = 0;
const pointerTarget = [0, 0];
const pointer = [0, 0];
const touches = new Float32Array(NTOUCH*4);
let touchIdx = 0, lastBurst = 0, lastRipple = 0, lastTap = 0, downPos = null, moved = 0;

const fxEl = document.getElementById('fx');
let fxTimer = 0;
function showFx(name){
  fxEl.textContent = name;
  fxEl.style.opacity = 1;
  clearTimeout(fxTimer);
  fxTimer = setTimeout(() => { fxEl.style.opacity = 0; }, 900);
}

let camDist = 3.3;
function toWorld(cx, cy){
  const r = canvas.getBoundingClientRect();
  const ndcX = (cx - r.left) / r.width * 2 - 1;
  const ndcY = 1 - (cy - r.top) / r.height * 2;
  const halfH = Math.tan(FOV/2) * camDist;
  return [ndcX * halfH * (r.width/r.height), ndcY * halfH];
}
function addBurst(x, y, strength, now){
  const j = (touchIdx++ % NTOUCH) * 4;
  touches[j] = x; touches[j+1] = y; touches[j+2] = now; touches[j+3] = strength;
}

canvas.addEventListener('pointerdown', ev => {
  canvas.setPointerCapture(ev.pointerId);
  const [x, y] = toWorld(ev.clientX, ev.clientY);
  pointerTarget[0] = x; pointerTarget[1] = y;
  pointer[0] = x; pointer[1] = y;
  pressTarget = 1; moved = 0; downPos = [ev.clientX, ev.clientY];
  mode = (rnd()*FX_NAMES.length)|0;
  showFx(FX_NAMES[mode]);
  const now = performance.now()/1000;
  if (mode === 0) { addBurst(x, y, 1.2, now); lastBurst = now; }
  if (mode === 3) { addBurst(x, y, -1.3, now); lastRipple = now; }
});
canvas.addEventListener('pointermove', ev => {
  const [x, y] = toWorld(ev.clientX, ev.clientY);
  pointerTarget[0] = x; pointerTarget[1] = y;
  if (downPos) moved = Math.max(moved,
    Math.hypot(ev.clientX-downPos[0], ev.clientY-downPos[1]));
  if (pressTarget > 0) {
    const now = performance.now()/1000;
    if (mode === 0 && now - lastBurst > 0.07) {
      addBurst(x, y, 0.7, now); lastBurst = now;
    }
    if (mode === 3 && now - lastRipple > 0.4) {
      addBurst(x, y, -1.0, now); lastRipple = now;
    }
  }
});
function endPress(){
  pressTarget = 0;
  if (downPos && moved < 24) {
    const now = performance.now();
    if (now - lastTap < 320) { nextShape(); lastTap = 0; }
    else lastTap = now;
  }
  downPos = null;
}
canvas.addEventListener('pointerup', endPress);
canvas.addEventListener('pointercancel', endPress);

// ---------- matrices ----------
function perspective(out, fovy, aspect, near, far){
  const f = 1/Math.tan(fovy/2), nf = 1/(near-far);
  out.fill(0);
  out[0]=f/aspect; out[5]=f; out[10]=(far+near)*nf; out[11]=-1;
  out[14]=2*far*near*nf;
}
function modelRot(out, rx, ry){
  const cx=Math.cos(rx), sx=Math.sin(rx), cy=Math.cos(ry), sy=Math.sin(ry);
  out[0]=cy;      out[1]=0;   out[2]=-sy;     out[3]=0;
  out[4]=sy*sx;   out[5]=cx;  out[6]=cy*sx;   out[7]=0;
  out[8]=sy*cx;   out[9]=-sx; out[10]=cy*cx;  out[11]=0;
  out[12]=0; out[13]=0; out[14]=0; out[15]=1;
}
const proj = new Float32Array(16), model = new Float32Array(16);

// ---------- HUD fake telemetry ----------
const statsEl = document.getElementById('stats');
let iter = 10000, topo = 0.15;
function updateStats(t){
  iter += 7 + (Math.random()*9|0);
  topo += (Math.random()-0.5)*0.004;
  topo = Math.max(0.02, Math.min(0.6, topo));
  const lr = 0.081 * (1 + 0.12*Math.sin(t*0.4));
  const sig = 1.57 * (1 + 0.1*Math.sin(t*0.23 + 2));
  statsEl.textContent =
    'KOHONEN ITERATION : ' + iter.toLocaleString('en-US') + '\n' +
    'LEARNING RATE (η) : ' + lr.toFixed(4) + '\n' +
    'NEIGHBORHOOD (σ)  : ' + sig.toFixed(4) + '\n' +
    'TOPO-TENSION      : ' + topo.toFixed(4) + '\n' +
    'PARTICLES         : ' + drawCount.toLocaleString('en-US');
}

// ---------- render loop ----------
function resize(){
  const w = Math.floor(canvas.clientWidth * DPR) || 1;
  const h = Math.floor(canvas.clientHeight * DPR) || 1;
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
    const aspect = w/h;
    perspective(proj, FOV, aspect, 0.1, 30);
    // portrait screens: pull the camera back so wide shapes still fit
    camDist = Math.max(3.3, 1.62 / (Math.tan(FOV/2) * aspect));
  }
}
window.addEventListener('resize', resize);

gl.disable(gl.DEPTH_TEST);
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE);
gl.clearColor(0, 0, 0, 1);

// adaptive quality: keep the frame rate silky by trimming drawn grains
let drawCount = COUNT;
let fpsFrames = 0, fpsTime = 0, warmup = 2;

let prev = performance.now()/1000, statT = 0;
function frame(){
  const now = performance.now()/1000;
  const dt = Math.min(0.05, now - prev);
  prev = now;
  resize();

  if (warmup > 0) warmup -= dt;
  else {
    fpsFrames++; fpsTime += dt;
    if (fpsTime > 1.5) {
      const fps = fpsFrames / fpsTime;
      if (fps < 42 && drawCount > 60000)
        drawCount = Math.max(60000, (drawCount*0.75)|0);
      else if (fps > 56 && drawCount < COUNT)
        drawCount = Math.min(COUNT, (drawCount*1.12)|0);
      fpsFrames = 0; fpsTime = 0;
    }
  }

  if (morphT < 1) morphT = Math.min(1, morphT + dt/MORPH_SEC);
  else {
    autoTimer += dt;
    if (autoTimer > AUTO_SEC) nextShape();
  }

  press += (pressTarget - press) * Math.min(1, dt * (pressTarget > press ? 10 : 4));
  pointer[0] += (pointerTarget[0] - pointer[0]) * Math.min(1, dt*12);
  pointer[1] += (pointerTarget[1] - pointer[1]) * Math.min(1, dt*12);
  if (mode === 2 && pressTarget > 0) spin = Math.min(14, spin + dt*3.0);
  else spin *= Math.exp(-dt/1.3);

  const rotSpeed = reducedMotion ? 0.04 : 0.10;
  const ry = now * rotSpeed, rx = 0.18 + 0.22*Math.sin(now*0.08);
  modelRot(model, rx, ry);

  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniformMatrix4fv(U.uProj, false, proj);
  gl.uniformMatrix4fv(U.uModel, false, model);
  gl.uniform1f(U.uTime, now);
  gl.uniform1f(U.uMorph, morphT);
  gl.uniform1f(U.uPress, press);
  gl.uniform1f(U.uSpin, spin);
  gl.uniform1f(U.uSize, canvas.height * 0.0038 * (coarse ? 1.2 : 1));
  gl.uniform1f(U.uCamDist, camDist);
  gl.uniform3f(U.uPointer, pointer[0], pointer[1], 0);
  gl.uniform3f(U.uSweep, sweep[0], sweep[1], sweep[2]);
  gl.uniform1i(U.uMode, mode);
  gl.uniform4fv(U.uTouches, touches);
  gl.drawArrays(gl.POINTS, 0, drawCount);

  statT += dt;
  if (statT > 0.1) { statT = 0; updateStats(now); }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

})();
</script>
