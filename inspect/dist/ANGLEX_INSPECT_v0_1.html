<style>
:root{--ink:#1a1a17;--ink-soft:#3a3a36;--ink-mute:#6f6f68;--ink-faint:#9a948a;--paper:#f5f3ec;--paper-warm:#ebe8dc;--paper-dark:#e0dccc;--paper-card:#fbfaf5;--line:#c9c3ad;--line-soft:#d9d4c0;--line-faint:#e6e2d4;--accent:#b34a2a;--accent-deep:#8a3419;--accent-soft:#f3d7c8;--brass:#B8A67A;--steel:#4a5568;--ok:#3e6b4a;--ok-soft:#d7e6db;--info:#3d5a80;--warn:#b8862a;--warn-soft:#f7ecd2;--bad:#c0392b;--bad-soft:#fde8e6;--sel:#2563eb;--panel-bg:#13130f;--panel-line:#2a2a22;--font:"IBM Plex Sans JP",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;--mono:"JetBrains Mono","SF Mono",Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}body{font-family:var(--font);font-size:13px;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:var(--mono)}::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.app{display:grid;grid-template-rows:52px 46px 1fr 24px;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel-bg);color:var(--paper);border-bottom:1px solid var(--panel-line)}.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer}.brand-mark{font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--brass)}.brand-sub{font-family:var(--mono);font-size:9px;letter-spacing:.26em;color:var(--ink-faint)}.topbar-divider{width:1px;height:24px;background:var(--panel-line)}

.mode-badge{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 8px;border:1px solid var(--panel-line);border-radius:4px;color:var(--ink-faint)}
.user-pill{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--panel-line);border-radius:20px;font-size:12px;white-space:nowrap}.topbar .btn{white-space:nowrap}.mode-badge{white-space:nowrap}.org-badge{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:#8a5a1f;color:#fff;font-size:12px}
.btn{font:inherit;font-size:12.5px;padding:6px 13px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;color:var(--ink);transition:background-color .12s,border-color .12s,color .12s,transform .08s}.btn:hover{border-color:var(--ink-mute)}.btn:active{transform:translateY(1px)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-deep)}.btn.danger{color:var(--bad);border-color:#e3b1aa}.btn.ghost{background:transparent;color:var(--paper);border-color:var(--panel-line)}.btn.ghost:hover{border-color:var(--brass)}.btn.sm{padding:3px 9px;font-size:11.5px}.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}.icon-btn{border:none;background:transparent;font-size:16px;cursor:pointer;color:var(--ink-mute);padding:2px 6px}
/* ステッパー */
.wf{display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--paper-warm);border-bottom:1px solid var(--line-soft)}.wf-step{flex:1;display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line-soft);border-radius:8px;font-size:12.5px;cursor:pointer;background:#fff;transition:background-color .12s;user-select:none}.wf-step .no{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--line);font-weight:600;font-size:11px;flex-shrink:0}.wf-step .lbl{font-weight:600;white-space:nowrap}.wf-step .sub{font-size:10.5px;color:var(--ink-mute);font-family:var(--mono);margin-left:auto;white-space:nowrap}.wf-step.done .no{background:var(--ok);color:#fff}.wf-step.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(179,74,42,.16)}.wf-step.active .no{background:var(--accent);color:#fff}.wf-step.locked{opacity:.55;cursor:default}.wf-arrow{color:var(--ink-faint);font-size:12px}
/* 3 カラム */
.main{display:grid;grid-template-columns:300px 1fr 340px;min-height:0}.side{background:var(--paper-card);display:flex;flex-direction:column;min-height:0}.side.left{border-right:1px solid var(--line-soft)}.side.right{border-left:1px solid var(--line-soft)}.side-head{padding:7px 12px;font-size:11px;letter-spacing:.12em;color:var(--ink-mute);border-bottom:1px solid var(--line-faint);text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:8px}.side-head .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}.side-body{overflow:auto;flex:1;padding:6px 8px}
.filters{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line-faint)}.chip{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;background:var(--paper-warm);border:1px solid var(--line-soft);color:var(--ink-soft);font-family:var(--mono);white-space:nowrap}.chip.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.chip.warn{background:var(--warn-soft);border-color:var(--warn);color:#7a5a16}.chip.ng{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}.chip.na{color:var(--ink-faint)}.chip.ghost{background:transparent}.chip.crit{background:#fff;border-color:var(--accent);color:var(--accent-deep)}.chip.btn{cursor:pointer}.chip.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chips{display:flex;flex-wrap:wrap;gap:4px}
.it-group{font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;padding:8px 4px 3px;font-weight:600}
.it-row{display:grid;grid-template-columns:24px 1fr auto;gap:6px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent}.it-row:hover{background:var(--paper-warm)}.it-row.sel{background:#e8eefb;border-color:var(--sel)}.it-no{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);font-family:var(--mono);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#fff}.it-no.ok{border-color:var(--ok);color:var(--ok)}.it-no.warn{border-color:var(--warn);color:#7a5a16;background:var(--warn-soft)}.it-no.ng{border-color:var(--bad);color:#fff;background:var(--bad)}.it-no.na{border-color:var(--ink-faint);color:var(--ink-faint)}
.it-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it-spec{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it-dots{display:flex;gap:3px}.it-dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}.it-dots i.ok{background:var(--ok)}.it-dots i.warn{background:var(--warn)}.it-dots i.ng{background:var(--bad)}.it-dots i.na{background:transparent;border:1px solid var(--line)}.it-row .flag{color:var(--accent);font-size:11px}
.pp-empty{padding:18px 10px;color:var(--ink-mute);font-size:12.5px;line-height:1.6}
.pp-head{padding:6px 4px 10px;border-bottom:1px solid var(--line-faint)}.pp-fam{font-size:11px;color:var(--ink-mute);letter-spacing:.04em;display:flex;gap:6px;align-items:center}.pp-title{font-weight:600;font-size:14.5px;margin-top:3px;display:flex;gap:8px;align-items:center}.pp-nom{font-family:var(--mono);font-size:13px;margin-top:4px;color:var(--ink-soft)}.pp-nom b{color:var(--ink)}
.pp-card{margin:8px 0;padding:8px 10px;background:#fff;border:1px solid var(--line-faint);border-radius:6px}.pp-card h4{font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}.pp-card h4 .r{margin-left:auto}.kv{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--ink-soft)}.kv b{font-family:var(--mono);color:var(--ink)}
table.mt{width:100%;border-collapse:collapse;font-size:11.5px}table.mt th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink-mute);padding:3px 4px;border-bottom:1px solid var(--line)}table.mt td{padding:3px 4px;border-bottom:1px solid var(--line-faint);vertical-align:middle}table.mt td.r,table.mt th.r{text-align:right;font-family:var(--mono)}table.mt input{width:74px;font:inherit;font-family:var(--mono);font-size:11.5px;padding:2px 5px;border:1px solid var(--line-soft);border-radius:4px;text-align:right}table.mt input.ng{border-color:var(--bad);background:var(--bad-soft)}table.mt input.warn{border-color:var(--warn);background:var(--warn-soft)}table.mt input.ok{border-color:var(--ok)}table.mt select{font:inherit;font-size:11.5px;padding:2px 4px;border:1px solid var(--line-soft);border-radius:4px}
.st{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px}.st.ok{color:var(--ok);background:var(--ok-soft)}.st.warn{color:#7a5a16;background:var(--warn-soft)}.st.ng{color:#fff;background:var(--bad)}.st.na{color:var(--ink-faint);background:var(--paper-warm)}
.tolbar{position:relative;height:34px;margin:8px 2px 4px}.tolbar .band{position:absolute;left:15%;right:15%;top:12px;height:10px;background:var(--ok-soft);border:1px solid var(--ok);border-radius:3px}.tolbar .warnz{position:absolute;top:12px;height:10px;background:var(--warn-soft)}.tolbar .nom{position:absolute;left:50%;top:8px;width:1px;height:18px;background:var(--ink)}.tolbar .mk{position:absolute;top:6px;width:10px;height:22px;margin-left:-5px;border-radius:3px;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;font-family:var(--mono)}.tolbar .mk.ok{background:var(--ok)}.tolbar .mk.warn{background:var(--warn)}.tolbar .mk.ng{background:var(--bad)}.tolbar .lo,.tolbar .hi{position:absolute;top:24px;font-family:var(--mono);font-size:9.5px;color:var(--ink-mute)}.tolbar .lo{left:15%;transform:translateX(-50%)}.tolbar .hi{right:15%;transform:translateX(50%)}
.ai{border-left:3px solid var(--brass);background:#fffdf6}.ai ul{margin:4px 0 4px 16px;font-size:11.5px;line-height:1.5}.ai .trend{font-size:11.5px;color:var(--ink-soft);margin:4px 0}.ai .conf{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.vendor-flag{font-size:11px;color:var(--bad);font-weight:600}.vendor-ok{font-size:11px;color:var(--ok)}
.pp-actions{display:flex;gap:4px;margin:10px 0;flex-wrap:wrap}
/* ステージ */
.stage{position:relative;min-width:0;min-height:0;background:#f4f5f7;display:flex;flex-direction:column}.stage-tabs{display:flex;align-items:center;gap:2px;padding:4px 10px 0;background:var(--paper-card);border-bottom:1px solid var(--line-soft)}.tab{font:inherit;font-size:12.5px;padding:7px 12px;white-space:nowrap;border:none;background:transparent;cursor:pointer;color:var(--ink-mute);border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}.tab:disabled{opacity:.4;cursor:default}.stage-tools{margin-left:auto;display:flex;gap:5px;align-items:center;padding-bottom:4px;flex-wrap:nowrap;justify-content:flex-end;overflow:hidden}.stage-tools .btn,.stage-tools select{white-space:nowrap;font-size:11.5px;padding:3px 8px}
.pane{position:absolute;inset:38px 0 0 0;display:none}.pane.on{display:block}.viewport{position:absolute;inset:0}.viewport canvas.gl{display:block;width:100%;height:100%}
.hud{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:5}.hud>*{pointer-events:auto}.hud-box{background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:11px;max-width:430px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:4px}.hud-box .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.hud-box label{display:inline-flex;align-items:center;gap:4px}.hud-box input[type=range]{width:80px}.hud-box .btn.sm{padding:2px 7px;font-size:11px}.hud-box select{font:inherit;font-size:11.5px;padding:2px 4px;border:1px solid var(--line-soft);border-radius:4px}
.hud-right{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:5;align-items:flex-end}.legend{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:3px}
.v-callout{font:11px/1.2 var(--font);background:rgba(255,255,255,.95);border:1.5px solid var(--ink-faint);border-radius:11px;padding:1px 7px 1px 2px;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:5px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:transform .1s}.v-callout:hover{transform:scale(1.08)}.v-callout .no{width:17px;height:17px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}.v-callout .tx{font-family:var(--mono);font-size:10.5px}.v-callout.ok{border-color:var(--ok)}.v-callout.ok .no{background:var(--ok)}.v-callout.warn{border-color:var(--warn)}.v-callout.warn .no{background:var(--warn)}.v-callout.ng{border-color:var(--bad);background:#fff4f2}.v-callout.ng .no{background:var(--bad)}.v-callout.na .no{background:var(--ink-faint)}.v-callout.sel{outline:2px solid var(--sel);outline-offset:1px;z-index:2}.v-callout.sel .no{background:var(--sel)}
.dwg-host{position:absolute;inset:0;overflow:auto;background:#d8d5c9;padding:16px;display:flex;justify-content:center;align-items:flex-start}.dwg-host svg{max-width:100%;height:auto;box-shadow:0 6px 24px rgba(0,0,0,.25);background:#fff}
.center-pane{position:absolute;inset:0;overflow:auto;padding:28px;display:flex;flex-direction:column;align-items:center;gap:16px}.big-card{width:min(760px,100%);background:#fff;border:1px solid var(--line-soft);border-radius:12px;padding:20px 24px;box-shadow:0 4px 18px rgba(0,0,0,.06)}.big-card h2{font-size:17px;margin-bottom:6px}.big-card p{color:var(--ink-soft);line-height:1.6;font-size:12.5px}.upload{margin:14px 0;border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--ink-mute);cursor:pointer;background:var(--paper-card)}.upload:hover,.upload.over{border-color:var(--accent);background:var(--accent-soft)}.upload b{display:block;font-size:14px;color:var(--ink);margin-bottom:4px}.upload .fmt{font-family:var(--mono);font-size:10.5px;margin-top:6px}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.sg{background:var(--paper-card);border:1px solid var(--line-faint);border-radius:8px;padding:8px 10px}.sg .k{font-size:10.5px;color:var(--ink-mute)}.sg .v{font-size:18px;font-weight:700;font-family:var(--mono)}.sg.ng .v{color:var(--bad)}.sg.warn .v{color:var(--warn)}.sg.ok .v{color:var(--ok)}
.alog{font-family:var(--mono);font-size:11.5px;background:var(--panel-bg);color:#d7d3c5;border-radius:8px;padding:10px 12px;height:260px;overflow:auto;line-height:1.6}.alog .ln{display:flex;gap:10px}.alog .ts{color:#7f7a6c;flex-shrink:0}.alog .ac{color:var(--brass)}.alog .ok{color:#8fd19e}.alog .warn{color:#e4b04a}.alog .bad{color:#e87b6c}
.pbar{height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin:10px 0 4px}.pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}.pl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-mute);font-family:var(--mono)}
.map-table{max-height:300px;overflow:auto;border:1px solid var(--line-faint);border-radius:6px;background:#fff}table.grid{width:100%;border-collapse:collapse;font-size:11.5px}table.grid th{background:var(--paper-warm);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-weight:600;font-size:11px;position:sticky;top:0}table.grid td{padding:4px 8px;border-bottom:1px solid var(--line-faint)}table.grid td.r{text-align:right;font-family:var(--mono)}.conf{display:inline-block;min-width:44px;font-family:var(--mono);font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--ok-soft);color:var(--ok)}.conf.mid{background:var(--warn-soft);color:#7a5a16}.conf.low{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
/* 成績書 */
.rep-host{position:absolute;inset:0;overflow:auto;background:#d8d5c9;padding:16px}.report{width:min(1080px,100%);margin:0 auto;background:#fff;padding:26px 32px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:12px;color:#111}.report h1{font-size:19px;letter-spacing:.08em;text-align:center;margin-bottom:4px}.report .rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:10px}.report .rh .co{font-weight:700;font-size:14px}.report .rh .meta{font-family:var(--mono);font-size:10.5px;color:#555;text-align:right}
.report table.info{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11.5px}.report table.info td{border:1px solid #999;padding:4px 7px}.report table.info td.k{background:#f1efe6;width:90px;color:#444}

.report .notes{margin-top:10px;font-size:11.5px;line-height:1.55}.report .notes h3{font-size:12px;margin:8px 0 3px}.report .sig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.report .sig div{border:1px solid #999;height:56px;padding:3px 6px;font-size:10.5px;color:#555}.report .foot{margin-top:10px;font-size:10px;color:#777;font-family:var(--mono);display:flex;justify-content:space-between}
/* 案件一覧（ダッシュボード） */
.dash{position:fixed;inset:0;background:var(--paper);z-index:50;display:none;flex-direction:column}.dash.on{display:flex}.dash-top{display:flex;align-items:center;gap:14px;padding:0 18px;height:52px;background:var(--panel-bg);color:var(--paper);border-bottom:1px solid var(--panel-line)}.dash-body{flex:1;overflow:auto;padding:22px 28px}.dash-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.kpi{background:#fff;border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px}.kpi .k{font-size:11px;color:var(--ink-mute)}.kpi .v{font-size:24px;font-weight:700;font-family:var(--mono);margin-top:2px}.kpi .s{font-size:10.5px;color:var(--ink-faint);margin-top:2px}.kpi.ng .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}.kpi.acc .v{color:var(--accent)}
.dash h2{font-size:14px;margin:8px 0 10px;letter-spacing:.04em}.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}.pcard{background:#fff;border:1px solid var(--line-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .1s,box-shadow .12s}.pcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(26,26,23,.12)}.pcard .ph{display:flex;align-items:flex-start;gap:8px}.pcard .pn{font-weight:700;font-size:15px}.pcard .pd{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute)}.pcard .pst{margin-left:auto;font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600;white-space:nowrap}.pst.todo{background:var(--paper-warm);color:var(--ink-soft)}.pst.inspecting{background:#e3ebf7;color:var(--info)}.pst.done{background:var(--ok-soft);color:var(--ok)}.pst.ngl{background:var(--bad-soft);color:var(--bad)}
.pcard .pm{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:11.5px;color:var(--ink-soft)}.pcard .pm b{font-weight:600;color:var(--ink)}.pcard .pstat{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.pcard .pa{display:flex;gap:6px;margin-top:auto}.pcard .thumb{height:120px;border-radius:8px;background:linear-gradient(135deg,#eceae2,#dcd8ca);display:flex;align-items:center;justify-content:center;overflow:hidden}.pcard .thumb img{max-height:100%;max-width:100%;object-fit:contain}
.dash .hint{background:#fffdf6;border-left:3px solid var(--brass);padding:10px 14px;font-size:12px;line-height:1.6;margin-top:18px;border-radius:0 8px 8px 0}
.statusbar{display:flex;align-items:center;gap:12px;padding:0 12px;font-size:11px;color:var(--ink-mute);background:var(--paper-warm);border-top:1px solid var(--line-soft);font-family:var(--mono)}.statusbar .spacer{flex:1}.statusbar .sep{width:1px;height:12px;background:var(--line)}.statusbar .ng{color:var(--bad);font-weight:700}
.modal-back{position:fixed;inset:0;background:rgba(19,19,15,.45);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}.modal{background:var(--paper);border-radius:10px;width:min(640px,94vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}.modal.wide{width:min(1100px,96vw)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line-soft)}.modal-title{font-weight:600;font-size:15px}.modal-body{padding:14px 18px;overflow:auto;flex:1;min-height:0;font-size:12.5px;line-height:1.6}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px;border-top:1px solid var(--line-soft)}
.toast-host{position:fixed;right:16px;bottom:40px;display:flex;flex-direction:column;gap:6px;z-index:200}.toast{background:#13130f;color:var(--paper);padding:9px 14px;border-radius:7px;font-size:12.5px;opacity:0;transform:translateY(8px);transition:.25s;max-width:460px;border-left:3px solid var(--brass)}.toast.show{opacity:1;transform:none}.toast.ok{border-color:#7fc08a}.toast.bad{border-color:#e87b6c}.toast.warn{border-color:#e4b04a}
.muted{color:var(--ink-mute)}.small{font-size:11px}.bad{color:var(--bad)}.spacer{flex:1}kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:#faf9f5;font:11.5px var(--mono)}
@media (max-width:1200px){.main{grid-template-columns:250px 1fr 300px}}
@media print{body{overflow:visible;background:#fff}.app,.dash,.toast-host{display:none!important}#printHost{display:block!important}#printHost .report{box-shadow:none;width:100%;padding:0}#printHost .dwg{box-shadow:none;width:100%;height:auto}@page{size:A4 landscape;margin:10mm}}
#printHost{display:none}
</style>
</head>
