<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JOMON PATTERN DRIFT — 白黒</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    overscroll-behavior: none;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  }
  #gl {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
    cursor: grab;
  }
  #gl.dragging { cursor: grabbing; }

  .ui {
    position: fixed;
    z-index: 10;
    color: rgba(255, 240, 220, 0.85);
    user-select: none;
    -webkit-user-select: none;
    transition: opacity 1.2s ease;
  }
  .ui.hidden { opacity: 0; pointer-events: none; }

  #controls {
    bottom: max(18px, env(safe-area-inset-bottom));
    right: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #controls button {
    background: rgba(10, 8, 6, 0.5);
    border: 1px solid rgba(255, 200, 140, 0.35);
    color: rgba(255, 235, 210, 0.9);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: border-color 0.3s, color 0.3s, box-shadow 0.3s;
  }
  #controls button:hover { border-color: rgba(255, 200, 140, 0.8); }
  #controls button.active {
    border-color: rgba(255, 180, 90, 0.95);
    box-shadow: 0 0 16px rgba(255, 150, 50, 0.35);
  }

  #speedbox {
    bottom: max(18px, env(safe-area-inset-bottom));
    left: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: 0.2em;
  }
  #speed {
    -webkit-appearance: none;
    appearance: none;
    width: 120px; height: 2px;
    background: rgba(255, 220, 180, 0.35);
    outline: none;
  }
  #speed::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(255, 200, 140, 0.9);
    box-shadow: 0 0 10px rgba(255, 150, 50, 0.7);
    cursor: pointer;
  }
  #speed::-moz-range-thumb {
    width: 14px; height: 14px; border: none;
    border-radius: 50%;
    background: rgba(255, 200, 140, 0.9);
    cursor: pointer;
  }

  #fserr {
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 80vw;
    text-align: center;
    font-size: 14px;
    line-height: 2;
    display: none;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="ui" id="speedbox">
  <span>速</span>
  <input type="range" id="speed" min="0.1" max="5" step="0.05" value="1.2">
</div>
<div class="ui" id="controls">
  <button data-theme="0" class="active">火焔</button>
  <button data-theme="1">蒼冥</button>
  <button data-theme="2">幽玄</button>
</div>
<div class="ui" id="fserr"></div>

<script>
"use strict";

// ← true にすると白黒（墨色）版になります
const MONO = true;

const VERT = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const FRAG = `
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform float uDist;
uniform vec2  uLook;
uniform vec3  uColA;
uniform vec3  uColB;
uniform float uGlow;

#define PI 3.14159265358979
#define TAU 6.28318530717959

mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

float hash21(vec2 p) {
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}

float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

// sin 値から刻線を作る（w で太さが変わる）
float carve(float v, float w) {
  return smoothstep(w, 0.0, abs(v));
}

// 丸断面の隆線：粘土紐のように中心が高く盛り上がり、縁へ丸く落ちる
float bead(float v, float w) {
  float u = abs(v) / w;
  return sqrt(max(1.0 - u * u, 0.0));
}

// ---- 紋様モチーフ（q はセル中心基準 -0.5..0.5、w は基準線幅）----
// 線幅をノイズで揺らし、手で盛った隆帯・引いた沈線の不均一さを出す

// 渦巻文
float motifSpiral(vec2 q, float seed, float w) {
  float r = length(q) + 1e-4;
  float a = atan(q.y, q.x);
  float arms = 1.0 + floor(fract(seed * 7.13) * 3.0);
  float freq = 17.0 + 21.0 * fract(seed * 3.71);
  float v = sin(a * arms + r * freq + seed * TAU);
  float wob = 0.55 + 0.9 * vnoise(q * 7.0 + seed * 41.0);
  return bead(v, w * wob) * smoothstep(0.55, 0.45, r);
}

// S 字連結渦巻文（左右で巻きが逆の一対の渦）
float motifSSpiral(vec2 q, float seed, float w) {
  float side = q.x < 0.0 ? -1.0 : 1.0;
  vec2 p = q - vec2(side * 0.21, 0.0);
  float r = length(p) + 1e-4;
  float a = atan(p.y, p.x);
  float v = sin(side * a * 2.0 + r * (22.0 + 16.0 * fract(seed * 5.31)));
  float wob = 0.55 + 0.9 * vnoise(q * 6.0 + seed * 31.0);
  return bead(v, w * wob) * smoothstep(0.34, 0.27, r);
}

// 同心円文
float motifRings(vec2 q, float seed, float w) {
  float r = length(q);
  float v = sin(r * (24.0 + 30.0 * fract(seed * 5.17)) + seed * TAU);
  float wob = 0.55 + 0.9 * vnoise(q * 8.0 + seed * 23.0);
  return bead(v, w * wob) * smoothstep(0.55, 0.45, r);
}

// 縄目（撚糸文）
float motifCord(vec2 q, float seed, float w) {
  vec2 p = q * rot(floor(fract(seed * 9.71) * 4.0) * PI * 0.25);
  float v = sin(p.y * 28.0 + sin(p.x * 20.0) * 1.35);
  float wob = 0.6 + 0.8 * vnoise(p * 9.0 + seed * 53.0);
  return bead(v, w * wob);
}

// 波状沈線
float motifWave(vec2 q, float seed, float w) {
  vec2 p = q * rot(fract(seed * 3.13) * PI);
  float v = sin(p.y * 22.0 + abs(fract(p.x * 3.0) - 0.5) * 8.5);
  float wob = 0.6 + 0.8 * vnoise(p * 8.0 + seed * 47.0);
  return bead(v, w * wob);
}

// 刺突文（丸い点の打刻を並べる）
float motifDots(vec2 q, float seed, float w) {
  vec2 g = q * (5.0 + 4.0 * fract(seed * 3.31));
  vec2 id = floor(g);
  vec2 f = fract(g) - 0.5;
  float rnd = hash21(id + seed * 10.0);
  float r = length(f) / (0.26 + 0.18 * rnd);
  return sqrt(max(1.0 - r * r, 0.0)) * step(rnd, 0.82) * smoothstep(0.52, 0.42, length(q));
}

// 条線（細い平行沈線）
float motifStria(vec2 q, float seed, float w) {
  vec2 p = q * rot(floor(fract(seed * 9.17) * 2.0) * PI * 0.5);
  float wig = sin(p.y * 4.0 + seed * TAU) * 0.6 + vnoise(vec2(p.x * 5.0, seed * 90.0)) * 1.1;
  float v = sin(p.x * 32.0 + wig);
  return carve(v, w * 0.6);
}

// 1 層ぶんの紋様（x: 主色の線, y: アクセント色の線）
vec3 layerPat(vec2 uv, float sc, vec2 seedOff) {
  vec2 g = uv * sc;
  vec2 id = floor(g);
  vec2 q = fract(g) - 0.5;

  float seed = hash21(id + seedOff);
  // 向きは完全に自由、モチーフの大きさもセルごとにばらつかせる
  vec2 qr = q * rot(seed * TAU);
  qr *= 0.78 + 0.55 * fract(seed * 13.77);

  // 線の太さ：細い沈線〜太い隆帯までセルごとにばらつかせる
  float w = mix(0.16, 0.62, pow(fract(seed * 29.31), 1.4));

  float m;
  float k = fract(seed * 43.7);
  if      (k < 0.20) m = motifSpiral(qr, seed, w);
  else if (k < 0.38) m = motifSSpiral(qr, seed, w);
  else if (k < 0.50) m = motifRings(qr, seed, w);
  else if (k < 0.66) m = motifCord(qr, seed, w);
  else if (k < 0.78) m = motifWave(qr, seed, w);
  else if (k < 0.88) m = motifDots(qr, seed, w);
  else               m = motifStria(qr, seed, w);

  // 手を休めたような線の途切れ（一部のセルのみ）
  if (fract(seed * 61.7) < 0.35) {
    float brk = smoothstep(0.16, 0.5, vnoise(qr * (2.5 + 3.0 * fract(seed * 7.71)) + seed * 77.0));
    m *= mix(0.08, 1.0, brk);
  }

  // 区画の枠線（丸断面の隆帯）。存在も太さもセルごとに揺らす
  float edge = max(abs(q.x), abs(q.y));
  float border = bead(edge - 0.468, 0.036 + 0.025 * fract(seed * 5.51));
  border *= step(fract(seed * 8.93), 0.72) * (0.5 + 0.5 * fract(seed * 21.3));

  float accent = step(fract(seed * 17.31), 0.3);

  float line = max(m, border);
  return vec3(line * (1.0 - accent), line * accent, 0.0);
}

// 壁面 1 枚ぶんの紋様。lod で微細層をフェード
vec3 pattern(vec2 uv, float lod) {
  // 手びねりのゆらぎ
  vec2 wob = (vec2(vnoise(uv * 0.8 + vec2(2.2, 0.0)), vnoise(uv * 0.8 + vec2(0.0, 13.7))) - 0.5) * 1.1;
  vec2 uvw = uv + wob;

  vec3 m = vec3(0.0);

  // 流線の帯（ワープした太い隆帯 + 帯上の縄目 + 並走する細い沈線）
  vec2 q = uv * 0.4 + (vec2(vnoise(uv * 0.45 + vec2(2.0, 9.0)), vnoise(uv * 0.45 + vec2(11.0, 4.0))) - 0.5) * 2.2;
  float fv = sin(q.y * 3.4 + q.x * 1.5);
  float widthMod = 0.09 + 0.32 * vnoise(uv * 0.7 + vec2(5.5, 1.2));
  float thick = bead(fv, widthMod);
  float micro = carve(sin(q.x * 9.0 + q.y * 22.0), 0.55) * thick;
  float thin = carve(abs(fv) - 0.55, 0.055);
  m.x += thick * 0.45 + micro * 0.3;
  m.y += thin * 0.85;

  m += layerPat(uvw, 0.75, vec2(0.0, 0.0)) * 0.95;
  if (lod > 0.15) {
    m += layerPat(uvw + vec2(3.37, 7.11), 1.9, vec2(11.0, 5.0)) * 0.6 * lod;
    float fine = carve(sin(uvw.x * 9.0 + sin(uvw.y * 7.0) * 1.3), 0.3);
    m.x += fine * 0.12 * lod;
  }

  return m;
}

// ---- 空間：ジャイロイド（全方位に無限に続く曲面の殻）----

#define GS 0.48

float gyr(vec3 p) {
  return dot(sin(p), cos(p.yzx));
}

vec3 gyrGrad(vec3 p) {
  return vec3(
    cos(p.x) * cos(p.y) - sin(p.z) * sin(p.x),
    -sin(p.x) * sin(p.y) + cos(p.y) * cos(p.z),
    -sin(p.y) * sin(p.z) + cos(p.z) * cos(p.x)
  );
}

// 漂うカメラの経路
vec3 camPath(float s) {
  return vec3(
    sin(s * 0.130) * 2.2 + sin(s * 0.041) * 3.5,
    cos(s * 0.097) * 2.0 + sin(s * 0.053) * 3.0,
    s + sin(s * 0.071) * 2.0
  );
}

// 紋様の殻に、別スケールのジャイロイドで大きな窓を開ける。
// 窓越しに奥の殻が何層も見え、前後の重なりが生まれる
float map(vec3 p, vec3 ro) {
  // 手びねりのうねり：壁面自体を低周波でゆがませる
  float hand = sin(p.x * 1.9 + sin(p.y * 1.3)) * sin(p.y * 1.7 + sin(p.z * 1.5)) * sin(p.z * 2.1 + sin(p.x * 1.1)) * 0.14;
  float shell = (abs(gyr(p * GS) + hand) - 0.28) / (GS * 2.3);
  float cutter = (abs(gyr(p * 0.155 + vec3(4.0, 2.0, 7.0))) - 0.42) / (0.155 * 2.0);
  float d = max(shell, -cutter);
  // カメラの周囲は常に空けて、壁をすり抜けるときの暗転を防ぐ
  d = max(d, 1.25 - length(p - ro));
  return d;
}

vec3 calcNormal(vec3 p, vec3 ro) {
  const vec2 e = vec2(0.012, 0.0);
  return normalize(vec3(
    map(p + e.xyy, ro) - map(p - e.xyy, ro),
    map(p + e.yxy, ro) - map(p - e.yxy, ro),
    map(p + e.yyx, ro) - map(p - e.yyx, ro)
  ));
}

// 殻表面へ射影した点で三面投影サンプル（線が面に定着して鋭くなる）
vec3 surfPattern(vec3 p, float lod) {
  vec3 q = p * GS;
  float g = gyr(q);
  vec3 grad = gyrGrad(q);
  vec3 pp = p - grad * (g / max(dot(grad, grad), 0.45)) / GS;

  vec3 an = abs(grad) + 1e-4;
  an = an * an; an = an * an;
  an /= (an.x + an.y + an.z);

  float ps = 1.5;
  vec3 m = vec3(0.0);
  if (an.z > 0.14) m += pattern(pp.xy * ps, lod) * an.z;
  if (an.x > 0.14) m += pattern(pp.yz * ps + vec2(11.7, 5.3), lod) * an.x;
  if (an.y > 0.14) m += pattern(pp.zx * ps + vec2(3.9, 8.1), lod) * an.y;
  return m;
}

void main() {
  vec2 sc = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;

  // ゆっくりと傾きながら漂う
  sc = rot(sin(uTime * 0.045) * 0.08) * sc;

  vec3 rdc = normalize(vec3(sc, 1.45));
  rdc.yz = rot(uLook.y) * rdc.yz;
  rdc.xz = rot(uLook.x) * rdc.xz;
  vec3 rd = rdc;
  vec3 ro = camPath(uDist);

  // レイマーチ：不透明な紋様の殻に窓が開いた無限空間
  float t = 0.01;
  float glowAcc = 0.0;
  bool hit = false;
  vec3 p = ro;
  for (int i = 0; i < 90; i++) {
    p = ro + rd * t;
    float d = map(p, ro);
    glowAcc += exp(-max(d, 0.0) * 5.5) * 0.014;
    if (d < 0.0015 * (1.0 + t)) { hit = true; break; }
    t += max(d * 0.8, 0.006);
    if (t > 46.0) break;
  }

  vec3 col = vec3(0.0);

  if (hit) {
    vec3 n = calcNormal(p, ro);
    float lod = smoothstep(30.0, 6.0, t);
    vec3 m = surfPattern(p, lod);

    // 線の高さで法線を歪め、丸い粘土紐の盛り上がりとして陰影を付ける
    float bLod = smoothstep(24.0, 4.0, t);
    if (bLod > 0.02) {
      float e2 = 0.03;
      vec3 tb1 = normalize(cross(n, vec3(0.577, 0.31, 0.755)));
      vec3 tb2 = cross(n, tb1);
      vec3 mx = surfPattern(p + tb1 * e2, lod);
      vec3 my = surfPattern(p + tb2 * e2, lod);
      float h0 = m.x + m.y;
      n = normalize(n - (tb1 * (mx.x + mx.y - h0) + tb2 * (my.x + my.y - h0)) * 1.7 * bLod);
    }

    // ほぼヘッドライト + わずかに斜め上からの光
    vec3 L = normalize(-rd + vec3(0.22, 0.34, 0.1));
    float diff = max(dot(n, L), 0.0);
    float atten = 1.0 / (1.0 + t * t * 0.03);

    // 素地：闇に沈む土器の肌（隆線の陰影が乗る）
    col = (uColA * 0.11 + uColB * 0.05) * (0.18 + 0.82 * diff) * atten;

    // 丸い隆線の頂を滑る鏡面ハイライト
    float spec = pow(max(dot(reflect(rd, n), L), 0.0), 26.0);
    col += (uColA * 0.45 + uColB * 0.45 + vec3(0.28)) * spec * 0.55 * atten;

    // 刻線のネオン発光：丸断面の中心（頂）ほど強く光る
    float lineA = pow(min(m.x, 1.6), 1.25);
    float lineB = pow(min(m.y, 1.6), 1.25);
    float pulse = 0.86 + 0.14 * sin(uTime * 0.6 + p.z * 0.3);
    float eAtten = 1.0 / (1.0 + t * 0.13);
    col += (uColA * lineA + uColB * lineB) * pulse * eAtten * (0.7 + 0.3 * diff) * 3.0;

    // 窓の縁や曲面の稜線を照らすリムライト
    float rim = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
    col += (uColA * 0.55 + uColB * 0.45) * rim * 0.22 * atten;
  }

  // 空間を満たす微光（ネオンのハロー）
  col += (uColA * 0.7 + uColB * 0.3) * glowAcc * 0.9 * uGlow;

  // 奥への霧
  col = mix(col, vec3(0.0), 1.0 - exp(-t * 0.045));

  col = 1.0 - exp(-col * 1.4);
  col = pow(col, vec3(0.82));
  float vig = 1.0 - 0.3 * dot(sc, sc);
  col *= clamp(vig, 0.0, 1.0);
  float grain = hash21(gl_FragCoord.xy + fract(uTime) * 100.0);
  col += (grain - 0.5) * 0.02;

  gl_FragColor = vec4(col, 1.0);
}
`;

// ---------------------------------------------------------------- setup

const canvas = document.getElementById("gl");
const errBox = document.getElementById("fserr");

function fail(msg) {
  errBox.textContent = msg;
  errBox.style.display = "block";
}

try {
  const gl = canvas.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" })
          || canvas.getContext("experimental-webgl", { antialias: false, alpha: false });
  if (!gl) {
    fail("WebGL を利用できませんでした。\nSafari / Chrome など WebGL 対応ブラウザでこのファイルを開いてください。");
  } else {
    main(gl);
  }
} catch (e) {
  fail("起動に失敗しました:\n" + (e && e.message ? e.message : e));
}

function compile(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error("shader: " + gl.getShaderInfoLog(s));
  }
  return s;
}

function main(gl) {
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error("link: " + gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  for (const name of ["uRes", "uTime", "uDist", "uLook", "uColA", "uColB", "uGlow"]) {
    U[name] = gl.getUniformLocation(prog, name);
  }

  // ---------------------------------------------------------------- themes

  const THEMES = MONO ? [
    { a: [0.94, 0.96, 1.00], b: [0.42, 0.50, 0.58], glow: 0.55 },
  ] : [
    { a: [1.00, 0.42, 0.07], b: [0.12, 0.65, 1.00], glow: 1.0 },  // 火焔
    { a: [0.15, 0.55, 1.00], b: [0.85, 0.93, 1.00], glow: 0.9 },  // 蒼冥
    { a: [0.90, 0.92, 0.95], b: [0.40, 0.50, 0.58], glow: 0.5 },  // 幽玄
  ];
  const cur = { a: [...THEMES[0].a], b: [...THEMES[0].b], glow: THEMES[0].glow };
  let target = THEMES[0];

  if (MONO) {
    document.getElementById("controls").style.display = "none";
  } else {
    document.querySelectorAll("#controls button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#controls button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        target = THEMES[+btn.dataset.theme];
        wakeUI();
      });
    });
  }

  // ---------------------------------------------------------------- input

  let speed = 1.2;
  const speedInput = document.getElementById("speed");
  speedInput.addEventListener("input", () => { speed = +speedInput.value; wakeUI(); });

  window.addEventListener("wheel", (e) => {
    speed = Math.min(5, Math.max(0.1, speed - Math.sign(e.deltaY) * 0.2));
    speedInput.value = speed;
    wakeUI();
  }, { passive: true });

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp")   { speed = Math.min(5, speed + 0.2); speedInput.value = speed; wakeUI(); }
    if (e.key === "ArrowDown") { speed = Math.max(0.1, speed - 0.2); speedInput.value = speed; wakeUI(); }
  });

  // 視点：ヨーは 360 度自由、ピッチは真上・真下の少し手前まで
  const look = { x: 0, y: 0, tx: 0, ty: 0 };
  let dragging = false, lastX = 0, lastY = 0;
  let lastInteract = 0;

  canvas.addEventListener("pointerdown", (e) => {
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add("dragging");
    canvas.setPointerCapture(e.pointerId);
    lastInteract = performance.now();
    wakeUI();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    look.tx += (e.clientX - lastX) * 0.004;
    look.ty = clamp(look.ty + (e.clientY - lastY) * 0.004, -1.45, 1.45);
    lastX = e.clientX; lastY = e.clientY;
    lastInteract = performance.now();
  });
  const endDrag = () => { dragging = false; canvas.classList.remove("dragging"); };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  // ---------------------------------------------------------------- UI fade

  const uiEls = [document.getElementById("controls"), document.getElementById("speedbox")];
  let uiTimer = null;
  function wakeUI() {
    uiEls.forEach((el) => el.classList.remove("hidden"));
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => uiEls.forEach((el) => el.classList.add("hidden")), 4000);
  }
  window.addEventListener("pointermove", wakeUI, { passive: true });
  wakeUI();

  // ---------------------------------------------------------------- resize & adaptive quality

  // ?rs=0.5 のように解像度倍率を固定できる（動作確認用）
  const forcedScale = parseFloat(new URLSearchParams(location.search).get("rs") || "");
  let renderScale = isFinite(forcedScale) ? forcedScale : Math.min(window.devicePixelRatio || 1, 1.75);
  let qualityMul = 1.0;
  function resize() {
    const s = renderScale * qualityMul;
    canvas.width  = Math.max(1, Math.round(window.innerWidth * s));
    canvas.height = Math.max(1, Math.round(window.innerHeight * s));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize);
  resize();

  let frameAvg = 16;
  let lastQualityCheck = 0;

  // ---------------------------------------------------------------- loop

  let dist = 0;
  let prev = performance.now();

  function frame(now) {
    const dtMs = Math.min(now - prev, 100);
    const dt = dtMs / 1000;
    prev = now;

    // 漂うように前進
    dist += speed * dt * 0.55;

    // 触っていない間はゆっくり視線が流れる
    if (!dragging && now - lastInteract > 4000) {
      look.tx += dt * 0.035;
    }
    const ease = 1 - Math.pow(0.002, dt);
    look.x += (look.tx - look.x) * ease;
    look.y += (look.ty - look.y) * ease;

    // テーマ色の補間
    const ct = 1 - Math.pow(0.15, dt);
    for (let i = 0; i < 3; i++) {
      cur.a[i] += (target.a[i] - cur.a[i]) * ct;
      cur.b[i] += (target.b[i] - cur.b[i]) * ct;
    }
    cur.glow += (target.glow - cur.glow) * ct;

    // 簡易アダプティブ品質
    frameAvg = frameAvg * 0.95 + dtMs * 0.05;
    if (!isFinite(forcedScale) && now - lastQualityCheck > 2000) {
      lastQualityCheck = now;
      if (frameAvg > 28 && qualityMul > 0.35) { qualityMul = Math.max(0.35, qualityMul - 0.15); resize(); }
      else if (frameAvg < 15 && qualityMul < 1.0) { qualityMul = Math.min(1.0, qualityMul + 0.1); resize(); }
    }

    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, now / 1000);
    gl.uniform1f(U.uDist, dist);
    gl.uniform2f(U.uLook, -look.x, -look.y);
    gl.uniform3fv(U.uColA, cur.a);
    gl.uniform3fv(U.uColB, cur.b);
    gl.uniform1f(U.uGlow, cur.glow);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}
</script>
</body>
</html>
