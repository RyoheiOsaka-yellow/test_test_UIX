<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spectral — うねうね generative art</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #eeeae9; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  "use strict";

  // ---------- seeded PRNG (deterministic) ----------
  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(20250807);

  // ---------- 3D value noise + fbm ----------
  const PERM = new Uint8Array(512);
  {
    const p = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) {
      const j = (rand() * (i + 1)) | 0;
      [p[i], p[j]] = [p[j], p[i]];
    }
    for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
  }
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  function noise3(x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const h = (i, j, k) => PERM[(PERM[(PERM[(X + i) & 255] + Y + j) & 255] + Z + k) & 255] / 255;
    const lerp = (a, b, t) => a + (b - a) * t;
    return lerp(
      lerp(lerp(h(0,0,0), h(1,0,0), u), lerp(h(0,1,0), h(1,1,0), u), v),
      lerp(lerp(h(0,0,1), h(1,0,1), u), lerp(h(0,1,1), h(1,1,1), u), v),
      w
    ) * 2 - 1;
  }
  function fbm(x, y, z) {
    return noise3(x, y, z) * 0.65 + noise3(x * 2.1, y * 2.1, z * 1.7) * 0.35;
  }

  // ---------- canvas setup ----------
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1, SCALE = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    SCALE = Math.min(W, H) / 900;
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- scene population ----------
  // creatures: noise-driven tapered tube "worms"
  const CREATURES = [];
  const N_CREATURES = 130;
  for (let i = 0; i < N_CREATURES; i++) {
    const width = 14 + rand() * rand() * 42;         // head width, mostly chunky
    CREATURES.push({
      ax: rand(), ay: rand(),                       // anchor (0..1)
      segs: 8 + (rand() * 16) | 0,                   // body segments
      width,
      step: width * (0.45 + rand() * 0.3),           // segment length scales with girth
      bias: rand() * Math.PI * 2,                    // preferred direction
      turn: 2.4 + rand() * 2.6,                      // how curly
      wamp: 3 + rand() * 9,                          // wriggle amplitude
      wfreq: 0.5 + rand() * 0.9,                     // wriggle frequency
      speed: 0.5 + rand() * 1.1,                     // wriggle speed
      phase: rand() * Math.PI * 2,
      tone: 0.15 + rand() * 0.6,                     // 0 dark .. 1 light
      z: rand()                                      // draw-order depth
    });
  }

  // wigglers: tiny fast tadpole-like squiggles clustered in patches
  const WIGGLERS = [];
  {
    const nClusters = 9;
    for (let cl = 0; cl < nClusters; cl++) {
      const cx = rand(), cy = rand(), n = 8 + (rand() * 14) | 0;
      for (let i = 0; i < n; i++) {
        WIGGLERS.push({
          ax: cx + (rand() - 0.5) * 0.22, ay: cy + (rand() - 0.5) * 0.22,
          segs: 6 + (rand() * 5) | 0,
          width: 2.5 + rand() * 3.5,
          step: 5 + rand() * 4,
          bias: rand() * Math.PI * 2,
          turn: 3 + rand() * 3,
          wamp: 3 + rand() * 4,
          wfreq: 1.2 + rand() * 1.2,
          speed: 2 + rand() * 2.5,
          phase: rand() * Math.PI * 2,
          tone: 0.3 + rand() * 0.5,
          z: rand()
        });
      }
    }
  }

  // orbs: glossy spheres with dark pupils (the "eyeballs")
  const ORBS = [];
  for (let i = 0; i < 46; i++) {
    ORBS.push({
      ax: rand(), ay: rand(),
      r: 10 + rand() * 34,
      pupil: 0.35 + rand() * 0.35,
      px: (rand() - 0.5) * 0.5, py: (rand() - 0.5) * 0.5,
      bob: rand() * Math.PI * 2,
      tone: 0.35 + rand() * 0.5,
      z: rand()
    });
  }

  // motes: tiny scattered dots
  const MOTES = [];
  for (let i = 0; i < 260; i++) {
    MOTES.push({ ax: rand(), ay: rand(), r: 0.8 + rand() * 2.4, bob: rand() * Math.PI * 2 });
  }

  const gray = v => {
    const g = Math.max(0, Math.min(255, Math.round(v * 255)));
    return `rgb(${g},${g},${g})`;
  };

  // ---------- drawing ----------
  function drawCreature(c, t) {
    const NS = 0.0016 / Math.max(SCALE, 0.6);      // noise spatial scale
    let x = c.ax * W, y = c.ay * H;
    // anchor drift so whole bodies slowly roam
    x += fbm(c.ax * 3, c.ay * 3, t * 0.08) * 40 * SCALE;
    y += fbm(c.ay * 3 + 9, c.ax * 3, t * 0.08) * 40 * SCALE;

    // build spine through the noise flow field
    const pts = [];
    let px = x, py = y;
    for (let i = 0; i < c.segs; i++) {
      const a = c.bias + fbm(px * NS, py * NS, t * 0.12 + c.phase) * c.turn;
      px += Math.cos(a) * c.step * SCALE;
      py += Math.sin(a) * c.step * SCALE;
      // perpendicular wriggle wave traveling down the body
      const wave = Math.sin(i * c.wfreq - t * c.speed * 2.2 + c.phase) * c.wamp * SCALE;
      pts.push([px + Math.cos(a + Math.PI / 2) * wave, py + Math.sin(a + Math.PI / 2) * wave]);
    }

    // tapered tube: per-segment strokes, 3 passes for cylindrical shading
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const passes = [
      { w: 1.00, tone: c.tone * 0.5, dx: 0, dy: 0 },                  // dark rim
      { w: 0.70, tone: c.tone * 0.5 + 0.26, dx: -0.05, dy: -0.05 },   // mid body
      { w: 0.34, tone: c.tone * 0.35 + 0.55, dx: -0.09, dy: -0.09 }   // soft core light
    ];
    for (const p of passes) {
      ctx.strokeStyle = gray(p.tone);
      for (let i = 1; i < pts.length; i++) {
        const k = i / (pts.length - 1);                 // 0 tail .. 1 head
        const wdt = c.width * SCALE * (0.15 + 0.85 * k) * p.w;
        ctx.lineWidth = Math.max(wdt, 0.5);
        const off = c.width * SCALE * 0.25;
        ctx.beginPath();
        ctx.moveTo(pts[i - 1][0] + p.dx * off, pts[i - 1][1] + p.dy * off);
        ctx.lineTo(pts[i][0] + p.dx * off, pts[i][1] + p.dy * off);
        ctx.stroke();
      }
    }

    // head eye
    const [hx, hy] = pts[pts.length - 1];
    const er = c.width * SCALE * 0.42;
    ctx.fillStyle = "rgba(18,16,17,0.92)";
    ctx.beginPath(); ctx.arc(hx, hy, er, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath(); ctx.arc(hx - er * 0.3, hy - er * 0.3, er * 0.22, 0, Math.PI * 2); ctx.fill();
  }

  function drawOrb(o, t) {
    const bobx = fbm(o.ax * 5, t * 0.1, o.bob) * 18 * SCALE;
    const boby = Math.sin(t * 0.7 + o.bob) * 8 * SCALE;
    const x = o.ax * W + bobx, y = o.ay * H + boby;
    const r = o.r * SCALE * (1 + Math.sin(t * 0.9 + o.bob) * 0.04);

    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, gray(Math.min(o.tone + 0.4, 0.96)));
    g.addColorStop(0.7, gray(o.tone));
    g.addColorStop(1, gray(o.tone * 0.55));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

    // pupil
    const pr = r * o.pupil;
    ctx.fillStyle = "rgba(15,13,14,0.95)";
    ctx.beginPath(); ctx.arc(x + o.px * r, y + o.py * r, pr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.beginPath(); ctx.arc(x + o.px * r - pr * 0.3, y + o.py * r - pr * 0.3, pr * 0.2, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- render loop ----------
  const drawables = [
    ...CREATURES.map(c => ({ z: c.z, kind: "creature", o: c })),
    ...WIGGLERS.map(c => ({ z: c.z, kind: "creature", o: c })),
    ...ORBS.map(o => ({ z: o.z, kind: "orb", o }))
  ].sort((a, b) => a.z - b.z);

  function frame(ms) {
    const t = ms / 1000;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // background: pale ground with soft center glow
    ctx.fillStyle = "#eae6e5";
    ctx.fillRect(0, 0, W, H);
    const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    bg.addColorStop(0, "rgba(255,255,255,0.65)");
    bg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // motes
    ctx.fillStyle = "rgba(25,22,23,0.8)";
    for (const m of MOTES) {
      const x = m.ax * W + Math.sin(t * 0.8 + m.bob) * 4 * SCALE;
      const y = m.ay * H + Math.cos(t * 0.6 + m.bob) * 4 * SCALE;
      ctx.beginPath(); ctx.arc(x, y, m.r * SCALE, 0, Math.PI * 2); ctx.fill();
    }

    for (const d of drawables) {
      if (d.kind === "creature") drawCreature(d.o, t);
      else drawOrb(d.o, t);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
