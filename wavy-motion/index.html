<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spectral — raymarched うねうね</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #ece8e7; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #err { position: fixed; inset: 0; display: none; place-items: center;
         font: 14px/1.6 sans-serif; color: #444; padding: 2em; text-align: center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err">このブラウザは WebGL に対応していないため表示できません。<br>
代わりに <a href="canvas2d.html">Canvas 2D 版</a> をご覧ください。</div>

<script id="frag" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uRes;
uniform float uTime;

// ---------- hashing ----------
float hash1(vec3 p) {
  p = fract(p * 0.3183099 + vec3(0.11, 0.23, 0.37));
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
vec3 hash3(vec3 p) {
  return vec3(hash1(p), hash1(p + 11.13), hash1(p + 27.71));
}
mat2 rot2(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

// ---------- scene constants ----------
const float CELL_W = 2.8;   // worm repetition cell
const float CELL_O = 3.6;   // orb repetition cell
const vec3  ORB_OFF = vec3(1.13, 2.71, 0.58);
const float MAXD = 26.0;

// Scene SDF.  Returns vec3(distance, materialId, tone).
// materials: 1 = worm body, 2 = worm eye, 3 = orb
vec3 map(vec3 p) {
  float d = 1e9, mat = 0.0, tone = 0.5;

  // ---- worms: one wriggling tapered tube per cell ----
  vec3 idW = floor(p / CELL_W);
  vec3 h = hash3(idW);
  vec3 qc = p - (idW + 0.5) * CELL_W;
  // never step past this cell's boundary — neighbour cells hold other creatures
  float bound = CELL_W * 0.5 - max(abs(qc.x), max(abs(qc.y), abs(qc.z)));
  if (h.x > 0.08) {
    vec3 q = qc;
    q.xy = rot2(h.y * 6.2832) * q.xy;
    q.yz = rot2(h.z * 6.2832) * q.yz;
    q.xz = rot2(h.x * 6.2832) * q.xz;

    float ph = h.z * 6.2832;
    float tt = uTime * (0.7 + h.x * 1.0);
    float L  = 0.6 + h.y * 0.35;                        // half length
    float amp = 0.12 + h.x * 0.06;                      // wriggle amplitude
    // undulating spine offset, a wave traveling down the body (the うねうね)
    vec2 w = vec2(sin(q.z * 4.6 + ph + tt),
                  cos(q.z * 3.3 + ph * 1.3 + tt * 0.85)) * amp;
    float k = clamp((q.z + L) / (2.0 * L), 0.0, 1.0);   // 0 tail .. 1 head
    float rHead = 0.12 + h.y * 0.12;
    float r = mix(0.035, rHead, k);
    float dz = max(abs(q.z) - L, 0.0);
    float dw = length(vec2(length(q.xy - w), dz)) - r;
    d = dw * 0.7;                                       // Lipschitz margin for the sine warp
    mat = 1.0; tone = 0.3 + h.z * 0.45;

    // dark eye capping the head, pushed just past the tip
    vec2 wh = vec2(sin(L * 4.6 + ph + tt),
                   cos(L * 3.3 + ph * 1.3 + tt * 0.85)) * amp;
    float de = length(q - vec3(wh, L + rHead * 0.35)) - rHead * 0.8;
    if (de < d) { d = de; mat = 2.0; }
  }

  // ---- orbs: floating eyeball spheres, offset grid ----
  vec3 po = p + ORB_OFF;
  vec3 idO = floor(po / CELL_O);
  vec3 ho = hash3(idO + 31.7);
  vec3 qb = po - (idO + 0.5) * CELL_O;
  bound = min(bound, CELL_O * 0.5 - max(abs(qb.x), max(abs(qb.y), abs(qb.z))));
  if (ho.x > 0.45) {
    vec3 qo = qb + (ho - 0.5) * 1.1;
    qo += 0.1 * sin(uTime * 0.5 + ho * 6.2832);         // slow bobbing
    float ro = 0.22 + ho.y * 0.45;
    float dOrb = length(qo) - ro;
    if (dOrb < d) { d = dOrb; mat = 3.0; tone = 0.5 + ho.z * 0.35; }
  }

  return vec3(min(d, bound + 0.03), mat, tone);
}

vec3 calcNormal(vec3 p) {
  const vec2 e = vec2(0.0015, -0.0015);
  return normalize(e.xyy * map(p + e.xyy).x + e.yyx * map(p + e.yyx).x +
                   e.yxy * map(p + e.yxy).x + e.xxx * map(p + e.xxx).x);
}

float calcAO(vec3 p, vec3 n) {
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 5; i++) {
    float hh = 0.02 + 0.11 * float(i);
    occ += (hh - map(p + n * hh).x) * sca;
    sca *= 0.75;
  }
  return clamp(1.0 - 2.2 * occ, 0.0, 1.0);
}

void main() {
  vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / min(uRes.x, uRes.y);

  // slow drifting camera pushing forward through the field
  float ct = uTime * 0.32;
  vec3 ro = vec3(0.7 * sin(uTime * 0.10), 0.55 * sin(uTime * 0.13), ct);
  vec3 fwd = normalize(vec3(0.12 * sin(uTime * 0.07), 0.10 * cos(uTime * 0.09), 1.0));
  vec3 rgt = normalize(cross(fwd, vec3(sin(uTime * 0.05) * 0.08, 1.0, 0.0)));
  vec3 up  = cross(rgt, fwd);
  vec3 rd = normalize(uv.x * rgt + uv.y * up + 1.5 * fwd);

  const vec3 BG = vec3(0.925, 0.912, 0.905);

  // raymarch
  float t = 0.0; vec3 res = vec3(0.0);
  bool hit = false;
  for (int i = 0; i < 160; i++) {
    vec3 pos = ro + rd * t;
    res = map(pos);
    if (res.x < 0.0008 + 0.0012 * t) { hit = true; break; }
    t += res.x * 0.8;
    if (t > MAXD) break;
  }

  vec3 col = BG;
  if (hit) {
    vec3 pos = ro + rd * t;
    vec3 n = calcNormal(pos);
    float ao = calcAO(pos, n);
    vec3 lig = normalize(vec3(0.45, 0.75, -0.35));
    float dif = clamp(dot(n, lig), 0.0, 1.0);
    float bnc = clamp(dot(n, -lig) * 0.5 + 0.5, 0.0, 1.0) * 0.18;
    float spe = pow(clamp(dot(reflect(rd, n), lig), 0.0, 1.0), 24.0);

    float g = res.z;                                    // base tone
    if (res.y > 2.5) {
      // orb with a pupil looking roughly toward the camera
      vec3 po = pos + ORB_OFF;
      vec3 ho = hash3(floor(po / CELL_O) + 31.7);
      vec3 pupilDir = normalize(ho - 0.5 + vec3(0.0, 0.0, -0.9));
      float pupil = smoothstep(0.80, 0.88, dot(n, pupilDir));
      g = mix(g, 0.045, pupil);
      spe *= 1.6;
    } else if (res.y > 1.5) {
      g = 0.05;                                         // worm eye: near black
      spe *= 2.2;
    }

    col = vec3(g) * (0.42 + 0.58 * dif + bnc) * ao + spe * 0.35;

    // pale fog — far creatures dissolve into the light
    float fog = 1.0 - exp(-0.006 * t * t);
    col = mix(col, BG, fog);
  }

  // gentle vignette-in-reverse: bright center, like backlit film
  float r2 = dot(uv, uv);
  col += (0.05 - 0.045 * r2) * vec3(1.0);

  gl_FragColor = vec4(pow(col, vec3(0.93)), 1.0);
}
</script>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl", { antialias: false }) ||
             canvas.getContext("experimental-webgl");
  if (!gl) {
    canvas.style.display = "none";
    document.getElementById("err").style.display = "grid";
    return;
  }

  const VERT = "attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }";
  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById("frag").textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  // fullscreen triangle
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(prog, "uRes");
  const uTime = gl.getUniformLocation(prog, "uTime");

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize);
  resize();

  function frame(ms) {
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, ms / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
