<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XBUILD — データフロー層 P6</title>
<style>
  :root{
    --bg:#0e1013; --panel:#15181d; --panel2:#1b1f26; --line:#272c34;
    --fg:#d6dae1; --dim:#7f8a99; --acc:#f0c341; --ok:#6fcf8a; --bad:#e8705f; --warn:#e2b04a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:12px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Noto Sans JP",sans-serif;}
  #app{display:grid;height:100vh;
    grid-template-columns:230px 1fr 260px;
    grid-template-rows:38px 1fr 196px;
    grid-template-areas:"hd hd hd" "lf vp rt" "bt bt bt";}
  header{grid-area:hd;display:flex;align-items:center;gap:14px;padding:0 12px;
    border-bottom:1px solid var(--line);background:var(--panel);}
  header h1{font-size:12px;margin:0;font-weight:600;letter-spacing:.06em}
  header h1 b{color:var(--acc)}
  #stats{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:3px;padding:3px 10px;cursor:pointer;font-size:11px}
  button:hover{border-color:var(--acc);color:var(--acc)}
  aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line)}
  #left{grid-area:lf} #right{grid-area:rt;border-right:none;border-left:1px solid var(--line)}
  #viewport{grid-area:vp;position:relative;overflow:hidden}
  #viewport canvas{position:absolute;inset:0;display:block}
  #bottom{grid-area:bt;background:var(--panel);border-top:1px solid var(--line);overflow:auto;padding:6px 10px}
  h2{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;
    margin:10px 10px 4px;font-weight:600}
  .row{display:flex;align-items:center;gap:6px;padding:4px 10px;cursor:pointer;border-left:2px solid transparent}
  .row:hover{background:#1d222a}
  .row.sel{background:#20262f;border-left-color:var(--acc)}
  .row.indent{padding-left:18px}
  .row.err{color:var(--bad)}
  .row input[type=checkbox]{margin:0;accent-color:var(--acc)}
  .tag{margin-left:auto;color:var(--dim);font-style:normal;font-size:10px}
  .pfield{padding:3px 10px;display:flex;align-items:center;gap:8px}
  .pfield label{width:82px;color:var(--dim);flex:none}
  .pfield input{flex:1;min-width:0;background:#0f1216;border:1px solid var(--line);
    color:var(--fg);border-radius:3px;padding:3px 6px;font:inherit}
  .pfield input:focus{outline:none;border-color:var(--acc)}
  .vec{display:flex;gap:4px;flex:1;min-width:0}
  #snipwrap{padding:6px 10px}
  #snippet{width:100%;height:112px;background:#0f1216;border:1px solid var(--line);color:var(--fg);
    border-radius:3px;padding:6px;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
  #snipwrap .bar{display:flex;gap:6px;margin-top:5px;align-items:center}
  select{background:#0f1216;color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:3px 6px;font:inherit}
  table{border-collapse:collapse;font-variant-numeric:tabular-nums;table-layout:fixed;width:620px}
  th,td{text-align:left;padding:2px 8px;border-bottom:1px solid #1e2229;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  col.c1{width:150px} col.c2{width:60px} col.c3{width:80px} col.c4{width:80px}
  col.c5{width:56px} col.c6{width:190px}
  th{color:var(--dim);font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  td:nth-child(2),td:nth-child(3),td:nth-child(4){text-align:right}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .cache{color:var(--dim)}
  .hint{color:var(--dim);padding:4px 10px 10px;line-height:1.6}
  #pickinfo{position:absolute;left:10px;top:10px;z-index:5;background:rgba(21,24,29,.93);
    border:1px solid var(--line);border-radius:4px;padding:8px 10px;max-width:250px;
    pointer-events:none;display:none;font-variant-numeric:tabular-nums}
  #pickinfo b{color:var(--acc);display:block;margin-bottom:4px}
  #pickinfo table{width:auto;table-layout:auto}
  #pickinfo td{border:none;padding:1px 8px 1px 0;white-space:nowrap}
  #pickinfo td:first-child{color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>XBUILD <b>データフロー層</b> — 東静岡アリーナ予定地 / 実データ</h1>
    <button id="play">▶ 再生</button>
    <button id="reset">リセット</button>
    <span id="stats"></span>
  </header>

  <aside id="left">
    <h2>シーン</h2>
    <div id="outliner"></div>
    <div class="hint">
      左ドラッグ=回転 / 右ドラッグ=移動 / ホイール=ズーム / クリック=プリム選択
      <div style="margin-top:8px;color:#5f6b7a;line-height:1.5">
        建物: PLATEAU 静岡市 建築物モデル LOD1 (2023)<br>
        道路: OpenStreetMap<br>
        アリーナ: 静岡市公表の計画値
      </div>
    </div>
  </aside>

  <div id="viewport"><div id="pickinfo"></div></div>

  <aside id="right">
    <h2>ノード</h2>
    <div id="nodelist"></div>
    <h2>パラメータ</h2>
    <div id="params"></div>
    <div id="snipwrap">
      <textarea id="snippet" spellcheck="false"></textarea>
      <div class="bar">
        <select id="snipclass">
          <option value="point">point</option>
          <option value="prim">prim</option>
          <option value="vertex">vertex</option>
          <option value="detail">detail</option>
        </select>
        <button id="snipapply">適用</button>
      </div>
    </div>
  </aside>

  <div id="bottom">
    <h2 style="margin:0 0 4px">評価レポート</h2>
    <div id="report"></div>
  </div>
</div>

/* ============================================================
   XBUILD データフロー層 — convert.js

   three.js を import しない。ビューア側が THREE.BufferAttribute に包む。

'use strict';

/* ---------- 多角形の三角形分割（耳切り法） ---------- */

/** Newell 法による面法線 */
function faceNormal(pts) {
  let nx = 0, ny = 0, nz = 0;
  for (let i = 0, n = pts.length; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    nx += (a[1] - b[1]) * (a[2] + b[2]);
    ny += (a[2] - b[2]) * (a[0] + b[0]);
    nz += (a[0] - b[0]) * (a[1] + b[1]);

  const L = Math.hypot(nx, ny, nz) || 1;
  return [nx / L, ny / L, nz / L];

function planeBasis(N) {

  let ux = a[1] * N[2] - a[2] * N[1];
  let uy = a[2] * N[0] - a[0] * N[2];
  let uz = a[0] * N[1] - a[1] * N[0];
  const L = Math.hypot(ux, uy, uz) || 1;
  ux /= L; uy /= L; uz /= L;
  return [
    [ux, uy, uz],
    [N[1] * uz - N[2] * uy, N[2] * ux - N[0] * uz, N[0] * uy - N[1] * ux],

  let s = 0;

    s += a[0] * b[1] - b[0] * a[1];

  return s / 2;

  const d1 = (px - bx) * (ay - by) - (ax - bx) * (py - by);
  const d2 = (px - cx) * (by - cy) - (bx - cx) * (py - cy);
  const d3 = (px - ax) * (cy - ay) - (cx - ax) * (py - ay);
  const neg = (d1 < 0) || (d2 < 0) || (d3 < 0);
  const pos = (d1 > 0) || (d2 > 0) || (d3 > 0);
  return !(neg && pos);

 * pts: [[x,y,z], ...]（凹多角形可、自己交差は非対応）

    p[0] * V[0] + p[1] * V[1] + p[2] * V[2],
  ]);

      if (cross <= 0) continue;                    // 凸でない頂点は耳にならない

}

        const a = src.prim.get(name);

  });

   XBUILD SOP Layer — nodes.js

reg.register({

  label: 'Grid',
  inputs: [],

    rows: { type: 'int', default: 3 },

  },
});

reg.register({

  label: 'Transform',
  inputs: [{ name: 'geo', required: true }],
  params: { translate: { type: 'vec3', default: [0, 0, 0] } },
  cook(ctx) {

  label: 'Merge',
  inputs: [{ name: 'a' }, { name: 'b' }],
  params: {},

  inputs: [{ name: 'geo', required: true }],
  params: {

installSubnet(reg);

/* ---------- P5: For-Each ブロック（src/foreach.js） ---------- */
const { installForEach } = require('./foreach');
installForEach(reg);

module.exports = {
  reg, compileSnippet, snippetIsTimeDependent, stripNonCode,
  registerAsset, assetFromSubnet,
};

});

/* ============================================================
   XBUILD データフロー層 — demo_nodes.js
   P6 のエンドツーエンド検証用ノード群。
   XBUILD / FLOW·LAB / xPop の3系統が同じ GeoSet に載ることを示す。
   ============================================================ */

'use strict';

const { GeoSet } = require('./geo');
const { reg } = require('./nodes');

/* 決定論 PRNG（シード固定で毎回同じ街が出る） */
function prng(seed) {
  let s = seed >>> 0 || 1;
  return () => ((s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
}

/* ---------- ctxbuildings : PLATEAU 文脈建物相当 ---------- */
reg.register({
  type: 'ctxbuildings',
  label: '文脈建物',
  inputs: [],
  params: {
    count:  { type: 'int',   default: 400 },
    seed:   { type: 'int',   default: 20260813 },
    radius: { type: 'float', default: 260 },
    clear:  { type: 'float', default: 55 },
  },
  cook(ctx) {
    const { count, seed, radius, clear } = ctx.params;
    const rnd = prng(seed);
    const g = new GeoSet();
    g.reserve(count * 8, count * 20, count * 5);
    const name = g.addAttrib('prim', 'name', 'string');
    const height = g.addAttrib('prim', 'height', 'float');
    const part = g.addAttrib('prim', 'part', 'string');

    while (made < count && guard++ < count * 20) {
      const a = rnd() * Math.PI * 2;
      const r = clear + Math.sqrt(rnd()) * (radius - clear);
      const cx = Math.cos(a) * r, cy = Math.sin(a) * r;
      const w = 8 + rnd() * 18, d = 8 + rnd() * 18;
      const ht = 6 + Math.pow(rnd(), 2.2) * 52;
      const x = cx - w / 2, y = cy - d / 2;

      const lo = [
        g.addPoint(x, y, 0), g.addPoint(x + w, y, 0),
        g.addPoint(x + w, y + d, 0), g.addPoint(x, y + d, 0),

        g.addPoint(x, y, ht), g.addPoint(x + w, y, ht),
        g.addPoint(x + w, y + d, ht), g.addPoint(x, y + d, ht),

/* ---------- tower : パラメトリック建物 ---------- */
reg.register({
  type: 'tower',
  label: '建物',
  inputs: [],
  params: {
    floors:      { type: 'int',   default: 8 },
    floorHeight: { type: 'float', default: 4.2 },
    width:       { type: 'float', default: 32 },
    depth:       { type: 'float', default: 20 },
    setback:     { type: 'float', default: 0.0 },
  },
  cook(ctx) {
    const { floors, floorHeight, width, depth, setback } = ctx.params;
    const g = new GeoSet();
    g.reserve(floors * 16, floors * 40, floors * 12);
    const part = g.addAttrib('prim', 'part', 'string');
    const lvl = g.addAttrib('prim', 'level', 'int');
    const height = g.addAttrib('prim', 'height', 'float');

    for (let f = 0; f < floors; f++) {
      const t = floors > 1 ? f / (floors - 1) : 0;
      const w = width * (1 - setback * t) / 2, d = depth * (1 - setback * t) / 2;
      const z0 = f * floorHeight, z1 = z0 + floorHeight;

      const lo = [
        g.addPoint(-w, -d, z0), g.addPoint(w, -d, z0),
        g.addPoint(w, d, z0), g.addPoint(-w, d, z0),
      ];
      const hi = [
        g.addPoint(-w, -d, z1), g.addPoint(w, -d, z1),
        g.addPoint(w, d, z1), g.addPoint(-w, d, z1),
      ];
      const slab = g.addPrim(lo);
      part.set(slab, 'slab'); lvl.set(slab, f); height.set(slab, z0);
      for (let k = 0; k < 4; k++) {
        const pi = g.addPrim([lo[k], lo[(k + 1) % 4], hi[(k + 1) % 4], hi[k]]);
        part.set(pi, 'facade'); lvl.set(pi, f); height.set(pi, z0);
      }
      if (f === floors - 1) {
        const roof = g.addPrim(hi);
        part.set(roof, 'roof'); lvl.set(roof, f); height.set(roof, z1);
      }
    }
    g.detail.add('source', 'string').set(0, 'tower');
    return g;
  },
});

/* ---------- agents : 時間依存の人流点 ---------- */
reg.register({
  type: 'agents',
  label: '人流エージェント',
  inputs: [],
  params: {
    count:  { type: 'int',   default: 600 },
    seed:   { type: 'int',   default: 7 },
    radius: { type: 'float', default: 90 },
    speed:  { type: 'float', default: 0.35 },
  },
  timeDep: true,
  cook(ctx) {
    const { count, seed, radius, speed } = ctx.params;
    const rnd = prng(seed);
    const g = new GeoSet();
    g.reserve(count, count, count);
    const v = g.addAttrib('point', 'speed', 'float');
    const P = g.point.get('P');

__def("site_nodes", function(module, exports, require){
/* ============================================================
   XBUILD — site_nodes.js
   実データ（PLATEAU LOD1 + OpenStreetMap）を GeoSet へ載せるノード群。
   データは src/site_data.js（bake 済み、原点からのデシメートル整数、差分符号化）。
   ============================================================ */

'use strict';

const { GeoSet } = require('./geo');
const { reg } = require('./demo_nodes');
const DATA = require('./site_data');

/* ---------- 差分符号化の展開 ---------- */

function decodeRing(rec, at, n) {
  const ring = new Array(n);
  let x = 0, y = 0;
  for (let i = 0; i < n; i++) {
    x += rec[at + i * 2]; y += rec[at + i * 2 + 1];
    ring[i] = [x / 10, y / 10];
  }
  return ring;
}

/** buildings レコード: [base, h, usageIdx, storeys, year, mh, ringLen, dx, dy, ...] */
function decodeBuildings() {
  if (decodeBuildings._c) return decodeBuildings._c;
  const out = DATA.buildings.map(r => ({
    base: r[0] / 10, h: r[1] / 10,
    usage: r[2] >= 0 ? DATA.usages[r[2]] : '不明',
    storeys: r[3], year: r[4], mh: r[5] / 10,
    ring: decodeRing(r, 7, r[6]),
  }));
  decodeBuildings._c = out;
  return out;
}

/** roads レコード: [walkable, n, dx, dy, ...] */
function decodeRoads() {
  if (decodeRoads._c) return decodeRoads._c;
  const out = DATA.roads.map(r => ({ walk: !!r[0], pts: decodeRing(r, 2, r[1]) }));
  decodeRoads._c = out;
  return out;
}

/* ============================================================
   sitectx : PLATEAU LOD1 の実建物
   ============================================================ */

reg.register({
  type: 'sitectx',
  label: '文脈建物 (PLATEAU)',
  inputs: [],
  params: {
    radius:    { type: 'float',  default: 600 },
    minHeight: { type: 'float',  default: 0 },
    useMh:     { type: 'int',    default: 0 },   // 1 で measuredHeight を高さに使う
  },
  cook(ctx) {
    const src = decodeBuildings();
    const { radius, minHeight, useMh } = ctx.params;
    const g = new GeoSet();
    g.reserve(src.length * 14, src.length * 40, src.length * 9);

    const aHeight  = g.addAttrib('prim', 'height', 'float');
    const aUsage   = g.addAttrib('prim', 'usage', 'string');
    const aStoreys = g.addAttrib('prim', 'storeys', 'int');
    const aYear    = g.addAttrib('prim', 'year', 'int');
    const aPart    = g.addAttrib('prim', 'part', 'string');
    const aDelta   = g.addAttrib('prim', 'mhDelta', 'float');   // |幾何高さ − measuredHeight|
    const aBid     = g.addAttrib('prim', 'bid', 'int');         // 建物インデックス（棟別 For-Each のキー）

    let used = 0, skippedFar = 0, skippedLow = 0, noMh = 0;
    for (const b of src) {
      let cx = 0, cy = 0;
      for (const p of b.ring) { cx += p[0]; cy += p[1]; }
      cx /= b.ring.length; cy /= b.ring.length;
      if (Math.hypot(cx, cy) > radius) { skippedFar++; continue; }

      const hasMh = b.mh > 0;
      if (!hasMh) noMh++;
      const h = (useMh && hasMh) ? b.mh : b.h;
      if (h < minHeight) { skippedLow++; continue; }

      const z0 = b.base, z1 = b.base + h;
      const n = b.ring.length;
      const lo = new Array(n), hi = new Array(n);
      for (let i = 0; i < n; i++) {
        lo[i] = g.addPoint(b.ring[i][0], b.ring[i][1], z0);
        hi[i] = g.addPoint(b.ring[i][0], b.ring[i][1], z1);
      }
      const roof = g.addPrim(hi);
      const tag = (pi) => {
        aHeight.set(pi, h); aUsage.set(pi, b.usage);
        aStoreys.set(pi, b.storeys); aYear.set(pi, b.year);
        aDelta.set(pi, hasMh ? Math.abs(b.h - b.mh) : 0);
        aBid.set(pi, used);
      };
      tag(roof); aPart.set(roof, 'roof');
      for (let i = 0; i < n; i++) {
        const pi = g.addPrim([lo[i], lo[(i + 1) % n], hi[(i + 1) % n], hi[i]]);
        tag(pi); aPart.set(pi, 'wall');
      }
      used++;
    }

    g.detail.add('source', 'string').set(0, DATA.source);
    g.detail.add('buildings', 'int').set(0, used);
    if (skippedFar) ctx.warn(`${skippedFar} buildings outside radius ${radius}m`);
    if (skippedLow) ctx.warn(`${skippedLow} buildings below minHeight ${minHeight}m`);
    if (noMh) ctx.warn(`${noMh} buildings have no measuredHeight attribute`);
    return g;
  },
});

/* ============================================================
   siteroads : OSM 道路網（開いたプリミティブ = 線分）
   ============================================================ */

reg.register({
  type: 'siteroads',
  label: '道路網 (OSM)',
  inputs: [],
  params: {
    walkableOnly: { type: 'int',   default: 1 },
    lift:         { type: 'float', default: 0.3 },
    deck:         { type: 'int',   default: 0 },   // 1: 計画デッキ（仮定線形、§21）も表示する
    vx:           { type: 'float', default: 55 },
    vy:           { type: 'float', default: 65 },
  },
  cook(ctx) {
    const src = decodeRoads();
    const g = new GeoSet();
    let nv = 0;
    for (const w of src) nv += w.pts.length;
    g.reserve(nv, nv, src.length);
    const aWalk = g.addAttrib('prim', 'walk', 'int');
    const aPart = g.addAttrib('prim', 'part', 'string');
    let n = 0;
    for (const w of src) {
      if (ctx.params.walkableOnly && !w.walk) continue;
      const idx = w.pts.map(p => g.addPoint(p[0], p[1], ctx.params.lift));
      const pi = g.addPrim(idx, false);            // closed=false -> 線分
      aWalk.set(pi, w.walk ? 1 : 0);
      aPart.set(pi, 'road');
      n++;
    }
    if (ctx.params.deck) {
      for (const seg of deckSegments(ctx.params.vx, ctx.params.vy)) {
        const z = ctx.params.lift + 6;             // 高架として少し持ち上げて表示
        const pi = g.addPrim([
          g.addPoint(seg.from[0], seg.from[1], z),
          g.addPoint(seg.to[0], seg.to[1], z),
        ], false);
        aWalk.set(pi, 1);
        aPart.set(pi, 'deck');
      }
      ctx.warn('deck alignment is an assumption (station -> venue straight line); the plan is unpublished');
    }
    g.detail.add('roads', 'int').set(0, n);
    return g;
  },
});

/* ============================================================
   roadagents : 実道路網の上を歩く人流エージェント（時間依存）
   ------------------------------------------------------------
   cook は時刻の純関数でなければならない（任意時刻で呼ばれ、結果がキャッシュされる）。
   そのため各エージェントには「固定経路 + 経路上の弧長」を持たせ、
   位置は t から解析的に求める。経路生成はコストが高いのでメモ化する。
   ============================================================ */

function buildGraph() {
  if (buildGraph._c) return buildGraph._c;
  const roads = decodeRoads().filter(w => w.walk);
  const key = new Map();     // "x,y" -> node index
  const pos = [];
  const adj = [];
  const id = (p) => {
    const k = Math.round(p[0] * 2) + ',' + Math.round(p[1] * 2);   // 0.5m で溶接
    let v = key.get(k);
    if (v === undefined) { v = pos.length; key.set(k, v); pos.push([p[0], p[1]]); adj.push([]); }
    return v;
  };
  for (const w of roads) {
    for (let i = 0; i + 1 < w.pts.length; i++) {
      const a = id(w.pts[i]), b = id(w.pts[i + 1]);
      if (a === b) continue;
      const d = Math.hypot(pos[a][0] - pos[b][0], pos[a][1] - pos[b][1]);
      adj[a].push([b, d]); adj[b].push([a, d]);
    }
  }
  buildGraph._c = { pos, adj };
  return buildGraph._c;
}

function prng(seed) {
  let s = seed >>> 0 || 1;
  return () => ((s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
}

const _routeCache = new Map();

function buildRoutes(count, seed, steps, attract) {
  const ck = `${count}|${seed}|${steps}|${attract}`;
  const hit = _routeCache.get(ck);
  if (hit) return hit;

  const { pos, adj } = buildGraph();
  const starts = [];
  for (let i = 0; i < pos.length; i++) if (adj[i].length) starts.push(i);
  const rnd = prng(seed);
  const routes = [];

  for (let a = 0; a < count; a++) {
    let cur = starts[Math.floor(rnd() * starts.length)];
    let prev = -1;
    const path = [cur];
    const cum = [0];
    let total = 0;
    for (let s = 0; s < steps; s++) {
      const opts = adj[cur].filter(e => e[0] !== prev);
      const list = opts.length ? opts : adj[cur];
      if (!list.length) break;
      let pick;
      if (attract > 0 && rnd() < attract) {
        // 会場（原点）へ近づく枝を選ぶ
        let best = list[0], bd = Infinity;
        for (const e of list) {
          const d = Math.hypot(pos[e[0]][0], pos[e[0]][1]);
          if (d < bd) { bd = d; best = e; }
        }
        pick = best;
      } else {
        pick = list[Math.floor(rnd() * list.length)];
      }
      total += pick[1];
      prev = cur; cur = pick[0];
      path.push(cur); cum.push(total);
    }
    if (total < 1) { a--; continue; }
    routes.push({ path, cum, total, offset: rnd() * total, speed: 1.1 + rnd() * 0.7 });
  }

  const out = { routes, pos };
  if (_routeCache.size > 12) _routeCache.clear();
  _routeCache.set(ck, out);
  return out;
}

/* ============================================================
   需要ベース人流（§21）
   ------------------------------------------------------------
   ランダム歩行（wander）に対し、demand モードは
   「駅・外周から会場へ、到着時間帯に沿って歩いて集まる」流入を表す。
   引き続き時刻の純関数（§17.6）: 経路・出発時刻・速度はすべて
   seed から決定論的に生成し、位置は t から解析的に求める。
   ============================================================ */

function stationList() {
  return DATA.landmarks
    .filter(l => l[3] === 'station')
    .map(([name, xdm, ydm]) => ({ name, x: xdm / 10, y: ydm / 10 }))
    // 東静岡駅（会場最寄り）を先頭に
    .sort((a, b) => (b.name.includes('東静岡') ? 1 : 0) - (a.name.includes('東静岡') ? 1 : 0));
}

/** 計画ペデストリアンデッキ。線形は未公表のため「駅 -> 会場の直線」という仮定 */
function deckSegments(vx, vy) {
  return stationList().map(s => ({ from: [s.x, s.y], to: [vx, vy], name: s.name }));
}

function nearestNode(pos, adj, x, y) {
  let best = -1, bd = Infinity;
  for (let i = 0; i < pos.length; i++) {
    if (!adj[i].length) continue;
    const d = (pos[i][0] - x) ** 2 + (pos[i][1] - y) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

/**
 * OSM 歩行ネットワークの断片を接続する。
 * OSM の歩道は横断歩道などの接続ノードを欠くことが多く、素の歩行グラフは
 * 断片化している（実測: 会場成分 156 / 1,145 ノードで、両駅とも非連結）。
 * 成分間の近接ノード対（30m 以内）を距離昇順に見て、まだ別成分なら
 * エッジを足す（Kruskal 式 = 人工エッジは最短・最小限になる）。
 */
function bridgeComponents(pos, adj, maxGap = 30) {
  const n = pos.length;
  const uf = new Int32Array(n).map((_, i) => i);
  const find = (x) => { while (uf[x] !== x) x = uf[x] = uf[uf[x]]; return x; };
  for (let u = 0; u < n; u++)
    for (const [w] of adj[u]) { const a = find(u), b = find(w); if (a !== b) uf[a] = b; }
  const pairs = [];
  for (let i = 0; i < n; i++) {
    if (!adj[i].length) continue;
    for (let j = i + 1; j < n; j++) {
      if (!adj[j].length || find(i) === find(j)) continue;
      const d = Math.hypot(pos[i][0] - pos[j][0], pos[i][1] - pos[j][1]);
      if (d < maxGap) pairs.push([d, i, j]);
    }
  }
  pairs.sort((a, b) => a[0] - b[0]);
  let bridges = 0;
  for (const [d, i, j] of pairs) {
    const a = find(i), b = find(j);
    if (a === b) continue;
    uf[a] = b;
    adj[i].push([j, d]); adj[j].push([i, d]);
    bridges++;
  }
  return bridges;
}

/** 歩行グラフ（断片接続済み）+ （deck=1 なら）計画デッキの仮定線形エッジ */
function buildDemandGraph(deck, vx, vy) {
  buildDemandGraph._c = buildDemandGraph._c || new Map();
  const ck = `${deck ? 1 : 0}|${vx}|${vy}`;
  const hit = buildDemandGraph._c.get(ck);
  if (hit) return hit;

  const base = buildGraph();
  const pos = base.pos;
  const adj = base.adj.map(a => a.slice());
  const bridges = bridgeComponents(pos, adj);
  const deckEdges = new Set();
  if (deck) {
    for (const seg of deckSegments(vx, vy)) {
      const a = nearestNode(pos, adj, seg.from[0], seg.from[1]);
      const b = nearestNode(pos, adj, seg.to[0], seg.to[1]);
      if (a < 0 || b < 0 || a === b) continue;
      const d = Math.hypot(pos[a][0] - pos[b][0], pos[a][1] - pos[b][1]);
      adj[a].push([b, d]); adj[b].push([a, d]);
      deckEdges.add(a + '|' + b); deckEdges.add(b + '|' + a);
    }

  const out = { pos, adj, deckEdges, bridges };
  if (buildDemandGraph._c.size > 8) buildDemandGraph._c.clear();
  buildDemandGraph._c.set(ck, out);
  return out;
}

/** 会場を根とする最短路木（Dijkstra）。グラフごとにメモ化 */
function shortestTree(gr, vx, vy) {
  if (gr._tree) return gr._tree;
  const { pos, adj } = gr;
  const v = nearestNode(pos, adj, vx, vy);
  const n = pos.length;
  const dist = new Float64Array(n).fill(Infinity);
  const parent = new Int32Array(n).fill(-1);
  const done = new Uint8Array(n);
  dist[v] = 0;
  for (;;) {
    let u = -1, bd = Infinity;
    for (let i = 0; i < n; i++) if (!done[i] && dist[i] < bd) { bd = dist[i]; u = i; }
    if (u < 0) break;
    done[u] = 1;
    for (const [w, d] of adj[u])
      if (dist[u] + d < dist[w]) { dist[w] = dist[u] + d; parent[w] = u; }
  }
  gr._tree = { venueNode: v, dist, parent };
  return gr._tree;
}

const _demandCache = new Map();

function buildDemandRoutes(p) {
  const ck = JSON.stringify([p.count, p.seed, p.deck, p.vx, p.vy, p.window, p.railShare, p.higashiShare]);
  const hit = _demandCache.get(ck);
  if (hit) return hit;

  const gr = buildDemandGraph(p.deck, p.vx, p.vy);
  const tree = shortestTree(gr, p.vx, p.vy);
  const { pos, adj, deckEdges } = gr;
  const stations = stationList().map(s => ({ ...s, node: nearestNode(pos, adj, s.x, s.y) }));

  // 外周流入（バス・駐車場等）の起点候補: 会場から 250m 超の接続ノード
  const perimeter = [];
  for (let i = 0; i < pos.length; i++)
    if (adj[i].length && isFinite(tree.dist[i]) &&
        Math.hypot(pos[i][0] - p.vx, pos[i][1] - p.vy) > 250) perimeter.push(i);

  const rnd = prng(p.seed);
  const routes = [];
  let sumLen = 0, deckUsers = 0, guard = 0;

  while (routes.length < p.count && guard++ < p.count * 10) {
    let originNode, originName;
    const u = rnd(), w1 = rnd();
    if (u < p.railShare && stations.length) {
      const st = (w1 < p.higashiShare || stations.length < 2) ? stations[0] : stations[1];
      originNode = st.node; originName = st.name;
    } else if (perimeter.length) {
      originNode = perimeter[Math.floor(rnd() * perimeter.length)];
      originName = 'その他';
    } else {
      originNode = stations[0] && stations[0].node;
      originName = 'その他';
    }
    if (originNode == null || originNode < 0 || !isFinite(tree.dist[originNode])) continue;

    const path = [originNode];
    const cum = [0];
    let total = 0, usesDeck = false, cur = originNode;
    while (cur !== tree.venueNode && tree.parent[cur] >= 0) {
      const nxt = tree.parent[cur];
      if (deckEdges.has(cur + '|' + nxt)) usesDeck = true;
      total += Math.hypot(pos[cur][0] - pos[nxt][0], pos[cur][1] - pos[nxt][1]);
      path.push(nxt); cum.push(total);
      cur = nxt;
    }
    if (path.length < 2) continue;

    const spawn = ((rnd() + rnd()) / 2) * p.window;     // 三角分布（中央ピーク）の到着波
    const speed = 1.1 + rnd() * 0.7;
    const ang = rnd() * Math.PI * 2, rad = 5 + rnd() * 18;   // 会場到着後の滞留位置（決定論）
    routes.push({ path, cum, total, spawn, speed, originName, usesDeck,
                  ax: Math.cos(ang) * rad, ay: Math.sin(ang) * rad });
    sumLen += total;
    if (usesDeck) deckUsers++;
  }

  const out = {
    routes, pos,
    meanRoute: routes.length ? sumLen / routes.length : 0,
    deckShare: routes.length ? deckUsers / routes.length : 0,
  };
  if (_demandCache.size > 12) _demandCache.clear();
  _demandCache.set(ck, out);
  return out;
}

reg.register({
  type: 'roadagents',
  label: '人流 (道路網)',
  inputs: [],
  params: {
    mode:    { type: 'string', default: 'wander' },  // 'wander' | 'demand'
    count:   { type: 'int',   default: 900 },

    steps:   { type: 'int',   default: 26 },
    attract: { type: 'float', default: 0.55 },   // wander: 0=ランダム歩行, 1=会場へ直行
    speed:   { type: 'float', default: 1.0 },    // 倍率

function cookDemand(ctx) {

  const aDist   = g.addAttrib('point', 'toVenue', 'float');
  const aState  = g.addAttrib('point', 'state', 'int');      // 0=出発待ち 1=歩行中 2=到着

  g.detail.add('bridges', 'int').set(0, buildDemandGraph(p.deck, p.vx, p.vy).bridges);
  g.detail.add('capacity', 'int').set(0, p.capacity);
  g.detail.add('personsPerAgent', 'float').set(0, R.routes.length ? p.capacity / R.routes.length : 0);
  g.detail.add('meanRoute', 'float').set(0, R.meanRoute);
  g.detail.add('deckShare', 'float').set(0, R.deckShare);
  g.detail.add('waiting', 'int').set(0, waiting);
  g.detail.add('walking', 'int').set(0, walking);
  g.detail.add('arrived', 'int').set(0, arrived);
  return g;
}

   arena : 計画アリーナのマッシング（公表値ベース）
   敷地面積 約29,359m2 / 建築面積 約16,900m2 / 最高高さ 約30.9m / 鉄骨造4階
   ============================================================ */

reg.register({
  type: 'arena',

  inputs: [],
  params: {
    width:     { type: 'float', default: 152 },
    depth:     { type: 'float', default: 111 },
    height:    { type: 'float', default: 30.9 },
    floors:    { type: 'int',   default: 4 },
    rotate:    { type: 'float', default: -26 },  // 度。街区の向きに合わせる
    cx:        { type: 'float', default: 55 },
    cy:        { type: 'float', default: 65 },

  cook(ctx) {

    const a = rotate * Math.PI / 180, C = Math.cos(a), S = Math.sin(a);
    const put = (u, v, z) => g.addPoint(cx + u * C - v * S, cy + u * S + v * C, z);

    const aPart = g.addAttrib('prim', 'part', 'string');
    const aLevel = g.addAttrib('prim', 'level', 'int');
    const aHeight = g.addAttrib('prim', 'height', 'float');
    const fh = height / floors;

      const hi = [put(-w, -d, z1), put(w, -d, z1), put(w, d, z1), put(-w, d, z1)];

      aPart.set(slab, 'slab'); aLevel.set(slab, f); aHeight.set(slab, z0);
      for (let i = 0; i < 4; i++) {
        const pi = g.addPrim([lo[i], lo[(i + 1) % 4], hi[(i + 1) % 4], hi[i]]);
        aPart.set(pi, 'facade'); aLevel.set(pi, f); aHeight.set(pi, z0);

    g.detail.add('clashes', 'int').set(0, clash.n);
    g.detail.add('clashArea', 'float').set(0, clash.area);

function countClashes(cx, cy, w, d, rotate) {
  if (!countClashes._c) {

      return { x: x / n, y: y / n, area: Math.abs(a) / 2 };

  const a = -rotate * Math.PI / 180, C = Math.cos(a), S = Math.sin(a);

  for (const b of countClashes._c) {

    const u = dx * C - dy * S, v = dx * S + dy * C;
    if (Math.abs(u) <= w / 2 && Math.abs(v) <= d / 2) { n++; area += b.area; }
  }
  return { n, area };
}

reg.register({
  type: 'landmarks',
  label: 'ランドマーク',
  inputs: [],
  params: { height: { type: 'float', default: 42 } },
  cook(ctx) {
    const g = new GeoSet();
    const aName = g.addAttrib('prim', 'name', 'string');
    const aKind = g.addAttrib('prim', 'kind', 'string');
    for (const [name, xdm, ydm, kind] of DATA.landmarks) {
      const x = xdm / 10, y = ydm / 10;
      const pi = g.addPrim([g.addPoint(x, y, 0), g.addPoint(x, y, ctx.params.height)], false);
      aName.set(pi, name); aKind.set(pi, kind);
    }
    return g;
  },
});

module.exports = { reg, decodeBuildings, decodeRoads, buildGraph, DATA };

/* ============================================================
   XBUILD — scene.js
   シーン層（Pascal 系レジストリの最小形）。
   ------------------------------------------------------------
   ここでの目的は、シーン層を作り直すことではない。
   「geo という kind を1つ足すだけでデータフロー層が接続できる」
   という非破壊拡張の契約を実証すること。
   実運用では既存の xbuild_node_editor.html のレジストリへ
   同じ形の kind を1件追加するだけでよい。

'use strict';

const { toRenderBuffers } = require('./convert');

/* ---------- kind 定義 ---------- */

const KINDS = {
  site:     { label: '敷地',   container: true },
  building: { label: '建物',   container: true },
  layer:    { label: 'レイヤ', container: true },

  /* データフロー層の接続点 */
  geo: {
    label: 'ジオメトリ',
    container: false,
    /**
     * payload = { graph, displayNode, colorBy, ramp, baseColor, range }
     * ctx = { time, frame }
     * 戻り値は描画バッファ。シーン層は GeoSet を一切知らない。
     */
    build(node, ctx) {
      const pl = node.payload;
      const geo = pl.graph.cook(pl.displayNode, ctx);
      return toRenderBuffers(geo, {
        colorBy: pl.colorBy,
        ramp: pl.ramp,
        baseColor: pl.baseColor,
        range: pl.range,
      });
    },
    /** 時間依存かどうかはデータフロー層に委譲する */
    isTimeDependent(node) {
      return node.payload.graph.isTimeDependent(node.payload.displayNode);
    },
    /**
     * ピッキング用の属性読み出し（P6.5）。
     * primId バッファでプリムを引いた後、そのプリムの属性を返す。
     * cook はキャッシュヒットするので実質コストはない。
     * シーン層は GeoSet を知らないまま（この kind の中に閉じる）。
     */
    inspect(node, primIndex, ctx) {
      const pl = node.payload;
      const geo = pl.graph.cook(pl.displayNode, ctx);
      if (!(primIndex >= 0 && primIndex < geo.numPrims)) return null;
      const attribs = {};
      for (const [name, a] of geo.prim.map) attribs[name] = a.get(primIndex);
      return { prim: primIndex, vertices: geo.primPoints(primIndex).length, attribs };
    },
  },
};

/* ---------- ストア ---------- */

class SceneStore {
  constructor() {
    this.nodes = {};          // id -> node
    this.order = [];
    this.dirty = new Set();
  }

  add(id, kind, opts = {}) {
    if (!KINDS[kind]) throw new Error(`unknown scene kind: ${kind}`);
    const n = {
      id, kind,
      name: opts.name || id,
      parentId: opts.parentId || null,
      visible: opts.visible !== false,
      payload: opts.payload || {},
      style: opts.style || {},
    };
    this.nodes[id] = n;
    this.order.push(id);
    this.dirty.add(id);
    return n;
  }

  get(id) { return this.nodes[id]; }
  children(id) { return this.order.filter(k => this.nodes[k].parentId === id); }
  roots() { return this.order.filter(k => !this.nodes[k].parentId); }

  markDirty(id) { this.dirty.add(id); }

  /** ピッキング結果の属性照会。kind が inspect を持たなければ null */
  inspect(id, primIndex, ctx = {}) {
    const n = this.nodes[id];
    if (!n) return null;
    const k = KINDS[n.kind];
    return k.inspect ? k.inspect(n, primIndex, ctx) : null;
  }

  setVisible(id, v) { this.nodes[id].visible = v; this.dirty.add(id); }

  /** 時間依存のシーンノードだけを列挙する（毎フレーム再構築の対象） */
  timeDependentIds() {
    return this.order.filter(id => {
      const n = this.nodes[id];
      const k = KINDS[n.kind];
      return k.isTimeDependent ? k.isTimeDependent(n) : false;
    });
  }

  /**
   * dirty なノードだけ build する。
   * emit(id, buffers) が呼ばれる。
   */
  buildDirty(ctx, emit) {
    const built = [];
    for (const id of this.dirty) {
      const n = this.nodes[id];

      let bufs = null, err = null;
      try { bufs = k.build(n, ctx); }
      catch (e) { err = e && e.message ? e.message : String(e); }
      emit(id, bufs, err);
      built.push(id);
    }
    this.dirty.clear();
    return built;
  }
}

module.exports = { SceneStore, KINDS };

/* ============================================================
   XBUILD — app.js（ブラウザ エントリ）
   シーン層 + データフロー層 + three.js r128 ビューア
   ============================================================ */

const { SceneStore } = require('./scene');

/* 影の受け皿（PlaneGeometry は XY 面 = この座標系の地面） */
const groundShadow = new THREE.Mesh(

groundShadow.receiveShadow = true;
groundShadow.userData.aux = true;

const groups = {};
const updateStats = { inPlace: 0, rebuilt: 0 };   // 差分更新 / 全再構築の回数（P6.5）

/** 不透明に近いサーフェスだけが影を落とす（半透明ヒートマップの影は不自然） */
function castsShadow(node) {
  return !!node.style.surface && (node.style.opacity || 1) >= 0.9;
}

function makeSurface(bufs, style, shadow) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(bufs.tris.position, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(bufs.tris.normal, 3));
  g.setAttribute('color', new THREE.BufferAttribute(bufs.tris.color, 3));
  const m = new THREE.MeshLambertMaterial({
    vertexColors: true, side: THREE.DoubleSide,
    transparent: (style.opacity || 1) < 1, opacity: style.opacity || 1,
  });
  const mesh = new THREE.Mesh(g, m);
  mesh.userData.role = 'surface';
  mesh.userData.primId = bufs.tris.primId;   // ピッキング用（三角形 -> プリム）
  mesh.castShadow = shadow;
  mesh.receiveShadow = shadow;
  return mesh;
}

function makePoints(bufs, style) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(bufs.points.position, 3));
  g.setAttribute('color', new THREE.BufferAttribute(bufs.points.color, 3));
  const m = new THREE.PointsMaterial({ size: style.pointSize || 2, vertexColors: true, sizeAttenuation: false });
  const p = new THREE.Points(g, m);
  p.userData.role = 'points';
  return p;
}

function makeLines(bufs, style) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(bufs.lines.position, 3));
  if (bufs.lines.color) g.setAttribute('color', new THREE.BufferAttribute(bufs.lines.color, 3));
  const m = new THREE.LineBasicMaterial({ vertexColors: !!bufs.lines.color });
  const l = new THREE.LineSegments(g, m);
  l.userData.role = 'lines';
  return l;
}

function disposeGroup(id) {
  if (!groups[id]) return;
  groups[id].traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  scene.remove(groups[id]);
  delete groups[id];
}

/* ---------- 差分更新（P6.5） ----------
   頂点数が前回と一致する限り BufferGeometry を作り直さず、
   属性配列を上書きして needsUpdate を立てるだけにする。
   人流エージェント（毎フレーム 900 点）はこの経路に乗る。 */

function roleSig(node, bufs) {
  return (node.style.surface && bufs.tris.count ? 's' : '') +
         (node.style.points && bufs.points.count ? 'p' : '') +
         (node.style.lines && bufs.lines.count ? 'l' : '');
}

function updateAttr(geom, name, arr) {
  const a = geom.attributes[name];
  if (!a || a.array.length !== arr.length) return false;
  a.array.set(arr);
  a.needsUpdate = true;
  return true;
}

function tryUpdateInPlace(grp, node, bufs) {
  if (grp.userData.sig !== roleSig(node, bufs)) return false;
  let ok = true;
  const jobs = [];
  grp.traverse(o => {
    if (!ok || !o.userData.role) return;
    if (o.userData.role === 'surface') {
      ok = o.geometry.attributes.position.array.length === bufs.tris.position.length;
      if (ok) jobs.push(() => {
        updateAttr(o.geometry, 'position', bufs.tris.position);
        updateAttr(o.geometry, 'normal', bufs.tris.normal);
        updateAttr(o.geometry, 'color', bufs.tris.color);
        o.userData.primId = bufs.tris.primId;
        o.geometry.computeBoundingSphere();
      });
    } else if (o.userData.role === 'points') {
      ok = o.geometry.attributes.position.array.length === bufs.points.position.length;
      if (ok) jobs.push(() => {
        updateAttr(o.geometry, 'position', bufs.points.position);
        updateAttr(o.geometry, 'color', bufs.points.color);
        o.geometry.computeBoundingSphere();
      });
    } else if (o.userData.role === 'lines') {
      ok = o.geometry.attributes.position.array.length === bufs.lines.position.length;
      if (ok) jobs.push(() => {
        updateAttr(o.geometry, 'position', bufs.lines.position);
        updateAttr(o.geometry, 'color', bufs.lines.color);
        o.geometry.computeBoundingSphere();
      });
    }
  });
  if (!ok || !jobs.length) return false;
  for (const j of jobs) j();   // 全役割が更新可能と確認してから書き込む（中途半端な状態を作らない）
  return true;
}

function rebuild(id, bufs, err) {
  const node = store.get(id);
  if (err) { node.error = err; disposeGroup(id); clearPickIf(id); return; }
  node.error = null;
  if (!bufs || !node.visible) { disposeGroup(id); clearPickIf(id); needsRender = true; return; }

  const existing = groups[id];
  if (existing && tryUpdateInPlace(existing, node, bufs)) {
    updateStats.inPlace++;
    if (castsShadow(node)) renderer.shadowMap.needsUpdate = true;
    refreshPick(id);
    needsRender = true;
    return;
  }

  disposeGroup(id);
  const shadow = castsShadow(node);
  const grp = new THREE.Group();
  if (node.style.surface && bufs.tris.count) grp.add(makeSurface(bufs, node.style, shadow));
  if (node.style.points && bufs.points.count) grp.add(makePoints(bufs, node.style));
  if (node.style.lines && bufs.lines.count) grp.add(makeLines(bufs, node.style));
  grp.userData.sig = roleSig(node, bufs);
  grp.traverse(o => { o.userData.sceneId = id; });
  groups[id] = grp;
  scene.add(grp);
  updateStats.rebuilt++;
  if (shadow) renderer.shadowMap.needsUpdate = true;
  refreshPick(id);
}

/* ---------- カメラ操作（r128 に OrbitControls は同梱されない） ---------- */

const cam = { az: -1.15, el: 0.46, dist: 900, target: new THREE.Vector3(20, 30, 15) };

function applyCamera() {
  const ce = Math.cos(cam.el), se = Math.sin(cam.el);
  camera.position.set(
    cam.target.x + cam.dist * ce * Math.cos(cam.az),
    cam.target.y + cam.dist * ce * Math.sin(cam.az),
    cam.target.z + cam.dist * se,
  );
  camera.lookAt(cam.target);
}

(function bindControls() {
  const el = renderer.domElement;
  let drag = null;
  let press = null;                       // クリック（≒ドラッグしていない）判定用
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, btn: e.button };
    press = { x: e.clientX, y: e.clientY, btn: e.button };
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointerup', e => {
    drag = null;
    el.releasePointerCapture(e.pointerId);
    if (press && press.btn === 0 &&
        Math.hypot(e.clientX - press.x, e.clientY - press.y) < 5) {
      const r = el.getBoundingClientRect();
      pickAt(((e.clientX - r.left) / r.width) * 2 - 1,
             -((e.clientY - r.top) / r.height) * 2 + 1);
    }
    press = null;
  });
  el.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.btn === 0) {
      cam.az -= dx * 0.006;
      cam.el = Math.max(0.04, Math.min(1.5, cam.el + dy * 0.005));
    } else {
      const s = cam.dist * 0.0016;
      const right = new THREE.Vector3(-Math.sin(cam.az), Math.cos(cam.az), 0);
      cam.target.addScaledVector(right, -dx * s);
      cam.target.z += dy * s;
    }
    applyCamera(); needsRender = true;
  });
  el.addEventListener('wheel', e => {
    e.preventDefault();
    cam.dist = Math.max(60, Math.min(3000, cam.dist * (1 + Math.sign(e.deltaY) * 0.12)));
    applyCamera(); needsRender = true;
  }, { passive: false });
})();

function resize() {
  const w = canvasWrap.clientWidth, h = canvasWrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  needsRender = true;
}
window.addEventListener('resize', resize);

/* ============================================================
   3.5 ピッキング（P6.5）
   ------------------------------------------------------------
   toRenderBuffers が三角形ごとに出力している primId バッファで
   レイキャスト結果（faceIndex）からプリムを引き、シーン層の
   inspect（geo kind に閉じた属性読み出し）で属性を表示する。
   ============================================================ */

const raycaster = new THREE.Raycaster();
let lastPick = null;      // { sceneId, prim, info, point }
let highlight = null;     // 選択プリムのハイライトメッシュ

function clearHighlight() {
  if (!highlight) return;
  highlight.geometry.dispose();
  highlight.material.dispose();
  scene.remove(highlight);
  highlight = null;
}

function clearPick() {
  lastPick = null;
  clearHighlight();
  renderPickInfo();
  needsRender = true;
}

function clearPickIf(sceneId) {
  if (lastPick && lastPick.sceneId === sceneId) clearPick();
}

/** 選択プリムの三角形を primId バッファから抜き出してハイライトにする */
function buildHighlight(sceneId) {
  clearHighlight();
  if (!lastPick) return;
  const grp = groups[sceneId];
  if (!grp) return;
  let mesh = null;
  grp.traverse(o => { if (!mesh && o.userData.primId) mesh = o; });
  if (!mesh) return;
  const primId = mesh.userData.primId;
  const pos = mesh.geometry.attributes.position.array;
  const out = [];
  for (let t = 0; t < primId.length; t += 3)
    if (primId[t] === lastPick.prim)
      for (let k = 0; k < 9; k++) out.push(pos[t * 3 + k]);
  if (!out.length) return;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(out), 3));
  const m = new THREE.MeshBasicMaterial({
    color: 0xf0c341, transparent: true, opacity: 0.45, side: THREE.DoubleSide,
    depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  });
  highlight = new THREE.Mesh(g, m);
  highlight.userData.aux = true;
  scene.add(highlight);
}

function pickAt(nx, ny) {
  raycaster.setFromCamera({ x: nx, y: ny }, camera);
  const cands = [];
  for (const grp of Object.values(groups))
    grp.traverse(o => { if (o.isMesh && o.userData.primId) cands.push(o); });
  const hits = raycaster.intersectObjects(cands, false);
  if (!hits.length) { clearPick(); return null; }
  const hit = hits[0];
  const sceneId = hit.object.userData.sceneId;
  const prim = hit.object.userData.primId[hit.faceIndex * 3];
  const info = store.inspect(sceneId, prim, { time });
  if (!info) { clearPick(); return null; }
  lastPick = { sceneId, prim, info, point: [hit.point.x, hit.point.y, hit.point.z] };
  buildHighlight(sceneId);
  renderPickInfo();
  needsRender = true;
  return lastPick;
}

/** レイヤ再構築 / 差分更新後に、選択中プリムの表示を追随させる */
function refreshPick(sceneId) {
  if (!lastPick || lastPick.sceneId !== sceneId) return;
  const info = store.inspect(sceneId, lastPick.prim, { time });
  if (!info) { clearPick(); return; }
  lastPick.info = info;
  buildHighlight(sceneId);
  renderPickInfo();
}

function fmtVal(v) {
  if (typeof v === 'number') return Number.isInteger(v) ? String(v) : v.toFixed(2);
  return String(v);
}

function renderPickInfo() {
  const host = document.getElementById('pickinfo');
  if (!lastPick) { host.style.display = 'none'; return; }
  const n = store.get(lastPick.sceneId);
  const rows = Object.entries(lastPick.info.attribs)
    .filter(([k]) => k !== 'closed')
    .map(([k, v]) => `<tr><td>${k}</td><td>${fmtVal(v)}</td></tr>`)
    .join('');
  host.innerHTML = `<b>${n.name}</b>` +
    `<table><tr><td>prim</td><td>#${lastPick.prim}</td></tr>` +
    `<tr><td>頂点数</td><td>${lastPick.info.vertices}</td></tr>${rows}</table>`;
  host.style.display = 'block';   // '' だとスタイルシートの display:none に戻ってしまう
}

/* ============================================================
   4. 評価ループ
   ============================================================ */

let time = 0, playing = false, needsRender = true;
let lastBuildMs = 0, lastBuilt = [];

const graphBase = new Map();   // graph -> このフレーム開始時点の cookCount

function snapshotGraphBase() {
  graphBase.clear();
  for (const id of store.order) {
    const n = store.get(id);
    if (n.kind === 'geo') graphBase.set(n.payload.graph, n.payload.graph.cookCount);
  }
}

function buildFrame() {
  snapshotGraphBase();
  const t0 = performance.now();
  lastBuilt = store.buildDirty({ time, frame: Math.round(time * 30) }, rebuild);
  lastBuildMs = performance.now() - t0;
  needsRender = true;
  renderReport();
}

function markAllDirty() { for (const id of store.order) store.markDirty(id); }

let lastT = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (playing) {
    time += dt;
    // 時間依存のシーンノードだけを dirty にする
    for (const id of store.timeDependentIds()) store.markDirty(id);
  }
  if (store.dirty.size) buildFrame();
  if (needsRender) { renderer.render(scene, camera); needsRender = false; }
}

const el = (id) => document.getElementById(id);

/* ---- アウトライナ ---- */
function renderOutliner() {
  const host = el('outliner');
  host.innerHTML = '';
  for (const id of store.order) {
    const n = store.get(id);
    const row = document.createElement('div');
    row.className = 'row' + (n.parentId ? ' indent' : '') + (id === selectedScene ? ' sel' : '');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = n.visible;
    cb.onclick = (e) => { e.stopPropagation(); store.setVisible(id, cb.checked); buildFrame(); };
    if (n.kind !== 'geo') cb.style.visibility = 'hidden';
    row.appendChild(cb);
    const label = document.createElement('span');
    label.textContent = n.name;
    row.appendChild(label);
    if (n.kind === 'geo') {
      const tag = document.createElement('em');
      tag.textContent = n.payload.graph.isTimeDependent(n.payload.displayNode) ? 'time' : 'static';
      tag.className = 'tag';
      row.appendChild(tag);
    }
    if (n.kind === 'geo') row.onclick = () => { selectedScene = id; selectedNode = n.payload.displayNode; renderAll(); };
    host.appendChild(row);
  }
}

/* ---- ノード一覧とパラメータ ---- */
let selectedScene = 'arena';
let selectedNode = 'arena1';

function currentGraph() { return store.get(selectedScene).payload.graph; }

function renderNodeList() {
  const host = el('nodelist');
  host.innerHTML = '';
  const g = currentGraph();
  for (const [id, n] of g.nodes) {
    const row = document.createElement('div');
    row.className = 'row' + (id === selectedNode ? ' sel' : '');
    row.textContent = (n.def.label || n.type);
    const s = document.createElement('em');
    s.className = 'tag'; s.textContent = id;
    row.appendChild(s);
    if (n.error) row.classList.add('err');
    row.onclick = () => { selectedNode = id; renderAll(); };
    host.appendChild(row);
  }
}

function renderParams() {
  const host = el('params');
  host.innerHTML = '';
  const g = currentGraph();
  const n = g.nodes.get(selectedNode);
  if (!n) return;

  for (const [k, spec] of Object.entries(n.def.params)) {
    if (spec.type === 'string' && k === 'code') continue;
    const wrap = document.createElement('div');
    wrap.className = 'pfield';
    const lab = document.createElement('label');
    lab.textContent = k;
    wrap.appendChild(lab);

    if (spec.type === 'int' || spec.type === 'float') {
      const inp = document.createElement('input');
      inp.type = 'number'; inp.value = n.params[k];
      inp.step = spec.type === 'int' ? 1 : 0.1;
      inp.oninput = () => {
        const v = spec.type === 'int' ? parseInt(inp.value, 10) : parseFloat(inp.value);
        if (!isFinite(v)) return;
        n.setParam(k, v);
        store.markDirty(selectedScene);
        for (const id of store.order)
          if (store.get(id).kind === 'geo' && store.get(id).payload.graph === g) store.markDirty(id);
        buildFrame();
      };
      wrap.appendChild(inp);
    } else if (spec.type === 'vec2' || spec.type === 'vec3') {
      const box = document.createElement('div');
      box.className = 'vec';
      (n.params[k] || []).forEach((val, i) => {
        const inp = document.createElement('input');
        inp.type = 'number'; inp.value = val; inp.step = 0.1;
        inp.oninput = () => {
          const arr = n.params[k].slice(); arr[i] = parseFloat(inp.value) || 0;
          n.setParam(k, arr); store.markDirty(selectedScene); buildFrame();
        };
        box.appendChild(inp);
      });
      wrap.appendChild(box);
    } else {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.value = n.params[k];
      inp.oninput = () => { n.setParam(k, inp.value); store.markDirty(selectedScene); buildFrame(); };
      wrap.appendChild(inp);
    }
    host.appendChild(wrap);
  }

  /* スニペット */
  const sn = el('snipwrap');
  if (n.type === 'snippet') {
    sn.style.display = '';
    el('snippet').value = n.params.code || '';
    el('snipclass').value = n.params.class || 'point';
  } else {
    sn.style.display = 'none';
  }
}

el('snipapply').onclick = () => {
  /* 適用のたびに時間依存が変わりうるのでアウトライナも描き直す */
  const g = currentGraph();
  const n = g.nodes.get(selectedNode);
  if (!n || n.type !== 'snippet') return;
  n.setParam('class', el('snipclass').value);
  n.setParam('code', el('snippet').value);
  for (const id of store.order)
    if (store.get(id).kind === 'geo' && store.get(id).payload.graph === g) store.markDirty(id);
  buildFrame();
  renderOutliner();
  renderNodeList();
};

/* ---- cook レポート ---- */
function renderReport() {
  const host = el('report');
  const rows = [];
  const seenG = new Set();
  for (const id of store.order) {
    const n = store.get(id);
    if (n.kind !== 'geo') continue;
    const g = n.payload.graph;
    if (seenG.has(g)) continue;
    seenG.add(g);
    const base = graphBase.has(g) ? graphBase.get(g) : 0;
    for (const [nid, nd] of g.nodes) {
      if (!nd.stats) continue;
      rows.push({ id: nid, fresh: (nd.stats.serial || 0) > base, ...nd.stats });
    }
  }
  const uniq = rows;

  host.innerHTML =
    '<table><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"></colgroup><thead><tr><th>ノード</th><th>ms</th><th>点</th><th>面</th><th>time</th><th>状態</th></tr></thead><tbody>' +
    uniq.map(r => {
      const fresh = r.fresh;
      const state = r.error
        ? `<span class="bad">${r.error}</span>`
        : (r.warnings && r.warnings.length ? `<span class="warn">${r.warnings[0]}</span>`
          : (fresh ? '<span class="ok">再計算</span>' : '<span class="cache">キャッシュ</span>'));
      return `<tr><td>${r.id}</td><td>${r.ms}</td><td>${r.points}</td><td>${r.prims}</td><td>${r.timeDep ? '●' : ''}</td><td>${state}</td></tr>`;
    }).join('') + '</tbody></table>';

  el('stats').textContent =
    `build ${lastBuildMs.toFixed(1)}ms / 再構築 ${lastBuilt.length} レイヤ / t=${time.toFixed(2)}s`;
}

function renderAll() { renderOutliner(); renderNodeList(); renderParams(); renderReport(); }

/* ---- 再生 ---- */
el('play').onclick = () => {
  playing = !playing;
  el('play').textContent = playing ? '■ 停止' : '▶ 再生';
};
el('reset').onclick = () => { time = 0; markAllDirty(); buildFrame(); };

/* ============================================================
   6. 起動
   ============================================================ */

resize();
applyCamera();
buildFrame();
renderAll();
loop();

/* テスト用フック */
window.__xb = { store, cityGraph, arenaGraph, flowGraph, roadGraph, lmGraph, scene, camera,
  step(dt) { time += dt; for (const id of store.timeDependentIds()) store.markDirty(id); buildFrame(); },
  counts() {
    let tri = 0, pts = 0;
    scene.traverse(o => {
      if (o.userData.aux) return;                     // ハイライト / 影の受け皿は数えない
      if (o.isMesh) tri += o.geometry.attributes.position.count / 3;
      if (o.isPoints) pts += o.geometry.attributes.position.count;
    });
    return { tri, pts, layers: Object.keys(groups).length };
  },
  /* P6.5 */
  pick: (nx, ny) => pickAt(nx, ny),
  getPick: () => lastPick,
  clearPick,
  updateStats,
  render() { renderer.render(scene, camera); },
  shadows: () => renderer.shadowMap.enabled };

});
require("app");
})();

</script>
