<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ステッカー3D化 — 写真から立体モデルを作る</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101014; }
    * { box-sizing: border-box; font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
    :root { --panel-bg: rgba(12,12,18,0.86); --accent: #ff9a3c; --text: #eaeaea; --muted: #9a9aa5; }

    #view { position: fixed; inset: 0; }
    #view canvas { display: block; }

    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10; width: 292px;
      color: var(--text); background: var(--panel-bg); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; padding: 14px; font-size: 12px;
      max-height: calc(100vh - 24px); overflow-y: auto;
    }
    #hud h1 { font-size: 13px; margin: 0 0 2px; }
    #hud .sub { color: var(--muted); margin-bottom: 10px; font-size: 11px; }
    #hud.collapsed .hud-body, #hud.collapsed .sub { display: none; }
    #hudToggle {
      position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; padding: 0;
      border-radius: 8px; font-size: 14px; line-height: 1; flex: none;
    }

    /* スマホ: ボトムシート化 + 大きめのタップ領域 */
    @media (max-width: 700px) {
      #hud {
        top: auto; left: 0; right: 0; bottom: 0; width: 100%;
        border-radius: 16px 16px 0 0; border-left: none; border-right: none; border-bottom: none;
        max-height: 46dvh; font-size: 13px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      }
      button { padding: 11px 10px; font-size: 13px; }
      input[type="range"] { height: 28px; }
      #previewWrap { max-width: 280px; margin-left: auto; margin-right: auto; }
    }
    .row { display: flex; gap: 8px; margin: 8px 0; }
    button {
      flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06); color: var(--text); font-size: 12px; cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,0.12); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #14100b; font-weight: 700; }
    button.toggled { outline: 2px solid var(--accent); }
    button:disabled { opacity: 0.4; cursor: default; }
    .slider { margin: 7px 0 2px; }
    .slider label { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 2px; }
    .slider label b { color: var(--text); font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    #status { margin-top: 8px; padding: 7px 9px; border-radius: 8px; background: rgba(255,255,255,0.05); color: var(--muted); line-height: 1.5; }
    #status.ok { color: #8fe388; }
    .hint { color: var(--muted); font-size: 11px; margin-top: 8px; line-height: 1.5; }
    .sec { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); color: var(--muted); font-size: 11px; letter-spacing: .05em; }

    /* 切り抜きプレビュー（クリックで領域の追加/削除） */
    #previewWrap { margin-top: 6px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; overflow: hidden; background: #000; display: none; }
    #preview { width: 100%; display: block; cursor: crosshair; }

    #dropOverlay {
      position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; gap: 10px;
      align-items: center; justify-content: center; color: #fff; text-align: center;
      background: rgba(0,0,0,0.55); font-size: 18px; line-height: 1.7;
    }
    #dropOverlay small { color: var(--muted); font-size: 13px; }
    #dropOverlay.hidden { display: none; }
    #dropOverlay .frame {
      border: 3px dashed var(--accent); border-radius: 18px; padding: 40px 48px;
      background: rgba(12,12,18,0.7); cursor: pointer; max-width: 86vw;
    }
    #dropOverlay .frame:active { background: rgba(40,30,18,0.8); }
    #busy {
      position: fixed; right: 16px; bottom: 16px; z-index: 15; color: var(--muted); font-size: 12px;
      background: var(--panel-bg); border-radius: 8px; padding: 8px 12px; display: none;
    }
  </style>
</head>
<body>
  <div id="view"></div>

  <div id="hud">
    <button id="hudToggle" title="パネルを折りたたむ">–</button>
    <h1>🏷️→🧍 ステッカー3D化</h1>
    <div class="sub">写真から切り抜いて、ぷっくり膨らんだ立体に</div>

    <div class="hud-body">
    <div class="row">
      <button id="btnOpen" class="primary">📷 写真を選ぶ</button>
      <input id="file" type="file" accept="image/*" hidden>
    </div>

    <div class="sec">切り抜き</div>
    <div class="slider"><label>背景除去の強さ <b><span id="vTol">28</span></b></label>
      <input id="sTol" type="range" min="8" max="60" step="1" value="28"></div>
    <div class="row">
      <button id="btnErase" class="toggled">🪄 クリックで消す</button>
      <button id="btnRestore">↩️ クリックで戻す</button>
    </div>
    <div id="previewWrap"><canvas id="preview"></canvas></div>
    <div class="hint">プレビュー上の消したい場所（囲まれた背景など）をクリックすると除去できます。</div>

    <div class="sec">向き</div>
    <div class="row">
      <button id="btnAutoRot" class="toggled">自動で縦向き</button>
      <button id="btnFlip">🔃 180°回転</button>
    </div>
    <div class="slider"><label>微調整 <b><span id="vRot">0</span>°</b></label>
      <input id="sRot" type="range" min="-45" max="45" step="1" value="0"></div>

    <div class="sec">立体化</div>
    <div class="slider"><label>膨らみ <b><span id="vPuff">1.0</span></b></label>
      <input id="sPuff" type="range" min="0.1" max="2.5" step="0.05" value="1.0"></div>
    <div class="row">
      <button id="btnSpin" class="toggled">🔄 自動回転</button>
      <button id="btnReset">視点リセット</button>
    </div>

    <div class="sec">書き出し</div>
    <div class="row">
      <button id="btnGlb" disabled>GLB保存</button>
      <button id="btnPng" disabled>透過PNG保存</button>
    </div>

    <div id="status">写真を選ぶと自動で切り抜き→立体化します。</div>
    <div class="hint">GLBはBlender・Unity・PlayCanvas・各種3Dビューアで読み込めます。すべてブラウザ内で処理され、画像はどこにも送信されません。</div>
    </div><!-- /.hud-body -->
  </div>

  <div id="dropOverlay">
    <div class="frame" id="dropFrame">
      🏷️ タップしてステッカーやカードの写真を選ぶ<br>
      <small>スマホは撮影 or アルバムから選択 ・ PCはドラッグ＆ドロップもOK<br>
      背景と被写体の境目がはっきりした写真がきれいに切り抜けます</small>
    </div>
  </div>
  <div id="busy">処理中…</div>

  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const $ = (id) => document.getElementById(id);

    // =============================================================
    // パイプライン:
    //  photo → [1] 縮小 → [2] 背景除去(境界からの適応フラッドフィル)
    //        → [3] 最大成分抽出+小穴埋め → [4] PCAで縦向き補正
    //        → [5] 距離変換で高さマップ → [6] 前面+背面メッシュ生成
    // =============================================================

    const PROC_MAX = 900;     // 処理解像度(長辺)
    const GRID_MAX = 210;     // メッシュ格子(長辺セル数)

    const state = {
      imgData: null,          // 縮小後のImageData
      w: 0, h: 0,
      baseMask: null,         // フラッドフィル直後のマスク(Uint8: 1=前景)
      mask: null,             // ワンド編集+整形後のマスク
      wandOps: [],            // {x, y, mode:'erase'|'restore'} 再適用用
      tol: 28,
      autoRot: true,
      flip: 0,                // 0 or 180
      rotFine: 0,
      puff: 1.0,
      cutCanvas: null,        // 回転済み切り抜きRGBA
      mesh: null, backMesh: null,
    };

    // ---------------- three.js シーン ----------------
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    $('view').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x15151c);
    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);
    camera.position.set(0, 0.15, 2.4);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 2.2;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x334, 1.1));
    const dir = new THREE.DirectionalLight(0xffffff, 1.6);
    dir.position.set(1.2, 1.6, 2.0);
    scene.add(dir);
    const dir2 = new THREE.DirectionalLight(0x8899ff, 0.5);
    dir2.position.set(-1.5, -0.4, -1.2);
    scene.add(dir2);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

    // ---------------- [1] 画像読み込み ----------------
    async function openImage(fileOrBlob) {
      const url = URL.createObjectURL(fileOrBlob);
      const img = new Image();
      await new Promise((ok, ng) => { img.onload = ok; img.onerror = ng; img.src = url; });
      URL.revokeObjectURL(url);
      const scale = Math.min(1, PROC_MAX / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      state.imgData = ctx.getImageData(0, 0, w, h);
      state.w = w; state.h = h;
      state.wandOps = [];
      $('dropOverlay').classList.add('hidden');
      $('previewWrap').style.display = 'block';
      rebuildAll();
    }

    // ---------------- [2] 背景除去 ----------------
    // 画像の外周フレームから「背景色パレット」を学習し、
    // パレットに近い色のピクセルだけを外周から連結拡張して背景とする。
    // (隣接色の連続性だけで拡張すると、アンチエイリアスされた輪郭の
    //  グラデーションを伝って前景内部まで漏れるため、この方式を採る)
    function colorDist(d, i, j) {
      return Math.abs(d[i] - d[j]) + Math.abs(d[i + 1] - d[j + 1]) + Math.abs(d[i + 2] - d[j + 2]);
    }
    function buildBgPalette() {
      const { w, h } = state, d = state.imgData.data;
      const frame = Math.max(4, Math.round(Math.min(w, h) * 0.03));
      const bins = new Map();
      let total = 0;
      const sample = (x, y) => {
        const i = (y * w + x) * 4;
        const key = ((d[i] >> 4) << 8) | ((d[i + 1] >> 4) << 4) | (d[i + 2] >> 4);
        let b = bins.get(key);
        if (!b) bins.set(key, b = { n: 0, r: 0, g: 0, b: 0 });
        b.n++; b.r += d[i]; b.g += d[i + 1]; b.b += d[i + 2];
        total++;
      };
      for (let y = 0; y < h; y++) {
        const inFrameY = y < frame || y >= h - frame;
        for (let x = 0; x < w; x++) {
          if (inFrameY || x < frame || x >= w - frame) sample(x, y);
        }
      }
      const palette = [];
      for (const b of bins.values()) {
        if (b.n >= total * 0.002) palette.push([b.r / b.n, b.g / b.n, b.b / b.n]);
      }
      return palette;
    }
    function floodBackground() {
      const { w, h } = state, d = state.imgData.data;
      const palette = buildBgPalette();
      const tol3 = state.tol * 3;
      // 背景色らしさの事前判定
      const bgLike = new Uint8Array(w * h);
      for (let p = 0; p < w * h; p++) {
        const i = p * 4, r = d[i], g = d[i + 1], b = d[i + 2];
        for (let k = 0; k < palette.length; k++) {
          const c = palette[k];
          if (Math.abs(r - c[0]) + Math.abs(g - c[1]) + Math.abs(b - c[2]) <= tol3) {
            bgLike[p] = 1; break;
          }
        }
      }
      // 外周から連結している背景らしい領域だけを背景に
      const bg = new Uint8Array(w * h);
      const queue = new Int32Array(w * h);
      let qh = 0, qt = 0;
      const push = (p) => { if (!bg[p] && bgLike[p]) { bg[p] = 1; queue[qt++] = p; } };
      for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
      for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
      while (qh < qt) {
        const p = queue[qh++];
        const x = p % w;
        if (x > 0) push(p - 1);
        if (x < w - 1) push(p + 1);
        if (p >= w) push(p - w);
        if (p < w * (h - 1)) push(p + w);
      }
      const mask = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) mask[i] = bg[i] ? 0 : 1;
      // 輪郭のにじみ(背景と前景の中間色のハロ)を1px削る
      const eroded = mask.slice();
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const p = y * w + x;
        if (!mask[p]) continue;
        if (x === 0 || x === w - 1 || y === 0 || y === h - 1 ||
            !mask[p - 1] || !mask[p + 1] || !mask[p - w] || !mask[p + w]) eroded[p] = 0;
      }
      return eroded;
    }

    // ワンド: クリック点から同様のフラッドフィルで除去/復元
    function wandFill(mask, sx, sy, mode) {
      const { w, h } = state, d = state.imgData.data;
      const target = mode === 'erase' ? 1 : 0;
      const start = sy * w + sx;
      if (mask[start] !== target) return;
      const visited = new Uint8Array(w * h);
      const queue = [start];
      visited[start] = 1;
      const tol3 = Math.max(state.tol, 20) * 3;
      while (queue.length) {
        const p = queue.pop();
        mask[p] = target ? 0 : 1;
        const x = p % w, y = (p / w) | 0, pi = p * 4;
        for (const q of [p - 1, p + 1, p - w, p + w]) {
          if (q < 0 || q >= w * h) continue;
          const qx = q % w;
          if (Math.abs(qx - x) > 1) continue;
          if (visited[q] || mask[q] !== target) continue;
          if (colorDist(d, pi, q * 4) <= tol3) { visited[q] = 1; queue.push(q); }
        }
      }
    }

    // ---------------- [3] 最大成分 + 小穴埋め ----------------
    function labelComponents(mask, value) {
      const { w, h } = state;
      const labels = new Int32Array(w * h).fill(-1);
      const sizes = [];
      const queue = new Int32Array(w * h);
      for (let s = 0; s < w * h; s++) {
        if (mask[s] !== value || labels[s] !== -1) continue;
        const id = sizes.length;
        let qh = 0, qt = 0, size = 0;
        labels[s] = id; queue[qt++] = s;
        while (qh < qt) {
          const p = queue[qh++]; size++;
          const x = p % w;
          for (const q of [p - 1, p + 1, p - w, p + w]) {
            if (q < 0 || q >= w * h) continue;
            if (Math.abs((q % w) - x) > 1) continue;
            if (mask[q] === value && labels[q] === -1) { labels[q] = id; queue[qt++] = q; }
          }
        }
        sizes.push(size);
      }
      return { labels, sizes };
    }
    function cleanMask(mask) {
      const { w, h } = state;
      // 前景は最大成分のみ
      const fg = labelComponents(mask, 1);
      if (fg.sizes.length > 1) {
        let best = 0;
        for (let i = 1; i < fg.sizes.length; i++) if (fg.sizes[i] > fg.sizes[best]) best = i;
        for (let i = 0; i < w * h; i++) if (mask[i] === 1 && fg.labels[i] !== best) mask[i] = 0;
      }
      // 背景成分のうち、画像端に接しない小さいもの(<1.5%)は穴として埋める
      const bgc = labelComponents(mask, 0);
      const touchesBorder = new Uint8Array(bgc.sizes.length);
      for (let x = 0; x < w; x++) {
        if (mask[x] === 0) touchesBorder[bgc.labels[x]] = 1;
        const p = (h - 1) * w + x;
        if (mask[p] === 0) touchesBorder[bgc.labels[p]] = 1;
      }
      for (let y = 0; y < h; y++) {
        let p = y * w;
        if (mask[p] === 0) touchesBorder[bgc.labels[p]] = 1;
        p = y * w + w - 1;
        if (mask[p] === 0) touchesBorder[bgc.labels[p]] = 1;
      }
      const limit = w * h * 0.015;
      for (let i = 0; i < w * h; i++) {
        if (mask[i] === 0) {
          const id = bgc.labels[i];
          if (!touchesBorder[id] && bgc.sizes[id] < limit) mask[i] = 1;
        }
      }
      return mask;
    }

    // ---------------- [4] PCAで縦向き補正 + 切り抜き ----------------
    function computeUprightAngle(mask) {
      const { w, h } = state;
      let n = 0, mx = 0, my = 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (mask[y * w + x]) { n++; mx += x; my += y; }
      }
      if (!n) return 0;
      mx /= n; my /= n;
      let cxx = 0, cyy = 0, cxy = 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (!mask[y * w + x]) continue;
        const dx = x - mx, dy = y - my;
        cxx += dx * dx; cyy += dy * dy; cxy += dx * dy;
      }
      // 主軸の角度(画像座標系) → 垂直に立てる回転量
      const theta = 0.5 * Math.atan2(2 * cxy, cxx - cyy);
      let rot = Math.PI / 2 - theta;           // 主軸→垂直
      while (rot > Math.PI / 2) rot -= Math.PI; // -90..90 に正規化
      while (rot < -Math.PI / 2) rot += Math.PI;
      return rot;
    }

    function makeCutout(mask) {
      const { w, h } = state;
      // マスク適用RGBA (アルファ1pxフェザー)
      const src = state.imgData.data;
      const out = new Uint8ClampedArray(w * h * 4);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const p = y * w + x, i = p * 4;
        if (!mask[p]) continue;
        out[i] = src[i]; out[i + 1] = src[i + 1]; out[i + 2] = src[i + 2];
        // 境界ならフェザー
        let edge = false;
        for (const q of [p - 1, p + 1, p - w, p + w]) {
          if (q < 0 || q >= w * h || !mask[q]) { edge = true; break; }
        }
        out[i + 3] = edge ? 140 : 255;
      }
      const flat = document.createElement('canvas');
      flat.width = w; flat.height = h;
      flat.getContext('2d').putImageData(new ImageData(out, w, h), 0, 0);

      // 回転
      let angle = state.autoRot ? computeUprightAngle(mask) : 0;
      angle += state.rotFine * Math.PI / 180 + (state.flip ? Math.PI : 0);
      const cos = Math.abs(Math.cos(angle)), sin = Math.abs(Math.sin(angle));
      const rw = Math.ceil(w * cos + h * sin), rh = Math.ceil(w * sin + h * cos);
      const rot = document.createElement('canvas');
      rot.width = rw; rot.height = rh;
      const rctx = rot.getContext('2d', { willReadFrequently: true });
      rctx.translate(rw / 2, rh / 2);
      rctx.rotate(angle);
      rctx.drawImage(flat, -w / 2, -h / 2);

      // バウンディングボックスで切り出し(余白5%)
      const rd = rctx.getImageData(0, 0, rw, rh).data;
      let x0 = rw, y0 = rh, x1 = 0, y1 = 0, found = false;
      for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++) {
        if (rd[(y * rw + x) * 4 + 3] > 60) {
          found = true;
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
      if (!found) return null;
      const pad = Math.round(Math.max(x1 - x0, y1 - y0) * 0.05) + 2;
      x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
      x1 = Math.min(rw - 1, x1 + pad); y1 = Math.min(rh - 1, y1 + pad);
      const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
      const cut = document.createElement('canvas');
      cut.width = cw; cut.height = ch;
      cut.getContext('2d').drawImage(rot, x0, y0, cw, ch, 0, 0, cw, ch);
      return cut;
    }

    // ---------------- [5][6] メッシュ生成 ----------------
    function buildMesh(cutCanvas) {
      const cw = cutCanvas.width, ch = cutCanvas.height;
      const scale = GRID_MAX / Math.max(cw, ch);
      const gw = Math.max(8, Math.round(cw * scale)), gh = Math.max(8, Math.round(ch * scale));
      const gc = document.createElement('canvas');
      gc.width = gw; gc.height = gh;
      const gctx = gc.getContext('2d', { willReadFrequently: true });
      gctx.drawImage(cutCanvas, 0, 0, gw, gh);
      const gd = gctx.getImageData(0, 0, gw, gh).data;

      const inside = new Uint8Array(gw * gh);
      for (let i = 0; i < gw * gh; i++) inside[i] = gd[i * 4 + 3] > 90 ? 1 : 0;

      // チャンファー距離変換(3-4)
      const INF = 1e9;
      const dist = new Float32Array(gw * gh);
      for (let i = 0; i < gw * gh; i++) dist[i] = inside[i] ? INF : 0;
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
        const p = y * gw + x;
        if (!dist[p]) continue;
        let m = dist[p];
        if (x > 0) m = Math.min(m, dist[p - 1] + 3);
        if (y > 0) {
          m = Math.min(m, dist[p - gw] + 3);
          if (x > 0) m = Math.min(m, dist[p - gw - 1] + 4);
          if (x < gw - 1) m = Math.min(m, dist[p - gw + 1] + 4);
        }
        dist[p] = m;
      }
      for (let y = gh - 1; y >= 0; y--) for (let x = gw - 1; x >= 0; x--) {
        const p = y * gw + x;
        if (!dist[p]) continue;
        let m = dist[p];
        if (x < gw - 1) m = Math.min(m, dist[p + 1] + 3);
        if (y < gh - 1) {
          m = Math.min(m, dist[p + gw] + 3);
          if (x < gw - 1) m = Math.min(m, dist[p + gw + 1] + 4);
          if (x > 0) m = Math.min(m, dist[p + gw - 1] + 4);
        }
        dist[p] = m;
      }

      // 高さ: 飽和カーブ(細い部分は薄く、太い部分は丸く) + 平滑化
      const K = 6 * 3;
      const height = new Float32Array(gw * gh);
      for (let i = 0; i < gw * gh; i++) height[i] = dist[i] / (dist[i] + K);
      const tmp = new Float32Array(gw * gh);
      for (let pass = 0; pass < 2; pass++) {
        for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
          const p = y * gw + x;
          let s = height[p] * 4, n = 4;
          if (x > 0) { s += height[p - 1]; n++; }
          if (x < gw - 1) { s += height[p + 1]; n++; }
          if (y > 0) { s += height[p - gw]; n++; }
          if (y < gh - 1) { s += height[p + gw]; n++; }
          tmp[p] = s / n;
        }
        height.set(tmp);
      }
      // 輪郭は前後面を閉じるため高さ0
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
        const p = y * gw + x;
        if (!inside[p]) { height[p] = 0; continue; }
        let edge = false;
        for (const q of [p - 1, p + 1, p - gw, p + gw]) {
          if (q < 0 || q >= gw * gh || !inside[q]) { edge = true; break; }
        }
        if (edge) height[p] = 0;
      }

      // 頂点格子 (単位: モデル高さ=1.4)
      const modelH = 1.4, unit = modelH / gh;
      const thick = 0.13 * state.puff;
      const positions = [], uvs = [], indices = [];
      const vidx = new Int32Array(gw * gh).fill(-1);
      let vc = 0;
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
        const p = y * gw + x;
        if (!inside[p]) continue;
        vidx[p] = vc++;
        positions.push((x - gw / 2) * unit, (gh / 2 - y) * unit, height[p] * thick);
        uvs.push((x + 0.5) / gw, 1 - (y + 0.5) / gh);
      }
      for (let y = 0; y < gh - 1; y++) for (let x = 0; x < gw - 1; x++) {
        const a = vidx[y * gw + x], b = vidx[y * gw + x + 1],
              c = vidx[(y + 1) * gw + x], d2 = vidx[(y + 1) * gw + x + 1];
        if (a >= 0 && b >= 0 && c >= 0) indices.push(a, c, b);
        if (b >= 0 && c >= 0 && d2 >= 0) indices.push(b, c, d2);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      // 背面: zを反転し巻き順も反転
      const bgeo = geo.clone();
      const bp = bgeo.getAttribute('position');
      for (let i = 0; i < bp.count; i++) bp.setZ(i, -bp.getZ(i));
      bp.needsUpdate = true;
      const bi = bgeo.getIndex().array;
      for (let i = 0; i < bi.length; i += 3) { const t = bi[i + 1]; bi[i + 1] = bi[i + 2]; bi[i + 2] = t; }
      bgeo.getIndex().needsUpdate = true;
      bgeo.computeVertexNormals();

      const tex = new THREE.CanvasTexture(cutCanvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const frontMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6, metalness: 0.0 });
      const backMat = new THREE.MeshStandardMaterial({ color: 0xd9d9de, roughness: 0.85, metalness: 0.0 });

      if (state.mesh) { scene.remove(state.mesh); state.mesh.geometry.dispose(); }
      if (state.backMesh) { scene.remove(state.backMesh); state.backMesh.geometry.dispose(); }
      state.mesh = new THREE.Mesh(geo, frontMat);
      state.backMesh = new THREE.Mesh(bgeo, backMat);
      scene.add(state.mesh, state.backMesh);
      $('btnGlb').disabled = false;
      $('btnPng').disabled = false;
    }

    // ---------------- プレビュー描画 ----------------
    function drawPreview() {
      const { w, h } = state;
      const pv = $('preview');
      const pw = 264, ph = Math.round(h * pw / w);
      pv.width = pw; pv.height = ph;
      const ctx = pv.getContext('2d');
      // 元画像を暗めに
      const tmp = document.createElement('canvas');
      tmp.width = w; tmp.height = h;
      tmp.getContext('2d').putImageData(state.imgData, 0, 0);
      ctx.filter = 'brightness(0.35)';
      ctx.drawImage(tmp, 0, 0, pw, ph);
      ctx.filter = 'none';
      // 前景のみ明るく
      const cutOnly = document.createElement('canvas');
      cutOnly.width = w; cutOnly.height = h;
      const cctx = cutOnly.getContext('2d');
      const src = state.imgData.data;
      const od = new Uint8ClampedArray(w * h * 4);
      for (let p = 0; p < w * h; p++) {
        if (!state.mask[p]) continue;
        const i = p * 4;
        od[i] = src[i]; od[i + 1] = src[i + 1]; od[i + 2] = src[i + 2]; od[i + 3] = 255;
      }
      cctx.putImageData(new ImageData(od, w, h), 0, 0);
      ctx.drawImage(cutOnly, 0, 0, pw, ph);
    }

    // ---------------- 再構築 ----------------
    let rebuildTimer = 0;
    function rebuildAll(fromStage = 'seg') {
      clearTimeout(rebuildTimer);
      rebuildTimer = setTimeout(() => {
        if (!state.imgData) return;
        $('busy').style.display = 'block';
        requestAnimationFrame(() => {
          try {
            if (fromStage === 'seg') {
              state.baseMask = floodBackground();
              state.mask = state.baseMask.slice();
              for (const op of state.wandOps) wandFill(state.mask, op.x, op.y, op.mode);
              cleanMask(state.mask);
              drawPreview();
            }
            const cut = makeCutout(state.mask);
            if (cut) {
              state.cutCanvas = cut;
              buildMesh(cut);
              setStatus('立体化しました。ドラッグ/スワイプで回転、ホイール/ピンチでズームできます。', 'ok');
              // スマホでは初回のみパネルを畳んでモデルを見せる
              if (!state.firstBuildDone && matchMedia('(max-width: 700px)').matches) {
                $('hud').classList.add('collapsed');
                $('hudToggle').textContent = '+';
              }
              state.firstBuildDone = true;
            } else {
              setStatus('被写体を検出できませんでした。「背景除去の強さ」を調整してください。');
            }
          } finally {
            $('busy').style.display = 'none';
          }
        });
      }, 120);
    }
    function setStatus(t, k) { const el = $('status'); el.textContent = t; el.className = k || ''; }

    // ---------------- UI ----------------
    $('btnOpen').addEventListener('click', () => $('file').click());
    $('dropFrame').addEventListener('click', () => $('file').click());
    $('file').addEventListener('change', (e) => { if (e.target.files[0]) openImage(e.target.files[0]); });
    $('hudToggle').addEventListener('click', () => {
      const hud = $('hud');
      hud.classList.toggle('collapsed');
      $('hudToggle').textContent = hud.classList.contains('collapsed') ? '+' : '–';
    });

    addEventListener('dragover', (e) => e.preventDefault());
    addEventListener('drop', (e) => {
      e.preventDefault();
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) openImage(f);
    });
    addEventListener('paste', (e) => {
      const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
      if (item) openImage(item.getAsFile());
    });

    let wandMode = 'erase';
    $('btnErase').addEventListener('click', () => {
      wandMode = 'erase';
      $('btnErase').classList.add('toggled'); $('btnRestore').classList.remove('toggled');
    });
    $('btnRestore').addEventListener('click', () => {
      wandMode = 'restore';
      $('btnRestore').classList.add('toggled'); $('btnErase').classList.remove('toggled');
    });
    $('preview').addEventListener('click', (e) => {
      if (!state.mask) return;
      const r = e.target.getBoundingClientRect();
      const x = Math.round((e.clientX - r.left) / r.width * (state.w - 1));
      const y = Math.round((e.clientY - r.top) / r.height * (state.h - 1));
      state.wandOps.push({ x, y, mode: wandMode });
      wandFill(state.mask, x, y, wandMode);
      cleanMask(state.mask);
      drawPreview();
      rebuildAll('cut');
    });

    $('sTol').addEventListener('input', (e) => {
      state.tol = +e.target.value; $('vTol').textContent = state.tol;
      rebuildAll('seg');
    });
    $('btnAutoRot').addEventListener('click', () => {
      state.autoRot = !state.autoRot;
      $('btnAutoRot').classList.toggle('toggled', state.autoRot);
      rebuildAll('cut');
    });
    $('btnFlip').addEventListener('click', () => { state.flip = state.flip ? 0 : 1; rebuildAll('cut'); });
    $('sRot').addEventListener('input', (e) => {
      state.rotFine = +e.target.value; $('vRot').textContent = state.rotFine;
      rebuildAll('cut');
    });
    $('sPuff').addEventListener('input', (e) => {
      state.puff = +e.target.value; $('vPuff').textContent = state.puff.toFixed(2);
      if (state.cutCanvas) rebuildAll('mesh');
    });
    $('btnSpin').addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      $('btnSpin').classList.toggle('toggled', controls.autoRotate);
    });
    $('btnReset').addEventListener('click', () => {
      camera.position.set(0, 0.15, 2.4);
      controls.target.set(0, 0, 0);
    });

    function download(blob, name) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
    $('btnGlb').addEventListener('click', () => {
      if (!state.mesh) return;
      const group = new THREE.Group();
      group.add(state.mesh.clone(), state.backMesh.clone());
      new GLTFExporter().parse(group,
        (buf) => download(new Blob([buf], { type: 'model/gltf-binary' }), 'sticker3d.glb'),
        (err) => { console.error(err); setStatus('GLB書き出しに失敗しました。'); },
        { binary: true });
    });
    $('btnPng').addEventListener('click', () => {
      if (!state.cutCanvas) return;
      state.cutCanvas.toBlob((b) => download(b, 'sticker_cutout.png'), 'image/png');
    });

    // デバッグ用
    window.__state = state;
    window.__scene = scene;
  </script>
</body>
</html>
