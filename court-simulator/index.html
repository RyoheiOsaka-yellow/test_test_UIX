<script src="three.min.js"></script>
<script>
(function(){
"use strict";
/* ================= 基本セットアップ ================= */
var scene=new THREE.Scene(); scene.background=new THREE.Color(0xeef2f6);
scene.fog=new THREE.Fog(0xeef2f6,180,460);
var cam=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.2,1200);
cam.up.set(0,0,1);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('view').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xb8c4cc,0.78));
var dl=new THREE.DirectionalLight(0xffffff,0.42); dl.position.set(70,-60,110); scene.add(dl);
var dl2=new THREE.DirectionalLight(0xdfe8ff,0.18); dl2.position.set(-60,80,50); scene.add(dl2);
var ANISO=renderer.capabilities.getMaxAnisotropy();

function shade(hex,p){ /* hex "#rrggbb", p=-100..100 */
  var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,t=p<0?0:255,a=Math.abs(p)/100;
  r=Math.round(r+(t-r)*a);g=Math.round(g+(t-g)*a);b=Math.round(b+(t-b)*a);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function Ph(c,op){var m=new THREE.MeshPhongMaterial({color:c,flatShading:true,shininess:18});
  if(op!==undefined){m.transparent=true;m.opacity=op;}return m;}

/* ================= 床材マスタ（basesp.jp/court.html 準拠） ================= */
var FLOORS={
 pro:{
  name:"ELITE COURT PRO", tile:0.3048, th:0.021, perBox:36, boxKg:25, tileG:645, warranty:"最大10年",
  use:"屋内・屋外", pattern:"tri",
  desc:"304.8×304.8×21mm / 32個のクッションで衝撃吸収 / 屋内外対応",
  chart:[
   {n:"Yellow",c:"#f0c020"},{n:"Orange",c:"#e87722"},{n:"Red",c:"#c8352e"},
   {n:"Light blue",c:"#4aa3df"},{n:"Navy",c:"#1f3a6e"},{n:"Green",c:"#1f7a4d"},
   {n:"Purple",c:"#6b4fa0"},{n:"Light Brown",c:"#b98d5f"},{n:"Light Green",c:"#7fbf5f"},
   {n:"Grey",c:"#9aa0a6"},{n:"Dark Grey",c:"#4a4f55"},{n:"Black",c:"#23262a"}]
 },
 control:{
  name:"ELITE COURT CONTROL", tile:0.3071, th:0.012, perBox:60, boxKg:21, tileG:395, warranty:"最大5年",
  use:"屋外（ピックルボール設計）", pattern:"dot",
  desc:"307.1×307.1×12mm / 弾性素材でグリップと自然な球足を両立",
  chart:[ /* 10色（参考色） */
   {n:"Red",c:"#c8352e"},{n:"Orange",c:"#e87722"},{n:"Yellow",c:"#f0c020"},
   {n:"Green",c:"#1f7a4d"},{n:"Light Green",c:"#7fbf5f"},{n:"Light Blue",c:"#4aa3df"},
   {n:"Blue",c:"#2b62b0"},{n:"Navy",c:"#1f3a6e"},{n:"Grey",c:"#9aa0a6"},{n:"Black",c:"#23262a"}]
 },
 smooth:{
  name:"ELITE COURT SMOOTH", tile:0.304, th:0.01455, perBox:54, boxKg:23, tileG:396, warranty:"最大10年",
  use:"屋内専用（木目調）", pattern:"wood",
  desc:"304×304×14.55mm / 天然木のような外観＋TPEクッション構造",
  chart:[ /* 木目トーン（参考） */
   {n:"メープル",c:"#d9b382"},{n:"オーク",c:"#c69a63"},{n:"チェリー",c:"#a9683c"},
   {n:"ウォルナット",c:"#6f4a2f"}]
 }
};
var LINECOLORS=[{n:"White",c:"#ffffff"},{n:"Yellow",c:"#f5d327"},{n:"Black",c:"#1c1e22"}];

/* ================= 競技マスタ ================= */
/* court: ライン基準の内寸 / floorW,floorD: 床材敷設全体 */
var SPORTS={
 b3x3:{label:"バスケット 3on3",sub:"屋外 15×11m",courtW:15,courtD:11,floorW:21,floorD:17,
   def:{floor:"pro",main:"#4aa3df",subc:"#1f3a6e",acc:"#9aa0a6",line:"#ffffff"}},
 bball:{label:"バスケット 屋内",sub:"28×15m",courtW:28,courtD:15,floorW:32,floorD:19,
   def:{floor:"smooth",main:"#d9b382",subc:"#a9683c",acc:"#c69a63",line:"#c8352e"}},
 handball:{label:"ハンドボール",sub:"40×20m",courtW:40,courtD:20,floorW:44,floorD:24,
   def:{floor:"pro",main:"#4aa3df",subc:"#9aa0a6",acc:"#f0c020",line:"#ffffff"}},
 futsal:{label:"フットサル",sub:"40×20m",courtW:40,courtD:20,floorW:45,floorD:25,
   def:{floor:"pro",main:"#1f7a4d",subc:"#4a4f55",acc:"#7fbf5f",line:"#ffffff"}},
 tennis:{label:"テニス",sub:"23.77×10.97m",courtW:23.77,courtD:10.97,floorW:34.8,floorD:17.1,
   def:{floor:"control",main:"#2b62b0",subc:"#1f7a4d",acc:"#2b62b0",line:"#ffffff"}},
 tt:{label:"テーブルテニス",sub:"卓球 14×7m",courtW:14,courtD:7,floorW:17,floorD:10,
   def:{floor:"pro",main:"#c8352e",subc:"#4a4f55",acc:"#c8352e",line:"#ffffff"}}
};
var state={sport:"b3x3",floor:"pro",main:"#4aa3df",subc:"#1f3a6e",acc:"#9aa0a6",line:"#ffffff"};

/* ================= 床テクスチャ生成 ================= */
function makeFloorTexture(){
  var sp=SPORTS[state.sport],fl=FLOORS[state.floor];
  var FW=sp.floorW,FD=sp.floorD;
  var CW=4096,CH=Math.round(CW*FD/FW);
  var cv=document.createElement('canvas');cv.width=CW;cv.height=CH;
  var ctx=cv.getContext('2d'),s=CW/FW;
  function X(x){return (FW/2+x)*s;}    /* コート中心原点(m)→px */
  function Y(y){return (FD/2+y)*s;}
  /* --- ゾーン塗り --- */
  ctx.fillStyle=state.subc; ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle=state.main;
  ctx.fillRect(X(-sp.courtW/2),Y(-sp.courtD/2),sp.courtW*s,sp.courtD*s);

  /* --- アクセントゾーン --- */
  ctx.fillStyle=state.acc;
  if(state.sport==="bball"){
    [-1,1].forEach(function(e){
      var x0=Math.min(X(e*14),X(e*(14-5.8)));
      ctx.fillRect(x0,Y(-2.45),5.8*s,4.9*s);
    });
    ctx.beginPath();ctx.arc(X(0),Y(0),1.8*s,0,7);ctx.fill();
  }
  if(state.sport==="b3x3"){
    ctx.fillRect(X(-4.9/2),Y(-5.5),4.9*s,5.8*s);
  }
  if(state.sport==="handball"){
    [-1,1].forEach(function(e){
      ctx.beginPath();
      var bx=e*20;
      ctx.moveTo(X(bx),Y(-7.5));
      ctx.arc(X(bx),Y(-1.5),6*s,(e>0?Math.PI/2:Math.PI/2),(e>0?Math.PI:0),e>0);
      ctx.arc(X(bx),Y(1.5),6*s,(e>0?Math.PI:0),(e>0?Math.PI*1.5:Math.PI*1.5),e>0);
      ctx.lineTo(X(bx),Y(7.5));
      ctx.closePath();ctx.fill();
    });
  }
  if(state.sport==="futsal"){
    [-1,1].forEach(function(e){
      ctx.beginPath();
      var bx=e*20;
      ctx.moveTo(X(bx),Y(-7.58));
      ctx.arc(X(bx),Y(-1.58),6*s,(e>0?Math.PI/2:Math.PI/2),(e>0?Math.PI:0),e>0);
      ctx.arc(X(bx),Y(1.58),6*s,(e>0?Math.PI:0),(e>0?Math.PI*1.5:Math.PI*1.5),e>0);
      ctx.lineTo(X(bx),Y(7.58));
      ctx.closePath();ctx.fill();
    });
  }

  /* --- タイルパターン --- */
  var t=fl.tile,nx=Math.ceil(FW/t),ny=Math.ceil(FD/t),tp=t*s;
  if(fl.pattern==="wood"){
    /* 木目調：板張り表現（決定論的レイアウトを2パスで描き、ゾーン境界はクリップ） */
    var ph=t/3; /* 1タイル3枚板 */
    function drawPlanks(base){
      var row,x0;
      for(row=0;row<ny*3;row++){
        var py=row*ph*s, off=((row*7919)%100)/100*1.2;
        x0=-off;
        while(x0<FW){
          var len=0.9+((Math.abs(Math.sin(row*12.9898+x0*78.233))*43758.5453)%1)*1.2;
          var jit=(((Math.abs(Math.sin(row*3.7+x0*9.1))*10000)%1)-0.5)*14;
          ctx.fillStyle=shade(base,jit);
          ctx.fillRect(x0*s,py,len*s+1,ph*s+1);
          /* 木目線 */
          ctx.strokeStyle=shade(base,-18);ctx.globalAlpha=0.35;ctx.lineWidth=1;
          ctx.beginPath();
          ctx.moveTo(x0*s+4,py+ph*s*0.35);ctx.lineTo((x0+len)*s-4,py+ph*s*0.30);
          ctx.moveTo(x0*s+4,py+ph*s*0.72);ctx.lineTo((x0+len)*s-4,py+ph*s*0.78);
          ctx.stroke();ctx.globalAlpha=1;
          /* 板端 */
          ctx.fillStyle="rgba(40,25,12,.45)";ctx.fillRect((x0+len)*s-1,py,2,ph*s);
          x0+=len;
        }
        ctx.fillStyle="rgba(40,25,12,.5)";ctx.fillRect(0,py,CW,1.6);
      }
    }
    drawPlanks(state.subc);
    ctx.save();
    ctx.beginPath();
    ctx.rect(X(-sp.courtW/2),Y(-sp.courtD/2),sp.courtW*s,sp.courtD*s);
    ctx.clip();
    drawPlanks(state.main);
    ctx.restore();
  }else{
    /* 樹脂タイル：目地＋表面パターン */
    var i,j;
    for(i=0;i<nx;i++)for(j=0;j<ny;j++){
      var px=i*tp,py2=j*tp;
      var cxm2=i*t+t/2-FW/2, cym2=j*t+t/2-FD/2;
      var inC2=Math.abs(cxm2)<sp.courtW/2&&Math.abs(cym2)<sp.courtD/2;
      var b=inC2?state.main:state.subc;
      /* アクセント帯の中はキャンバス色をそのまま活かすため塗り直さない */
      ctx.strokeStyle="rgba(0,0,0,.22)";ctx.lineWidth=Math.max(1,tp*0.025);
      ctx.strokeRect(px,py2,tp,tp);
      ctx.strokeStyle="rgba(0,0,0,.10)";ctx.lineWidth=1;
      if(fl.pattern==="tri"){
        ctx.beginPath();
        ctx.moveTo(px,py2);ctx.lineTo(px+tp,py2+tp);
        ctx.moveTo(px+tp,py2);ctx.lineTo(px,py2+tp);
        ctx.moveTo(px+tp/2,py2);ctx.lineTo(px+tp/2,py2+tp);
        ctx.moveTo(px,py2+tp/2);ctx.lineTo(px+tp,py2+tp/2);
        ctx.stroke();
        ctx.strokeStyle="rgba(255,255,255,.07)";
        ctx.strokeRect(px+tp*0.08,py2+tp*0.08,tp*0.84,tp*0.84);
      }else{ /* dot（パンチング） */
        ctx.fillStyle="rgba(0,0,0,.16)";
        var k,l,dn=5,dr=tp*0.045;
        for(k=0;k<dn;k++)for(l=0;l<dn;l++){
          ctx.beginPath();
          ctx.arc(px+tp*(k+0.5)/dn,py2+tp*(l+0.5)/dn,dr,0,7);ctx.fill();
        }
      }
    }
  }

  /* --- コートライン --- */
  ctx.strokeStyle=state.line;ctx.fillStyle=state.line;
  ctx.lineWidth=0.05*s;ctx.lineCap="butt";
  var W2=sp.courtW/2,D2=sp.courtD/2;
  function rect(x0,y0,w,h){ctx.strokeRect(X(x0),Y(y0),w*s,h*s);}
  function seg(x0,y0,x1,y1){ctx.beginPath();ctx.moveTo(X(x0),Y(y0));ctx.lineTo(X(x1),Y(y1));ctx.stroke();}
  function arc(cx,cy,r,a0,a1,ccw){ctx.beginPath();ctx.arc(X(cx),Y(cy),r*s,a0,a1,!!ccw);ctx.stroke();}

  if(state.sport==="b3x3"){
    /* 15m(横=x)×11m(縦=y)、ベースラインは y=-5.5 側 */
    rect(-W2,-D2,sp.courtW,sp.courtD);
    var ry=-5.5+1.575;               /* リング直下 */
    rect(-2.45,-5.5,4.9,5.8);        /* キー */
    arc(0,0.3,1.8,0,Math.PI,false);  /* FTサークル(コート側半円) */
    /* 3Pアーク＋コーナー直線（サイドラインから0.9m） */
    seg(-6.6,-5.5,-6.6,ry+1.417); seg(6.6,-5.5,6.6,ry+1.417);
    var a=Math.atan2(1.417,6.6);
    arc(0,ry,6.75,a,Math.PI-a,false);
    arc(0,ry,1.25,0,Math.PI,false);  /* ノーチャージ */
  }
  if(state.sport==="bball"){
    rect(-14,-7.5,28,15);
    seg(0,-7.5,0,7.5);
    arc(0,0,1.8,0,7);
    [-1,1].forEach(function(e){
      var rx=e*(14-1.575);
      rect(Math.min(e*14,e*(14-5.8)),-2.45,5.8,4.9);
      arc(e*(14-5.8),0,1.8,0,7);
      seg(e*14,-6.6,rx+ -e*1.417,-6.6);
      seg(e*14, 6.6,rx+ -e*1.417, 6.6);
      var a0=Math.atan2(6.6,-e*1.417);
      if(e>0)arc(rx,0,6.75,a0,Math.PI*2-a0,false);
      else arc(rx,0,6.75,-a0,a0,false);
      /* ノーチャージ */
      if(e>0)arc(rx,0,1.25,Math.PI/2,Math.PI*1.5,false);
      else arc(rx,0,1.25,-Math.PI/2,Math.PI/2,false);
    });
  }
  if(state.sport==="handball"){
    rect(-20,-10,40,20); seg(0,-10,0,10);
    [-1,1].forEach(function(e){
      var bx=e*20;
      /* 6mライン */
      ctx.beginPath();
      ctx.moveTo(X(bx),Y(e>0?-7.5:-7.5));
      ctx.arc(X(bx),Y(-1.5),6*s,Math.PI/2,e>0?Math.PI:0,e>0);
      ctx.arc(X(bx),Y(1.5),6*s,e>0?Math.PI:0,Math.PI*1.5,e>0);
      ctx.lineTo(X(bx),Y(7.5));
      ctx.stroke();
      /* 9mライン（破線） */
      ctx.setLineDash([0.35*s,0.30*s]);
      ctx.beginPath();
      ctx.arc(X(bx),Y(-1.5),9*s,Math.PI/2,e>0?Math.PI:0,e>0);
      ctx.arc(X(bx),Y(1.5),9*s,e>0?Math.PI:0,Math.PI*1.5,e>0);
      ctx.stroke();ctx.setLineDash([]);
      seg(e*13,-0.5,e*13,0.5);       /* 7mスロー */
      seg(e*16,-0.15,e*16,0.15);     /* 4mマーク */
      seg(bx,-1.5,bx,1.5);           /* ゴールライン強調 */
    });
  }
  if(state.sport==="futsal"){
    rect(-20,-10,40,20); seg(0,-10,0,10);
    arc(0,0,3,0,7);
    [-1,1].forEach(function(e){
      var bx=e*20;
      ctx.beginPath();
      ctx.moveTo(X(bx),Y(-7.58));
      ctx.arc(X(bx),Y(-1.58),6*s,Math.PI/2,e>0?Math.PI:0,e>0);
      ctx.arc(X(bx),Y(1.58),6*s,e>0?Math.PI:0,Math.PI*1.5,e>0);
      ctx.lineTo(X(bx),Y(7.58));
      ctx.stroke();
      /* ペナルティマーク */
      ctx.beginPath();ctx.arc(X(e*14),Y(0),0.06*s,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(X(e*10),Y(0),0.06*s,0,7);ctx.fill();
      /* コーナーアーク */
      [-1,1].forEach(function(f){
        arc(bx,f*10,0.25,0,7);
      });
    });
  }
  if(state.sport==="tennis"){
    rect(-11.885,-5.485,23.77,10.97);      /* ダブルス */
    seg(-11.885,-4.115,11.885,-4.115);     /* シングルス */
    seg(-11.885,4.115,11.885,4.115);
    seg(-6.4,-4.115,-6.4,4.115);           /* サービスライン */
    seg(6.4,-4.115,6.4,4.115);
    seg(-6.4,0,6.4,0);                     /* センターサービス */
    seg(-11.885,-0.0,-11.685,0);           /* センターマーク */
    seg(11.685,0,11.885,0);
    seg(0,-5.485,0,5.485);                 /* ネット位置 */
  }
  if(state.sport==="tt"){
    rect(-7,-3.5,14,7);
  }
  var tex=new THREE.CanvasTexture(cv);
  tex.anisotropy=ANISO;
  tex.flipY=false;   /* キャンバス座標(+y=奥)とワールド座標を一致させる */
  return tex;
}

function spawnBooth(key){
  var def=BOOTHS[key],sp=SPORTS[state.sport];
  var count=booths.filter(function(b){return b.userData.key===key;}).length;
  var g=def.make(count);
  g.userData.key=key;
  /* コート外周へ自動配置 */
  var side=(booths.length)%4, off=2.5+ (booths.length%3)*3.5;
  var hx=sp.floorW/2, hy=sp.floorD/2;
  if(side===0){g.position.set(-hx+off, hy+3,0);}
  else if(side===1){g.position.set(hx+3, hy-off,0);g.rotation.z=Math.PI/2;}
  else if(side===2){g.position.set(hx-off, -hy-3,0);g.rotation.z=Math.PI;}
  else {g.position.set(-hx-3, -hy+off,0);g.rotation.z=-Math.PI/2;}
  boothG.add(g);booths.push(g);
  selectBooth(g);
  showHint(def.label+" を配置しました。ドラッグで移動できます");
}
function boothRoot(o){
  while(o&&!(o.userData&&o.userData.booth))o=o.parent;
  return o;
}
function setEmissive(g,on){
  g.traverse(function(o){
    if(o.material&&o.material.emissive!==undefined){
      o.material.emissive=new THREE.Color(on?0xff7a1a:0x000000);
      o.material.emissiveIntensity=on?0.4:0;
    }
  });
}
var bsPanel=document.getElementById('boothsel');
function selectBooth(g){
  deselectBooth();
  selBooth=g;setEmissive(g,true);
  document.getElementById('bs_name').textContent=g.userData.name;
  document.getElementById('bs_spec').textContent=g.userData.spec+" / ドラッグで移動";
  bsPanel.style.display='block';
}
function deselectBooth(){
  if(!selBooth)return;
  setEmissive(selBooth,false);selBooth=null;bsPanel.style.display='none';
}
document.getElementById('bs_rotL').onclick=function(){if(selBooth)selBooth.rotation.z+=Math.PI/4;};
document.getElementById('bs_rotR').onclick=function(){if(selBooth)selBooth.rotation.z-=Math.PI/4;};
document.getElementById('bs_dup').onclick=function(){
  if(!selBooth)return;
  var key=selBooth.userData.key,src=selBooth;
  var count=booths.filter(function(b){return b.userData.key===key;}).length;
  var g=BOOTHS[key].make(count);g.userData.key=key;
  g.position.copy(src.position);g.position.x+=2.5;g.rotation.copy(src.rotation);
  boothG.add(g);booths.push(g);selectBooth(g);
};
document.getElementById('bs_del').onclick=function(){
  if(!selBooth)return;
  var g=selBooth;deselectBooth();
  boothG.remove(g);booths.splice(booths.indexOf(g),1);
  g.traverse(function(o){if(o.geometry)o.geometry.dispose();});
};
document.getElementById('bs_close').onclick=deselectBooth;

/* ================= タイル3D（左下インセット） ================= */
var scene2=new THREE.Scene();scene2.background=new THREE.Color(0xe9eef3);
var cam2=new THREE.PerspectiveCamera(38,172/150,0.01,10);cam2.up.set(0,0,1);
var r2=new THREE.WebGLRenderer({antialias:true});
r2.setPixelRatio(Math.min(devicePixelRatio,2));r2.setSize(172,150);
document.getElementById('tileview').appendChild(r2.domElement);
scene2.add(new THREE.HemisphereLight(0xffffff,0xb0bcc6,1.0));
var tl=new THREE.DirectionalLight(0xffffff,0.7);tl.position.set(1,-1,1.5);scene2.add(tl);
var tileG=new THREE.Group();scene2.add(tileG);
function tilePatternTex(type,color){
  var cv=document.createElement('canvas');cv.width=cv.height=256;
  var c=cv.getContext('2d');
  c.fillStyle=color;c.fillRect(0,0,256,256);
  if(type==="tri"){
    c.strokeStyle="rgba(0,0,0,.28)";c.lineWidth=3;
    var n=4,st=256/n;
    for(var i=0;i<n;i++)for(var j=0;j<n;j++){
      var x=i*st,y=j*st;
      c.strokeRect(x,y,st,st);
      c.beginPath();
      c.moveTo(x,y);c.lineTo(x+st,y+st);
      c.moveTo(x+st,y);c.lineTo(x,y+st);
      c.moveTo(x+st/2,y);c.lineTo(x+st/2,y+st);
      c.moveTo(x,y+st/2);c.lineTo(x+st,y+st/2);
      c.stroke();
    }
    c.strokeStyle="rgba(255,255,255,.14)";c.lineWidth=2;c.strokeRect(4,4,248,248);
  }else if(type==="dot"){
    c.fillStyle="rgba(0,0,0,.22)";
    var m=10;
    for(var k=0;k<m;k++)for(var l=0;l<m;l++){
      c.beginPath();c.arc(256*(k+0.5)/m,256*(l+0.5)/m,5,0,7);c.fill();
    }
    c.strokeStyle="rgba(0,0,0,.3)";c.lineWidth=4;c.strokeRect(0,0,256,256);
  }else{ /* wood */
    for(var r=0;r<3;r++){
      var y2=r*256/3;
      c.fillStyle=shade(color,(r%2?6:-6));
      c.fillRect(0,y2,256,256/3);
      c.strokeStyle=shade(color,-25);c.globalAlpha=0.5;c.lineWidth=1.5;
      c.beginPath();c.moveTo(8,y2+24);c.lineTo(248,y2+20);
      c.moveTo(8,y2+58);c.lineTo(248,y2+64);c.stroke();c.globalAlpha=1;
      c.fillStyle="rgba(40,25,12,.6)";c.fillRect(0,y2,256,2);
    }
  }
  var t=new THREE.CanvasTexture(cv);t.anisotropy=ANISO;return t;
}
function buildTileModel(){
  clearGroup(tileG);
  var fl=FLOORS[state.floor];
  var S=fl.tile,T=fl.th;
  var col=state.main;
  var topTex=tilePatternTex(fl.pattern,col);
  var topM=new THREE.MeshPhongMaterial({map:topTex,shininess:20});
  var sideM=Ph(shade(col,-20));
  var topT=Math.min(0.005,T*0.35);
  var plate=new THREE.Mesh(new THREE.BoxGeometry(S,S,topT),[sideM,sideM,sideM,sideM,topM,sideM]);
  plate.position.z=T-topT/2;tileG.add(plate);
  /* リブ格子 */
  var ribM=Ph(shade(col,-14)),n=8,ribH=T-topT,i;
  for(i=0;i<=n;i++){
    var rx=new THREE.Mesh(new THREE.BoxGeometry(0.004,S,ribH),ribM);
    rx.position.set(-S/2+S*i/n,0,ribH/2);tileG.add(rx);
    var ry=new THREE.Mesh(new THREE.BoxGeometry(S,0.004,ribH),ribM);
    ry.position.set(0,-S/2+S*i/n,ribH/2);tileG.add(ry);
  }
  /* 斜めリブ（PRO/SMOOTHのトラス表現） */
  if(fl.pattern!=="dot"){
    for(i=0;i<n;i++)for(var j=0;j<n;j++){
      if((i+j)%2)continue;
      var d=new THREE.Mesh(new THREE.BoxGeometry(0.003,S/n*1.35,ribH*0.9),ribM);
      d.position.set(-S/2+S*(i+0.5)/n,-S/2+S*(j+0.5)/n,ribH*0.45);
      d.rotation.z=((i%2)?1:-1)*Math.PI/4;tileG.add(d);
    }
  }
  /* クッション脚（PRO=32個相当 / SMOOTH=白TPE） */
  if(fl.pattern!=="dot"){
    var cM=Ph(0xf2f4f5),m=(fl.pattern==="tri")?6:4;
    for(i=0;i<m;i++)for(var j2=0;j2<m;j2++){
      if(fl.pattern==="tri"&&(i%2===1&&j2%2===1))continue;
      var cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.010,0.012,ribH*0.85,10),cM);
      cyl.geometry.rotateX(Math.PI/2);
      cyl.position.set(-S/2+S*(i+0.5)/m,-S/2+S*(j2+0.5)/m,ribH*0.42);
      tileG.add(cyl);
    }
  }
  /* 連結フック（2辺） */
  var hM=Ph(shade(col,-18));
  for(i=0;i<4;i++){
    var h1=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.02,T*0.6),hM);
    h1.position.set(-S/2+S*(i+0.5)/4,S/2+0.012,T*0.3);tileG.add(h1);
    var h2=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.03,T*0.6),hM);
    h2.position.set(S/2+0.012,-S/2+S*(i+0.5)/4,T*0.3);tileG.add(h2);
  }
  document.getElementById('tilecap').textContent=
    fl.name+" / "+(fl.tile*1000).toFixed(1)+"mm角 × 厚"+(fl.th*1000).toFixed(2)+"mm / "+fl.tileG+"g・"+fl.warranty+"保証";
}
var t2=0;
function renderTile(){
  t2+=0.008;
  var R=0.52;
  cam2.position.set(R*Math.cos(t2),R*Math.sin(t2),0.30);
  cam2.lookAt(0,0,FLOORS[state.floor].th*0.6);
  r2.render(scene2,cam2);
}

/* ================= UI 構築 ================= */
function el(id){return document.getElementById(id);}
function buildSportUI(){
  var d=el('sports');d.innerHTML="";
  Object.keys(SPORTS).forEach(function(k){
    var b=document.createElement('button');
    b.className="gbtn"+(k===state.sport?" on":"");
    b.innerHTML=SPORTS[k].label+"<small>"+SPORTS[k].sub+"</small>";
    b.onclick=function(){
      state.sport=k;
      var def=SPORTS[k].def;
      state.floor=def.floor;state.main=def.main;state.subc=def.subc;state.acc=def.acc;state.line=def.line;
      rebuildAll();fitCamera();
    };
    d.appendChild(b);
  });
}
function buildFloorUI(){
  var d=el('floors');d.innerHTML="";
  [["pro","PRO","屋内外"],["control","CONTROL","屋外"],["smooth","SMOOTH","木目/屋内"]].forEach(function(f){
    var b=document.createElement('button');
    b.className="gbtn"+(f[0]===state.floor?" on":"");
    b.innerHTML=f[1]+"<small>"+f[2]+"</small>";
    b.onclick=function(){
      state.floor=f[0];
      var ch=FLOORS[f[0]].chart;
      function ok(c){return ch.some(function(x){return x.c===c;});}
      if(!ok(state.main))state.main=ch[0].c;
      if(!ok(state.subc))state.subc=ch[Math.min(1,ch.length-1)].c;
      if(!ok(state.acc))state.acc=ch[Math.min(2,ch.length-1)].c;
      rebuildAll();
    };
    d.appendChild(b);
  });
  var fl=FLOORS[state.floor];
  el('floorspec').innerHTML="<b>"+fl.name+"</b>（"+fl.use+"）<br>"+fl.desc+
    "<br>1箱 "+fl.perBox+"枚（約"+fl.boxKg+"kg）/ 保証 "+fl.warranty;
}
function buildChart(id,key){
  var d=el(id);d.innerHTML="";
  FLOORS[state.floor].chart.forEach(function(c){
    var s=document.createElement('div');
    s.className="sw"+(state[key]===c.c?" on":"");
    s.style.background=c.c;s.dataset.n=c.n;
    s.onclick=function(){state[key]=c.c;rebuildAll();};
    d.appendChild(s);
  });
}
function buildLineChart(){
  var d=el('ch_line');d.innerHTML="";
  LINECOLORS.forEach(function(c){
    var s=document.createElement('div');
    s.className="sw"+(state.line===c.c?" on":"");
    s.style.background=c.c;s.dataset.n=c.n;
    s.onclick=function(){state.line=c.c;rebuildAll();};
    d.appendChild(s);
  });
}
function buildBoothUI(){
  var d=el('booths');d.innerHTML="";
  Object.keys(BOOTHS).forEach(function(k){
    var b=document.createElement('button');
    b.className="gbtn";
    b.innerHTML=BOOTHS[k].label+"<small>"+BOOTHS[k].spec+"</small>";
    b.onclick=function(){spawnBooth(k);};
    d.appendChild(b);
  });
}
function refreshStats(){
  var sp=SPORTS[state.sport],fl=FLOORS[state.floor];
  var cols=Math.ceil(sp.floorW/fl.tile),rows=Math.ceil(sp.floorD/fl.tile);
  var tiles=cols*rows,boxes=Math.ceil(tiles/fl.perBox);
  el('st_area').textContent=(sp.floorW*sp.floorD).toFixed(1)+" ㎡（"+sp.floorW+"×"+sp.floorD+"m）";
  el('st_tiles').textContent=tiles.toLocaleString()+" 枚（"+cols+"×"+rows+"）";
  el('st_boxes').textContent=boxes.toLocaleString()+" 箱（"+fl.perBox+"枚入）";
  el('st_weight').textContent="約 "+(boxes*fl.boxKg/1000).toFixed(1)+" t";
}
function rebuildAll(){
  buildSportUI();buildFloorUI();
  buildChart('ch_main','main');buildChart('ch_sub','subc');buildChart('ch_acc','acc');
  buildLineChart();
  buildCourt();buildTileModel();
}

/* ================= カメラ・操作 ================= */
var theta=-1.05,phi=0.95,dist=42,target=new THREE.Vector3(0,0,0),rot=true;
function applyCam(){
  var sp=Math.sin(phi);
  cam.position.set(target.x+dist*sp*Math.cos(theta),target.y+dist*sp*Math.sin(theta),target.z+dist*Math.cos(phi));
  cam.lookAt(target);
}
function fitCamera(){
  var sp=SPORTS[state.sport];
  dist=Math.max(sp.floorW,sp.floorD)*1.35;
  target.set(0,0,0);
}
var rotBtn=el('rotBtn');
rotBtn.onclick=function(){rot=!rot;rotBtn.classList.toggle('on',rot);};
window.setView=function(name){
  rot=false;rotBtn.classList.remove('on');
  document.querySelectorAll('.vb').forEach(function(b){b.classList.remove('on');});
  el('vb_'+name).classList.add('on');
  var sp=SPORTS[state.sport],span=Math.max(sp.floorW,sp.floorD);
  if(name==='bird'){theta=-1.05;phi=0.95;dist=span*1.35;target.set(0,0,0);}
  if(name==='top'){theta=-Math.PI/2;phi=0.06;dist=span*1.5;target.set(0,0,0);}
  if(name==='side'){theta=-Math.PI/2;phi=1.35;dist=span*1.3;target.set(0,0,2);}
};

var ray=new THREE.Raycaster(),mv2=new THREE.Vector2();
var dragB=null,dragOff=new THREE.Vector3(),zPlane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
var drag=0,px=0,py=0,downX=0,downY=0,downBooth=null;
var cv=renderer.domElement;
function castBooth(x,y){
  mv2.x=(x/innerWidth)*2-1;mv2.y=-(y/innerHeight)*2+1;
  ray.setFromCamera(mv2,cam);
  var hit=ray.intersectObjects(boothG.children,true)[0];
  return hit?boothRoot(hit.object):null;
}
function groundPoint(x,y){
  mv2.x=(x/innerWidth)*2-1;mv2.y=-(y/innerHeight)*2+1;
  ray.setFromCamera(mv2,cam);
  var p=new THREE.Vector3();
  return ray.ray.intersectPlane(zPlane,p)?p:null;
}
cv.addEventListener('mousedown',function(e){
  downX=px=e.clientX;downY=py=e.clientY;
  downBooth=castBooth(e.clientX,e.clientY);
  if(downBooth){drag=0;}
  else drag=(e.button===2||e.shiftKey)?2:1;
});
addEventListener('mousemove',function(e){
  var mx=e.clientX,my=e.clientY;
  if(downBooth&&!dragB&&(Math.abs(mx-downX)>4||Math.abs(my-downY)>4)){
    rot=false;rotBtn.classList.remove('on');
    selectBooth(downBooth);
    var gp=groundPoint(mx,my);
    if(gp){dragB=downBooth;dragOff.copy(downBooth.position).sub(gp);}
  }
  if(dragB){
    var gp2=groundPoint(mx,my);
    if(gp2){
      dragB.position.x=Math.round((gp2.x+dragOff.x)*10)/10;
      dragB.position.y=Math.round((gp2.y+dragOff.y)*10)/10;
    }
    px=mx;py=my;return;
  }
  if(!drag)return;
  var dx=mx-px,dy=my-py;px=mx;py=my;
  if(Math.abs(mx-downX)>4||Math.abs(my-downY)>4){rot=false;rotBtn.classList.remove('on');}
  if(drag===1){theta-=dx*0.005;phi=Math.min(1.52,Math.max(0.06,phi-dy*0.005));}
  else if(drag===2){var sc=dist*0.0012;
    var f=new THREE.Vector3().subVectors(target,cam.position);f.z=0;f.normalize();
    var r=new THREE.Vector3(f.y,-f.x,0);
    target.addScaledVector(r,dx*sc).addScaledVector(f,dy*sc);}
});
addEventListener('mouseup',function(e){
  if(dragB){dragB=null;downBooth=null;drag=0;return;}
  if(Math.abs(e.clientX-downX)<5&&Math.abs(e.clientY-downY)<5){
    if(downBooth)selectBooth(downBooth);else deselectBooth();
  }
  downBooth=null;drag=0;
});
cv.addEventListener('wheel',function(e){e.preventDefault();
  dist=Math.min(400,Math.max(5,dist*(1+Math.sign(e.deltaY)*0.09)));},{passive:false});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
var tp=null;
cv.addEventListener('touchstart',function(e){if(e.touches.length===1){tp=[e.touches[0].clientX,e.touches[0].clientY];rot=false;rotBtn.classList.remove('on');}},{passive:true});
cv.addEventListener('touchmove',function(e){
  if(e.touches.length===1&&tp){var dx=e.touches[0].clientX-tp[0],dy=e.touches[0].clientY-tp[1];
    tp=[e.touches[0].clientX,e.touches[0].clientY];theta-=dx*0.006;phi=Math.min(1.52,Math.max(0.06,phi-dy*0.006));}
  if(e.touches.length===2){var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(cv._pd)dist=Math.min(400,Math.max(5,dist*cv._pd/d));cv._pd=d;}
},{passive:true});
cv.addEventListener('touchend',function(){tp=null;cv._pd=null;},{passive:true});
addEventListener('keydown',function(e){
  if(!selBooth)return;
  if(e.key==='r'||e.key==='R')selBooth.rotation.z+=Math.PI/4;
  if(e.key==='Delete'||e.key==='Backspace'){el('bs_del').onclick();}
});

var hintT=null;
function showHint(t){
  var h=el('hint');h.textContent=t;h.style.opacity=1;
  clearTimeout(hintT);hintT=setTimeout(function(){h.style.opacity=0;},2800);
}
addEventListener('resize',function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ================= 起動 ================= */
buildGround();buildBoothUI();rebuildAll();fitCamera();
setTimeout(function(){showHint("コート・床材・カラーは左パネル、ブースは右下パレットから");},1000);
(function loop(){
  requestAnimationFrame(loop);
  if(rot)theta+=0.0024;
  applyCam();
  renderer.render(scene,cam);
  renderTile();
})();
})();
</script>
