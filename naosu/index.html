<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>BBB 修繕リレー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one app column that fills the phone; white chrome, grey ground, one corporate blue for actions, thin borders instead of shadows. */
:root{
  --brand:#0B4A8F; --brand-deep:#08325F; --brand-soft:#E9F0F9; --brand-line:#B9CDE6;
  --bg:#F3F5F8; --card:#FFFFFF; --ink:#111C2B; --mute:#5F6B7C; --line:#DDE2E9; --stage:#E4E7EC;
  --urgent:#C4301C; --urgent-soft:#FBE9E6; --high:#B85C08; --high-soft:#FCEEDD; --mid:#7D6500; --mid-soft:#F5EFD3; --low:#2A7449; --low-soft:#E3F1E8; --done:#8792A2;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  --f-num:"Inter","Noto Sans JP",system-ui,sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --r:10px; --rb:8px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{height:100%}
@supports (height:100dvh){html{height:100dvh}}
body{height:100%;margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg{display:block}
.phone{position:relative;width:100%;max-width:640px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px) and (min-height:720px) and (hover:hover) and (pointer:fine){body{align-items:center}.phone{max-width:412px;height:min(100% - 48px,880px);border-radius:16px;box-shadow:0 0 0 1px var(--line),0 24px 48px -24px rgba(17,28,43,.35)}}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;animation:in .2s ease both}
@keyframes in{from{opacity:0}to{opacity:1}}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding-left:var(--gl);padding-right:var(--gr)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{background:var(--card);color:var(--ink);padding-top:10px;padding-bottom:10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex:none;min-height:60px}
.top h1{font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.top .sub{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:var(--rb);display:grid;place-items:center;flex:none;margin-left:-8px}
.iconbtn:active{background:var(--bg)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.avatar.s{width:26px;height:26px;font-size:12px}
.avatar.gold{background:var(--brand-soft);color:var(--brand)}
.rolechip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-size:13px;font-weight:700;min-height:40px;flex:none;background:var(--card)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:var(--rb);background:var(--brand);color:#fff;font-weight:700;font-size:16px;letter-spacing:.02em;transition:background .12s}
.btn:active{background:var(--brand-deep)}
.btn.gold{background:var(--brand);color:#fff}
.btn.ghost{background:var(--card);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand-line)}
.btn.ghost:active{background:var(--brand-soft)}
.btn.sm{min-height:44px;font-size:14px;width:auto;padding:0 14px}

/* status */
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:.04em}
.pill i{display:none}
.p-urgent{background:var(--urgent);color:#fff}.p-high{background:var(--high-soft);color:var(--high)}.p-mid{background:var(--mid-soft);color:var(--mid)}.p-low{background:var(--low-soft);color:var(--low)}
.st{font-size:12.5px;font-weight:700;color:var(--mute);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.st.working{color:var(--brand)}.st.done{color:var(--low)}
.st .ic{width:14px;height:14px;stroke-width:2.4}

/* welcome */
.onb{background:var(--card);padding-top:clamp(20px,6vh,56px);padding-bottom:20px;gap:20px}
.brandrow{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.brandrow b{font-size:20px;letter-spacing:.04em;display:block;line-height:1.2}
.brandrow span{font-size:12.5px;color:var(--mute)}
.onb h1{font-size:clamp(22px,6.4vw,27px);font-weight:700;line-height:1.4;letter-spacing:.01em}
.onb .lead{color:var(--mute);font-size:15px;margin-top:8px}
.feats{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.feats li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.feats .tile{width:40px;height:40px;border-radius:var(--rb);background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.feats b{display:block;font-size:15.5px}
.feats span{font-size:13.5px;color:var(--mute)}
.note{font-size:12.5px;color:var(--mute);text-align:center;margin-top:10px}

/* map */
.mapwrap{position:relative;flex:1;min-height:150px;background:#E9EDF2}
.mapwrap{overflow:hidden}
.mapwrap svg.map{position:absolute;inset:0;width:100%;height:100%}
svg.map{overflow:visible}
.map .pin{cursor:pointer;transition:transform .15s;transform-box:fill-box;transform-origin:50% 100%}
.map .pin.sel{transform:scale(1.2)}
.pulse{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(.5);opacity:.45}to{transform:scale(2.4);opacity:0}}
.radar{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.radar.d2{animation-delay:.8s}.radar.d3{animation-delay:1.6s}
.locchip{position:absolute;left:var(--gl);top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--rb);padding:6px 12px 6px 8px;font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center;max-width:calc(100% - 32px)}
.locchip .ic{width:16px;height:16px;color:var(--brand)}
.locchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{background:var(--bg);border-radius:16px 16px 0 0;margin-top:-14px;position:relative;max-height:50%;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.grab{flex:none;width:100%;height:26px;display:grid;place-items:center;touch-action:none}
.grab::before{content:"";width:40px;height:4px;border-radius:2px;background:#C3CAD4}
.sheet.up{max-height:calc(100% - 60px - 92px)}
.home .mapwrap{min-height:92px}
.sheethead{display:flex;align-items:baseline;justify-content:space-between;padding-top:0;padding-bottom:8px}
.sheethead h2{font-size:16px;font-weight:700}
.sheethead span{font-size:12.5px;color:var(--mute)}
.counts{display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.count{flex:1;padding:8px 12px;display:flex;align-items:baseline;gap:6px;min-width:0}
.count+.count{border-left:1px solid var(--line)}
.count b{font-family:var(--f-num);font-size:20px;line-height:1.2;font-weight:600}
.count span{font-size:12px;color:var(--mute);font-weight:500;white-space:nowrap}
.count.u b{color:var(--urgent)}.count.w b{color:var(--brand)}.count.d b{color:var(--low)}

/* issue rows */
.list{display:flex;flex-direction:column;gap:8px;padding-bottom:16px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%;transition:background .12s}
.row:active{background:var(--brand-soft)}
.row.sel{background:var(--brand-soft);border-color:var(--brand)}
.thumb{width:56px;height:56px;border-radius:6px;overflow:hidden;flex:none;background:var(--line)}
.ph{width:100%;height:100%}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .ttl{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--rb);padding:3px;gap:2px;margin:12px 0}
.seg button{flex:1;height:42px;border-radius:6px;font-size:14px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--brand);color:#fff}
.empty{text-align:center;color:var(--mute);padding:36px 0;font-size:14px}

/* nav */
.nav{flex:none;display:flex;align-items:flex-end;justify-content:space-around;background:var(--card);padding:4px var(--gr) 6px var(--gl);border-top:1px solid var(--line);position:relative}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:500;color:var(--mute);padding:6px 0 2px;position:relative;min-height:54px}
.nav button.on{color:var(--brand);font-weight:700}
.nav .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--urgent);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;font-family:var(--f-num);font-weight:600}
.nav .shoot{flex:none;width:58px;height:58px;min-height:0;border-radius:50%;background:var(--brand);color:#fff;margin:-18px 8px 0;box-shadow:0 0 0 4px var(--card),0 6px 14px rgba(11,74,143,.3);justify-content:center;font-size:10.5px;font-weight:700;gap:0;padding:0}
.nav .shoot .ic{width:24px;height:24px}
.nav .shoot:active{background:var(--brand-deep)}

/* camera */
.cam{background:#0C1118;color:#fff}
.cam .camtop{display:flex;align-items:center;gap:8px;padding-top:8px;padding-bottom:8px;flex:none}
.cam .iconbtn{margin-left:-8px}.cam .iconbtn:active{background:rgba(255,255,255,.12)}
.cam .step{flex:1;text-align:center;min-width:0}
.cam .step b{display:block;font-size:16px}
.cam .step span{font-size:12.5px;opacity:.7}
.finder{position:relative;flex:1;min-height:0;margin:0 var(--gr) 0 var(--gl);border-radius:8px;overflow:hidden;background:#000}
.finder .ph{position:absolute;inset:0}
.finder .frame{position:absolute;inset:12%;pointer-events:none;background:
  linear-gradient(#fff,#fff) 0 0/22px 2px, linear-gradient(#fff,#fff) 0 0/2px 22px,
  linear-gradient(#fff,#fff) 100% 0/22px 2px, linear-gradient(#fff,#fff) 100% 0/2px 22px,
  linear-gradient(#fff,#fff) 0 100%/22px 2px, linear-gradient(#fff,#fff) 0 100%/2px 22px,
  linear-gradient(#fff,#fff) 100% 100%/22px 2px, linear-gradient(#fff,#fff) 100% 100%/2px 22px;background-repeat:no-repeat;opacity:.85}
.finder .hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13.5px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.8);font-family:var(--f-num)}
.finder .gps{position:absolute;top:10px;left:10px;background:rgba(12,17,24,.7);border-radius:4px;padding:3px 8px;font-size:12px;display:flex;gap:5px;align-items:center}
.finder .gps .ic{width:13px;height:13px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .3s ease-out}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.cambar{display:flex;align-items:center;justify-content:space-between;padding-top:clamp(10px,2.4vh,18px);padding-bottom:clamp(12px,2.8vh,22px);flex:none}
.slots{display:flex;gap:8px;width:96px}
.slot{width:44px;height:44px;border-radius:6px;border:1px dashed rgba(255,255,255,.4);overflow:hidden;display:grid;place-items:center;font-family:var(--f-num);font-size:14px;color:rgba(255,255,255,.55)}
.slot.f{border:2px solid #fff}
.shutter{width:68px;height:68px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #0C1118,0 0 0 6px #fff;transition:transform .1s;flex:none}
.shutter:active{transform:scale(.92)}

/* analyze + dispatch */
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:14px}
.shots>div{aspect-ratio:4/3;border-radius:var(--rb);overflow:hidden;position:relative;background:var(--line)}
.tag{position:absolute;left:8px;top:8px;background:rgba(17,28,43,.78);color:#fff;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:4px}
.steps{display:flex;flex-direction:column;gap:8px;margin:16px 0;list-style:none;padding:0}
.steps li{display:flex;gap:10px;align-items:center;font-size:14.5px;opacity:.4;animation:stepon .3s ease forwards}
.steps li .dot{width:20px;height:20px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff;animation:doton .3s ease forwards}
.steps li .dot .ic{width:12px;height:12px;stroke-width:3}
.steps li:nth-child(1),.steps li:nth-child(1) .dot{animation-delay:.4s}
.steps li:nth-child(2),.steps li:nth-child(2) .dot{animation-delay:1s}
.steps li:nth-child(3),.steps li:nth-child(3) .dot{animation-delay:1.6s}
.steps li:nth-child(4),.steps li:nth-child(4) .dot{animation-delay:2.2s}
@keyframes stepon{to{opacity:1}}
@keyframes doton{to{background:var(--low)}}
.reveal{animation:reveal .3s ease 2.6s both}
@keyframes reveal{from{opacity:0;visibility:hidden}to{opacity:1;visibility:visible}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:14.5px}
.kv dt{color:var(--mute);font-size:13px}
.kv dd{margin:0;font-weight:700;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 13px;border-radius:6px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;font-weight:500;color:var(--ink)}
.chip.on{background:var(--brand);color:#fff;box-shadow:none;font-weight:700}
.routebox{display:flex;gap:12px;align-items:center;background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:var(--r);padding:14px}
.routebox .meta{white-space:normal}
.routebox b{font-size:15.5px}
.routebox .lbl{font-size:12px;color:var(--brand);font-weight:700;letter-spacing:.06em}
.footer{flex:none;padding-top:10px;padding-bottom:14px;background:var(--bg);border-top:1px solid var(--line)}
.dsp{position:relative}
.dspcard{position:absolute;left:var(--gl);right:var(--gr);bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 10px 24px -8px rgba(17,28,43,.25);animation:in .25s ease both}
.dspcard h2{font-size:17px;font-weight:700;margin-bottom:2px}
.dspcard .meta{white-space:normal}
.cands{display:flex;margin:12px 0 4px}
.cands .avatar{margin-right:-8px;box-shadow:0 0 0 2px var(--card);animation:in .4s ease both}
.cands .avatar:nth-child(2){animation-delay:.5s}.cands .avatar:nth-child(3){animation-delay:1s}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:40%;background:var(--brand);border-radius:2px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.who{display:flex;gap:12px;align-items:center}
.who .body{flex:1;min-width:0}
.who b{display:block;font-size:15.5px}
.eta{text-align:right;flex:none}
.eta b{font-family:var(--f-num);font-size:24px;line-height:1.1;color:var(--brand);font-weight:600}
.eta span{font-size:11.5px;color:var(--mute);display:block}
.notify{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.notify span{display:inline-flex;align-items:center;gap:4px;background:var(--low-soft);color:var(--low);border-radius:4px;padding:2px 8px 2px 6px;font-size:12.5px;font-weight:700}
.notify .ic{width:13px;height:13px;stroke-width:2.6}

/* detail */
.hero{position:relative;height:clamp(140px,26vh,220px);flex:none;background:var(--line)}
.hero .pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:100%}
.hero .pair>div{position:relative;overflow:hidden}
.hero .tag{top:auto;bottom:8px}
.hero .tag.ok{background:var(--low)}
.hero .back{position:absolute;top:10px;left:var(--gl);margin:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:50%}
.dbody{display:flex;flex-direction:column;gap:14px;padding-top:16px;padding-bottom:16px}
.dbody h1{font-size:19px;font-weight:700;line-height:1.4}
.tags{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.banner{display:flex;gap:10px;align-items:center;background:var(--low-soft);color:var(--low);border:1px solid #BFDCCB;border-radius:var(--r);padding:10px 12px;font-weight:700;font-size:14px}
.minimap{height:clamp(110px,18vh,150px);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;position:relative;background:#E9EDF2}
.minimap svg{width:100%;height:100%}
.tl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:40px 12px 1fr;gap:10px;font-size:14px;padding-bottom:14px;position:relative}
.tl li time{font-family:var(--f-num);color:var(--mute);font-size:13px;padding-top:2px}
.tl li i{width:8px;height:8px;border-radius:50%;background:var(--done);margin:7px 2px 0;position:relative;z-index:1}
.tl li:not(:last-child)::after{content:"";position:absolute;left:55px;top:12px;bottom:-7px;width:1px;background:var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child i{background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.sec{font-size:13px;font-weight:700;color:var(--mute);margin-bottom:8px}

/* chat */
.thread{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:64px}
.thread .body{flex:1;min-width:0}
.thread b{font-size:15px;display:block}
.thread .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--mute);flex:none}
.unread{min-width:18px;height:18px;border-radius:9px;background:var(--urgent);color:#fff;font-size:11.5px;display:grid;place-items:center;padding:0 5px;font-family:var(--f-num);font-weight:600}
.msgs{display:flex;flex-direction:column;gap:10px;padding-top:14px;padding-bottom:14px}
.msg{max-width:84%;display:flex;flex-direction:column;gap:2px}
.msg .who2{font-size:12px;color:var(--mute);padding:0 2px}
.msg .bub{background:var(--card);border:1px solid var(--line);border-radius:2px 12px 12px 12px;padding:8px 12px;font-size:15px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--brand);border-color:var(--brand);color:#fff;border-radius:12px 2px 12px 12px}
.msg.sys{align-self:stretch;max-width:100%}
.msg .t{font-size:11px;color:var(--mute);padding:0 2px;font-family:var(--f-num)}
.msg .cardwrap{width:280px;max-width:100%}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick .chip{flex:none;color:var(--brand)}
.composer{flex:none;background:var(--card);padding-top:8px;padding-bottom:10px;border-top:1px solid var(--line)}
.inputrow{display:flex;gap:8px;align-items:center}
.inputrow input{flex:1;min-width:0;height:44px;border-radius:var(--rb);border:1px solid var(--line);background:var(--bg);padding:0 14px;font:inherit;font-size:16px;color:var(--ink)}
.send{width:44px;height:44px;border-radius:var(--rb);background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}

/* voices */
.voice{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.voice .head{display:flex;gap:10px;align-items:center}
.voice .head .body{flex:1;min-width:0}
.voice q{quotes:none;font-size:15px;line-height:1.7}
.voice .acts{display:flex;gap:8px;flex-wrap:wrap}
.vst{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.vst.open{background:var(--urgent-soft);color:var(--urgent)}.vst.ok{background:var(--low-soft);color:var(--low)}

/* overlay sheet + toast */
.ovl{position:absolute;inset:0;background:rgba(17,28,43,.5);display:flex;align-items:flex-end;z-index:20;animation:in .2s ease both}
.modal{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding-top:20px;padding-bottom:20px;animation:up .22s ease both;max-height:88%;overflow:auto}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:17px;font-weight:700;margin-bottom:12px}
.role{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);width:100%;text-align:left;margin-bottom:8px;min-height:60px}
.role.on{border-color:var(--brand);background:var(--brand-soft)}
.role b{display:block;font-size:15px}
.role>span:last-child{min-width:0}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);resize:none;margin-bottom:12px}
.toast{position:absolute;left:50%;top:68px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:var(--rb);font-size:13.5px;font-weight:700;z-index:30;display:flex;gap:8px;align-items:center;animation:toast 2.6s ease both;max-width:calc(100% - 32px);pointer-events:none;white-space:nowrap}
.toast .ic{width:16px;height:16px;stroke-width:2.6}
@keyframes toast{0%{opacity:0}8%,88%{opacity:1}100%{opacity:0}}

/* quick outcomes, address entry, follow-up */
.footer{display:flex;flex-direction:column;gap:8px}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1;min-width:0;font-size:14.5px;min-height:46px;padding:0 8px}
.btnrow .btn .ic{width:16px;height:16px}
.st.follow{color:var(--high)}.st.none{color:var(--mute)}
.field{width:100%;height:48px;border:1px solid var(--line);border-radius:var(--rb);background:var(--card);padding:0 12px;font:inherit;font-size:16px;color:var(--ink)}
.field.err{border-color:var(--urgent);background:var(--urgent-soft)}
.warnbox{display:flex;gap:8px;align-items:flex-start;background:var(--high-soft);color:var(--high);border-radius:var(--rb);padding:8px 10px;font-size:13.5px;font-weight:700;line-height:1.5}
.warnbox .ic{width:16px;height:16px;margin-top:2px}
.errmsg{color:var(--urgent);font-size:13px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:10px}
.steps li.warn{color:var(--high);font-weight:700}
.steps li.warn .dot{animation-name:dotwarn}
@keyframes dotwarn{to{background:var(--high)}}
.static,.static .reveal,.static .steps li,.static .steps .dot{animation:none}
.static .steps li{opacity:1}.static .steps .dot{background:var(--low)}.static .steps li.warn .dot{background:var(--high)}
.locchip{min-height:40px}
.locchip.warn{border-color:var(--high);color:var(--high)}.locchip.warn .ic{color:var(--high)}
.locchip em{font-style:normal;color:var(--brand);font-weight:700;flex:none}
.modal .lead{color:var(--mute);font-size:13.5px;margin:-6px 0 12px}
.modal .stack{margin-bottom:4px}

/* live numbers, progress, stepper */
.prog{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.progtop{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mute);margin-bottom:6px}
.progtop b{font-family:var(--f-num);font-size:16px;color:var(--ink);font-weight:600}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;background:var(--brand);transition:width .7s cubic-bezier(.2,.7,.2,1)}
.track i.b-urgent{background:var(--urgent)}.track i.b-high{background:#E07A1F}.track i.b-mid{background:#D39B00}.track i.b-low{background:var(--low)}
.score{display:flex;align-items:baseline;gap:4px}
.score b{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.1}
.score span{font-size:12.5px;color:var(--mute);font-weight:400}
.score+.track{margin:6px 0 4px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);list-style:none;padding:0;margin:0}
.stepper li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute);position:relative;text-align:center}
.stepper li::before{content:"";position:absolute;top:9px;right:50%;width:100%;height:2px;background:var(--line)}
.stepper li:first-child::before{display:none}
.stepper li.on::before{background:var(--brand)}
.stepper .dot{width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--line);position:relative;z-index:1;display:grid;place-items:center;color:#fff}
.stepper .dot .ic{width:11px;height:11px;stroke-width:3.2}
.stepper li.on .dot{background:var(--brand);border-color:var(--brand)}
.stepper li.cur{color:var(--brand);font-weight:700}
.stepper li.cur .dot{background:var(--card);border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.stepper li.cur .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.stepper li.off.cur{color:var(--mute)}.stepper li.off.cur .dot{border-color:var(--done);box-shadow:none}.stepper li.off.cur .dot::after{background:var(--done)}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;border:1px solid var(--line);border-radius:var(--rb)}
.dstats div{padding:8px 10px;min-width:0}
.dstats div+div{border-left:1px solid var(--line)}
.dstats b{font-family:var(--f-num);font-size:18px;font-weight:600;display:block;line-height:1.2;font-variant-numeric:tabular-nums}
.dstats span{font-size:11.5px;color:var(--mute);white-space:nowrap}
.remain{font-size:12.5px;color:var(--mute);margin-top:8px}
.banner .ic path{stroke-dasharray:26;stroke-dashoffset:26;animation:draw .45s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.typing{display:flex;gap:4px;align-items:center;height:36px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--done);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.tick{animation:tick .5s ease}
@keyframes tick{0%{color:var(--brand)}100%{}}

/* real camera */
img.ph,video.ph{object-fit:cover;display:block}
.finder.off .ph{opacity:.38}
.camnote{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.camnote b{font-size:16px}
.camnote span{font-size:13.5px;opacity:.85;max-width:26ch}
.camnote .ic{width:30px;height:30px}
.sample{width:96px;min-height:44px;font-size:12.5px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:var(--rb);line-height:1.3;padding:4px 6px}
.sample:active{background:rgba(255,255,255,.12)}
.typing{align-self:flex-start}

/* roles, offers, stalled */
.st.open,.st.stall{color:var(--urgent)}
.counts .count{padding:8px 10px}
.avail{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;min-height:56px}
.avail .body{flex:1;min-width:0}
.avail b{display:block;font-size:14.5px}
.avail.on{border-color:var(--brand-line);background:var(--brand-soft)}
.sw{width:44px;height:26px;border-radius:13px;background:var(--done);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.avail.on .sw{background:var(--brand)}.avail.on .sw::after{transform:translateX(18px)}
.datetile{width:56px;height:56px;border-radius:6px;background:var(--brand-soft);color:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-size:12px;font-weight:700;line-height:1.3}
.datetile b{font-family:var(--f-num);font-size:16px;font-weight:600}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:17px;font-weight:600}
.inchead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.inchead h2{margin:0;flex:1}
.inchead p{font-size:13px;color:var(--mute)}
.modal .dstats{margin:12px 0}
.btnrow .grow{flex:2}
.offmap{height:clamp(120px,22vh,190px);flex:none;position:relative;background:#E9EDF2;overflow:hidden;border-bottom:1px solid var(--line)}
.offmap svg{position:absolute;inset:0;width:100%;height:100%}
.cand{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:60px}
.cand .body{flex:1;min-width:0}
.cand b{display:block;font-size:15px}
.cand.on{border-color:var(--brand);background:var(--brand-soft)}
.cand.busy{opacity:.6}
.cand .box{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--done);display:grid;place-items:center;color:#fff;flex:none}
.cand.on .box{background:var(--brand);border-color:var(--brand)}
.cand .box .ic{width:14px;height:14px;stroke-width:3}
.tagfree{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--low-soft);color:var(--low);margin-left:6px;white-space:nowrap}
.tagbusy{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--mute);margin-left:6px;white-space:nowrap}
.res{font-size:13px;font-weight:700;flex:none;color:var(--mute)}
.res.yes{color:var(--low)}.res.wait{color:var(--brand)}
.waitline{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700}
.waitline b{font-family:var(--f-num);font-size:20px;color:var(--brand);font-weight:600}

/* phone ergonomics */
.bub,q,.tl span,input,textarea{-webkit-user-select:text;user-select:text}
.nav .ic{width:24px;height:24px}
.row{min-height:76px}
.thread{min-height:68px}
.kb .nav,.kb .quick{display:none}

/* small and short phones */
@media (max-width:359px){
  body{font-size:14px}
  .meta{font-size:12px}
  .row .ttl{font-size:14.5px}
  .count span{font-size:11px}
  .count{padding:8px 8px}
  .nav button{font-size:10.5px}
  .thumb{width:48px;height:48px}
  .row{gap:10px;padding:8px}
  .rolechip{padding-left:10px;font-size:12.5px}
  .nav .shoot{margin-left:4px;margin-right:4px}
  .slots{width:80px}.slot{width:36px;height:36px}
  .sample{width:80px;font-size:11px;padding:4px 2px}
  .btnrow .btn{font-size:12.5px;padding:0 4px;gap:4px}
}
@media (max-height:620px){
  .footer{gap:6px;padding-top:8px;padding-bottom:10px}
  .footer .btn{min-height:44px}
  .sheet{max-height:56%}
  .counts,.prog{display:none}
  .steps{margin:10px 0;gap:6px}
  .shots>div{aspect-ratio:16/9}
  .feats li{padding:10px 0}
  .shutter{width:60px;height:60px}
}
/* phone held sideways: split the home screen and keep everything reachable */
@media (orientation:landscape) and (max-height:480px){
  .phone{max-width:none}
  .screen.home{flex-direction:row;flex-wrap:wrap}
  .screen.home .top{flex:0 0 100%}
  .screen.home .mapwrap{flex:1 1 50%;min-height:0;height:calc(100% - 60px)}
  .screen.home .sheet{flex:1 1 50%;max-height:none;height:calc(100% - 60px);margin:0;border-radius:0;border-top:0;border-left:1px solid var(--line)}
  .screen.home .grab{display:none}
  .nav button{flex-direction:row;gap:6px;font-size:13px}
  .nav .shoot{flex-direction:column;margin-top:-10px;width:52px;height:52px}
  .hero{height:38vh}
  .cam{flex-direction:row;flex-wrap:wrap}
  .cam .camtop{flex:0 0 100%}
  .cam .finder{height:calc(100% - 60px);margin-right:0}
  .cam .cambar{flex-direction:column;height:calc(100% - 60px);width:120px}
  .cam .slots{width:auto}
  .cam .sample{width:96px}
  .onb{overflow-y:auto}
  .dspcard{left:auto;width:min(360px,50%)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}

/* ---------- actions ---------- */
function postCard(tid,from,id,text){const t=D.threads.find(x=>x.id==tid);t.msgs.push({f:from,t:now(),sys:true,card:id});if(text)t.msgs.push({f:from,t:now(),x:text});t.unread++}
function send(text){const t=D.threads.find(x=>x.id==S.thread);text=text.trim();if(!text)return;
 t.msgs.push({me:true,f:ROLES[S.role][0],t:now(),x:text});t.typing=true;render();
 const id=t.id;setTimeout(()=>{t.typing=false;t.msgs.push({f:t.reply[0],t:now(),x:t.reply[1]});if(S.screen=='thread'&&S.thread==id){const v=document.getElementById('chatinput').value;render();document.getElementById('chatinput').value=v}else{t.unread++;if(S.screen=='main')render()}},1500)}
function setAddr(v){S.addr=v;S.geo='manual';S.sheet=null;toast('場所を設定しました')}
function complete(i,how){i.status='done';if(S.role=='field')i.doneBy='me';const who=how.startsWith('完了写真')?nm(i):ROLES[S.role][0];
 i.log.push([now(),`${who}が${how}、管理・営業・オーナーへ共有`]);
 postCard('ms','BBB 自動共有',i.id,`「${i.title}」が完了しました。${i.after?'Before / After を確認できます。':'写真なしで完了が記録されています。'}`);
 const v=D.voices.find(x=>x.issue==i.id);if(v){v.st='done';if(v.thread)postCard(v.thread,'BBB 自動共有',i.id)}
 S.issueId=i.id;S.screen='detail';S.back='main';S.justDone=true;buzz(30);toast('完了を共有しました')}
function createIssue(status){const d=S.draft,s=d.s,ok=S.geo=='ok';let bld=s.bld,dist=s.dist,manual=false;
 if(!ok){const a=(d.addr||'').trim();if(!a){d.err=true;d.ready=true;render();const el=document.getElementById('addrinput');el.focus();el.scrollIntoView({block:'center'});return null}
  bld=BLD.find(b=>a.includes(b))||a;dist='';manual=true;S.addr=a;S.geo='manual'}
 const i={id:seq++,key:s.key,title:s.title,cat:d.cat,pri:d.pri,bld,place:s.place,x:s.x,y:s.y,dist,status,who:s.who,eta:s.eta,route:s.route,shots:d.shots,after:null,at:Date.now(),
  log:[[now(),`${ROLES[S.role][0]}が写真2枚で報告${manual?'（場所は手入力）':''}`],[now(),`優先度「${PRI[d.pri].l}」と判定、${s.route=='mgmt'?'管理へ差配':'近くの'+PPL[s.who].r+'へ差配'}`]]};
 D.issues.push(i);if(d.voice){const v=D.voices.find(x=>x.id==d.voice);v.st='prog';v.issue=i.id}
 S.scn++;S.issueId=i.id;S.draft=null;S.cam=null;return i}
function requestGeo(){S.geo='pending';const fail=()=>{if(S.geo=='pending'){S.geo=S.addr?'manual':'ng';soft()}},soft=()=>{if(S.screen=='main'&&S.tab=='map'&&!S.sheet)render()};
 try{if(!navigator.geolocation)throw 0;navigator.geolocation.getCurrentPosition(p=>{S.geo='ok';S.loc=`現在地 ${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}`;soft()},fail,{timeout:6000});setTimeout(fail,7000)}catch(_){S.geo=S.addr?'manual':'ng'}}
/* camera: live preview when the browser allows it, otherwise the device camera through a file input.
   The picture is only displayed; the report itself still follows the fixed sample scenario. */
let camStream=null;
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
async function startCam(){const c=S.cam;c.live='pending';
 try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
  const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
  if(S.cam!==c||S.screen!='cam'){st.getTracks().forEach(t=>t.stop());return}
  stopCam();camStream=st;c.live='on'}catch(_){if(S.cam===c)c.live='off'}
 if(S.cam===c&&S.screen=='cam')render()}
function grab(src,w,h){try{const k=Math.min(1,960/Math.max(w,h)),cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',.72)}catch(_){return null}}
function fileShot(file){const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const d=grab(im,im.naturalWidth,im.naturalHeight);URL.revokeObjectURL(url);takeShot(d)};
 im.onerror=()=>{URL.revokeObjectURL(url);toast('写真を読み込めないため、サンプル写真を使います');takeShot(null)};im.src=url}
function takeShot(data){const c=S.cam;if(!c||c.busy)return;c.busy=true;buzz(15);const f=document.getElementById('flash');if(f){f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
 setTimeout(()=>{c.busy=false;if(S.cam!==c)return;
  if(c.mode=='report'){c.shots.push(data||c.s.key+(c.shots.length?'_b':'_w'));if(c.shots.length==2){const dr=S.draft={s:c.s,shots:c.shots,pri:c.s.pri,cat:c.s.cat,voice:c.voice,addr:S.geo=='manual'?S.addr:'',man:S.geo=='manual',err:false,ready:false};S.screen='analyze';NUMS.score=0;BARS.score=0;setTimeout(()=>{dr.ready=true},3400)}}
  else{const i=issue(c.id);i.after=data||c.after;S.cam=null;complete(i,'完了写真を送信')}
  render()},320)}
const A={
 start(){S.screen='main';S.tab='map';S.nextOffer=Date.now()+9000},
 tab(a){S.tab=a;S.sel=null;S.up=false;S.screen='main'},
 pin(a){S.sel=S.sel==a?null:+a;S.up=false},
 filter(a){S.filter=a},
 open(a){S.issueId=+a;S.back=S.screen=='thread'?'thread':'main';S.screen='detail';S.justDone=false},
 back(){if(S.screen=='detail'&&S.back=='thread')S.screen='thread';else S.screen='main'},
 report(a,voiceId){const s=SCN[S.scn%SCN.length];S.cam={mode:'report',s,shots:[],voice:voiceId||null};S.screen='cam';startCam()},
 voicecase(a){const v=D.voices.find(x=>x.id==a);S.scn=v.scn||0;A.report(null,v.id)},
 camclose(){S.screen=S.cam&&S.cam.mode=='done'?'detail':'main';S.cam=null;S.draft=null},
 shutter(){const c=S.cam;if(c.busy)return false;
  if(c.live=='on'){const v=document.getElementById('camvideo');takeShot(v&&v.videoWidth?grab(v,v.videoWidth,v.videoHeight):null)}
  else document.getElementById('camfile').click();
  return false},
 sample(){if(!S.cam.busy)takeShot(null);return false},
 setpri(a){S.draft.pri=a},
 setcat(a){S.draft.cat=a},
 addrpick(a){S.draft.addr=a;S.draft.err=false},
 submit(){const i=createIssue('dispatched');if(!i)return false;const id=i.id;S.dsp=0;S.dspT0=Date.now();NUMS.cand=0;NUMS.near=400;S.screen='dispatch';
  setTimeout(()=>{if(closed(i))return;i.log.push([now(),i.route=='mgmt'?`管理 山田さんが${PPL[i.who].n}を手配`:`${PPL[i.who].n}さんが受諾`]);postCard('sk','BBB 自動共有',id);if(S.screen=='dispatch'&&S.issueId==id){S.dsp=1;render()}},3200)},
 selfdone(){const i=createIssue('dispatched');if(!i)return false;complete(i,'その場で対応し、完了として記録')},
 finish(){const i=issue(S.issueId);S.sheet=null;S.cam={mode:'done',id:i.id,after:({trash:'trash_a',rail:'rail_a',win:'win_a',light:'light_a'})[i.key],shots:[]};S.screen='cam';startCam()},
 donenow(){S.sheet=null;complete(issue(S.issueId),'完了を記録（写真なし）')},
 noneset(a){const i=issue(S.issueId);i.status='none';i.reason=a;i.log.push([now(),`${ROLES[S.role][0]}が「対応不要」と記録（${a}）`]);
  postCard('ms','BBB 自動共有',i.id,`「${i.title}」は対応不要となりました。理由：${a}`);const v=D.voices.find(x=>x.issue==i.id);if(v)v.st='done';
  S.sheet=null;S.justDone=true;toast('対応不要として記録しました')},
 follow(){const i=issue(S.issueId);S.fu=i.follow?{...i.follow}:{type:FU.type[0],to:FU.to[0],due:FU.due[1],memo:''};S.screen='follow'},
 fuset(a){const [k,v]=a.split('|');S.fu[k]=v},
 todetail(){S.screen='detail';S.of=null},
 sheetup(){S.up=!S.up},
 avail(){S.avail=!S.avail;if(S.avail)S.nextOffer=Date.now()+6000;toast(S.avail?'依頼の受付を始めました':'依頼の受付を止めました')},
 incyes(){const i=issue(S.inc.id);i.who='me';i.route='onsite';i.status='dispatched';i.eta=Math.max(2,Math.ceil((parseInt(i.dist)||200)/80));i.log.push([now(),'あなたがオファーを受諾、現地へ向かっています']);
  S.inc=null;S.sheet=null;S.issueId=i.id;S.screen='detail';S.back='main';S.justDone=false;S.nextOffer=Date.now()+60000;buzz(30);toast('依頼を受けました')},
 incno(a){const i=issue(S.inc.id),k=['suzuki','ogawa','tanaka'].find(x=>!busy(x))||'tanaka';i.who=k;i.route='onsite';i.status='dispatched';i.eta=Math.ceil(CAND.find(c=>c[0]==k)[1]/80)+1;
  i.log.push([now(),`あなたが${a=='auto'?'時間内に応答しなかったため':'見送ったため'}、${nm(i)}へオファー・受諾`]);S.inc=null;S.sheet=null;S.nextOffer=Date.now()+40000;toast('次の候補に回しました')},
 offer(){const free=CAND.filter(c=>!busy(c[0])).map(c=>c[0]);S.of={id:S.issueId,sel:free.slice(0,2),phase:'pick',res:{},left:30};S.screen='offer'},
 ofsel(k){const o=S.of,n=o.sel.indexOf(k);if(n>=0)o.sel.splice(n,1);else o.sel.push(k)},
 ofsend(){const o=S.of,i=issue(o.id);if(!o.sel.length)return false;o.sel.sort((a,b)=>CAND.findIndex(c=>c[0]==a)-CAND.findIndex(c=>c[0]==b));o.phase='wait';o.left=30;o.sel.forEach(k=>o.res[k]='wait');
  const alive=()=>S.of===o&&o.phase=='wait',show=()=>{if(S.screen=='offer'&&S.of===o)render()};
  if(o.sel.length>1)setTimeout(()=>{if(alive()){o.res[o.sel[o.sel.length-1]]='no';show()}},2000);
  setTimeout(()=>{if(!alive())return;const k=o.sel[0],old=i.who;o.sel.forEach(x=>{if(o.res[x]=='wait')o.res[x]='off'});o.res[k]='yes';o.phase='done';
   i.who=k;i.route='onsite';i.status='dispatched';i.eta=Math.max(2,Math.ceil(CAND.find(c=>c[0]==k)[1]/80));
   i.log.push([now(),`${ROLES[S.role][0]}が${o.sel.length}名にオファー、${nm(i)}が受諾${old&&old!=k?'（担当を変更）':''}`]);buzz(30);show()},4200)},
 ofcancel(){S.of.phase='pick';S.of.res={}},

 fusend(){const i=issue(S.issueId),f=S.fu;f.memo=f.memo.trim();i.follow=f;i.status='follow';i.log.push([now(),`別途対応（${f.type}）を${f.to}へ依頼、期限：${f.due}`]);
  postCard('ms','BBB 自動共有',i.id,`「${i.title}」は別途対応が必要です。${f.type}を${f.to}へ依頼しました（期限：${f.due}）。`);
  S.fu=null;S.screen='detail';S.justDone=false;toast('別途対応を依頼しました')},
 addrquick(a){setAddr(a)},
 addrsave(){const el=document.getElementById('addrsheet'),v=el.value.trim();if(!v){el.focus();return false}setAddr(v)},
 georetry(){S.sheet=null;requestGeo();toast('現在地を確認しています')},
 thread(a){S.thread=a;D.threads.find(x=>x.id==a).unread=0;S.screen='thread';S.back='main'},
 tochat(a){S.tab='chat';A.thread(a)},
 quick(a){send(a);return false},
 sheet(a){S.sheet=a},
 closesheet(){S.sheet=null},
 role(a){S.role=a;S.sheet=null;S.sel=null;if(a=='field')S.nextOffer=Date.now()+9000;toast(ROLES[a][0]+'として表示しています')},
 voiceadd(){const x=document.getElementById('voicetext').value.trim();if(!x){document.getElementById('voicetext').focus();return false}
  D.voices.unshift({id:Date.now(),name:S.role=='owner'?'あなた（オーナー）':'オーナー（聞き取り）',bld:'メゾン桜丘',ini:'声',t:now(),st:'open',text:x,scn:S.scn%SCN.length});S.sheet=null;toast('声を記録しました')}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 if(el.dataset.act=='closesheet'&&e.target.closest('[data-stop]'))return;
 const r=A[el.dataset.act](el.dataset.arg);if(r!==false)render()});
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.matches('g[data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id=='chatform'){const i=document.getElementById('chatinput');send(i.value)}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='camfile'&&t.files&&t.files[0]){fileShot(t.files[0]);t.value=''}});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='addrinput'){S.draft.addr=t.value;if(S.draft.err&&t.value.trim()){S.draft.err=false;t.classList.remove('err')}}else if(t.id=='fumemo')S.fu.memo=t.value});
/* real position when the browser allows it; otherwise the address field takes over */
requestGeo();
/* phone back button and back swipe stay inside the app */
let guard=false,skipPop=false;
const atRoot=()=>S.screen=='onb'||S.screen=='main'&&!S.sheet;
function syncHistory(){try{if(!atRoot()&&!guard){history.pushState({app:1},'');guard=true}else if(atRoot()&&guard){guard=false;skipPop=true;history.back()}}catch(_){}}
function appBack(){if(S.sheet){if(S.sheet!='incoming')S.sheet=null;return}
 const m={cam:'camclose',analyze:'camclose',detail:'back',follow:'todetail',thread:'back'};
 if(S.screen=='offer')A[S.of.phase=='pick'?'todetail':'ofcancel']();else if(S.screen=='dispatch')S.screen='main';else if(m[S.screen])A[m[S.screen]]()}
window.addEventListener('popstate',()=>{if(skipPop){skipPop=false;return}guard=false;if(atRoot())return;appBack();render()});
/* keep the layout above the on-screen keyboard */
if(window.visualViewport){const vv=window.visualViewport,app=document.getElementById('app'),fit=()=>{const kb=window.innerHeight-vv.height>120;
 document.documentElement.style.height=kb?vv.height+'px':'';app.classList.toggle('kb',kb);if(kb){window.scrollTo(0,0);const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight}};
 vv.addEventListener('resize',fit)}
/* swipe the home list up and down */
let ty=null;
document.addEventListener('touchstart',e=>{ty=e.target.closest('.grab,#sheethead')?e.touches[0].clientY:null},{passive:true});
document.addEventListener('touchend',e=>{if(ty==null)return;const dy=e.changedTouches[0].clientY-ty;ty=null;if(Math.abs(dy)<24)return;const up=dy<0;if(!!S.up!=up){S.up=up;render()}},{passive:true});
/* live clock: elapsed seconds while searching, and arrival times that count down */
let ticks=0;
setInterval(()=>{ticks++;
 const el=document.getElementById('elapsed');if(el&&S.dspT0)el.textContent=Math.floor((Date.now()-S.dspT0)/1000);
 if(S.inc){S.inc.left--;const a=document.getElementById('incleft'),g=document.getElementById('incring');if(a)a.textContent=Math.max(0,S.inc.left);if(g)g.style.strokeDashoffset=(2*Math.PI*20*(1-S.inc.left/30)).toFixed(1);
  if(S.inc.left<=0){A.incno('auto');render()}}
 else if(S.role=='field'&&S.avail&&S.screen=='main'&&!S.sheet&&S.nextOffer&&Date.now()>S.nextOffer){const i=D.issues.find(x=>x.status=='open'&&!x.offered);
  if(i){i.offered=true;S.inc={id:i.id,left:30};S.sheet='incoming';buzz([40,60,40]);render()}else S.nextOffer=0}
 if(S.of&&S.of.phase=='wait'){S.of.left=Math.max(0,S.of.left-1);const a=document.getElementById('ofleft');if(a)a.textContent=S.of.left}
 if(ticks%6)return;
 let arrived=null;
 D.issues.forEach(i=>{if(!live(i))return;
  if(i.eta>1){i.eta--;
   document.querySelectorAll(`[data-k="eta${i.id}"]`).forEach(e=>{e.dataset.n=i.eta;e.classList.remove('tick');void e.offsetWidth;e.classList.add('tick')});
   document.querySelectorAll(`[data-k="rem${i.id}"]`).forEach(e=>{e.dataset.n=i.eta*70})}
  else{i.eta=0;i.status='working';i.log.push([now(),`${nm(i)}が到着、対応を開始`]);arrived=i}});
 const typing=/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||'');
 if(arrived&&!S.sheet&&!typing&&(S.screen=='main'&&S.tab!='chat'&&S.tab!='voice'||S.screen=='detail')){if(S.screen=='detail'&&S.issueId==arrived.id)toast('担当が到着しました');render()}
 else animate()},1000);
render();
</script>
</body>
</html>
