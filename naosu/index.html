<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>ナオス 修繕リレー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: one phone-sized stage; gold header band, paper body, navy actions, raised camera button in the nav. */
:root{
  --navy:#243B63; --navy-deep:#182A49; --gold:#DDAA5C; --gold-soft:#F6E6C6; --gold-deep:#B9863A;
  --paper:#F5F3EE; --card:#FFFFFF; --ink:#1B2740; --mute:#737D92; --line:#E6E2D8; --stage:#DEDBD3;
  --urgent:#D4452F; --high:#E07F2A; --mid:#C7962F; --low:#5B8C6E; --done:#8A93A6;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"Outfit","Zen Kaku Gothic New",system-ui,sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --r:18px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;display:flex;justify-content:center;align-items:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--gold-deep);outline-offset:2px}
svg{display:block}
.phone{position:relative;width:100%;max-width:430px;height:100%;max-height:900px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:480px) and (min-height:700px){.phone{height:calc(100% - 40px);border-radius:36px;box-shadow:0 30px 60px -20px rgba(24,42,73,.35),0 0 0 10px #fff}}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding-left:var(--gl);padding-right:var(--gr)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{background:var(--gold);color:var(--navy-deep);padding-top:14px;padding-bottom:14px;display:flex;align-items:center;gap:12px}
.top.plain{background:var(--paper)}
.top h1{font-size:17px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:11.5px;font-weight:500;opacity:.8}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn:active{background:rgba(24,42,73,.1)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.avatar.s{width:32px;height:32px;font-size:12px}
.avatar.gold{background:var(--gold);color:var(--navy-deep)}
.rolechip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.45);border-radius:999px;padding:4px 4px 4px 12px;font-size:12px;font-weight:700}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;letter-spacing:.04em;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--gold);color:var(--navy-deep)}
.btn.ghost{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn.light{background:#fff;color:var(--navy)}
.btn.sm{min-height:40px;font-size:13px;width:auto;padding:0 16px;border-radius:12px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.p-urgent{background:var(--urgent)}.p-high{background:var(--high)}.p-mid{background:var(--mid)}.p-low{background:var(--low)}
.st{font-size:11.5px;font-weight:700;color:var(--mute);display:inline-flex;align-items:center;gap:4px}
.st.working{color:var(--navy)}.st.done{color:var(--low)}
.st .ic{width:14px;height:14px}

/* onboarding */
.onb{color:#fff;background:var(--navy);text-align:center;justify-content:space-between;padding-top:20px;padding-bottom:28px;transition:background .35s}
.onb.alt{background:var(--gold);color:var(--navy-deep)}
.onb .art{flex:1;min-height:0;display:grid;place-items:center}
.onb .art svg{width:min(78%,300px);height:auto;max-height:100%}
.onb h2{font-family:var(--f-num);font-size:13px;letter-spacing:.28em;font-weight:600;opacity:.75}
.onb h1{font-size:27px;font-weight:900;margin:8px 0 10px;letter-spacing:.02em}
.onb p{font-size:14px;max-width:30ch;margin:0 auto;opacity:.9}
.dots{display:flex;gap:8px;justify-content:center;margin:22px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.3;transition:all .3s}
.dots i.on{opacity:1;width:22px;border-radius:4px}
.skip{font-size:12.5px;font-weight:700;opacity:.8;align-self:flex-end;padding:8px 4px}

/* map */
.mapwrap{position:relative;flex:1;min-height:200px;background:var(--gold)}
.mapwrap svg.map{position:absolute;inset:0;width:100%;height:100%}
.map .pin{cursor:pointer;transition:transform .2s;transform-box:fill-box;transform-origin:50% 100%}
.map .pin.sel{transform:scale(1.25)}
.pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(.4);opacity:.7}to{transform:scale(2.6);opacity:0}}
.radar{animation:pulse 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.radar.d2{animation-delay:.7s}.radar.d3{animation-delay:1.4s}
.locchip{position:absolute;left:var(--gl);top:12px;background:#fff;border-radius:999px;padding:6px 12px 6px 8px;font-size:11.5px;font-weight:700;display:flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(24,42,73,.18);max-width:calc(100% - 32px)}
.locchip .ic{width:16px;height:16px;color:var(--navy)}
.locchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{background:var(--paper);border-radius:24px 24px 0 0;margin-top:-22px;position:relative;max-height:46%;display:flex;flex-direction:column;box-shadow:0 -8px 24px rgba(24,42,73,.12)}
.sheet::before{content:"";width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 2px;flex:none}
.sheethead{display:flex;align-items:baseline;justify-content:space-between;padding-top:6px;padding-bottom:8px}
.sheethead h2{font-size:15px;font-weight:900}
.sheethead span{font-size:11.5px;color:var(--mute);font-weight:500}
.counts{display:flex;gap:8px;padding-bottom:10px}
.count{flex:1;background:#fff;border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:0;min-width:0}
.count b{font-family:var(--f-num);font-size:22px;line-height:1.1;font-weight:700}
.count span{font-size:10.5px;color:var(--mute);font-weight:700}
.count.u b{color:var(--urgent)}.count.w b{color:var(--navy)}.count.d b{color:var(--low)}

/* issue rows */
.list{display:flex;flex-direction:column;gap:10px;padding-bottom:16px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r);padding:10px;text-align:left;width:100%;transition:transform .12s,background .2s}
.row:active{transform:scale(.985)}
.row.sel{background:var(--navy);color:#fff}
.row.sel .meta,.row.sel .st{color:rgba(255,255,255,.75)}
.thumb{width:58px;height:58px;border-radius:13px;overflow:hidden;flex:none;background:var(--gold-soft)}
.ph{width:100%;height:100%}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .ttl{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.seg{display:flex;background:#fff;border-radius:12px;padding:4px;gap:2px;margin:12px 0}
.seg button{flex:1;height:34px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--navy);color:#fff}
.empty{text-align:center;color:var(--mute);padding:36px 0;font-size:13px}

/* nav */
.nav{flex:none;display:flex;align-items:flex-end;justify-content:space-around;background:#fff;padding:6px var(--gr) 8px var(--gl);border-top:1px solid var(--line);position:relative}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:#B4AFA3;padding:4px 0;position:relative}
.nav button.on{color:var(--navy)}
.nav .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--urgent);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-family:var(--f-num)}
.nav .shoot{flex:none;width:64px;height:64px;border-radius:50%;background:var(--navy);color:#fff;margin:-26px 6px 0;box-shadow:0 0 0 6px #fff,0 10px 20px rgba(24,42,73,.35);justify-content:center;font-size:9.5px;gap:0}
.nav .shoot .ic{width:26px;height:26px}
.nav .shoot:active{transform:scale(.95)}

/* camera */
.cam{background:#0E1626;color:#fff}
.cam .camtop{display:flex;align-items:center;gap:8px;padding-top:10px;padding-bottom:10px}
.cam .step{flex:1;text-align:center}
.cam .step b{display:block;font-size:15px}
.cam .step span{font-size:11.5px;opacity:.7}
.finder{position:relative;flex:1;min-height:0;margin:0 var(--gr) 0 var(--gl);border-radius:22px;overflow:hidden;background:#000}
.finder .ph{position:absolute;inset:0;transition:transform .5s}
.finder.close .ph{transform:scale(1.04)}
.finder .frame{position:absolute;inset:14%;border-radius:10px;pointer-events:none;background:
  linear-gradient(var(--gold),var(--gold)) 0 0/26px 3px, linear-gradient(var(--gold),var(--gold)) 0 0/3px 26px,
  linear-gradient(var(--gold),var(--gold)) 100% 0/26px 3px, linear-gradient(var(--gold),var(--gold)) 100% 0/3px 26px,
  linear-gradient(var(--gold),var(--gold)) 0 100%/26px 3px, linear-gradient(var(--gold),var(--gold)) 0 100%/3px 26px,
  linear-gradient(var(--gold),var(--gold)) 100% 100%/26px 3px, linear-gradient(var(--gold),var(--gold)) 100% 100%/3px 26px;background-repeat:no-repeat}
.finder .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12.5px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.finder .gps{position:absolute;top:12px;left:12px;background:rgba(14,22,38,.65);border-radius:999px;padding:4px 10px;font-size:11px;display:flex;gap:5px;align-items:center}
.finder .gps .ic{width:13px;height:13px;color:var(--gold)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .35s ease-out}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.cambar{display:flex;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:22px}
.slots{display:flex;gap:8px;width:104px}
.slot{width:48px;height:48px;border-radius:10px;border:1.5px dashed rgba(255,255,255,.35);overflow:hidden;display:grid;place-items:center;font-family:var(--f-num);font-size:13px;color:rgba(255,255,255,.5)}
.slot.f{border:2px solid var(--gold)}
.shutter{width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px #0E1626,0 0 0 8px #fff;transition:transform .1s}
.shutter:active{transform:scale(.9)}

/* analyze + dispatch */
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shots>div{aspect-ratio:4/3;border-radius:14px;overflow:hidden;position:relative;background:var(--gold-soft)}
.shots .tag{position:absolute;left:8px;top:8px;background:rgba(24,42,73,.78);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.steps{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.steps li{display:flex;gap:10px;align-items:center;font-weight:500;font-size:13.5px;opacity:.35;animation:stepon .3s ease forwards}
.steps{list-style:none;padding:0}
.steps li .dot{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff;animation:doton .3s ease forwards}
.steps li .dot .ic{width:13px;height:13px;stroke-width:3}
.steps li:nth-child(1),.steps li:nth-child(1) .dot{animation-delay:.4s}
.steps li:nth-child(2),.steps li:nth-child(2) .dot{animation-delay:1s}
.steps li:nth-child(3),.steps li:nth-child(3) .dot{animation-delay:1.6s}
.steps li:nth-child(4),.steps li:nth-child(4) .dot{animation-delay:2.2s}
@keyframes stepon{to{opacity:1}}
@keyframes doton{to{background:var(--low)}}
.reveal{animation:reveal .4s ease 2.6s both}
@keyframes reveal{from{opacity:0;transform:translateY(12px);visibility:hidden}to{opacity:1;transform:none;visibility:visible}}
.card{background:var(--card);border-radius:var(--r);padding:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;font-size:13px}
.kv dt{color:var(--mute);font-size:11.5px;font-weight:700}
.kv dd{margin:0;font-weight:700;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:999px;background:var(--paper);font-size:12px;font-weight:700;color:var(--mute)}
.chip.on{background:var(--navy);color:#fff}
.routebox{display:flex;gap:12px;align-items:center;background:var(--navy);color:#fff;border-radius:var(--r);padding:14px}
.routebox .meta{color:rgba(255,255,255,.75);white-space:normal}
.routebox b{font-size:15px}
.footer{flex:none;padding-top:12px;padding-bottom:16px;background:linear-gradient(to top,var(--paper) 70%,transparent)}
.dsp{position:relative}
.dspcard{position:absolute;left:var(--gl);right:var(--gr);bottom:16px;background:#fff;border-radius:22px;padding:16px;box-shadow:0 12px 30px rgba(24,42,73,.25);animation:in .35s ease both}
.dspcard h2{font-size:17px;font-weight:900;margin-bottom:2px}
.cands{display:flex;margin:12px 0 4px}
.cands .avatar{margin-right:-8px;box-shadow:0 0 0 3px #fff;animation:pop .4s ease both}
.cands .avatar:nth-child(2){animation-delay:.5s}.cands .avatar:nth-child(3){animation-delay:1s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:40%;background:var(--gold);border-radius:2px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.who{display:flex;gap:12px;align-items:center}
.who .body{flex:1;min-width:0}
.who b{display:block;font-size:14.5px}
.eta{text-align:right;flex:none}
.eta b{font-family:var(--f-num);font-size:24px;line-height:1;color:var(--navy)}
.eta span{font-size:10.5px;color:var(--mute);font-weight:700;display:block}
.notify{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.notify span{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border-radius:999px;padding:3px 10px 3px 6px;font-size:11.5px;font-weight:700}
.notify .ic{width:14px;height:14px;color:var(--low);stroke-width:3}

/* detail */
.hero{position:relative;height:210px;flex:none;background:var(--gold-soft)}
.hero .pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:100%}
.hero .pair>div{position:relative;overflow:hidden}
.hero .tag{position:absolute;left:10px;bottom:10px;background:rgba(24,42,73,.78);color:#fff;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.hero .tag.ok{background:var(--low)}
.hero .back{position:absolute;top:10px;left:var(--gl);background:#fff;color:var(--navy);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.dbody{display:flex;flex-direction:column;gap:14px;padding-top:16px;padding-bottom:16px}
.dbody h1{font-size:20px;font-weight:900;line-height:1.35}
.banner{display:flex;gap:10px;align-items:center;background:var(--low);color:#fff;border-radius:var(--r);padding:12px 14px;font-weight:700;font-size:13px}
.minimap{height:150px;border-radius:var(--r);overflow:hidden;position:relative;background:var(--gold)}
.minimap svg{width:100%;height:100%}
.tl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:44px 14px 1fr;gap:10px;font-size:13px;padding-bottom:14px;position:relative}
.tl li time{font-family:var(--f-num);color:var(--mute);font-size:12px;padding-top:1px}
.tl li i{width:10px;height:10px;border-radius:50%;background:var(--navy);margin:5px 2px 0;position:relative;z-index:1}
.tl li:not(:last-child)::after{content:"";position:absolute;left:60px;top:10px;bottom:-5px;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child i{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.sec{font-size:11.5px;font-weight:700;color:var(--mute);letter-spacing:.08em;margin-bottom:8px}

/* chat */
.thread{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.thread .body{flex:1;min-width:0}
.thread b{font-size:14px;display:block}
.thread .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:var(--mute);flex:none}
.unread{min-width:18px;height:18px;border-radius:9px;background:var(--urgent);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 5px;font-family:var(--f-num)}
.msgs{display:flex;flex-direction:column;gap:10px;padding-top:14px;padding-bottom:14px}
.msg{max-width:82%;display:flex;flex-direction:column;gap:2px}
.msg .who2{font-size:10.5px;color:var(--mute);font-weight:700;padding:0 4px}
.msg .bub{background:#fff;border-radius:4px 16px 16px 16px;padding:9px 13px;font-size:13.5px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--navy);color:#fff;border-radius:16px 4px 16px 16px}
.msg.sys{align-self:center;max-width:100%;width:100%}
.msg.sys .row{box-shadow:inset 0 0 0 1.5px var(--line)}
.msg .t{font-size:10px;color:var(--mute);padding:0 4px;font-family:var(--f-num)}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick .chip{background:#fff;color:var(--navy);flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.composer{flex:none;background:var(--paper);padding-top:8px;padding-bottom:12px;border-top:1px solid var(--line)}
.inputrow{display:flex;gap:8px;align-items:center}
.inputrow input{flex:1;min-width:0;height:44px;border-radius:22px;border:0;background:#fff;padding:0 16px;font:inherit;font-size:16px;color:var(--ink)}
.send{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}

/* voices */
.voice{background:#fff;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.voice .head{display:flex;gap:10px;align-items:center}
.voice .head .body{flex:1;min-width:0}
.voice q{quotes:none;font-size:14px;font-weight:500;line-height:1.65}
.voice .acts{display:flex;gap:8px;flex-wrap:wrap}
.vst{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold-deep);white-space:nowrap}
.vst.open{background:#FBE3DE;color:var(--urgent)}.vst.ok{background:#E1EEE5;color:var(--low)}

/* overlay sheet + toast */
.ovl{position:absolute;inset:0;background:rgba(24,42,73,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--paper);width:100%;border-radius:24px 24px 0 0;padding-top:20px;padding-bottom:24px;animation:up .28s ease both;max-height:86%;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

function postCard(tid,from,id,text){const t=D.threads.find(x=>x.id==tid);t.msgs.push({f:from,t:now(),sys:true,card:id});if(text)t.msgs.push({f:from,t:now(),x:text});t.unread++}
function send(text){const t=D.threads.find(x=>x.id==S.thread);text=text.trim();if(!text)return;
 t.msgs.push({me:true,f:ROLES[S.role][0],t:now(),x:text});render();
 const id=t.id;setTimeout(()=>{t.msgs.push({f:t.reply[0],t:now(),x:t.reply[1]});if(S.screen=='thread'&&S.thread==id){const v=document.getElementById('chatinput').value;render();document.getElementById('chatinput').value=v}else{t.unread++;if(S.screen=='main')render()}},1500)}
const A={
 onbnext(){if(S.onb<2)S.onb++;else A.start()},
 start(){S.screen='main';S.tab='map'},
 tab(a){S.tab=a;S.sel=null;S.screen='main'},
 pin(a){S.sel=S.sel==a?null:+a},
 filter(a){S.filter=a},
 open(a){S.issueId=+a;S.back=S.screen=='thread'?'thread':'main';S.screen='detail';S.justDone=false},
 back(){if(S.screen=='detail'&&S.back=='thread')S.screen='thread';else S.screen='main'},
 report(a,voiceId){const s=SCN[S.scn%SCN.length];S.cam={mode:'report',s,shots:[],voice:voiceId||null};S.screen='cam'},
 voicecase(a){const v=D.voices.find(x=>x.id==a);S.scn=v.scn||0;A.report(null,v.id)},
 camclose(){S.screen=S.cam&&S.cam.mode=='done'?'detail':'main';S.cam=null;S.draft=null},
 shutter(){const c=S.cam;if(c.busy)return;c.busy=true;const f=document.getElementById('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  setTimeout(()=>{c.busy=false;
   if(c.mode=='report'){c.shots.push(c.s.key+(c.shots.length?'_b':'_w'));if(c.shots.length==2){S.draft={s:c.s,shots:c.shots,pri:c.s.pri,cat:c.s.cat,voice:c.voice};S.screen='analyze'}}
   else{const i=issue(c.id);i.status='done';i.after=c.after;i.log.push([now(),`${PPL[i.who].n}${i.route=='mgmt'?'':'さん'}が完了写真を送信、管理・営業・オーナーへ共有`]);
    postCard('ms','ナオス 自動共有',i.id,`「${i.title}」が完了しました。Before / After を確認できます。`);
    const v=D.voices.find(x=>x.issue==i.id);if(v){v.st='done';const t=D.threads.find(x=>x.id=='ow');if(v.thread)postCard(v.thread,'ナオス 自動共有',i.id)}
    S.cam=null;S.screen='detail';S.justDone=true;toast('完了を共有しました')}
   render()},320);return false},
 setpri(a){S.draft.pri=a},
 setcat(a){S.draft.cat=a},
 submit(){const d=S.draft,s=d.s,id=seq++;
  D.issues.push({id,key:s.key,title:s.title,cat:d.cat,pri:d.pri,bld:s.bld,place:s.place,x:s.x,y:s.y,dist:s.dist,status:'dispatched',who:s.who,eta:s.eta,route:s.route,shots:d.shots,after:null,time:now(),
   log:[[now(),`${ROLES[S.role][0]}が写真2枚で報告`],[now(),`優先度「${PRI[d.pri].l}」と判定、${s.route=='mgmt'?'管理へ差配':'近くの'+PPL[s.who].r+'へ差配'}`]]});
  if(d.voice){const v=D.voices.find(x=>x.id==d.voice);v.st='prog';v.issue=id}
  S.scn++;S.issueId=id;S.draft=null;S.cam=null;S.dsp=0;S.screen='dispatch';
  setTimeout(()=>{const i=issue(id);i.log.push([now(),i.route=='mgmt'?`管理 山田さんが${PPL[i.who].n}を手配`:`${PPL[i.who].n}さんが受諾`]);postCard('sk','ナオス 自動共有',id);if(S.screen=='dispatch'&&S.issueId==id){S.dsp=1;render()}},3200)},
 begin(){const i=issue(S.issueId);i.status='working';i.log.push([now(),`${PPL[i.who].n}${i.route=='mgmt'?'':'さん'}が現地へ向かっています`]);toast('対応を始めました')},
 finish(){const i=issue(S.issueId);S.cam={mode:'done',id:i.id,after:({trash:'trash_a',rail:'rail_a',win:'win_a',light:'light_a'})[i.key],shots:[]};S.screen='cam'},
 thread(a){S.thread=a;D.threads.find(x=>x.id==a).unread=0;S.screen='thread';S.back='main'},
 tochat(a){S.tab='chat';A.thread(a)},
 quick(a){send(a);return false},
 sheet(a){S.sheet=a},
 closesheet(){S.sheet=null},
 role(a){S.role=a;S.sheet=null;toast(ROLES[a][0]+'として表示しています')},
 voiceadd(){const x=document.getElementById('voicetext').value.trim();if(!x){document.getElementById('voicetext').focus();return false}
  D.voices.unshift({id:Date.now(),name:S.role=='owner'?'あなた（オーナー）':'オーナー（聞き取り）',bld:'メゾン桜丘',ini:'声',t:now(),st:'open',text:x,scn:S.scn%SCN.length});S.sheet=null;toast('声を記録しました')}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 if(el.dataset.act=='closesheet'&&e.target.closest('[data-stop]'))return;
 const r=A[el.dataset.act](el.dataset.arg);if(r!==false)render()});
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.matches('g[data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id=='chatform'){const i=document.getElementById('chatinput');send(i.value)}});
/* real position when the browser allows it; otherwise the demo address stays */
try{navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{S.loc=`現在地 ${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}`;if(S.screen=='main'&&S.tab=='map'&&!S.sheet)render()},()=>{}, {timeout:5000})}catch(_){}
render();
</script>
</body>
</html>
