<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHENOMENA — 世界のしくみを、触って理解する。</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PHENOMENA — v8 Visual System
   Cute × Scientific × Tactile
   paper / forest / gold  —  a tiny science museum
   ============================================================ */
:root{
  --ink:#1f2b26; --ink-soft:#4a5750; --ink-muted:#768078;
  --paper:#f6f4ee; --paper-deep:#eeeade;
  --surface:#ffffff; --surface-soft:#fbfaf6; --surface-float:rgba(255,255,255,.92);
  --line:#d8d4c6; --line-soft:rgba(31,43,38,.10);
  --forest:#2e5c4c; --forest-deep:#1c3e33; --forest-soft:rgba(46,92,76,.08);
  --gold:#b8912f; --gold-soft:rgba(184,145,47,.12);
  --danger:#9a4d44; --warning:#9a7631;

  /* universe accents — 10-20% of surface only */
  --u-chaos:#c9705f; --u-attractor:#6b6fa8; --u-maps:#b8873f; --u-random:#c7a83c;
  --u-life:#6f8f5a; --u-waves:#7ba3b8;

  --shadow-1:0 2px 8px rgba(31,43,38,.06);
  --shadow-2:0 8px 28px rgba(31,43,38,.10);
  --shadow-3:0 18px 48px rgba(31,43,38,.14);

  --type-hero:clamp(30px,5vw,68px);
  --type-h1:clamp(26px,3.4vw,34px);
  --type-h2:24px; --type-h3:17px;
  --type-body:14px; --type-small:12px; --type-micro:10.5px;

  --r-card:18px; --r-ctrl:8px; --r-modal:22px;
  --hdr:58px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Noto Sans JP',system-ui,sans-serif;
  color:var(--ink); background:var(--paper);
  font-size:var(--type-body); line-height:1.7;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; height:100%; overflow:hidden;
}
body::before{ /* warm paper grain */
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(46,92,76,.05), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(184,145,47,.06), transparent 55%);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
.serif{font-family:'Noto Serif JP',serif}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;border:2px solid var(--paper)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- header ---------- */
header#topbar{
  position:relative; z-index:20; flex:0 0 auto; height:var(--hdr);
  display:flex; align-items:center; gap:16px; padding:0 18px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand .mark{width:26px;height:26px;flex:0 0 auto;overflow:visible}
.brand .mark .arm{transform-origin:13px 3px; animation:swing 3.6s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-17deg)}50%{transform:rotate(17deg)}}
.brand b{font-family:'Noto Serif JP',serif;font-size:16px;color:var(--forest-deep);letter-spacing:.06em}
.brand small{display:block;font-size:9.5px;letter-spacing:.18em;color:var(--gold);font-weight:600;line-height:1}
.navlinks{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.navlinks::-webkit-scrollbar{display:none}
.navlink{
  font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;
  padding:7px 14px;border-radius:999px;border:1px solid transparent;transition:all .16s;
}
.navlink:hover{border-color:var(--line);color:var(--forest)}
.navlink.on{background:var(--forest);border-color:var(--forest);color:#fff}
.hdr-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}

/* ---------- generic pills / buttons ---------- */
.pill{
  font-size:11.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;
  padding:6px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);transition:all .14s;
}
.pill:hover{border-color:var(--forest);color:var(--forest);transform:translateY(-1px)}
.pill.on{background:var(--forest);border-color:var(--forest);color:#fff}
.pill.gold.on{background:var(--gold);border-color:var(--gold)}
.pill:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-solid{
  font-size:13px;font-weight:600;color:#fff;background:var(--forest);
  border:1px solid var(--forest);border-radius:999px;padding:10px 24px;transition:all .16s;
}
.btn-solid:hover{background:var(--forest-deep);transform:translateY(-1px);box-shadow:var(--shadow-2)}
.btn-ghost{
  font-size:13px;font-weight:600;color:var(--forest);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:10px 24px;transition:all .16s;
}
.btn-ghost:hover{border-color:var(--forest);background:var(--forest-soft)}

/* ---------- scroll page ---------- */
main#app{flex:1;min-height:0;position:relative;z-index:1;display:flex;flex-direction:column}
.page{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* ---------- HOME ---------- */
.hero{position:relative;padding:54px 0 30px}
.hero-grid{display:grid;grid-template-columns:1fr 420px;gap:36px;align-items:center}
.hero h1{
  font-family:'Noto Serif JP',serif;font-size:var(--type-hero);line-height:1.26;
  color:var(--forest-deep);letter-spacing:.01em;font-weight:600;
}
.hero h1 .ln{display:block;white-space:nowrap}
.hero h1 .tint{color:var(--gold)}
.hero .lede{margin-top:18px;color:var(--ink-soft);font-size:15px;max-width:34em}
.hero .cta{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.hero-stage{
  position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-card);box-shadow:var(--shadow-2);overflow:hidden;aspect-ratio:1/1;
}
.hero-stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hero-stage canvas:active{cursor:grabbing}
.stage-tag{
  position:absolute;left:14px;top:12px;font-size:10.5px;letter-spacing:.14em;
  font-weight:600;color:var(--gold);
}
.stage-hint{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  font-size:11px;color:var(--ink-muted);background:var(--surface-float);
  border:1px solid var(--line);border-radius:999px;padding:5px 14px;
  backdrop-filter:blur(6px);white-space:nowrap;
}
.hero-stage .swing-badge{
  position:absolute;right:12px;top:12px;font-size:10.5px;font-weight:600;
  color:var(--forest);background:var(--forest-soft);border-radius:999px;padding:4px 10px;
}

.sec{padding:44px 0}
.sec-label{
  font-size:10.5px;letter-spacing:.2em;font-weight:600;color:var(--gold);margin-bottom:14px;
}
.sec h2{font-family:'Noto Serif JP',serif;font-size:var(--type-h2);color:var(--forest-deep);margin-bottom:6px}
.sec p.sub{color:var(--ink-soft);font-size:13px;margin-bottom:22px}

/* question cards */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.qcard{
  display:flex;flex-direction:column;justify-content:space-between;gap:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:18px 18px 15px;min-height:132px;transition:all .2s;text-align:left;
}
.qcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--forest)}
.qcard .q{font-family:'Noto Serif JP',serif;font-size:16px;color:var(--forest-deep);line-height:1.55}
.qcard .go{font-size:11px;color:var(--ink-muted);display:flex;align-items:center;gap:6px}
.qcard:hover .go{color:var(--forest)}
.qcard .go .arw{transition:transform .2s}
.qcard:hover .go .arw{transform:translateX(4px)}

/* live phenomenon cards */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:18px}
.pcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  overflow:hidden;transition:all .22s;display:flex;flex-direction:column;text-align:left;
}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-2);border-color:var(--forest)}
.pcard .prev{
  position:relative;aspect-ratio:16/11;background:var(--surface-soft);
  border-bottom:1px solid var(--line);overflow:hidden;
}
.pcard .prev canvas{display:block;width:100%;height:100%}
.pcard .live{
  position:absolute;right:10px;top:9px;font-size:9px;letter-spacing:.14em;font-weight:600;
  color:var(--forest);background:var(--surface-float);border-radius:999px;padding:3px 8px;
  display:flex;align-items:center;gap:5px;
}
.pcard .live i{width:5px;height:5px;border-radius:50%;background:var(--u-chaos);animation:blip 1.6s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.pcard .body{padding:14px 16px 16px}
.pcard h3{font-family:'Noto Serif JP',serif;font-size:16px;color:var(--forest-deep);line-height:1.4}
.pcard .en{font-size:10.5px;letter-spacing:.1em;color:var(--ink-muted);margin-top:2px}
.pcard .hook{font-size:12px;color:var(--ink-soft);margin-top:9px;line-height:1.65;min-height:2.6em}
.tagrow{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap}
.tag{
  font-size:9.5px;letter-spacing:.1em;font-weight:600;padding:3px 8px;border-radius:999px;
  background:var(--paper-deep);color:var(--ink-soft);
}
.tag.acc{background:var(--acc-soft,var(--forest-soft));color:var(--acc,var(--forest))}
.pcard .try{
  margin-top:12px;font-size:11.5px;font-weight:600;color:var(--forest);
  opacity:0;transform:translateY(3px);transition:all .2s;
}
.pcard:hover .try{opacity:1;transform:none}

/* universes strip */
.ustrip{display:flex;gap:9px;flex-wrap:wrap}
.uchip{
  font-size:11.5px;font-weight:600;padding:8px 15px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  display:flex;align-items:center;gap:8px;transition:all .16s;
}
.uchip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.uchip:hover{border-color:var(--forest);transform:translateY(-2px)}
.uchip.soon{opacity:.45}

/* surprise */
.surprise{
  background:linear-gradient(135deg,var(--forest-deep),var(--forest));
  border-radius:var(--r-card);padding:34px 32px;color:#f3f1e9;
  display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;
  box-shadow:var(--shadow-2);position:relative;overflow:hidden;
}
.surprise::after{
  content:'';position:absolute;right:-40px;bottom:-70px;width:230px;height:230px;
  border-radius:50%;background:rgba(184,145,47,.18);
}
.surprise h2{font-family:'Noto Serif JP',serif;font-size:26px;color:#fff;margin-bottom:6px}
.surprise p{font-size:13px;opacity:.82;max-width:36em}
.surprise .btn-solid{background:var(--gold);border-color:var(--gold);position:relative;z-index:1}
.surprise .btn-solid:hover{background:#a37f24}

footer.foot{
  border-top:1px solid var(--line);margin-top:20px;padding:26px 0 40px;
  color:var(--ink-muted);font-size:11.5px;
}
footer.foot b{color:var(--forest);font-weight:600}

/* ---------- EXPLORE ---------- */
.exp-head{padding:34px 0 20px}
.exp-head h1{font-family:'Noto Serif JP',serif;font-size:var(--type-h1);color:var(--forest-deep)}
.searchbar{
  display:flex;align-items:center;gap:10px;margin-top:18px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 18px;
  max-width:460px;transition:border-color .16s;
}
.searchbar:focus-within{border-color:var(--forest)}
.searchbar input{border:none;outline:none;background:none;flex:1;font-size:13px;min-width:0}
.filters{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frow .flabel{font-size:10.5px;letter-spacing:.14em;font-weight:600;color:var(--gold);width:78px;flex:0 0 auto}
.emptynote{padding:40px 0;color:var(--ink-muted);font-size:13px;text-align:center}

/* soon (catalog) cards */
.soongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px;padding-bottom:16px}
.scard{
  background:var(--surface);border:1px dashed var(--line);border-radius:14px;
  padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-height:88px;
}
.scard b{font-size:13px;color:var(--ink-soft);font-weight:600;line-height:1.45}
.scard small{font-size:10px;color:var(--ink-muted);letter-spacing:.04em;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.scard code{font-family:inherit;background:var(--paper-deep);border-radius:4px;padding:1px 5px}
.scard .sbadge{align-self:flex-start;font-size:9px;letter-spacing:.14em;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:2.5px 8px}
.udot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.fchips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.fchips .pill{display:inline-flex;align-items:center;gap:6px}
.uchip .ucnt{font-size:9.5px;letter-spacing:.08em;color:var(--ink-muted);font-weight:600}
.uchip .uext{font-size:8.5px;letter-spacing:.12em;color:#8a6fb8;background:rgba(138,111,184,.12);border-radius:999px;padding:2px 6px;font-weight:700}
.uchip.soon{opacity:.75}

/* ---------- LAB ---------- */
.lab{flex:1;display:flex;flex-direction:column;min-height:0}
.labbar{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:9px 18px;
  background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.labbar .back{font-size:12px;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:6px}
.labbar .back:hover{color:var(--forest)}
.labtitle{display:flex;align-items:baseline;gap:9px;flex:1;min-width:0}
.labtitle h1{font-family:'Noto Serif JP',serif;font-size:16px;color:var(--forest-deep);white-space:nowrap}
.labtitle span{font-size:10.5px;letter-spacing:.1em;color:var(--ink-muted);white-space:nowrap}
.labtabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.labtabs::-webkit-scrollbar{display:none}

.labmain{flex:1;display:flex;min-height:0}
aside.panel{
  width:284px;flex:0 0 auto;overflow-y:auto;background:var(--surface);
  border-right:1px solid var(--line);padding:16px 16px 30px;
}
aside.panel.right{width:330px;border-right:none;border-left:1px solid var(--line)}
.psec{margin-bottom:22px}
.psec>h3{
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--forest);
  font-weight:600;margin-bottom:11px;padding-bottom:6px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
}
.psec>h3 em{font-style:normal;color:var(--ink-muted);letter-spacing:.06em;font-weight:500;text-transform:none;font-size:10px}
.pnote{font-size:11px;color:var(--ink-muted);line-height:1.7;margin-top:8px}

.presets{display:flex;flex-direction:column;gap:6px}
.preset{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-ctrl);
  font-size:12.5px;transition:all .13s;text-align:left;width:100%;
}
.preset:hover{border-color:var(--forest);transform:translateX(2px)}
.preset.on{border-color:var(--forest);background:var(--forest-soft);font-weight:600}
.preset em{font-style:normal;font-size:10.5px;color:var(--gold);font-weight:600;white-space:nowrap}

.slider-row{margin-bottom:13px}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;margin-bottom:3px}
.sl-top .lb{color:var(--ink-soft);font-weight:600}
.sl-top .lb i{font-style:italic;font-family:'Noto Serif JP',serif;color:var(--forest);margin-right:4px}
.sl-top .vl{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.sl-top .vl small{color:var(--ink-muted);font-weight:400;margin-left:2px}
input[type=range]{
  width:100%;accent-color:var(--forest);height:20px;cursor:pointer;
}
.sl-warn{font-size:10px;color:var(--warning);margin-top:2px}

.segrow{display:flex;gap:5px;flex-wrap:wrap}
.metrics{display:flex;flex-direction:column;gap:6px}
.metric{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  background:var(--surface-soft);border:1px solid var(--line-soft);border-radius:10px;
  padding:7px 12px;font-size:11.5px;
}
.metric .mk{color:var(--ink-muted);letter-spacing:.06em}
.metric .mv{font-weight:600;font-variant-numeric:tabular-nums;color:var(--forest-deep)}
.metric.hot .mv{color:var(--u-chaos)}

#viewport{flex:1;position:relative;min-width:0;background:var(--paper);overflow:hidden}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none}
.vp-badge{
  position:absolute;left:16px;top:14px;z-index:3;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
}
.vp-badge .bd{
  font-size:10px;letter-spacing:.1em;font-weight:600;color:var(--ink-muted);
  background:var(--surface-float);border:1px solid var(--line);border-radius:999px;padding:3px 10px;
  backdrop-filter:blur(6px);
}
.vp-badge .bd.acc{color:var(--acc);border-color:var(--acc)}
.bfly{
  position:absolute;right:16px;top:14px;z-index:3;background:var(--surface-float);
  border:1px solid var(--gold);border-radius:14px;padding:9px 13px;backdrop-filter:blur(6px);
  box-shadow:var(--shadow-1);min-width:186px;
}
.bfly .bt{font-size:10px;letter-spacing:.14em;font-weight:600;color:var(--gold);display:flex;gap:6px;align-items:center}
.bfly .bt .w{display:inline-block;animation:flutter 1.1s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-3px) rotate(6deg)}}
.bfly .bv{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--forest-deep);margin-top:3px}
.bfly .bs{font-size:10px;color:var(--ink-muted);margin-top:1px}
.bfly .spark{display:flex;align-items:flex-end;gap:2px;height:22px;margin-top:6px}
.bfly .spark i{flex:1;background:var(--gold-soft);border-radius:1px;min-height:1px}
.bfly .spark i.hi{background:var(--gold)}

.toolbar{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;
  display:flex;align-items:center;gap:6px;flex-wrap:nowrap;justify-content:flex-start;
  background:var(--surface-float);border:1px solid var(--line);border-radius:999px;
  padding:7px 12px;backdrop-filter:blur(8px);box-shadow:var(--shadow-2);
  width:max-content;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;
}
.toolbar::-webkit-scrollbar{display:none}
.toolbar .pill{padding:6px 11px}
.tsep{width:1px;height:18px;background:var(--line);flex:0 0 auto}
.tlabel{font-size:10px;letter-spacing:.12em;color:var(--ink-muted);font-weight:600}
.playbtn{
  width:36px;height:36px;border-radius:50%;background:var(--forest);color:#fff;
  display:flex;align-items:center;justify-content:center;transition:all .16s;flex:0 0 auto;
}
.playbtn:hover{background:var(--forest-deep);transform:scale(1.06)}

/* discover panel */
.learn-block{margin-bottom:16px}
.learn-block .lk{
  font-size:10px;letter-spacing:.18em;font-weight:600;color:var(--gold);margin-bottom:5px;
}
.learn-block .lv{font-size:12.5px;color:var(--ink-soft);line-height:1.8}
.learn-block .lv.big{
  font-family:'Noto Serif JP',serif;font-size:15px;color:var(--forest-deep);line-height:1.75;
}
.learn-block ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.learn-block li{
  font-size:12.5px;color:var(--ink-soft);line-height:1.7;padding-left:16px;position:relative;
}
.learn-block li::before{
  content:'';position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;
  background:var(--acc,var(--forest));
}
.eqbox{
  background:var(--surface-soft);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;font-family:'Noto Serif JP',serif;font-size:13.5px;color:var(--forest-deep);
  line-height:2;overflow-x:auto;
}
.eqbox i{font-style:italic}
details.disclosure{border-top:1px dashed var(--line);padding-top:10px;margin-top:12px}
details.disclosure summary{

<script>
"use strict";
/* ============================================================================
 * PHENOMENA — Visible Alpha prototype
 *   P02 Double Pendulum / A01 Lorenz / M01 Logistic Map / R02 Random Walk
 *
 * Architecture notes
 *   - simulation and rendering are separated:
 *       World.step(dt) advances physics on a FIXED timestep only.
 *       Lab.draw(...) reads state and never mutates it.
 *   - all randomness goes through SeededRNG (never Math.random) so that
 *       same seed + same params + same step count => same state.
 *   - controls are generated from each lab's `params` manifest.
 *   - state serialization is deterministic (sorted keys) and lives in the URL.
 * ========================================================================== */

/* ---------------------------------------------------------------- utilities */
const $ = (sel, root) => (root || document).querySelector(sel);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

function fmt(v, d) {
  if (!isFinite(v)) return '—';
  const n = d == null ? 3 : d;
  if (Math.abs(v) >= 1e5 || (v !== 0 && Math.abs(v) < 1e-4)) return v.toExponential(2);
  return v.toFixed(n);
}

/* deterministic PRNG (mulberry32) — the project SeededRNG */
function SeededRNG(seed) {
  let a = (seed >>> 0) || 1;
  return {
    seed: seed >>> 0,
    next() {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    int(n) { return Math.floor(this.next() * n); }
  };
}

/* deterministic serialization: keys always sorted, numbers rounded stably */
function serialize(obj) {
  const keys = Object.keys(obj).sort();
  const out = {};
  for (const k of keys) {
    const v = obj[k];
    out[k] = typeof v === 'number' ? +v.toPrecision(12) : v;
  }
  return JSON.stringify(out);
}
function encodeState(o) {
  try { return btoa(unescape(encodeURIComponent(serialize(o)))).replace(/=+$/, ''); }
  catch (e) { return ''; }
}
function decodeState(s) {
  try { return JSON.parse(decodeURIComponent(escape(atob(s)))); }
  catch (e) { return null; }
}

/* canvas sizing with device pixel ratio */
function fitCanvas(cv) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width * dpr));
  const h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: r.width, h: r.height };
}

/* one global animation driver; every view registers a ticker */
const tickers = new Set();
let lastT = 0;
function loop(t) {
  const dt = lastT ? Math.min((t - lastT) / 1000, 0.25) : 0;
  lastT = t;
  tickers.forEach(fn => { try { fn(dt); } catch (e) { console.error(e); } });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function clearTickers() { tickers.clear(); }

function toast(msg) {
  const t = el('div', 'toast', msg);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

/* =========================================================================
 * SIMULATION CLOCK — fixed step, render decoupled
 * ======================================================================= */
class Clock {
  constructor(fixedDt, scale) {
    this.fixedDt = fixedDt;
    this.speed = 1;
    /* how many units of simulation time pass per real second at 1× */
    this.scale = scale || 1;
    this.running = false;
    this.acc = 0;
    this.maxSubsteps = 2000;
  }
  /* returns how many fixed steps to advance for a real frame delta */
  substeps(frameDt) {
    if (!this.running) return 0;
    this.acc += Math.min(frameDt, 0.1) * this.speed * this.scale;   // clamp after tab stalls
    let n = Math.floor(this.acc / this.fixedDt);
    if (n > this.maxSubsteps) { n = this.maxSubsteps; this.acc = 0; }
    else this.acc -= n * this.fixedDt;
    return n;
  }
}

/* =========================================================================
 * P02 — DOUBLE PENDULUM   (engine: ode-rigidbody, solver RK4, dt = 1/240)
 * ======================================================================= */
function dpDeriv(s, p) {
  const { m1, m2, l1, l2, g, damping } = p;
  const [t1, t2, w1, w2] = s;
  const d = t1 - t2;
  const den = 2 * m1 + m2 - m2 * Math.cos(2 * t1 - 2 * t2);
  const a1 = (-g * (2 * m1 + m2) * Math.sin(t1)
              - m2 * g * Math.sin(t1 - 2 * t2)
              - 2 * Math.sin(d) * m2 * (w2 * w2 * l2 + w1 * w1 * l1 * Math.cos(d)))
             / (l1 * den) - damping * w1;
  const a2 = (2 * Math.sin(d) * (w1 * w1 * l1 * (m1 + m2)
              + g * (m1 + m2) * Math.cos(t1)
              + w2 * w2 * l2 * m2 * Math.cos(d)))
             / (l2 * den) - damping * w2;
  return [w1, w2, a1, a2];
}
function rk4(state, p, dt, deriv) {
  const n = state.length, k1 = deriv(state, p), tmp = new Array(n);
  for (let i = 0; i < n; i++) tmp[i] = state[i] + k1[i] * dt / 2;
  const k2 = deriv(tmp, p);
  for (let i = 0; i < n; i++) tmp[i] = state[i] + k2[i] * dt / 2;
  const k3 = deriv(tmp, p);
  for (let i = 0; i < n; i++) tmp[i] = state[i] + k3[i] * dt;
  const k4 = deriv(tmp, p);
  const out = new Array(n);
  for (let i = 0; i < n; i++)
    out[i] = state[i] + (dt / 6) * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]);
  return out;
}
function dpEnergy(s, p) {
  const { m1, m2, l1, l2, g } = p;
  const [t1, t2, w1, w2] = s;
  const v1 = l1 * w1, v2 = l2 * w2;
  const ke = 0.5 * m1 * v1 * v1
           + 0.5 * m2 * (v1 * v1 + v2 * v2 + 2 * v1 * v2 * Math.cos(t1 - t2));
  const pe = -(m1 + m2) * g * l1 * Math.cos(t1) - m2 * g * l2 * Math.cos(t2);
  return { ke, pe, total: ke + pe };
}
class PendulumWorld {
  constructor(p, init) {
    this.p = Object.assign({}, p);
    this.s = [init.t1, init.t2, init.w1, init.w2];
    this.t = 0;
    this.trail = [];
    this.maxTrail = 900;
  }
  step(dt) {
    this.s = rk4(this.s, this.p, dt, dpDeriv);
    this.t += dt;
  }
  tip() {
    const { l1, l2 } = this.p, [t1, t2] = this.s;
    const x1 = l1 * Math.sin(t1), y1 = l1 * Math.cos(t1);
    return { x1, y1, x2: x1 + l2 * Math.sin(t2), y2: y1 + l2 * Math.cos(t2) };
  }
  record() {
    const t = this.tip();
    this.trail.push(t.x2, t.y2);
    if (this.trail.length > this.maxTrail * 2) this.trail.splice(0, 2);
  }
}

/* =========================================================================
 * A01 — LORENZ ATTRACTOR   (engine: ode, solver RK4, dt = 0.005)
 * ======================================================================= */
function lorenzDeriv(s, p) {
  const [x, y, z] = s;
  return [p.sigma * (y - x), x * (p.rho - z) - y, x * y - p.beta * z];
}
class LorenzWorld {
  constructor(p, init) {
    this.p = Object.assign({}, p);
    this.s = [init.x, init.y, init.z];
    this.t = 0;
    this.trail = [];
    this.maxTrail = 6000;
  }
  step(dt) {
    this.s = rk4(this.s, this.p, dt, lorenzDeriv);
    this.t += dt;
    this.trail.push(this.s[0], this.s[1], this.s[2]);
    if (this.trail.length > this.maxTrail * 3) this.trail.splice(0, 3);
  }
  speed() {
    const d = lorenzDeriv(this.s, this.p);
    return Math.hypot(d[0], d[1], d[2]);
  }
}

/* =========================================================================
 * M01 — LOGISTIC MAP   (engine: discrete-map)
 * ======================================================================= */
function logisticIterate(x, r, n) {
  for (let i = 0; i < n; i++) x = r * x * (1 - x);
  return x;
}
class LogisticWorld {
  constructor(p, init) {
    this.p = Object.assign({}, p);
    this.x = init.x0;
    this.x0 = init.x0;
    this.n = 0;
    this.hist = [init.x0];
    this.maxHist = 4000;
  }
  step() {
    this.x = this.p.r * this.x * (1 - this.x);
    this.n++;
    this.hist.push(this.x);
    if (this.hist.length > this.maxHist) this.hist.shift();
  }
}

/* =========================================================================
 * R02 — 2D RANDOM WALK   (engine: monte-carlo-particle, seeded lattice walk)
 * ======================================================================= */
class WalkWorld {
  constructor(p, init) {
    this.p = Object.assign({}, p);
    this.seed = init.seed;
    this.reseed();
  }
  reseed() {
    const n = this.p.walkerCount;
    this.rng = SeededRNG(this.seed);
    this.pos = new Float32Array(n * 2);
    this.step_ = 0;
    this.trail = [];
    this.msd = [];
    this.dirCount = [0, 0, 0, 0];
  }
  step() {
    const n = this.p.walkerCount, L = this.p.stepLength, pos = this.pos;
    for (let i = 0; i < n; i++) {
      const d = this.rng.int(4);
      this.dirCount[d]++;
      if (d === 0) pos[i * 2 + 1] += L;
      else if (d === 1) pos[i * 2 + 1] -= L;
      else if (d === 2) pos[i * 2] -= L;
      else pos[i * 2] += L;
    }
    this.step_++;
    this.trail.push(pos[0], pos[1]);
    if (this.trail.length > 12000) this.trail.splice(0, 2);
    if (this.step_ % 2 === 0 || this.step_ < 40) {
      this.msd.push(this.step_, this.stats().msd);
      if (this.msd.length > 3000) this.msd.splice(0, 2);
    }
  }
  stats() {
    const n = this.p.walkerCount, pos = this.pos;
    let mx = 0, my = 0, m2 = 0;
    for (let i = 0; i < n; i++) {
      const x = pos[i * 2], y = pos[i * 2 + 1];
      mx += x; my += y; m2 += x * x + y * y;
    }
    return { mx: mx / n, my: my / n, msd: m2 / n, rms: Math.sqrt(m2 / n) };
  }
}

/* =========================================================================
 * DRAWING — pure functions of state (never mutate the simulation)
 * ======================================================================= */
const COLORS = ['#2e5c4c', '#c9705f', '#b8912f', '#6b6fa8', '#6f8f5a', '#7ba3b8'];
function worldColor(i, n) {
  if (n <= COLORS.length) return COLORS[i % COLORS.length];
  const h = 150 + (i / n) * 190;
  return `hsl(${h},34%,46%)`;
}
function bg(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#f6f4ee'; ctx.fillRect(0, 0, w, h);
}
function grid(ctx, w, h, step) {
  ctx.strokeStyle = 'rgba(31,43,38,.05)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = (w / 2) % step; x < w; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  for (let y = (h / 2) % step; y < h; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke();
}
function axisLabel(ctx, text, x, y) {
  ctx.fillStyle = '#768078';
  ctx.font = '600 10px "Noto Sans JP",sans-serif';
  ctx.fillText(text, x, y);
}

/* -------- P02 draw ------------------------------------------------------ */
LABS.P02.draw = function (ctx, w, h, worlds, ui) {
  bg(ctx, w, h);
  if (ui.view === 'phase') return drawPendulumPhase(ctx, w, h, worlds);
  if (ui.view === 'energy') return drawPendulumEnergy(ctx, w, h, worlds);
  grid(ctx, w, h, 34);
  const span = worlds[0].p.l1 + worlds[0].p.l2;
  const sc = Math.min(w, h) / (2.35 * span);
  const cx = w / 2, cy = h * 0.34;
  /* pivot */
  ctx.fillStyle = '#d8d4c6';
  ctx.beginPath(); ctx.arc(cx, cy, 6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#b8912f';
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, TAU); ctx.fill();

  for (let k = worlds.length - 1; k >= 0; k--) {
    const wd = worlds[k], col = worldColor(k, worlds.length);
    const primary = k === 0;
    const alpha = primary ? 1 : Math.max(.22, 1 - k * .12);
    /* trail */
    if (ui.trails && wd.trail.length > 3) {
      ctx.strokeStyle = col; ctx.globalAlpha = alpha * .32; ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let i = 0; i < wd.trail.length; i += 2) {
        const X = cx + wd.trail[i] * sc, Y = cy + wd.trail[i + 1] * sc;
        i === 0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    const t = wd.tip();
    const x1 = cx + t.x1 * sc, y1 = cy + t.y1 * sc;
    const x2 = cx + t.x2 * sc, y2 = cy + t.y2 * sc;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = col; ctx.lineWidth = primary ? 2.6 : 1.7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const r1 = Math.max(5, 5 * Math.cbrt(wd.p.m1)), r2 = Math.max(6, 6 * Math.cbrt(wd.p.m2));
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x1, y1, primary ? r1 : r1 * .7, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x2, y2, primary ? r2 : r2 * .7, 0, TAU); ctx.fill();
    if (primary) {
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.arc(x2 - r2 * .3, y2 - r2 * .35, r2 * .28, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (ui.grabbing && primary) {
      ctx.strokeStyle = 'rgba(184,145,47,.6)'; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + (wd.p.l1 + wd.p.l2) * sc); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
};
function drawPendulumPhase(ctx, w, h, worlds) {
  grid(ctx, w, h, 40);
  const cx = w / 2, cy = h / 2, sx = w / (2.4 * Math.PI), sy = h / 24;
  ctx.strokeStyle = 'rgba(31,43,38,.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();
  axisLabel(ctx, 'θ₁ (rad)', w - 62, cy - 8);
  axisLabel(ctx, 'ω₁', cx + 8, 16);
  worlds.forEach((wd, k) => {
    const col = worldColor(k, worlds.length);
    if (!wd.phase) wd.phase = [];
    wd.phase.push(wd.s[0], wd.s[2]);
    if (wd.phase.length > 5000) wd.phase.splice(0, 2);
    ctx.strokeStyle = col; ctx.globalAlpha = k === 0 ? .55 : .3; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < wd.phase.length; i += 2) {
      let a = wd.phase[i];
      a = ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
      const X = cx + a * sx, Y = cy - wd.phase[i + 1] * sy;
      if (i === 0 || Math.abs(a - (((wd.phase[i - 2] + Math.PI) % TAU + TAU) % TAU - Math.PI)) > 3) ctx.moveTo(X, Y);
      else ctx.lineTo(X, Y);
    }
    ctx.stroke(); ctx.globalAlpha = 1;
    let a = ((wd.s[0] + Math.PI) % TAU + TAU) % TAU - Math.PI;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(cx + a * sx, cy - wd.s[2] * sy, k === 0 ? 4.5 : 3, 0, TAU); ctx.fill();
  });
}
function drawPendulumEnergy(ctx, w, h, worlds) {
  const wd = worlds[0];
  if (!wd.ehist) wd.ehist = [];
  const e = dpEnergy(wd.s, wd.p);
  wd.ehist.push(e.ke, e.pe);
  if (wd.ehist.length > 1200) wd.ehist.splice(0, 2);
  const pad = 46, gw = w - pad * 2, gh = h - pad * 2;
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < wd.ehist.length; i += 2) {
    const k = wd.ehist[i], p = wd.ehist[i + 1];
    lo = Math.min(lo, p, k, k + p); hi = Math.max(hi, k, p, k + p);
  }
  if (!isFinite(lo)) { lo = -1; hi = 1; }
  const pad2 = (hi - lo) * .12 + .01; lo -= pad2; hi += pad2;
  const Y = v => pad + gh - ((v - lo) / (hi - lo)) * gh;
  ctx.strokeStyle = 'rgba(31,43,38,.12)'; ctx.lineWidth = 1;
  ctx.strokeRect(pad, pad, gw, gh);
  const n = wd.ehist.length / 2;
  const series = [
    { idx: 0, col: '#c9705f', name: '運動エネルギー K' },
    { idx: 1, col: '#6b6fa8', name: '位置エネルギー U' }
  ];
  series.forEach(s => {
    ctx.strokeStyle = s.col; ctx.lineWidth = 1.6; ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const X = pad + (i / Math.max(1, n - 1)) * gw;
      const v = wd.ehist[i * 2 + s.idx];
      i === 0 ? ctx.moveTo(X, Y(v)) : ctx.lineTo(X, Y(v));
    }
    ctx.stroke();
  });
  ctx.strokeStyle = '#2e5c4c'; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const X = pad + (i / Math.max(1, n - 1)) * gw;
    const v = wd.ehist[i * 2] + wd.ehist[i * 2 + 1];
    i === 0 ? ctx.moveTo(X, Y(v)) : ctx.lineTo(X, Y(v));
  }
  ctx.stroke();
  ctx.font = '600 10.5px "Noto Sans JP",sans-serif';
  let lx = pad + 6;
  [...series, { col: '#2e5c4c', name: '合計 E' }].forEach(s => {
    ctx.fillStyle = s.col; ctx.fillRect(lx, pad - 16, 10, 3);
    ctx.fillText(s.name, lx + 14, pad - 11);
    lx += ctx.measureText(s.name).width + 34;
  });
}

/* -------- A01 draw ------------------------------------------------------ */
LABS.A01.draw = function (ctx, w, h, worlds, ui) {
  bg(ctx, w, h);
  grid(ctx, w, h, 38);
  const cx = w / 2, cy = h / 2;
  const sc = Math.min(w, h) / 62;
  const yaw = ui.yaw || 0, pitch = -0.38;
  const project = (x, y, z) => {
    if (ui.view === 'xy') return [cx + x * sc, cy - y * sc];
    if (ui.view === 'xz') return [cx + x * sc, cy + h * .28 - z * sc];
    if (ui.view === 'yz') return [cx + y * sc, cy + h * .28 - z * sc];
    const zc = z - 25;
    const X = x * Math.cos(yaw) - y * Math.sin(yaw);
    const Yy = x * Math.sin(yaw) + y * Math.cos(yaw);
    const Y2 = Yy * Math.cos(pitch) - zc * Math.sin(pitch);
    return [cx + X * sc, cy - Y2 * sc];
  };
  if (ui.view !== '3d') {
    ctx.strokeStyle = 'rgba(31,43,38,.14)'; ctx.lineWidth = 1;
    const o = project(0, 0, 0);
    ctx.beginPath(); ctx.moveTo(0, o[1]); ctx.lineTo(w, o[1]); ctx.moveTo(o[0], 0); ctx.lineTo(o[0], h); ctx.stroke();
    axisLabel(ctx, ui.view.toUpperCase() + ' 平面', 14, h - 14);
  }
  for (let k = worlds.length - 1; k >= 0; k--) {
    const wd = worlds[k], col = worldColor(k, worlds.length);
    const tr = wd.trail, n = tr.length / 3;
    if (n > 2 && ui.trails) {
      const seg = Math.max(1, Math.floor(n / 900));
      ctx.lineWidth = k === 0 ? 1.5 : 1.1;
      for (let i = seg; i < n; i += seg) {
        const a = project(tr[(i - seg) * 3], tr[(i - seg) * 3 + 1], tr[(i - seg) * 3 + 2]);
        const b = project(tr[i * 3], tr[i * 3 + 1], tr[i * 3 + 2]);
        const f = i / n;
        ctx.globalAlpha = (k === 0 ? .85 : .5) * (0.12 + f * 0.88);
        ctx.strokeStyle = ui.colorBySpeed && k === 0
          ? `hsl(${170 - Math.min(1, Math.hypot(tr[i * 3] - tr[(i - seg) * 3], tr[i * 3 + 1] - tr[(i - seg) * 3 + 1]) / 2) * 150},40%,45%)`
          : col;
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    const p = project(wd.s[0], wd.s[1], wd.s[2]);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(p[0], p[1], k === 0 ? 5 : 3.4, 0, TAU); ctx.fill();
    if (k === 0) {
      ctx.strokeStyle = 'rgba(184,145,47,.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p[0], p[1], 10, 0, TAU); ctx.stroke();
    }
  }
};

/* -------- M01 draw ------------------------------------------------------ */
let bifCache = null;
LABS.M01.draw = function (ctx, w, h, worlds, ui) {
  bg(ctx, w, h);
  const pad = 48;
  if (ui.view === 'bifur') return drawBifurcation(ctx, w, h, worlds, ui, pad);
  if (ui.view === 'cobweb') return drawCobweb(ctx, w, h, worlds, pad);
  if (ui.view === 'return') return drawReturnMap(ctx, w, h, worlds, pad);
  /* time series */
  const gw = w - pad * 2, gh = h - pad * 2;
  ctx.strokeStyle = 'rgba(31,43,38,.12)'; ctx.strokeRect(pad, pad, gw, gh);
  axisLabel(ctx, 'n（繰り返し回数）', pad, h - pad + 18);
  axisLabel(ctx, 'x', pad - 18, pad - 8);
  const show = 120;
  worlds.forEach((wd, k) => {
    const col = worldColor(k, worlds.length);
    const hist = wd.hist, start = Math.max(0, hist.length - show), n = hist.length - start;
    ctx.strokeStyle = col; ctx.globalAlpha = k === 0 ? 1 : .6; ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const X = pad + (i / Math.max(1, show - 1)) * gw, Y = pad + gh - hist[start + i] * gh;
      i === 0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
    }
    ctx.stroke();
    ctx.fillStyle = col;
    for (let i = 0; i < n; i += 1) {
      const X = pad + (i / Math.max(1, show - 1)) * gw, Y = pad + gh - hist[start + i] * gh;
      ctx.beginPath(); ctx.arc(X, Y, k === 0 ? 2 : 1.4, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  });
};
function mapBox(ctx, w, h, pad) {
  const s = Math.min(w, h) - pad * 2;
  const ox = (w - s) / 2, oy = (h - s) / 2;
  ctx.strokeStyle = 'rgba(31,43,38,.12)'; ctx.lineWidth = 1; ctx.strokeRect(ox, oy, s, s);
  return { ox, oy, s };
}
function drawCobweb(ctx, w, h, worlds, pad) {
  const { ox, oy, s } = mapBox(ctx, w, h, pad);
  const r = worlds[0].p.r;
  const X = v => ox + v * s, Y = v => oy + s - v * s;
  ctx.strokeStyle = 'rgba(31,43,38,.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(1), Y(1)); ctx.stroke();
  ctx.strokeStyle = '#b8912f'; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i <= 200; i++) {
    const x = i / 200, y = r * x * (1 - x);
    i === 0 ? ctx.moveTo(X(x), Y(y)) : ctx.lineTo(X(x), Y(y));
  }
  ctx.stroke();
  worlds.forEach((wd, k) => {
    const col = worldColor(k, worlds.length);
    const hist = wd.hist, start = Math.max(0, hist.length - 60);
    ctx.strokeStyle = col; ctx.globalAlpha = k === 0 ? .8 : .45; ctx.lineWidth = 1;
    ctx.beginPath();
    let x = hist[start];
    ctx.moveTo(X(x), Y(0));
    for (let i = start; i < hist.length - 1; i++) {
      const y = hist[i + 1];
      ctx.lineTo(X(hist[i]), Y(y));
      ctx.lineTo(X(y), Y(y));
    }
    ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(X(wd.x), Y(r * wd.x * (1 - wd.x)), 4, 0, TAU); ctx.fill();
  });
  axisLabel(ctx, 'xₙ', ox + s - 16, oy + s + 16);
  axisLabel(ctx, 'xₙ₊₁', ox - 26, oy + 4);
}
function drawReturnMap(ctx, w, h, worlds, pad) {
  const { ox, oy, s } = mapBox(ctx, w, h, pad);
  const X = v => ox + v * s, Y = v => oy + s - v * s;
  ctx.strokeStyle = 'rgba(31,43,38,.2)'; ctx.beginPath();
  ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(1), Y(1)); ctx.stroke();
  worlds.forEach((wd, k) => {
    ctx.fillStyle = worldColor(k, worlds.length);
    ctx.globalAlpha = .55;
    const hist = wd.hist;
    for (let i = Math.max(1, hist.length - 900); i < hist.length; i++) {
      ctx.beginPath(); ctx.arc(X(hist[i - 1]), Y(hist[i]), 1.6, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  });
  axisLabel(ctx, 'xₙ', ox + s - 16, oy + s + 16);
  axisLabel(ctx, 'xₙ₊₁', ox - 26, oy + 4);
}
function drawBifurcation(ctx, w, h, worlds, ui, pad) {
  const gw = Math.floor(w - pad * 2), gh = Math.floor(h - pad * 2);
  const key = gw + 'x' + gh;
  if (!bifCache || bifCache.key !== key) {
    const off = document.createElement('canvas');
    off.width = gw; off.height = gh;
    const o = off.getContext('2d');
    o.fillStyle = '#f6f4ee'; o.fillRect(0, 0, gw, gh);
    const img = o.getImageData(0, 0, gw, gh), d = img.data;
    const burn = 250, keep = 160;
    for (let px = 0; px < gw; px++) {
      const r = 2.4 + (px / gw) * (4 - 2.4);
      let x = 0.2;
      for (let i = 0; i < burn; i++) x = r * x * (1 - x);   /* burn-in excluded */
      for (let i = 0; i < keep; i++) {
        x = r * x * (1 - x);
        const py = Math.floor((1 - x) * (gh - 1));
        if (py < 0 || py >= gh) continue;
        const idx = (py * gw + px) * 4;
        d[idx] = Math.max(0, d[idx] - 26);
        d[idx + 1] = Math.max(0, d[idx + 1] - 16);
        d[idx + 2] = Math.max(0, d[idx + 2] - 20);
      }
    }
    o.putImageData(img, 0, 0);
    bifCache = { key, canvas: off };
  }
  ctx.drawImage(bifCache.canvas, pad, pad);
  ctx.strokeStyle = 'rgba(31,43,38,.12)'; ctx.strokeRect(pad, pad, gw, gh);
  /* current r marker */
  const r = worlds[0].p.r;
  if (r >= 2.4) {
    const X = pad + ((r - 2.4) / (4 - 2.4)) * gw;
    ctx.strokeStyle = '#c9705f'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(X, pad); ctx.lineTo(X, pad + gh); ctx.stroke();
    ctx.fillStyle = '#c9705f';
    ctx.beginPath(); ctx.moveTo(X, pad - 2); ctx.lineTo(X - 4, pad - 9); ctx.lineTo(X + 4, pad - 9); ctx.fill();
    ctx.font = '600 10.5px "Noto Sans JP",sans-serif';
    ctx.fillText('r = ' + r.toFixed(4), Math.min(X + 6, pad + gw - 60), pad - 12);
  } else {
    axisLabel(ctx, 'r < 2.4 は図の範囲外です', pad + 6, pad - 10);
  }
  worlds.forEach((wd, k) => {
    ctx.fillStyle = worldColor(k, worlds.length);
    const X = pad + ((clamp(wd.p.r, 2.4, 4) - 2.4) / 1.6) * gw;
    ctx.beginPath(); ctx.arc(X, pad + gh - wd.x * gh, 3.2, 0, TAU); ctx.fill();
  });
  axisLabel(ctx, 'r', pad + gw - 10, pad + gh + 18);
  axisLabel(ctx, '長期的な x', pad - 30, pad - 8);
}

/* -------- R02 draw ------------------------------------------------------ */
LABS.R02.draw = function (ctx, w, h, worlds, ui) {
  bg(ctx, w, h);
  const wd = worlds[0];
  if (ui.view === 'msd') return drawMSD(ctx, w, h, worlds);
  const cx = w / 2, cy = h / 2;
  const reach = Math.max(12, Math.sqrt(Math.max(1, wd.step_)) * 2.6 * wd.p.stepLength);
  const sc = Math.min(w, h) / (2.4 * reach);
  grid(ctx, w, h, Math.max(14, sc * wd.p.stepLength));
  ctx.strokeStyle = 'rgba(31,43,38,.14)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();
  ctx.fillStyle = '#b8912f';
  ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, TAU); ctx.fill();

  worlds.forEach((world, k) => {
    const col = worldColor(k, worlds.length);
    const n = world.p.walkerCount, pos = world.pos;
    if (ui.view === 'one' || (ui.trails && n <= 12)) {
      /* pencil-like trail for the highlighted walker */
      if (world.trail.length > 3) {
        ctx.strokeStyle = col; ctx.globalAlpha = .55; ctx.lineWidth = 1.4; ctx.lineJoin = 'round';
        ctx.beginPath();
        for (let i = 0; i < world.trail.length; i += 2) {
          const X = cx + world.trail[i] * sc, Y = cy - world.trail[i + 1] * sc;
          i === 0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
        }
        ctx.stroke(); ctx.globalAlpha = 1;
      }
    }
    const dotR = n > 600 ? 1.1 : n > 120 ? 1.7 : 2.6;
    ctx.fillStyle = col;
    ctx.globalAlpha = ui.view === 'cloud' ? .5 : (n > 400 ? .42 : .72);
    /* 「1本」view follows the single highlighted walker only */
    const limit = ui.view === 'one' ? 1 : Math.min(n, 3000);
    for (let i = 0; i < limit; i++) {
      ctx.beginPath();
      ctx.arc(cx + pos[i * 2] * sc, cy - pos[i * 2 + 1] * sc, dotR, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (ui.view !== 'cloud' && n >= 1) {
      ctx.fillStyle = k === 0 ? '#1c3e33' : col;
      ctx.beginPath(); ctx.arc(cx + pos[0] * sc, cy - pos[1] * sc, 4, 0, TAU); ctx.fill();
    }
    /* rms circle */
    if (ui.view === 'cloud' || ui.view === 'many') {
      const st = world.stats();
      ctx.strokeStyle = k === 0 ? 'rgba(184,145,47,.75)' : col;
      ctx.setLineDash([4, 5]); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(cx, cy, st.rms * sc, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      if (k === 0 && w > 420) {   /* label would crowd the small preview cards */
        ctx.fillStyle = '#b8912f'; ctx.font = '600 10.5px "Noto Sans JP",sans-serif';
        ctx.fillText('RMS 距離 ' + st.rms.toFixed(2), cx + st.rms * sc + 6, cy - 5);
      }
    }
  });
};
function drawMSD(ctx, w, h, worlds) {
  const pad = 52, gw = w - pad * 2, gh = h - pad * 2;
  const wd = worlds[0];
  const maxN = Math.max(20, wd.step_);
  let maxY = Math.max(4, wd.stats().msd * 1.25, maxN * wd.p.stepLength * wd.p.stepLength * 1.25);
  ctx.strokeStyle = 'rgba(31,43,38,.12)'; ctx.lineWidth = 1; ctx.strokeRect(pad, pad, gw, gh);
  const X = n => pad + (n / maxN) * gw, Y = v => pad + gh - (v / maxY) * gh;
  /* reference: MSD = steps * a^2 */
  ctx.strokeStyle = 'rgba(184,145,47,.8)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(X(0), Y(0));
  ctx.lineTo(X(maxN), Y(maxN * wd.p.stepLength * wd.p.stepLength)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#b8912f'; ctx.font = '600 10.5px "Noto Sans JP",sans-serif';
  ctx.fillText('目安：⟨r²⟩ = 歩数 × a²', pad + 10, pad + 16);
  worlds.forEach((world, k) => {
    ctx.strokeStyle = worldColor(k, worlds.length); ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (let i = 0; i < world.msd.length; i += 2) {
      const Xp = X(world.msd[i]), Yp = Y(world.msd[i + 1]);
      i === 0 ? ctx.moveTo(Xp, Yp) : ctx.lineTo(Xp, Yp);
    }
    ctx.stroke();
  });
  axisLabel(ctx, '歩数', pad + gw - 24, pad + gh + 18);
  axisLabel(ctx, '⟨r²⟩', pad - 30, pad - 8);
}

LABS.P02.metrics = (worlds) => {
  const w0 = worlds[0], e = dpEnergy(w0.s, w0.p);
  const out = [
    { k: '時間 t', v: fmt(w0.t, 2) + ' s' },
    { k: '力学的エネルギー E', v: fmt(e.total, 4) + ' J' },
    { k: '運動 K', v: fmt(e.ke, 3) },
    { k: '位置 U', v: fmt(e.pe, 3) },
    { k: '先端の速さ', v: fmt(Math.abs(w0.p.l2 * w0.s[3]), 3) + ' m/s' }
  ];
  if (worlds.length > 1) {
    const a = worlds[0].s, b = worlds[1].s;
    const d = Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2], a[3] - b[3]);
    out.push({ k: 'A–B 状態距離', v: fmt(d, 6), hot: d > .05 });
  }
  return out;
};
LABS.A01.metrics = (worlds) => {
  const w0 = worlds[0];
  const out = [
    { k: '時間 t', v: fmt(w0.t, 2) },
    { k: 'x', v: fmt(w0.s[0], 4) },
    { k: 'y', v: fmt(w0.s[1], 4) },
    { k: 'z', v: fmt(w0.s[2], 4) },
    { k: '速さ |v|', v: fmt(w0.speed(), 3) }
  ];
  if (worlds.length > 1) {
    const a = worlds[0].s, b = worlds[1].s;
    const d = Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
    out.push({ k: 'A–B 距離', v: fmt(d, 6), hot: d > 1 });
  }
  return out;
};
LABS.M01.metrics = (worlds) => {
  const w0 = worlds[0];
  const tail = w0.hist.slice(-64);
  let period = '—';
  for (let p = 1; p <= 16; p++) {
    let ok = true;
    for (let i = 0; i < 12; i++) {
      if (Math.abs(tail[tail.length - 1 - i] - tail[tail.length - 1 - i - p]) > 1e-5) { ok = false; break; }
    }
    if (ok) { period = p + ' 周期'; break; }
  }
  const out = [
    { k: '繰り返し n', v: w0.n },
    { k: '現在の x', v: fmt(w0.x, 6) },
    { k: '長期の様子', v: period },
    { k: '直近64回の最小', v: fmt(Math.min(...tail), 4) },
    { k: '直近64回の最大', v: fmt(Math.max(...tail), 4) }
  ];
  if (worlds.length > 1) {
    const d = Math.abs(worlds[0].x - worlds[1].x);
    out.push({ k: 'A–B 差', v: fmt(d, 8), hot: d > .01 });
  }
  return out;
};
LABS.R02.metrics = (worlds) => {
  const w0 = worlds[0], st = w0.stats();
  const tot = w0.dirCount.reduce((a, b) => a + b, 0) || 1;
  return [
    { k: '歩数', v: w0.step_ },
    { k: 'ウォーカー数 N', v: w0.p.walkerCount },
    { k: '平均 x', v: fmt(st.mx, 3) },
    { k: '平均 y', v: fmt(st.my, 3) },
    { k: '平均二乗変位 ⟨r²⟩', v: fmt(st.msd, 2) },
    { k: 'RMS 距離', v: fmt(st.rms, 3) },
    { k: '各向きの割合', v: w0.dirCount.map(c => (100 * c / tot).toFixed(1)).join(' / ') }
  ];
};

    }},

        const w = new PendulumWorld({ m1:1,m2:1,l1:1,l2:1,g:0,damping:0 }, {t1:1.2,t2:-.4,w1:0,w2:0});
        for (let i=0;i<2400;i++) w.step(1/240);

        const at=dt=>{ const w=new LorenzWorld(P,{x:1,y:1,z:1});
                       const n=Math.round(T/dt); for(let i=0;i<n;i++) w.step(dt); return w.s; };
        const ref=at(0.0003125), c=at(0.005), f=at(0.0025);

const LIFE_PATTERNS = {
  glider: [[1,0],[2,1],[0,2],[1,2],[2,2]],
  gun: [[0,4],[0,5],[1,4],[1,5],[10,4],[10,5],[10,6],[11,3],[11,7],[12,2],[12,8],
        [13,2],[13,8],[14,5],[15,3],[15,7],[16,4],[16,5],[16,6],[17,5],[20,2],[20,3],
        [20,4],[21,2],[21,3],[21,4],[22,1],[22,5],[24,0],[24,1],[24,5],[24,6],
        [34,2],[34,3],[35,2],[35,3]],
  pulsar: (() => {
    const seg = [2,3,4,8,9,10], out = [];
    seg.forEach(x => [0,5,7,12].forEach(y => out.push([x,y])));
    seg.forEach(y => [0,5,7,12].forEach(x => out.push([x,y])));
    return out;
  })()
};
class LifeWorld {
  constructor(p, init) {
    this.p = Object.assign({}, p);
    this.W = 132; this.H = 88;
    this.a = new Uint8Array(this.W * this.H);
    this.b = new Uint8Array(this.W * this.H);
    this.gen = 0; this.activity = 0;
    this.popHist = [];
    const pat = init.pattern || 'soup';
    if (pat === 'soup') {
      const rng = SeededRNG(init.seed >>> 0);
      for (let i = 0; i < this.a.length; i++) this.a[i] = rng.next() < init.density ? 1 : 0;
    } else {
      const cells = LIFE_PATTERNS[pat] || [];
      let mx = 0, my = 0;
      cells.forEach(c => { mx = Math.max(mx, c[0]); my = Math.max(my, c[1]); });
      const ox = (this.W - mx) >> 1, oy = (this.H - my) >> 1;
      cells.forEach(c => { this.a[(c[1] + oy) * this.W + (c[0] + ox)] = 1; });
    }
    this.popHist.push(this.pop());
  }
  pop() { let s = 0; for (let i = 0; i < this.a.length; i++) s += this.a[i]; return s; }
  step() {
    const { W, H, a, b } = this;
    let act = 0;
    for (let y = 0; y < H; y++) {
      const yu = ((y - 1 + H) % H) * W, ym = y * W, yd = ((y + 1) % H) * W;
      for (let x = 0; x < W; x++) {
        const xl = (x - 1 + W) % W, xr = (x + 1) % W;
        const n = a[yu + xl] + a[yu + x] + a[yu + xr] + a[ym + xl] + a[ym + xr]
                + a[yd + xl] + a[yd + x] + a[yd + xr];
        const alive = a[ym + x];
        const next = alive ? (n === 2 || n === 3 ? 1 : 0) : (n === 3 ? 1 : 0);
        b[ym + x] = next;
        if (next !== alive) act++;
      }
    }
    this.a.set(b);
    this.gen++; this.activity = act;
    this.popHist.push(this.pop());
    if (this.popHist.length > 900) this.popHist.shift();
  }
  paint(cx, cy) {
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (Math.abs(dx) + Math.abs(dy) > 1) continue;
      const x = cx + dx, y = cy + dy;
      if (x >= 0 && x < this.W && y >= 0 && y < this.H) this.a[y * this.W + x] = 1;
    }
  }
}

 * ======================================================================= */
const WAVE_SOURCES = {
  single: [{ x: 108, y: 72 }],
  double: [{ x: 78, y: 72 }, { x: 137, y: 72 }],
  triple: [{ x: 70, y: 50 }, { x: 145, y: 50 }, { x: 108, y: 100 }],
  antiphase: [{ x: 78, y: 72 }, { x: 137, y: 72, inv: true }]
};
class WaveWorld {
  constructor(p, init) {
    this.p = Object.assign({}, p);
    this.W = 216; this.H = 144;
    const n = this.W * this.H;
    this.u = new Float32Array(n); this.up = new Float32Array(n); this.un = new Float32Array(n);
    this.avg = new Float32Array(n); this.avgN = 0;
    this.t = 0;
    this.sources = (WAVE_SOURCES[init.sources] || WAVE_SOURCES.double).map(s => Object.assign({}, s));
  }
  step() {
    const { W, H } = this, u = this.u, up = this.up, un = this.un;
    const c2 = 0.2, keep = 1 - this.p.damping;
    this.t++;
    for (let y = 1; y < H - 1; y++) {
      const b = y * W;
      for (let x = 1; x < W - 1; x++) {
        const i = b + x;
        un[i] = (2 * u[i] - up[i] + c2 * (u[i - 1] + u[i + 1] + u[i - W] + u[i + W] - 4 * u[i])) * keep;
      }
    }
    /* sponge boundary: soak up outgoing waves so edges don't reflect hard */
    const M = 12;
    for (let d = 0; d < M; d++) {
      const f = 0.90 + 0.10 * (d / M);
      for (let x = 0; x < W; x++) { un[d * W + x] *= f; un[(H - 1 - d) * W + x] *= f; }
      for (let y = 0; y < H; y++) { un[y * W + d] *= f; un[y * W + (W - 1 - d)] *= f; }
    }
    /* drive sources: ω = c·k, c = √0.2 cells/step */
    const om = TAU * Math.sqrt(0.2) / this.p.lambda;
    for (const s of this.sources)
      un[s.y * W + s.x] = this.p.amp * Math.sin(om * this.t + (s.inv ? Math.PI : 0));
    const tmp = this.up; this.up = this.u; this.u = this.un; this.un = tmp;
    if (this.t > 40 && (this.t & 1) === 0) {
      const uu = this.u, avg = this.avg;
      for (let i = 0; i < uu.length; i++) avg[i] += uu[i] * uu[i];
      this.avgN++;
    }
  }
  energy() { let s = 0; const u = this.u; for (let i = 0; i < u.length; i++) s += u[i] * u[i]; return s; }
}

/* =========================================================================
 * QM01 — QUANTUM TUNNELING   (engine: schrodinger-1d, Crank–Nicolson)
 *   ħ = m = 1.  CN is unitary: the norm is conserved to machine precision.
 * ======================================================================= */
class QuantumWorld {
  constructor(p, init) {
    this.p = Object.assign({}, p);
    this.N = 520; this.dx = 0.12; this.dt = 0.004;
    this.L = this.N * this.dx;          /* 62.4 */
    this.xb = this.L / 2;               /* barrier center */
    const N = this.N;
    this.re = new Float64Array(N); this.im = new Float64Array(N);
    /* Thomas scratch */
    this._cr = new Float64Array(N); this._ci = new Float64Array(N);
    this._dr = new Float64Array(N); this._di = new Float64Array(N);
    this.t = 0; this.steps = 0;
    const x0 = 14, sg = init.sigma, k0 = this.p.k0;
    for (let j = 0; j < N; j++) {
      const x = j * this.dx;
      const g = Math.exp(-((x - x0) * (x - x0)) / (4 * sg * sg));
      this.re[j] = g * Math.cos(k0 * x);
      this.im[j] = g * Math.sin(k0 * x);
    }
    const nrm = Math.sqrt(this.norm());
    for (let j = 0; j < N; j++) { this.re[j] /= nrm; this.im[j] /= nrm; }
  }
  V(j) {
    const x = j * this.dx, w = this.p.width;
    return Math.abs(x - this.xb) < w / 2 ? this.p.v0 : 0;
  }
  step() {
    /* Crank–Nicolson: (1 + i·dt/2·H)ψ' = (1 − i·dt/2·H)ψ, complex Thomas solve */
    const N = this.N, dt = this.dt, dx2 = this.dx * this.dx;
    const re = this.re, im = this.im;
    const offI = -dt / (4 * dx2);                     /* A off-diag = i·offI (pure imag) */
    const cr = this._cr, ci = this._ci, dr = this._dr, di = this._di;
    /* RHS = B ψ ; B off-diag = −i·offI, B diag = 1 − i·dt/2·(1/dx² + V) */
    for (let j = 1; j < N - 1; j++) {
      const hd = dt / 2 * (1 / dx2 + this.V(j));      /* imag part of A diag */
      const nre = re[j - 1] + re[j + 1], nim = im[j - 1] + im[j + 1];
      /* (1 − i·hd)(re+i·im) + (−i·offI)(nre+i·nim) */
      dr[j] = re[j] + hd * im[j] + offI * nim;
      di[j] = im[j] - hd * re[j] - offI * nre;
    }
    /* forward sweep (Dirichlet ψ₀ = ψ_{N−1} = 0) */
    for (let j = 1; j < N - 1; j++) {
      const adr = 1, adi = dt / 2 * (1 / dx2 + this.V(j));
      let br = adr, bi = adi;
      if (j > 1) {
        /* b = a_diag − a_off² / c_{j−1};  a_off = i·offI → a_off² = −offI² */
        const den = cr[j - 1] * cr[j - 1] + ci[j - 1] * ci[j - 1];
        const qr = (-offI * offI) * cr[j - 1] / den, qi = -(-offI * offI) * ci[j - 1] / den;
        br = adr - qr; bi = adi - qi;
        /* d_j −= a_off / c_{j−1} · d_{j−1};  a_off/c = i·offI·conj(c)/|c|² */
        const fr = offI * ci[j - 1] / den, fi = offI * cr[j - 1] / den;
        dr[j] -= fr * dr[j - 1] - fi * di[j - 1];
        di[j] -= fr * di[j - 1] + fi * dr[j - 1];
      }
      cr[j] = br; ci[j] = bi;
    }
    /* back substitution */
    re[0] = im[0] = re[N - 1] = im[N - 1] = 0;
    for (let j = N - 2; j >= 1; j--) {
      let rr = dr[j], ri = di[j];
      if (j < N - 2) {
        /* subtract a_off·ψ_{j+1} = i·offI·ψ */
        rr -= -offI * im[j + 1];
        ri -= offI * re[j + 1];
      }
      const den = cr[j] * cr[j] + ci[j] * ci[j];
      re[j] = (rr * cr[j] + ri * ci[j]) / den;
      im[j] = (ri * cr[j] - rr * ci[j]) / den;
    }
    this.t += dt; this.steps++;
  }
  norm() {
    let s = 0;
    for (let j = 0; j < this.N; j++) s += this.re[j] * this.re[j] + this.im[j] * this.im[j];
    return s * this.dx;
  }
  meanX() {
    let s = 0, n = 0;
    for (let j = 0; j < this.N; j++) {
      const p = this.re[j] * this.re[j] + this.im[j] * this.im[j];
      s += j * this.dx * p; n += p;
    }
    return s / n;
  }
  transmission() {
    const cut = Math.ceil((this.xb + this.p.width / 2) / this.dx);
    let s = 0;
    for (let j = cut; j < this.N; j++) s += this.re[j] * this.re[j] + this.im[j] * this.im[j];
    return s * this.dx / this.norm();
  }
}

  const r = s[0], pr = s[2], L = s[3];
  const f = 1 - 1 / r, fp = 1 / (r * r);
  return [
    f * pr,
    L / (r * r),
    -0.5 * (fp / (f * f) + fp * pr * pr - 2 * L * L / (r * r * r)),
    0

}

function traceRay(b, x0, rEsc) {

    s = rk4(s, null, dl, bhDeriv);
    r = s[0];
    rmin = Math.min(rmin, r);
    if ((i & 3) === 0) pts.push(r * Math.cos(s[1]), r * Math.sin(s[1]));
    if (r < 1.005) { fate = 'captured'; break; }
    if (r > rEsc && s[2] > 0 && i > 20) { fate = 'escaped'; break; }
  }

      const f = 1 - 1 / st[0], rdot = f * st[2], phidot = st[3] / (st[0] * st[0]);

LABS.BH01.draw = function (ctx, w, h, worlds, ui) {

  wd.rays.forEach(ray => {

    ctx.strokeStyle = ray.fate === 'captured' ? '#c9705f' : '#2e5c4c';
    ctx.globalAlpha = .5; ctx.lineWidth = 1.2;
    ctx.beginPath();

      const X = cx + pts[i * 2] * sc, Y = cy - pts[i * 2 + 1] * sc;
      i === 0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
    }
    ctx.stroke(); ctx.globalAlpha = 1;
    /* travelling photon dot */
    const k = Math.floor(wd.pt) % n;
    ctx.fillStyle = '#b8912f';
    ctx.beginPath();
    ctx.arc(cx + pts[k * 2] * sc, cy - pts[k * 2 + 1] * sc, 2.6, 0, TAU);
    ctx.fill();
  });

  ctx.strokeStyle = 'rgba(184,145,47,.6)'; ctx.setLineDash([4, 5]); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(cx, cy, 1.5 * sc, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  /* horizon */
  ctx.fillStyle = '#141a17';
  ctx.beginPath(); ctx.arc(cx, cy, 1 * sc, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(84,103,122,.5)';
  ctx.beginPath(); ctx.arc(cx, cy, 1 * sc, 0, TAU); ctx.stroke();

  ctx.fillText('光子球 1.5 r_s', cx + 1.5 * sc * .72, cy - 1.5 * sc * .78);

};
function drawBHDefl(ctx, w, h, wd) {
  const pad = 54, gw = w - pad * 2, gh = h - pad * 2;
  ctx.strokeStyle = 'rgba(31,43,38,.12)'; ctx.strokeRect(pad, pad, gw, gh);
  const bmax = 13, dmax = Math.PI;
  const X = b => pad + gw / 2 + (b / bmax) * gw / 2;
  const Y = d => pad + gh - clamp(d / dmax, 0, 1) * gh;
  const bc = 3 * Math.sqrt(3) / 2;
  /* critical impact parameter bands */
  ctx.fillStyle = 'rgba(201,112,95,.1)';
  ctx.fillRect(X(-bc), pad, X(bc) - X(-bc), gh);
  [-bc, bc].forEach(b => {
    ctx.strokeStyle = 'rgba(201,112,95,.7)'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(X(b), pad); ctx.lineTo(X(b), pad + gh); ctx.stroke();
    ctx.setLineDash([]);
  });
  ctx.fillStyle = '#c9705f'; ctx.font = '600 10.5px "Noto Sans JP",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('← 捕獲される範囲 |b| < 2.598 r_s →', X(0), pad + 18);
  ctx.textAlign = 'left';
  /* theory curve δ = 2/b (weak field) */
  ctx.strokeStyle = 'rgba(184,145,47,.8)'; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.3;
  [1, -1].forEach(sg => {
    ctx.beginPath();
    let started = false;
    for (let b = bc + .4; b < bmax; b += .1) {
      const Xp = X(sg * b), Yp = Y(2 / b);
      started ? ctx.lineTo(Xp, Yp) : ctx.moveTo(Xp, Yp);
      started = true;
    }
    ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.fillStyle = '#b8912f';
  ctx.fillText('弱い場の理論値 δ = 2r_s/b', pad + gw - 170, Y(2 / (bmax - 1)) - 8);
  /* measured points */
  wd.rays.forEach(ray => {
    if (ray.fate === 'escaped' && ray.defl != null) {
      ctx.fillStyle = '#2e5c4c';
      ctx.beginPath(); ctx.arc(X(ray.b), Y(ray.defl), 3.4, 0, TAU); ctx.fill();
    } else if (ray.fate === 'captured') {
      ctx.fillStyle = '#c9705f';
      ctx.beginPath(); ctx.arc(X(ray.b), pad + 30, 3.4, 0, TAU); ctx.fill();
    }
  });
  axisLabel(ctx, 'ねらい b（r_s）', pad + gw - 80, pad + gh + 18);
  axisLabel(ctx, '曲がり角 δ（rad）', pad + 4, pad - 8);
}

        return { ok: same, d: same ? 'bitwise identical' : 'mismatch' };
    }}
  ],
  QM01: [
    { n: 'ノルム（全確率）が保存される（CN はユニタリ）', run() {
        const w = new QuantumWorld({ k0: 1.2, v0: 1, width: 3 }, { sigma: 2.5 });
        const n0 = w.norm();
        for (let i = 0; i < 1500; i++) w.step();
        const rel = Math.abs(w.norm() - n0) / n0;
        return { ok: rel < 1e-7, d: '相対ドリフト = ' + rel.toExponential(2) };
    }},
    { n: '自由な波束の重心が群速度 k₀ で進む', run() {
        const w = new QuantumWorld({ k0: 1.5, v0: 0, width: 3 }, { sigma: 2.5 });
        const x0 = w.meanX();
        for (let i = 0; i < 2000; i++) w.step();
        const drift = (w.meanX() - x0) / w.t;
        const rel = Math.abs(drift - 1.5) / 1.5;
        return { ok: rel < .02, d: `⟨x⟩ の速度 = ${drift.toFixed(4)}（理論値 1.5）` };
    }},
    { n: '高い壁（V₀ ≫ E）では透過がごく小さい', run() {
        const w = new QuantumWorld({ k0: 1.0, v0: 6, width: 3 }, { sigma: 2.5 });
        for (let i = 0; i < 4500; i++) w.step();
        const T = w.transmission();
        return { ok: T < .005, d: 'T = ' + T.toExponential(2) };
    }},
    { n: '壁が厚いほど透過が小さい（トンネルの指数則）', run() {
        const run = wd => {
          const w = new QuantumWorld({ k0: 1.2, v0: 1.2, width: wd }, { sigma: 2.5 });
          for (let i = 0; i < 4500; i++) w.step();
          return w.transmission();
        };
        const t3 = run(3), t8 = run(8);
        return { ok: t8 < t3 * .5 && t3 > 1e-6, d: `T(w=3)=${t3.toExponential(2)} → T(w=8)=${t8.toExponential(2)}` };
    }},
    { n: '同じ初期波束は同じ時間発展（決定論）', run() {
        const a = new QuantumWorld({ k0: 1.2, v0: 1, width: 3 }, { sigma: 2.5 });
        const b = new QuantumWorld({ k0: 1.2, v0: 1, width: 3 }, { sigma: 2.5 });
        for (let i = 0; i < 800; i++) { a.step(); b.step(); }
        let same = true;
        for (let j = 0; j < a.N; j++) if (a.re[j] !== b.re[j] || a.im[j] !== b.im[j]) { same = false; break; }
        return { ok: same, d: same ? 'bitwise identical' : 'mismatch' };
    }}
  ],
  BH01: [
    { n: '遠くを通る光の曲がり角が理論値 2r_s/b に一致', run() {
        const ray = traceRay(30, -400, 500);
        const th = 2 / 30;
        const rel = Math.abs(ray.defl - th) / th;
        return { ok: ray.fate === 'escaped' && rel < .1,
                 d: `δ = ${ray.defl?.toFixed(5)}（理論 ${th.toFixed(5)}、差 ${(rel*100).toFixed(1)}%）` };
    }},
    { n: '臨界値 b_c = 2.598 の内側は捕獲、外側は脱出', run() {
        const inside = traceRay(2.45), outside = traceRay(2.75);
        const ok = inside.fate === 'captured' && outside.fate === 'escaped';
        return { ok, d: `b=2.45 → ${inside.fate} / b=2.75 → ${outside.fate}` };
    }},
    { n: 'ヌル条件 H = 0 が積分の間 保たれる', run() {
        const ray = traceRay(4);
        const h = Math.abs(ray.hEnd);
        return { ok: h < 1e-6, d: '|H| = ' + h.toExponential(2) };
    }},
    { n: '正面（b=0）の光はまっすぐ落ちる', run() {
        const ray = traceRay(0);
        let maxY = 0;
        for (let i = 0; i < ray.pts.length; i += 2) maxY = Math.max(maxY, Math.abs(ray.pts[i + 1]));
        return { ok: ray.fate === 'captured' && maxY < 1e-9,
                 d: `fate=${ray.fate}, |y|max = ${maxY.toExponential(1)}` };
    }},
    { n: '同じ b は同じ経路（決定論）', run() {
        const a = traceRay(3.1), b = traceRay(3.1);
        const same = a.pts.length === b.pts.length && a.pts.every((v, i) => v === b.pts[i]);
        return { ok: same, d: same ? 'bitwise identical' : 'mismatch' };
    }}
  ]
});

const app = $('#app');
function parseHash() {
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, query] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const q = {};
  if (query) query.split('&').forEach(kv => {
    const [k, v] = kv.split('=');
    q[k] = decodeURIComponent(v || '');
  });
  return { parts, q };
}

  clearTickers();

  else if (parts[0] === 'explore') renderExplore(q);

function setupHero(cv, badge) {
  const p = { m1: 1, m2: 1, l1: 1, l2: 1, g: 9.81, damping: 0.008 };
  let world = new PendulumWorld(p, { t1: 118 * DEG, t2: -12 * DEG, w1: 0, w2: 0 });
  const clock = new Clock(1 / 240);
  clock.running = true;
  let grabbing = false, grabTarget = 2;

  const pointer = ev => {
    const r = cv.getBoundingClientRect();
    const t = ev.touches ? ev.touches[0] : ev;
    return { x: t.clientX - r.left, y: t.clientY - r.top, w: r.width, h: r.height };
  };
  const geo = (w, h) => ({
    cx: w / 2, cy: h * 0.32, sc: Math.min(w, h) / (2.35 * (p.l1 + p.l2))
  });
  const down = ev => {
    const pt = pointer(ev), g = geo(pt.w, pt.h), t = world.tip();
    const b1 = { x: g.cx + t.x1 * g.sc, y: g.cy + t.y1 * g.sc };
    const b2 = { x: g.cx + t.x2 * g.sc, y: g.cy + t.y2 * g.sc };
    const d1 = Math.hypot(pt.x - b1.x, pt.y - b1.y), d2 = Math.hypot(pt.x - b2.x, pt.y - b2.y);
    if (Math.min(d1, d2) > 46) return;
    grabbing = true; grabTarget = d2 <= d1 ? 2 : 1;
    clock.running = false;
    world.s[2] = 0; world.s[3] = 0;
    badge.textContent = 'はなすと動きだす';
    ev.preventDefault();
  };
  const move = ev => {
    if (!grabbing) return;
    const pt = pointer(ev), g = geo(pt.w, pt.h);
    if (grabTarget === 1) {
      world.s[0] = Math.atan2(pt.x - g.cx, pt.y - g.cy);
    } else {
      const t = world.tip();
      const p1 = { x: g.cx + t.x1 * g.sc, y: g.cy + t.y1 * g.sc };
      world.s[1] = Math.atan2(pt.x - p1.x, pt.y - p1.y);
    }
    world.trail.length = 0;
    ev.preventDefault();
  };
  const up = () => {
    if (!grabbing) return;
    grabbing = false; clock.running = true;
    badge.textContent = 'つかめます';
  };
  cv.addEventListener('mousedown', down);
  cv.addEventListener('touchstart', down, { passive: false });
  window.addEventListener('mousemove', move);
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('mouseup', up);
  window.addEventListener('touchend', up);

  let acc = 0;
  tickers.add(dt => {
    const n = clock.substeps(dt);
    for (let i = 0; i < n; i++) {
      world.step(clock.fixedDt);
      if (i % 4 === 0) world.record();
    }
    /* gentle re-energise so the hero never dies out completely */
    acc += dt;
    if (acc > 6) {
      acc = 0;
      const e = dpEnergy(world.s, p);
      if (e.ke < 0.4) { world.s[2] += 0.9; world.s[3] -= 0.6; }
    }
    const { ctx, w, h } = fitCanvas(cv);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
    /* soft concentric guide */
    ctx.strokeStyle = 'rgba(46,92,76,.06)'; ctx.lineWidth = 1;
    const g = geo(w, h);
    [p.l1, p.l1 + p.l2].forEach(R => {
      ctx.beginPath(); ctx.arc(g.cx, g.cy, R * g.sc, 0, TAU); ctx.stroke();
    });
    LABS.P02.draw(ctx, w, h, [world], { view: 'sim', trails: true, grabbing });
  });
}

/* small always-running preview simulation for cards */
function attachPreview(cv, lab) {
  const P = {}, I = {};
  lab.params.forEach(p => P[p.id] = p.def);
  (lab.initParams || []).forEach(p => I[p.id] = p.def);
  const pv = lab.preview || {};
  Object.assign(P, pv.P || {});
  Object.assign(I, pv.I || {});
  if (lab.id === 'R02') { P.walkerCount = 220; }
  if (lab.id === 'P02') { I.t1 = 120; I.t2 = -20; }
  let world = lab.makeWorld(P, I, 0);
  const clock = new Clock(lab.fixedDt, lab.speedScale);
  clock.running = true;
  clock.speed = pv.speed || (lab.id === 'M01' ? 0.35 : 1);
  let yaw = 0, restart = 0;
  tickers.add(dt => {
    const n = clock.substeps(dt);
    for (let i = 0; i < n; i++) {
      if (lab.id === 'P02') { world.step(clock.fixedDt); if (i % 4 === 0) world.record(); }
      else if (lab.discrete) world.step();
      else world.step(clock.fixedDt);
    }
    yaw += dt * 0.25;
    restart += dt;
    /* keep previews visually alive */
    if (lab.id === 'R02' && (world.step_ > 900 || restart > 22)) { restart = 0; world.seed = (world.seed + 7919) >>> 0; world.reseed(); }
    else if (pv.restartSec && restart > pv.restartSec) { restart = 0; world = lab.makeWorld(P, I, 0); }
    const { ctx, w, h } = fitCanvas(cv);
    lab.draw(ctx, w, h, [world], {
      view: pv.view || (lab.id === 'M01' ? 'cobweb' : lab.id === 'R02' ? 'many' : lab.id === 'A01' ? '3d' : 'sim'),
      trails: true, yaw
    });
  });
}

        BEHAVIOR[id].join(' ') + IDEA[id].join(' ')).toLowerCase();
      if (q && !text.includes(q)) return false;
      if (state.u && L.universeId !== state.u) return false;
      if (state.b && !BEHAVIOR[id].includes(state.b)) return false;
      if (state.i && !IDEA[id].includes(state.i)) return false;
      return true;
    });
    hits.forEach(id => grid.appendChild(makeLiveCard(LABS[id])));
    /* catalog (soon) cards appear once the user narrows by universe or search */
    let soonHits = [];
    if ((state.u || q) && !state.b && !state.i) {
      soonHits = CATALOG.filter(c => {
        if (LABS[c[0]]) return false;
        if (state.u && c[2] !== state.u) return false;
        if (q && !(c[0] + ' ' + c[1] + ' ' + UNI(c[2]).ja).toLowerCase().includes(q)) return false;
        return true;
      });
      soonHits.forEach(c => {
        const u = UNI(c[2]);
        const pri = c[5] === 'S' ? 'FLAGSHIP' : c[5] === 'A' ? 'NEXT' : '';
        const card = el('div', 'scard',
          `<span class="sbadge">準備中${pri ? ' · ' + pri : ''}</span>
           <b>${c[1]}</b>
           <small><i class="udot" style="background:${u.c}"></i>${u.ja} · ${c[0]} · <code>${c[3]}</code></small>`);
        soon.appendChild(card);
      });
    }
    soonWrap.hidden = soonHits.length === 0;
    empty.hidden = !(hits.length === 0 && soonHits.length === 0 && (state.u || q || state.b || state.i));
    hint.hidden = !!(state.u || q) || hits.length === 0;
  }
  $('#q', page).oninput = e => { state.q = e.target.value; draw(); };
  draw();
}

  app.appendChild(root);

  const ui = {
    view: lab.views[0].id, trails: true, worlds: 1, butterfly: false,

  let worlds = [];
  const clock = new Clock(lab.fixedDt, lab.speedScale);

  /* apply URL query (share state / preset link) */
  if (query.s) {

    if (d) {
      Object.keys(P).forEach(k => { if (d[k] != null) P[k] = d[k]; });
      Object.keys(I).forEach(k => { if (d['i_' + k] != null) I[k] = d['i_' + k]; });

    if (!pr) return;
    Object.assign(P, pr.p || {});

  function rebuild() {
    worlds = [];
    const n = ui.butterfly ? 2 : ui.worlds;
    for (let k = 0; k < n; k++) {
      const delta = k === 0 ? 0
        : (ui.butterfly ? lab.spread : lab.spread * k);
      worlds.push(lab.makeWorld(P, I, delta));
    }
    if (lab.id === 'M01') bifCache = bifCache; /* cache depends on size only */
    bflyHist.length = 0;
  }

  /* ---------------- view tabs ---------------- */
  const vt = $('#viewTabs', root);
  lab.views.forEach(v => {
    const b = el('button', 'pill' + (v.id === ui.view ? ' on' : ''), v.ja);
    b.onclick = () => {
