class EcoGridWorld {
  constructor(cfg, p, init) {
    this.cfg = cfg; this.p = Object.assign({}, p);
    this.L = 90;
    const n = this.L * this.L;
    this.s = new Uint8Array(n);          /* 0 empty, 1 prey/species1, 2 predator/species2 */
    this.rng = SeededRNG((init.seed || 14) >>> 0);
    this.t = 0; this.hist1 = []; this.hist2 = [];
    for (let i = 0; i < n; i++) {
      const r = this.rng.next();
      this.s[i] = r < .25 ? 1 : r < .32 ? 2 : 0;
    }
    if (cfg.mode === 'meta') {
      this.s.fill(0);
      for (let i = 0; i < n; i++) if (this.rng.next() < .4) this.s[i] = 1;
    }
    if (cfg.mode === 'succession') this.s.fill(0);
  }
  idx(x, y) { return ((y + this.L) % this.L) * this.L + ((x + this.L) % this.L); }
  step() {
    const L = this.L, n = L * L, p = this.p, m = this.cfg.mode, s = this.s, rng = this.rng;
    this.t++;
    const upd = m === 'meta' || m === 'succession' ? n / 2 : n;
    for (let k = 0; k < upd; k++) {
      const i = rng.int(n);
      const x = i % L, y = (i / L) | 0;
      const j = this.idx(x + [1, -1, 0, 0][rng.int(4)], y + [0, 0, 1, -1][rng.int(4)]);
      if (m === 'pp') {
        if (s[i] === 1) {                     /* prey reproduces into empty */
          if (s[j] === 0 && rng.next() < p.birth) s[j] = 1;
        } else if (s[i] === 2) {
          if (s[j] === 1 && rng.next() < p.eat) s[j] = 2;         /* eat & reproduce */
          else if (rng.next() < p.death) s[i] = 0;                 /* starve */
        }
      } else if (m === 'compete') {
        if (s[i] && s[j] === 0 && rng.next() < (s[i] === 1 ? p.g1 : p.g2)) s[j] = s[i];
        else if (s[i] && rng.next() < .02) s[i] = 0;
      } else if (m === 'meta') {
        if (s[i] === 1 && rng.next() < p.ext) s[i] = 0;            /* patch extinction */
        if (s[i] === 0 && s[j] === 1 && rng.next() < p.col) s[i] = 1;
      } else if (m === 'succession') {
        /* 0 bare → 1 grass → 2 shrub → 3 forest */
        if (s[i] === 0 && (s[j] >= 1 || rng.next() < .002)) { if (rng.next() < .3) s[i] = 1; }
        else if (s[i] >= 1 && s[i] < 3 && rng.next() < p.grow * (s[j] >= s[i] ? 1.6 : 1)) s[i]++;
        else if (s[i] === 3 && rng.next() < p.dist) s[i] = 0;      /* disturbance */
      }
    }
    let c1 = 0, c2 = 0;
    for (let i = 0; i < n; i++) { if (s[i] === 1) c1++; if (s[i] === 2) c2++; }
    this.hist1.push(c1 / n); this.hist2.push(c2 / n);
    if (this.hist1.length > 600) { this.hist1.shift(); this.hist2.shift(); }
  }
  sample() { return [this.hist1[this.hist1.length - 1] || 0]; }
}

class FieldWorld {

        this.pts.push({ x: -1.6, y: -.5 + i * .15, vx: 1.1, vy: 0, trail: [] });
    } else if (m === 'induction') {
      this.hist = [];
    }
  }
  E(x, y) {
    let ex = 0, ey = 0;
    for (const c of this.charges) {
      const dx = x - c.x, dy = y - c.y;
      const r2 = dx * dx + dy * dy + .003;
      const f = c.q / (r2 * Math.sqrt(r2));
      ex += dx * f; ey += dy * f;
    }
    return [ex, ey];
  }
  step(dt) {
    const m = this.cfg.mode, p = this.p;
    this.t += dt;
    if (m === 'lorentz') {
      const q = 1, B = p.B || 1, Ex = p.Ex || 0;
      for (let it = 0; it < 4; it++) {
        const v = this.pt;
        const ax = q * (Ex + v.vy * B), ay = q * (-v.vx * B);
        v.vx += ax * dt; v.vy += ay * dt;
        v.x += v.vx * dt; v.y += v.vy * dt;
        this.trail.push(v.x, v.y);
        if (this.trail.length > 5000) this.trail.splice(0, 2);
      }
    }
    if (m === 'orbitCharge') {
      for (const pt of this.pts) {
        const dx = -pt.x, dy = -pt.y;
        const r2 = dx * dx + dy * dy + .01;
        const f = (p.q || 3) / (r2 * Math.sqrt(r2));
        pt.vx += dx * f * dt * (p.attract > .5 ? 1 : -1);
        pt.vy += dy * f * dt * (p.attract > .5 ? 1 : -1);
        pt.x += pt.vx * dt; pt.y += pt.vy * dt;
        pt.trail.push(pt.x, pt.y);
        if (pt.trail.length > 1200) pt.trail.splice(0, 2);
        if (Math.abs(pt.x) > 2.4 || Math.abs(pt.y) > 2) {
          pt.x = -1.6; pt.y = -.5 + this.pts.indexOf(pt) * .15;
          pt.vx = 1.1; pt.vy = 0; pt.trail.length = 0;
        }

      const xm = Math.sin(this.t * (p.speed || 1.4)) * 1.2;
      const phi = Math.exp(-xm * xm * 3);
      const last = this._phi != null ? this._phi : phi;
      this._phi = phi;
      this.hist.push(-(phi - last) / dt);
      if (this.hist.length > 700) this.hist.shift();
    }
  }

}

/* =========================================================================
 * GENERIC LAB WIRING — thumbnails, defaults, bulk healthcheck
 * ======================================================================= */
function labDefaults(lab) {
  const P = {}, I = {};
  (lab.params || []).forEach(p => P[p.id] = p.def);
  (lab.initParams || []).forEach(p => I[p.id] = p.def);
  /* apply first preset so each lab opens in its intended regime */
  const pr = lab.presets && lab.presets[0];
  if (pr) { Object.assign(P, pr.p || {}); Object.assign(I, pr.i || {}); }
  return { P, I };
}
/* idle thumbnail queue (cancelled on navigation via generation token) */
let thumbGen = 0;
const thumbQueue = [];
let thumbPump = null;
function queueThumb(fn) {
  thumbQueue.push({ gen: thumbGen, fn });
  if (!thumbPump) thumbPump = setTimeout(pumpThumbs, 30);
}
function pumpThumbs() {
  thumbPump = null;
  const started = performance.now();
  while (thumbQueue.length && performance.now() - started < 24) {
    const item = thumbQueue.shift();
    if (item.gen !== thumbGen) continue;
    try { item.fn(); } catch (e) { console.warn('thumb', e); }
  }
  if (thumbQueue.length) thumbPump = setTimeout(pumpThumbs, 40);
}
function renderThumbInto(cv, id) {
  const lab = ensureLab(id);
  if (!lab) return;
  const { P, I } = labDefaults(lab);
  const world = lab.makeWorld(P, I, 0);
  const steps = lab.thumbSteps != null ? lab.thumbSteps : (lab.discrete ? 130 : 500);
  for (let i = 0; i < steps; i++) {
    if (lab.discrete) world.step();
    else world.step(lab.fixedDt);
    if (lab.id === 'P02' && world.record && i % 4 === 0) world.record();
  }
  const { ctx, w, h } = fitCanvas(cv);
  const ui = { view: (lab.preview && lab.preview.view) || lab.views[0].id, trails: true, yaw: .7 };
  const draws = lab.thumbDraws || 1;
  for (let k = 0; k < draws; k++) lab.draw(ctx, w, h, [world], ui);
}

 * ----------------------------------------------------------------------- */
function renderLabCheck() {
  const page = el('div', 'page');
  page.innerHTML = `
  <div class="wrap" style="padding-top:30px;padding-bottom:60px">
    <div class="sec-label">HEALTHCHECK</div>
    <h1 class="serif" style="font-size:26px;color:var(--forest-deep)">全ラボ動作検査</h1>
    <p style="font-size:12.5px;color:var(--ink-soft);margin:8px 0 18px">
      すべての現象について、生成 → シミュレーション実行 → 有限値チェック → 全ビュー描画 を行います。</p>
    <div class="tsummary"><b id="lcCount">0</b><span style="font-size:12px;color:var(--ink-soft)" id="lcStatus">実行中…</span></div>
    <div id="lcFails"></div>
  </div>`;
  app.appendChild(page);
  const ids = [];
  LAB_ORDER.forEach(id => ids.push(id));
  Object.keys(GLABS).forEach(id => { if (!ids.includes(id)) ids.push(id); });
  const results = [];
  const off = document.createElement('canvas');
  off.style.cssText = 'position:absolute;left:-9999px;width:360px;height:240px';
  document.body.appendChild(off);
  let i = 0;
  function runOne() {
    if (i >= ids.length) {
      off.remove();
      const fails = results.filter(r => !r.ok);
      $('#lcCount', page).textContent = (results.length - fails.length) + '/' + results.length;
      $('#lcStatus', page).textContent = fails.length ? fails.length + ' 件の失敗' : '全ラボが正常に動作しています。';
      $('#lcFails', page).innerHTML = fails.map(f =>
        `<div class="trow"><span class="st fail">FAIL</span><span class="tn">${f.id}<small>${f.err}</small></span></div>`).join('');
      window.__labcheck = results;
      return;
    }
    const id = ids[i++];
    let ok = true, err = '';
    try {
      const lab = ensureLab(id);
      if (!lab) throw new Error('ラボを生成できません');
      const { P, I } = labDefaults(lab);
      const world = lab.makeWorld(P, I, 0);
      const steps = Math.min(lab.thumbSteps != null ? lab.thumbSteps : (lab.discrete ? 40 : 120), 200);
      for (let k = 0; k < steps; k++) {
        if (lab.discrete) world.step(); else world.step(lab.fixedDt);
      }
      if (world.sample && !finiteSample(world.sample())) throw new Error('状態に NaN/Inf');
      const { ctx, w, h } = fitCanvas(off);
      for (const v of lab.views) {
        lab.draw(ctx, w, h, [world], { view: v.id, trails: true, yaw: .5 });
      }
      if (lab.metrics) lab.metrics([world]);
    } catch (e) { ok = false; err = (e && e.message) || String(e); }
    results.push({ id, ok, err });
    $('#lcCount', page).textContent = results.filter(r => r.ok).length + '/' + ids.length;
    if (!ok) {
      $('#lcFails', page).insertAdjacentHTML('beforeend',
        `<div class="trow"><span class="st fail">FAIL</span><span class="tn">${id}<small>${err}</small></span></div>`);
    }
    setTimeout(runOne, 0);
  }
  runOne();
}

  if (query) query.split('&').forEach(kv => {

function setupHero(cv, badge) {
  const p = { m1: 1, m2: 1, l1: 1, l2: 1, g: 9.81, damping: 0.008 };
  let world = new PendulumWorld(p, { t1: 118 * DEG, t2: -12 * DEG, w1: 0, w2: 0 });
  const clock = new Clock(1 / 240);
  clock.running = true;
  let grabbing = false, grabTarget = 2;

  const pointer = ev => {
    const r = cv.getBoundingClientRect();
    const t = ev.touches ? ev.touches[0] : ev;
    return { x: t.clientX - r.left, y: t.clientY - r.top, w: r.width, h: r.height };
  };
  const geo = (w, h) => ({
    cx: w / 2, cy: h * 0.32, sc: Math.min(w, h) / (2.35 * (p.l1 + p.l2))
  });
  const down = ev => {
    const pt = pointer(ev), g = geo(pt.w, pt.h), t = world.tip();
    const b1 = { x: g.cx + t.x1 * g.sc, y: g.cy + t.y1 * g.sc };
    const b2 = { x: g.cx + t.x2 * g.sc, y: g.cy + t.y2 * g.sc };
    const d1 = Math.hypot(pt.x - b1.x, pt.y - b1.y), d2 = Math.hypot(pt.x - b2.x, pt.y - b2.y);
    if (Math.min(d1, d2) > 46) return;
    grabbing = true; grabTarget = d2 <= d1 ? 2 : 1;
    clock.running = false;
    world.s[2] = 0; world.s[3] = 0;
    badge.textContent = 'はなすと動きだす';
    ev.preventDefault();
  };
  const move = ev => {
    if (!grabbing) return;
    const pt = pointer(ev), g = geo(pt.w, pt.h);
    if (grabTarget === 1) {
      world.s[0] = Math.atan2(pt.x - g.cx, pt.y - g.cy);
    } else {
      const t = world.tip();
      const p1 = { x: g.cx + t.x1 * g.sc, y: g.cy + t.y1 * g.sc };
      world.s[1] = Math.atan2(pt.x - p1.x, pt.y - p1.y);
    }
    world.trail.length = 0;
    ev.preventDefault();
  };
  const up = () => {
    if (!grabbing) return;
    grabbing = false; clock.running = true;
    badge.textContent = 'つかめます';
  };
  cv.addEventListener('mousedown', down);
  cv.addEventListener('touchstart', down, { passive: false });
  window.addEventListener('mousemove', move);
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('mouseup', up);
  window.addEventListener('touchend', up);

  let acc = 0;
  tickers.add(dt => {
    const n = clock.substeps(dt);
    for (let i = 0; i < n; i++) {
      world.step(clock.fixedDt);
      if (i % 4 === 0) world.record();
    }
    /* gentle re-energise so the hero never dies out completely */
    acc += dt;
    if (acc > 6) {
      acc = 0;
      const e = dpEnergy(world.s, p);
      if (e.ke < 0.4) { world.s[2] += 0.9; world.s[3] -= 0.6; }
    }
    const { ctx, w, h } = fitCanvas(cv);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
    /* soft concentric guide */
    ctx.strokeStyle = 'rgba(46,92,76,.06)'; ctx.lineWidth = 1;
    const g = geo(w, h);
    [p.l1, p.l1 + p.l2].forEach(R => {
      ctx.beginPath(); ctx.arc(g.cx, g.cy, R * g.sc, 0, TAU); ctx.stroke();
    });
    LABS.P02.draw(ctx, w, h, [world], { view: 'sim', trails: true, grabbing });
  });
}

/* small always-running preview simulation for cards */
function attachPreview(cv, lab) {
  const P = {}, I = {};
  lab.params.forEach(p => P[p.id] = p.def);
  (lab.initParams || []).forEach(p => I[p.id] = p.def);
  const pv = lab.preview || {};
  Object.assign(P, pv.P || {});
  Object.assign(I, pv.I || {});
  if (lab.id === 'R02') { P.walkerCount = 220; }
  if (lab.id === 'P02') { I.t1 = 120; I.t2 = -20; }
  let world = lab.makeWorld(P, I, 0);
  const clock = new Clock(lab.fixedDt, lab.speedScale);
  clock.running = true;
  clock.speed = pv.speed || (lab.id === 'M01' ? 0.35 : 1);
  let yaw = 0, restart = 0;
  tickers.add(dt => {
    const n = clock.substeps(dt);
    for (let i = 0; i < n; i++) {
      if (lab.id === 'P02') { world.step(clock.fixedDt); if (i % 4 === 0) world.record(); }
      else if (lab.discrete) world.step();
      else world.step(clock.fixedDt);
    }
    yaw += dt * 0.25;
    restart += dt;
    /* keep previews visually alive */
    if (lab.id === 'R02' && (world.step_ > 900 || restart > 22)) { restart = 0; world.seed = (world.seed + 7919) >>> 0; world.reseed(); }
    else if (pv.restartSec && restart > pv.restartSec) { restart = 0; world = lab.makeWorld(P, I, 0); }
    const { ctx, w, h } = fitCanvas(cv);
    lab.draw(ctx, w, h, [world], {
      view: pv.view || (lab.id === 'M01' ? 'cobweb' : lab.id === 'R02' ? 'many' : lab.id === 'A01' ? '3d' : 'sim'),
      trails: true, yaw
    });
  });
}

}

  root.querySelectorAll('.mtabs .pill').forEach(b => {
    b.onclick = () => {
      root.querySelectorAll('.mtabs .pill').forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      pl.classList.toggle('open', b.dataset.drawer === 'left');
      pr2.classList.toggle('open', b.dataset.drawer === 'right');
    };
  });

  /* ---------------- share ---------------- */
  $('#btnShare', root).onclick = () => {
    const payload = Object.assign({}, P, { view: ui.view, worlds: ui.worlds });
    Object.keys(I).forEach(k => payload['i_' + k] = I[k]);
    const url = location.origin + location.pathname + '#/lab/' + lab.id + '?s=' + encodeState(payload);
    openModal(`
      <h2 class="serif">この状態を共有する</h2>
      <p class="msub">パラメータ・初期条件・表示モードがURLに入ります。開くと同じ状態から再現されます。</p>
      <div class="sharefield"><input readonly value="${url}"><button class="pill" id="cpy">コピー</button></div>
      <div style="margin-top:14px;font-size:11.5px;color:var(--ink-muted);line-height:1.8">
        シリアライズはキー順で安定化されており、同じ状態からは常に同じ文字列が生成されます。
      </div>
      <div class="mfoot"><button class="btn-ghost" data-close>閉じる</button></div>`,
      m => {
        $('#cpy', m).onclick = () => {
          const i = $('input', m); i.select();
          navigator.clipboard ? navigator.clipboard.writeText(url).then(() => toast('コピーしました')) : document.execCommand('copy');
          toast('コピーしました');
        };
      });
  };

  /* ---------------- tests ---------------- */
  $('#btnTests', root).onclick = () => {
    const list = TESTS[lab.id] || [];
    const results = list.map(t => {
      const t0 = performance.now();
      let r;
      try { r = t.run(); } catch (e) { r = { ok: false, d: 'エラー: ' + e.message }; }
      return { n: t.n, ok: r.ok, d: r.d, ms: performance.now() - t0 };
    });
    const pass = results.filter(r => r.ok).length;
    openModal(`
      <h2 class="serif">科学的テスト — ${lab.titleJa}</h2>
      <p class="msub">保存則・平衡・収束・決定論をブラウザ上で実行しています。</p>
      <div class="tsummary"><b>${pass}/${results.length}</b><span style="font-size:12px;color:var(--ink-soft)">
        ${pass === results.length ? 'すべて通過しました。' : '失敗したテストがあります。'}</span></div>
      ${results.map(r => `
        <div class="trow">
          <span class="st ${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}</span>
          <span class="tn">${r.n}<small>${r.d} · ${r.ms.toFixed(1)} ms</small></span>
        </div>`).join('')}
      <div class="mfoot"><button class="btn-solid" data-close>閉じる</button></div>`);
  };

  /* ---------------- pointer grab (P02) ---------------- */
  const cv = $('#cv', root);
  if (lab.features.grab) {
    let grabTarget = 2;
    const pointer = ev => {
      const r = cv.getBoundingClientRect();
      const t = ev.touches ? ev.touches[0] : ev;
      return { x: t.clientX - r.left, y: t.clientY - r.top, w: r.width, h: r.height };
    };
    const down = ev => {
      if (ui.view !== 'sim') return;
      const pt = pointer(ev), w0 = worlds[0];
      const span = w0.p.l1 + w0.p.l2, sc = Math.min(pt.w, pt.h) / (2.35 * span);
      const cx = pt.w / 2, cy = pt.h * .34, t = w0.tip();
      const b1 = { x: cx + t.x1 * sc, y: cy + t.y1 * sc }, b2 = { x: cx + t.x2 * sc, y: cy + t.y2 * sc };
      const d1 = Math.hypot(pt.x - b1.x, pt.y - b1.y), d2 = Math.hypot(pt.x - b2.x, pt.y - b2.y);
      if (Math.min(d1, d2) > 46) return;
      grabTarget = d2 <= d1 ? 2 : 1;
      ui.grabbing = true;
      worlds.forEach(w => { w.s[2] = 0; w.s[3] = 0; w.trail.length = 0; });
      ev.preventDefault();
    };
    const move = ev => {
      if (!ui.grabbing) return;
      const pt = pointer(ev), w0 = worlds[0];
      const span = w0.p.l1 + w0.p.l2, sc = Math.min(pt.w, pt.h) / (2.35 * span);
      const cx = pt.w / 2, cy = pt.h * .34;
      worlds.forEach((w, k) => {
        const d = k === 0 ? 0 : (ui.butterfly ? lab.spread : lab.spread * k) * DEG;
        if (grabTarget === 1) w.s[0] = Math.atan2(pt.x - cx, pt.y - cy) + d;
        else {
          const t = w.tip();
          const p1 = { x: cx + t.x1 * sc, y: cy + t.y1 * sc };
          w.s[1] = Math.atan2(pt.x - p1.x, pt.y - p1.y);
        }
        w.trail.length = 0;
      });
      /* keep the initial-angle slider in sync with the grab */
      I.t1 = worlds[0].s[0] / DEG; I.t2 = worlds[0].s[1] / DEG;
      syncControls();
      ev.preventDefault();
    };
    const up = () => { ui.grabbing = false; };
    cv.addEventListener('mousedown', down);
    cv.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  }
  if (lab.setupPointer)
    lab.setupPointer(cv, { getWorlds: () => worlds, rebuild, P, I, ui, syncControls });

  /* ---------------- badges ---------------- */
  const badge = $('#vpBadge', root);
  function updateBadge() {
    const n = worlds.length;
    badge.innerHTML =
      `<span class="bd acc" style="--acc:${lab.accent}">${lab.universeJa.toUpperCase()}</span>` +
      `<span class="bd">${n === 1 ? '1 WORLD' : n + ' WORLDS'}</span>` +
      (clock.speed !== 1 ? `<span class="bd">${clock.speed}× SPEED</span>` : '') +
      (clock.running ? '' : '<span class="bd">PAUSED</span>');
  }

  /* ---------------- butterfly readout ---------------- */
  const bflyHist = [];
  function separation() {
    if (worlds.length < 2) return 0;
    const a = worlds[0], b = worlds[1];
    if (lab.id === 'P02') return Math.hypot(a.s[0]-b.s[0], a.s[1]-b.s[1], a.s[2]-b.s[2], a.s[3]-b.s[3]);
    if (lab.id === 'A01') return Math.hypot(a.s[0]-b.s[0], a.s[1]-b.s[1], a.s[2]-b.s[2]);
    if (lab.id === 'M01') return Math.abs(a.x - b.x);
    return 0;
  }
  function updateBfly() {
    if (!ui.butterfly) return;
    const d = separation();
    $('#bflyVal', root).textContent = d === 0 ? '0' : d.toExponential(3);
    $('#bflySub', root).textContent = 'log₁₀ 差 = ' + (d > 0 ? Math.log10(d).toFixed(2) : '—');
    bflyHist.push(d);
    if (bflyHist.length > 40) bflyHist.shift();
    const mx = Math.max(...bflyHist.map(v => Math.log10(Math.max(v, 1e-12))));
    const mn = Math.min(...bflyHist.map(v => Math.log10(Math.max(v, 1e-12))));
    const sp = $('#bflySpark', root);
    sp.innerHTML = bflyHist.map((v, i) => {
      const lv = Math.log10(Math.max(v, 1e-12));
      const hgt = mx > mn ? ((lv - mn) / (mx - mn)) * 100 : 4;
      return `<i class="${i === bflyHist.length - 1 ? 'hi' : ''}" style="height:${Math.max(3, hgt)}%"></i>`;
    }).join('');
  }

  /* ---------------- metrics ---------------- */
  const mh = $('#metrics', root);
  function updateMetrics() {
    const rows = lab.metrics(worlds);
    if (mh.children.length !== rows.length) {
      mh.innerHTML = rows.map(() => '<div class="metric"><span class="mk"></span><span class="mv"></span></div>').join('');
    }
    rows.forEach((r, i) => {
      const n = mh.children[i];
      n.classList.toggle('hot', !!r.hot);
      $('.mk', n).textContent = r.k;
      $('.mv', n).textContent = r.v;
    });
  }

  /* ---------------- main loop ---------------- */
  rebuild();
  let uiAcc = 0;
  tickers.add(dt => {
    const n = clock.substeps(dt);
    for (let i = 0; i < n; i++) {
      if (lab.discrete) worlds.forEach(w => w.step());
      else worlds.forEach(w => {
        w.step(clock.fixedDt);
        if (lab.id === 'P02' && i % 4 === 0) w.record();
      });
    }
    if (lab.id === 'A01' && ui.autoRotate && ui.view === '3d') ui.yaw += dt * 0.22;
    if (lab.onTick) lab.onTick(ui, dt);
    const { ctx, w, h } = fitCanvas(cv);
    lab.draw(ctx, w, h, worlds, ui);
    uiAcc += dt;
    if (uiAcc > 0.1) { uiAcc = 0; updateMetrics(); updateBadge(); updateBfly(); }
  });
}

/* =========================================================================
 * MODAL
 * ======================================================================= */
function openModal(html, after) {
  const scrim = el('div', 'scrim');
  const m = el('div', 'modal', html);
  scrim.appendChild(m);
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.onclick = e => { if (e.target === scrim) close(); };
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); }
  });
  if (after) after(m);
  return m;
}
