    vt.appendChild(b);
  });

  /* ---------------- presets ---------------- */
  const ph = $('#presets', root);
  lab.presets.forEach(pr => {
    const b = el('button', 'preset', `<span>${pr.ja}</span><em>${pr.en}</em>`);
    b.onclick = () => {
      [...ph.children].forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      applyPreset(pr);
    };
    ph.appendChild(b);
  });

  /* ---------------- manifest-driven sliders ---------------- */
  const sliderRefs = [];
  function makeSlider(host, spec, target, isInit) {
    const row = el('div', 'slider-row');
    row.innerHTML = `
      <div class="sl-top">
        <span class="lb"><i>${spec.sym}</i>${spec.ja}</span>
        <span class="vl"></span>
      </div>`;
    const input = el('input');
    input.type = 'range';
    input.min = spec.min; input.max = spec.max; input.step = spec.step;
    input.value = target[spec.id];
    row.appendChild(input);
    const vl = $('.vl', row);
    const decimals = spec.step >= 1 ? 0 : Math.min(6, String(spec.step).split('.')[1].length);
    const show = () => {
      vl.innerHTML = Number(target[spec.id]).toFixed(decimals) +
        (spec.unit ? `<small>${spec.unit}</small>` : '');
    };
    show();
    input.oninput = () => {
      target[spec.id] = +input.value;
      show();
      if (isInit || spec.reset) rebuild();
      else worlds.forEach(w => { if (w.p) Object.assign(w.p, P); });
      if (lab.id === 'M01' && spec.id === 'r') { /* bifurcation marker follows r */ }
    };
    host.appendChild(row);
    sliderRefs.push({ spec, input, show, target });
  }
  const sh = $('#sliders', root), ish = $('#initSliders', root);
  lab.params.forEach(p => makeSlider(sh, p, P, false));
  (lab.initParams || []).forEach(p => makeSlider(ish, p, I, true));
  if (!lab.params.length) sh.closest('.psec').hidden = true;
  if (!(lab.initParams || []).length && lab.id !== 'R02') ish.closest('.psec').hidden = true;
  if (lab.id === 'R02') {
    const b = el('button', 'pill', 'シードを変える');
    b.style.marginTop = '4px';
    b.onclick = () => {
      I.seed = (I.seed * 1103515245 + 12345) >>> 0 % 99999999 || 7;
      syncControls(); rebuild();
    };
    ish.appendChild(b);
  }
  function syncControls() {
    sliderRefs.forEach(r => { r.input.value = r.target[r.spec.id]; r.show(); });
  }

  /* ---------------- worlds ---------------- */
  const ws = $('#worldSeg', root);
  if (lab.features.worlds) {
    [1, 2, 10, 50].forEach(n => {
      const b = el('button', 'pill' + (n === ui.worlds ? ' on' : ''), n === 1 ? '1' : n + '');
      b.onclick = () => {
        ui.worlds = n; ui.butterfly = false;
        [...ws.children].forEach(c => c.classList.remove('on'));
        b.classList.add('on');
        $('#bfly', root).hidden = true;
        btnB.classList.remove('on');
        rebuild();
      };
      ws.appendChild(b);
    });
  } else {
    $('#worldSec', root).hidden = true;
  }

  /* ---------------- toolbar ---------------- */
  const tb = $('#toolbar', root);
  const playBtn = el('button', 'playbtn');
  const setPlayIcon = () => {
    playBtn.innerHTML = clock.running
      ? '<svg width="12" height="13" viewBox="0 0 12 13" fill="#fff"><rect x="1" y="1" width="3.4" height="11" rx="1"/><rect x="7.6" y="1" width="3.4" height="11" rx="1"/></svg>'
      : '<svg width="12" height="13" viewBox="0 0 12 13" fill="#fff"><path d="M1.6 1.3 11 6.5 1.6 11.7Z"/></svg>';
  };
  setPlayIcon();
  playBtn.onclick = () => { clock.running = !clock.running; setPlayIcon(); };
  tb.appendChild(playBtn);

  const mk = (label, fn, cls) => {
    const b = el('button', 'pill' + (cls ? ' ' + cls : ''), label);
    b.onclick = () => fn(b);
    tb.appendChild(b);
    return b;
  };
  mk('リセット', () => { rebuild(); });
  mk('ステップ', () => {
    if (lab.discrete) worlds.forEach(w => w.step());
    else worlds.forEach(w => { w.step(clock.fixedDt); if (w.record) w.record(); });
  });
  tb.appendChild(el('span', 'tsep'));
  tb.appendChild(el('span', 'tlabel', 'SPEED'));
  [0.1, 1, 4].forEach(s => {
    const b = el('button', 'pill' + (s === 1 ? ' on' : ''), s + '×');
    b.onclick = () => {
      clock.speed = s;
      [...tb.querySelectorAll('[data-speed]')].forEach(c => c.classList.remove('on'));
      b.classList.add('on');
    };
    b.dataset.speed = s;
    tb.appendChild(b);
  });
  tb.appendChild(el('span', 'tsep'));
  if (lab.features.trails) {
    mk('軌跡', b => { ui.trails = !ui.trails; b.classList.toggle('on', ui.trails); }).classList.add('on');
  }
  let btnB = { classList: { remove() {}, toggle() {} } };
  if (lab.features.butterfly) {
    btnB = mk('🦋 バタフライ', b => {
      ui.butterfly = !ui.butterfly;
      b.classList.toggle('on', ui.butterfly);
      $('#bfly', root).hidden = !ui.butterfly;
      if (ui.butterfly) ui.worlds = 2;
      [...ws.children].forEach(c => c.classList.remove('on'));
      rebuild();
    }, 'gold');
  }
  if (lab.id === 'A01') {
    mk('自動回転', b => { ui.autoRotate = !ui.autoRotate; b.classList.toggle('on', ui.autoRotate); }).classList.add('on');
  }
  (lab.extraTools || []).forEach(tl => {
    mk(tl.label, () => tl.fn({ getWorlds: () => worlds, rebuild, P, I, ui, syncControls }));
  });

  /* ---------------- related ---------------- */
  const rel = $('#related', root);
  lab.learn.related.forEach(id => {
    const L = labMeta(id);
    if (!L) return;
    const b = el('button', 'relcard',
      `<span class="rd" style="--c:${L.accent}"></span>
       <span class="rt"><b>${L.titleJa}</b><small>${L.subtitleJa}</small></span>
       <span style="color:var(--ink-muted);font-size:12px">→</span>`);
    b.style.setProperty('--c', L.accent);
    b.onclick = () => { location.hash = '#/lab/' + id; };
    rel.appendChild(b);
  });

  /* ---------------- mobile drawers ---------------- */
  const pl = $('#panelLeft', root), pr2 = $('#panelRight', root);
  root.querySelectorAll('.mtabs .pill').forEach(b => {
    b.onclick = () => {
      root.querySelectorAll('.mtabs .pill').forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      pl.classList.toggle('open', b.dataset.drawer === 'left');
      pr2.classList.toggle('open', b.dataset.drawer === 'right');
    };
  });

  /* ---------------- share ---------------- */
  $('#btnShare', root).onclick = () => {
    const payload = Object.assign({}, P, { view: ui.view, worlds: ui.worlds });
    Object.keys(I).forEach(k => payload['i_' + k] = I[k]);
    const url = location.origin + location.pathname + '#/lab/' + lab.id + '?s=' + encodeState(payload);
    openModal(`
      <h2 class="serif">この状態を共有する</h2>
      <p class="msub">パラメータ・初期条件・表示モードがURLに入ります。開くと同じ状態から再現されます。</p>
      <div class="sharefield"><input readonly value="${url}"><button class="pill" id="cpy">コピー</button></div>
      <div style="margin-top:14px;font-size:11.5px;color:var(--ink-muted);line-height:1.8">
        シリアライズはキー順で安定化されており、同じ状態からは常に同じ文字列が生成されます。
      </div>
      <div class="mfoot"><button class="btn-ghost" data-close>閉じる</button></div>`,
      m => {
        $('#cpy', m).onclick = () => {
          const i = $('input', m); i.select();
          navigator.clipboard ? navigator.clipboard.writeText(url).then(() => toast('コピーしました')) : document.execCommand('copy');
          toast('コピーしました');
        };
      });
  };

  /* ---------------- tests ---------------- */
  $('#btnTests', root).onclick = () => {
    const list = TESTS[lab.id] || [];
    const results = list.map(t => {
      const t0 = performance.now();
      let r;
      try { r = t.run(); } catch (e) { r = { ok: false, d: 'エラー: ' + e.message }; }
      return { n: t.n, ok: r.ok, d: r.d, ms: performance.now() - t0 };
    });
    const pass = results.filter(r => r.ok).length;
    openModal(`
      <h2 class="serif">科学的テスト — ${lab.titleJa}</h2>
      <p class="msub">保存則・平衡・収束・決定論をブラウザ上で実行しています。</p>
      <div class="tsummary"><b>${pass}/${results.length}</b><span style="font-size:12px;color:var(--ink-soft)">
        ${pass === results.length ? 'すべて通過しました。' : '失敗したテストがあります。'}</span></div>
      ${results.map(r => `
        <div class="trow">
          <span class="st ${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}</span>
          <span class="tn">${r.n}<small>${r.d} · ${r.ms.toFixed(1)} ms</small></span>
        </div>`).join('')}
      <div class="mfoot"><button class="btn-solid" data-close>閉じる</button></div>`);
  };

  /* ---------------- pointer grab (P02) ---------------- */
  const cv = $('#cv', root);
  if (lab.features.grab) {
    let grabTarget = 2;
    const pointer = ev => {
      const r = cv.getBoundingClientRect();
      const t = ev.touches ? ev.touches[0] : ev;
      return { x: t.clientX - r.left, y: t.clientY - r.top, w: r.width, h: r.height };
    };
    const down = ev => {
      if (ui.view !== 'sim') return;
      const pt = pointer(ev), w0 = worlds[0];
      const span = w0.p.l1 + w0.p.l2, sc = Math.min(pt.w, pt.h) / (2.35 * span);
      const cx = pt.w / 2, cy = pt.h * .34, t = w0.tip();
      const b1 = { x: cx + t.x1 * sc, y: cy + t.y1 * sc }, b2 = { x: cx + t.x2 * sc, y: cy + t.y2 * sc };
      const d1 = Math.hypot(pt.x - b1.x, pt.y - b1.y), d2 = Math.hypot(pt.x - b2.x, pt.y - b2.y);
      if (Math.min(d1, d2) > 46) return;
      grabTarget = d2 <= d1 ? 2 : 1;
      ui.grabbing = true;
      worlds.forEach(w => { w.s[2] = 0; w.s[3] = 0; w.trail.length = 0; });
      ev.preventDefault();
    };
    const move = ev => {
      if (!ui.grabbing) return;
      const pt = pointer(ev), w0 = worlds[0];
      const span = w0.p.l1 + w0.p.l2, sc = Math.min(pt.w, pt.h) / (2.35 * span);
      const cx = pt.w / 2, cy = pt.h * .34;
      worlds.forEach((w, k) => {
        const d = k === 0 ? 0 : (ui.butterfly ? lab.spread : lab.spread * k) * DEG;
        if (grabTarget === 1) w.s[0] = Math.atan2(pt.x - cx, pt.y - cy) + d;
        else {
          const t = w.tip();
          const p1 = { x: cx + t.x1 * sc, y: cy + t.y1 * sc };
          w.s[1] = Math.atan2(pt.x - p1.x, pt.y - p1.y);
        }
        w.trail.length = 0;
      });
      /* keep the initial-angle slider in sync with the grab */
      I.t1 = worlds[0].s[0] / DEG; I.t2 = worlds[0].s[1] / DEG;
      syncControls();
      ev.preventDefault();
    };
    const up = () => { ui.grabbing = false; };
    cv.addEventListener('mousedown', down);
    cv.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  }
  if (lab.setupPointer)
    lab.setupPointer(cv, { getWorlds: () => worlds, rebuild, P, I, ui, syncControls });

  /* ---------------- badges ---------------- */
  const badge = $('#vpBadge', root);
  function updateBadge() {
    const n = worlds.length;
    badge.innerHTML =
      `<span class="bd acc" style="--acc:${lab.accent}">${lab.universeJa.toUpperCase()}</span>` +
      `<span class="bd">${n === 1 ? '1 WORLD' : n + ' WORLDS'}</span>` +
      (clock.speed !== 1 ? `<span class="bd">${clock.speed}× SPEED</span>` : '') +
      (clock.running ? '' : '<span class="bd">PAUSED</span>');
  }

  /* ---------------- butterfly readout ---------------- */
  const bflyHist = [];
  function separation() {
    if (worlds.length < 2) return 0;
    const a = worlds[0], b = worlds[1];
    if (lab.id === 'P02') return Math.hypot(a.s[0]-b.s[0], a.s[1]-b.s[1], a.s[2]-b.s[2], a.s[3]-b.s[3]);
    if (lab.id === 'A01') return Math.hypot(a.s[0]-b.s[0], a.s[1]-b.s[1], a.s[2]-b.s[2]);
    if (lab.id === 'M01') return Math.abs(a.x - b.x);
    return 0;
  }
  function updateBfly() {
    if (!ui.butterfly) return;
    const d = separation();
    $('#bflyVal', root).textContent = d === 0 ? '0' : d.toExponential(3);
    $('#bflySub', root).textContent = 'log₁₀ 差 = ' + (d > 0 ? Math.log10(d).toFixed(2) : '—');
    bflyHist.push(d);
    if (bflyHist.length > 40) bflyHist.shift();
    const mx = Math.max(...bflyHist.map(v => Math.log10(Math.max(v, 1e-12))));
    const mn = Math.min(...bflyHist.map(v => Math.log10(Math.max(v, 1e-12))));
    const sp = $('#bflySpark', root);
    sp.innerHTML = bflyHist.map((v, i) => {
      const lv = Math.log10(Math.max(v, 1e-12));
      const hgt = mx > mn ? ((lv - mn) / (mx - mn)) * 100 : 4;
      return `<i class="${i === bflyHist.length - 1 ? 'hi' : ''}" style="height:${Math.max(3, hgt)}%"></i>`;
    }).join('');
  }

  /* ---------------- metrics ---------------- */
  const mh = $('#metrics', root);
  function updateMetrics() {
    const rows = lab.metrics(worlds);
    if (mh.children.length !== rows.length) {
      mh.innerHTML = rows.map(() => '<div class="metric"><span class="mk"></span><span class="mv"></span></div>').join('');
    }
    rows.forEach((r, i) => {
      const n = mh.children[i];
      n.classList.toggle('hot', !!r.hot);
      $('.mk', n).textContent = r.k;
      $('.mv', n).textContent = r.v;
    });
  }

  /* ---------------- main loop ---------------- */
  rebuild();
  let uiAcc = 0;
  tickers.add(dt => {
    const n = clock.substeps(dt);
    for (let i = 0; i < n; i++) {
      if (lab.discrete) worlds.forEach(w => w.step());
      else worlds.forEach(w => {
        w.step(clock.fixedDt);
        if (lab.id === 'P02' && i % 4 === 0) w.record();
      });
    }
    if (lab.id === 'A01' && ui.autoRotate && ui.view === '3d') ui.yaw += dt * 0.22;
    const { ctx, w, h } = fitCanvas(cv);
    lab.draw(ctx, w, h, worlds, ui);
    uiAcc += dt;
    if (uiAcc > 0.1) { uiAcc = 0; updateMetrics(); updateBadge(); updateBfly(); }
  });
}

/* =========================================================================
 * MODAL
 * ======================================================================= */
function openModal(html, after) {
  const scrim = el('div', 'scrim');
  const m = el('div', 'modal', html);
  scrim.appendChild(m);
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.onclick = e => { if (e.target === scrim) close(); };
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); }
  });
  if (after) after(m);
  return m;
}
