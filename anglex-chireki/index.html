<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANGLEX 地歴調査</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* Layout: ログイン＝左に墨のブランド面・右に入力。案件＝一覧。レポート＝目次｜紙面｜確認パネルの3列。ANGLEXの紙×墨×真鍮を継承 */
:root{
  --bg:#f5f3ec;--surface:#fbfaf5;--sunk:#ebe8dc;--ink:#1a1a17;--ink2:#3a3a36;--mute:#6f6f68;--faint:#9a948a;
  --line:#d9d4c0;--line2:#e6e2d4;--accent:#b34a2a;--accent-deep:#8a3419;--accent-soft:#f3d7c8;--brass:#B8A67A;--brass-ink:#7d6c3e;
  --ok:#3e6b4a;--ok-soft:#d7e6db;--warn:#9a6a12;--warn-soft:#f5e7c8;--bad:#b3261e;--bad-soft:#f6d9d5;--water:#3f6fa3;--water-soft:#d7e3f0;
  --panel:#13130f;--onpanel:#f5f3ec;--onpanel-mute:#9a948a;--paper:#ffffff;--paper-ink:#161616;
  --f-body:'IBM Plex Sans JP','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;--f-mono:'JetBrains Mono','SF Mono',Menlo,monospace;--f-doc:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13130f;--surface:#1b1b16;--sunk:#24241e;--ink:#ece9df;--ink2:#cfcbbf;--mute:#9e988c;--faint:#6f6a60;--line:#36362c;--line2:#2b2b23;--accent:#d8714e;--accent-deep:#e58a68;--accent-soft:#3a2219;--brass-ink:#cdbb8c;
  --ok:#86bf95;--ok-soft:#1f2e23;--warn:#dcae4a;--warn-soft:#33290f;--bad:#ec7b72;--bad-soft:#3a1d1a;--water:#7fa6d4;--water-soft:#1c2733;--panel:#0b0b08;--onpanel:#ece9df;--onpanel-mute:#8a857a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13130f;--surface:#1b1b16;--sunk:#24241e;--ink:#ece9df;--ink2:#cfcbbf;--mute:#9e988c;--faint:#6f6a60;--line:#36362c;--line2:#2b2b23;--accent:#d8714e;--accent-deep:#e58a68;--accent-soft:#3a2219;--brass-ink:#cdbb8c;
  --ok:#86bf95;--ok-soft:#1f2e23;--warn:#dcae4a;--warn-soft:#33290f;--bad:#ec7b72;--bad-soft:#3a1d1a;--water:#7fa6d4;--water-soft:#1c2733;--panel:#0b0b08;--onpanel:#ece9df;--onpanel-mute:#8a857a;color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--panel)}
[hidden]{display:none!important}img{max-width:100%}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--water)}
h1,h2,h3{text-wrap:balance}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);color:var(--onpanel);border-bottom:1px solid #2a2a22}
.top-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:20px;min-height:54px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;color:inherit;cursor:pointer;padding:0}
.brand b{font-size:21px;font-weight:600;letter-spacing:.04em}.brand b i{font-style:normal;color:var(--brass)}
.brand span{font-family:var(--f-mono);font-size:10px;letter-spacing:.24em;color:var(--onpanel-mute)}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{background:transparent;border:1px solid transparent;color:var(--onpanel-mute);padding:7px 14px;border-radius:980px;cursor:pointer;font-size:12.5px}
.nav button:hover{color:var(--onpanel);border-color:#3a3a30}.nav button.on{background:var(--onpanel);color:#13130f;font-weight:600}
.who{font-size:11.5px;color:var(--onpanel-mute);font-family:var(--f-mono)}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 70px}
.wrap.narrow{max-width:860px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:22px;margin:0;font-weight:600}.pagehead p{margin:5px 0 0;color:var(--mute);font-size:12.5px;max-width:68ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:980px;padding:9px 17px;font-size:12.5px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.full{width:100%}.btn.lg{padding:12px 24px;font-size:14px}.btn.mini{padding:5px 12px;font-size:11.5px}.btn.danger{border-color:var(--bad);color:var(--bad)}.btn:disabled{opacity:.5;cursor:default}
.f{display:flex;flex-direction:column;gap:5px;min-width:0;margin-bottom:12px}.f label{font-size:11.5px;color:var(--mute)}
.f input,.f select,.f textarea,.jg select,.jg input.rn,.sec-h select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brass);outline:none}.f.half{max-width:420px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.note{font-size:11.5px;color:var(--mute);line-height:1.65;margin-top:10px}.note.bad,.err{color:var(--bad)}.err{font-size:12px;min-height:18px;margin-bottom:8px}.mute{color:var(--mute)}
.pill{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:980px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--water-soft);color:var(--water)}.pill.gray{background:var(--sunk);color:var(--mute)}
.lvl{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:980px;white-space:nowrap}
.lvl.low{background:var(--ok-soft);color:var(--ok)}.lvl.high{background:var(--bad-soft);color:var(--bad)}.lvl.none{background:var(--sunk);color:var(--mute)}
.tag{font-family:var(--f-mono);font-size:10px;color:var(--brass-ink);border:1px solid var(--brass);border-radius:4px;padding:1px 6px}
.sec{background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:18px 20px;margin-bottom:14px;min-width:0}
.sec h2{font-size:15px;margin:0 0 12px;font-weight:600}.sec h3{font-size:13px;margin:18px 0 8px}
.sec-h{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}.sec-h h2{margin:0}.sec-h select{width:auto;min-width:180px}
.tblwrap{overflow-x:auto}table{border-collapse:collapse;width:100%}
.gt th,.gt td{padding:8px 9px;border-bottom:1px solid var(--line2);font-size:12px;text-align:left;vertical-align:top}
.gt th{font-family:var(--f-mono);font-size:9.5px;color:var(--mute);border-bottom:1.5px solid var(--ink);font-weight:500;white-space:nowrap}
.gt td.wrapc{min-width:200px}.gt details{margin-top:4px}.gt summary{font-size:11px;color:var(--water);cursor:pointer}.gt td small{display:block;color:var(--mute);font-size:11px;margin-top:2px}.gt td.q{font-family:var(--f-doc);font-size:11.5px;color:var(--ink2);min-width:240px}.nw{white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,240%);visibility:hidden;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:12.5px;transition:transform .3s;z-index:60;max-width:min(560px,calc(100% - 32px))}
.toast.show{transform:translate(-50%,0);visibility:visible}
.empty{padding:36px 16px;text-align:center;color:var(--mute);font-size:13px}

/* login */
.login{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.login-brand{background:var(--panel);color:var(--onpanel);display:flex;align-items:center;padding:48px max(28px,env(safe-area-inset-left,0px));position:relative;overflow:hidden}
.login-brand::after{content:"";position:absolute;inset:auto -10% -30% auto;width:70%;aspect-ratio:1;border:1px solid #2e2e25;border-radius:50%;box-shadow:0 0 0 60px #17170f,0 0 0 61px #2a2a21,0 0 0 130px #15150e,0 0 0 131px #25251d}
.lb-in{max-width:460px;margin:0 auto;position:relative;z-index:1}
.brand.big{cursor:default}.brand.big b{font-size:30px}
.login-brand h1{font-size:30px;line-height:1.35;font-weight:600;margin:42px 0 26px;letter-spacing:.01em}
.login-brand ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:13px;color:#cfcbbf;line-height:1.7}
.login-brand li{padding-left:18px;border-left:2px solid var(--brass)}.login-brand li b{color:var(--onpanel);font-weight:600}
.lb-foot{margin-top:46px;font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--onpanel-mute)}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px max(20px,env(safe-area-inset-right,0px))}
.login-form form{width:100%;max-width:380px}.login-form h2{font-size:22px;margin:0 0 6px}.login-form .sub{color:var(--mute);font-size:12.5px;margin:0 0 22px}
.login-form .btn{margin-top:8px}.login-form .f input{padding:11px 12px;font-size:14px}
@media(max-width:820px){.login{grid-template-columns:1fr}.login-brand{padding-block:34px}.login-brand h1{font-size:23px;margin:22px 0 16px}.lb-foot{margin-top:24px}.login-brand::after{display:none}}

/* cases */
.clist{background:var(--surface);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.chead,.crow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,2fr) 110px 130px 96px;gap:14px;align-items:center;padding:13px 18px}
.chead{font-family:var(--f-mono);font-size:9.5px;color:var(--mute);border-bottom:1.5px solid var(--ink);letter-spacing:.06em}
.crow{width:100%;background:none;border:0;border-bottom:1px solid var(--line2);text-align:left;cursor:pointer}
.crow:last-child{border-bottom:0}.crow:hover{background:var(--sunk)}
.crow .ct b{display:block;font-size:14px;font-weight:600}.crow small{display:block;color:var(--mute);font-size:11.5px}.crow small i{font-style:normal;color:var(--brass-ink)}
.crow .cj em{font-style:normal;font-size:12.5px;display:block}.crow .cn{font-size:12px;color:var(--warn)}.crow .cn b{font-family:var(--f-mono);font-size:15px}.crow .cn.zero{color:var(--ok)}.crow .cd{font-size:11px;color:var(--mute)}
@media(max-width:820px){.chead{display:none}.crow{grid-template-columns:1fr auto;gap:6px 12px}.crow .ct{grid-column:1/-1}.crow .cj{grid-column:1/-1}.crow .cd{text-align:right}}

/* new */
.step{display:grid;grid-template-columns:38px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:20px;margin-bottom:12px}
.sn{width:34px;height:34px;border-radius:50%;background:var(--panel);color:var(--onpanel);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:13px}
.sb{min-width:0}.sb h2{font-size:16px;margin:4px 0 14px;font-weight:600}
.addr{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.addr .f{flex:1 1 280px}.addr .btn{margin-bottom:12px}
.juris{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 6px;min-height:8px}.jl{font-size:11px;color:var(--mute);margin-right:4px}
.chip2{font-size:11.5px;padding:4px 11px;border-radius:980px;background:var(--water-soft);color:var(--water);font-weight:500}.chip2.ord{background:var(--accent-soft);color:var(--accent-deep)}.chip2.mute{background:var(--sunk);color:var(--mute)}.chip2 i{font-style:normal;font-size:10px;margin-left:6px;opacity:.8}
#n-map{height:340px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);z-index:0;margin-top:8px}.mapna{padding:30px;color:var(--mute);font-size:12.5px;text-align:center}
.leaflet-container{font-family:var(--f-body);font-size:12px}.leaflet-control-attribution{font-size:9px!important}
.pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}@media(max-width:640px){.pcards{grid-template-columns:1fr}.step{grid-template-columns:1fr}.sn{display:none}}
.pcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--bg);display:block}
.pcard input{position:absolute;opacity:0;pointer-events:none}.pcard b{display:block;font-size:13px;font-weight:600}.pcard small{color:var(--mute);font-size:11.5px}
.pcard.on{border-color:var(--accent);background:var(--accent-soft)}.pcard:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.drop{display:block;cursor:pointer;border:1.5px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--mute);background:var(--bg);font-size:13px;line-height:1.7}
.drop b{color:var(--ink)}.drop.over{border-color:var(--accent);background:var(--accent-soft)}.drop input{display:none}.drop.sm{padding:16px 12px;font-size:12px;margin:12px 0 6px}
.files{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.file,.dc{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:12.5px;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--bg)}
.fk{font-size:10.5px;font-weight:600;background:var(--sunk);color:var(--ink2);padding:2px 8px;border-radius:5px;white-space:nowrap}.file .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file .fs{color:var(--mute);font-size:11px}
.file .x{border:0;background:none;cursor:pointer;color:var(--mute);font-size:16px;line-height:1;padding:2px 6px}
.aistate{font-size:12px;color:var(--mute);margin-top:10px;line-height:1.9}.aistate b{color:var(--warn)}
.cta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:18px}.cta .note{margin:0}
.proc{background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:30px 28px;margin-top:20px}.proc h1{font-size:20px;margin:0}.proc .sub{color:var(--mute);margin:4px 0 20px;font-size:12.5px}
.psteps{display:flex;flex-direction:column}.ps{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13px;color:var(--faint)}
.ps:last-child{border-bottom:0}.ps i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);justify-self:center}.ps span{font-size:11.5px;font-family:var(--f-mono);text-align:right}
.ps.run{color:var(--ink)}.ps.run i{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}.ps.ok{color:var(--ink)}.ps.ok i{background:var(--ok);border-color:var(--ok)}.ps.skip i{background:var(--sunk)}
@keyframes spin{to{transform:rotate(360deg)}}

/* workspace */
.ws-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.wh-in{max-width:1480px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.wt{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 240px;flex-wrap:wrap}.wt h1{font-size:16px;margin:0;font-weight:600}.wa{display:flex;gap:8px}
.ws{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr) 380px;gap:22px;align-items:start;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
.ws>*{min-width:0}
.ws-toc,.ws-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 124px);max-height:calc(100vh - 140px);overflow:auto}
.ws-toc{display:flex;flex-direction:column;gap:1px;font-size:12px}.ws-toc .tl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;color:var(--accent);margin-bottom:6px}
.ws-toc a{color:var(--ink2);text-decoration:none;padding:4px 8px;border-radius:6px;line-height:1.45}.ws-toc a:hover{background:var(--sunk)}.ws-toc a.l0{font-weight:600;margin-top:6px}.ws-toc a.l1{padding-left:16px;color:var(--mute)}.ws-toc a.l2{padding-left:26px;color:var(--mute);font-size:11.5px}
.ws-side{background:var(--surface);border:1px solid var(--line2);border-radius:12px}
.tabs2{display:flex;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--surface);z-index:2;border-radius:12px 12px 0 0}
.tabs2 button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:11px 4px;cursor:pointer;font-size:12.5px;color:var(--mute)}
.tabs2 button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}.tabs2 i{font-style:normal;font-family:var(--f-mono);font-size:10px;background:var(--accent);color:#fff;border-radius:980px;padding:1px 6px;margin-left:5px}.tabs2 i:empty{display:none}
.side-body{padding:14px 16px 18px}
.sv-head{margin-bottom:12px}.sv-head b{font-size:13px}.sv-head p{font-size:11.5px;color:var(--mute);margin:4px 0 0;line-height:1.65}
.rv{border:1px solid var(--line2);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}.rv.bad{box-shadow:inset 3px 0 0 var(--bad)}.rv.warn{box-shadow:inset 3px 0 0 var(--warn)}.rv.info{box-shadow:inset 3px 0 0 var(--water)}.rv.done{opacity:.5}
.rh{display:flex;gap:8px;align-items:center}.rh em{font-style:normal;font-size:11px;color:var(--mute)}.rv p{margin:6px 0;font-size:12.5px;line-height:1.65}
.pg{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:1px 7px;cursor:pointer;color:var(--water)}
.ra{display:flex;gap:14px}.lnk{background:none;border:0;padding:0;font-size:11.5px;color:var(--water);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.jg{padding:12px 0;border-bottom:1px solid var(--line2)}.jg:last-child{border-bottom:0}.jg h3{font-size:12px;margin:0 0 8px;font-weight:600}
.ck{display:flex;gap:7px;align-items:center;font-size:12.5px;margin:8px 0;cursor:pointer}.ck input{accent-color:var(--accent);width:15px;height:15px}
.jr,.cp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line2)}.jr:last-child,.cp:last-child{border-bottom:0}
.jr small,.cp small,.cc small{display:block;color:var(--mute);font-size:11px;line-height:1.5}.cp select{width:auto;padding:5px 8px;font-size:12px}
.cc{border:1px solid var(--line2);border-radius:8px;padding:9px 11px;margin-bottom:6px;background:var(--bg);font-size:12.5px}.cc.res{opacity:.75}.cc .rn{margin-top:4px;font-size:12px;padding:6px 9px}

 hearing:[{date:'令和7年1月24日(金)',by:'株式会社エコ・テック 久我 亮介',target:'中嶋 昭 様（同法人代表者のご家族）',text:'株式会社中島モーターサイクルは、昭和30年代から主に自動車及びオートバイの販売修理業を営んでいた。特定有害物質の使用について記録はないが、同法人が行なっていた修理は、車検や日常点検、定期点検を行う点検整備、及び、故障時や整備で不良箇所が発見された時に部品を取り外して修理・点検をする分解整備が行われていた。また、部品洗浄用に灯油が使用されていた。\nかかるヒアリング調査の結果を踏まえると、対象地において、特定有害物質の使用・保管の記録はないものの、自動車及びオートバイの修理にともなう土壌汚染の可能性が否定できない。具体的には、オイルや部品に施されたふっ素樹脂加工に使用されるふっ素、バッテリーに使用される鉛、燃料に含有されていた鉛やベンゼン、その他部品に使用されていた重金属類（六価クロム、カドミウム、水銀、鉛）などが使用されていたおそれがある。\nまた、ヒアリングによれば板金・塗装の工程はなかったとのことであったが、もしそれが対象地上であった場合、塗装の剥離剤に使用されるテトラクロロエチレンやトリクロロエチレン、ジクロロエチレン、ベンゼンの使用による土壌汚染の可能性も否定できず、塗料に含有される水銀や鉛、カドミウム、セレン、砒素、クロムによる土壌汚染の可能性も否定できない。',ref:{p:10}}],

/* ══════════ 判定ロジック ══════════ */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KNUM={'〇':0,'零':0,'一':1,'壱':1,'二':2,'弐':2,'三':3,'参':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function kanjiNum(s){s=String(s).trim();if(/^\d+$/.test(s))return +s;let t=0,cur=0;for(const ch of s){if(ch in KNUM)cur=cur*10+KNUM[ch];else if(ch==='十'||ch==='拾'){t+=(cur||1)*10;cur=0;}else if(ch==='百'){t+=(cur||1)*100;cur=0;}else return NaN;}return t+cur;}
const ERA_BASE={明治:1867,大正:1911,昭和:1925,平成:1988,令和:2018};
function waToYear(s){if(!s)return null;const m=String(s).match(/(明治|大正|昭和|平成|令和)\s*(元|[〇零一壱二弐三参四五六七八九十拾百\d]+)\s*年/);if(m){const n=m[2]==='元'?1:kanjiNum(m[2]);return isNaN(n)?null:ERA_BASE[m[1]]+n;}const w=String(s).match(/(1[89]\d\d|20\d\d)/);return w?+w[1]:null;}
function waDate(s){if(!s)return null;let m=String(s).match(/(明治|大正|昭和|平成|令和)\s*(元|\d+)\s*年\s*(\d+)\s*月(?:\s*(\d+)\s*日)?/);if(m)return new Date(ERA_BASE[m[1]]+(m[2]==='元'?1:+m[2]),+m[3]-1,m[4]?+m[4]:1);m=String(s).match(/(1[89]\d\d|20\d\d)\s*年[^\d]*?(\d{1,2})\s*月/);return m?new Date(+m[1],+m[2]-1,1):null;}
function toWareki(d,withDay){const y=d.getFullYear(),mo=d.getMonth()+1;const e=y>=2019?['令和',y-2018]:y>=1989?['平成',y-1988]:['昭和',y-1925];return `${e[0]}${e[1]===1?'元':e[1]}年${mo}月${withDay?d.getDate()+'日':''}`;}
const PREF_RE=/^(東京都|北海道|京都府|大阪府|[^\s\d]{2,3}県)/;
function prefOf(a){const m=String(a||'').match(PREF_RE);return m?m[1]:'';}
function cityOf(a){const m=String(a||'').replace(PREF_RE,'').match(/^(.+?市.+?区|.+?市|.+?区|.+?郡.+?[町村])/);return m?m[1]:'';}
function townOf(a){return String(a||'').replace(PREF_RE,'').replace(/^(.+?市.+?区|.+?市|.+?区|.+?郡.+?[町村])/,'').replace(/[\d０-９]+番.*$/,'').replace(/[\d０-９－-]+$/,'').trim();}
const fmtArea=n=>n?Number(n).toLocaleString('ja-JP',{maximumFractionDigits:2}):'—';
const resolveSame=maps=>{let p='';return (maps||[]).map(m=>{const u=/^同上$/.test(m.use||'')?p:(m.use||'');p=u;return {...m,useR:u};});};

/* 条例：都道府県条例＋（政令市等に独自条例があれば）市条例 */
function ordFor(pref,city){return ORD.filter(o=>o.pref===pref&&(!o.city||(city&&city.indexOf(o.city)===0))&&!(o.excludeCities||[]).some(x=>city&&city.indexOf(x)===0));}
function ordVerified(o){return (o.rules||[]).some(r=>r.verified&&r.url);}

/* 業種の読み取り：登記名義人・法人目的・地図上の用途・ヒアリングから */
function matchInd(text){const t=String(text||'');return IND.filter(i=>i.re.test(t));}
function detectConcerns(c){
  const out=[];const seen=new Set();
  const add=(ind,use,period,basis,ref)=>{const k=ind.id+'|'+use;if(seen.has(k))return;seen.add(k);out.push({period,use,industry:ind.id,parcels:(c.site.parcels||[]).map(p=>p.chiban),basis,ref,auto:true});};
  (c.corps||[]).forEach(co=>{const t=(co.name||'')+' '+(co.purpose||[]).join(' ');matchInd(t).forEach(i=>add(i,co.name,co.est?co.est+'～':'',`法人登記（${co.name}）の目的`,co.ref));});
  resolveSame(c.maps).forEach(m=>matchInd(m.useR).forEach(i=>add(i,m.useR,m.y+'年頃',`${m.src}（${m.y}年）`,c.mapsRef)));
  (c.land||[]).forEach(l=>l.rows.forEach(r=>{if(/株式会社|有限会社|合名|合資|㈱|㈲/.test(r.holder||''))matchInd(r.holder).forEach(i=>add(i,r.holder,r.date+'～','登記名義人（'+l.chiban+'）',l.ref));}));
  /* 同じ業種の手がかりは1件にまとめる（名称・根拠は併記） */
  const by={};out.forEach(x=>{const g=by[x.industry];if(!g){by[x.industry]={...x,_uses:[x.use],_basis:[x.basis],_per:[x.period]};return;}
    if(!g._uses.some(u=>u.indexOf(x.use)>=0||x.use.indexOf(u)>=0))g._uses.push(x.use);if(!g._basis.includes(x.basis))g._basis.push(x.basis);g._per.push(x.period);});
  return Object.values(by).map(g=>{const ys=g._per.map(waToYear).filter(Boolean);const longest=g._uses.slice().sort((a,b)=>b.length-a.length)[0];
    const o={...g,use:g._uses.length>1&&g._uses.every(u=>longest.indexOf(u)>=0)?longest:g._uses.join('／'),basis:g._basis.join('、'),period:ys.length?Math.min(...ys)+'年頃～':g._per[0]};delete o._uses;delete o._basis;delete o._per;return o;});
}
function selectSubstances(c){
  const ids=new Set(),extra=new Set();
  (c.concerns||[]).filter(x=>!x.resolved).forEach(x=>{const i=INDBY[x.industry];if(!i)return;i.subs.forEach(s=>ids.add(s));(i.extra||[]).forEach(e=>extra.add(e));});
  return {ids:SUB.filter(s=>ids.has(s.id)).map(s=>s.id),extra:[...extra]};
}
function openConcerns(c){return (c.concerns||[]).filter(x=>!x.resolved);}
function verdictOf(c){
  const open=openConcerns(c);
  if(!open.length){const res=(c.concerns||[]).filter(x=>x.resolved&&(!x.pending||x.resolveNote));
    return {level:'低い',headline:'土壌汚染の可能性は低いと判断する。',text:'対象地における製造事業等の利用履歴及び「土壌汚染対策法」に規定する特定有害物質の使用等'+(res.length?`に関する履歴事項は無かったが、過去に${res.map(x=>x.use).join('、')}の利用が確認された。しかしながら、${res.map(x=>x.resolveNote||'有害物質の使用は確認されなかった').join('。また、')}ことから、土壌汚染の可能性は低いものと判断する。`:'は確認されなかった。よって、土壌汚染の可能性は低いものと判断する。')};}
  const parts=open.map(x=>`${x.period?x.period+'に':''}${x.use}としての利用履歴がある事が${x.basis}にて確認が取れた`);
  const inds=[...new Set(open.map(x=>INDBY[x.industry]&&INDBY[x.industry].label).filter(Boolean))];
  return {level:'否定できない',headline:'土壌汚染の可能性は否定できないと判断する。',text:`対象地上にて${parts.join('。また、')}。${inds.length?'「'+inds.join('」「')+'」と位置付け、':''}当時の有害物質の使用状況を示す記録・証言が得られていないことから、対象敷地での土壌汚染の可能性は否定できないと判断する。`};
}

/* 適用条項の判定（何条に当たる調査か） */
function judge(c){
  const rq=c.request||{};const s=c.site||{};const g=c.regs||{};const area=+s.area||0;const ch=rq.formChange?(+rq.changeArea||area):0;
  const hasFac=/あり|有/.test((g.suidaku&&g.suidaku.v)||'')||/あり|有/.test((g.gesui&&g.gesui.v)||'');
  const inZone=[g.art6,g.art11jin,g.art11shizen,g.art11umetate].some(v=>/あり|有/.test(v||''));
  const rows=[];
  const L=(art,title,st,why,key)=>rows.push({src:'法',law:'土壌汚染対策法',art,title,st,why,cite:lawCite(key)});
  L('第3条第1項','有害物質使用特定施設の使用の廃止時の調査',rq.purpose==='closure'?(hasFac?['yes','該当']:['maybe','施設の届出を確認']):hasFac?['maybe','廃止時に該当']:!(g.suidaku&&g.suidaku.v)?['todo','届出を未照会']:['no','非該当'],
    hasFac?'水質汚濁防止法・下水道法の有害物質使用特定施設の届出がある。':`水質汚濁防止法・下水道法に基づく有害物質使用特定施設：${(g.suidaku&&g.suidaku.v)||'未照会'}${g.suidaku&&g.suidaku.src?'（'+g.suidaku.src+'）':''}`,'art3');
  L('第4条第1項','3,000㎡以上（有害物質使用特定施設のある工場等は900㎡以上）の土地の形質の変更の届出',
    !rq.formChange?['no','形質変更の予定なし']:ch>=3000?['yes','届出対象']:(ch>=900&&hasFac)?['yes','届出対象（900㎡）']:['no','面積要件に非該当'],
    rq.formChange?`形質変更面積 ${fmtArea(ch)}㎡（敷地 ${fmtArea(area)}㎡）`:`敷地面積 ${fmtArea(area)}㎡。形質変更を行う場合は面積を入力して再判定`,'art4');
  L('第5条第1項','土壌汚染により健康被害が生ずるおそれがある土地の調査命令',rq.purpose==='order'?['maybe','命令の有無を確認']:['no','命令なし'],'都道府県知事等の命令による調査','art5');
  L('第14条第1項','自主調査の結果による区域指定の申請',rq.purpose==='sale'||rq.purpose==='develop'?['info','任意で申請可']:['info','—'],'法に基づかない調査で基準不適合が判明した場合、所有者等は区域指定を申請できる。本地歴調査はその前段。','art14');
  L('第6条・第11条','要措置区域・形質変更時要届出区域の指定',inZone?['yes','区域内']:!(g.art6||g.art11jin)?['todo','未確認']:['no','指定なし'],g.zoneSrc?`確認先：${g.zoneSrc}${g.radius?'、'+g.radius:''}`:'区域指定の公表資料を確認','art6');
  ordFor(s.pref,s.city).forEach(o=>(o.rules||[]).filter(r=>r.judge!==false).forEach(r=>{
    let st,why;const rec=(g.ord||[]).find(x=>x.name&&o.name.indexOf(x.name.replace(/（.*$/,''))===0||x.name===o.name);
    if(r.trigger==='area'){const th=+r.threshold||0,th2=+r.threshold2||0;const site=r.areaBasis==='site';const val=site?area:ch;
      /* 施設のある（あった）敷地か：届出あり＝yes／過去の事業利用の手がかりあり・未照会＝unknown／届出なしで手がかりもなし＝no */
      const facSite=hasFac?'yes':(openConcerns(c).length||!(g.suidaku&&g.suidaku.v))?'unknown':'no';
      const t2=th2>1?th2.toLocaleString()+'㎡以上':'面積の下限なし';
      if(!th)st=['maybe','閾値を確認'];
      else if(!rq.formChange)st=['no','形質変更の予定なし'];
      else if(r.minChange&&ch<r.minChange)st=['no',`改変${r.minChange}㎡未満は対象外`];
      else if(r.upper&&val>=r.upper)st=['no','法第4条の届出による'];
      else if(val>=th)st=r.cond?['maybe',r.condLabel||'条件に当たれば対象']:['yes','届出・調査の対象'];
      else if(th2&&val>=th2)st=facSite==='yes'?['yes',`届出・調査の対象（${t2}）`]:facSite==='unknown'?['maybe','施設のある敷地なら対象']:['no','面積要件に非該当'];
      else st=['no','面積要件に非該当'];
      why=`${site?'敷地面積':'形質変更の面積'} ${th?th.toLocaleString()+'㎡以上':''}${r.cond?'（'+r.cond+'）':''}${th2?'。'+r.cond2+'は'+t2:''}${r.upperNote?'。'+r.upperNote:''}${r.minNote?'。'+r.minNote:''}。本件：敷地 ${fmtArea(area)}㎡${rq.formChange?'、形質変更 '+fmtArea(ch)+'㎡':''}`;}
    else if(r.trigger==='facility'){st=rq.purpose==='closure'?['maybe','対象事業場か確認']:openConcerns(c).length?['maybe','事業場の届出履歴を確認']:['no','該当の手がかりなし'];why=r.summary||r.duty||'';}
    else if(r.trigger==='other'){st=['info','参考'];why=r.summary||r.duty||'';}
    else {st=rec?['done','確認済：'+rec.v]:['todo','未確認'];why=rec?`${rec.item||r.heading||''}：${rec.v}`:(r.summary||'条例に基づく台帳・区域の有無を窓口または公表資料で確認する');}
    const zn=(o.zones||[]).map(z=>z.name).filter(n=>n.length<16);const title=(r.trigger==='ledger'||r.trigger==='zone')?(zn.length?`条例に基づく区域（${zn.slice(0,3).join('・')}）・台帳の確認`:'条例に基づく台帳・公表の確認'):(r.heading||r.summary||'');
    rows.push({src:'条例',law:o.name,art:r.art,title,st,why,cite:{url:r.url,quote:r.quote,verified:!!(r.verified&&r.url),checkedOn:o.checkedOn}});
  }));
  return rows;
}
function lawCite(key){const a=(LAWS.articles||[]).find(x=>x.key===key);return a?{url:a.url,quote:a.quote,verified:!!a.verified,checkedOn:LAWS.checkedOn}:{url:'',quote:'',verified:false};}
function positionText(c){
  const rq=c.request||{};const J=judge(c);const yes=J.filter(r=>r.st[0]==='yes');
  const base={sale:'本調査は、土地の売買に先立って土壌汚染のおそれを把握するために行う自主的な地歴調査であり、土壌汚染対策法第3条、第4条及び第5条に基づく調査義務によるものではない。',
    develop:'本調査は、土地の形質の変更に先立って土壌汚染のおそれを把握するために行う地歴調査である。',
    closure:'本調査は、工場・事業場の廃止に伴い土壌汚染のおそれを把握するために行う地歴調査である。',
    order:'本調査は、行政からの求めに応じて土壌汚染のおそれを把握するために行う地歴調査である。'}[rq.purpose||'sale'];
  const lawYes=yes.some(r=>r.src==='法');const head=(rq.purpose||'sale')==='sale'&&lawYes?'本調査は、土地の売買に先立って土壌汚染のおそれを把握するために行う地歴調査である。':base;
  return head+(yes.length?'なお、本件は'+yes.map(r=>`${r.law.replace(/（.*?）/g,'')}${r.art}（${r.title}）`).join('、')+'に該当する。':'');
}

/* 確認が必要な点だけを集める（人が見る項目を最小にする） */
function reviewItems(c){
  const R=[];const add=(sev,area,text,anchor,ref)=>R.push({id:'r'+R.length,sev,area,text,anchor,ref});
  (c.diffs||[]).forEach(d=>add(d.sev,'原本との照合',d.text,null,d.ref));
  (c.land||[]).forEach((l,i)=>{const u=l.rows.filter(r=>r.unclear);if(u.length)add('warn','登記簿',`${l.chiban}：名義人の判読が不明瞭な行が${u.length}件（${u.slice(0,3).map(r=>r.holder).join('、')}${u.length>3?' ほか':''}）。添付A 登記簿謄本で照合。`,'sec-22',l.ref);
    l.rows.filter(r=>r.flag).forEach(r=>add('warn','登記簿',`${l.chiban} ${r.date}：${r.flag}`,'sec-22',l.ref));});
  (c.corps||[]).filter(x=>x.flag).forEach(x=>add('warn','法人',`${x.name}：${x.flag}`,'sec-22',x.ref));
  (c.hearing||[]).filter(h=>h.flag).forEach(h=>add('bad','ヒアリング',h.flag,'sec-24',h.ref));
  const s=c.site||{};const sum=(s.parcels||[]).reduce((a,p)=>a+(+p.chiseki||0),0);
  if((s.parcels||[]).length&&(s.parcels||[]).every(p=>+p.chiseki>0)&&Math.abs(sum-(+s.area||0))>0.01)add('bad','地積',`筆一覧の合計 ${sum.toFixed(2)}㎡ と敷地面積 ${s.area}㎡ が一致しない。`,'sec-11');
  const maps=resolveSame(c.maps);let asc=0,wa=0;maps.forEach((m,i)=>{if(i&&m.y<maps[i-1].y)asc++;const wy=waToYear(m.w);if(wy&&wy!==m.y)wa++;});
  if(asc)add('warn','地図年次',`年次が${asc}箇所で昇順になっていない。`,'sec-23',c.mapsRef);

  if(c.verdict&&c.verdict.level==='低い'&&open.length)add('bad','所見',`未解消の懸念（${open.map(x=>x.use).join('、')}）があるのに所見が「低い」。`,'sec-3');

  if(s.gwElev)add('warn','地下水','地下水流向は標高（国土地理院 標高API）からの自動推定。治水地形分類図と周辺の河川・海域の位置で確認する。流速・到達距離の計算は未搭載。','sec-21');
  if(!s.gwText)add('warn','地下水','地下水流向の記載がない。位置を確定すると標高から流向を推定できる。','sec-21');

  const ord={bad:0,warn:1,info:2};return R.sort((a,b)=>(a.done-b.done)||(ord[a.sev]-ord[b.sev]));

function sourcesOf(c){

  push('公的地図','治水地形分類図・地理院タイル','国土交通省国土地理院 電子国土web',DATASRC[0].url,true);
  const used=[...new Set(openConcerns(c).map(x=>INDBY[x.industry]).filter(i=>i&&i.src.type!=='none'))];

  /* 添付資料：原本PDFの中のページ範囲が分かっていれば原本を、別ファイルで共有された資料はその資料を開く */
  (ids||[]).forEach(id=>{const d=docOf(c,id);if(d)parts.push(`<span class="ev att" data-p="${String(d.pages||'').split('–')[0]||1}" data-doc="${d.pages?'':esc(d.id)}" title="${esc(d.name||'')}">${clsLabel(d)} ${esc(d.kind)}${d.pages?' p.'+d.pages:''}</span>`);});

const AI={mode:'none',model:'claude-opus-5-5'};

  if(/^https?:$/.test(location.protocol))try{const r=await fetch('/api/claude',{method:'GET'});if(r.ok){const j=await r.json().catch(()=>null);if(j&&j.ok){AI.mode='proxy';return AI.mode;}}}catch(e){}

async function aiCall(content,maxTokens){

  else if(AI.mode==='key')r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':store.get('apiKey'),'anthropic-version':'2023-06-01','anthropic-beta':'server-side-fallback-2026-07-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});

function fileToB64(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(file);});}
async function aiExtractFile(file){
  const data=await fileToB64(file);const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  const block=isPdf?{type:'document',source:{type:'base64',media_type:'application/pdf',data}}:{type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data}};
  const {text,usage}=await aiCall([block,{type:'text',text:EXTRACT_PROMPT}],16000);
  const m=text.match(/\{[\s\S]*\}/);if(!m)throw new Error('読み取り結果を解釈できませんでした');
  const j=JSON.parse(m[0]);j._file=file.name;j._usage=usage;return j;
}

function mergePart(c,part,docId){
  const ref=p=>p?{doc:docId,p}:{doc:docId};
  const fill=(o,src,keys)=>keys.forEach(k=>{if(src&&src[k]!=null&&src[k]!==''&&(o[k]==null||o[k]===''||o[k]===0))o[k]=src[k];});

    (part.site.parcels||[]).forEach(p=>{if(!c.site.parcels.some(q=>q.chiban===p.chiban))c.site.parcels.push(p);});}
  if(part.meta){if(part.meta.title&&!c.titleLocked)c.title=part.meta.title.replace(/\s*地歴調査.*$/,'');fill(c,part.meta,['reportDate','period']);}
  if(part.regs){const g=c.regs;['suidaku','gesui'].forEach(k=>{if(part.regs[k]&&!g[k])g[k]=part.regs[k];});fill(g,part.regs,['zoneSrc','radius','art6','art11jin','art11shizen','art11umetate','haiki','natural']);(part.regs.ord||[]).forEach(o=>{if(!g.ord.some(x=>x.name===o.name))g.ord.push(o);});if(part.regs.p)g.ref=ref(part.regs.p);}
  (part.land||[]).forEach(l=>{c.land.push({chiban:l.chiban,chimoku:l.chimoku,note:l.note,ref:ref(l.p),rows:l.rows||[]});});
  (part.lineage||[]).forEach(e=>{if(!c.lineage.some(x=>x.date===e.date&&x.type===e.type))c.lineage.push(e);});
  (part.buildings||[]).forEach(b=>c.buildings.push({...b,ref:ref(b.p)}));
  (part.corps||[]).forEach(x=>{if(!c.corps.some(y=>y.name===x.name))c.corps.push({...x,got:true,assess:'unknown',comment:'',ref:ref(x.p)});});

function finalizeCase(c,keep){

/* 標高から地下水流向を推定（国土地理院 標高API）。周囲8方向・半径rの標高差が最大の下り方向を採る */
async function estimateGW(lat,lng){
  const r=200,dirs=[['北',1,0],['北東',1,1],['東',0,1],['南東',-1,1],['南',-1,0],['南西',-1,-1],['西',0,-1],['北西',1,-1]];
  const el=async(la,lo)=>{const j=await (await fetch(`https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon=${lo}&lat=${la}&outtype=JSON`)).json();return typeof j.elevation==='number'?j.elevation:NaN;};
  const pts=dirs.map(([n,dy,dx])=>{const k=Math.hypot(dy,dx);return {n,la:lat+(dy/k)*r/111000,lo:lng+(dx/k)*r/(111000*Math.cos(lat*Math.PI/180))};});
  const [e0,...es]=await Promise.all([el(lat,lng),...pts.map(p=>el(p.la,p.lo))]);const out=pts.map((p,i)=>({n:p.n,e:es[i]}));
  const ok=out.filter(o=>!isNaN(o.e));if(isNaN(e0)||ok.length<4)return null;
  const low=ok.reduce((a,b)=>b.e<a.e?b:a);const drop=e0-low.e;
  /* 200mで1m未満の標高差は平坦とみなし、流向を決めない（低地・埋立地では地形だけで決められない） */
  return {elev:e0,dir:drop>=1.0?low.n:null,drop,r,samples:out};

LAWS={"checkedOn": "2026-11-21", "items": [{"id": "act", "name": "土壌汚染対策法", "number": "平成14年法律第53号", "lastAmended": "令和8年5月22日法律第22号", "lastAmendedFull": "令和8年5月22日法律第22号（環境省設置法の一部を改正する法律）／施行 令和8年7月1日", "url": "https://laws.e-gov.go.jp/law/414AC0000000053", "quote": "附則　（施行期日）１ この法律は、令和八年七月一日から施行する。／第六十三条 この法律に規定する環境大臣の権限は、環境省令で定めるところにより、地方環境局長に委任することができる。", "note": "既往報告書の「改正：令和4年6月17日法律第68号」は実在する（刑法等の一部を改正する法律の施行に伴う関係法律の整理等に関する法律。土対法の該当部分は令和7年6月1日施行）が、現時点の最新ではない。最新は令和8年法律第22号。前版との差分は第63条の「地方環境事務所長」→「地方環境局長」のみ（調査契機・区域指定の条文に変更なし）。e-Govの改正履歴に未施行の改正は掲載されていなかった。", "verified": true}, {"id": "order", "name": "土壌汚染対策法施行令", "number": "平成14年政令第336号", "lastAmended": "令和5年10月18日政令第304号", "lastAmendedFull": "令和5年10月18日政令第304号（漁港漁場整備法及び水産業協同組合法の一部を改正する法律の施行に伴う関係政令の整備に関する政令）／施行 令和6年4月1日", "url": "https://laws.e-gov.go.jp/law/414CO0000000336", "quote": "附則　この政令は、漁港漁場整備法及び水産業協同組合法の一部を改正する法律の施行の日（令和六年四月一日）から施行する。", "note": "(a)「平成30年9月28日政令第283号」は実在（土壌汚染対策法施行令の一部を改正する政令、平成31年4月1日施行）するが1つ前の版。(b)「令和6年4月1日政令304号」は年月日の誤記で、正しくは「令和5年10月18日政令第304号」（令和6年4月1日は施行日）。現行最新は令和5年政令第304号。", "verified": true}, {"id": "rule", "name": "土壌汚染対策法施行規則", "number": "平成14年環境省令第29号", "lastAmended": "令和8年6月30日環境省令第19号", "lastAmendedFull": "令和8年6月30日環境省令第19号（環境省設置法の一部を改正する法律の施行に伴う環境省関係省令の整備に関する省令）／施行 令和8年7月1日", "url": "https://laws.e-gov.go.jp/law/414M60001000029", "quote": "附則　この省令は、令和八年七月一日から施行する。／第八十条 法第五十四条第一項及び第五十六条第一項に規定する環境大臣の権限は、地方環境局長に委任する。", "note": "(a)「令和4年12月16日環境省令第26号」(b)「令和6年4月1日環境省令第17号」はいずれも実在（e-Gov改正履歴に掲載）するが、どちらも現行最新ではない。最新は令和8年環境省令第19号で、前版（令和6年環境省令第17号）との差分は第80条の「地方環境事務所長」→「地方環境局長」のみ。基準値・面積要件・別表に変更なし。", "verified": true}, {"id": "notice", "name": "土壌汚染対策法の一部を改正する法律による改正後の土壌汚染対策法の施行について", "number": "平成31年3月1日環水大土発第1903015号", "lastAmended": "令和4年3月24日", "url": "https://www.env.go.jp/content/000045235.pdf", "quote": "環水大土発第 1903015 号 平成 31 年３月１日 改正 環水大土発第 2202212 号 令和４年３月 24 日", "note": "環境省の一覧ページ掲載のPDFは令和4年3月24日改正を反映した版。新旧対照表: https://www.env.go.jp/content/900540081.pdf（URLは一覧ページで確認、中身は未読）", "verified": true}, {"id": "notice", "name": "土壌汚染状況調査における地歴調査について", "number": "令和4年8月31日環水大水発第2208311号", "lastAmended": "", "url": "https://www.env.go.jp/content/000070222.pdf", "quote": "環水大水発第 2208311 号 令和４年８月 31 日 … 環境省水・大気環境局水環境課長 土壌汚染状況調査における地歴調査について", "note": "文書番号はPDF原本どおり「環水大水発」（発出者が水環境課長のため）。既往報告書の表記「環水大水発第2208311号」が正しく、「環水大土発」ではない。本通知により旧通知（平成29年3月31日付け環水大土発第1703318号）は廃止。", "verified": true}, {"id": "notice", "name": "土壌汚染対策法に基づく調査及び措置に関するガイドライン（改訂第3.1版）", "number": "令和4年8月31日 環境省", "lastAmended": "", "url": "https://www.env.go.jp/content/000076380.pdf", "quote": "※第１編について、より運用に資するものとして全体的な見直しを行い、令和４年８月31日に「土壌汚染対策法に基づく調査及び措置に関するガイドライン（改訂第3.1版）」を公開しました。なお、今後も同様の更新を行う可能性があります。", "note": "2026-11-21時点で環境省掲載ページ上の第1編は改訂第3.1版（令和4年8月）のままで、より新しい版は掲載されていない。全体版PDF(000076380.pdf, 25MB)自体は未ダウンロードで、分割版のうち表紙・目次、第1章、第2章、Appendixを開いて確認（表紙に「（改訂第３．１版）令和４年８月」）。同ページでは第2編（運搬）改訂第4.2版・第3編（処理業）改訂第4.3版が令和6年4月改訂、第4編（指定調査機関）が令和7年4月改訂と表示。", "verified": true}], "articles": [{"key": null, "law": "土壌汚染対策法", "art": "第2条第1項", "summary": "特定有害物質の定義（具体の物質は政令で定める）", "threshold": "", "quote": "この法律において「特定有害物質」とは、鉛、砒素、トリクロロエチレンその他の物質（放射性物質を除く。）であって、それが土壌に含まれることに起因して人の健康に係る被害を生ずるおそれがあるものとして政令で定めるものをいう。", "url": "https://laws.e-gov.go.jp/law/414AC0000000053", "verified": true}, {"key": null, "law": "土壌汚染対策法施行令", "art": "第1条", "summary": "特定有害物質26物質の列挙（第1号カドミウム及びその化合物〜第26号有機りん化合物）。ダイオキシン類は含まれない", "threshold": "26物質", "quote": "法第二条第一項の政令で定める物質は、次に掲げる物質とする。一 カドミウム及びその化合物 二 六価クロム化合物 三 クロロエチレン（別名塩化ビニル又は塩化ビニルモノマー）", "url": "https://laws.e-gov.go.jp/law/414CO0000000336", "verified": true}, {"key": "art3", "law": "土壌汚染対策法", "art": "第3条第1項", "summary": "使用が廃止された有害物質使用特定施設に係る工場・事業場の敷地であった土地の調査・報告義務（ただし書：知事の確認による調査猶予）", "threshold": "面積要件なし", "quote": "使用が廃止された有害物質使用特定施設（…）に係る工場又は事業場の敷地であった土地の所有者、管理者又は占有者（…）は、環境省令で定めるところにより、当該土地の土壌の特定有害物質による汚染の状況について、環境大臣又は都道府県知事が指定する者に環境省令で定める方法により調査させて、その結果を都道府県知事に報告しなければならない。", "url": "https://laws.e-gov.go.jp/law/414AC0000000053", "verified": true}, {"key": null, "law": "土壌汚染対策法", "art": "第3条第7項・第8項", "summary": "第3条第1項ただし書の確認（調査猶予）を受けた土地で形質変更をするときの事前届出（第7項）と、届出を受けた知事の調査命令（第8項）", "threshold": "900㎡以上（面積は施行規則第21条の4）", "quote": "第一項ただし書の確認に係る土地の所有者等は、当該確認に係る土地について、土地の掘削その他の土地の形質の変更（…）をし、又はさせるときは、あらかじめ、環境省令で定めるところにより、…都道府県知事に届け出なければならない。ただし、次に掲げる行為については、この限りでない。一 軽易な行為その他の行為であって、環境省令で定めるもの", "url": "https://laws.e-gov.go.jp/law/414AC0000000053", "verified": true}, {"key": null, "law": "土壌汚染対策法施行規則", "art": "第21条の4", "summary": "法第3条第7項の届出を要しない行為（900㎡未満の形質変更 等）", "threshold": "900㎡未満は届出不要", "quote": "法第三条第七項第一号の環境省令で定める行為は、次に掲げる行為とする。一 対象となる土地の面積が九百平方メートル未満の土地の形質の変更", "url": "https://laws.e-gov.go.jp/law/414M60001000029", "verified": true}, {"key": "art4", "law": "土壌汚染対策法", "art": "第4条第1項", "summary": "一定規模以上の土地の形質変更の届出（着手の30日前まで）。規模は環境省令（施行規則第22条）に委任", "threshold": "3,000㎡ / 900㎡（数値は施行規則第22条）", "quote": "土地の形質の変更であって、その対象となる土地の面積が環境省令で定める規模以上のものをしようとする者は、当該土地の形質の変更に着手する日の三十日前までに、…都道府県知事に届け出なければならない。", "url": "https://laws.e-gov.go.jp/law/414AC0000000053", "verified": true}, {"key": null, "law": "土壌汚染対策法施行規則", "art": "第22条", "summary": "法第4条第1項の届出対象規模。原則3,000㎡、現に有害物質使用特定施設が設置されている工場・事業場の敷地等は900㎡", "threshold": "3,000㎡ / 900㎡", "quote": "法第四条第一項の環境省令で定める規模は、三千平方メートルとする。ただし、現に有害物質使用特定施設が設置されている工場若しくは事業場の敷地又は…使用が廃止された有害物質使用特定施設に係る工場若しくは事業場の敷地（…）の土地の形質の変更にあっては、九百平方メートルとする。", "url": "https://laws.e-gov.go.jp/law/414M60001000029", "verified": true}, {"key": null, "law": "土壌汚染対策法", "art": "第4条第2項", "summary": "届出に併せて、土地所有者等全員の同意を得て指定調査機関による調査結果を提出できる（先行調査）", "threshold": "", "quote": "前項に規定する者は、環境省令で定めるところにより、当該土地の所有者等の全員の同意を得て、…指定調査機関に前条第一項の環境省令で定める方法により調査させて、前項の規定による土地の形質の変更の届出に併せて、その結果を都道府県知事に提出することができる。", "url": "https://laws.e-gov.go.jp/law/414AC0000000053", "verified": true}, {"key": null, "law": "土壌汚染対策法", "art": "第4条第3項", "summary": "届出を受けた知事が、汚染のおそれの基準に該当すると認めるとき土地所有者等に調査・報告を命令", "threshold": "", "quote": "都道府県知事は、第一項の規定による土地の形質の変更の届出を受けた場合において、当該土地が特定有害物質によって汚染されているおそれがあるものとして環境省令で定める基準に該当すると認めるときは、…調査させて、その結果を報告すべきことを命ずることができる。", "url": "https://laws.e-gov.go.jp/law/414AC0000000053", "verified": true}, {"key": "art5", "law": "土壌汚染対策法", "art": "第5条第1項", "summary": "土壌汚染により健康被害が生ずるおそれがある土地（政令で定める基準＝施行令第3条）に対する知事の調査命令", "threshold": "面積要件なし", "quote": "都道府県知事は、…土壌の特定有害物質による汚染により人の健康に係る被害が生ずるおそれがあるものとして政令で定める基準に該当する土地があると認めるときは、政令で定めるところにより、…当該土地の所有者等に対し、指定調査機関に第三条第一項の環境省令で定める方法により調査させて、その結果を報告すべきことを命ずることができる。", "url": "https://laws.e-gov.go.jp/law/414AC0000000053", "verified": true}, {"key": null, "law": "土壌汚染対策法施行令", "art": "第3条", "summary": "法第5条第1項の「政令で定める基準」", "threshold": "", "quote": "法第五条第一項の政令で定める基準は、次の各号のいずれにも該当することとする。", "url": "https://laws.e-gov.go.jp/law/414CO0000000336", "verified": true}, {"key": "art6", "law": "土壌汚染対策法", "art": "第6条第1項", "summary": "要措置区域の指定（①汚染状態が基準不適合 かつ ②健康被害が生じ、又は生ずるおそれ）", "threshold": "", "quote": "都道府県知事は、土地が次の各号のいずれにも該当すると認める場合には、当該土地の区域を、その土地が特定有害物質によって汚染されており、当該汚染による人の健康に係る被害を防止するため当該汚染の除去、当該汚染の拡散の防止その他の措置（以下「汚染の除去等の措置」という。）を講ずることが必要な区域として指定するものとする。", "url": "https://laws.e-gov.go.jp/law/414AC0000000053", "verified": true}, {"key": null, "law": "土壌汚染対策法", "art": "第6条第1項第1号・第2号", "summary": "要措置区域の2要件", "threshold": "", "quote": "一 土壌汚染状況調査の結果、当該土地の土壌の特定有害物質による汚染状態が環境省令で定める基準に適合しないこと。二 土壌の特定有害物質による汚染により、人の健康に係る被害が生じ、又は生ずるおそれがあるものとして政令で定める基準に該当すること。", "url": "https://laws.e-gov.go.jp/law/414AC0000000053", "verified": true}, {"key": null, "law": "土壌汚染対策法", "art": "第6条第4項", "summary": "「要措置区域」の略称定義と指定解除", "threshold": "", "quote": "都道府県知事は、汚染の除去等の措置により、第一項の指定に係る区域（以下「要措置区域」という。）の全部又は一部について同項の指定の事由がなくなったと認めるときは、当該要措置区域の全部又は一部について同項の指定を解除するものとする。", "url": "https://laws.e-gov.go.jp/law/414AC0000000053", "verified": true}, {"key": null, "law": "土壌汚染対策法", "art": "第11条第1項", "summary": "形質変更時要届出区域の指定（第6条第1項第1号に該当し第2号に該当しない土地）", "threshold": "", "quote": "都道府県知事は、土地が第六条第一項第一号に該当し、同項第二号に該当しないと認める場合には、当該土地の区域を、その土地が特定有害物質によって汚染されており、当該土地の形質の変更をしようとするときの届出をしなければならない区域として指定するものとする。", "url": "https://laws.e-gov.go.jp/law/414AC0000000053", "verified": true}, {"key": n 出書（別記第34号様式）の届出。条例・規則の条文上、届出の日数期限（○日前まで）の定めは確認されない（法第4条第1項届出は着手30日前）。", "quote": "規則で定める面積以上の土地における土地の切り盛り、掘削その他の規則で定める行為(以下「土地の改変」という。)を行う者(以下「土地改変者」という。)は", "url": "https://www.reiki.metro.tokyo.lg.jp/reiki/reiki_honbun/g101RG00001328.html", "verified": true, "judge": true, "threshold2": 900, "cond2": "法第4条第1項の適用を受ける土地", "minChange": 300, "minNote": "改変対象面積の合計が300㎡未満の行為は対象外（基準超過が確実な場合を除く）"}, {"art": "施行規則第57条", "heading": "土地の改変時の調査等（面積・対象行為・様式）", "trigger": "area", "threshold": 3000, "thresholdBasis": "規則本文は「面積」とのみ規定。敷地面積基準である旨は都の施行通知・リーフレットで確認", "areaBasis": "site", "summary": "面積は3,000㎡（法第4条第1項の適用を受ける土地は900㎡）。対象行為は土地の形質の変更（建築物その他の工作物の建設等に伴うもの）並びに土地の切り盛り、掘削及び造成、及び法第4条第1項届出の対象行為。除外: 通常の管理行為・軽易な行為、改変対象面積の合計が300㎡未満の行為（基準超過が確実な場合を除く）、非常災害の応急措置。届出様式は別記第34号様式「土地利用の履歴等調査届出書」。", "duty": "第34号様式による届出", "quote": "第五十七条 条例第百十七条第一項に規定する規則で定める面積は、三千平方メートルとする。ただし、土壌汚染対策法第四条第一項の適用を受ける土地にあっては、九百平方メートルとする。", "url": "https://www.reiki.metro.tokyo.lg.jp/reiki/reiki_honbun/g101RG00001329.html", "verified": true, "judge": false}, {"art": "第117条（運用: 面積の算定基礎）", "heading": "施行通知における面積要件の解釈", "trigger": "area", "threshold": 3000, "thresholdBasis": "敷地面積（敷地全体）", "areaBasis": "site", "summary": "都環境局の施行通知（30環改化第1176号 平成31年3月27日、改正 5環改化第896号 令和6年3月22日）: 規則で定める面積以上の土地とは「敷地面積が3,000㎡以上の土地」。算定基礎は改変を行おうとする敷地全体で、改変部分のみの面積ではない。敷地として管理されていない場合（道路拡張、区画整理等）は事業目的に利用する土地全体で判断。リーフレット（令和7年4月）も条例は「3000㎡以上の敷地内」、法は「敷地面積ではなく、形質変更する部分の面積の合計が3000㎡以上」と対比。", "duty": "—", "quote": "面積の算定基礎は土地改変者が改変を行おうとする敷地全体であり、改変を行う部分のみの面積ではない。", "url": "https://www.kankyo.metro.tokyo.lg.jp/documents/d/kankyo/notification_for_ordinance_revision20240401_ref2", "verified": true, "judge": false}, {"art": "第118条", "heading": "記録の保管、引継等", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "第114条〜第117条の調査・計画書作成・措置を行った者（地位承継者を含む）は、その内容を土地の所有者等と共有し、記録を作成・保管し、必要に応じ土地の所有者等に引き継ぐ。調査猶予確認を受けた者は取り扱っていた特定有害物質その他操業時の状況について同様。第2項: 土地の所有者等は土地改変者・汚染地改変者に適切に提供。※第118条は「記録」の規定であり、台帳の規定ではない。", "duty": "記録の作成・保管・引継ぎ、情報提供", "quote": "土地の所有者等と共有するとともに、記録を作成し、保管し、及び必要に応じて土地の所有者等にこれを引き継がなければならない。", "url": "https://www.reiki.metro.tokyo.lg.jp/reiki/reiki_honbun/g101RG00001328.html", "verified": true, "judge": false}, {"art": "第118条の2", "heading": "台帳の調製等", "trigger": "ledger", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "知事は第114条〜第117条の規定に基づく調査、計画書、措置等について、所在地その他規則で定める事項を記載した台帳を調製・保管し（第1項）、公開して一般の閲覧に供する（第2項）。既往報告書の「条例第118条の2の規定に基づく台帳」という記載は条文・都公式ページの表記と一致し正しい。平成30年条例第120号で追加（平成31年4月1日施行）。", "duty": "（知事の義務）台帳の調製・保管・公開", "quote": "第百十八条の二 知事は、第百十四条から第百十七条までの規定に基づく調査、計画書、措置等について、規則で定めるところにより、所在地その他の規則で定める事項を記載した台帳を調製し、これを保管しなければならない。", "url": "https://www.reiki.metro.tokyo.lg.jp/reiki/reiki_honbun/g101RG00001328.html", "verified": true, "judge": true}, {"art": "施行規則第58条", "heading": "台帳の調製等（台帳の構成・記載事項）", "trigger": "ledger", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "台帳は土地の区分ごとに帳簿等で調製: (一)第114条指示対象の土地、(二)汚染状況調査で基準超過が確認された土地、(三)汚染状況調査を実施した土地（二を除く）、(四)土地利用の履歴等調査を実施した土地（帳簿のみ）、(五)自然由来等基準不適合土壌の搬出元・搬出先。帳簿記載事項: 根拠条項、報告・届出年月日、所在地、工場等の名称又は事業名称、面積、汚染状況又は汚染のおそれの有無、調査受託者、措置内容、法の区域指定を含む旨 等（17号）。", "duty": "（知事の義務）", "quote": "第五十八条 条例第百十八条の二第一項に規定する台帳は、次の表の上欄に掲げる土地に応じ、当該下欄に掲げる帳簿等をもって調製するものとする。", "url": "https://www.reiki.metro.tokyo.lg.jp/reiki/reiki_honbun/g101RG00001329.html", "verified": true, "judge": false}, {"art": "第118条の2（都公式ページの案内）", "heading": "土壌汚染対策に関する台帳（公開・閲覧）", "trigger": "ledger", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "都は法第15条の台帳に加え、条例改正施行（平成31年4月1日）以降、条例第118条の2に基づく台帳を作成。公開システムで閲覧可（要措置区域台帳、形質変更時要届出区域台帳、土壌汚染情報公開台帳、地歴台帳、基準適合台帳、自然由来等基準不適合土壌台帳）。紙台帳は都庁第二本庁舎20階北側・多摩環境事務所で閲覧。八王子市・町田市の領域の法に基づく台帳、区市の領域の条例第116条に関する台帳は各区市の所管課へ。", "duty": "—", "quote": "条例第114条から第117条までの規定に基づく調査、計画書、措置等について、条例第118条の2の規定に基づき、土壌や地下水の基準超過を確認した土地における調査結果や措置の状況等の届出情報を記載した台帳を作成しています。", "url": "https://www.kankyo.metro.tokyo.lg.jp/chemical/soil/law/designated_areas", "verified": true, "judge": false}, {"art": "第120条", "heading": "勧告等", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "第116条第1項、第116条の3各項、第117条第1項・第3項等に違反している者に対し、知事は是正のため必要な措置を勧告できる。第116条第1項違反の勧告時は対象土地の場所・範囲を公表できる。", "duty": "—", "quote": "に違反をしている者があるときは、その者に対し、当該違反をしている事項を是正するため必要な措置をとることを勧告することができる。", "url": "https://www.reiki.metro.tokyo.lg.jp/reiki/reiki_honbun/g101RG00001328.html", "verified": true, "judge": false}, {"art": "第122条", "heading": "適用除外", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "農用地の土壌、汚染原因が専ら自然的条件であることが明らかな場所（自然由来と同程度に汚染された土砂に由来する埋立地を含む）の土壌、法令により特定有害物質の処分等を目的として設置されている施設の存する土地の土壌には適用しない。ただし自然由来等の土壌は搬出に伴う汚染拡散防止に必要な限度で適用。", "duty": "—", "quote": "二 汚染の原因が専ら自然的条件であることが明らかであると認められる場所(汚染の原因が、専ら自然的条件によるものと同程度に汚染された土砂に由来すると認められる埋立地を含む。)の土壌", "url": "https://www.reiki.metro.tokyo.lg.jp/reiki/reiki_honbun/g101RG00001328.html", "verified": true, "judge": false}], "notes": [{"text": "環境確保条例（土壌・地下水汚染対策関連）の概要", "url": "https://www.kankyo.metro.tokyo.lg.jp/chemical/soil/ordinance/outline", "verified": true}, {"text": "環境確保条例（土壌・地下水汚染対策関連）に係る届出等の提出先", "url": "https://www.kankyo.metro.tokyo.lg.jp/chemical/soil/ordinance/contact_guide", "verified": true}], "extraSubstances": [], "zones": [], "pages": [{"title": "都民の健康と安全を確保する環境に関する条例（東京都例規集）", "url": "https://www.reiki.metro.tokyo.lg.jp/reiki/reiki_honbun/g101RG00001328.html", "what": "条例本文（現行）"}, {"title": "都民の健康と安全を確保する環境に関する条例施行規則（東京都例規集）", "url": "https://www.reiki.metro.tokyo.lg.jp/reiki/reiki_honbun/g101RG00001329.html", "what": "施行規則本文（現行）"}, {"title": "東京都土壌汚染対策指針（東京都例規集）", "url": "https://www.reiki.metro.tokyo.lg.jp/reiki/reiki_honbun/g101RG00004994.html", "what": "指針（告示）本文"}, {"title": "東京都土壌汚染対策指針（平成31年東京都告示第394号、平成31年4月1日施行）PDF", "url": "https://www.kankyo.metro.tokyo.lg.jp/documents/d/kankyo/ordinance-text-files-h31_04shishinfusokuaripage", "what": "指針（環境局掲載PDF）"}, {"title": "環境確保条例（土壌・地下水汚染対策関連）の条文・通知等|東京都環境局", "url": "https://www.kankyo.m 境の保全等に関する条例", "instrument": "条例", "number": "平成9年10月17日神奈川県条例第35号", "lastAmended": "令和7年3月28日条例第15号（神奈川県法規集の表示「最終改正：令和７年３月28日条例第15号」、表示時点 令和8年11月21日基準日）", "lastAmendedShort": "令和7年3月28日条例第15号", "desk": "神奈川県 環境農政局 環境部 環境課 水環境グループ（電話 045-210-4123）。届出・相談窓口は土地の所在地ごとに異なる（「神奈川県内の土壌及び水質の窓口一覧」参照。相模原市など権限移譲市は市が窓口）", "rules": [{"art": "第58条", "heading": "土地の区画形質の変更に伴う公害の防止", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "土地の区画形質の変更を行う者一般の努力義務。汚染された土地で区画形質変更を行う者は、公害防止計画等を周辺住民等に周知するよう努める（第2項）。汚染土壌の運搬・処理委託者の努力義務（第3項）。", "duty": "努力義務（届出義務ではない）", "quote": "あらかじめ、当該変更に起因して生ずる公害を防止するために必要な計画その他の事項について、当該汚染された土地の周辺の地域の住民等に周知させるよう努めなければならない。", "url": "https://www.pref.kanagawa.jp/documents/14400/20260113_tebiki.pdf", "verified": true, "judge": false}, {"art": "第58条の2", "heading": "汚染された土地に係る情報の提供", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "汚染された土地の所有者・管理者・占有者は、譲渡・貸与・返還の際に相手方へ汚染状態の情報を提供するよう努める。", "duty": "努力義務", "quote": "当該汚染された土地を譲渡し、貸与し、又は返還しようとするときはその譲渡し、貸与し、又は返還しようとする相手方に対し、当該汚染された土地の汚染状態に関する情報を提供するよう努め", "url": "https://www.pref.kanagawa.jp/documents/14400/20260113_tebiki.pdf", "verified": true, "judge": false}, {"art": "第58条の3", "heading": "汚染土壌による埋立て等の禁止等", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "汚染土壌を使用した埋立て・盛土等の禁止（法の要措置区域等内などの例外あり）。", "duty": "禁止規定", "quote": "何人も、汚染土壌を使用して埋立て、盛土その他の土地への土砂の堆積(以下この条において「埋立て等」という。)を行ってはならない。", "url": "https://www.pref.kanagawa.jp/documents/14400/20260113_tebiki.pdf", "verified": true, "judge": false}, {"art": "第59条", "heading": "特定有害物質の使用状況等の記録の管理等", "trigger": "facility", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "「特定有害物質使用事業所」（特定有害物質を製造・使用・処理・保管する事業所）の設置者は使用状況等を調査・記録（第1項）、「特定有害物質使用地」（当該事業所の敷地。事業所でなくなった場合・廃止された場合の敷地であった土地を含む）の譲渡・貸与・返還時等に記録を交付（第2項）。事業所を廃止しようとするときは土壌汚染の状況を調査し知事に報告（第3項。法の土壌汚染状況調査と重複する範囲は不要）。基準不適合なら知事が所在等を公表（第4項）。", "duty": "廃止時：土壌調査の実施と知事（権限移譲市は市長）への報告。手引き上の書類は「特定有害物質使用事業所(ダイオキシン類管理対象事業所)廃止報告書(様式第22号)」。条文上の期限は「廃止しようとするとき」。", "quote": "当該特定有害物質使用事業所を廃止しようとするときは、前条の指針に基づき、規則で定めるところにより、当該特定有害物質使用事業所に係る特定有害物質使用地における特定有害物質による土壌の汚染の状況を調査し、その結果その他規則で定める事項を知事に報告しなければならない。", "url": "https://www.pref.kanagawa.jp/documents/14400/20260113_tebiki.pdf", "verified": true, "judge": true}, {"art": "第59条第1項", "heading": "（定義）特定有害物質使用事業所", "trigger": "facility", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "対象事業所の呼称は「特定有害物質使用事業所」、その敷地（廃止後等を含む）は「特定有害物質使用地」。", "duty": "使用状況等の調査・記録", "quote": "特定有害物質を製造し、使用し、処理し、又は保管する事業所（以下「特定有害物質使用事業所」という。）を設置している者は、規則で定めるところにより", "url": "https://www.pref.kanagawa.jp/documents/14400/20260113_tebiki.pdf", "verified": true, "judge": false}, {"art": "第60条", "heading": "特定有害物質使用地における土地の区画形質の変更の実施等", "trigger": "facility", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "特定有害物質使用地で土地の区画形質の変更を行おうとする事業者は、計画等を知事に届出（第1項）。変更前に土壌調査を実施し結果を報告（第2項）。区画変更に係る報告で基準不適合なら知事が公表（第3項）。基準不適合の場合は「特定有害物質使用地公害防止計画」を作成・提出し、完了後に報告（第4・5項）。法第3条第7項・第4条第1項の形質変更、要措置区域等内の変更、掘削を伴わない変更、規則で定める軽易な行為、非常災害の応急措置は届出不要。面積による下限はない。", "duty": "事前の届出（手引き上「土地区画形質変更等届出書(第23号様式)」）、土壌調査報告書(第24号様式)、公害防止計画書(第25号様式)等。条文上の期限は「行おうとするとき」（日数の定めは抜粋条文に無い）。非常災害の応急措置は変更後14日以内に届出（第6項）。", "quote": "事業者は、特定有害物質使用地において土地の区画形質の変更を行おうとするときは、土地の区画形質の変更に係る計画その他規則で定める事項を知事に届け出なければならない。", "url": "https://www.pref.kanagawa.jp/documents/14400/20260113_tebiki.pdf", "verified": true, "judge": false}, {"art": "第60条の2", "heading": "周知計画の提出", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "区画形質の変更を行う事業者のうち規則で定める者（公害防止計画書を作成する者）は周知計画を作成・提出し、完了後に結果を報告。", "duty": "周知計画書・周知計画完了報告書の提出", "quote": "土地の区画形質の変更の周知計画（以下「周知計画」という。）を作成しなければならない。", "url": "https://www.pref.kanagawa.jp/documents/14400/20260113_tebiki.pdf", "verified": true, "judge": false}, {"art": "第62条", "heading": "土壌調査結果記録等の管理", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "c "trigger": "facility", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "第81条の4第1項の報告は、各号に定める日（施設の使用廃止日等）から起算して120日以内。特別の事情があるときは知事が期限を延長できる。", "duty": "120日以内に報告", "quote": "第四十八条の二 条例第八十一条の四第一項の規定による報告は、次の各号に掲げる場合の区分に応じ、当該各号に定める日から起算して百二十日以内に行わなければならない。", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000393.html", "verified": true, "judge": false}, {"art": "第81条の5", "heading": "土壌汚染のおそれがある土地の形質の変更が行われる場合の調査", "trigger": "area", "threshold": 3000, "thresholdBasis": "形質変更面積（形質の変更の対象となる土地の面積。敷地面積ではない）。有害物質使用特定施設が設置中・廃止の工場等の敷地は900㎡", "areaBasis": "change", "summary": "土地の形質の変更であって対象となる土地の面積が規則で定める規模（3,000㎡。有害物質使用特定施設が設置されている／廃止された工場・事業場の敷地は900㎡）以上のものをしようとする者は、着手する日の30日前までに、過去の管理有害物質の使用状況等を調査し知事に報告（軽易な行為等・非常災害の応急措置を除く）。第2項: 過去にダイオキシン類が発生・処理された可能性がある場合、土地の所有者等は指定調査機関にダイオキシン類の土壌汚染状況調査をさせ報告。", "duty": "「大阪府生活環境の保全等に関する条例第81条の5第1項の土地の利用履歴等調査結果報告書」（様式第23号の8）を形質変更着手の30日前までに報告（法第4条第1項届出に添えて提出）。", "quote": "土地の形質の変更であって、その対象となる土地の面積が規則で定める規模以上のものをしようとする者は、当該土地の形質の変更に着手する日の三十日前までに、規則で定めるところにより", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": true, "threshold2": 900, "cond2": "有害物質使用特定施設が設置されている、又は廃止された工場・事業場の敷地"}, {"art": "施行規則第48条の24", "heading": "第81条の5第1項の規則で定める規模", "trigger": "area", "threshold": 3000, "thresholdBasis": "形質変更の対象となる土地の面積", "areaBasis": "change", "summary": "規模は3,000㎡。ただし有害物質使用特定施設が設置されている工場・事業場の敷地又は同施設が廃止された工場・事業場の敷地（法第3条第1項本文の報告が行われた土地及び同項ただし書の確認を受けた土地を除く）は900㎡。調査事項（第48条の25）: 土地の利用の履歴及び管理有害物質の使用等の履歴、過去の調査の実施結果。", "duty": "—", "quote": "第四十八条の二十四 条例第八十一条の五第一項の規則で定める規模は、三千平方メートルとする。", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000393.html", "verified": true, "judge": false}, {"art": "施行規則第48条の26", "heading": "第81条の5第1項の報告書の名称・様式", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "報告は「大阪府生活環境の保全等に関する条例第八十一条の五第一項の土地の利用履歴等調査結果報告書」（様式第23号の8）を提出して行う。", "duty": "様式第23号の8の提出", "quote": "条例第八十一条の五第一項の規定による報告は、大阪府生活環境の保全等に関する条例第八十一条の五第一項の土地の利用履歴等調査結果報告書(様式第二十三号の八)を提出して行うものとする。", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000393.html", "verified": true, "judge": false}, {"art": "第81条の5（面積の考え方: 府公式ページ）", "heading": "一定の規模以上の土地の形質を変更するとき", "trigger": "area", "threshold": 3000, "thresholdBasis": "形質変更面積（形質の変更部分の合計面積）", "areaBasis": "change", "summary": "府の案内: 3,000㎡以上の土地の形質変更を行う場合、形質変更者は着手30日前までに法第4条第1項届出とともに条例第81条の5第1項に基づき管理有害物質の使用履歴等を調査し報告。形質変更の面積は敷地面積ではなく形質変更部分の合計面積（飛び地でも一連の行為なら合算）。", "duty": "—", "quote": "土地の形質変更の面積とは、敷地の面積ではなく、形質の変更部分の合計面積を意味します。", "url": "https://www.pref.osaka.lg.jp/o120080/kankyohozen/jiban/dojou-2.html", "verified": true, "judge": false}, {"art": "第81条の6", "heading": "有害物質使用特定施設等が設置されている工場又は事業場等の敷地である土地の調査", "trigger": "facility", "threshold": 900, "thresholdBasis": "形質変更の対象となる土地の面積900㎡以上（規則第48条の28の2）", "areaBasis": "change", "summary": "第1項: 有害物質使用届出施設等が設置されている／廃止された工場・事業場の敷地（第81条の4第1項の報告済み・猶予確認済みの土地を除く）で規則で定める規模（900㎡）以上の形質変更をしようとする者は着手30日前までに利用履歴等を調査・報告。第2項: 使用等の可能性があれば土地の所有者等が土壌汚染状況調査・報告。第3項: 有害物質使用特定施設等が設置されている工場等の敷地を、当該工場等の敷地として利用されない形で形質変更しようとする土地の所有者等は土壌汚染状況調査・報告（ただし書確認あり）。", "duty": "「条例第81条の6第1項の土地の利用履歴等調査結果報告書」（様式第23号の9の2）を着手30日前までに報告。該当時は土壌汚染状況調査結果報告書。", "quote": "における土地の形質の変更であって、その対象となる土地の面積が規則で定める規模以上のものをしようとする者は、当該土地の形質の変更に着手する日の三十日前までに", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": false}, {"art": "第81条の6の2", "heading": "調査結果等の保管及び引継ぎ", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "条例（及び準用により法）に基づき土壌汚染状況調査を実施し又は汚染の除去等の措置を講じた土地の所有者等は、結果を記録・保管し、所有者等の変更時に引き継ぐ。", "duty": "記録・保管・引継ぎ", "quote": "この条例の規定に基づき土壌汚染状況調査を実施し、又は汚染の除去等の措置を講じた土地の所有者等は、その結果を記録し、これを保管しなければならない。", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": false}, {"art": "第81条の7", "heading": "勧告", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "第81条の4〜第81条の6の調査・報告をせず若しくは虚偽の報告をしたとき、届出をしないとき、記録・保管・引継ぎをしないとき、知事は必要な措置を勧告できる。", "duty": "—", "quote": "調査及びその結果を報告することその他の必要な措置をとるべきこと、届出をすべきこと、又は記録をし、保管をし、若しくは引継ぎをすべきことを勧告することができる。", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": false}, {"art": "第81条の8", "heading": "要措置管理区域の指定等", "trigger": "zone", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "土壌汚染状況調査の結果、管理有害物質による汚染状態が規則で定める基準に適合せず、かつ健康被害が生じ又は生ずるおそれがある基準に該当する土地を、汚染の除去等の措置が必要な区域（要措置管理区域）として指定・公示。法第6条・第11条の指定がされた場合（同じ物質）は解除。", "duty": "（知事の指定）", "quote": "知事は、汚染の除去等の措置により、第一項の規定による指定に係る区域(以下「要措置管理区域」という。)の全部又は一部について同項の規定による指定の事由がなくなったと認めるときは", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": true}, {"art": "第81条の9", "heading": "汚染除去等計画の提出等", "trigger": "zone", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "要措置管理区域を指定したとき、知事は土地の所有者等（汚染原因者がいる場合は原因者）に講ずべき措置等を示し汚染除去等計画の作成・提出を指示する。", "duty": "汚染除去等計画の提出、実施措置、完了報告", "quote": "要措置管理区域内の土地の所有者等に対し、当該要措置管理区域内において講ずべき汚染の除去等の措置及びその理由", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": false}, {"art": "第81条の10", "heading": "要措置管理区域内における土地の形質の変更の禁止", "trigger": "zone", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "要措置管理区域内では何人も土地の形質の変更をしてはならない（汚染除去等計画に基づく実施措置等を除く）。", "duty": "形質変更の禁止", "quote": "第八十一条の十 要措置管理区域内においては、何人も、土地の形質の変更をしてはならない。ただし、次に掲げる行為については、この限りでない。", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": false}, {"art": "第81条の12", "heading": "要届出管理区域の指定等", "trigger": "zone", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "基準不適合（第81条の8第1項第1号該当）だが健康被害のおそれの基準（同第2号）に該当しない土地を、形質変更時に届出を要する区域（要届出管理区域）として指定。", "duty": "（知事の指定）", "quote": "当該土地の区域を、その土地が管理有害物質によって汚染されており、当該土地の形質の変更をしようとするときの届出をしなければならない区域として指定するものとする。", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": false}, {"art": "第81条の13", "heading": "要届出管理区域内における土地の形質の変更の届出及び計画変更命令", "trigger": "zone", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "要届出管理区域内で土地の形質の変更をしようとする者は、着手する日の14日前までに形質変更の種類、場所、施行方法、着手予定日等を知事に届け出る。", "duty": "着手14日前までに届出", "quote": "要届出管理区域内において土地の形質の変更をしようとする者は、当該土地の形質の変更に着手する日の十四日前までに、規則で定めるところにより", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": false}, {"art": "第81条の15", "heading": "台帳", "trigger": "ledger", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "知事は要措置管理区域の台帳、要届出管理区域の台帳及びそれぞれ指定が解除された区域の台帳を調製・保管。閲覧を求められたときは正当な理由がなければ拒めない。", "duty": "（知事の義務）台帳の調製・保管・閲覧", "quote": "(以下これらを「台帳」という。)を調製し、これを保管しなければならない。", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": false}, {"art": "第81条の16", "heading": "汚染土壌の搬出時の届出及び計画変更命令", "trigger": "zone", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "要措置管理区域又は要届出管理区域（合わせて「管理区域」）内の汚染土壌を区域外へ搬出しようとする者の届出等。府ページによれば搬出14日前までに区域外搬出届出書を提出。", "duty": "搬出の届出", "quote": "第八十一条の十六 要措置管理区域又は要届出管理区域(以下「管理区域」という。)内の土地の土壌", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": false}, {"art": "第81条の21の3", "heading": "自主調査等の指針", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "知事は自主調査・自主措置及び自主調査で基準不適合と認められる土地における形質変更の実施に関する指針（自主調査等の指針）を定め公表。府公表名は「大阪府土壌汚染に係る自主調査等の実施に関する指針」。知事は指導・助言、結果報告の求めができる。", "duty": "（任意）自主調査結果の報告を求められることがある", "quote": "における土地の形質の変更の実施に関する指針(以下この条において「自主調査等の指針」という。)を定め、公表するものとする。", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": false}, {"art": "第81条の21の4の3", "heading": "指定の申請", "trigger": "zone", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "条例の調査義務の適用を受けない土地でダイオキシン類による基準不適合と思料するとき、土地の所有者等は知事に要措置管理区域・要届出管理区域の指定を申請できる。", "duty": "（任意）指定の申請", "quote": "知事に対し、当該土地の区域について同項又は第八十一条の十二第一項の規定による指定をすることを申請することができる。", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": false}, {"art": "第111条", "heading": "事務処理の特例", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "条例及び規則に基づく事務のうち、土壌関係（第3項第8号〜第24号: 第81条の4〜第81条の6の報告の受理、確認、勧告、区域の指定・解除・公示、台帳の調製・保管・閲覧 等）を含む事務は、第4項により大阪市、堺市、岸和田市、豊中市、池田市、吹田市、泉大津市、高槻市、貝塚市、枚方市、茨木市、八尾市、泉佐野市、富田林市、寝屋川市、河内長野市、松原市、箕面市、東大阪市、大阪狭山市、阪南市、豊能町、能勢町、忠岡町、太子町、河南町及び千早赤阪村の区域に係るものは当該市町村が処理する（一部の号の除外あり）。第3項は守口市、和泉市及び熊取町。", "duty": "—", "quote": "八 第八十一条の四第一項、第五項及び第六項並びに第八十一条の五各項並びに第八十一条の六第一項から第三項まで並びに第八十一条の九第九項の規定による報告の受理に関する事務", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "verified": true, "judge": false}], "notes": [], "extraSubstances": ["ダイオキシン類（ダイオキシン類対策特別措置法第2条第1項に規定するダイオキシン類）"], "zones": [{"name": "要措置管理区域", "art": "第81条の8"}, {"name": "要届出管理区域", "art": "第81条の12"}, {"name": "管理区域（要措置管理区域又は要届出管理区域の総称）", "art": "第81条の16"}], "pages": [{"title": "大阪府生活環境の保全等に関する条例（大阪府例規集）", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000392.html", "what": "条例本文（現行）"}, {"title": "大阪府生活環境の保全等に関する条例施行規則（大阪府例規集）", "url": "https://www.pref.osaka.lg.jp/houbun/reiki/reiki_honbun/k201RG00000393.html", "what": "施行規則本文（現行）"}, {"title": "土壌汚染対策制度／大阪府", "url": "https://www.pref.osaka.lg.jp/o120080/kankyohozen/jiban/dojou.html", "what": "府の土壌汚染対策制度の総合ページ（2026年8月10日更新）。条例は法に調査対象物質（ダイオキシン類）及び調査契機を追加と説明"}, {"title": "一定の規模以上の土地の形質を変更するとき／大阪府", "url": "https://www.pref.osaka.lg.jp/o120080/kankyohozen/jiban/dojou-2.html", "what": "3,000㎡以上の形質変更（法第4条・条例第81条の5）の手続"}, {"title": "3,000㎡（有害物質使用特定施設が操業中の場合は900㎡）以上の形質変更が行われる土地の利用履歴報告（条例第81条の5第1項）／大阪府", "url": "https://www.pref. f.aichi.jp/uploaded/attachment/276454.pdf", "what": "条例パンフレット（フロー図・法との比較・窓口）"}], "appliesNote": "名古屋市内は第45条及び第45条の2を除き適用除外で、名古屋市条例が適用（県パンフレット：「名古屋市内については、第４５条及び第４５条の２の規定を除き適用除外となり、」）。適用除外地（第44条）：農用地、要措置区域内の土地、一般廃棄物処理施設等の存する土地。", "basis": null, "excludeCities": ["名古屋市"], "checkedOn": "2026-11-21", "noneVerified": false, "numberShort": "平成15年愛知県条例第7号"}, {"pref": "愛知県", "city": "名古屋市", "name": "市民の健康と安全を確保する環境の保全に関する条例（名古屋市環境保全条例）", "origName": "市民の健康と安全を確保する環境の保全に関する条例（名古屋市環境保全条例）", "instrument": null, "number": "平成15年名古屋市条例第15号", "lastAmended": "令和7年3月31日公布・令和7年6月1日施行（拘禁刑創設に伴う改正。市ページの表記は「条例第129条、第130条」）。土壌規制部分に係る直近改正は条文PDF冒頭の改正履歴上「令和3年名古屋市条例第39号」", "lastAmendedShort": "令和7年3月31日公布・令和7年6月1日施行", "desk": "名古屋市 環境局 地域環境対策部 地域環境対策課 有害化学物質対策担当（電話 052-972-2677）", "rules": [{"art": "第57条", "heading": "大規模な土地の形質の改変時の調査", "trigger": "area", "threshold": 3000, "thresholdBasis": "土地の形質の変更の対象となる土地の面積（施行細則第51条：3,000㎡。現に有害物質使用特定施設が設置されている工場・事業場の敷地又は使用が廃止された同施設に係る工場・事業場の敷地は900㎡）", "areaBasis": "change", "summary": "規模以上の土地の形質変更をしようとする者は、過去の特定有害物質等取扱工場等の設置状況等（土地利用履歴）を調査し市長に報告。", "duty": "報告義務。書類：特定有害物質等取扱工場等設置状況等調査結果報告書（第16号様式の3、細則第51条の2）。期限：形質変更に着手する日の30日前まで", "quote": "その対象となる土地の面積が規則で定める規模以上のものをしようとする者は、当該土地の形質の変更に着手する日の30日前までに、規則で定めるところにより、当該土地における過去の特定有害物質等を取り扱っていた工場等の設置の状況その他の規則で定める事項を調査し、その結果を市長に報告しなければならない", "url": "https://www.city.nagoya.jp/_res/projects/default_project/_page_/001/008/790/kankyouhozennjyourei.pdf", "verified": true, "judge": true, "threshold2": 900, "cond2": "現に有害物質使用特定施設が設置されている、又は廃止された工場・事業場の敷地"}, {"art": "第55条", "heading": "土地の形質の変更時の調査", "trigger": "area", "threshold": 500, "thresholdBasis": "特定有害物質等取扱工場等の敷地における形質変更の対象となる土地の面積（施行細則第49条：500㎡以上3,000㎡未満）。市案内：「特定有害物質等取扱工場等における500平方メートル以上3,000平方メートル未満の土地の形質の変更のうち、土壌汚染対策法の届出対象になるものは環境保全条例の対象外となります。」（https://www.city.nagoya.jp/kankyo/page/0000116349.html）", "areaBasis": "change", "summary": "特定有害物質等取扱事業者が自らの特定有害物質等取扱工場等の敷地で規模該当の形質変更をするとき、指定調査機関に土壌・地下水の汚染状況を調査させ市長に報告。調査せず土地を譲渡した場合は譲受人が義務を負う（第2項）。", "duty": "調査・報告義務。書類：土壌汚染等調査結果報告書（第16号様式、細則第49条の2）。期限：形質変更に着手する日まで。事前に調査計画書届出（第56条、第16号様式の2）", "quote": "当該土地の形質の変更に着手する日までに、規則で定めるところにより、当該土地の形質の変更（盛土を除く。）に係る土地の土壌及び土地にある地下水の特定有害物質による汚染の状況について、指定調査機関に土壌汚染等対策指針で定める方法により調査させて、その結果を市長に報告しなければならない。", "url": "https://www.city.nagoya.jp/_res/projects/default_project/_page_/001/008/790/kankyouhozennjyourei.pdf", "verified": true, "judge": false, "cond": "特定有害物質等を取り扱う工場等の敷地に限る", "condLabel": "工場等の敷地なら対象"}, {"art": "第54条", "heading": "汚染状況の調査等", "trigger": "facility", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "特定有害物質等取扱事業者の汚染状況把握の努力義務（第1項）と、汚染のおそれがある場合の市長による調査・報告命令（第2項）。施設・工場の「廃止」を契機とする調査義務の条は、第52条〜第60条の5の条見出しを通覧した範囲では確認できなかった。", "duty": "努力義務／命令に基づく調査・報告", "quote": "当該特定有害物質等取扱工場等の敷地である土地の土壌及び土地にある地下水の特定有害物質による汚染の状況を把握するよう努めなければならない。", "url": "https://www.city.nagoya.jp/_res/projects/default_project/_page_/001/008/790/kankyouhozennjyourei.pdf", "verified": true, "judge": false}, {"art": "第58条・第58条の4・第58条の8", "heading": "措置管理区域の指定等／拡散防止管理区域の指定等／形質変更時届出管理区域の指定等", "trigger": "zone", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "土壌汚染等調査の結果、土壌汚染等処理基準に適合しない土地を条例独自の3区域のいずれかに指定。拡散防止管理区域・形質変更時届出管理区域内の形質変更は市長へ計画の届出（第58条の7、第58条の9）。措置管理区域は形質変更原則禁止（第58条の3）。", "duty": "区域内の形質変更時の届出等", "quote": "土壌汚染等調査の結果、土壌の汚染状態が土壌汚染等処理基準に適合しない土地については、措置管理区域、拡散防止管理区域または形質変更時届出管理区域のいずれかに指定します。", "url": "https://www.city.nagoya.jp/shisei/keikaku/1008387/1008424/1008838/1008841/1008843.html", "verified": true, "judge": true}, {"art": "第59条", "heading": "管理区域等台帳", "trigger": "ledger", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "市長は措置管理区域・拡散防止管理区域・形質変更時届出管理区域の台帳、指定解除された区域の台帳等（管理区域等台帳）を調製・保管し、閲覧に供する。", "duty": "（市長の台帳調製・閲覧）", "quote": "市長は、措置管理区域の台帳、拡散防止管理区域の台帳、形質変更時届出管理区域の台帳", "url": "https://www.city.nagoya.jp/_res/projects/default_project/_page_/001/008/790/kankyouhozennjyourei.pdf", "verified": true, "judge": false}, {"art": "第57条の2", "heading": "自主調査に係る報告等", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "条例・法の調査以外の自主調査で土壌汚染等処理基準不適合が判明したときの報告に関する規定（詳細な義務の範囲は未精読）。", "duty": "自主調査結果の報告（様式：自主調査結果報告書）", "quote": null, "url": "https://www.city.nagoya.jp/_res/projects/default_project/_page_/001/008/790/kankyouhozennjyourei.pdf", "verified": false, "judge": false}], "notes": [], "extraSubstances": [], "zones": [{"name": "措置管理区域", "art": "第58条"}, {"name": "拡散防止管理区域", "art": "第58条の4"}, {"name": "形質変更時届出管理区域", "art": "第58条の8"}, {"name": "除去済み特例区域（管理区域に指定しない特例）", "art": "第58条ただし書、第58条の4ただし書、第58条の8ただし書"}, {"name": "管理区域等台帳", "art": "第59条"}], "pages": [{"title": "土壌汚染対策｜名古屋市公式ウェブサイト", "url": "https://www.city.nagoya.jp/shisei/keikaku/1008387/1008424/1008777/1008787.html", "what": "土壌汚染対策トップ（法・条例の案内、窓口）"}, {"title": "名古屋市環境保全条例に基づく区域の指定｜名古屋市公式ウェブサイト", "url": "https://www.city.nagoya.jp/shisei/keikaku/1008387/1008424/1008838/1008841/1008843.html", "what": "条例に基づく区域の解説と一覧"}, {"title": "水質汚濁防止法・下水道法に基づく特定事業場一覧、土壌汚染に係る区域指定一覧", "url": "https://www.city.nagoya.jp/shisei/keikaku/1008387/1008424/1008777/1008783.html", "what": "土対法・条例の区域指定一覧（リンク先本文は未取得）"}, {"title": "市民の健康と安全を確保する環境の保全に関する条例（環境保全条例）｜名古屋市公式ウェブサイト", "url": "https://www.city.nagoya.jp/shisei/keikaku/1008387/1008424/1008789/1008790.html", "what": "条例・施行細則PDFと改正履歴"}], "appliesNote": "名古屋市内に適用。平成25年3月31日までに旧条例に基づき汚染報告をした土地で除去未完了のものは形質変更時届出管理区域とみなされる（条例附則第6条第2項、市ページ記載）。", "basis": null, "excludeCities": [], "checkedOn": "2026-11-21", "noneVerified": false, "numberShort": "平成15年名古屋市条例第15号"}, {"pref": "三重県", "city": null, "name": "三重県生活環境の保全に関する条例", "origName": "三重県生活環境の保全に関する条例", "instrument": null, "number": "平成13年3月27日三重県条例第7号", "lastAmended": "平成31年3月18日三重県条例第25号（例規集本文末尾の最後の附則。確認日時点の例規集表示）", "lastAmendedShort": "平成31年3月18日三重県条例第25号", "desk": "三重県 環境生活部 環境共生局 大気・水環境課 水環境班（電話 059-224-2382）。窓口は各地域防災総合事務所等の環境室（所管区域表は県概要ページ）", "rules": [{"art": "第72条の2", "heading": "土地の形質変更時の調査等", "trigger": "area", "threshold": 3000, "thresholdBasis": "形質変更を行おうとする土地の面積（規則第83条の2：3千㎡。現に有害物質使用特定施設が設置されている工場等の敷地又は同施設が廃止された工場等の敷地〔法3条1項本文の報告済みを除く〕は900㎡）", "areaBasis": "change", "summary": "土地の所有者等は、規模以上の形質変更を行おうとするとき、過去の特定有害物質取扱工場等の設置状況等（地歴）を調査し記録。工場等の立地が認められた場合は土壌・地下水の汚染状況を調査し記録（第2項）。", "duty": "調査・記録義務（知事への届出義務ではない）。県は法4条届出時に地歴調査結果書（県様式）の提出を求める運用。違反時は知事の勧告（第72条の4第3項）", "quote": "当該土地における過去の特定有害物質（土壌汚染対策法（平成十四年法律第五十三号）第二条第一項に規定する特定有害物質をいう。以下同じ。）の製造、使用その他の取扱いを行っていた工場等の設置の状況その他の規則で定める事項を調査し、その結果を記録しなければならない。", "url": "https://en3-jg.d1-law.com/mie-ken/d1w_reiki/H413901010007/H413901010007_j.html", "verified": true, "judge": true, "threshold2": 900, "cond2": "現に有害物質使用特定施設が設置されている、又は廃止された工場等の敷地"}, {"art": "第72条の3", "heading": "有害物質使用特定施設における調査等", "trigger": "facility", "threshold": 300, "thresholdBasis": "第2項：特定工場等の敷地内で300㎡以上の形質変更（規則第83条の7）。第1項：稼働中施設の定期調査（1年を超えない期間に1回以上、規則第83条の5）", "areaBasis": "change", "summary": "有害物質使用特定施設を設置する工場等の土地所有者等は、土壌又は地下水の汚染状況を定期に調査・記録（第1項）。当該土地で300㎡以上の形質変更を行うときは土壌を調査・記録（第2項）。※施設「廃止」時の調査は条例ではなく法第3条による。", "duty": "調査・記録義務", "quote": "特定工場等所有者等は、当該土地において規則で定める面積以上の形質変更を行おうとするときは、知事が別に定める方法により、当該土地の土壌の特定有害物質による汚染の状況について調査し、その結果を記録しなければならない。", "url": "https://en3-jg.d1-law.com/mie-ken/d1w_reiki/H413901010007/H413901010007_j.html", "verified": true, "judge": false}, {"art": "第72条の4", "heading": "土壌又は地下水の特定有害物質による汚染発見時の届出等", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "土地の所有者等は、基準を超える土壌・地下水汚染を発見したとき、速やかに応急措置を講じ、汚染状況・措置を知事に届出。知事は関係市町長に通知し必要に応じ公表。", "duty": "届出義務。書類：土壌・地下水汚染発見に係る届出書（第24号様式の2、規則第83条の9）。期限：速やかに", "quote": "汚染を発見したときは、速やかに当該汚染の拡散を防止するための応急の措置を講ずるとともに、当該汚染の状況及び講じた措置について、規則で定めるところにより、知事に届け出なければならない。", "url": "https://en3-jg.d1-law.com/mie-ken/d1w_reiki/H413901010007/H413901010007_j.html", "verified": true, "judge": false}, {"art": "第72条の8", "heading": "（県外からの汚染土壌の県内搬入に係る届出）", "trigger": "other", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "県外から特定有害物質で汚染された土壌を県内で処分するため搬入しようとする土地の所有者等は事前に知事へ届出（県概要ページの説明。条見出しの原文は未確認）。", "duty": "事前届出", "quote": "県外から、特定有害物質で汚染された土地の土壌を県内で処分するために搬入しようとする土地の所有者等は、事前に知事に届け出ることが必要です。", "url": "https://www.pref.mie.lg.jp/eco/earth/12325014760.htm", "verified": true, "judge": false}], "notes": [], "extraSubstances": [], "zones": [], "pages": [{"title": "三重県｜土壌・地下水：土壌汚染対策法及び三重県生活環境の保全に関する条例（関係分）の概要", "url": "https://www.pref.mie.lg.jp/eco/earth/12325014760.htm", "what": "法・条例の概要、様式、窓口一覧"}, {"title": "三重県生活環境の保全に関する条例について（土壌及び地下水汚染に関する規制）（PDF）", "url": "https://www.pref.mie.lg.jp/common/content/000827587.pdf", "what": "条例・規則の条文抜粋付き概要"}, {"title": "三重県生活環境の保全に関する条例（三重県例規集）", "url": "https://en3-jg.d1-law.com/mie-ken/d1w_reiki/H413901010007/H413901010007_j.html", "what": "条例全文（例規集）"}], "appliesNote": "土対法の区域指定公表ページURLは未特定（概要ページに区域指定の説明あり）。", "basis": null, "excludeCities": [], "checkedOn": "2026-11-21", "noneVerified": false, "numberShort": "平成13年3月27日三重県条例第7号"}, {"pref": "滋賀県", "city": null, "name": "滋賀県公害防止条例", "origName": "滋賀県公害防止条例", "instrument": null, "number": "昭和47年12月21日滋賀県条例第57号", "lastAmended": "令和7年条例第5号（例規集の付則一覧の最後。公布日は未確認）", "lastAmendedShort": "令和7年条例第5号", "desk": "滋賀県 琵琶湖環境部 環境政策課 環境管理係／各環境事務所（大津市内は大津市環境政策課）", "rules": [{"art": "第49条", "heading": "指定有害物質使用特定施設の使用の廃止時の調査", "trigger": "facility", "threshold": null, "thresholdBasis": "", "areaBasis": "change", "summary": "使用が廃止された指定有害物質使用特定施設（水質汚濁防止法の特定施設であるものを除く＝条例独自の特定施設）に係る工場等の敷地であった土地の所有者等は、指定調査機関に調査させ知事に報告。利用方法からみて健康被害のおそれがない旨の知事の確認を受けた場合は猶予。", "duty": "調査・報告義務。書類：土壌の汚染の状況についての調査結果報告書（別記様式第15号）※様式名は検索要約のみで原文未確認。期限：廃止日（通知を受けた者は通知日）から120日以内（規則第29条の2）", "quote": "に規則で定める方法により調査させて、その結果を知事に報告しなければならない。ただし、規則で定めるところにより、当該土地について予定されている利用の方法からみて土壌の指定有害物質による汚染により人の健康に係る被害が生ずるおそれがない旨の知事の確認を受けた場合は、この限りでない。", "url": "https://www.pref.shiga.lg.jp/site/jourei/reiki_int/reiki_honbun/k001RG00001104.html", "verified": true, "judge": true}, {"art": "第50条", "heading": "土地の形質変更時の調査", "trigger": "zone", "threshold": null, "thresholdBasis": "面積要件なし（条文上）。対象地＝「指定有害物質使用地」（土対法施行前に廃止された水濁法特定施設、又は平成19年条例第53号施行前に廃止された特定施設で指定 async function runCreate(d){
  const c=blankCase(d);const files=ST.files.slice();const useAI=AI.mode!=='none'&&files.length>0;
  const steps=[['docs','資料の種類を判別',files.length?`${files.length}点`:'資料なし'],['read','資料を読み取り',useAI?`0 / ${files.length}`:files.length?'未接続のため添付として登録':'—'],['land','地番ごとの履歴を整理',''],['law','法令・条例を照合',''],['gw','地下水流向を推定',''],['draft','所見の下書き','']];
  $('view').innerHTML=`<div class="wrap narrow"><div class="proc"><h1>レポートを作成しています</h1><p class="sub">${esc(c.title)}</p><div class="psteps">${steps.map(s=>`<div class="ps" id="ps-${s[0]}"><i></i><b>${s[1]}</b><span>${s[2]}</span></div>`).join('')}</div><div class="err" id="p-err"></div></div></div>`;
  const mark=(id,state,txt)=>{const e=$('ps-'+id);if(!e)return;e.className='ps '+state;if(txt!=null)e.querySelector('span').textContent=txt;};
  const tick=ms=>new Promise(r=>setTimeout(r,ms));
  try{
    mark('docs','run');const letters={一般公表資料:'ABCDEFGH',公的資料:'ABCD',私的資料:'ABCD'};const cnt={一般公表資料:0,公的資料:0,私的資料:0};
    const ids=files.map(f=>{const k=kindByName(f.name);if(k[1]==='本文'){c.docs.push({id:'R',kind:k[0],name:f.name,cls:'本文',pages:''});return 'R';}const id=(k[1]==='私的資料'?'P':k[1]==='公的資料'?'K':'')+letters[k[1]][cnt[k[1]]++];c.docs.push({id,kind:k[0],name:f.name,cls:k[1],pages:''});return id;});
    await tick(250);mark('docs','ok');
    mark('read','run');
    if(useAI){for(let i=0;i<files.length;i++){mark('read','run',`${i+1} / ${files.length}　${files[i].name}`);
        try{const part=await aiExtractFile(files[i]);const doc=c.docs.find(x=>x.id===ids[i]);if(doc&&part.kind)doc.kind=part.kind.replace(/（.*$/,'');if(part.kind==='既往報告書'){c.source={file:files[i].name,pages:null,bodyOffset:0,overviewP:(part.site&&+part.site.p)||null,lawsP:(part.meta&&+part.meta.lawsP)||null};}mergePart(c,part,ids[i]);}
        catch(e){c.diffs.push({sev:'bad',text:`「${files[i].name}」を読み取れませんでした：${e.message}`});}}
      mark('read','ok',`${files.length}点`);}
    else{await tick(200);mark('read',files.length?'skip':'ok');}
    files.forEach((f,i)=>{ST.pdf[c.id+':'+ids[i]]=f;});if(c.source){const i=ids.indexOf('R');if(i>=0)ST.pdf[c.id]=files[i];}
    mark('land','run');await tick(200);mark('land','ok',c.land.length?`${c.land.length}筆・${c.land.reduce((a,l)=>a+l.rows.length,0)}行`:'登記簿の共有待ち');
    mark('law','run');finalizeCase(c);await tick(200);const os=ordFor(c.site.pref,c.site.city).filter(o=>o.rules&&o.rules.length);mark('law','ok',`土壌汚染対策法${os.length?'＋'+os.map(o=>o.name.replace(/（.*?）/g,'')).join('、'):''}`);
    mark('gw','run');
    if(c.site.lat&&!c.site.gwText){try{const g=await estimateGW(c.site.lat,c.site.lng);if(g){c.site.gwDir=g.dir||'';c.site.gwElev=g;
        c.site.gwText=g.dir?`調査対象地の標高は約${g.elev.toFixed(1)}mであり、周囲${g.r}mの標高と比較すると${g.dir}方向が約${g.drop.toFixed(1)}m低い。このことから調査対象地における地下水の流向は、概ね${g.dir}向きの流向が推定される。ただし、調査対象地における局所的な地下水の流れについては、調査対象地及び隣接地の地下構造物等にも影響されることに注意が必要となる。`
          :`調査対象地の標高は約${g.elev.toFixed(1)}mであり、周囲${g.r}mの標高差は${Math.max(0,g.drop).toFixed(1)}mとほぼ平坦である。地形からは流向を特定できないため、周辺の河川・海域の位置関係から判断する必要がある。`;mark('gw','ok',g.dir?`${g.dir}向き（標高差 ${g.drop.toFixed(1)}m）`:'平坦のため特定できず');}else mark('gw','skip','標高を取得できず');}catch(e){mark('gw','skip','標高APIに接続できず');}}
    else mark('gw',c.site.gwText?'ok':'skip',c.site.gwText?'資料の記載を採用':'位置が未設定');
    mark('draft','run');await tick(250);mark('draft','ok',c.verdict?`所見：${c.verdict.level}`:'');
    ST.cases.unshift(c);saveCases();ST.files=[];ST.draft=null;await tick(350);ST.tab='review';go('case',c.id);toast('レポートを作成しました。右の「確認」に、人の目が必要な点だけを出しています');
  }catch(e){$('p-err').innerHTML=`作成に失敗しました：${esc(e.message)}　<button class="btn mini" type="button" onclick="go('new')">入力に戻る</button>`;}
}
