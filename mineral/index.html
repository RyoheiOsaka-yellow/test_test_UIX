    });
  }
  leg('ACCESSORY CRYSTALS',ns);
},

/* ---------- 結晶 04 群晶 ---------- */
druse(){
  SCENE.grainUm = 25000;
  const u=GRAINR();
  const baseY=FRAD*.30;
  const base=walkPath(-FRAD*1.02, baseY+rr(-20,20), rr(-.10,.10), FRAD*.29, 7, .18);
  /* 母岩 */
  op(-200, function(){
    const gp=base.slice();
    gp.push([FRAD*1.1, baseY+FRAD*.42]); gp.push([-FRAD*1.1, baseY+FRAD*.42]);
    hatch2(SCR(gp),{color:col(3),a:.20,sp:3.2,ang:-.95,wash:true,cross:true});
    curve2(SCR(base),{w:1.6,a:.5,color:EDGE,passes:2,jit:.8},false);
    for(let i=0;i<Math.round(14*DETN());i++){
      const t=R(), idx=clamp(Math.floor(t*(base.length-1)),0,base.length-2);
      const bx=lerp(base[idx][0],base[idx+1][0],R());
      const by=lerp(base[idx][1],base[idx+1][1],R())+u*rr(.4,3.0);
      blobW(bx,by,u*rr(.06,.16),{color:DEEP,a:.4,jag:.35});
    }
  });
  leg('MATRIX',1);
  /* 結晶群(奥→手前) */
  const rowsN = S.density==='MANY'? 3 : S.density==='MODERATE'? 2 : 2;
  let total=0;
  for(let rw=0; rw<rowsN; rw++){
    const back = rw<rowsN-1;
    const n = back? Math.round(rr(7,11)) : Math.round(rr(4,7));
    for(let i=0;i<n;i++){
      const t=(i+rr(.1,.9))/n;
      const idx=clamp(Math.floor(t*(base.length-1)),0,base.length-2);
      const ft=(t*(base.length-1))%1;
      const bx=lerp(base[idx][0],base[idx+1][0],ft);
      const by=lerp(base[idx][1],base[idx+1][1],ft) - rw*u*.30;
      const sys=S.shape;
      const slim = sys==='HEX';               /* 六方: すらりとした柱 */
      const tab  = sys==='MONO';              /* 単斜: 板状で傾く */
      const stub = sys==='CUBIC';             /* 等軸: ずんぐり */
      const sc=(back? rr(.40,.66) : rr(.80,1.30)) * (slim? .92 : 1);
      const cr=u*sc;
      const lean=rr(-.50,.50) + (tab? rr(-.35,.35) : 0);
      const hh = cr*(slim? 2.9 : stub? 1.15 : tab? 1.8 : 2.1);
      const ww = cr*(tab? 1.25 : stub? 1.15 : slim? .82 : .92);
      const F=placeFaces(prismFaces(ww, hh, (tab||stub)?2:3,
              {tip:cr*(slim?1.1:stub?.45:.80), uneven:!stub,
               roof: tab? .55 : 0, shear: tab? .30 : 0}),
              bx, by-hh*.98, lean);
      drawCrystal(F,{ ci:back?3:0, d: back? -150+rw*10+i*.1 : by+i*.1,
                      a: back? .11 : .17, lw: back? 1.0 : 1.28,
                      stri: back?0:Math.round(7*DETN()), striang:lean,
                      shade: back? .8 : null });
      total++;
    }
  }
  leg('DRUSE CRYSTALS',total);
  note(0,baseY-u*2.6,'TERMINATION',1);
  note(-FRAD*.5,baseY+u*.3,'MATRIX',-1);
},
/* ---------- 薄片 01 花崗岩 ---------- */
granitic(){
  SCENE.grainUm = 900;
  const X=FRAD*.95, Y=FRAD*ASPY*.95;
  const region=[[-X,-Y],[X,-Y],[X,Y],[-X,Y]];
  const tex=S.shape;
  const sp=GRAINR()*(tex==='GLASSY'? 3.1 : 2.05);
  const cells=mosaic(region, sp, {gap:.93, smooth:0, maxCells:300,
                                  relax: tex==='EQUIGRAN'? 2 : 1,
                                  vary:  tex==='EQUIGRAN'? .12 : tex==='PORPHYRO'? .46 : .30,
                                  stretch: tex==='FOLIATED'? 2.0 : 1});
  let cnt={QZ:0,FSP:0,BIO:0,HBL:0};
  cells.forEach(function(cp,i){
    const c=polyCentroid(cp), rad=polyRad(cp,c);
    const roll=R();
    const kind = roll<.34? 'QZ' : roll<.66? 'FSP' : roll<.83? 'BIO' : 'HBL';
    cnt[kind]++;
    if(kind==='QZ'){
      /* 石英は縫合状の粒界。累帯はしないので内部は波動消光だけ */
      const q=wavyEdges(cp, rad*.055, 2);
      putFace(q,{color:col(2),a:.13,sp:4.0,ang:-.55,lw:1.05,ea:.72}, c[1]);
      op(c[1]+.4, function(){
        if(DETN()>.9) traceW(q, Math.round(3*DETN()), rr(0,3.1), {w:.5,a:.14});
        if(S.state==='FRACT' && chance(.4)) interior(q,{wash:col(2),round:true});
      });
    }else if(kind==='FSP'){
      putFace(cp,{color:col(0),a:.14,sp:3.6,ang:-.75,lw:1.15,inner:.88}, c[1]);
      op(c[1]+.4, function(){
        const n=Math.round(rr(3,7)*DETN());
        traceW(cp, n, Math.atan2(cp[1][1]-cp[0][1],cp[1][0]-cp[0][0])+Math.PI/2, {w:.65,a:.26,alt:true});
        leg('ALBITE TWINNING',n);
        /* 累帯・変質は長石だけ、しかも一部の粒に */
        if(chance(.45)) interior(cp,{wash:col(3)});
      });
    }else if(kind==='BIO'){
      const ang=tex==='FOLIATED'? rr(-.2,.2) : R()*TAU;
      const flat=scalePoly(movePoly(cp,-c[0],-c[1]),1,.55);
      const bp=movePoly(rotPoly(flat,ang),c[0],c[1]);
      /* 黒雲母はいちばん濃い鉛筆で */
      putFace(bp,{color:DEEP,a:.30,sp:2.4,ang:ang,lw:1.3,ea:.9}, c[1]+.2);
      op(c[1]+.5, function(){
        traceW(bp, Math.round(rr(7,12)*DETN()), ang, {w:.65,a:.40});
        if(chance(.4)) speckW(c[0],c[1],rad*.5,3,{color:DEEP,a:.5});
      });
    }else{
      putFace(cp,{color:col(3),a:.26,sp:2.8,ang:-.4,lw:1.25,inner:.86}, c[1]+.1);
      op(c[1]+.5, function(){
        const a0=R()*TAU;
        traceW(cp, Math.round(5*DETN()), a0, {w:.6,a:.34});
        traceW(cp, Math.round(4*DETN()), a0+1.05, {w:.6,a:.34});
        if(chance(.35)) interior(cp,{wash:col(3)});
      });
      leg('CLEAVAGE 56/124',1);
    }
  });
  leg('QUARTZ',cnt.QZ); leg('FELDSPAR',cnt.FSP);
  leg('BIOTITE',cnt.BIO); leg('HORNBLENDE',cnt.HBL);
  /* 副成分鉱物 */
  const na=Math.round(6*DENN()*DETN());
  for(let i=0;i<na;i++){
    const p=FPOS(.9), r=GRAINR()*rr(.10,.22);
    op(p[1]+3, function(){
      const g=nGon(p[0],p[1],r,ri(4,6),R()*TAU,.12);
      fillPoly(SCR(g),DEEP,.62);
      poly2(SCR(g),{w:.8,a:.55,color:DEEP,passes:1,jit:.3,over:1},true);
    });
  }
  leg('ACCESSORY (ZIRCON/OPAQUE)',na);
  note(0,0,'QUARTZ',1);
  note(-FRAD*.45, FRAD*.35,'BIOTITE',-1);
},

/* ---------- 薄片 02 斑状組織 ---------- */
porphyry(){
  SCENE.grainUm = 700;
  const X=FRAD*.95, Y=FRAD*ASPY*.95;
  const region=[[-X,-Y],[X,-Y],[X,Y],[-X,Y]];
  const u=GRAINR();
  /* 石基 */
  const gm=mosaic(region, u*.62, {gap:.90, smooth:0, relax:1});
  const flow=rr(-.5,.5);
  gm.forEach(function(cp,i){
    const c=polyCentroid(cp);
    op(-500+i*.01, function(){
      hatch2(SCR(cp),{color:col(i%2? 2:3),a:.08,sp:4.6,ang:flow-.4,wash:true});
      poly2(SCR(cp),{w:.55,a:.20,color:EDGE,passes:1,jit:.4},true);
    });
  });
  leg('GROUNDMASS',gm.length);
  /* 石基のマイクロライト(流理) */
  if(S.shape!=='EQUIGRAN'){
    const nm=Math.round(90*DETN()*DENN());
    for(let i=0;i<nm;i++){
      const p=FPOS(.97), a=flow+rr(-.35,.35), L=u*rr(.12,.30);
      op(-400+i*.001, function(){
        lnw([p[0]-Math.cos(a)*L,p[1]-Math.sin(a)*L],[p[0]+Math.cos(a)*L,p[1]+Math.sin(a)*L],
            {w:.75,a:.30,color:EDGE,passes:1,jit:.3});
      });
    }
    leg('MICROLITES',nm);
  }
  /* 斑晶 */
  const n = S.density==='MANY'? ri(7,10) : S.density==='MODERATE'? ri(5,7) : ri(3,4);
  const pos=[];
  for(let i=0;i<n*5 && pos.length<n;i++){
    const p=FPOS(.72);
    let ok=true;
    for(const q of pos) if(Math.hypot(p[0]-q[0],p[1]-q[1])<u*2.0){ ok=false; break; }
    if(ok) pos.push(p);
  }
  pos.forEach(function(p,i){
    const r=u*rr(.75,1.35)*(i===0?1.4:1);
    const rot=R()*TAU;
    const type = i%3;
    if(type===0){
      /* 長石斑晶(自形の短冊) */
      const w2=r*.55, h2=r*1.30;
      let poly=[[-w2,-h2],[w2,-h2],[w2,h2],[-w2,h2]];
      poly=[[-w2,-h2],[0,-h2*1.22],[w2,-h2],[w2,h2],[0,h2*1.22],[-w2,h2]];
      poly=movePoly(rotPoly(poly,rot),p[0],p[1]);
      putFace(poly,{color:col(0),a:.15,sp:3.4,ang:rot,lw:1.35,inner:.88}, p[1]);
      op(p[1]+.5, function(){
        traceW(poly, Math.round(rr(5,10)*DETN()), rot+Math.PI/2, {w:.75,a:.32,alt:true});
        interior(poly,{ang:rot});
      });
      leg('FELDSPAR PHENOCRYST',1);
    }else if(type===1){
      /* 石英斑晶(融食の湾入) */
      let poly=nGon(0,0,r*.95,6,rot,.06);
      poly=poly.map(function(q,k){ return k%2? [q[0]*.78,q[1]*.78] : q; });
      poly=movePoly(chaikin(poly,1),p[0],p[1]);
      putFace(poly,{color:col(2),a:.09,sp:4.4,ang:rot-.5,lw:1.2,round:true}, p[1]);
      op(p[1]+.5, function(){ interior(poly,{round:true,wash:col(2)}); });
      leg('QUARTZ PHENOCRYST',1);
    }else{
      /* 有色鉱物斑晶(輝石・角閃石) */
      const poly=movePoly(nGon(0,0,r*.85,ri(6,8),rot,.10),p[0],p[1]);
      putFace(poly,{color:col(1),a:.30,sp:2.6,ang:rot-.4,lw:1.3,inner:.85}, p[1]);
      op(p[1]+.5, function(){
        traceW(poly,Math.round(5*DETN()),rot,{w:.6,a:.34});
        traceW(poly,Math.round(4*DETN()),rot+1.05,{w:.6,a:.34});
        speckW(p[0],p[1],r*.55,Math.round(4*INCN()),{color:DEEP,a:.5});
      });
      leg('MAFIC PHENOCRYST',1);
    }
  });
  note(pos.length?pos[0][0]:0, pos.length?pos[0][1]:0, 'PHENOCRYST', 1);
  note(-FRAD*.5, -FRAD*.5, 'GROUNDMASS', -1);
},

/* ---------- 薄片 03 玄武岩(オフィティック) ---------- */
ophitic(){
  SCENE.grainUm = 320;
  const X=FRAD*.95, Y=FRAD*ASPY*.95;
  const region=[[-X,-Y],[X,-Y],[X,Y],[-X,Y]];
  const u=GRAINR();
  /* 間隙を埋める輝石 */
  const px=mosaic(region, u*2.4, {gap:.99, smooth:1, relax:2});
  px.forEach(function(cp,i){
    op(-600+i*.01, function(){
      hatch2(SCR(cp),{color:col(1),a:.20,sp:2.8,ang:-.35+i*.7,wash:true});
      curve2(SCR(cp),{w:.7,a:.22,color:EDGE,passes:1,jit:.5},true);
    });
  });
  leg('PYROXENE (OPHITIC)',px.length);
  /* 斜長石の短冊 */
  const nl = Math.round((S.shape==='GLASSY'? 22 : 46)*DENN()*.8);
  const flow = S.shape==='FOLIATED'? rr(-.3,.3) : null;
  for(let i=0;i<nl;i++){
    const p=FPOS(.95);
    const ang = flow!=null? flow+rr(-.30,.30) : R()*TAU;
    const L=u*rr(.75,1.7), W=L*rr(.14,.24);
    let poly=[[-L,-W],[L*.92,-W*.86],[L,0],[L*.92,W*.86],[-L,W],[-L*1.02,0]];
    poly=movePoly(rotPoly(poly,ang),p[0],p[1]);
    putFace(poly,{color:col(0),a:.11,sp:3.2,ang:ang,lw:1.1,ea:.8}, p[1]);
    if(DETN()>.8) op(p[1]+.4, function(){
      traceW(poly, Math.round(rr(3,6)*DETN()), ang, {w:.55,a:.30,alt:true});
    });
  }
  leg('PLAGIOCLASE LATHS',nl);
  leg('TWIN LAMELLAE',Math.round(nl*4*DETN()));
  /* かんらん石 */
  const no=Math.round(7*DENN());
  for(let i=0;i<no;i++){
    const p=FPOS(.85), r=u*rr(.42,.75);
    const poly=chaikin(nGon(p[0],p[1],r,ri(5,7),R()*TAU,.14),1);
    putFace(poly,{color:col(3),a:.20,sp:3.0,ang:-.7,lw:1.2,round:true}, p[1]+1);
    op(p[1]+1.5, function(){
      const nf=ri(2,4);
      for(let k=0;k<nf;k++){
        const a=R()*TAU;
        const seg=clipSeg(poly,[p[0]+Math.cos(a)*r*1.5,p[1]+Math.sin(a)*r*1.5],
                               [p[0]-Math.cos(a)*r*1.5,p[1]-Math.sin(a)*r*1.5]);
        if(seg) lnw(seg[0],seg[1],{w:.85,a:.45,color:DEEP,passes:1,jit:.6});
      }
      if(S.state==='ALTERED') hatch2(SCR(shrinkPoly(poly,.9)),{color:col(1),a:.24,sp:2.2,ang:.5,wash:true,raw:true});
    });
  }
  leg('OLIVINE',no);
  /* 気孔 / 杏仁 */
  const nv = S.detail==='MINIMAL'? 1 : ri(2,4);
  for(let i=0;i<nv;i++){
    const p=FPOS(.80), r=u*rr(.55,1.0);
    const vp=wobRing(p[0],p[1],r,{n:24,lobes:5,amp:.07});
    op(p[1]+8, function(){
      fillPoly(SCR(vp),PAPERC,.90);
      curve2(SCR(vp),{w:1.2,a:.5,color:EDGE,passes:2,jit:.4},true);
      const m=ri(2,3);
      for(let k=1;k<=m;k++)
        curve2(SCR(shrinkPoly(vp,1-k/(m+1.2))),{w:.7,a:.30,color:col(2),passes:1,jit:.3},true);
    });
  }
  leg('VESICLES/AMYGDULES',nv);
  note(0,0,'PLAGIOCLASE LATH',1);
  note(FRAD*.4,-FRAD*.4,'PYROXENE',1);
},

/* ---------- 薄片 04 片岩 ---------- */
schist(){
  SCENE.grainUm = 600;
  const X=FRAD*.97, Y=FRAD*ASPY*.92;
  const u=GRAINR();
  const nb=clamp(Math.round((2*Y)/(u*1.5)), 4, 22);
  const lay=[];
  let qz=0, mica=0;
  for(let b=0;b<nb;b++){
    const y=-Y + (b+.5)*(2*Y/nb);
    const path=walkPath(-X, y, rr(-.08,.08), 2*X/7, 7, .09);
    const h=(2*Y/nb)*.50;
    const fol=Math.atan2(path[4][1]-path[3][1], path[4][0]-path[3][0]);
    const micaBand = (b%2===1);
    if(micaBand){
      /* 雲母の縞 — 葉理をなぞる濃い平行線の束として引く */
      op(y, function(){
        const m=Math.round(rr(5,9)*DETN());
        for(let k=0;k<m;k++){
          const off=lerp(-h*.78,h*.78,m>1? k/(m-1):.5)+rr(-h*.06,h*.06);
          const p2=path.map(function(p,i){ const nn=normalAt(path,i); return [p[0]+nn[0]*off, p[1]+nn[1]*off]; });
          curve2(SCR(p2),{w:rr(.6,1.25),a:rr(.24,.46),color:DEEP,passes:1,jit:.55},false);
        }
      });
      /* きらめく雲母片 */
      const nf=Math.round(rr(4,8)*DENN());
      for(let k=0;k<nf;k++){
        const t=(k+rr(.15,.85))/nf;
        const idx=clamp(Math.floor(t*(path.length-1)),0,path.length-2);
        const ft=(t*(path.length-1))%1;
        const fx=lerp(path[idx][0],path[idx+1][0],ft);
        const fy=lerp(path[idx][1],path[idx+1][1],ft)+rr(-h*.5,h*.5);
        const fl=u*rr(1.0,2.0), fw=fl*rr(.16,.26);
        const fp=movePoly(rotPoly([[-fl,-fw],[fl*.9,-fw*.8],[fl,0],[fl*.9,fw*.8],[-fl,fw],[-fl*1.05,0]],
                                  fol+rr(-.10,.10)),fx,fy);
        putFace(fp,{color:DEEP,a:.26,sp:2.2,ang:fol,lw:1.15,ea:.85}, fy+.3);
        op(fy+.6, function(){ traceW(fp, Math.round(rr(3,6)*DETN()), fol, {w:.55,a:.42}); });
        mica++;
      }
    }else{
      /* 石英・長石のレンズ(引き伸ばされて両端が尖る) */
      const cells=bandCells(path,-h*.94,h*.94, u*rr(3.2,5.6), {bulge:.55,smooth:2,gap:.18});
      cells.forEach(function(cp,i){
        const c=polyCentroid(cp);
        putFace(cp,{color:col(i%2? 2:0),a:.11,sp:4.0,ang:fol-.5,lw:1.05,round:true,ea:.70}, c[1]);
        op(c[1]+.4, function(){ if(DETN()>1) traceW(cp,2,fol+rr(-.6,.6),{w:.5,a:.14}); });
        qz++;
      });
    }
    if(b%3===0) lay.push({y:y, label: micaBand?'MICA FOLIA':'QTZ LAYER'});
  }
  leg('QUARTZ LENSES',qz); leg('MICA FLAKES',mica); leg('FOLIATION PLANES',nb);
  /* ざくろ石の斑状変晶 */
  const ng = S.density==='MANY'? ri(3,5) : S.density==='MODERATE'? ri(2,3) : 1;
  for(let i=0;i<ng;i++){
    const p=FPOS(.62), r=u*rr(1.6,2.6);
    const poly=nGon(p[0],p[1],r,ri(6,8),R()*TAU,.05);
    putFace(poly,{color:col(3),a:.30,sp:2.6,ang:-.6,lw:1.5,inner:.90}, 900+i);
    op(901+i, function(){
      /* 包有物の螺旋(スノーボール) */
      const m=Math.round(14*INCN()*DETN());
      for(let k=0;k<m;k++){
        const t=k/m, a=t*3.2-1.6;
        const rad=r*.72*Math.sin(Math.PI*t*.9+.15);
        blobW(p[0]+Math.cos(a)*rad*1.0, p[1]+Math.sin(a)*rad*.45, r*.055,{color:DEEP,a:.6,jag:.3});
      }
      if(S.state==='FRACT'){
        for(let k=0;k<3;k++){
          const a=R()*TAU;
          const seg=clipSeg(poly,[p[0]+Math.cos(a)*r*1.4,p[1]+Math.sin(a)*r*1.4],
                                 [p[0]-Math.cos(a)*r*1.4,p[1]-Math.sin(a)*r*1.4]);
          if(seg) lnw(seg[0],seg[1],{w:.9,a:.45,color:DEEP,passes:1,jit:.6});
        }
      }
    });
    leg('GARNET PORPHYROBLAST',1);
    if(i===0) note(p[0],p[1],'PORPHYROBLAST',1);
  }
  SCENE.layers = lay.slice(0,5);
  note(-X*.6, 0, 'FOLIATION', -1);
},
/* ---------- 集合体 01 晶洞 ---------- */
geode(){
  SCENE.grainUm = 40000;
  const RO=FRAD*.88;
  const lobes = S.shape==='BOTRYOID'? ri(9,14) : ri(5,8);
  const amp   = S.shape==='BOTRYOID'? .11 : .055;
  /* 外殻 */
  const shell=wobRing(0,0,RO,{n:80,lobes:lobes,amp:amp});
  putGrain(shell,{color:col(3),a:.24,sp:3.0,ang:-.9,lw:1.8,cross:true,solid:.5}, -900);
  leg('NODULE WALL',1);
  /* 玉髄の縞(外から内へ) */
  const nb = Math.max(3,Math.round(rr(4,7)*DETN()));
  let r=RO*.90;
  const lay=[{y:-RO,label:'WALL'}];
  for(let i=0;i<nb;i++){
    const rNext=r*rr(.82,.90);
    const band=wobRing(0,0,r,{n:72,lobes:lobes,amp:amp*.9});
    putGrain(band,{color:col(i%2? 0:2),a:.20*(1-i*.06),sp:2.6+i*.4,ang:-.6+i*.5,lw:1.15,solid:.85}, -800+i*10);
    if(i===1) lay.push({y:-r,label:'CHALCEDONY'});
    r=rNext;
  }
  leg('CHALCEDONY BANDS',nb);
  /* 空洞 */
  const cav=wobRing(0,0,r,{n:60,lobes:lobes,amp:amp*.8});
  op(-700, function(){
    fillPoly(SCR(cav),PAPERC,.95);
    curve2(SCR(cav),{w:1.3,a:.5,color:EDGE,passes:2,jit:.5},true);
  });
  lay.push({y:-r,label:'DRUSE'});
  /* 内壁を覆う結晶 */
  const cwB=GRAINR()*(S.shape==='TABULAR'? .58 : .40);
  const nc=Math.max(6,Math.round((TAU*r/(cwB*2.4))*(S.shape==='ACICULAR'?1.25:1)));
  for(let i=0;i<nc;i++){
    const a=i/nc*TAU+rr(-.05,.05);
    const rad=r*(1+ (Math.sin(a*lobes)*amp*.8));
    const cw=cwB*rr(.72,1.25);
    const ch=cw*(S.shape==='ACICULAR'? rr(4.0,6.5) : S.shape==='TABULAR'? rr(1.4,2.2) : rr(2.2,3.4));
    const bx=Math.cos(a)*rad, by=Math.sin(a)*rad;
    /* 内壁から中心に向かって伸びる(先端は視野の内側) */
    const F=placeFaces(prismFaces(cw,ch,S.shape==='TABULAR'?2:3,{tip:cw*1.15,uneven:true}),
                       bx-Math.cos(a)*ch, by-Math.sin(a)*ch, a+Math.PI/2);
    const d=-600+i*.1+(Math.sin(a)>0? 200:0);
    F.forEach(function(f,k){
      putFace(f.pts,{color:col(0),a:.15*(.7+k*.5),sp:3.0,ang:a+k*.6,lw:1.05,solid:.55}, d+k*.02);
    });
  }
  leg('DRUSY CRYSTALS',nc);
  /* 中央の空隙 */
  op(400, function(){
    const inner=wobRing(0,0,r*.42,{n:40,lobes:5,amp:.10});
    fillPoly(SCR(inner),PAPERC,.85);
    hatch2(SCR(inner),{color:col(2),a:.05,sp:6.0,ang:-.5,wash:true,raw:true});
  });
  SCENE.layers = lay;
  note(0,-RO*.95,'NODULE WALL',1);
  note(0,r*.55,'DRUSY LINING',-1);
},

/* ---------- 集合体 02 縞瑪瑙 ---------- */
agate(){
  SCENE.grainUm = 30000;
  const RO=FRAD*.86;
  const lobes = S.shape==='BOTRYOID'? ri(8,13) : ri(4,7);
  const amp   = S.shape==='BOTRYOID'? .10 : .05;
  const horiz = (S.shape==='TABULAR');
  /* 外形 */
  const out=wobRing(0,0,RO,{n:80,lobes:lobes,amp:amp});
  putGrain(out,{color:col(3),a:.18,sp:3.4,ang:-.9,lw:1.7,solid:.55}, -900);
  /* 同心の縞 */
  const nb=Math.round(rr(9,16)*DETN());
  let r=RO*.94;
  for(let i=0;i<nb && r>RO*.16;i++){
    const th=RO*rr(.030,.075)*(1+ (i%3===0? .8:0));
    const band=wobRing(0,0,r,{n:76,lobes:lobes,amp:amp*.92});
    putGrain(band,{color:col(i%3),a:(i%3===0? .26:.13),sp:(i%3===0?2.2:3.6),
                   ang:-.7+i*.4,lw:(i%3===0?1.2:.85),solid:.88, ea:.62}, -800+i*8);
    r-=th;
  }
  leg('AGATE BANDS',nb);
  /* 水平縞(ウルグアイ縞) */
  if(horiz){
    const core=wobRing(0,0,r*1.05,{n:56,lobes:lobes,amp:amp*.8});
    op(-100, function(){ fillPoly(SCR(core),PAPERC,.92); });
    const nh=Math.round(rr(6,11)*DETN());
    const b=bbox(core);
    for(let i=0;i<nh;i++){
      const y=lerp(b.y0,b.y1,(i+.5)/nh);
      let poly=core.slice();
      poly=clipHalf(poly,0,y,0,y+1);
      const poly2b=clipHalf(core,0,y+ (b.y1-b.y0)/nh, 0, y+(b.y1-b.y0)/nh-1);
      const strip=clipHalf(clipHalf(core,0,y-1,0,y),0,y+(b.y1-b.y0)/nh+1,0,y+(b.y1-b.y0)/nh);
      if(strip.length>2)
        putGrain(strip,{color:col(i%2),a:i%2?.20:.10,sp:3.0,ang:0,lw:.8,solid:0,ea:.4}, -50+i);
    }
    leg('HORIZONTAL BANDS',nh);
    note(0,0,'HORIZONTAL BANDING',1);
  }else{
    /* 中心の水晶 */
    const cav=wobRing(0,0,r,{n:48,lobes:5,amp:.09});
    op(-40, function(){
      fillPoly(SCR(cav),PAPERC,.95);
      curve2(SCR(cav),{w:1.2,a:.5,color:EDGE,passes:2,jit:.5},true);
    });
    const nc=Math.max(5,Math.round(TAU*r/(GRAINR()*.8)));
    for(let i=0;i<nc;i++){
      const a=i/nc*TAU;
      const cw=GRAINR()*rr(.16,.28), ch=GRAINR()*rr(.5,1.1);
      const F=placeFaces(prismFaces(cw,ch,2,{tip:cw*1.4}),
                         Math.cos(a)*(r-ch), Math.sin(a)*(r-ch), a+Math.PI/2);
      F.forEach(function(f,k){
        putFace(f.pts,{color:col(0),a:.14,sp:3.0,ang:a,lw:.95,solid:.5}, 100+i*.1+k*.02);
      });
    }
    leg('QUARTZ CENTRE',nc);
    note(0,0,'QUARTZ CORE',1);
  }
  /* 流入口 */
  if(chance(.7)){
    const a=R()*TAU;
    op(600, function(){
      const w2=RO*.10;
      const p0=[Math.cos(a)*RO*1.02, Math.sin(a)*RO*1.02];
      const p1=[Math.cos(a)*RO*.45, Math.sin(a)*RO*.45];
      const tube=chainCells([p0,p1], w2, RO*2)[0];
      if(tube){
        fillPoly(SCR(tube),PAPERC,.75);
        curve2(SCR(tube),{w:.9,a:.4,color:EDGE,passes:1,jit:.5},true);
      }
    });
    leg('INFILL CHANNEL',1);
  }
  note(0,-RO*.85,'CONCENTRIC BAND',1);
},

/* ---------- 集合体 03 鉱脈 ---------- */
vein(){
  SCENE.grainUm = 18000;
  const X=FRAD*.98, Y=FRAD*ASPY*.98;
  const region=[[-X,-Y],[X,-Y],[X,Y],[-X,Y]];
  const u=GRAINR();
  /* 母岩 */
  const host=mosaic(region, u*1.25, {gap:.90, smooth:1, relax:0, vary:.34, maxCells:420});
  host.forEach(function(cp,i){
    op(-900+i*.01, function(){
      hatch2(SCR(cp),{color:col(3),a:.11,sp:4.2,ang:-.8+((i%3)*.4),wash:true});
      curve2(SCR(cp),{w:.6,a:.24,color:EDGE,passes:1,jit:.5},true);
    });
  });
  leg('HOST ROCK GRAINS',host.length);
  /* 脈の走向 */
  const ang=rr(-1.05,-.45);
  const cx0=-Math.cos(ang)*Y*1.3, cy0=-Math.sin(ang)*Y*1.3;
  const path=walkPath(cx0,cy0,ang,Y*2.6/7,7,.10);
  const hw=u*rr(1.5,2.4);
  /* 脈の壁 */
  op(-500, function(){
    const wallA=path.map(function(p,i){ const t=i/(path.length-1);
      const n=normalAt(path,i); return [p[0]+n[0]*hw, p[1]+n[1]*hw]; });
    const wallB=path.map(function(p,i){ const n=normalAt(path,i); return [p[0]-n[0]*hw, p[1]-n[1]*hw]; });
    curve2(SCR(wallA),{w:1.5,a:.55,color:EDGE,passes:2,jit:.5},false);
    curve2(SCR(wallB),{w:1.5,a:.55,color:EDGE,passes:2,jit:.5},false);
  });
  /* 櫛状構造(両壁から中央へ伸びる結晶) */
  let comb=0;
  for(const sg of [1,-1]){
    const cells=bandCells(path, sg*hw, sg*hw*.06, u*rr(.34,.5), {smooth:1,gap:.10,m:3});
    cells.forEach(function(cp,i){
      const c=polyCentroid(cp);
      putFace(cp,{color:col(i%2? 0:2),a:.15,sp:3.0,ang:ang+Math.PI/2,lw:1.0,ea:.72}, -300+i*.1);
      comb++;
    });
  }
  leg('COMB CRYSTALS',comb);
  /* 中央の縫合線 */
  op(-100, function(){
    const dashed=path;
    for(let i=0;i<dashed.length-1;i++){
      if(chance(.25)) continue;
      lnw(dashed[i],dashed[i+1],{w:.8,a:.32,color:DEEP,passes:1,jit:.7});
    }
  });
  leg('MEDIAN SUTURE',1);
  /* 鉱染(硫化物) */
  const nS=Math.round(rr(6,14)*DENN()*DETN());
  for(let i=0;i<nS;i++){
    const t=R(), idx=clamp(Math.floor(t*(path.length-1)),0,path.length-2);
    const ft=(t*(path.length-1))%1;
    const n=normalAt(path,idx);
    const off=rr(-hw*.85,hw*.85);
    const bx=lerp(path[idx][0],path[idx+1][0],ft)+n[0]*off;
    const by=lerp(path[idx][1],path[idx+1][1],ft)+n[1]*off;
    const r=u*rr(.14,.34);
    op(0+i, function(){
      const g=nGon(bx,by,r,ri(4,6),R()*TAU,.16);
      fillPoly(SCR(g),DEEP,.72);
      poly2(SCR(g),{w:.9,a:.6,color:DEEP,passes:1,jit:.4,over:1.2},true);
      if(DETN()>1) hatch2(SCR(shrinkPoly(g,.8)),{color:col(1),a:.3,sp:1.8,ang:.6,wash:false,raw:true});
    });
  }
  leg('SULPHIDE BLEBS',nS);
  /* 分岐脈 */
  if(S.shape!=='MASSIVE'){
    const nB=ri(1,2);
    for(let i=0;i<nB;i++){
      const idx=ri(2,path.length-3);
      const bp=walkPath(path[idx][0],path[idx][1], ang+rr(.5,1.2)*(chance(.5)?1:-1), Y*.28, 4, .18);
      const bc=bandCells(bp,-hw*.35,hw*.35, u*.5,{smooth:1,m:3});
      bc.forEach(function(cp,k){ putFace(cp,{color:col(2),a:.13,sp:3.2,ang:ang,lw:.9,ea:.65}, -200+k*.1); });
      leg('BRANCH VEINLET',1);
    }
  }
  note(0,0,'COMB TEXTURE',1);
  note(-X*.55,Y*.4,'HOST ROCK',-1);
},

/* ---------- 集合体 04 樹枝状 ---------- */
dendrite(){
  SCENE.grainUm = 12000;
  const X=FRAD*.98, Y=FRAD*ASPY*.96;
  const u=GRAINR();
  /* 石灰岩の面 */
  op(-2000, function(){
    const slab=[[-X,-Y],[X,-Y],[X,Y],[-X,Y]];
    hatch2(SCR(slab),{color:col(2),a:.07,sp:6.5,ang:-.5,wash:true});
    poly2(SCR(slab),{w:1.4,a:.4,color:EDGE,passes:1,jit:1.0,over:4},true);
    for(let i=0;i<Math.round(9*DETN());i++){
      const y=rr(-Y,Y);
      const p=walkPath(-X,y,rr(-.05,.05),2*X/6,6,.05);
      curve2(SCR(p),{w:.6,a:.10,color:EDGE,passes:1,jit:.6},false);
    }
  });
  leg('LIMESTONE SLAB',1);
  /* 割れ目 */
  const seedAng = S.shape==='TABULAR'? 0 : rr(-.35,.35);
  const crack=walkPath(-X*.95, rr(-Y*.3,Y*.3), seedAng, 2*X*.95/8, 8, .10);
  op(-1500, function(){
    curve2(SCR(crack),{w:1.0,a:.30,color:EDGE,passes:1,jit:.8},false);
  });
  leg('BEDDING JOINT',1);
  /* 樹枝(60度分岐) */
  const spread = S.shape==='ACICULAR'? .38 : S.shape==='MASSIVE'? .75 : Math.PI/3;
  let segs=0, tips=0;
  function grow(x,y,ang,len,w,depth){
    const steps=4;
    const path=walkPath(x,y,ang,len/steps,steps,.10);
    op(y+depth*.01, function(){
      curve2(SCR(path),{w:Math.max(.55,PS(w)),a:.78,color:DEEP,passes:1,jit:.45},false);
      if(w>u*.06) curve2(SCR(path),{w:Math.max(.4,PS(w)*.45),a:.30,color:DEEP,passes:1,jit:.8},false);
    });
    segs++;
    if(depth<=0){ tips++; op(y+1,function(){ blobW(path[steps][0],path[steps][1],w*.7,{color:DEEP,a:.7,jag:.4}); }); return; }
    for(let i=1;i<=steps;i++){
      if(i<steps && !chance(.72)) continue;
      const sg = (i%2? 1:-1)*(chance(.5)?1:-1);
      const nl = len*rr(.48,.66), nw = w*rr(.52,.68);
      if(i===steps){ grow(path[i][0],path[i][1], ang+rr(-.12,.12), nl*1.1, nw*1.1, depth-1); }
      else grow(path[i][0],path[i][1], ang + sg*spread + rr(-.14,.14), nl, nw, depth-1);
    }
  }
  const nRoot = S.density==='MANY'? 4 : S.density==='MODERATE'? 3 : 2;
  const dep = S.detail==='MINIMAL'? 2 : S.detail==='MODERATE'? 3 : 4;
  for(let i=0;i<nRoot;i++){
    const t=(i+.5)/nRoot;
    const idx=clamp(Math.floor(t*(crack.length-1)),0,crack.length-2);
    const ft=(t*(crack.length-1))%1;
    const bx=lerp(crack[idx][0],crack[idx+1][0],ft);
    const by=lerp(crack[idx][1],crack[idx+1][1],ft);
    grow(bx,by, (chance(.5)? -Math.PI/2 : Math.PI/2)+rr(-.3,.3), u*rr(3.0,4.4), u*.30, dep);
  }
  leg('DENDRITE BRANCHES',segs); leg('GROWTH TIPS',tips);
  /* 微細な酸化物の点 */
  const nd=Math.round(40*DENN()*DETN());
  for(let i=0;i<nd;i++){
    const p=FPOS(.9);
    op(-1000+i*.01, function(){ blobW(p[0],p[1],u*rr(.02,.05),{color:DEEP,a:.35,jag:.4}); });
  }
  leg('MN OXIDE SPECKS',nd);
  note(0,0,'DENDRITIC HABIT',1);
},
/* ---------- 岩石 01 礫岩 ---------- */
conglomerate(){
  SCENE.grainUm = 24000;
  const u=GRAINR();
  const sortk=S.shape;
  const rBase=u*1.85;
  const spread = sortk==='POORLY'? [.35,1.7] : sortk==='SORTED'? [.85,1.15] : [.55,1.4];
  const n = S.density==='MANY'? 46 : S.density==='MODERATE'? 32 : 18;
  /* 基質 */
  op(-2000, function(){
    const reg=[[-FRAD*1.02,-FRAD*ASPY*1.02],[FRAD*1.02,-FRAD*ASPY*1.02],
               [FRAD*1.02,FRAD*ASPY*1.02],[-FRAD*1.02,FRAD*ASPY*1.02]];
    hatch2(SCR(reg),{color:col(3),a:.10,sp:5.0,ang:-.7,wash:true,cross:true});
  });
  const clasts=[];
  for(let i=0;i<n*7 && clasts.length<n;i++){
    const p=FPOS(.97);
    let rad=rBase*rr(spread[0],spread[1]);
    if(sortk==='GRADED') rad = rBase*lerp(spread[1],spread[0], clamp((p[1]+FRAD*ASPY)/(2*FRAD*ASPY),0,1));
    if(sortk==='LAMINAR'){
      const bandI=Math.round((p[1]+FRAD*ASPY)/(FRAD*ASPY*.5));
      rad = rBase*(bandI%2? spread[0]*1.15 : spread[1]*.85);
    }
    let ok=true;
    /* 礫岩は礫どうしが支えあう。すこし触れるくらいまで詰める */
    for(const q of clasts) if(Math.hypot(p[0]-q[0],p[1]-q[1]) < (rad+q[2])*.99){ ok=false; break; }
    if(ok) clasts.push([p[0],p[1],rad]);
  }
  const imb=rr(-.5,-.2);
  clasts.forEach(function(c,i){
    const el = sortk==='LAMINAR'? rr(1.5,2.2) : rr(1.05,1.7);
    const ang = (sortk==='LAMINAR'||S.site==='RIVER')? imb+rr(-.22,.22) : R()*TAU;
    /* 円磨された礫なので輪郭はゆるやかに */
    let poly=wobRing(0,0,c[2],{n:30,lobes:ri(3,5),amp:rr(.03,.075),ry:1/el});
    poly=movePoly(rotPoly(poly,ang),c[0],c[1]);
    const kind=i%4;
    putGrain(poly,{color:col(kind),a:kind===1?.24:.14,sp:kind===1?2.6:3.8,
                   ang:ang-.6,lw:1.25,inner:kind===3?.88:0}, c[1]);
    op(c[1]+.4, function(){
      if(kind===0 && DETN()>.8) traceW(poly, Math.round(rr(3,7)*DETN()), ang, {w:.6,a:.26});
      if(kind===2) speckW(c[0],c[1],c[2]*.7,Math.round(6*DETN()),{color:DEEP,a:.34});
      if(kind===3 && chance(.45)){
        const a2=R()*TAU;
        const seg=clipSeg(poly,[c[0]+Math.cos(a2)*c[2]*1.5,c[1]+Math.sin(a2)*c[2]*1.5],
                               [c[0]-Math.cos(a2)*c[2]*1.5,c[1]-Math.sin(a2)*c[2]*1.5]);
        if(seg) lnw(seg[0],seg[1],{w:.9,a:.4,color:DEEP,passes:1,jit:.5});
      }
      /* 礫は累帯しない。変質・破断のときだけ内部を描き込む */
      if((S.state==='ALTERED'||S.state==='FRACT') && chance(.55)) interior(poly,{round:true,wash:col(kind)});
    });
  });
  leg('CLASTS',clasts.length);
  leg('MATRIX',1);
  /* 基質の砂粒 */
  const ns=Math.round(70*DENN()*DETN());
  for(let i=0;i<ns;i++){
    const p=FPOS(.99);
    let inside=false;
    for(const c of clasts) if(Math.hypot(p[0]-c[0],p[1]-c[1])<c[2]*.95){ inside=true; break; }
    if(inside) continue;
    op(-1500+i*.01, function(){ blobW(p[0],p[1],u*rr(.03,.08),{color:DEEP,a:.36,jag:.35}); });
  }
  leg('MATRIX SAND',ns);
  note(clasts.length?clasts[0][0]:0, clasts.length?clasts[0][1]:0, 'ROUNDED CLAST', 1);
  note(-FRAD*.6, FRAD*.6, 'MATRIX', -1);
},

/* ---------- 岩石 02 鮞状岩 ---------- */
oolite(){
  SCENE.grainUm = 700;
  const u=GRAINR();
  const X=FRAD*.97, Y=FRAD*ASPY*.97;
  const region=[[-X,-Y],[X,-Y],[X,Y],[-X,Y]];
  /* 膠結物 */
  const cem=mosaic(region, u*1.7, {gap:.94, smooth:0, relax:1, vary:.30, maxCells:340});
  cem.forEach(function(cp,i){
    op(-1200+i*.01, function(){
      hatch2(SCR(cp),{color:col(2),a:.09,sp:4.4,ang:-.6+((i%4)*.4),wash:true});
      poly2(SCR(cp),{w:.55,a:.22,color:EDGE,passes:1,jit:.4},true);
    });
  });
  leg('SPARRY CEMENT',cem.length);
  /* ooid */
  const rB=u*1.15;
  const spread = S.shape==='POORLY'? [.55,1.5] : S.shape==='SORTED'? [.9,1.1] : [.72,1.28];
  const n = S.density==='MANY'? 90 : S.density==='MODERATE'? 60 : 34;
  const oo=[];
  for(let i=0;i<n*10 && oo.length<n;i++){
    const p=FPOS(.99);
    let rad=rB*rr(spread[0],spread[1]);
    if(S.shape==='GRADED') rad=rB*lerp(spread[1],spread[0], clamp((p[1]+Y)/(2*Y),0,1));
    let ok=true;
    /* 鮞状岩は粒が支えあう組織 */
    for(const q of oo) if(Math.hypot(p[0]-q[0],p[1]-q[1])<(rad+q[2])*1.0){ ok=false; break; }
    if(ok) oo.push([p[0],p[1],rad]);
  }
  let brk=0;
  oo.forEach(function(o2,i){
    const broken = chance(.10) && S.state!=='FRESH';
    let poly=wobRing(o2[0],o2[1],o2[2],{n:26,lobes:ri(4,7),amp:.05});
    if(broken){ poly=clipHalf(poly, o2[0],o2[1], o2[0]+Math.cos(R()*TAU)*o2[2], o2[1]+Math.sin(R()*TAU)*o2[2]); brk++; }
    if(poly.length<3) return;
    putGrain(poly,{color:col(i%2),a:.13,sp:3.4,ang:-.7,lw:1.15}, o2[1]);
    op(o2[1]+.4, function(){
      const m=Math.max(2,Math.round(rr(2,4)*DETN()));
      for(let k=1;k<=m;k++){
        const kk=1-k/(m+1.4);
        curve2(SCR(shrinkPoly(poly,kk,[o2[0],o2[1]])),{w:.6,a:.30,color:EDGE,passes:1,jit:.3},true);
      }
      blobW(o2[0],o2[1],o2[2]*.16,{color:DEEP,a:.6});
      leg('CORTICAL LAYERS',m);
    });
  });
  leg('OOIDS',oo.length);
  if(brk) leg('BROKEN OOIDS',brk);
  /* 生砕屑 */
  const nf=Math.round(6*DENN());
  for(let i=0;i<nf;i++){
    const p=FPOS(.9), r=u*rr(.5,.95), a=R()*TAU;
    op(p[1]+2, function(){
      const sh=[];
      for(let k=0;k<=16;k++){ const t=k/16*Math.PI; sh.push([Math.cos(t)*r, -Math.sin(t)*r*.30]); }
      for(let k=16;k>=0;k--){ const t=k/16*Math.PI; sh.push([Math.cos(t)*r, -Math.sin(t)*r*.30-r*.10]); }
      const poly=movePoly(rotPoly(chaikin(sh,1),a),p[0],p[1]);
      grainDraw(poly,{color:col(3),a:.22,sp:2.4,ang:a,lw:1.1,solid:.6});
    });
  }
  leg('BIOCLASTS',nf);
  note(oo.length?oo[0][0]:0, oo.length?oo[0][1]:0, 'CONCENTRIC CORTEX', 1);
  note(-X*.5,-Y*.5,'SPARRY CEMENT',-1);
},

/* ---------- 岩石 03 角礫岩 ---------- */
breccia(){
  SCENE.grainUm = 20000;
  const u=GRAINR();
  const X=FRAD*.98, Y=FRAD*ASPY*.98;
  const region=[[-X,-Y],[X,-Y],[X,Y],[-X,Y]];
  /* 基質 */
  op(-2000, function(){
    hatch2(SCR(region),{color:col(3),a:.16,sp:3.4,ang:-.8,wash:true,cross:true});
  });
  leg('MATRIX',1);
  const gapk = S.shape==='POORLY'? .74 : S.shape==='SORTED'? .86 : .80;
  const cells=mosaic(region, u*1.7, {gap:gapk, smooth:0, maxCells:340,
                                     relax: S.shape==='SORTED'? 3 : 1,
                                     vary:  S.shape==='SORTED'? .08 : .34});
  /* 二次的な細粒破片 */
  const small = S.shape==='POORLY'? mosaic(region, u*.58, {gap:.72, smooth:0, relax:1}) : [];
  small.forEach(function(cp,i){
    if(!chance(.35)) return;
    const c=polyCentroid(cp);
    const rp=rotPoly(cp,rr(-.14,.14),c);
    putFace(rp,{color:col(2),a:.12,sp:3.6,ang:-.6,lw:.85,ea:.6}, -900+i*.01);
  });
  if(small.length) leg('FINE FRAGMENTS',Math.round(small.length*.35));
  cells.forEach(function(cp,i){
    const c=polyCentroid(cp), rad=polyRad(cp,c);
    const rp=rotPoly(cp, rr(-.20,.20), c);
    const kind=i%3;
    putFace(rp,{color:col(kind),a:kind===1?.24:.13,sp:kind===1?2.6:3.8,ang:-.7+kind*.5,
                lw:1.3,inner:kind===2?.88:0}, c[1]);
    op(c[1]+.4, function(){
      if(kind===0 && DETN()>.8) traceW(rp, Math.round(4*DETN()), rr(0,3.1), {w:.6,a:.26});
      if(kind===2) speckW(c[0],c[1],rad*.6,Math.round(5*DETN()),{color:DEEP,a:.32});
      if(rad>u*.95) interior(rp,{wash:col(kind)});   /* 大きい破片だけ内部を描き込む */
    });
  });
  leg('ANGULAR CLASTS',cells.length);
  /* 破片を切る細脈 */
  const nv=S.detail==='MINIMAL'? 1 : ri(2,3);
  for(let i=0;i<nv;i++){
    const a=rr(-1.2,1.2);
    const p0=[-Math.cos(a)*X*1.3, -Math.sin(a)*Y*1.3];
    const pth=walkPath(p0[0],p0[1],a,X*2.4/6,6,.14);
    const w2=u*rr(.06,.13);
    op(1200+i, function(){
      const band=bandCells(pth,-w2,w2, X*4, {smooth:1,m:7})[0];
      if(band){
        fillPoly(SCR(band),PAPERC,.8);
        hatch2(SCR(band),{color:col(0),a:.30,sp:2.0,ang:a,wash:true,raw:true});
        curve2(SCR(band),{w:.85,a:.5,color:EDGE,passes:1,jit:.4},true);
      }
    });
  }
  leg('CROSS-CUTTING VEINLETS',nv);
  note(0,0,'ANGULAR CLAST',1);
  note(-X*.55,Y*.5,'MATRIX',-1);
},

/* ---------- 岩石 04 葉理 ---------- */
bedding(){
  SCENE.grainUm = 6000;
  const u=GRAINR();
  const X=FRAD*.98, Y=FRAD*ASPY*.96;
  const nb=Math.max(4, Math.round(rr(5,8)*DETN()));
  const lay=[];
  let y=-Y;
  const beds=[];
  for(let i=0;i<nb;i++){
    const h=(2*Y/nb)*rr(.6,1.5);
    beds.push({y0:y, y1:Math.min(Y,y+h), k:i});
    y+=h;
    if(y>=Y) break;
  }
  beds[beds.length-1].y1=Y;
  const styles=['COARSE','CROSS','FINE','MUD','GRADED'];
  beds.forEach(function(b,i){
    const st = S.shape==='LAMINAR'? (i%2? 'FINE':'MUD')
             : S.shape==='GRADED'? (i%2? 'GRADED':'FINE')
             : styles[i%styles.length];
    const top=walkPath(-X, b.y0, rr(-.05,.05), 2*X/6, 6, .05);
    const bot=walkPath(-X, b.y1, rr(-.05,.05), 2*X/6, 6, .05);
    const poly=top.concat(bot.slice().reverse());
    const h=b.y1-b.y0;
    /* 層の地色(輪郭は上下の層理面だけを引く) */
    putFace(poly,{color:col(i%4), a: st==='MUD'? .26 : st==='FINE'? .13 : .09,
                  sp: st==='MUD'? 2.4 : 4.2, ang:-.55, edge:false, solid:.35},
            -1000+i*10);
    op(-990+i*10, function(){
      if(st==='COARSE'){
        const m=Math.round(26*DENN()*DETN());
        for(let k=0;k<m;k++){
          const px=rr(-X,X), py=rr(b.y0+h*.12,b.y1-h*.12);
          const rp=u*rr(.10,.22);
          const g=wobRing(px,py,rp,{n:14,lobes:5,amp:.14});
          grainDraw(g,{color:col((i+1)%4),a:.16,sp:2.6,ang:-.6,lw:.9,solid:.4});
        }
        leg('COARSE GRAINS',m);
      }else if(st==='CROSS'){
        /* 斜交層理(フォアセット) */
        const dir=chance(.5)?1:-1;
        const m=Math.round(rr(7,13)*DETN());
        for(let k=0;k<m;k++){
          const x0=lerp(-X-h*1.5,X,k/m);
          const pts=[];
          for(let t=0;t<=12;t++){
            const tt=t/12;
            pts.push([x0+dir*h*1.5*tt, b.y0 + h*Math.pow(tt,.55)]);
          }
          /* フォアセットは層のなかだけに収める */
          clipCurve(poly,pts).forEach(function(run){
            curve2(SCR(run),{w:.7,a:.34,color:EDGE,passes:1,jit:.4},false);
          });
        }
        leg('CROSS-BEDS',m);
      }else if(st==='GRADED'){
        const m=Math.round(30*DENN()*DETN());
        for(let k=0;k<m;k++){
          const t=R();
          const py=lerp(b.y1,b.y0,t);
          const rp=u*lerp(.20,.05,t);
          blobW(rr(-X,X),py,rp,{color:DEEP,a:.42,jag:.3});
        }
        leg('GRADED GRAINS',m);
      }else if(st==='FINE'){
        const m=Math.round(rr(4,8)*DETN());
        for(let k=1;k<m;k++){
          const yy=lerp(b.y0,b.y1,k/m);
          const p2=walkPath(-X,yy,rr(-.03,.03),2*X/5,5,.04);
          curve2(SCR(p2),{w:.55,a:.24,color:EDGE,passes:1,jit:.5},false);
        }
        leg('LAMINAE',m);
      }else{
        if(DETN()>.9){
          const m=ri(2,4);
          for(let k=0;k<m;k++){
            const px=rr(-X*.8,X*.8), py=rr(b.y0+h*.2,b.y1-h*.2);
            hatch2(SCR(wobRing(px,py,h*.18,{n:14,lobes:4,amp:.2})),
                   {color:DEEP,a:.20,sp:2.0,ang:.4,wash:true,raw:true});
          }
        }
      }
    });
    /* 層理面 */
    op(-980+i*10, function(){
      curve2(SCR(top),{w:1.3,a:.45,color:EDGE,passes:1,jit:.6},false);
      if(i===beds.length-1) curve2(SCR(bot),{w:1.3,a:.45,color:EDGE,passes:1,jit:.6},false);
    });
    lay.push({y:(b.y0+b.y1)/2, label:st});
  });
  leg('BEDS',beds.length);
  /* スタイロライト */
  if(S.detail!=='MINIMAL' && beds.length>2){
    const b=beds[ri(1,beds.length-2)];
    op(2000, function(){
      const pts=[];
      let yy=b.y0;
      for(let x=-X; x<X; x+=u*rr(.10,.22)){
        yy = b.y0 + (chance(.5)? u*rr(.05,.20) : -u*rr(.05,.20));
        pts.push([x,b.y0]); pts.push([x,yy]);
      }
      poly2(SCR(pts),{w:.9,a:.5,color:DEEP,passes:1,jit:.3},false);
    });
    leg('STYLOLITE',1);
  }
  /* 生痕・ノジュール */
  const nn=Math.round(3*DENN());
  for(let i=0;i<nn;i++){
    const p=[rr(-X*.8,X*.8), rr(-Y*.8,Y*.8)];
    const r=u*rr(.4,.8);
    op(2500+i, function(){
      const g=wobRing(p[0],p[1],r,{n:22,lobes:5,amp:.10});
      grainDraw(g,{color:col(1),a:.24,sp:2.4,ang:-.5,lw:1.2,solid:.55,inner:.85});
    });
  }
  leg('NODULES',nn);
  SCENE.layers = lay.slice(0,6);
  note(0, beds[0].y1, 'BEDDING PLANE', 1);
  note(-X*.5, beds[beds.length-1].y0, 'LAMINATION', -1);
},

};

/* 経路の法線 */
function normalAt(path,i){
  const a=path[clamp(i,0,path.length-2)], b=path[clamp(i+1,1,path.length-1)];
  const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1;
  return [-dy/L, dx/L];
}
/* =========================================================================
   手書き文字(1文字ずつ揺らして観察ノートの手書き風に)
   ========================================================================= */
function twidth(str,size,tr){
  ctx.font = size+'px "Courier New",ui-monospace,monospace';
  let w=0; for(const ch of str) w += ctx.measureText(ch).width + tr;
  return w-tr;
}
function tech(str,x,y,size,o){
  o=o||{};
  const tr = o.tr!=null?o.tr:size*.20;
  ctx.save();
  ctx.font = (o.bold?'bold ':'')+(o.italic?'italic ':'')+size+'px "Courier New",ui-monospace,monospace';
  ctx.fillStyle = o.color||'rgba(66,63,66,.86)';
  ctx.textBaseline='alphabetic';
  let cx = x;
  if(o.align==='center') cx = x - twidth(str,size,tr)/2;
  else if(o.align==='right') cx = x - twidth(str,size,tr);
  const j = (o.jit!=null?o.jit:.34)*ROUGH;
  for(const ch of str){
    const w = ctx.measureText(ch).width;
    if(ch!==' '){
      ctx.save();
      ctx.translate(cx+w/2+(R()*2-1)*j, y+(R()*2-1)*j*1.1);
      ctx.rotate((R()*2-1)*.017);
      ctx.globalAlpha = o.a!=null?o.a:(.78+R()*.22);
      ctx.fillText(ch,-w/2,0);
      if(o.bold){ ctx.globalAlpha*=.5; ctx.fillText(ch,-w/2+.35,.3); }
      ctx.restore();
    }
    cx += w + tr;
  }
  ctx.restore();
  return cx-x-tr;
}
function boxr(x0,y0,x1,y1,o){
  o=o||{w:.7,a:.42,passes:1};
  poly2([[x0,y0],[x1,y0],[x1,y1],[x0,y1]],o,true);
}

/* =========================================================================
   観察条件(倍率・スケール)
   ========================================================================= */
function optics(){
  const um = SCENE.grainUm/(2*GRAINR());     /* 1ワールド単位が何µmか */
  const fieldUm = 2*FIELD.rx*um;
  const objs=[0.5,1,2,4,10,20,40,100];
  let best=objs[0], bd=1e9;
  for(const o of objs){ const d=Math.abs(Math.log(20000/o) - Math.log(fieldUm)); if(d<bd){ bd=d; best=o; } }
  return { um:um, fieldUm:fieldUm, obj:best, mag:Math.round(best*10), grainUm:SCENE.grainUm };
}
function scaleChoice(um){
  const cands=[1,2,5,10,20,50,100,200,500,1000,2000,5000,10000,20000,50000];
  let best=cands[0], bd=1e9;
  for(const c of cands){
    const px=c/um*V.s;
    const d=Math.abs(px-130) + (px<50||px>200? 400:0);
    if(d<bd){ bd=d; best=c; }
  }
  return best;
}
/* µm を読みやすい単位に */
function fmtLen(v){
  if(v>=10000) return (Math.round(v/100)/10)+' mm';
  if(v>=1000)  return (Math.round(v/10)/100)+' mm';
  return (Math.round(v*10)/10)+' um';
}
function fmtBar(v){
  if(v>=1000) return (v/1000)+' mm';
  return v+' um';
}

  /* --- 端の細かい記号 --- */
  q.push(function(){
    for(let k=0;k<3;k++){
      const x = k===1? SW-52 : 42+ (k===2? SW-96:0);
      const y = 380+k*300+R()*120;
      for(let i=0;i<12;i++){
        const px=x+(i%4)*3.2, py=y+Math.floor(i/4)*3.2;
        if(R()<.45) continue;
        ctx.globalAlpha=.35; ctx.fillStyle='rgba(90,86,84,.8)';
        ctx.fillRect(px,py,2.4,2.4); ctx.globalAlpha=1;
      }
    }
    const nstray = S.detail==='DETAILED'? 4 : 2;
    for(let i=0;i<nstray;i++){
      const a=[rr(FR.x0,FR.x1),rr(FR.y0,FR.y1)];
      const l=rr(120,420), ang=rr(-1.2,-.2);
      ln2(a,[a[0]+Math.cos(ang)*l,a[1]+Math.sin(ang)*l],{w:.5,a:.06,passes:1,jit:1.2});
    }
  });
  return q;
}
function glyph(x,y,i){
  const st={w:.55,a:.4,passes:1,jit:.35};
  const k=i%6, s=5;
  if(k===0){ const p=[]; for(let t=0;t<=10;t++){ const a=t/10*TAU; p.push([x+s/2+Math.cos(a)*s/2,y+s/2+Math.sin(a)*s/2]); } poly2(p,st,true); }
  else if(k===1) boxr(x,y,x+s,y+s,st);
  else if(k===2){ const p=[]; for(let t=0;t<=10;t++){ const a=t/10*TAU; p.push([x+s/2+Math.cos(a)*s/2,y+s/2+Math.sin(a)*s/3]); } poly2(p,st,true); }
  else if(k===3){ ln2([x,y],[x+s,y+s],st); ln2([x,y+s],[x+s,y],st); }
  else if(k===4){ ln2([x,y+s/2],[x+s,y+s/2],st); ln2([x+s/2,y],[x+s/2,y+s],st); }
  else { boxr(x,y,x+s,y+s,st); ln2([x,y+s],[x+s,y],st); }
}
/* =========================================================================
   仕上げ(紙の粒子・視野のけられ)
   ========================================================================= */
let grainTex=null;
function finishSheet(){
  /* 円形視野のときは外側を紙で隠す */
  if(S.fieldsh==='CIRCLE'){
    const c=P(FIELD.cx,FIELD.cy), r=FIELD.rx*V.s;
    ctx.save();
    ctx.beginPath();
    ctx.rect(FR.x0-1,FR.y0-1,FR.x1-FR.x0+2,FR.y1-FR.y0+2);
    ctx.arc(c[0],c[1],r,0,TAU,true);
    ctx.fillStyle=PAPERC; ctx.globalAlpha=.97; ctx.fill();
    ctx.restore();
    const g3=ctx.createRadialGradient(c[0],c[1],r*.72,c[0],c[1],r);
    g3.addColorStop(0,'rgba(0,0,0,0)'); g3.addColorStop(1,'rgba(60,52,48,.16)');
    ctx.fillStyle=g3;
    ctx.save(); ctx.beginPath(); ctx.arc(c[0],c[1],r,0,TAU); ctx.fill(); ctx.restore();
  }
  if(!grainTex){
    const g=document.createElement('canvas'); g.width=200; g.height=200;
    const gg=g.getContext('2d'); const id=gg.createImageData(200,200), d=id.data;
    const r2=mulberry32(7);
    for(let i=0;i<d.length;i+=4){
      const v=r2()*255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=26;
    }
    gg.putImageData(id,0,0); grainTex=g;
  }
  ctx.save();
  ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=.16;
  const p=ctx.createPattern(grainTex,'repeat');
  ctx.fillStyle=p; ctx.fillRect(0,0,SW,SH);
  ctx.restore();
  const g2=ctx.createRadialGradient(SW/2,SH*.45,SW*.28,SW/2,SH*.45,SW*.95);
  g2.addColorStop(0,'rgba(0,0,0,0)'); g2.addColorStop(1,'rgba(86,76,60,.08)');
  ctx.fillStyle=g2; ctx.fillRect(0,0,SW,SH);
}

   生成 → 描画パイプライン

let queue=[], qi=0, raf=0, t0=0, lastMs=0, PAINTING=false;
const progEl=document.getElementById('prog'), progBar=document.getElementById('progBar'), progTxt=document.getElementById('progTxt');

function fitScene(){
  MEASURE=true;
  BX={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
  V.s=1; V.cx=0; V.cy=0;
  for(const o of OPS) o.f();
  MEASURE=false;
  const bw=Math.max(1,BX.x1-BX.x0), bh=Math.max(1,BX.y1-BX.y0);
  const FW=(FR.x1-FR.x0)*0.90, FHh=(FR.y1-FR.y0)*0.88;
  V.s=Math.min(FW/bw, FHh/bh);
  V.cx=(FR.x0+FR.x1)/2 - (BX.x0+BX.x1)/2*V.s;
  V.cy=(FR.y0+FR.y1)/2 - (BX.y0+BX.y1)/2*V.s;
}
function generate(keepPaint){
  R = mulberry32((S.seed>>>0)||1);
  const PAL = PALETTES[S.palette];
  COLS = PAL.cols; DEEP = PAL.deep;
  LINEART = S.lineart;
  EDGE = LINEART? 'rgba(74,70,78,1)' : PAL.line;
  INK = EDGE;
  INKW = S.ink==='FINE'?.80 : S.ink==='BOLD'?1.75 : 1.24;
  if(LINEART) INKW *= 1.12;
  ROUGH = 0.35 + (S.rough/100)*1.9;
  PAPERC = PAPERS[S.paper].base;
  OPS=[]; LEG=[]; NOTES=[]; strokes=0;
  SCENE.name = genName();
  SCENE.layers = [];
  SCENE.grainUm = 2000;
  SCENE.mode = S.mode;
  if(S.title.trim()){
    const t=S.title.trim();
    const sp=t.indexOf(' ');
    SCENE.name={ style:t, sub: sp>0? t.slice(0,sp).toUpperCase() : MODES[S.mode].en.split(' ')[0] };
  }
  V.rot = S.rot*Math.PI/6;

  ASPY = (S.fieldsh==='CIRCLE')? 1 : (FR.y1-FR.y0)/(FR.x1-FR.x0);
  BUILD[S.mode]();
  TR=null;
  measureField();
  matrixField();
  fieldBounds();

  OPS.sort(function(a,b){ return a.d-b.d; });
  fitScene();
  R = mulberry32((((S.seed>>>0)||1) ^ 0x5f356495)>>>0);

  queue = [];
  queue.push(function(){
    CURPART=-1; REGIONS=[];
    ctx.setTransform(EX,0,0,EX,0,0);
    ctx.clearRect(0,0,SW,SH);
    ctx.drawImage(paperFor(S.paper),0,0,SW,SH);
  });
  OPS.forEach(function(o,i){ queue.push(function(){ CURPART=i; o.f(); }); });
  const ch=chrome();
  queue.push(function(){ CURPART=-1; });
  for(const f of ch) queue.push(f);
  queue.push(finishSheet);
  if(!keepPaint) PAINT={};
  qi=0; t0=performance.now();
  if(raf) cancelAnimationFrame(raf);
  progEl.hidden=false; progTxt.textContent='DRAWING';
  raf=requestAnimationFrame(flush);
}
function flush(){
  const budget = (S.animate && !PAINTING)? 10 : 46;
  const st=performance.now();
  while(qi<queue.length && performance.now()-st<budget){ queue[qi++](); }
  progBar.style.width = Math.round(qi/queue.length*100)+'%';
  if(qi<queue.length){ raf=requestAnimationFrame(flush); }
  else{
    raf=0; lastMs=Math.round(performance.now()-t0);
    progEl.hidden=true; progBar.style.width='0%'; PAINTING=false;
    renderInfo();
  }
}
function renderSync(){
  R = mulberry32((((S.seed>>>0)||1) ^ 0x5f356495)>>>0);
  qi=0;
  while(qi<queue.length) queue[qi++]();
}
function repaint(){
  if(!queue.length) return generate(true);
  if(raf){ cancelAnimationFrame(raf); raf=0; }
  R = mulberry32((((S.seed>>>0)||1) ^ 0x5f356495)>>>0);
  qi=0; t0=performance.now();
  progEl.hidden=false; progTxt.textContent='COLOURING';
  raf=requestAnimationFrame(flush);
}

},{passive:false});
let drag=null;
vp.addEventListener('pointerdown',function(e){
  if(e.target.closest('.toolbar, #prog, .hint')) return;
  drag={x:e.clientX,y:e.clientY,px:S.panx,py:S.pany,moved:0};
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove',function(e){
  if(!drag) return;
  drag.moved=Math.max(drag.moved, Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y));
  S.panx=drag.px+(e.clientX-drag.x); S.pany=drag.py+(e.clientY-drag.y); applyView();
});
vp.addEventListener('pointerup',function(e){
  const d=drag; drag=null;
  if(!d || d.moved>4) return;
  if(!S.pencil) return;
  if(raf) return;
  const r=cv.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) return;
  const x=(e.clientX-r.left)/r.width*SW, y=(e.clientY-r.top)/r.height*SH;
  const part=hitPart(x,y);
  if(part<0) return;
  if(S.pencil==='erase'){ if(PAINT[part]==null) return; delete PAINT[part]; }
  else { if(PAINT[part]===S.pencil) return; PAINT[part]=S.pencil; }
  PAINTING=true; repaint();
});
vp.addEventListener('pointercancel',function(){ drag=null; });
window.addEventListener('resize',fitView);
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT') return;
  if(e.key==='r'||e.key==='R') newSeed();
  if(e.key==='ArrowLeft'){ S.rot=(S.rot+11)%12; generate(); }
  if(e.key==='ArrowRight'){ S.rot=(S.rot+1)%12; generate(); }
});

/* 書き出し */
function download(name,after){
  cv.toBlob(function(b){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
    if(after) after();
  },'image/png');
}
function fname(){
  return (SCENE.name.style.toUpperCase().replace(/[^A-Z0-9]+/g,'_')||'SPECIMEN')+'_'+S.seed+'.png';
}
document.getElementById('btnPng').addEventListener('click',function(){
  if(raf){ cancelAnimationFrame(raf); raf=0; renderSync(); progEl.hidden=true; renderInfo(); }
  download(fname());
});
document.getElementById('btnPng2').addEventListener('click',function(){
  const old=EX; EX=3.6;
  cv.width=SW*EX; cv.height=SH*EX;
  if(raf){ cancelAnimationFrame(raf); raf=0; }
  progEl.hidden=false; progTxt.textContent='HI-RES';
  generate(); renderSync();
  progEl.hidden=true; progBar.style.width='0%';
  download(fname().replace('.png','_HQ.png'), function(){
    EX=old; cv.width=SW*EX; cv.height=SH*EX;
    generate();
  });
});

/* =========================================================================
   起動
   ========================================================================= */
function boot(){
  cv.width=SW*EX; cv.height=SH*EX;
  cv.style.width=SW+'px'; cv.style.height=SH+'px';
  const dt=makePaper(240,240,'SKETCH');
  document.documentElement.style.setProperty('--desk-tex','url('+dt.toDataURL()+')');
  buildTabs(); buildOpts(); sync(); fitView();
  generate();
}
boot();
</script>
</body>
