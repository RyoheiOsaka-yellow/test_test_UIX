<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鉱物標本 手描きスケッチャー / HAND-DRAWN MINERALOGY</title>
<style>
:root{
  --ink:#3a3a40;
  --ink-soft:#6a6a72;
  --ink-faint:#9a989e;
  --paper:#e5e3da;
  --paper-2:#f2efe6;
  --paper-3:#fbf9f3;
  --line:#c4c2bd;
  --accent:#2b6e7f;
  --accent-2:#8a5a2b;
  --tape:rgba(200,196,150,.42);
  --red:#a44a3f;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Zen Kurenaido",-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--paper);
  overflow:hidden;
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
  font-size:13px;
}
body::before{
  /* 作業台の紙目 */
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:var(--desk-tex);
  opacity:.5; mix-blend-mode:multiply;
}
/* ---------- 手描き風の囲み ---------- */
.sk{ position:relative; }
.sk::before{
  content:''; position:absolute; inset:0;
  border:1.4px solid var(--ink);
  border-radius:5px;
  filter:url(#rough);
  pointer-events:none;
  opacity:.62;
}
.sk.dbl::after{
  content:''; position:absolute; inset:2px 1px 0 2px;
  border:1px solid var(--ink);
  border-radius:6px; opacity:.22;
  filter:url(#rough2);
  pointer-events:none;
}
.hand{ filter:url(#ink); }

/* ---------- ヘッダ ---------- */
header{
  position:relative; z-index:2;
  display:flex; align-items:center; gap:14px;
  padding:8px 16px 9px;
  background:linear-gradient(180deg,var(--paper-3),var(--paper-2));
  border-bottom:1.5px solid var(--line);
  flex-wrap:wrap;
}
header::after{
  content:''; position:absolute; left:0; right:0; bottom:-3px; height:3px;
  background:repeating-linear-gradient(90deg,var(--ink-faint) 0 7px,transparent 7px 15px);
  opacity:.25;
}
h1{
  font-size:15px; font-weight:700; letter-spacing:.04em; white-space:nowrap; line-height:1.25;
}
h1 small{
  display:block; font-size:8.5px; letter-spacing:.22em; color:var(--accent);
  font-weight:700; font-family:"Courier New",monospace;
}
.tabs{ display:flex; gap:5px; flex:1; min-width:0; flex-wrap:wrap; }
.genres{ display:flex; gap:5px; flex:none; padding-right:10px; margin-right:2px; border-right:1.5px dashed var(--line); }
.gbtn{
  font:inherit; font-size:11.5px; font-weight:700; cursor:pointer;
  padding:6px 10px 7px; background:transparent; color:var(--ink-soft);
  border:none; white-space:nowrap; position:relative;
}
.gbtn::before{
  content:''; position:absolute; inset:0; border:1.4px solid var(--accent);
  border-radius:13px 11px 14px 12px; opacity:.28; filter:url(#rough); transition:opacity .15s;
}
.gbtn:hover{ color:var(--accent); } .gbtn:hover::before{ opacity:.6; }
.gbtn.on{ color:#fff; background:var(--accent); border-radius:13px 11px 14px 12px; }
.gbtn.on::before{ opacity:1; }
.gbtn span{ position:relative; }
.tab{
  font:inherit; font-size:11.5px; font-weight:600; cursor:pointer;
  padding:6px 11px 7px; background:transparent; color:var(--ink-soft);
  border:none; white-space:nowrap; position:relative;
}
.tab::before{
  content:''; position:absolute; inset:0; border:1.3px solid var(--ink);
  border-radius:14px 12px 15px 11px; opacity:.3; filter:url(#rough);
  transition:opacity .15s;
}
.tab:hover{ color:var(--ink); }
.tab:hover::before{ opacity:.6; }
.tab.on{ color:#fff; background:var(--ink); border-radius:14px 12px 15px 11px; }
.tab.on::before{ opacity:1; }
.tab span{ position:relative; }
.tab em{
  font-style:normal; font-family:"Courier New",monospace; font-size:9px;
  opacity:.6; margin-right:4px; letter-spacing:.05em;
}

/* ---------- 本体 ---------- */
main{ flex:1; display:flex; min-height:0; position:relative; z-index:1; }
aside{
  width:272px; flex:none; overflow-y:auto; overflow-x:hidden;
  background:var(--paper-2);
  border-right:1.5px solid var(--line);
  padding:14px 14px 60px;
}
aside.right{ width:296px; border-right:none; border-left:1.5px solid var(--line); }
aside::-webkit-scrollbar{ width:9px; }
aside::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }

.sec{ margin-bottom:20px; }
.sec > h3{
  font-size:10.5px; letter-spacing:.16em; color:var(--accent);
  font-weight:700; margin-bottom:9px; padding-bottom:5px;
  font-family:"Courier New",monospace;
  border-bottom:1.2px dashed var(--line);
  display:flex; justify-content:space-between; align-items:baseline;
}
.sec > h3 b{ font-family:inherit; font-size:11px; letter-spacing:0; color:var(--ink-soft); font-weight:600; }
h4{ font-size:11px; color:var(--ink-soft); margin:11px 0 5px; font-weight:600; letter-spacing:.02em; }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; }
.chip{
  font:inherit; font-size:11px; cursor:pointer; padding:6px 4px 7px;
  background:transparent; color:var(--ink-soft); border:none;
  position:relative; text-align:center; line-height:1.3;
}
.chip::before{
  content:''; position:absolute; inset:0; border:1.2px solid var(--ink);
  border-radius:4px 6px 4px 7px; opacity:.28; filter:url(#rough2);
}
.chip:hover{ color:var(--ink); }
.chip:hover::before{ opacity:.55; }
.chip.on{ color:var(--ink); font-weight:700; background:rgba(43,110,127,.15); border-radius:4px 6px 4px 7px; }
.chip.on::before{ opacity:.95; border-width:1.6px; }
.chip small{ display:block; font-size:8.5px; font-family:"Courier New",monospace; opacity:.55; letter-spacing:.06em; }

.row{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
.row label{ font-size:11px; color:var(--ink-soft); width:58px; flex:none; font-weight:600; }
.row .val{
  min-width:46px; text-align:right; font-family:"Courier New",monospace;
  font-size:11.5px; font-weight:700; color:var(--ink);
}
input[type=range]{
  flex:1; min-width:0; -webkit-appearance:none; appearance:none;
  height:16px; background:transparent; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:3px; border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 8px);
  opacity:.5;
}
input[type=range]::-moz-range-track{
  height:3px; border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 8px);
  opacity:.5;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:15px; height:15px; margin-top:-6px;
  border-radius:50% 45% 52% 48%; background:var(--paper-3);
  border:1.8px solid var(--ink); box-shadow:1px 1.5px 0 rgba(58,58,64,.25);
}
input[type=range]::-moz-range-thumb{
  width:14px; height:14px; border-radius:50%; background:var(--paper-3);
  border:1.8px solid var(--ink);
}
input[type=text]{
  font:inherit; font-size:12px; width:100%; padding:6px 8px;
  background:transparent; border:none; color:var(--ink);
  position:relative; z-index:1;
}
input[type=text]:focus{ outline:none; }
.field{ position:relative; margin-bottom:7px; }
.field::before{
  content:''; position:absolute; inset:0; border:1.2px solid var(--ink);
  border-radius:4px; opacity:.3; filter:url(#rough2); pointer-events:none;
}

.swatches{ display:flex; gap:7px; flex-wrap:wrap; }
.sw{
  width:33px; height:33px; cursor:pointer; position:relative;
  border-radius:50% 48% 52% 47%; padding:3px;
  display:flex; flex-wrap:wrap; overflow:hidden;
}
.sw::before{
  content:''; position:absolute; inset:0; border:1.5px solid var(--ink);
  border-radius:50% 48% 52% 47%; opacity:.3; filter:url(#rough2);
}
.sw.on::before{ opacity:1; border-width:2.2px; }
.sw.on::after{
  content:''; position:absolute; inset:-4px; border:1.2px dashed var(--accent);
  border-radius:50%; opacity:.85;
}
.sw i{ width:50%; height:50%; display:block; }

.note{ font-size:10px; color:var(--ink-faint); line-height:1.6; margin-top:7px; }
.tray{ display:flex; gap:6px; flex-wrap:wrap; }
.pen{
  width:30px; height:30px; padding:3px; cursor:pointer; background:transparent;
  border:none; position:relative; border-radius:50% 47% 53% 48%;
}
.pen::before{
  content:''; position:absolute; inset:0; border:1.4px solid var(--ink);
  border-radius:50% 47% 53% 48%; opacity:.26; filter:url(#rough2);
}
.pen i{ display:block; width:100%; height:100%; border-radius:50%; }
.pen.erase i{ background:repeating-linear-gradient(45deg,#f2efe4 0 4px,#d8d2c0 4px 8px); }
.pen.on::before{ opacity:1; border-width:2.4px; }
.pen.on::after{
  content:''; position:absolute; inset:-4px; border:1.2px dashed var(--accent);
  border-radius:50%; opacity:.9;
}

/* ---------- ビューポート ---------- */
#viewport{
  flex:1; position:relative; min-width:0; overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.5),transparent 60%),
    linear-gradient(160deg,#d7d5cb,#c9c6bc 60%,#bebbb1);
  display:flex; align-items:center; justify-content:center;
  cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26'><g transform='rotate(35 13 13)'><rect x='11' y='3' width='4' height='15' fill='%23c9a227' stroke='%233a3a40' stroke-width='.8'/><path d='M11 18 L13 23 L15 18 Z' fill='%23f0e6d0' stroke='%233a3a40' stroke-width='.8'/><path d='M12.2 21 L13 23 L13.8 21 Z' fill='%233a3a40'/></g></svg>") 3 23, crosshair;
}
#sheetWrap{
  position:relative;
  box-shadow:0 10px 34px rgba(40,35,35,.35), 0 2px 6px rgba(40,35,35,.25);
  transition:transform .18s ease-out;
  will-change:transform;
}
#sheet{ display:block; background:#efeade; }
#sheetWrap::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 0 60px rgba(84,74,66,.10);
}
.tape{
  position:absolute; width:74px; height:23px; background:var(--tape);
  border-left:1px solid rgba(255,255,255,.35); border-right:1px solid rgba(150,140,90,.3);
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.tape.tl{ left:-24px; top:-11px; transform:rotate(-38deg); }
.tape.tr{ right:-24px; top:-11px; transform:rotate(38deg); }
.tape.bl{ left:-24px; bottom:-11px; transform:rotate(38deg); }
.tape.br{ right:-24px; bottom:-11px; transform:rotate(-38deg); }

/* ---------- ツールバー ---------- */
.toolbar{
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
  display:flex; align-items:center; gap:6px; z-index:4;
  background:rgba(250,247,240,.94); padding:7px 12px;
  border-radius:24px 22px 25px 23px;
  box-shadow:0 5px 20px rgba(50,42,40,.22);
  flex-wrap:wrap; justify-content:center; max-width:min(94%,760px);
}
.toolbar::before{
  content:''; position:absolute; inset:0; border:1.5px solid var(--ink);
  border-radius:24px 22px 25px 23px; opacity:.5; filter:url(#rough);
  pointer-events:none;
}
.tbtn{
  font:inherit; font-size:11px; font-weight:600; cursor:pointer;
  padding:5px 10px 6px; background:transparent; color:var(--ink-soft);
  border:none; position:relative; white-space:nowrap;
}
.tbtn::before{
  content:''; position:absolute; inset:0; border:1.2px solid var(--ink);
  border-radius:12px 10px 13px 11px; opacity:.3; filter:url(#rough2);
}
.tbtn:hover{ color:var(--ink); } .tbtn:hover::before{ opacity:.62; }
.tbtn.on{ color:#fff; background:var(--ink); border-radius:12px 10px 13px 11px; }
.tbtn.on::before{ opacity:1; }
.tbtn.big{ font-size:11.5px; padding:6px 13px 7px; font-weight:700; color:var(--ink);
  background:rgba(43,110,127,.16); border-radius:12px 10px 13px 11px; }
.tbtn.big::before{ opacity:.75; }
.tsep{ width:1px; height:19px; background:var(--line); }

/* ---------- 右パネル ---------- */
.plate{ background:var(--paper-3); padding:11px 12px 12px; margin-bottom:13px; }
.plate h2{
  font-size:13px; font-weight:700; letter-spacing:.02em; margin-bottom:2px;
  font-family:"Courier New",monospace; font-style:italic;
}
.plate .sub{ font-size:9.5px; color:var(--accent); letter-spacing:.16em; font-family:"Courier New",monospace; }
table.spec{ width:100%; border-collapse:collapse; font-size:10.5px; font-family:"Courier New",monospace; margin-top:8px; }
table.spec td{ padding:3.5px 2px; border-bottom:1px dotted var(--line); letter-spacing:.04em; }
table.spec td:first-child{ color:var(--ink-faint); width:44%; }
table.spec td:last-child{ text-align:right; font-weight:700; }
table.leg{ width:100%; border-collapse:collapse; font-size:10.5px; font-family:"Courier New",monospace; }
table.leg td{ padding:3px 2px; border-bottom:1px dotted var(--line); }
table.leg td.k{ width:16px; }
table.leg td.n{ text-align:right; font-weight:700; width:38px; }
table.leg i{ display:inline-block; width:10px; height:10px; border:1.2px solid var(--ink); border-radius:2px; }
.stat{ display:flex; justify-content:space-between; font-size:10.5px; font-family:"Courier New",monospace; padding:2.5px 0; color:var(--ink-soft); }
.stat b{ color:var(--ink); }

/* ---------- 進捗 ---------- */
#prog{
  position:absolute; left:50%; top:14px; transform:translateX(-50%);
  background:rgba(250,247,240,.95); padding:5px 14px 6px; border-radius:20px;
  font-size:10.5px; font-family:"Courier New",monospace; letter-spacing:.1em;
  display:flex; align-items:center; gap:9px; z-index:5;
  box-shadow:0 3px 12px rgba(50,42,40,.2);
}
#prog[hidden]{ display:none; }
#prog .bar{ width:96px; height:4px; background:rgba(58,58,64,.15); border-radius:3px; overflow:hidden; }
#prog .bar i{ display:block; height:100%; width:0; background:var(--accent); transition:width .1s linear; }
.pencil{ animation:scratch .45s infinite alternate ease-in-out; display:inline-block; }
@keyframes scratch{ from{ transform:translate(-1px,1px) rotate(-6deg);} to{ transform:translate(1px,-1px) rotate(4deg);} }

.hint{
  position:absolute; right:12px; bottom:16px; z-index:3;
  font-size:9.5px; color:rgba(60,52,52,.55); font-family:"Courier New",monospace;
  letter-spacing:.08em; text-align:right; line-height:1.7; pointer-events:none;
}
@media (max-width:1100px){
  aside{ width:232px; } aside.right{ width:246px; }
}
@media (max-width:820px){
  main{ flex-direction:column; }
  aside{ width:100%; max-height:172px; border-right:none; border-bottom:1.5px solid var(--line); padding-bottom:14px; }
  aside.right{ width:100%; max-height:210px; border-left:none; border-top:1.5px solid var(--line); }
  #viewport{ min-height:400px; flex:1 1 400px; }
  .grid2{ grid-template-columns:repeat(4,1fr); }
  .grid3{ grid-template-columns:repeat(6,1fr); }
  .sec{ margin-bottom:14px; }
  .row label{ width:48px; }
  h1{ font-size:13px; }
  .hint{ display:none; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="rough">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough2">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="ink">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="0.9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header>
  <h1><small>HAND-DRAWN MINERALOGY</small>鉱物標本 手描きスケッチャー</h1>
  <div class="genres" id="genres"></div>
  <div class="tabs" id="tabs"></div>
  <button class="tbtn big" id="btnRoll">🎲 新しい試料</button>
</header>

<main>
  <aside id="opts" class="hand"></aside>

  <div id="viewport">
    <div id="prog" hidden><span class="pencil">✎</span><span id="progTxt">DRAWING</span><span class="bar"><i id="progBar"></i></span></div>
    <div id="sheetWrap">
      <span class="tape tl"></span><span class="tape tr"></span>
      <span class="tape bl"></span><span class="tape br"></span>
      <canvas id="sheet"></canvas>
    </div>
    <div class="toolbar">
      <button class="tbtn" id="btnRotL">◀ 試料回転</button>
      <button class="tbtn" id="btnRotR">試料回転 ▶</button>
      <span class="tsep"></span>
      <button class="tbtn" id="btnZoomOut">−</button>
      <button class="tbtn" id="btnZoomIn">＋</button>
      <button class="tbtn" id="btnFit">原寸</button>
      <span class="tsep"></span>
      <button class="tbtn" id="btnLineart">塗り絵(線画)</button>
      <button class="tbtn on" id="btnAnim">描画アニメ</button>
      <button class="tbtn" id="btnRedraw">引き直す</button>
      <span class="tsep"></span>
      <button class="tbtn" id="btnPng">PNG保存</button>
      <button class="tbtn" id="btnPng2">高解像度</button>
    </div>
    <div class="hint">DRAG: 試料を動かす<br>WHEEL: ズーム / R: 再抽選</div>
  </div>

  <aside class="right hand" id="info"></aside>
</main>
<script>
"use strict";
/* =========================================================================
   鉱物標本 手描きスケッチャー
   結晶・薄片・集合体・岩石を写生したような鉱物スケッチを生成するエディター
   ========================================================================= */
/* ---------------- 乱数 (シード固定) ---------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let R = mulberry32(20270101);
const rnd = () => R();
const rr  = (a,b) => a + (b-a)*R();
const ri  = (a,b) => Math.floor(a + (b-a+1)*R());
const pick = a => a[Math.floor(R()*a.length)];
const chance = p => R() < p;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const TAU = Math.PI*2;

/* ---------------- 色鉛筆(鉱物色) ---------------- */
/* line: 稜線・輪郭の色 / deep: 濃色部・不透明鉱物の色 / cols: 面の塗りとハッチング */
const PALETTES = {
  QUARTZ:    { label:'石英・長石',     line:'#65656d', deep:'#2c2c34', cols:['#b8b6af','#8f9aa4','#d6d2c6','#7e7b78'] },
  XPL:       { label:'直交ニコル',     line:'#4a3f6b', deep:'#1b1440', cols:['#d8a13a','#c2496f','#3f7fbf','#5fae7a'] },
  AMETHYST:  { label:'紫水晶',         line:'#6b4a9e', deep:'#2c1a55', cols:['#a37cc9','#7b52ab','#c8aade','#5b3a86'] },
  MALACHITE: { label:'孔雀石',         line:'#2f7a5a', deep:'#123a2a', cols:['#4f9e74','#7cc09a','#2f6b4c','#a8d6bd'] },
  AZURITE:   { label:'藍銅鉱',         line:'#2a5b96', deep:'#0f2350', cols:['#4a7fc0','#7ba5d8','#2d5f9e','#a9c4e2'] },
  HEMATITE:  { label:'赤鉄鉱',         line:'#8a3a2e', deep:'#3a1712', cols:['#b5604a','#8f3b2c','#d69a80','#6d2c21'] },
  PYRITE:    { label:'黄鉄鉱',         line:'#8a6a1e', deep:'#3a2a08', cols:['#c9a227','#e0c261','#a3811c','#efdc9a'] },
  GRAPHITE:  { label:'鉛筆(無彩色)',   line:'#55535a', deep:'#2b2a30', cols:['#8a888e','#6c6a72','#a8a5a2','#57555c'] },
};

const PAPERS = {
  FIELD:   { label:'野帳',       base:'#ece7d8', grain:.042, warm:1.0 },
  SKETCH:  { label:'スケッチ紙', base:'#f4efe3', grain:.062, warm:1.02 },
  GRAPH:   { label:'方眼紙',     base:'#eef1ea', grain:.040, warm:.95, grid:true },
  VELLUM:  { label:'トレペ',     base:'#f8f6ec', grain:.026, warm:.98 },
  WHITE:   { label:'白紙',       base:'#fcfaf5', grain:.016, warm:1.0 },
};

/* ---------------- ジャンルとモード ---------------- */
const MODES = {
  /* 結晶 */

/* ---------------- 紙テクスチャ ---------------- */
let paperTex = null, paperKey = '';
function makePaper(w,h,type){
  const P = PAPERS[type];
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const g = c.getContext('2d');
  g.fillStyle = P.base; g.fillRect(0,0,w,h);
  const rr2 = mulberry32(999);
  for(let i=0;i<70;i++){
    const x=rr2()*w, y=rr2()*h, r=60+rr2()*260;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    const dark = rr2()<.5;
    gr.addColorStop(0, dark?'rgba(110,102,88,.045)':'rgba(255,253,248,.06)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  const id = g.getImageData(0,0,w,h), d = id.data, amp = P.grain*255;
  for(let i=0;i<d.length;i+=4){
    const n = (rr2()-.5)*amp;
    d[i]=clamp(d[i]+n*1.02,0,255); d[i+1]=clamp(d[i+1]+n,0,255); d[i+2]=clamp(d[i+2]+n*.94,0,255);
  }
  g.putImageData(id,0,0);
  g.globalAlpha=.05; g.strokeStyle='#8a7c68'; g.lineWidth=.6;
  for(let i=0;i<160;i++){
    const x=rr2()*w, y=rr2()*h, a=rr2()*6.28, l=6+rr2()*30;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke();
  }
  if(P.grid){
    g.globalAlpha=.18; g.strokeStyle='#7b93a8'; g.lineWidth=.5;
    for(let x=0;x<w;x+=w/90){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
    for(let y=0;y<h;y+=w/90){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  }
  g.globalAlpha=.05; g.strokeStyle='#6b5c50'; g.lineWidth=1.4;
  for(let i=0;i<3;i++){
    const vert = rr2()<.5;
    const p = (.2+rr2()*.6);
    g.beginPath();
    if(vert){ g.moveTo(w*p,0); g.lineTo(w*p+ (rr2()-.5)*10, h); } else { g.moveTo(0,h*p); g.lineTo(w, h*p+(rr2()-.5)*10); }
    g.stroke();
  }
  g.globalAlpha=1;
  return c;
}
function paperFor(type){
  const key = type+'@'+SW+'x'+SH;
  if(key!==paperKey){ paperTex = makePaper(SW,SH,type); paperKey=key; }
  return paperTex;
}
/* ---------------- 視野(2D投影) ---------------- */
const FRAD = 300;                       /* 視野の基準半径(ワールド単位) */
let ASPY = 1.38;                        /* 視野の縦横比(用紙にあわせる) */
let FIELD = { cx:0, cy:0, rx:FRAD, ry:FRAD*1.38 };
/* 視野のなかのランダムな位置 */
function FPOS(k){
  const a=R()*TAU, t=Math.sqrt(R())*(k!=null?k:1);
  return [Math.cos(a)*t*FRAD, Math.sin(a)*t*FRAD*ASPY];
}
/* 画面上のずれ(u,v)をワールド座標に戻す */
function unrot(u,v){
  const c=Math.cos(-V.rot), s=Math.sin(-V.rot);
  return [u*c - v*s, u*s + v*c];
}
const V = { rot:0, s:1, cx:SW/2, cy:SH*0.47 };
let MEASURE = false, BX = null;
let TR = null;   /* {ox,oy,s,rz} 群をまとめて並べるときの配置変換 */
function TX(x,y){
  if(!TR) return [x,y];
  const c=Math.cos(TR.rz), s=Math.sin(TR.rz);
  return [TR.ox+(x*c-y*s)*TR.s, TR.oy+(x*s+y*c)*TR.s];
}
function P(x,y){
  if(TR){ const t=TX(x,y); x=t[0]; y=t[1]; }
  const c = Math.cos(V.rot), s = Math.sin(V.rot);
  const px = V.cx + (x*c - y*s)*V.s, py = V.cy + (x*s + y*c)*V.s;
  if(MEASURE){
    if(px<BX.x0)BX.x0=px; if(px>BX.x1)BX.x1=px;
    if(py<BX.y0)BX.y0=py; if(py>BX.y1)BX.y1=py;
  }
  return [px,py];
}
/* ワールド長 → 画面長 */
const PS = v => v*V.s*(TR?TR.s:1);
/* ポリゴン(ワールド) → 画面 */
const SCR = pts => pts.map(p=>P(p[0],p[1]));

/* ---------------- 鉛筆・ペンのストローク ---------------- */
let INK = 'rgba(62,60,64,1)';
let INKW = 1.0;
let ROUGH = 1.0;
let strokes = 0;

function wob(a,b,amp){
  const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||.001;
  const n = clamp(Math.round(len/18), 2, 14);
  const nx=-dy/len, ny=dx/len;
  const bow = (R()*2-1) * Math.min(2.6, len*0.014) * amp;
  const pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n, env=Math.sin(Math.PI*t);
    const d = bow*env + (R()*2-1)*0.42*amp;
    pts.push([a[0]+dx*t+nx*d, a[1]+dy*t+ny*d]);
  }
  return pts;
}
function stroke(pts,o){
  if(MEASURE) return;
  o = o||{};
  const col = o.color||INK, w = (o.w!=null?o.w:1)*INKW;
  const a = (o.a!=null?o.a:.80), passes = o.passes!=null?o.passes:2;
  const j = (o.jit!=null?o.jit:.5)*ROUGH;
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=col;
  strokes++;
  for(let p=0;p<passes;p++){
    const ox=(R()*2-1)*j*.8, oy=(R()*2-1)*j*.8;
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const x=pts[i][0]+ox+(R()*2-1)*j*.35, y=pts[i][1]+oy+(R()*2-1)*j*.35;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.globalAlpha = a*(p===0?1:.5+R()*.25);
    ctx.lineWidth = w*(p===0?1:.72);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
/* 画面座標の線 */
function ln2(a,b,o){
  if(MEASURE) return;
  o=o||{};
  const amp = o.amp!=null?o.amp:1;
  let A=a, B=b;
  if(o.over){
    const dx=B[0]-A[0], dy=B[1]-A[1], L=Math.hypot(dx,dy)||1;
    const e=o.over*ROUGH;
    A=[A[0]-dx/L*e*R(), A[1]-dy/L*e*R()];
    B=[B[0]+dx/L*e*R(), B[1]+dy/L*e*R()];
  }
  stroke(wob(A,B,amp), o);
}
/* ワールド座標の線 */
function lnw(p,q,o){ ln2(P(p[0],p[1]), P(q[0],q[1]), o); }
function poly2(pts,o,close){
  for(let i=0;i<pts.length-1;i++) ln2(pts[i],pts[i+1],o);
  if(close) ln2(pts[pts.length-1],pts[0],o);
}
/* なめらかな閉曲線(丸い粒の輪郭)を一筆で描く */
function curve2(pts,o,close){
  if(MEASURE) return;
  o=o||{};
  const col=o.color||INK, w=(o.w!=null?o.w:1)*INKW;
  const a=(o.a!=null?o.a:.8), passes=o.passes!=null?o.passes:2;
  const j=(o.jit!=null?o.jit:.4)*ROUGH;
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=col;
  strokes++;
  const n=pts.length;
  for(let p=0;p<passes;p++){
    const ox=(R()*2-1)*j*.7, oy=(R()*2-1)*j*.7;
    ctx.beginPath();
    const first = close ? [(pts[0][0]+pts[n-1][0])/2, (pts[0][1]+pts[n-1][1])/2] : pts[0];
    ctx.moveTo(first[0]+ox, first[1]+oy);
    const end = close ? n : n-1;
    for(let i=0;i<end;i++){
      const c=pts[i], d=pts[(i+1)%n];
      const mx=(c[0]+d[0])/2+ox+(R()*2-1)*j*.3, my=(c[1]+d[1])/2+oy+(R()*2-1)*j*.3;
      ctx.quadraticCurveTo(c[0]+ox+(R()*2-1)*j*.3, c[1]+oy+(R()*2-1)*j*.3, mx, my);
    }
    if(!close) ctx.lineTo(pts[n-1][0]+ox, pts[n-1][1]+oy);
    ctx.globalAlpha=a*(p===0?1:.48+R()*.28);
    ctx.lineWidth=w*(p===0?1:.7);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* ---------------- 色鉛筆ハッチング ---------------- */
function hatch2(pts, o){
  if(MEASURE) return;
  o=o||{};
  let col = o.color||'#888';
  let sp  = o.sp || 4.2;
  const ang = o.ang!=null?o.ang : -Math.PI/4;
  let a   = (o.a!=null?o.a:.20) * (S.color/42);
  let wash = o.wash;
  if(!o.raw){
    if(o.reg!==false) regPush(pts);
    const pc = PAINT[CURPART];
    if(pc!=null){ col=pc; a=PAINTO.a; sp=PAINTO.sp; wash=true; }
    else if(LINEART) return;
  }else{
    a = (o.a!=null?o.a:.20);
  }
  if(a<=0.005 || pts.length<3) return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  const w=x1-x0, h=y1-y0;
  if(w<1.2||h<1.2) return;
  ctx.save();
  ctx.beginPath();
  pts.forEach(function(p,i){ i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
  ctx.closePath();
  ctx.clip();
  if(wash){ ctx.globalAlpha=a*.55; ctx.fillStyle=col; ctx.fillRect(x0-2,y0-2,w+4,h+4); }
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const dx=Math.cos(ang), dy=Math.sin(ang);
  const nx=-dy, ny=dx;
  const L=Math.hypot(w,h)*.62;
  const steps=Math.ceil(L*2/sp);
  ctx.strokeStyle=col; ctx.lineCap='round';
  ctx.globalCompositeOperation='multiply';
  for(let i=-steps;i<=steps;i++){
    const off=i*sp + (R()*2-1)*sp*.22;
    const sx=cx+nx*off, sy=cy+ny*off;
    let t0=-L, t1=L;
    if(R()<.30){ t0 += R()*L*.7; }
    if(R()<.30){ t1 -= R()*L*.7; }
    const A=[sx+dx*t0,sy+dy*t0], B=[sx+dx*t1,sy+dy*t1];
    ctx.globalAlpha = a*(.55+R()*.75);
    ctx.lineWidth = (o.w||1.05)*(.75+R()*.6);
    const seg = wob(A,B,1.1);
    ctx.beginPath();
    seg.forEach(function(p,k){ k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
    ctx.stroke();
  }
  if(o.cross){
    const dx2=Math.cos(ang+1.15), dy2=Math.sin(ang+1.15);
    const nx2=-dy2, ny2=dx2;
    for(let i=-steps;i<=steps;i++){
      const off=i*sp*1.5 + (R()*2-1)*sp*.2;
      const sx=cx+nx2*off, sy=cy+ny2*off;
      ctx.globalAlpha = a*(.35+R()*.45);
      ctx.lineWidth = (o.w||1)*(.7+R()*.5);
      const seg = wob([sx+dx2*-L,sy+dy2*-L],[sx+dx2*L,sy+dy2*L],1.1);
      ctx.beginPath();
      seg.forEach(function(p,k){ k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.restore();
}
let PAPERC='#f0ebdd';
/* --- 塗り絵 --- */
let LINEART=false;              /* 線画モード(自動彩色を止める) */
let PAINT={};                   /* 部位番号 -> 色 */
let REGIONS=[];                 /* 当たり判定用 {p:部位番号, pts:画面座標} */
let CURPART=-1;                 /* いま描いている部位 */
function regPush(pts){ if(!MEASURE && CURPART>=0) REGIONS.push({p:CURPART,pts:pts}); }
function inPoly(pts,x,y){
  let c=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const a=pts[i], b=pts[j];
    if(((a[1]>y)!==(b[1]>y)) && (x < (b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])) c=!c;
  }
  return c;
}
function hitPart(x,y){
  for(let i=REGIONS.length-1;i>=0;i--) if(inPoly(REGIONS[i].pts,x,y)) return REGIONS[i].p;
  return -1;
}
const PAINTO = {a:.34,sp:3.2,wash:true,raw:true};
function fillPoly(pts,c,a){
  if(MEASURE||!a||pts.length<3) return;
  ctx.save(); ctx.beginPath();
  pts.forEach(function(p,i){ i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
  ctx.closePath(); ctx.globalAlpha=a; ctx.fillStyle=c; ctx.fill(); ctx.restore();
}

/* パレット取得 */
let COLS = PALETTES.QUARTZ.cols;
let EDGE = PALETTES.QUARTZ.line;
let DEEP = PALETTES.QUARTZ.deep;
const col = i => COLS[((i%COLS.length)+COLS.length)%COLS.length];
/* =========================================================================
   幾何ヘルパ
   ========================================================================= */
function polyCentroid(pts){
  let a=0,cx=0,cy=0;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const f = pts[j][0]*pts[i][1] - pts[i][0]*pts[j][1];
    a += f; cx += (pts[j][0]+pts[i][0])*f; cy += (pts[j][1]+pts[i][1])*f;

  const mx=(ax+bx)/2, my=(ay+by)/2, nx=bx-ax, ny=by-ay;
  const out=[];
  const sd = function(p){ return (p[0]-mx)*nx + (p[1]-my)*ny; };
  for(let i=0;i<poly.length;i++){
    const A=poly[i], B=poly[(i+1)%poly.length];
    const da=sd(A), db=sd(B);
    if(da<=0) out.push(A);
    if((da<=0)!==(db<=0)){
      const t=da/(da-db);
      out.push([A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t]);

/* ボロノイ分割。近い種点から順に切り、これ以上効かなくなったら打ち切る

function voronoiCells(sites,bound){

  const b=bbox(bound);
  const W=Math.max(1e-6,b.x1-b.x0), H=Math.max(1e-6,b.y1-b.y0);
  const cell=Math.max(W,H)/clamp(Math.ceil(Math.sqrt(n)),1,64);
  const gw=Math.max(1,Math.ceil(W/cell)), gh=Math.max(1,Math.ceil(H/cell));
  const grid=new Array(gw*gh);
  const cx=function(x){ return clamp(Math.floor((x-b.x0)/cell),0,gw-1); };
  const cy=function(y){ return clamp(Math.floor((y-b.y0)/cell),0,gh-1); };
  for(let i=0;i<n;i++){
    const k=cy(sites[i][1])*gw+cx(sites[i][0]);
    (grid[k]||(grid[k]=[])).push(i);
  }
  const maxR=Math.max(gw,gh);
  return sites.map(function(s,i){
    let poly=bound;
    const ix=cx(s[0]), iy=cy(s[1]);
    for(let r=0;r<=maxR;r++){
      const cand=[];
      for(let yy=iy-r; yy<=iy+r; yy++){
        if(yy<0||yy>=gh) continue;
        for(let xx=ix-r; xx<=ix+r; xx++){
          if(xx<0||xx>=gw) continue;
          if(r>0 && Math.abs(xx-ix)!==r && Math.abs(yy-iy)!==r) continue;
          const arr=grid[yy*gw+xx];
          if(arr) for(let k=0;k<arr.length;k++) if(arr[k]!==i) cand.push(arr[k]);

      }
      if(cand.length>1) cand.sort(function(a,c){
        return (Math.hypot(sites[a][0]-s[0],sites[a][1]-s[1]) -
                Math.hypot(sites[c][0]-s[0],sites[c][1]-s[1]));
      });
      for(let k=0;k<cand.length;k++){
        const j=cand[k];
        poly=clipHalf(poly, s[0],s[1], sites[j][0],sites[j][1]);
        if(poly.length<3) break;
      }
      if(poly.length<3) break;
      /* 距離 d の種点は d/2 より近い部分しか削れない。外周の輪がその範囲を超えたら終了 */
      if(r>0 && polyRad(poly,s)*2 <= r*cell) break;

  });
}

function sitesIn(poly,spacing){

    const off = ((Math.round((y-b.y0)/spacing)%2)? spacing*.5 : 0);
    for(let x=b.x0+spacing*.4+off; x<b.x1; x+=spacing){
      const p=[x+(R()*2-1)*spacing*.24, y+(R()*2-1)*spacing*.24];
      if(inPoly(poly,p[0],p[1])) out.push(p);
    }
  }
  return out;

/* 結晶モザイク(粒どうしが噛みあった組織)をつくる */
function mosaic(outline,spacing,o){
  o=o||{};
  const st = o.stretch||1;                    /* >1 で横に引き伸ばす */
  const bound = st!==1? scalePoly(outline,1,st) : outline;
  /* 粒が細かすぎると描画が重くなるので、上限の枚数に収まるまで間隔を広げる */
  const cap = o.maxCells||620;
  const est = polyArea(bound)/(spacing*spacing);
  if(est>cap) spacing *= Math.sqrt(est/cap);

  if(o.vary) sites=sites.filter(function(){ return !chance(o.vary); });

    sites=cs.map(function(c,i){ return c.length>2? polyCentroid(c) : sites[i]; });
  }

    .filter(function(c){ return c.length>2 && polyArea(c)>spacing*spacing*.10; })
    .map(function(c){ return shrinkPoly(c, o.gap!=null?o.gap:.90); });

    if(Math.abs(d)<1e-9) continue;
    const t=((C[0]-A[0])*(D[1]-C[1])-(C[1]-A[1])*(D[0]-C[0]))/d;
    const u=((C[0]-A[0])*(B[1]-A[1])-(C[1]-A[1])*(B[0]-A[0]))/d;
    if(u>=0&&u<=1&&t>=0&&t<=1) ts.push(t);

    if(inPoly(poly,px,py)){

function chainCells(path,w,cellLen,o){

  const total=cum[N-1];
  const n=Math.max(1,Math.round(total/cellLen));
  const at=function(s){
    s=clamp(s,0,total);
    let i=1; while(i<N-1 && cum[i]<s) i++;
    const t=(s-cum[i-1])/Math.max(1e-6,cum[i]-cum[i-1]);
    const dx=path[i][0]-path[i-1][0], dy=path[i][1]-path[i-1][1], L=Math.hypot(dx,dy)||1;

  o=o||{};
  if(n<1) return;
  const c=polyCentroid(pts);
  const rad=polyRad(pts,c);
  const dx=Math.cos(ang), dy=Math.sin(ang), nx=-dy, ny=dx;
  const sp=2*rad/n;
  let drawn=0;
  for(let i=-n/2;i<=n/2;i++){
    const off=i*sp + (o.jitter? (R()*2-1)*sp*.25 : 0);
    const A=[c[0]+nx*off-dx*rad, c[1]+ny*off-dy*rad];
    const B=[c[0]+nx*off+dx*rad, c[1]+ny*off+dy*rad];
    const seg=clipSeg(pts,A,B);
    if(seg){
      const alt = (o.alt && (i%2===0));
      lnw(seg[0],seg[1],{w:(o.w||.8)*(alt?1.6:1), a:(o.a!=null?o.a:.4)*(alt?1.25:1),
                          color:o.color||EDGE, passes:1, jit:.35});
      drawn++;
    }
  }
  return drawn;
}
/* 面の2辺方向にそった劈開線 */
function edgeTraces(pts,n,o){
  if(pts.length<3) return;
  const d1=Math.atan2(pts[1][1]-pts[0][1], pts[1][0]-pts[0][0]);
  const d2=Math.atan2(pts[2][1]-pts[1][1], pts[2][0]-pts[1][0]);
  traceW(pts,n,d1,o);
  traceW(pts,Math.round(n*.75),d2,o);
}
/* しなやかな細線(針状結晶・繊維) */
function wispW(x,y,ang,len,o){
  o=o||{};
  const pts=[[x,y]];
  let a=ang;
  const n=o.n||9;
  for(let i=0;i<n;i++){
    a += (o.curl!=null?o.curl:.28)*(R()*2-1) + (o.bend||0);
    pts.push([pts[i][0]+Math.cos(a)*len/n, pts[i][1]+Math.sin(a)*len/n]);
  }
  curve2(SCR(pts),{w:o.w||.75,a:o.a!=null?o.a:.5,color:o.color||EDGE,passes:1,jit:.35},false);
  return pts;
}

/* ---------------- 結晶の内部状態(新鮮・累帯・変質・破断) ---------------- */
function interior(poly,o){
  o=o||{};
  const st=o.state||S.state;
  const c=polyCentroid(poly), rad=polyRad(poly,c);
  if(PS(rad)<7) return;
  const dc=o.color||DEEP;
  /* 頂点の多い輪郭は一筆書きにする(直線をなぞるとストロークが増えすぎる) */
  const rnd2 = o.round || poly.length>24;
  if(st==='ZONED'){
    const n=Math.max(1,Math.round(rr(2,4)*DETN()));
    for(let i=1;i<=n;i++){
      const k=1-i/(n+1.35);
      const zp=SCR(shrinkPoly(poly,k,c));
      if(rnd2) curve2(zp,{w:.75,a:.30,color:dc,passes:1,jit:.35},true);
      else poly2(zp,{w:.75,a:.30,color:dc,passes:1,jit:.35,over:1.0},true);
    }
    hatch2(SCR(shrinkPoly(poly,.36,c)),{color:o.wash||col(1),a:.20,sp:2.8,ang:o.ang!=null?o.ang:-.4,wash:true,raw:true});
    leg('ZONING',1);
  }else if(st==='ALTERED'){
    const n=Math.max(2,Math.round(4*DETN()));
    for(let i=0;i<n;i++){
      const a=R()*TAU, d2=rad*Math.sqrt(R())*.62;
      const px=c[0]+Math.cos(a)*d2, py=c[1]+Math.sin(a)*d2;
      hatch2(SCR(wobRing(px,py,rad*rr(.14,.30),{n:14,lobes:4,amp:.26})),
             {color:o.wash||col(2),a:.28,sp:2.2,ang:rr(-1.2,.4),wash:true,raw:true});
    }
    speckW(c[0],c[1],rad*.8,Math.round(6*DETN()),{color:dc,a:.30});
    leg('ALTERATION',1);
  }else if(st==='FRACT'){
    const n=ri(2,4);
    for(let i=0;i<n;i++){
      const a=R()*TAU;
      const A=[c[0]+Math.cos(a)*rad*1.4, c[1]+Math.sin(a)*rad*1.4];
      const B=[c[0]-Math.cos(a)*rad*1.4+rr(-rad*.4,rad*.4), c[1]-Math.sin(a)*rad*1.4+rr(-rad*.4,rad*.4)];
      const seg=clipSeg(poly,A,B);
      if(seg) lnw(seg[0],seg[1],{w:.9,a:.44,color:dc,passes:1,jit:.6});
    }
    leg('FRACTURES',n);
  }else{
    if(INCN()>.8) speckW(c[0],c[1],rad*.7,Math.round(3*INCN()),{color:o.wash||col(1),a:.34});
  }
  if(INCN()>1.2 && st!=='FRESH') speckW(c[0],c[1],rad*.7,2,{color:dc,a:.30});
}

/* ---------------- 結晶多面体 ---------------- */
/* 柱面 k 枚 + 錐面(roof=0 で錐、>0 で稜) */
function prismFaces(W,H,k,o){
  o=o||{};
  const tip=o.tip!=null?o.tip:H*.5, btm=o.btm!=null?o.btm:0;
  const rk=o.roof!=null?o.roof:0, shear=o.shear||0;
  const sx=function(x,y){ return [x - shear*y/H*W, y]; };
  const xs=[];
  for(let i=0;i<=k;i++) xs.push(-W + 2*W*(i/k));
  if(o.uneven) for(let i=1;i<k;i++) xs[i]+=rr(-.16,.16)*2*W/k;
  const F=[];
  for(let i=0;i<k;i++)
    F.push({t:'p', i:i, pts:[sx(xs[i],-H),sx(xs[i+1],-H),sx(xs[i+1],H),sx(xs[i],H)]});
  if(tip>0){
    const a0=-W*rk, a1=W*rk, ay=-H-tip;
    for(let i=0;i<k;i++){
      const t0=a0+(a1-a0)*(i/k), t1=a0+(a1-a0)*((i+1)/k);
      const p=[sx(xs[i],-H), sx(xs[i+1],-H), sx(t1,ay)];
      if(Math.abs(t1-t0)>1e-6) p.push(sx(t0,ay));
      F.push({t:'t', i:i, pts:p});
    }
  }
  if(btm>0){
    const a0=-W*rk, a1=W*rk, ay=H+btm;
    for(let i=0;i<k;i++){
      const t0=a0+(a1-a0)*(i/k), t1=a0+(a1-a0)*((i+1)/k);
      const p=[sx(xs[i],H), sx(xs[i+1],H), sx(t1,ay)];
      if(Math.abs(t1-t0)>1e-6) p.push(sx(t0,ay));
      F.push({t:'b', i:i, pts:p});
    }
  }
  return F;
}
/* 立方体・菱面体(可視3面) */
function boxFaces(ex,ey,ez){
  const V3=function(a,b,c){ return [a*ex[0]+b*ey[0]+c*ez[0], a*ex[1]+b*ey[1]+c*ez[1]]; };
  return centerFaces([
    {t:'top', i:0, pts:[V3(0,0,1),V3(1,0,1),V3(1,1,1),V3(0,1,1)]},
    {t:'r',   i:1, pts:[V3(1,0,0),V3(1,1,0),V3(1,1,1),V3(1,0,1)]},
    {t:'l',   i:2, pts:[V3(0,1,0),V3(1,1,0),V3(1,1,1),V3(0,1,1)]},
  ]);
}
/* 八面体(可視4面) */
function octaFaces(r,o){
  o=o||{};
  const w=r*(o.w||.92), e=r*(o.e||.34), h=r*(o.h||1.0);
  const T=[0,-h], B=[0,h], Lp=[-w,0], Rp=[w,0], Fr=[0,e];
  return centerFaces([
    {t:'o', i:0, pts:[T,Lp,Fr]}, {t:'o', i:1, pts:[T,Fr,Rp]},
    {t:'o', i:2, pts:[B,Lp,Fr]}, {t:'o', i:3, pts:[B,Fr,Rp]},
  ]);
}
function centerFaces(F){
  let all=[]; F.forEach(function(f){ all=all.concat(f.pts); });
  const b=bbox(all), mx=(b.x0+b.x1)/2, my=(b.y0+b.y1)/2;
  return F.map(function(f){ return {t:f.t, i:f.i, pts:movePoly(f.pts,-mx,-my)}; });
}
function placeFaces(F,cx,cy,rot){
  return F.map(function(f){ return {t:f.t, i:f.i, pts:movePoly(rotPoly(f.pts,rot),cx,cy)}; });
}
/* 多面体をまとめて描く(面ごとに濃さを変えて陰影をつける) */
function drawCrystal(F,o){
  o=o||{};
  const base = o.d!=null? o.d : polyCentroid(F[0].pts)[1];
  let big=0, ba=0;
  F.forEach(function(f,i){ const a=polyArea(f.pts); if(a>ba){ ba=a; big=i; } });
  F.forEach(function(f,i){
    const t = F.length>1? i/(F.length-1) : .5;
    const sh = o.shade!=null? o.shade : (.62+t*.85);
    putFace(f.pts,{ color:o.color||col(o.ci||0), a:(o.a!=null?o.a:.16)*sh,
                    sp:o.sp||3.4, ang:(o.ang!=null?o.ang:-.7)+i*.55,
                    lw:o.lw!=null?o.lw:1.25, ea:o.ea, edgec:o.edgec, over:o.over },
             base+i*.02);
    op(base+i*.02+.008, function(){
      if(o.stri && f.t==='p') traceW(f.pts, Math.round(o.stri), o.striang||0, {w:.6,a:.30,jitter:true});
      if(o.cleav) edgeTraces(f.pts, Math.round(o.cleav), {w:.55,a:.24});
      if(i===big) interior(f.pts,{ang:o.ang});
    });
  });
  leg('CRYSTAL FACES',F.length);
}
/* 視野に散る岩粉・微細片 */
function matrixField(){
  const n = S.density==='MANY'? 34 : S.density==='MODERATE'? 18 : 7;
  /* 岩粉は視野の大きさに対して小さく(結晶を描くときも薄片のときも同じ見えかたに) */
  const cr = Math.min(GRAINR()*.10, FIELD.rx*.010);
  for(let i=0;i<n;i++){
    const a=R()*TAU, t=Math.sqrt(R())*.99;
    const d=unrot(Math.cos(a)*t*FIELD.rx, Math.sin(a)*t*FIELD.ry);
    const x=FIELD.cx+d[0], y=FIELD.cy+d[1];
    const r=Math.max(.8, cr*rr(.6,1.4));
    const shard = chance(.42);
    op(-8000+i, function(){
      if(shard){
        const ang=R()*TAU;
        lnw([x-Math.cos(ang)*r*1.7,y-Math.sin(ang)*r*1.7],[x+Math.cos(ang)*r*1.7,y+Math.sin(ang)*r*1.7],
            {w:Math.max(.7,PS(r)*.85),a:.42,color:DEEP,passes:1,jit:.3});
      }else{
        blobW(x,y,r,{color:DEEP,a:.50,jag:.30});
      }
    });
  }
  leg('ROCK DUST',n);
  /* ピントの外れたぼんやりした影 */
  const nb = S.detail==='MINIMAL'? 2 : 5;
  for(let i=0;i<nb;i++){
    const a=R()*TAU, t=rr(.3,1.0);
    const d=unrot(Math.cos(a)*t*FIELD.rx, Math.sin(a)*t*FIELD.ry);
    const x=FIELD.cx+d[0], y=FIELD.cy+d[1], r=FIELD.rx*rr(.05,.13);
    op(-9000+i, function(){
      const pts=SCR(wobRing(x,y,r,{n:20,lobes:4,amp:.2}));
      hatch2(pts,{color:col(2),a:.05,sp:5.2,ang:-.5,wash:true,raw:true});
    });
  }
}
/* 視野いっぱいを採寸させる基準(描かれない) */
function fieldBounds(){
  op(-99999, function(){
    if(!MEASURE) return;
    const c=P(FIELD.cx,FIELD.cy);
    if(c[0]-FIELD.rx<BX.x0) BX.x0=c[0]-FIELD.rx;
    if(c[0]+FIELD.rx>BX.x1) BX.x1=c[0]+FIELD.rx;
    if(c[1]-FIELD.ry<BX.y0) BX.y0=c[1]-FIELD.ry;
    if(c[1]+FIELD.ry>BX.y1) BX.y1=c[1]+FIELD.ry;
  });
}
/* 描いた試料の広がりから視野の大きさを決める */
function measureField(){
  const rot=V.rot, sc=V.s, cx=V.cx, cy=V.cy;
  V.rot=0; V.s=1; V.cx=0; V.cy=0;
  MEASURE=true; BX={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
  for(const o of OPS) o.f();
  MEASURE=false;
  V.rot=rot; V.s=sc; V.cx=cx; V.cy=cy;
  const AR=(FR.y1-FR.y0)/(FR.x1-FR.x0);
  if(BX.x1<BX.x0){ FIELD={cx:0,cy:0,rx:FRAD,ry:FRAD*AR}; return; }
  const mx=(BX.x0+BX.x1)/2, my=(BX.y0+BX.y1)/2;
  let rx=Math.max(24,(BX.x1-BX.x0)/2)*1.10, ry=Math.max(24,(BX.y1-BX.y0)/2)*1.10;
  if(S.fieldsh==='CIRCLE'){ const r=Math.max(rx,ry); rx=r; ry=r; }
  else if(ry/rx < AR) ry=rx*AR; else rx=ry/AR;
  FIELD={ cx:mx, cy:my, rx:rx, ry:ry };
}

/* =========================================================================
   試料生成 — 16種
   ========================================================================= */
const SCENE = { name:null, grainUm:2000, layers:[], mode:'' };

const BUILD = {

/* ---------- 結晶 01 柱状結晶 ---------- */
prism(){
  SCENE.grainUm = 45000;
  const sys=S.shape;
  forGroups(function(){
    const n = S.density==='MANY'? 3 : S.density==='MODERATE'? 2 : 1;
    for(let i=0;i<n;i++){
      const sc = i===0? 1 : rr(.40,.62);
      const r  = GRAINR()*1.45*sc;
      let px=0, py=0, rot=rr(-.16,.16);
      if(i>0){
        const a=R()*TAU;
        px=Math.cos(a)*GRAINR()*rr(3.0,4.4); py=Math.sin(a)*GRAINR()*rr(2.2,3.6);
        rot=rr(-1.1,1.1);
      }
      let F;
      if(sys==='CUBIC'){
        F = octaFaces(r*1.9,{e:.34});
      }else{
        const k = sys==='MONO'? 2 : 3;
        F = prismFaces(r*(sys==='TET'?.82:1), r*(sys==='MONO'?1.7:2.4), k, {
          tip:  sys==='MONO'? r*.50 : r*(sys==='TET'?.72:.60),
          roof: sys==='MONO'? .60 : (sys==='HEX'? .22 : 0),
          shear:sys==='MONO'? .42 : 0,
          uneven: sys!=='TET',
          btm: (S.site==='PLACER'||S.site==='CAVITY')? 0 : (chance(.45)? r*.65:0),
        });
      }
      F = placeFaces(F,px,py,rot);
      drawCrystal(F,{ ci:0, d:py,
        stri: sys==='HEX'? Math.round(rr(8,15)*DETN()) : (sys==='TET'? Math.round(6*DETN()):0),
        striang: rot,
        cleav: sys==='CUBIC'? Math.round(5*DETN()) : 0 });
      leg('CRYSTALS',1);
      /* 母岩に生えた根もと */
      if(i===0 && (S.site==='PEGMATITE'||S.site==='HYDRO')){
        const yb=r*(sys==='CUBIC'?1.7:2.4);
        op(yb+40, function(){
          const gp=[];
          for(let k2=0;k2<=22;k2++){
            const t=k2/22;
            gp.push([lerp(-r*2.6,r*2.6,t), yb*rr(.98,1.02)+Math.sin(t*7+px)*r*.20]);
          }
          gp.push([r*2.6, yb+r*1.5]); gp.push([-r*2.6, yb+r*1.5]);
          hatch2(SCR(gp),{color:col(3),a:.20,sp:3.0,ang:-.9,wash:true,cross:true});
          curve2(SCR(gp.slice(0,23)),{w:1.2,a:.42,color:EDGE,passes:1,jit:.7},false);
        });
        leg('MATRIX',1);
      }
    }
  });
  const rr0=GRAINR()*1.45;
  note(0,-rr0*2.6,'TERMINATION',1);
  note(-rr0*.75, rr0*.9,'PRISM FACE',-1);
  if(S.state==='ZONED') note(rr0*.3,-rr0*.4,'ZONING',1);
},

/* ---------- 結晶 02 菱面体 ---------- */
rhomb(){
  SCENE.grainUm = 22000;
  const sys=S.shape;
  const n = S.density==='MANY'? ri(7,10) : S.density==='MODERATE'? ri(4,6) : ri(2,3);
  const pos=[];
  for(let i=0;i<n*4 && pos.length<n;i++){
    const p=FPOS(.70);
    let ok=true;
    for(const q of pos) if(Math.hypot(p[0]-q[0],p[1]-q[1])<GRAINR()*1.7){ ok=false; break; }
    if(ok) pos.push(p);
  }
  pos.forEach(function(p,i){
    const r=GRAINR()*rr(.70,1.15)*(i===0?1.55:1);
    const rot=rr(-.45,.45);
    let ex,ey,ez;
    if(sys==='CUBIC'){      ex=[.866*r,.50*r];  ey=[-.866*r,.50*r];  ez=[0,-1.00*r]; }
    else if(sys==='TET'){   ex=[.880*r,.42*r];  ey=[-.880*r,.42*r];  ez=[0,-1.30*r]; }
    else if(sys==='MONO'){  ex=[.900*r,.38*r];  ey=[-.820*r,.46*r];  ez=[.34*r,-1.15*r]; }
    else {                  ex=[.900*r,.40*r];  ey=[-.900*r,.40*r];  ez=[.10*r,-1.18*r]; }
    const F=placeFaces(boxFaces(ex,ey,ez),p[0],p[1],rot);
    drawCrystal(F,{ ci:i%2, d:p[1], cleav:Math.round(4*DETN())+2, lw:1.3 });
    leg('RHOMBOHEDRA',1);
    leg('CLEAVAGE TRACES',Math.round(4*DETN())+2);
  });
  /* 小さな伴晶 */
  const ns = Math.round(6*DENN());
  for(let i=0;i<ns;i++){
    const p=FPOS(.92), r=GRAINR()*rr(.16,.30);
    op(p[1]-2, function(){
      const F=placeFaces(boxFaces([.866*r,.5*r],[-.866*r,.5*r],[0,-1.05*r]),p[0],p[1],rr(-.5,.5));
      F.forEach(function(f,k){
        faceDraw(f.pts,{color:col(2),a:.16*(.7+k*.4),sp:2.6,ang:-.6+k*.5,lw:.95,solid:.4});
      });
    });
  }
  leg('ACCESSORY CRYSTALS',ns);
  note(0,0,'RHOMB FACE',1);
  note(-GRAINR()*.8,GRAINR()*.6,'CLEAVAGE',-1);
},

/* ---------- 結晶 03 双晶 ---------- */
twin(){
