<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three.module.js" } }
    </script>
    <style>
      @font-face { font-family: "Hiragino Kaku Gothic ProN"; src: local("Hiragino Kaku Gothic ProN"); }
      @font-face { font-family: "Yu Gothic"; src: local("Yu Gothic"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #0b0908;
        font-family: "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        color: #f5efe6;
      }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      /* Source video: kept in the DOM so HyperFrames drives its currentTime,
         but visually hidden behind the WebGL canvas. */
      #srcVideo {
        position: absolute; top: 0; left: 0;
        width: 1920px; height: 1080px;
        opacity: 0.001; pointer-events: none;
      }

      #stage3d { position: absolute; inset: 0; }
      #stage3d canvas { display: block; }

      /* Soft vignette hides edge stretching from the camera projection */
      .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 48%, transparent 62%, rgba(5,4,3,0.55) 100%);
      }

      .title-wrap {
        position: absolute; left: 0; right: 0; bottom: 90px;
        display: flex; flex-direction: column; align-items: center;
        pointer-events: none;
      }
      .title-main {
        font-size: 54px; font-weight: 700; letter-spacing: 10px;
        color: #f5efe6; text-shadow: 0 2px 24px rgba(0,0,0,0.8);
      }
      .title-sub {
        font-size: 26px; font-weight: 300; letter-spacing: 6px;
        color: #d6c9a8; margin-top: 14px; text-shadow: 0 2px 16px rgba(0,0,0,0.8);
      }

      .shot-label {
        position: absolute; left: 72px; bottom: 64px;
        font-size: 24px; letter-spacing: 6px; font-weight: 300;
        color: rgba(245,239,230,0.85); text-shadow: 0 2px 12px rgba(0,0,0,0.9);
        border-left: 3px solid rgba(214,166,108,0.9); padding-left: 18px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="srcVideo"
        class="clip"
        src="assets/orchestra.mp4"
        muted
        playsinline
        preload="auto"
        data-start="0"
        data-duration="30"
        data-track-index="0"
      ></video>

      <div id="stage3d" class="clip" data-start="0" data-duration="30" data-track-index="1"></div>
      <div class="vignette clip" id="vignette" data-start="0" data-duration="30" data-track-index="2"></div>

      <div class="title-wrap clip" id="titleWrap" data-start="0" data-duration="5" data-track-index="3">
        <div class="title-main" id="titleMain">ORCHESTRA — MULTI ANGLE</div>
        <div class="title-sub" id="titleSub">仮想カメラによる多視点ビュー</div>
      </div>

      <div class="shot-label clip" id="lblArc"   data-start="5"  data-duration="8" data-track-index="4">SIDE ARC — 左右の回り込み</div>
      <div class="shot-label clip" id="lblDolly" data-start="13" data-duration="6" data-track-index="4">DOLLY IN — 中央へ寄る</div>
      <div class="shot-label clip" id="lblCrane" data-start="19" data-duration="6" data-track-index="4">CRANE — 俯瞰へ</div>
      <div class="shot-label clip" id="lblBack"  data-start="25" data-duration="5" data-track-index="4">RETURN — 正面へ戻る</div>
    </div>

    <script type="module">
      import * as THREE from "three";

      // ---------------------------------------------------------------
      // Scene layout constants (frame coords: u 0→1 left→right, v 0→1 top→bottom)
      // Estimated from the source footage: brick wall, stage floor,
      // seated ensemble mid-stage, audience heads at the bottom.
      // ---------------------------------------------------------------
      const V_WALL_FLOOR = 0.615; // wall/floor junction
      const V_STAGE_EDGE = 0.885; // front edge of stage (audience below)
      const D_WALL   = 10.0;      // depth of the back wall
      const D_JOIN   = 10.0;      // floor depth at the wall junction
      const D_EDGE   = 5.6;       // floor depth at the stage front edge
      const D_SEATS  = 3.2;       // nearest audience depth
      const D_PERF   = 7.2;       // ensemble band depth
      // Ensemble band (soft-edged box that gets pulled forward)
      const PERF = { u0: 0.17, u1: 0.82, v0: 0.28, v1: 0.83, feather: 0.09 };

      const FOV = 40;
      const ASPECT = 1920 / 1080;

      const smooth = (a, b, x) => {
        const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      };

      function sceneDepth(u, v) {
        let d;
        if (v <= V_WALL_FLOOR) {
          d = D_WALL;
        } else if (v <= V_STAGE_EDGE) {
          const t = (v - V_WALL_FLOOR) / (V_STAGE_EDGE - V_WALL_FLOOR);
          d = D_JOIN + (D_EDGE - D_JOIN) * t;
        } else {
          const t = (v - V_STAGE_EDGE) / (1 - V_STAGE_EDGE);
          d = D_EDGE + (D_SEATS - D_EDGE) * smooth(0, 1, t);
        }
        // Pull the ensemble band forward with feathered edges
        const wx = smooth(PERF.u0 - PERF.feather, PERF.u0, u) *
                   (1 - smooth(PERF.u1, PERF.u1 + PERF.feather, u));
        const wy = smooth(PERF.v0 - PERF.feather, PERF.v0, v) *
                   (1 - smooth(PERF.v1, PERF.v1 + PERF.feather, v));
        const w = wx * wy;
        if (w > 0 && d > D_PERF) d = d + (D_PERF - d) * w;
        return d;
      }

      // ---------------------------------------------------------------
      // Build the camera-mapped stage mesh: each grid vertex is unprojected
      // from the original (frontal) camera position to its estimated depth.
      // ---------------------------------------------------------------
      const container = document.getElementById("stage3d");
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(1920, 1080);
      renderer.setPixelRatio(1);
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0908);

      const camera = new THREE.PerspectiveCamera(FOV, ASPECT, 0.1, 100);

      const video = document.getElementById("srcVideo");
      const texture = new THREE.VideoTexture(video);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;

      const SEG_X = 240, SEG_Y = 135;
      const OVER = 0.07; // extend beyond the frame; clamped texture stretches edges
      const tanH = Math.tan(THREE.MathUtils.degToRad(FOV / 2));

      const positions = [];
      const uvs = [];
      const indices = [];
      for (let iy = 0; iy <= SEG_Y; iy++) {
        for (let ix = 0; ix <= SEG_X; ix++) {
          const u = -OVER + (ix / SEG_X) * (1 + 2 * OVER);
          const v = -OVER + (iy / SEG_Y) * (1 + 2 * OVER);
          const uc = Math.min(1, Math.max(0, u));
          const vc = Math.min(1, Math.max(0, v));
          const d = sceneDepth(uc, vc);
          const x = (u - 0.5) * 2 * d * tanH * ASPECT;
          const y = (0.5 - v) * 2 * d * tanH;
          positions.push(x, y, -d);
          uvs.push(uc, 1 - vc);
        }
      }
      for (let iy = 0; iy < SEG_Y; iy++) {
        for (let ix = 0; ix < SEG_X; ix++) {
          const a = iy * (SEG_X + 1) + ix;
          const b = a + 1;
          const c = a + (SEG_X + 1);
          const e = c + 1;
          indices.push(a, c, b, b, c, e);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: texture })));

      // ---------------------------------------------------------------
      // Virtual camera rig, driven deterministically by the GSAP timeline.
      // The original camera sits at the origin looking down -Z, so
      // rig = {0,0,0} reproduces the source framing exactly.
      // ---------------------------------------------------------------
      const target0 = (() => {
        const u = 0.5, v = 0.58, d = D_PERF;
        return {
          x: (u - 0.5) * 2 * d * tanH * ASPECT,
          y: (0.5 - v) * 2 * d * tanH,
          z: -d,
        };
      })();

      const rig = { x: 0, y: 0, z: 0, tx: target0.x, ty: target0.y, tz: target0.z };

      function render() {
        camera.position.set(rig.x, rig.y, rig.z);
        camera.lookAt(rig.tx, rig.ty, rig.tz);
        if (video.readyState >= 2) texture.needsUpdate = true;
        renderer.render(scene, camera);
      }

      video.addEventListener("seeked", render);
      video.addEventListener("loadeddata", render);

      // ---------------------------------------------------------------
      // Timeline: 30 s, five virtual-camera moves
      // ---------------------------------------------------------------
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: "sine.inOut" }, onUpdate: render });

      // Title in/out
      tl.from("#titleMain", { opacity: 0, y: 26, duration: 1.1, ease: "power3.out" }, 0.4);
      tl.from("#titleSub", { opacity: 0, y: 18, duration: 0.9, ease: "power3.out" }, 0.9);
      tl.to("#titleWrap", { opacity: 0, duration: 0.8, ease: "power2.in" }, 4.0);

      // Shot labels fade
      for (const id of ["#lblArc", "#lblDolly", "#lblCrane", "#lblBack"]) {
        const el = document.querySelector(id);
        const s = parseFloat(el.dataset.start);
        const dur = parseFloat(el.dataset.duration);
        tl.from(id, { opacity: 0, x: -14, duration: 0.6, ease: "power2.out" }, s + 0.1);
        tl.to(id, { opacity: 0, duration: 0.5, ease: "power2.in" }, s + dur - 0.55);
      }

      // --- Camera choreography ---
      // 0-5s: hold frontal, drift slightly left to start the arc
      tl.to(rig, { x: -1.15, y: 0.12, z: -0.25, duration: 5 }, 0);
      // 5-13s: side arc, left → right, gently closing in
      tl.to(rig, { x: 1.05, y: 0.22, z: -0.55, duration: 8 }, 5);
      // 13-19s: dolly in toward harp / cello centre
      tl.to(rig, { x: 0.35, y: 0.05, z: -2.1, duration: 6 }, 13);
      tl.to(rig, { tx: target0.x + 0.3, ty: target0.y + 0.1, duration: 6 }, 13);
      // 19-25s: crane up to a high, wide view
      tl.to(rig, { x: -0.55, y: 1.7, z: -0.7, duration: 6 }, 19);
      tl.to(rig, { ty: target0.y - 0.4, duration: 6 }, 19);
      // 25-30s: settle back to the original frontal framing
      tl.to(rig, { x: 0, y: 0, z: 0, tx: target0.x, ty: target0.y, duration: 5, ease: "power2.inOut" }, 25);

      window.__timelines["main"] = tl;
      render();
    </script>
  </body>
</html>
