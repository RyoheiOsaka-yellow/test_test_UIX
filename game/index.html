<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ハブボウリング 🐍🎳</title>
<style>
  :root{
    --lane:#e8c98a;
    --lane2:#d9b66f;
    --wood-line:#c79f57;
    --ink:#2b2b2b;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    background:radial-gradient(circle at 50% 0%, #2a6b4f 0%, #14342a 70%);
    color:#fff;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100%;
    user-select:none;
  }
  h1{ font-size:20px; margin:10px 0 4px; letter-spacing:1px; text-shadow:0 2px 0 #0006; }
  #wrap{ position:relative; }
  canvas{
    background:#14342a;
    border-radius:14px;
    box-shadow:0 12px 40px #0009, inset 0 0 0 2px #ffffff20;
    touch-action:none;
  }
  #hud{
    width:100%; max-width:480px; margin:8px auto 0;
    display:flex; flex-direction:column; gap:6px; padding:0 8px;
  }
  #scoreboard{
    display:flex; gap:2px; background:#0e241d; border-radius:8px; padding:4px;
    overflow-x:auto; font-variant-numeric:tabular-nums;
  }
  .frame{
    flex:1 0 auto; min-width:34px; text-align:center;
    border:1px solid #ffffff22; border-radius:5px; background:#14342a;
  }
  .frame.cur{ background:#2a6b4f; box-shadow:0 0 0 2px #7be0a8; }
  .frame .fno{ font-size:9px; color:#9fd9bd; padding:1px 0; }
  .frame .rolls{ display:flex; height:16px; }
  .frame .rolls span{ flex:1; font-size:11px; line-height:16px; border-left:1px solid #ffffff15; }
  .frame .rolls span:first-child{ border-left:none; }
  .frame.tenth{ min-width:50px; }
  .frame .total{ font-size:13px; font-weight:700; padding:2px 0; min-height:18px; }
  #msg{
    text-align:center; font-size:15px; min-height:22px; font-weight:700;
    text-shadow:0 2px 0 #0007;
  }
  #controls{ display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; }
  button{
    background:#7be0a8; color:#06291c; border:none; border-radius:999px;
    padding:9px 16px; font-size:14px; font-weight:800; cursor:pointer;
    box-shadow:0 3px 0 #3aa472; transition:transform .05s;
  }
  button:active{ transform:translateY(2px); box-shadow:0 1px 0 #3aa472; }
  .hint{ font-size:11px; color:#bfe8d4; text-align:center; line-height:1.5; max-width:480px; padding:0 10px 16px; }
  .badge{ background:#ffffff22; padding:2px 8px; border-radius:999px; font-size:12px; }
</style>
</head>
<body>
  <h1>🐍 ハブボウリング 🎳</h1>
  <div id="wrap">
    <canvas id="cv"></canvas>
  </div>
  <div id="hud">
    <div id="scoreboard"></div>
    <div id="msg">マングースをスワイプして転がそう！</div>
    <div id="controls">
      <span class="badge" id="ballInfo">投目: 1</span>
      <button id="resetBtn">最初から</button>
    </div>
  </div>
  <p class="hint">
    🖱️ マングース（茶色の玉）を<b>後ろにドラッグ→指を離す</b>と発射。引っぱる距離が強さ、向きで狙いを調整。<br>
    1フレーム2投。全部倒すとストライク✨、2投で全部ならスペア。全10フレームの合計スコアを競おう！
  </p>

<script>
(()=>{
  "use strict";

  // ---------- キャンバス設定 ----------
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 420, H = 620;          // 論理サイズ
  const DPR = Math.min(window.devicePixelRatio||1, 2);
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = Math.min(W, window.innerWidth-16)+'px';
  cv.style.height = (Math.min(W, window.innerWidth-16) * H/W)+'px';
  ctx.scale(DPR,DPR);

  // ---------- レーン定義 ----------
  const LANE = { x:60, w:300, top:40, foul:540 };  // foul=ファウルライン(発射位置のy)
  const GUTTER = 18;

  // ---------- 物理パラメータ ----------
  const FRICTION = 0.992;     // 転がり摩擦
  const PIN_FRICTION = 0.96;
  const REST = 0.55;          // 反発
  const STOP_SPEED = 0.18;    // これ以下で停止扱い
  const BALL_R = 15;
  const PIN_R = 13;

  // ---------- 状態 ----------
  const STATE = { AIM:'aim', ROLL:'roll', SETTLE:'settle', OVER:'over' };
  let state = STATE.AIM;

  let ball = null;       // {x,y,vx,vy,r}
  let pins = [];         // 立っているハブ
  let fallen = [];       // 倒れたハブ(演出用)
  let aim = null;        // ドラッグ中の照準 {sx,sy,cx,cy}

  // ---------- スコア管理 ----------
  // bowling: 10フレーム。各フレームのロールを配列で保持
  let frames = [];       // [[r1,r2], ...]  10thは最大3
  let curFrame = 0;
  let rollInFrame = 0;   // 現フレームでの投目(0/1/2)
  let pinsAtRollStart = 10;

  function pinTriangle(){
    // 標準ボウリング配置(10本) 先頭が奥
    const cx = LANE.x + LANE.w/2;
    const startY = LANE.top + 60;
    const dx = 30, dy = 30;
    const arr = [];
    for(let row=0; row<4; row++){
      for(let i=0;i<=row;i++){
        const x = cx + (i - row/2)*dx;
        const y = startY + row*dy;
        arr.push({ x, y, vx:0, vy:0, r:PIN_R, down:false, wob:Math.random()*6.28 });
      }
    }
    return arr; // 10本
  }

  function newRack(){
    pins = pinTriangle();
    fallen = [];
  }

  function placeBall(){
    ball = { x: LANE.x+LANE.w/2, y: LANE.foul, vx:0, vy:0, r:BALL_R };
  }

  function resetGame(){
    frames = []; for(let i=0;i<10;i++) frames.push([]);
    curFrame = 0; rollInFrame = 0; pinsAtRollStart = 10;
    newRack(); placeBall();
    state = STATE.AIM;
    setMsg("マングースをスワイプして転がそう！");
    renderScoreboard();
    updateBallInfo();
  }

  // ---------- 入力(ドラッグ発射) ----------
  function canvasPos(e){
    const r = cv.getBoundingClientRect();
    const t = e.touches? e.touches[0] : e;
    return {
      x:(t.clientX - r.left) * (W/r.width),
      y:(t.clientY - r.top) * (H/r.height)
    };
  }
  function pointerDown(e){
    if(state!==STATE.AIM || !ball) return;
    const p = canvasPos(e);
    // ボール近辺を掴んだら照準開始
    if(Math.hypot(p.x-ball.x, p.y-ball.y) < 90){
      aim = { sx:ball.x, sy:ball.y, cx:p.x, cy:p.y };
      e.preventDefault();
    }
  }
  function pointerMove(e){
    if(!aim) return;
    const p = canvasPos(e);
    aim.cx = p.x; aim.cy = p.y;
    e.preventDefault();
  }
  function pointerUp(e){
    if(!aim) return;
    // 引っぱった逆方向に発射
    let dx = ball.x - aim.cx;
    let dy = ball.y - aim.cy;
    const dist = Math.hypot(dx,dy);
    aim = null;
    if(dist < 12){ return; } // ほぼ動かさなければキャンセル
    const power = Math.min(dist, 150) / 150;   // 0..1
    const speed = 6 + power*14;                // 速度
    const inv = 1/dist;
    ball.vx = dx*inv*speed;
    ball.vy = dy*inv*speed;
    // 上方向(奥)へ投げる時のみ有効。横/手前方向は弱める補正
    if(ball.vy > -1){ ball.vy = -2; }          // 最低限前へ
    state = STATE.ROLL;
    pinsAtRollStart = pins.length;
    setMsg("ゴロゴロ…");
    e.preventDefault();
  }
  cv.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);
  cv.addEventListener('touchstart', pointerDown, {passive:false});
  window.addEventListener('touchmove', pointerMove, {passive:false});
  window.addEventListener('touchend', pointerUp, {passive:false});

  // ---------- 物理 ----------
  function circleCollide(a, b){
    const dx = b.x-a.x, dy = b.y-a.y;
    const d = Math.hypot(dx,dy);
    const min = a.r + b.r;
    if(d>0 && d<min){
      const nx = dx/d, ny = dy/d;
      const overlap = min - d;
      // 押し戻し
      a.x -= nx*overlap/2; a.y -= ny*overlap/2;
      b.x += nx*overlap/2; b.y += ny*overlap/2;
      // 相対速度
      const rvx = b.vx-a.vx, rvy = b.vy-a.vy;
      const vn = rvx*nx + rvy*ny;
      if(vn < 0){
        const imp = -(1+REST)*vn/2;
        a.vx -= imp*nx; a.vy -= imp*ny;
        b.vx += imp*nx; b.vy += imp*ny;
      }
      return true;
    }
    return false;
  }

  function step(){
    if(state!==STATE.ROLL && state!==STATE.SETTLE) return;

    // ボール移動
    if(ball){
      ball.x += ball.vx; ball.y += ball.vy;
      ball.vx *= FRICTION; ball.vy *= FRICTION;

      // ガター(レーン外)…端で減速して止まる
      if(ball.x < LANE.x+GUTTER){ ball.x = LANE.x+GUTTER; ball.vx = Math.abs(ball.vx)*0.2; ball.vy*=0.9; }
      if(ball.x > LANE.x+LANE.w-GUTTER){ ball.x = LANE.x+LANE.w-GUTTER; ball.vx = -Math.abs(ball.vx)*0.2; ball.vy*=0.9; }
    }

    // ボール↔ピン
    for(const p of pins){
      if(circleCollide(ball, p)){}
    }
    // ピン↔ピン
    for(let i=0;i<pins.length;i++){
      for(let j=i+1;j<pins.length;j++){
        circleCollide(pins[i], pins[j]);
      }
    }

    // ピン更新 + 倒れ判定
    for(let i=pins.length-1;i>=0;i--){
      const p = pins[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= PIN_FRICTION; p.vy *= PIN_FRICTION;
      const sp = Math.hypot(p.vx,p.vy);
      // 一定速度を超えて動いたら「倒れた」とみなす
      if(sp > 1.4 || p.knocked){
        p.knocked = true;
      }
      // レーン外へ出る or ノックされて十分移動したら退場
      const outX = p.x < LANE.x+6 || p.x > LANE.x+LANE.w-6;
      const outY = p.y < LANE.top-10 || p.y > LANE.foul+40;
      if(p.knocked && (sp < 0.6 || outX || outY)){
        p.down = true;
        p.fallT = 0;
        fallen.push(p);
        pins.splice(i,1);
      }
    }

    // 倒れ演出
    for(const f of fallen){ f.fallT = Math.min(1, (f.fallT||0)+0.08); f.x+=f.vx; f.y+=f.vy; f.vx*=0.9; f.vy*=0.9; }

    // 停止判定
    if(state===STATE.ROLL){
      const ballStopped = ball && Math.hypot(ball.vx,ball.vy) < STOP_SPEED;
      const ballGone = ball && (ball.y < LANE.top-30 || ball.y > LANE.foul+50);
      const pinsCalm = pins.every(p=>Math.hypot(p.vx,p.vy) < STOP_SPEED);
      if((ballStopped || ballGone) && pinsCalm){
        state = STATE.SETTLE;
        settleTimer = 0;
      }
    } else if(state===STATE.SETTLE){
      settleTimer++;
      const pinsCalm = pins.every(p=>Math.hypot(p.vx,p.vy) < STOP_SPEED);
      if(settleTimer>18 && pinsCalm){
        endRoll();
      }
    }
  }
  let settleTimer = 0;

  // ---------- ロール終了 → スコア処理 ----------
  function endRoll(){
    const knocked = pinsAtRollStart - pins.length;  // この投で倒した本数
    const f = frames[curFrame];
    f.push(knocked);

    const isTenth = curFrame===9;

    if(!isTenth){
      const strike = (rollInFrame===0 && knocked===10);
      if(strike || rollInFrame===1){
        // フレーム終了 → 次フレーム
        advanceFrame();
      } else {
        // 2投目へ。倒れたピンはそのまま（残ピンで続行）
        rollInFrame = 1;
        placeBall();
        state = STATE.AIM;
        showRollResult(knocked, false);
      }
    } else {
      // 10フレーム目: 最大3投
      handleTenth();
    }
    renderScoreboard();
    updateBallInfo();
  }

  function advanceFrame(){
    // 演出メッセージ
    const f = frames[curFrame];
    const sum = f.reduce((a,b)=>a+b,0);
    if(f[0]===10) setMsg("🎉 ストライク！！");
    else if(sum===10) setMsg("✨ スペア！");
    else setMsg(`${sum}本 たおした`);

    curFrame++;
    rollInFrame = 0;
    if(curFrame>=10){
      finishGame();
      return;
    }
    newRack();
    placeBall();
    state = STATE.AIM;
  }

  function handleTenth(){
    const f = frames[9];
    const total = f.length;
    const lastKnocked = f[f.length-1];

    // 投ごとにピンが全部倒れたら新しいラックを置く(ボーナス投のため)
    let bonusContinue = false;
    if(total===1){
      if(f[0]===10){ // ストライク → あと2投
        bonusContinue = true; newRack();
      } else {
        bonusContinue = true; // 2投目（残ピン続行）
      }
    } else if(total===2){
      const s = f[0]+f[1];
      if(f[0]===10){ // 1投目ストライク
        if(f[1]===10){ newRack(); }   // 2投目もストライク → ラック再set
        bonusContinue = true;          // 3投目あり
      } else if(s===10){               // スペア → ボーナス1投
        newRack(); bonusContinue = true;
      } else {
        bonusContinue = false;         // オープン → 終了
      }
    } else {
      bonusContinue = false;           // 3投終了
    }

    if(bonusContinue){
      rollInFrame = f.length;
      placeBall();
      state = STATE.AIM;
      showRollResult(lastKnocked, true);
    } else {
      finishGame();
    }
  }

  function showRollResult(knocked, tenth){
    if(knocked===10) setMsg(tenth? "🎉 ストライク！もう一投！" : "🎉 ストライク級！");
    else if(knocked===0) setMsg("ガーン…ガター？ もう一投！");
    else setMsg(`${knocked}本！ 残りを狙え`);
  }

  function finishGame(){
    state = STATE.OVER;
    const total = computeTotals().total;
    setMsg(`ゲーム終了！ 合計 ${total} 点 🏆`);
    ball = null;
    renderScoreboard();
    updateBallInfo();
  }

  // ---------- ボウリング得点計算 ----------
  // framesをフラットなロール列にして標準ルールで集計
  function computeTotals(){
    const f = frames;
    const cum = new Array(10).fill(null);
    // ロール列を作る（10フレ目は最大3）
    const rolls = [];
    const frameStartIdx = [];
    for(let i=0;i<10;i++){
      frameStartIdx[i]=rolls.length;
      for(const r of f[i]) rolls.push(r);
    }
    let total=0;
    let idx=0;
    for(let i=0;i<10;i++){
      const fr = f[i];
      if(fr.length===0){ break; }
      if(i<9){
        if(fr[0]===10){ // ストライク
          const b1 = rolls[idx+1], b2 = rolls[idx+2];
          if(b1==null || b2==null){ cum[i]=null; break; }
          total += 10 + b1 + b2;
          cum[i]=total; idx+=1;
        } else if((fr[0]+(fr[1]||0))===10 && fr.length>=2){ // スペア
          const b1 = rolls[idx+2];
          if(b1==null){ cum[i]=null; break; }
          total += 10 + b1;
          cum[i]=total; idx+=2;
        } else {
          if(fr.length<2){ cum[i]=null; break; }
          total += fr[0]+fr[1];
          cum[i]=total; idx+=2;
        }
      } else {
        // 10フレ目はそのまま合計
        total += fr.reduce((a,b)=>a+b,0);
        cum[i]=total; idx+=fr.length;
      }
    }
    return { cum, total };
  }

  // ---------- スコアボード描画 ----------
  const scoreboard = document.getElementById('scoreboard');
  function rollSymbol(fr, i, isTenth){
    const v = fr[i];
    if(v==null) return "";
    if(isTenth){
      if(v===10) return "X";
      if(i>0 && (fr[i-1]+v===10) && fr[i-1]!==10) return "/";
      if(v===0) return "-";
      return String(v);
    }
    if(i===0 && v===10) return "X";
    if(i===1 && (fr[0]+v===10)) return "/";
    if(v===0) return "-";
    return String(v);
  }
  function renderScoreboard(){
    const { cum } = computeTotals();
    scoreboard.innerHTML="";
    for(let i=0;i<10;i++){
      const fr = frames[i];
      const tenth = i===9;
      const div = document.createElement('div');
      div.className = 'frame'+(tenth?' tenth':'')+(i===curFrame && state!==STATE.OVER?' cur':'');
      const slots = tenth?3:2;
      let rollsHtml='';
      for(let r=0;r<slots;r++){
        rollsHtml += `<span>${rollSymbol(fr,r,tenth)}</span>`;
      }
      div.innerHTML = `<div class="fno">${i+1}</div><div class="rolls">${rollsHtml}</div><div class="total">${cum[i]!=null?cum[i]:''}</div>`;
      scoreboard.appendChild(div);
    }
  }

  function updateBallInfo(){
    const el = document.getElementById('ballInfo');
    if(state===STATE.OVER){ el.textContent="終了"; return; }
    el.textContent = `第${curFrame+1}フレーム / ${rollInFrame+1}投目`;
  }

  // ---------- 描画 ----------
  function drawLane(){
    // レーン本体
    const g = ctx.createLinearGradient(0,LANE.top,0,LANE.foul);
    g.addColorStop(0,'#e8c98a'); g.addColorStop(1,'#d9b66f');
    ctx.fillStyle=g;
    ctx.fillRect(LANE.x, LANE.top, LANE.w, LANE.foul-LANE.top+30);
    // 板目
    ctx.strokeStyle='#c79f57'; ctx.lineWidth=1;
    for(let i=1;i<10;i++){
      const x = LANE.x + LANE.w*i/10;
      ctx.beginPath(); ctx.moveTo(x,LANE.top); ctx.lineTo(x,LANE.foul+30); ctx.stroke();
    }
    // ガター
    ctx.fillStyle='#5a4a2a';
    ctx.fillRect(LANE.x, LANE.top, GUTTER, LANE.foul-LANE.top+30);
    ctx.fillRect(LANE.x+LANE.w-GUTTER, LANE.top, GUTTER, LANE.foul-LANE.top+30);
    // ピンデッキ(奥)
    ctx.fillStyle='#0e241d';
    ctx.fillRect(LANE.x, 0, LANE.w, LANE.top);
    // ファウルライン
    ctx.strokeStyle='#b5402f'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(LANE.x,LANE.foul); ctx.lineTo(LANE.x+LANE.w,LANE.foul); ctx.stroke();
    // 案内のドット(スパット)
    ctx.fillStyle='#8a6d2f';
    for(let i=0;i<5;i++){
      const x = LANE.x+LANE.w*(0.25+i*0.125);
      ctx.beginPath(); ctx.arc(x, LANE.foul-90, 3, 0, 6.28); ctx.fill();
    }
  }

  function drawHabu(p, isFallen){
    ctx.save();
    ctx.translate(p.x, p.y);
    if(isFallen){
      ctx.globalAlpha = 1 - p.fallT*0.65;
      ctx.rotate(p.fallT*1.4);
      ctx.scale(1, 1 - p.fallT*0.4);
    } else {
      const t = performance.now()/300 + p.wob;
      ctx.rotate(Math.sin(t)*0.05);
    }
    // とぐろを巻いたハブ
    ctx.fillStyle = isFallen? '#7a8c5a' : '#9bbf5e';
    ctx.beginPath(); ctx.arc(0,0,p.r, 0, 6.28); ctx.fill();
    // 模様
    ctx.strokeStyle='#5f7a32'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,p.r*0.6, 0.4, 5.6); ctx.stroke();
    // 顔
    ctx.fillStyle='#2b2b2b';
    ctx.beginPath(); ctx.arc(-4,-4,2,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-4,2,0,6.28); ctx.fill();
    // 舌
    ctx.strokeStyle='#e2433a'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,2); ctx.lineTo(0,8); ctx.stroke();
    ctx.restore();
  }

  function drawMongoose(b){
    ctx.save();
    ctx.translate(b.x,b.y);
    const ang = Math.atan2(b.vy,b.vx);
    if(Math.hypot(b.vx,b.vy)>0.5) ctx.rotate(ang+Math.PI/2);
    // 体(茶色の玉)
    const g = ctx.createRadialGradient(-4,-4,2,0,0,b.r);
    g.addColorStop(0,'#caa472'); g.addColorStop(1,'#8a5a2b');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(0,0,b.r,0,6.28); ctx.fill();
    // 耳
    ctx.fillStyle='#7a4d24';
    ctx.beginPath(); ctx.arc(-7,-9,4,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-9,4,0,6.28); ctx.fill();
    // 目
    ctx.fillStyle='#1c1c1c';
    ctx.beginPath(); ctx.arc(-5,-3,2.2,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-3,2.2,0,6.28); ctx.fill();
    // 鼻
    ctx.fillStyle='#3a2412';
    ctx.beginPath(); ctx.arc(0,3,2.5,0,6.28); ctx.fill();
    ctx.restore();
  }

  function drawAim(){
    if(!aim || !ball) return;
    let dx = ball.x - aim.cx;
    let dy = ball.y - aim.cy;
    const dist = Math.min(Math.hypot(dx,dy),150);
    if(dist<6) return;
    const ang = Math.atan2(dy,dx);
    const power = dist/150;
    // 予測線
    ctx.save();
    ctx.setLineDash([6,8]);
    ctx.strokeStyle=`rgba(255,255,255,${0.4+power*0.5})`;
    ctx.lineWidth=2+power*3;
    ctx.beginPath();
    ctx.moveTo(ball.x,ball.y);
    ctx.lineTo(ball.x+Math.cos(ang)*dist*2.2, ball.y+Math.sin(ang)*dist*2.2);
    ctx.stroke();
    ctx.setLineDash([]);
    // 引っぱりハンドル
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(aim.cx,aim.cy,6,0,6.28); ctx.fill();
    // パワーメーター
    ctx.fillStyle='#0008'; ctx.fillRect(LANE.x, LANE.foul+8, LANE.w, 8);
    ctx.fillStyle = power<0.6?'#7be0a8':(power<0.85?'#ffcf5c':'#ff6b5c');
    ctx.fillRect(LANE.x, LANE.foul+8, LANE.w*power, 8);
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    drawLane();
    for(const f of fallen) drawHabu(f,true);
    for(const p of pins) drawHabu(p,false);
    if(ball) drawMongoose(ball);
    if(state===STATE.AIM) drawAim();
  }

  // ---------- メッセージ ----------
  const msgEl = document.getElementById('msg');
  function setMsg(t){ msgEl.textContent=t; }

  // ---------- ループ ----------
  function loop(){
    step();
    draw();
    requestAnimationFrame(loop);
  }

  document.getElementById('resetBtn').addEventListener('click', resetGame);

  resetGame();
  loop();
})();
</script>
</body>
</html>
