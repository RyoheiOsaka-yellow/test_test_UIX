<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lineworld — a dog, a lantern, a forest of lines</title>
<meta name="description" content="A dog searching for its owner in a forest made of lines. The world only exists where your lantern reaches." />
<style>
  :root {
    --ink: rgba(236, 240, 244, 0.88);
    --dim: rgba(236, 240, 244, 0.40);
    --warm: rgba(255, 206, 138, 0.92);
    --font: ui-sans-serif, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  canvas { display: block; touch-action: none; }

  #app { position: fixed; inset: 0; }

  /* --- overlays ------------------------------------------------------- */
  #vignette, #grain, #ui, #fade {
    position: fixed; inset: 0; pointer-events: none;
  }
  #vignette {
    background:
      radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.88) 100%);
  }
  #grain { opacity: 0.05; mix-blend-mode: screen; background-repeat: repeat; animation: drift 0.7s steps(3) infinite; }
  @keyframes drift {
    0%   { transform: translate(0, 0); }
    33%  { transform: translate(-2%, 1%); }
    66%  { transform: translate(1%, -2%); }
    100% { transform: translate(0, 0); }
  }
  #fade { background: #000; opacity: 1; transition: opacity 1.6s ease; z-index: 40; }

  /* --- hud ------------------------------------------------------------ */
  #ui { z-index: 20; }
  .label {
    font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--dim); font-weight: 400;
  }
  #objective {
    position: absolute; top: 22px; left: 26px;
    max-width: 40ch; line-height: 1.7;
    opacity: 0; transition: opacity 0.9s ease;
  }
  #objective.on { opacity: 1; }
  #dots { position: absolute; top: 22px; right: 26px; display: flex; gap: 8px; align-items: center; }
  #dots .d {
    width: 7px; height: 7px; border: 1px solid rgba(236,240,244,0.35);
    transform: rotate(45deg); transition: all 0.6s ease;
  }
  #dots .d.on { background: var(--warm); border-color: var(--warm); box-shadow: 0 0 10px rgba(255,206,138,0.7); }

  #subtitle {
    position: absolute; left: 50%; bottom: 30vh; transform: translateX(-50%);
    text-align: center; width: min(560px, 62vw);
    font-size: clamp(14px, 1.55vw, 19px); font-weight: 300; line-height: 1.9;
    letter-spacing: 0.06em; text-shadow: 0 0 24px rgba(0,0,0,0.9);
    opacity: 0; transition: opacity 1.1s ease;
  }
  #subtitle.on { opacity: 1; }

  #prompt {
    position: absolute; left: 50%; bottom: 24vh; transform: translateX(-50%);
    text-align: center; opacity: 0; transition: opacity 0.35s ease;
  }
  #prompt.on { opacity: 1; }
  #prompt .key {
    display: inline-block; padding: 3px 9px; margin: 0 3px;
    border: 1px solid rgba(236,240,244,0.45); color: var(--ink);
    font-size: 11px; letter-spacing: 0.18em;
  }
  #meter {
    position: absolute; left: 50%; bottom: 21vh; transform: translateX(-50%);
    width: 168px; height: 2px; background: rgba(255,255,255,0.14);
    opacity: 0; transition: opacity 0.25s ease;
  }
  #meter.on { opacity: 1; }
  #meter i { display: block; height: 100%; width: 0%; background: var(--warm); box-shadow: 0 0 12px var(--warm); }

  /* --- on-screen controls --------------------------------------------- */
  #pad {
    position: fixed; inset: 0; z-index: 26; pointer-events: none;
    opacity: 0; transition: opacity 1.2s ease;
  }
  #pad.on { opacity: 1; }
  #pad button {
    pointer-events: auto; cursor: pointer;
    background: rgba(8, 12, 16, 0.55);
    border: 1px solid rgba(236, 240, 244, 0.28);
    color: var(--ink); font-family: var(--font);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; padding: 0; line-height: 1;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.08s ease;
    -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none;
  }
  #pad button i {
    font-style: normal; font-size: 9px; letter-spacing: 0.14em;
    color: rgba(236, 240, 244, 0.34);
  }
  #pad button b { font-weight: 400; }
  #pad button.hot {
    border-color: var(--warm); background: rgba(255, 206, 138, 0.16);
    transform: scale(0.96);
  }
  #pad button.hot b, #pad button.hot i, #pad button.hot .ar { color: var(--warm); }
  #pad button.cue { animation: cuepulse 1.3s ease-in-out infinite; border-color: rgba(255, 206, 138, 0.7); }
  @keyframes cuepulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 206, 138, 0); }
    50% { box-shadow: 0 0 0 6px rgba(255, 206, 138, 0.16); border-color: var(--warm); }
  }

  #dpad {
    position: absolute; left: 26px; bottom: 26px;
    display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px);
    gap: 5px;
  }
  #dpad button { border-radius: 4px; }
  #dpad .ar { font-size: 17px; color: rgba(236, 240, 244, 0.85); }
  #dpad .up { grid-area: 1 / 2; }
  #dpad .left { grid-area: 2 / 1; }
  #dpad .down { grid-area: 2 / 2; }
  #dpad .right { grid-area: 2 / 3; }
  #dpad .runbtn { grid-area: 3 / 1 / 4 / 4; height: 44px; flex-direction: row; gap: 8px; }
  #dpad .runbtn b { font-size: 12px; letter-spacing: 0.12em; }

  #acts {
    position: absolute; right: 26px; bottom: 26px;
    display: grid; grid-template-columns: repeat(2, 92px); gap: 8px;
  }
  #acts button { height: 62px; border-radius: 4px; }
  #acts button b { font-size: 13px; letter-spacing: 0.1em; }
  #acts .wide { grid-column: 1 / 3; height: 50px; flex-direction: row; gap: 9px; }
  body.playing #credit { opacity: 0; transition: opacity 1s ease; }
  #padhint {
    position: absolute; right: 26px; bottom: 172px; text-align: right;
    font-size: 10px; letter-spacing: 0.16em; color: rgba(236, 240, 244, 0.3);
    text-transform: uppercase;
  }

  @media (max-width: 780px), (max-height: 620px) {
    #dpad { left: 14px; bottom: 14px; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); }
    #acts { right: 14px; bottom: 14px; grid-template-columns: repeat(2, 78px); gap: 6px; }
    #acts button { height: 54px; }
    #acts button b { font-size: 12px; }
    #padhint { display: none; }
  }

  /* --- title ---------------------------------------------------------- */
  #title {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 50%, rgba(10,14,18,0.86), rgba(0,0,0,0.97));
    transition: opacity 1.4s ease; text-align: center; padding: 24px;
  }
  #title.gone { opacity: 0; pointer-events: none; }
  #title h1 {
    margin: 0; font-size: clamp(34px, 8vw, 82px); font-weight: 200;
    letter-spacing: 0.42em; text-indent: 0.42em;
  }
  #title .tag {
    margin-top: 22px; max-width: 46ch; font-size: 13px; font-weight: 300;
    line-height: 2.1; color: var(--dim); letter-spacing: 0.08em;
  }
  #controls {
    margin-top: 44px; display: grid; grid-template-columns: auto auto; gap: 9px 20px;
    font-size: 11px; letter-spacing: 0.16em; color: var(--dim); text-transform: uppercase;
  }
  #controls b { font-weight: 400; color: var(--ink); }
  #start {
    margin-top: 46px; padding: 13px 34px; background: none; cursor: pointer;
    border: 1px solid rgba(236,240,244,0.4); color: var(--ink);
    font-family: var(--font); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    transition: all 0.4s ease;
  }
  #start:hover { border-color: var(--warm); color: var(--warm); box-shadow: 0 0 30px rgba(255,206,138,0.18); }
  #lang {
    position: fixed; top: 20px; right: 26px; z-index: 60;
    background: none; border: 1px solid rgba(236,240,244,0.28); color: var(--dim);
    font-family: var(--font); font-size: 10px; letter-spacing: 0.2em; padding: 5px 10px;
    cursor: pointer;
  }
  #lang:hover { color: var(--ink); border-color: var(--ink); }
  #credit { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 60; }
  #credit a { color: var(--dim); text-decoration: none; }
  #credit a:hover { color: var(--ink); }

  @media (max-width: 640px) {
    #objective { font-size: 10px; max-width: 26ch; top: 16px; left: 16px; }
    #dots { top: 16px; right: 16px; }
    #lang { top: 14px; right: 14px; }
    #subtitle { bottom: 34vh; width: 82vw; }
    #prompt { bottom: 28vh; }
    #meter { bottom: 25vh; }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="vignette"></div>
  <div id="grain"></div>

  <div id="ui">
    <div id="objective" class="label"></div>
    <div id="dots"></div>
    <div id="subtitle"></div>
    <div id="prompt" class="label"></div>
    <div id="meter"><i></i></div>
  </div>

  <div id="pad">
    <div id="dpad">
      <button class="up" data-hold="w" data-id="up"><span class="ar">&#9650;</span><i>W</i></button>
      <button class="left" data-hold="a" data-id="left"><span class="ar">&#9664;</span><i>A</i></button>
      <button class="down" data-hold="s" data-id="down"><span class="ar">&#9660;</span><i>S</i></button>
      <button class="right" data-hold="d" data-id="right"><span class="ar">&#9654;</span><i>D</i></button>
      <button class="runbtn" data-hold="shift" data-id="run"><b data-label="ctl_run"></b><i>SHIFT</i></button>
    </div>
    <div id="padhint" data-label="hint_cam"></div>
    <div id="acts">
      <button data-hold="q" data-id="sniff"><b data-label="ctl_sniff"></b><i>Q</i></button>
      <button data-hold="e" data-id="dig"><b data-label="ctl_dig"></b><i>E</i></button>
      <button data-tap="f" data-id="bark"><b data-label="ctl_bark"></b><i>F</i></button>
      <button data-tap=" " data-id="jump"><b data-label="ctl_jump"></b><i>SPACE</i></button>
    </div>
  </div>

  <div id="fade"></div>

  <div id="title">
    <h1>LINEWORLD</h1>
    <div class="tag" data-i18n="tagline"></div>
    <div id="controls"></div>
    <button id="start">BEGIN</button>
  </div>

  <button id="lang">日本語</button>
  <div id="credit" class="label"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.min.js"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
