<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>テスト用 QR コード</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; margin: 0;
    background: #f5f7fb;
    gap: 18px;
    padding: 24px;
    color: #1d2330;
  }
  h1 { font-size: 18px; font-weight: 700; }
  #qr {
    background: #fff;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(20, 33, 61, 0.08);
    display: inline-flex;
    align-items: center; justify-content: center;
  }
  #qr canvas, #qr img { display: block; }
  p { color: #4a5568; font-size: 14px; text-align: center; max-width: 360px; line-height: 1.7; margin: 0; }
  a { color: #4c8bf5; text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  .text { font-size: 12px; color: #8b97ad; }
</style>
</head>
<body>
  <h1>テスト用 QR コード</h1>
  <div id="qr"></div>
  <p>この QR コードをカメラで読み取ると、3D のビルが現れます。<br>別端末で表示するか、印刷してテストしてください。</p>
  <p class="text">エンコード内容: <code>AR-BUILDING-DEMO</code></p>
  <p><a href="index.html">← AR ページに戻る</a></p>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    const canvas = document.createElement('canvas');
    document.getElementById('qr').appendChild(canvas);
    QRCode.toCanvas(
      canvas,
      'AR-BUILDING-DEMO',
      { width: 320, margin: 2, errorCorrectionLevel: 'M' },
      function (err) { if (err) console.error(err); }
    );
  </script>
</body>
</html>
