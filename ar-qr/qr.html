<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AR ページ用 QR コード生成</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex; flex-direction: column;
    align-items: center;
    min-height: 100vh; margin: 0;
    background: #f5f7fb;
    padding: 32px 20px;
    color: #1d2330;
    gap: 18px;
  }
  h1 { font-size: 20px; font-weight: 700; }
  .panel {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(20, 33, 61, 0.08);
    padding: 22px;
    width: 100%; max-width: 460px;
    display: flex; flex-direction: column;
    gap: 14px;
  }
  label { font-size: 13px; font-weight: 600; color: #2b3340; }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d3dae6;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: #4c8bf5; }
  .helper { font-size: 12px; color: #6b7785; line-height: 1.6; }
  .row {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  button {
    padding: 10px 16px;
    border: none;
    background: #4c8bf5;
    color: #fff;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button.secondary {
    background: #eef1f6; color: #2b3340;
  }
  button:hover { opacity: 0.92; }
  #qrWrap {
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(20, 33, 61, 0.08);
    min-height: 360px;
    width: 100%;
    max-width: 460px;
  }
  #qrWrap canvas { display: block; max-width: 100%; height: auto; }
  .encoded {
    font-size: 11px;
    color: #6b7785;
    word-break: break-all;
    text-align: center;
    line-height: 1.6;
    background: #fff;
    border-radius: 10px;
    padding: 10px 14px;
    width: 100%; max-width: 460px;
  }
  .footer-link {
    margin-top: 8px;
    font-size: 14px;
  }
  .footer-link a { color: #4c8bf5; text-decoration: none; font-weight: 600; }
  .footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>AR ページ用 QR コード生成</h1>

  <div class="panel">
    <label for="urlInput">QR にする URL</label>
    <input type="text" id="urlInput" placeholder="https://example.com/ar-qr/index.html" />
    <div class="helper">
      この URL を QR に埋め込みます。スマホ標準カメラで読み取ると、ここで指定した
      ページ（＝ AR ページ）がブラウザで開き、AR ビルが立ち上がります。
    </div>
    <div class="row">
      <button id="copyBtn" type="button" class="secondary">URLをコピー</button>
      <button id="downloadBtn" type="button">PNG をダウンロード</button>
    </div>
  </div>

  <div id="qrWrap"></div>
  <div class="encoded" id="encoded">エンコード内容: -</div>

  <div class="footer-link">
    <a href="index.html">→ AR ページを開く</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    const urlInput   = document.getElementById('urlInput');
    const qrWrap     = document.getElementById('qrWrap');
    const encoded    = document.getElementById('encoded');
    const copyBtn    = document.getElementById('copyBtn');
    const downloadBtn= document.getElementById('downloadBtn');

    // Default URL: current page's path with qr.html replaced by index.html.
    function defaultUrl() {
      const href = window.location.href;
      // If served at .../qr.html → replace with index.html
      if (href.endsWith('/qr.html')) return href.replace(/\/qr\.html$/, '/index.html');
      if (href.endsWith('qr.html'))  return href.replace(/qr\.html$/, 'index.html');
      // If served at .../ → append index.html
      if (href.endsWith('/')) return href + 'index.html';
      return href.replace(/\/[^/]*$/, '/index.html');
    }

    urlInput.value = defaultUrl();

    let renderTimer = null;
    function renderQR() {
      const text = urlInput.value.trim() || ' ';
      qrWrap.innerHTML = '';
      const canvas = document.createElement('canvas');
      qrWrap.appendChild(canvas);
      QRCode.toCanvas(canvas, text, {
        width: 360,
        margin: 2,
        errorCorrectionLevel: 'M',
      }, function (err) {
        if (err) { console.error(err); encoded.textContent = 'エラー: ' + err.message; return; }
        encoded.textContent = 'エンコード内容: ' + text;
      });
    }

    function scheduleRender() {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(renderQR, 120);
    }

    urlInput.addEventListener('input', scheduleRender);
    renderQR();

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(urlInput.value);
        copyBtn.textContent = 'コピーしました';
        setTimeout(() => copyBtn.textContent = 'URLをコピー', 1200);
      } catch (e) {
        urlInput.select();
        document.execCommand('copy');
      }
    });

    downloadBtn.addEventListener('click', () => {
      const c = qrWrap.querySelector('canvas');
      if (!c) return;
      const a = document.createElement('a');
      a.download = 'ar-qr.png';
      a.href = c.toDataURL('image/png');
      a.click();
    });
  </script>
</body>
</html>
