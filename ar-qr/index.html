<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>QR AR ビル</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: relative; width: 100vw; height: 100vh; }
  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: #000;
  }
  #debug {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #building-wrap {
    position: absolute;
    left: 0; top: 0;
    transform-origin: 50% 100%;
    pointer-events: none;
    will-change: transform;
    display: none;
    transition: opacity 0.15s ease-out;
    opacity: 0;
  }
  #building-wrap.visible { opacity: 1; }
  #three { display: block; }

  #status {
    position: absolute; top: 16px; left: 16px; right: 16px;
    color: #fff;
    background: rgba(0,0,0,0.6);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
    z-index: 10;
  }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; margin-right: 8px;
  }
  .badge.ok { background: #2ecc71; color: #000; }
  .badge.ng { background: #e74c3c; color: #fff; }

  #qr-link {
    position: absolute; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.35);
    padding: 10px 18px;
    border-radius: 999px;
    text-decoration: none;
    font-size: 14px;
    display: none;
    z-index: 10;
    pointer-events: auto;
  }

  #start {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    background: linear-gradient(160deg, #14213d, #000814);
    color: #fff; padding: 24px;
    text-align: center;
    z-index: 20;
  }
  #start h1 { font-size: 24px; font-weight: 700; }
  #start p { font-size: 14px; color: #b8c4d6; max-width: 320px; line-height: 1.7; }
  #start button {
    padding: 14px 32px;
    border-radius: 999px;
    border: none;
    background: #4c8bf5;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(76,139,245,0.35);
  }
  #start a { color: #7aa6f7; font-size: 14px; text-decoration: none; }
  .hint { font-size: 12px; color: #8b97ad; margin-top: 4px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="debug"></canvas>
  <div id="building-wrap"><canvas id="three"></canvas></div>
  <div id="status"><span class="badge ng" id="badge">検索中</span><span id="statusText">カメラ起動中...</span></div>
  <a id="qr-link" href="qr.html" target="_blank" rel="noopener">テスト用QRを開く</a>

  <div id="start">
    <h1>QR コード AR ビル</h1>
    <p>カメラで QR コードを読み取ると、その位置に 3D のビルが立ち上がります。</p>
    <button id="startBtn">カメラを起動する</button>
    <a href="qr.html">テスト用 QR コードを表示</a>
    <div class="hint">
      ※ カメラ利用には HTTPS または localhost が必要です<br>
      ※ QR が画面いっぱいに映るくらい近づけると検出しやすいです
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function () {
  const video       = document.getElementById('video');
  const debugCanvas = document.getElementById('debug');
  const debugCtx    = debugCanvas.getContext('2d');
  const threeCanvas = document.getElementById('three');
  const wrap        = document.getElementById('building-wrap');
  const statusEl    = document.getElementById('status');
  const statusText  = document.getElementById('statusText');
  const badge       = document.getElementById('badge');
  const startScreen = document.getElementById('start');
  const startBtn    = document.getElementById('startBtn');
  const qrLink      = document.getElementById('qr-link');

  const scanCanvas = document.createElement('canvas');
  const scanCtx    = scanCanvas.getContext('2d', { willReadFrequently: true });

  // Building "sticker" canvas: fixed pixel size, rendered once and scaled via CSS.
  const STK_W = 360;
  const STK_H = 600;
  // The building base in this canvas occupies roughly BUILDING_BASE_PX wide
  // when the QR sticker is at scale 1. We measure it empirically — set such that
  // the base sits on the bottom-center of the canvas.
  const BUILDING_BASE_PX = 220;

  let renderer, scene, camera, building;

  // QR smoothing state
  let smoothCx = null, smoothCy = null, smoothSize = null, smoothAngle = 0;
  let lastDetectedAt = 0;
  let lastCorners = null;

  function initThree() {
    threeCanvas.width  = STK_W * (window.devicePixelRatio || 1);
    threeCanvas.height = STK_H * (window.devicePixelRatio || 1);
    threeCanvas.style.width  = STK_W + 'px';
    threeCanvas.style.height = STK_H + 'px';

    wrap.style.width  = STK_W + 'px';
    wrap.style.height = STK_H + 'px';

    renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(STK_W, STK_H, false);

    scene  = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(28, STK_W / STK_H, 0.1, 100);
    // Looking slightly down and to the side for a clear 3D feel.
    camera.position.set(2.2, 2.4, 5.5);
    camera.lookAt(0, 1.4, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    key.position.set(3, 6, 4);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x88aaff, 0.5);
    rim.position.set(-3, 1.5, -2);
    scene.add(rim);

    building = buildBuilding();
    scene.add(building);

    // Optional: drop shadow plate (subtle, sits at base).
    const shadowGeo = new THREE.CircleGeometry(0.95, 32);
    const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 });
    const shadow = new THREE.Mesh(shadowGeo, shadowMat);
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.005;
    scene.add(shadow);
  }

  function buildBuilding() {
    const group = new THREE.Group();

    const baseMat  = new THREE.MeshStandardMaterial({ color: 0x2a3340, roughness: 0.8 });
    const wallMat  = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.55, metalness: 0.1 });
    const glassMat = new THREE.MeshStandardMaterial({
      color: 0x3a5d8f, roughness: 0.25, metalness: 0.5,
      emissive: 0x1a2a44, emissiveIntensity: 0.6,
    });

    const base = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.08, 1.3), baseMat);
    base.position.y = 0.04;
    group.add(base);

    const floors  = 10;
    const floorH  = 0.24;
    const towerW  = 0.9;
    for (let i = 0; i < floors; i++) {
      const taper = 1 - i * 0.04;
      const w = towerW * taper;
      const f = new THREE.Mesh(new THREE.BoxGeometry(w, floorH * 0.82, w), wallMat);
      f.position.y = 0.08 + i * floorH + (floorH * 0.82) / 2;
      group.add(f);

      const strip = new THREE.Mesh(new THREE.BoxGeometry(w * 1.005, floorH * 0.16, w * 1.005), glassMat);
      strip.position.y = 0.08 + i * floorH + floorH * 0.92;
      group.add(strip);
    }

    const topY = 0.08 + floors * floorH;
    const roofW = towerW * (1 - floors * 0.04) * 0.7;
    const roof = new THREE.Mesh(new THREE.BoxGeometry(roofW, 0.08, roofW), baseMat);
    roof.position.y = topY + 0.04;
    group.add(roof);

    const spire = new THREE.Mesh(
      new THREE.ConeGeometry(0.1, 0.55, 16),
      new THREE.MeshStandardMaterial({ color: 0xff6b6b, roughness: 0.4 })
    );
    spire.position.y = topY + 0.08 + 0.28;
    group.add(spire);

    const antenna = new THREE.Mesh(
      new THREE.CylinderGeometry(0.012, 0.012, 0.3, 8),
      new THREE.MeshStandardMaterial({ color: 0x222222 })
    );
    antenna.position.y = spire.position.y + 0.28 + 0.15;
    group.add(antenna);

    const tipLight = new THREE.Mesh(
      new THREE.SphereGeometry(0.035, 12, 12),
      new THREE.MeshStandardMaterial({ color: 0xff3344, emissive: 0xff2233, emissiveIntensity: 1.4 })
    );
    tipLight.position.y = antenna.position.y + 0.18;
    group.add(tipLight);
    group.userData.tipLight = tipLight;

    return group;
  }

  function resizeDebug() {
    const w = window.innerWidth, h = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    debugCanvas.width  = w * dpr;
    debugCanvas.height = h * dpr;
    debugCanvas.style.width  = w + 'px';
    debugCanvas.style.height = h + 'px';
    debugCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeDebug);

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('このブラウザはカメラに対応していません');
      return;
    }
    try {
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
          },
        });
      } catch (_e) {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }
      video.srcObject = stream;
      await video.play();
      if (!video.videoWidth) {
        await new Promise((res) => video.addEventListener('loadedmetadata', res, { once: true }));
      }
      startScreen.style.display = 'none';
      statusEl.style.display = 'block';
      qrLink.style.display = 'block';
      wrap.style.display = 'block';
      resizeDebug();
      initThree();
      requestAnimationFrame(tick);
    } catch (e) {
      alert('カメラを起動できませんでした:\n' + (e && e.message ? e.message : e));
    }
  }

  function detectQR() {
    if (!video.videoWidth) return null;
    const targetW = Math.min(720, video.videoWidth);
    const scale = targetW / video.videoWidth;
    const w = Math.round(video.videoWidth * scale);
    const h = Math.round(video.videoHeight * scale);
    if (scanCanvas.width !== w || scanCanvas.height !== h) {
      scanCanvas.width = w; scanCanvas.height = h;
    }
    scanCtx.drawImage(video, 0, 0, w, h);
    const img = scanCtx.getImageData(0, 0, w, h);
    const code = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
    if (!code || !code.location) return null;
    const loc = code.location;
    return {
      data: code.data,
      tl: { x: loc.topLeftCorner.x / w,    y: loc.topLeftCorner.y / h },
      tr: { x: loc.topRightCorner.x / w,   y: loc.topRightCorner.y / h },
      bl: { x: loc.bottomLeftCorner.x / w, y: loc.bottomLeftCorner.y / h },
      br: { x: loc.bottomRightCorner.x / w, y: loc.bottomRightCorner.y / h },
    };
  }

  function videoToScreen(nx, ny) {
    const vw = video.videoWidth, vh = video.videoHeight;
    const cw = window.innerWidth, ch = window.innerHeight;
    const videoRatio = vw / vh;
    const canvasRatio = cw / ch;
    let drawW, drawH, offX, offY;
    if (canvasRatio > videoRatio) {
      drawW = cw; drawH = cw / videoRatio;
      offX = 0; offY = (ch - drawH) / 2;
    } else {
      drawH = ch; drawW = ch * videoRatio;
      offX = (cw - drawW) / 2; offY = 0;
    }
    return { x: offX + nx * drawW, y: offY + ny * drawH };
  }

  function drawDebug(corners) {
    debugCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (!corners) return;
    const pts = [corners.tl, corners.tr, corners.br, corners.bl].map(p => videoToScreen(p.x, p.y));
    debugCtx.lineWidth = 4;
    debugCtx.strokeStyle = '#2ecc71';
    debugCtx.fillStyle = 'rgba(46, 204, 113, 0.18)';
    debugCtx.beginPath();
    pts.forEach((s, i) => i === 0 ? debugCtx.moveTo(s.x, s.y) : debugCtx.lineTo(s.x, s.y));
    debugCtx.closePath();
    debugCtx.fill();
    debugCtx.stroke();
    debugCtx.fillStyle = '#2ecc71';
    pts.forEach(s => {
      debugCtx.beginPath();
      debugCtx.arc(s.x, s.y, 6, 0, Math.PI * 2);
      debugCtx.fill();
    });
  }

  function placeBuilding(det) {
    const pts = [det.tl, det.tr, det.br, det.bl].map(p => videoToScreen(p.x, p.y));
    const cx = (pts[0].x + pts[1].x + pts[2].x + pts[3].x) / 4;
    const cy = (pts[0].y + pts[1].y + pts[2].y + pts[3].y) / 4;
    const sizePx = (Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y)
                   + Math.hypot(pts[2].x - pts[3].x, pts[2].y - pts[3].y)) / 2;
    const angle = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);

    const a = 0.4;
    if (smoothCx === null) {
      smoothCx = cx; smoothCy = cy; smoothSize = sizePx; smoothAngle = angle;
    } else {
      smoothCx += (cx - smoothCx) * a;
      smoothCy += (cy - smoothCy) * a;
      smoothSize += (sizePx - smoothSize) * a;
      let da = angle - smoothAngle;
      while (da > Math.PI) da -= 2 * Math.PI;
      while (da < -Math.PI) da += 2 * Math.PI;
      smoothAngle += da * a;
    }

    // Position the building canvas so its bottom-center is at the QR center,
    // scaled so that the building's base footprint matches the QR's screen size.
    const scale = Math.max(0.18, smoothSize / BUILDING_BASE_PX);
    const tx = smoothCx - STK_W / 2;
    const ty = smoothCy - STK_H;
    wrap.style.transform =
      `translate(${tx}px, ${ty}px) scale(${scale})`;
    wrap.classList.add('visible');
  }

  function hideBuilding() {
    wrap.classList.remove('visible');
  }

  function tick(now) {
    requestAnimationFrame(tick);

    if (video.readyState >= 2) {
      const det = detectQR();
      if (det) {
        lastDetectedAt = now;
        lastCorners = det;
        badge.className = 'badge ok';
        badge.textContent = '検出';
        const px = Math.round(
          Math.hypot(
            (det.tr.x - det.tl.x) * video.videoWidth,
            (det.tr.y - det.tl.y) * video.videoHeight
          )
        );
        statusText.textContent = (det.data || '(QR)') + ' / size: ' + px + 'px';
        placeBuilding(det);
      } else if (now - lastDetectedAt > 600) {
        lastCorners = null;
        badge.className = 'badge ng';
        badge.textContent = '検索中';
        statusText.textContent = 'QRコードを探しています... (' + video.videoWidth + 'x' + video.videoHeight + ')';
        hideBuilding();
      }
    } else {
      statusText.textContent = 'カメラ初期化中... (readyState=' + video.readyState + ')';
    }

    drawDebug(lastCorners);

    // Tip light flicker.
    if (building && building.userData.tipLight) {
      building.userData.tipLight.material.emissiveIntensity =
        0.7 + (Math.sin(now * 0.005) * 0.5 + 0.5) * 1.0;
    }
    // Subtle rotation for life.
    if (building) {
      building.rotation.y = Math.sin(now * 0.0005) * 0.25;
    }
    if (renderer) renderer.render(scene, camera);
  }

  startBtn.addEventListener('click', startCamera);
})();
</script>
</body>
</html>
