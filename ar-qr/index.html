<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>QR AR ビル</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: relative; width: 100vw; height: 100vh; }
  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: #000;
  }
  #overlay {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #status {
    position: absolute; top: 16px; left: 16px; right: 16px;
    color: #fff;
    background: rgba(0,0,0,0.6);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
    z-index: 10;
  }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; margin-right: 8px;
  }
  .badge.ok { background: #2ecc71; color: #000; }
  .badge.ng { background: #e74c3c; color: #fff; }
  #qr-link {
    position: absolute; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.35);
    padding: 10px 18px;
    border-radius: 999px;
    text-decoration: none;
    font-size: 14px;
    display: none;
    z-index: 10;
    pointer-events: auto;
  }
  #start {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    background: linear-gradient(160deg, #14213d, #000814);
    color: #fff; padding: 24px;
    text-align: center;
    z-index: 20;
  }
  #start h1 { font-size: 24px; font-weight: 700; }
  #start p { font-size: 14px; color: #b8c4d6; max-width: 320px; line-height: 1.7; }
  #start button {
    padding: 14px 32px;
    border-radius: 999px;
    border: none;
    background: #4c8bf5;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(76,139,245,0.35);
  }
  #start a { color: #7aa6f7; font-size: 14px; text-decoration: none; }
  .hint { font-size: 12px; color: #8b97ad; margin-top: 4px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="status"><span class="badge ng" id="badge">検索中</span><span id="statusText">カメラ起動中...</span></div>
  <a id="qr-link" href="qr.html" target="_blank" rel="noopener">テスト用QRを開く</a>

  <div id="start">
    <h1>QR コード AR ビル</h1>
    <p>カメラで QR コードを読み取ると、その位置に 3D のビルが立ち上がります。</p>
    <button id="startBtn">カメラを起動する</button>
    <a href="qr.html">テスト用 QR コードを表示</a>
    <div class="hint">
      ※ カメラ利用には HTTPS または localhost が必要です<br>
      ※ QR が画面いっぱいに映るくらい近づけると検出しやすいです
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function () {
  const video      = document.getElementById('video');
  const overlay    = document.getElementById('overlay');
  const ctx        = overlay.getContext('2d');
  const statusEl   = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const badge      = document.getElementById('badge');
  const startScreen= document.getElementById('start');
  const startBtn   = document.getElementById('startBtn');
  const qrLink     = document.getElementById('qr-link');

  const scanCanvas = document.createElement('canvas');
  const scanCtx    = scanCanvas.getContext('2d', { willReadFrequently: true });

  // Smoothing
  let sCx = null, sCy = null, sSize = null, sAngle = 0;
  let lastDetectedAt = 0;
  let lastCorners = null;

  function resizeOverlay() {
    const w = window.innerWidth, h = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    overlay.width  = w * dpr;
    overlay.height = h * dpr;
    overlay.style.width  = w + 'px';
    overlay.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeOverlay);

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('このブラウザはカメラに対応していません');
      return;
    }
    try {
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
          },
        });
      } catch (_e) {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }
      video.srcObject = stream;
      await video.play();
      if (!video.videoWidth) {
        await new Promise((res) => video.addEventListener('loadedmetadata', res, { once: true }));
      }
      startScreen.style.display = 'none';
      statusEl.style.display = 'block';
      qrLink.style.display = 'block';
      resizeOverlay();
      requestAnimationFrame(tick);
    } catch (e) {
      alert('カメラを起動できませんでした:\n' + (e && e.message ? e.message : e));
    }
  }

  function detectQR() {
    if (!video.videoWidth) return null;
    const targetW = Math.min(720, video.videoWidth);
    const scale = targetW / video.videoWidth;
    const w = Math.round(video.videoWidth * scale);
    const h = Math.round(video.videoHeight * scale);
    if (scanCanvas.width !== w || scanCanvas.height !== h) {
      scanCanvas.width = w; scanCanvas.height = h;
    }
    scanCtx.drawImage(video, 0, 0, w, h);
    const img = scanCtx.getImageData(0, 0, w, h);
    const code = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
    if (!code || !code.location) return null;
    const loc = code.location;
    return {
      data: code.data,
      tl: { x: loc.topLeftCorner.x / w,    y: loc.topLeftCorner.y / h },
      tr: { x: loc.topRightCorner.x / w,   y: loc.topRightCorner.y / h },
      bl: { x: loc.bottomLeftCorner.x / w, y: loc.bottomLeftCorner.y / h },
      br: { x: loc.bottomRightCorner.x / w, y: loc.bottomRightCorner.y / h },
    };
  }

  function videoToScreen(nx, ny) {
    const vw = video.videoWidth, vh = video.videoHeight;
    const cw = window.innerWidth, ch = window.innerHeight;
    const videoRatio = vw / vh, canvasRatio = cw / ch;
    let drawW, drawH, offX, offY;
    if (canvasRatio > videoRatio) {
      drawW = cw; drawH = cw / videoRatio;
      offX = 0; offY = (ch - drawH) / 2;
    } else {
      drawH = ch; drawW = ch * videoRatio;
      offX = (cw - drawW) / 2; offY = 0;
    }
    return { x: offX + nx * drawW, y: offY + ny * drawH };
  }

  function drawDetectionOutline(corners) {
    if (!corners) return;
    const pts = [corners.tl, corners.tr, corners.br, corners.bl].map(p => videoToScreen(p.x, p.y));
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#2ecc71';
    ctx.fillStyle = 'rgba(46, 204, 113, 0.18)';
    ctx.beginPath();
    pts.forEach((s, i) => i === 0 ? ctx.moveTo(s.x, s.y) : ctx.lineTo(s.x, s.y));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#2ecc71';
    pts.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x, s.y, 6, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // ---- 2D Building drawing ----
  // Rises UP from (cx, cy). baseWidth = footprint width in screen pixels.
  function drawBuilding(cx, cy, baseWidth, time) {
    const w = baseWidth;
    const h = baseWidth * 1.9;        // total height (shorter so it stays in view)
    const d = baseWidth * 0.32;       // depth (iso offset)
    const floors = 8;

    ctx.save();
    ctx.translate(cx, cy);

    // Ground shadow (ellipse)
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(d * 0.35, d * 0.15, w * 0.62, w * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    // ---- Right side face (darker) ----
    const sideGrad = ctx.createLinearGradient(w/2, 0, w/2 + d, -d);
    sideGrad.addColorStop(0, '#7d8896');
    sideGrad.addColorStop(1, '#5a6573');
    ctx.fillStyle = sideGrad;
    ctx.beginPath();
    ctx.moveTo(w/2, 0);
    ctx.lineTo(w/2 + d, -d);
    ctx.lineTo(w/2 + d, -h - d);
    ctx.lineTo(w/2, -h);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Side windows (small)
    ctx.fillStyle = 'rgba(58, 93, 143, 0.85)';
    for (let i = 0; i < floors; i++) {
      const y0 = -h + (i + 0.25) * (h / floors);
      const y1 = -h + (i + 0.55) * (h / floors);
      // trapezoid window strip on side
      const xTop = w/2 + d * (1 - (i + 0.25) / floors * 0); // simplified
      ctx.beginPath();
      ctx.moveTo(w/2 + d * 0.15, y0 - d * 0.15);
      ctx.lineTo(w/2 + d * 0.85, y0 - d * 0.85);
      ctx.lineTo(w/2 + d * 0.85, y1 - d * 0.85);
      ctx.lineTo(w/2 + d * 0.15, y1 - d * 0.15);
      ctx.closePath();
      ctx.fill();
    }

    // ---- Front face ----
    const frontGrad = ctx.createLinearGradient(-w/2, -h, w/2, 0);
    frontGrad.addColorStop(0, '#f1f5fa');
    frontGrad.addColorStop(1, '#c1ccd9');
    ctx.fillStyle = frontGrad;
    ctx.fillRect(-w/2, -h, w, h);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.strokeRect(-w/2, -h, w, h);

    // Window strips on front
    for (let i = 0; i < floors; i++) {
      const y = -h + (i + 0.25) * (h / floors);
      // glass
      ctx.fillStyle = '#3a5d8f';
      ctx.fillRect(-w/2 + w*0.08, y, w * 0.84, h/floors * 0.35);
      // highlight
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(-w/2 + w*0.08, y, w * 0.84, h/floors * 0.07);
    }
    // Entrance
    ctx.fillStyle = '#2a3340';
    ctx.fillRect(-w*0.12, -h/floors*0.7, w*0.24, h/floors*0.7);

    // ---- Top face ----
    const topGrad = ctx.createLinearGradient(0, -h - d, 0, -h);
    topGrad.addColorStop(0, '#3a4555');
    topGrad.addColorStop(1, '#2a3340');
    ctx.fillStyle = topGrad;
    ctx.beginPath();
    ctx.moveTo(-w/2, -h);
    ctx.lineTo(w/2, -h);
    ctx.lineTo(w/2 + d, -h - d);
    ctx.lineTo(-w/2 + d, -h - d);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.stroke();

    // ---- Spire ----
    const spireTopX = d * 0.5;
    const spireTopY = -h - d - baseWidth * 0.5;
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.moveTo(-w * 0.13, -h);
    ctx.lineTo(w * 0.13, -h);
    ctx.lineTo(w * 0.13 + d * 0.5, -h - d * 0.5);
    ctx.lineTo(-w * 0.13 + d * 0.5, -h - d * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -h);
    ctx.lineTo(spireTopX, spireTopY);
    ctx.lineTo(w * 0.13 + d * 0.5, -h - d * 0.5);
    ctx.closePath();
    ctx.fillStyle = '#d95252';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -h);
    ctx.lineTo(spireTopX, spireTopY);
    ctx.lineTo(-w * 0.13 + d * 0.5, -h - d * 0.5);
    ctx.closePath();
    ctx.fillStyle = '#ff8585';
    ctx.fill();

    // ---- Antenna ----
    const antTopX = spireTopX;
    const antTopY = spireTopY - baseWidth * 0.35;
    ctx.strokeStyle = '#222';
    ctx.lineWidth = Math.max(1.5, baseWidth * 0.012);
    ctx.beginPath();
    ctx.moveTo(spireTopX, spireTopY);
    ctx.lineTo(antTopX, antTopY);
    ctx.stroke();

    // Tip light (pulsating)
    const pulse = 0.6 + (Math.sin(time * 0.006) * 0.5 + 0.5) * 0.4;
    ctx.fillStyle = '#ff3344';
    ctx.shadowColor = '#ff3344';
    ctx.shadowBlur = baseWidth * 0.25 * pulse;
    ctx.beginPath();
    ctx.arc(antTopX, antTopY, baseWidth * 0.05, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  function tick(now) {
    requestAnimationFrame(tick);

    // Clear overlay each frame.
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    if (video.readyState < 2) {
      statusText.textContent = 'カメラ初期化中... (readyState=' + video.readyState + ')';
      return;
    }

    const det = detectQR();
    if (det) {
      lastDetectedAt = now;
      lastCorners = det;
      badge.className = 'badge ok';
      badge.textContent = '検出';
      const px = Math.round(
        Math.hypot(
          (det.tr.x - det.tl.x) * video.videoWidth,
          (det.tr.y - det.tl.y) * video.videoHeight
        )
      );
      statusText.textContent = (det.data || '(QR)') + ' / size: ' + px + 'px';

      // Compute screen-space metrics.
      const pts = [det.tl, det.tr, det.br, det.bl].map(p => videoToScreen(p.x, p.y));
      const cx = (pts[0].x + pts[1].x + pts[2].x + pts[3].x) / 4;
      const cy = (pts[0].y + pts[1].y + pts[2].y + pts[3].y) / 4;
      const sizePx = (Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y)
                    + Math.hypot(pts[2].x - pts[3].x, pts[2].y - pts[3].y)) / 2;
      const angle = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);

      const a = 0.45;
      if (sCx === null) {
        sCx = cx; sCy = cy; sSize = sizePx; sAngle = angle;
      } else {
        sCx += (cx - sCx) * a;
        sCy += (cy - sCy) * a;
        sSize += (sizePx - sSize) * a;
        let da = angle - sAngle;
        while (da > Math.PI) da -= 2 * Math.PI;
        while (da < -Math.PI) da += 2 * Math.PI;
        sAngle += da * a;
      }
    } else if (now - lastDetectedAt > 600) {
      lastCorners = null;
      sCx = sCy = sSize = null;
      badge.className = 'badge ng';
      badge.textContent = '検索中';
      statusText.textContent = 'QRコードを探しています... (' + video.videoWidth + 'x' + video.videoHeight + ')';
    }

    // Draw outline (debug visualization).
    drawDetectionOutline(lastCorners);

    // Draw building if we have a smoothed position.
    if (sCx !== null && sSize !== null) {
      // DEBUG: always-visible bright marker so we can confirm the drawing pipeline
      // reaches this point with a valid position. If the user sees this marker but
      // no building, the building rendering itself has a problem.
      ctx.save();
      ctx.fillStyle = 'rgba(255, 50, 50, 0.9)';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(sCx, sCy, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // Vertical arrow pointing UP from QR position (where building grows)
      ctx.strokeStyle = 'rgba(255, 50, 50, 0.95)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(sCx, sCy);
      ctx.lineTo(sCx, sCy - 60);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 50, 50, 0.95)';
      ctx.beginPath();
      ctx.moveTo(sCx, sCy - 70);
      ctx.lineTo(sCx - 8, sCy - 56);
      ctx.lineTo(sCx + 8, sCy - 56);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Building base width tied to QR size; minimum size for visibility.
      let baseWidth = Math.max(80, sSize);
      // Scale down so the building (h = baseWidth * 1.9) fits in the space above QR.
      const availableAbove = Math.max(60, sCy - 16);
      const desiredHeight = baseWidth * 1.9;
      if (desiredHeight > availableAbove) {
        baseWidth = (availableAbove / 1.9);
      }
      // Cap maximum base width too (avoid overwhelming the screen).
      baseWidth = Math.min(baseWidth, window.innerWidth * 0.6);
      drawBuilding(sCx, sCy, baseWidth, now);

      // Append render info to status for debugging.
      const sizeInfoTxt =
        ' | bldg ' + Math.round(baseWidth) + 'x' + Math.round(baseWidth * 1.9) +
        ' @ (' + Math.round(sCx) + ',' + Math.round(sCy) + ')';
      statusText.textContent += sizeInfoTxt;
    }
  }

  startBtn.addEventListener('click', startCamera);
})();
</script>
</body>
</html>
