<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>QR AR ビル</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: relative; width: 100vw; height: 100vh; }
  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: #000;
  }
  #debug, #three {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #status {
    position: absolute; top: 16px; left: 16px; right: 16px;
    color: #fff;
    background: rgba(0,0,0,0.6);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    z-index: 10;
  }
  #status .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700; margin-right: 8px;
  }
  .badge.ok  { background: #2ecc71; color: #000; }
  .badge.ng  { background: #e74c3c; color: #fff; }
  #qr-link {
    position: absolute; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.35);
    padding: 10px 18px;
    border-radius: 999px;
    text-decoration: none;
    font-size: 14px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    z-index: 10;
    pointer-events: auto;
  }
  #start {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    background: linear-gradient(160deg, #14213d, #000814);
    color: #fff; padding: 24px;
    text-align: center;
    z-index: 20;
  }
  #start h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.02em; }
  #start p { font-size: 14px; color: #b8c4d6; max-width: 320px; line-height: 1.7; }
  #start button {
    padding: 14px 32px;
    border-radius: 999px;
    border: none;
    background: #4c8bf5;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(76,139,245,0.35);
  }
  #start a { color: #7aa6f7; font-size: 14px; text-decoration: none; }
  #start a:hover { text-decoration: underline; }
  .hint { font-size: 12px; color: #8b97ad; margin-top: 4px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="debug"></canvas>
  <canvas id="three"></canvas>
  <div id="status"><span class="badge ng" id="badge">検索中</span><span id="statusText">カメラ起動中...</span></div>
  <a id="qr-link" href="qr.html" target="_blank" rel="noopener">テスト用QRを開く</a>

  <div id="start">
    <h1>QR コード AR ビル</h1>
    <p>カメラで QR コードを読み取ると、その位置に 3D のビルが立ち上がります。</p>
    <button id="startBtn">カメラを起動する</button>
    <a href="qr.html">テスト用 QR コードを表示</a>
    <div class="hint">
      ※ カメラ利用には HTTPS または localhost が必要です<br>
      ※ うまく検出されない時は、QR が画面いっぱいに大きく映るように近づけてください
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function () {
  const video = document.getElementById('video');
  const overlay = document.getElementById('three');
  const debugCanvas = document.getElementById('debug');
  const debugCtx = debugCanvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const badge = document.getElementById('badge');
  const startScreen = document.getElementById('start');
  const startBtn = document.getElementById('startBtn');
  const qrLink = document.getElementById('qr-link');

  const scanCanvas = document.createElement('canvas');
  const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });

  let renderer, scene, camera, building;
  let smoothCenter = null;
  let smoothScale = null;
  let smoothAngle = 0;
  let lastDetectedAt = 0;
  let lastCorners = null;
  let frameCount = 0;

  function initThree() {
    renderer = new THREE.WebGLRenderer({ canvas: overlay, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    resizeRenderer();

    scene = new THREE.Scene();
    // Orthographic in screen pixels so we can place the building right at the QR location.
    camera = new THREE.PerspectiveCamera(40, overlay.clientWidth / overlay.clientHeight, 0.1, 100);
    camera.position.set(0, 0, 5);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const key = new THREE.DirectionalLight(0xffffff, 1.0);
    key.position.set(2, 5, 4);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x88aaff, 0.5);
    rim.position.set(-3, 1, -2);
    scene.add(rim);

    building = buildBuilding();
    building.visible = false;
    scene.add(building);
  }

  function buildBuilding() {
    const group = new THREE.Group();

    const baseMat  = new THREE.MeshStandardMaterial({ color: 0x2a3340, roughness: 0.8 });
    const wallMat  = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.55, metalness: 0.1 });
    const glassMat = new THREE.MeshStandardMaterial({
      color: 0x3a5d8f, roughness: 0.25, metalness: 0.5,
      emissive: 0x1a2a44, emissiveIntensity: 0.6,
    });

    const base = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.08, 1.3), baseMat);
    base.position.y = 0.04;
    group.add(base);

    const floors = 10;
    const floorH = 0.24;
    const towerW = 0.9;
    for (let i = 0; i < floors; i++) {
      const taper = 1 - i * 0.04;
      const w = towerW * taper;
      const f = new THREE.Mesh(new THREE.BoxGeometry(w, floorH * 0.82, w), wallMat);
      f.position.y = 0.08 + i * floorH + (floorH * 0.82) / 2;
      group.add(f);

      const strip = new THREE.Mesh(new THREE.BoxGeometry(w * 1.005, floorH * 0.16, w * 1.005), glassMat);
      strip.position.y = 0.08 + i * floorH + floorH * 0.92;
      group.add(strip);
    }

    const topY = 0.08 + floors * floorH;
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(towerW * (1 - floors * 0.04) * 0.7, 0.08, towerW * (1 - floors * 0.04) * 0.7),
      baseMat
    );
    roof.position.y = topY + 0.04;
    group.add(roof);

    const spire = new THREE.Mesh(
      new THREE.ConeGeometry(0.1, 0.55, 16),
      new THREE.MeshStandardMaterial({ color: 0xff6b6b, roughness: 0.4 })
    );
    spire.position.y = topY + 0.08 + 0.28;
    group.add(spire);

    const antenna = new THREE.Mesh(
      new THREE.CylinderGeometry(0.012, 0.012, 0.3, 8),
      new THREE.MeshStandardMaterial({ color: 0x222222 })
    );
    antenna.position.y = spire.position.y + 0.28 + 0.15;
    group.add(antenna);

    const tipLight = new THREE.Mesh(
      new THREE.SphereGeometry(0.03, 12, 12),
      new THREE.MeshStandardMaterial({ color: 0xff3344, emissive: 0xff2233, emissiveIntensity: 1.4 })
    );
    tipLight.position.y = antenna.position.y + 0.18;
    group.add(tipLight);
    group.userData.tipLight = tipLight;

    // Pivot so the base of the building is at the group's origin's "ground" (y=0).
    return group;
  }

  function resizeRenderer() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h, false);
    debugCanvas.width = w * (window.devicePixelRatio || 1);
    debugCanvas.height = h * (window.devicePixelRatio || 1);
    debugCanvas.style.width = w + 'px';
    debugCanvas.style.height = h + 'px';
    debugCtx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
    if (camera) {
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
  }
  window.addEventListener('resize', resizeRenderer);

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('このブラウザはカメラに対応していません');
      return;
    }
    try {
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
          },
        });
      } catch (e1) {
        // fallback: any camera
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }
      video.srcObject = stream;
      await video.play();

      // Wait until videoWidth is available
      if (!video.videoWidth) {
        await new Promise((res) => {
          video.addEventListener('loadedmetadata', res, { once: true });
        });
      }

      startScreen.style.display = 'none';
      statusEl.style.display = 'block';
      qrLink.style.display = 'block';
      initThree();
      requestAnimationFrame(tick);
    } catch (e) {
      alert('カメラを起動できませんでした:\n' + (e && e.message ? e.message : e));
    }
  }

  function detectQR() {
    if (!video.videoWidth) return null;
    // Higher resolution = better detection for screen-displayed QR codes.
    const targetW = Math.min(720, video.videoWidth);
    const scale = targetW / video.videoWidth;
    const w = Math.round(video.videoWidth * scale);
    const h = Math.round(video.videoHeight * scale);
    if (scanCanvas.width !== w || scanCanvas.height !== h) {
      scanCanvas.width = w;
      scanCanvas.height = h;
    }
    scanCtx.drawImage(video, 0, 0, w, h);
    const img = scanCtx.getImageData(0, 0, w, h);
    const code = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
    if (!code || !code.location) return null;
    const loc = code.location;
    return {
      data: code.data,
      tl: { x: loc.topLeftCorner.x / w,    y: loc.topLeftCorner.y / h },
      tr: { x: loc.topRightCorner.x / w,   y: loc.topRightCorner.y / h },
      bl: { x: loc.bottomLeftCorner.x / w, y: loc.bottomLeftCorner.y / h },
      br: { x: loc.bottomRightCorner.x / w, y: loc.bottomRightCorner.y / h },
    };
  }

  function videoToScreen(nx, ny) {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const cw = overlay.clientWidth;
    const ch = overlay.clientHeight;
    const videoRatio = vw / vh;
    const canvasRatio = cw / ch;
    let drawW, drawH, offX, offY;
    if (canvasRatio > videoRatio) {
      drawW = cw;
      drawH = cw / videoRatio;
      offX = 0;
      offY = (ch - drawH) / 2;
    } else {
      drawH = ch;
      drawW = ch * videoRatio;
      offX = (cw - drawW) / 2;
      offY = 0;
    }
    return { x: offX + nx * drawW, y: offY + ny * drawH };
  }

  function drawDebug(corners) {
    const cw = overlay.clientWidth;
    const ch = overlay.clientHeight;
    debugCtx.clearRect(0, 0, cw, ch);
    if (!corners) return;
    const pts = [corners.tl, corners.tr, corners.br, corners.bl];
    debugCtx.lineWidth = 4;
    debugCtx.strokeStyle = '#2ecc71';
    debugCtx.fillStyle = 'rgba(46, 204, 113, 0.18)';
    debugCtx.beginPath();
    pts.forEach((p, i) => {
      const s = videoToScreen(p.x, p.y);
      if (i === 0) debugCtx.moveTo(s.x, s.y); else debugCtx.lineTo(s.x, s.y);
    });
    debugCtx.closePath();
    debugCtx.fill();
    debugCtx.stroke();
    // corner dots
    debugCtx.fillStyle = '#2ecc71';
    pts.forEach((p) => {
      const s = videoToScreen(p.x, p.y);
      debugCtx.beginPath();
      debugCtx.arc(s.x, s.y, 6, 0, Math.PI * 2);
      debugCtx.fill();
    });
  }

  // Place building in screen space: convert pixel (x,y) on screen to world coords at z=0 plane.
  const _ray = new THREE.Raycaster();
  const _plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const _target = new THREE.Vector3();
  const _ndc = new THREE.Vector2();

  function placeBuilding(det) {
    const tl = videoToScreen(det.tl.x, det.tl.y);
    const tr = videoToScreen(det.tr.x, det.tr.y);
    const br = videoToScreen(det.br.x, det.br.y);
    const bl = videoToScreen(det.bl.x, det.bl.y);

    const cx = (tl.x + tr.x + br.x + bl.x) / 4;
    const cy = (tl.y + tr.y + br.y + bl.y) / 4;
    const sizePx = (Math.hypot(tr.x - tl.x, tr.y - tl.y) + Math.hypot(br.x - bl.x, br.y - bl.y)) / 2;
    const angle = Math.atan2(tr.y - tl.y, tr.x - tl.x);

    const alpha = 0.4;
    if (!smoothCenter) {
      smoothCenter = { x: cx, y: cy };
      smoothScale = sizePx;
      smoothAngle = angle;
    } else {
      smoothCenter.x += (cx - smoothCenter.x) * alpha;
      smoothCenter.y += (cy - smoothCenter.y) * alpha;
      smoothScale += (sizePx - smoothScale) * alpha;
      let da = angle - smoothAngle;
      while (da > Math.PI) da -= 2 * Math.PI;
      while (da < -Math.PI) da += 2 * Math.PI;
      smoothAngle += da * alpha;
    }

    const cw = overlay.clientWidth;
    const ch = overlay.clientHeight;
    _ndc.set((smoothCenter.x / cw) * 2 - 1, -(smoothCenter.y / ch) * 2 + 1);
    _ray.setFromCamera(_ndc, camera);
    const hit = _ray.ray.intersectPlane(_plane, _target);
    if (!hit) return;

    // World units per pixel at z=0 depth (where the building sits).
    const depth = Math.abs(camera.position.z); // plane at z=0
    const vFOV = THREE.MathUtils.degToRad(camera.fov);
    const worldHeightAtDepth = 2 * Math.tan(vFOV / 2) * depth;
    const worldPerPixel = worldHeightAtDepth / ch;

    // We want building's "footprint" width to be roughly 1.4x the QR size on screen,
    // so it visibly overlaps the QR while still feeling grounded.
    const buildingBase = 1.3;
    const desiredWorldWidth = Math.max(20, smoothScale) * 1.4 * worldPerPixel;
    const s = desiredWorldWidth / buildingBase;

    // Place building so its base center is at the QR center (in world coords).
    // Since the building geometry has its base at y≈0, offset by half its scaled depth
    // so it grows upward from the QR. We simply set y to target.y (no offset; base is at y=0 of group).
    building.position.set(_target.x, _target.y, 0);
    building.scale.setScalar(s);
    building.rotation.y = -smoothAngle;
    building.visible = true;
  }

  function tick(now) {
    requestAnimationFrame(tick);
    frameCount++;

    if (video.readyState >= 2) {
      // Detect every frame (jsQR is fast at 720p).
      const det = detectQR();
      if (det) {
        lastDetectedAt = now;
        lastCorners = det;
        badge.className = 'badge ok';
        badge.textContent = '検出';
        statusText.textContent = (det.data || '(QR)') + ' / size: ' + Math.round(
          Math.hypot(
            (det.tr.x - det.tl.x) * video.videoWidth,
            (det.tr.y - det.tl.y) * video.videoHeight
          )
        ) + 'px';
        placeBuilding(det);
      } else if (now - lastDetectedAt > 600) {
        if (building) building.visible = false;
        lastCorners = null;
        badge.className = 'badge ng';
        badge.textContent = '検索中';
        statusText.textContent = 'QRコードを探しています... カメラを QR に近づけてください (' + video.videoWidth + 'x' + video.videoHeight + ')';
      }
    } else {
      statusText.textContent = 'カメラ初期化中... (readyState=' + video.readyState + ')';
    }

    drawDebug(lastCorners);

    if (building && building.visible) {
      const t = now * 0.001;
      // Subtle bob and twinkle.
      const baseY = building.position.y;
      const bob = Math.sin(t * 2.0) * 0.01;
      building.position.y = baseY; // (placeBuilding sets it each frame; nothing to add here)
      const tip = building.userData.tipLight;
      if (tip) {
        tip.material.emissiveIntensity = 0.7 + (Math.sin(t * 5) * 0.5 + 0.5) * 1.0;
      }
    }

    renderer.render(scene, camera);
  }

  startBtn.addEventListener('click', startCamera);
})();
</script>
</body>
</html>
