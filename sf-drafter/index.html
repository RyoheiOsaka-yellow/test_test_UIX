<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SF建築 手描きドラフター / HAND-DRAWN SPECULATIVE ARCHITECTURE</title>
<style>
:root{
  --ink:#3b3b42;
  --ink-soft:#6b6a66;
  --ink-faint:#9a978d;
  --paper:#e9e3d5;
  --paper-2:#f4efe3;
  --paper-3:#fbf8f0;
  --line:#c9c2ae;
  --accent:#8a5a3c;
  --accent-2:#4a6b6a;
  --tape:rgba(214,196,140,.45);
  --red:#a44a3f;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Zen Kurenaido",-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--paper);
  overflow:hidden;
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
  font-size:13px;
}
body::before{
  /* 机の上の紙目 */
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:var(--desk-tex);
  opacity:.5; mix-blend-mode:multiply;
}
/* ---------- 手描き風の囲み ---------- */
.sk{ position:relative; }
.sk::before{
  content:''; position:absolute; inset:0;
  border:1.4px solid var(--ink);
  border-radius:5px;
  filter:url(#rough);
  pointer-events:none;
  opacity:.62;
}
.sk.dbl::after{
  content:''; position:absolute; inset:2px 1px 0 2px;
  border:1px solid var(--ink);
  border-radius:6px; opacity:.22;
  filter:url(#rough2);
  pointer-events:none;
}
.hand{ filter:url(#ink); }

/* ---------- ヘッダ ---------- */
header{
  position:relative; z-index:2;
  display:flex; align-items:center; gap:14px;
  padding:8px 16px 9px;
  background:linear-gradient(180deg,var(--paper-3),var(--paper-2));
  border-bottom:1.5px solid var(--line);
  flex-wrap:wrap;
}
header::after{
  content:''; position:absolute; left:0; right:0; bottom:-3px; height:3px;
  background:repeating-linear-gradient(90deg,var(--ink-faint) 0 7px,transparent 7px 15px);
  opacity:.25;
}
h1{
  font-size:15px; font-weight:700; letter-spacing:.04em; white-space:nowrap; line-height:1.25;
}
h1 small{
  display:block; font-size:8.5px; letter-spacing:.22em; color:var(--accent);
  font-weight:700; font-family:"Courier New",monospace;
}
.tabs{ display:flex; gap:5px; flex:1; min-width:0; flex-wrap:wrap; }
.genres{ display:flex; gap:5px; flex:none; padding-right:10px; margin-right:2px; border-right:1.5px dashed var(--line); }
.gbtn{
  font:inherit; font-size:11.5px; font-weight:700; cursor:pointer;
  padding:6px 10px 7px; background:transparent; color:var(--ink-soft);
  border:none; white-space:nowrap; position:relative;
}
.gbtn::before{
  content:''; position:absolute; inset:0; border:1.4px solid var(--accent);
  border-radius:13px 11px 14px 12px; opacity:.28; filter:url(#rough); transition:opacity .15s;
}
.gbtn:hover{ color:var(--accent); } .gbtn:hover::before{ opacity:.6; }
.gbtn.on{ color:#fff; background:var(--accent); border-radius:13px 11px 14px 12px; }
.gbtn.on::before{ opacity:1; }
.gbtn span{ position:relative; }
.tab{
  font:inherit; font-size:11.5px; font-weight:600; cursor:pointer;
  padding:6px 11px 7px; background:transparent; color:var(--ink-soft);
  border:none; white-space:nowrap; position:relative;
}
.tab::before{
  content:''; position:absolute; inset:0; border:1.3px solid var(--ink);
  border-radius:14px 12px 15px 11px; opacity:.3; filter:url(#rough);
  transition:opacity .15s;
}
.tab:hover{ color:var(--ink); }
.tab:hover::before{ opacity:.6; }
.tab.on{ color:#fff; background:var(--ink); border-radius:14px 12px 15px 11px; }
.tab.on::before{ opacity:1; }
.tab span{ position:relative; }
.tab em{
  font-style:normal; font-family:"Courier New",monospace; font-size:9px;
  opacity:.6; margin-right:4px; letter-spacing:.05em;
}

/* ---------- 本体 ---------- */
main{ flex:1; display:flex; min-height:0; position:relative; z-index:1; }
aside{
  width:272px; flex:none; overflow-y:auto; overflow-x:hidden;
  background:var(--paper-2);
  border-right:1.5px solid var(--line);
  padding:14px 14px 60px;
}
aside.right{ width:296px; border-right:none; border-left:1.5px solid var(--line); }
aside::-webkit-scrollbar{ width:9px; }
aside::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }

.sec{ margin-bottom:20px; }
.sec > h3{
  font-size:10.5px; letter-spacing:.16em; color:var(--accent);
  font-weight:700; margin-bottom:9px; padding-bottom:5px;
  font-family:"Courier New",monospace;
  border-bottom:1.2px dashed var(--line);
  display:flex; justify-content:space-between; align-items:baseline;
}
.sec > h3 b{ font-family:inherit; font-size:11px; letter-spacing:0; color:var(--ink-soft); font-weight:600; }
h4{ font-size:11px; color:var(--ink-soft); margin:11px 0 5px; font-weight:600; letter-spacing:.02em; }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; }
.chip{
  font:inherit; font-size:11px; cursor:pointer; padding:6px 4px 7px;
  background:transparent; color:var(--ink-soft); border:none;
  position:relative; text-align:center; line-height:1.3;
}
.chip::before{
  content:''; position:absolute; inset:0; border:1.2px solid var(--ink);
  border-radius:4px 6px 4px 7px; opacity:.28; filter:url(#rough2);
}
.chip:hover{ color:var(--ink); }
.chip:hover::before{ opacity:.55; }
.chip.on{ color:var(--ink); font-weight:700; background:rgba(138,90,60,.14); border-radius:4px 6px 4px 7px; }
.chip.on::before{ opacity:.95; border-width:1.6px; }
.chip small{ display:block; font-size:8.5px; font-family:"Courier New",monospace; opacity:.55; letter-spacing:.06em; }

.row{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
.row label{ font-size:11px; color:var(--ink-soft); width:52px; flex:none; font-weight:600; }
.row .val{
  min-width:46px; text-align:right; font-family:"Courier New",monospace;
  font-size:11.5px; font-weight:700; color:var(--ink);
}
input[type=range]{
  flex:1; min-width:0; -webkit-appearance:none; appearance:none;
  height:16px; background:transparent; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:3px; border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 8px);
  opacity:.5;
}
input[type=range]::-moz-range-track{
  height:3px; border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 8px);
  opacity:.5;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:15px; height:15px; margin-top:-6px;
  border-radius:50% 45% 52% 48%; background:var(--paper-3);
  border:1.8px solid var(--ink); box-shadow:1px 1.5px 0 rgba(59,59,66,.25);
}
input[type=range]::-moz-range-thumb{
  width:14px; height:14px; border-radius:50%; background:var(--paper-3);
  border:1.8px solid var(--ink);
}
input[type=text]{
  font:inherit; font-size:12px; width:100%; padding:6px 8px;
  background:transparent; border:none; color:var(--ink);
  position:relative; z-index:1;
}
input[type=text]:focus{ outline:none; }
.field{ position:relative; margin-bottom:7px; }
.field::before{
  content:''; position:absolute; inset:0; border:1.2px solid var(--ink);
  border-radius:4px; opacity:.3; filter:url(#rough2); pointer-events:none;
}

.swatches{ display:flex; gap:7px; flex-wrap:wrap; }
.sw{
  width:33px; height:33px; cursor:pointer; position:relative;
  border-radius:50% 48% 52% 47%; padding:3px;
  display:flex; flex-wrap:wrap; overflow:hidden;
}
.sw::before{
  content:''; position:absolute; inset:0; border:1.5px solid var(--ink);
  border-radius:50% 48% 52% 47%; opacity:.3; filter:url(#rough2);
}
.sw.on::before{ opacity:1; border-width:2.2px; }
.sw.on::after{
  content:''; position:absolute; inset:-4px; border:1.2px dashed var(--accent);
  border-radius:50%; opacity:.85;
}
.sw i{ width:50%; height:50%; display:block; }

.note{ font-size:10px; color:var(--ink-faint); line-height:1.6; margin-top:7px; }

/* ---------- ビューポート ---------- */
#viewport{
  flex:1; position:relative; min-width:0; overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.5),transparent 60%),
    linear-gradient(160deg,#ddd6c4,#cec6b1 60%,#c4bca6);
  display:flex; align-items:center; justify-content:center;
  cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26'><g transform='rotate(35 13 13)'><rect x='11' y='3' width='4' height='15' fill='%23c9a227' stroke='%233b3b42' stroke-width='.8'/><path d='M11 18 L13 23 L15 18 Z' fill='%23f0e6d0' stroke='%233b3b42' stroke-width='.8'/><path d='M12.2 21 L13 23 L13.8 21 Z' fill='%233b3b42'/></g></svg>") 3 23, crosshair;
}
#sheetWrap{
  position:relative;
  box-shadow:0 10px 34px rgba(40,35,25,.35), 0 2px 6px rgba(40,35,25,.25);
  transition:transform .18s ease-out;
  will-change:transform;
}
#sheet{ display:block; background:#efe9db; }
#sheetWrap::after{
  /* 紙のめくれ影 */
  content:''; position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 0 60px rgba(90,78,55,.10);
}
.tape{
  position:absolute; width:74px; height:23px; background:var(--tape);
  border-left:1px solid rgba(255,255,255,.35); border-right:1px solid rgba(150,130,80,.3);
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.tape.tl{ left:-24px; top:-11px; transform:rotate(-38deg); }
.tape.tr{ right:-24px; top:-11px; transform:rotate(38deg); }
.tape.bl{ left:-24px; bottom:-11px; transform:rotate(38deg); }
.tape.br{ right:-24px; bottom:-11px; transform:rotate(-38deg); }

/* ---------- ツールバー ---------- */
.toolbar{
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
  display:flex; align-items:center; gap:6px; z-index:4;
  background:rgba(250,246,236,.94); padding:7px 12px;
  border-radius:24px 22px 25px 23px;
  box-shadow:0 5px 20px rgba(50,42,30,.22);
  flex-wrap:wrap; justify-content:center; max-width:min(94%,760px);
}
.toolbar::before{
  content:''; position:absolute; inset:0; border:1.5px solid var(--ink);
  border-radius:24px 22px 25px 23px; opacity:.5; filter:url(#rough);
  pointer-events:none;
}
.tbtn{
  font:inherit; font-size:11px; font-weight:600; cursor:pointer;
  padding:5px 10px 6px; background:transparent; color:var(--ink-soft);
  border:none; position:relative; white-space:nowrap;
}
.tbtn::before{
  content:''; position:absolute; inset:0; border:1.2px solid var(--ink);
  border-radius:12px 10px 13px 11px; opacity:.3; filter:url(#rough2);
}
.tbtn:hover{ color:var(--ink); } .tbtn:hover::before{ opacity:.62; }
.tbtn.on{ color:#fff; background:var(--ink); border-radius:12px 10px 13px 11px; }
.tbtn.on::before{ opacity:1; }
.tbtn.big{ font-size:11.5px; padding:6px 13px 7px; font-weight:700; color:var(--ink);
  background:rgba(138,90,60,.14); border-radius:12px 10px 13px 11px; }
.tbtn.big::before{ opacity:.75; }
.tsep{ width:1px; height:19px; background:var(--line); }

/* ---------- 右パネル ---------- */
.plate{ background:var(--paper-3); padding:11px 12px 12px; margin-bottom:13px; }
.plate h2{
  font-size:13px; font-weight:700; letter-spacing:.02em; margin-bottom:2px;
  font-family:"Courier New",monospace;
}
.plate .sub{ font-size:9.5px; color:var(--accent); letter-spacing:.16em; font-family:"Courier New",monospace; }
table.spec{ width:100%; border-collapse:collapse; font-size:10.5px; font-family:"Courier New",monospace; margin-top:8px; }
table.spec td{ padding:3.5px 2px; border-bottom:1px dotted var(--line); letter-spacing:.04em; }
table.spec td:first-child{ color:var(--ink-faint); width:44%; }
table.spec td:last-child{ text-align:right; font-weight:700; }
table.leg{ width:100%; border-collapse:collapse; font-size:10.5px; font-family:"Courier New",monospace; }
table.leg td{ padding:3px 2px; border-bottom:1px dotted var(--line); }
table.leg td.k{ width:16px; }
table.leg td.n{ text-align:right; font-weight:700; width:38px; }
table.leg i{ display:inline-block; width:10px; height:10px; border:1.2px solid var(--ink); border-radius:2px; }
.stat{ display:flex; justify-content:space-between; font-size:10.5px; font-family:"Courier New",monospace; padding:2.5px 0; color:var(--ink-soft); }
.stat b{ color:var(--ink); }

/* ---------- 進捗 ---------- */
#prog{
  position:absolute; left:50%; top:14px; transform:translateX(-50%);
  background:rgba(250,246,236,.95); padding:5px 14px 6px; border-radius:20px;
  font-size:10.5px; font-family:"Courier New",monospace; letter-spacing:.1em;
  display:flex; align-items:center; gap:9px; z-index:5;
  box-shadow:0 3px 12px rgba(50,42,30,.2);
}
#prog[hidden]{ display:none; }
#prog .bar{ width:96px; height:4px; background:rgba(59,59,66,.15); border-radius:3px; overflow:hidden; }
#prog .bar i{ display:block; height:100%; width:0; background:var(--accent); transition:width .1s linear; }
.pencil{ animation:scratch .45s infinite alternate ease-in-out; display:inline-block; }
@keyframes scratch{ from{ transform:translate(-1px,1px) rotate(-6deg);} to{ transform:translate(1px,-1px) rotate(4deg);} }

.hint{
  position:absolute; right:12px; bottom:16px; z-index:3;
  font-size:9.5px; color:rgba(60,52,40,.55); font-family:"Courier New",monospace;
  letter-spacing:.08em; text-align:right; line-height:1.7; pointer-events:none;
}
@media (max-width:1100px){
  aside{ width:232px; } aside.right{ width:246px; }
}
@media (max-width:820px){
  main{ flex-direction:column; }
  aside{ width:100%; max-height:172px; border-right:none; border-bottom:1.5px solid var(--line); padding-bottom:14px; }
  aside.right{ width:100%; max-height:210px; border-left:none; border-top:1.5px solid var(--line); }
  #viewport{ min-height:400px; flex:1 1 400px; }
  .grid2{ grid-template-columns:repeat(4,1fr); }
  .grid3{ grid-template-columns:repeat(6,1fr); }
  .sec{ margin-bottom:14px; }
  .row label{ width:44px; }
  h1{ font-size:13px; }
  .hint{ display:none; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="rough">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough2">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="ink">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="0.9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header>
  <h1><small>HAND-DRAWN SPECULATIVE ARCHITECTURE</small>SF建築 手描きドラフター</h1>
  <div class="genres" id="genres"></div>
  <div class="tabs" id="tabs"></div>
  <button class="tbtn big" id="btnRoll">🎲 新しい図面</button>
</header>

<main>
  <aside id="opts" class="hand"></aside>

  <div id="viewport">
    <div id="prog" hidden><span class="pencil">✎</span><span id="progTxt">DRAWING</span><span class="bar"><i id="progBar"></i></span></div>
    <div id="sheetWrap">
      <span class="tape tl"></span><span class="tape tr"></span>
      <span class="tape bl"></span><span class="tape br"></span>
      <canvas id="sheet"></canvas>
    </div>
    <div class="toolbar">
      <button class="tbtn" id="btnRotL">◀ 方位</button>
      <button class="tbtn" id="btnRotR">方位 ▶</button>
      <span class="tsep"></span>
      <button class="tbtn" id="btnZoomOut">−</button>
      <button class="tbtn" id="btnZoomIn">＋</button>
      <button class="tbtn" id="btnFit">原寸</button>
      <span class="tsep"></span>
      <button class="tbtn on" id="btnAnim">描画アニメ</button>
      <button class="tbtn" id="btnRedraw">引き直す</button>
      <span class="tsep"></span>
      <button class="tbtn" id="btnPng">PNG保存</button>
      <button class="tbtn" id="btnPng2">高解像度</button>
    </div>
    <div class="hint">DRAG: 図面を動かす<br>WHEEL: ズーム / R: 再抽選</div>
  </div>

  <aside class="right hand" id="info"></aside>
</main>

<script>
"use strict";
/* =========================================================================
   SF建築 手描きドラフター
   すべて手描き(鉛筆/色鉛筆)の質感で、架空のSF建築の等角図面を生成するエディター
   ========================================================================= */

/* ---------------- 乱数 (シード固定) ---------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let R = mulberry32(20270101);
const rnd = () => R();
const rr  = (a,b) => a + (b-a)*R();
const ri  = (a,b) => Math.floor(a + (b-a+1)*R());
const pick = a => a[Math.floor(R()*a.length)];
const chance = p => R() < p;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;

/* ---------------- 画材パレット ---------------- */
const PALETTES = {
  MONOCHROME:  { label:'モノクローム', cols:['#5a5a60','#6e6b64','#8a8577','#46464c'] },
  TRICHROIS:   { label:'ステンドグラス', cols:['#c2564e','#d8a93f','#3f8f8a','#4a72a8'] },
  CHEROKEE:    { label:'チェロキーレッド', cols:['#c4614c','#8a9a55','#d0a45a','#7a6a52'] },
  CHROMIUM:    { label:'オールドクローム', cols:['#5c7f96','#c07a3e','#7d9b6a','#9a8f7e'] },
  CYANOTYPE:   { label:'サイアノタイプ', cols:['#3d6b96','#5b8cb0','#2f4f74','#8fb2cb'] },
  EMBER:       { label:'エンバー', cols:['#b8503a','#d98b3c','#8c3b30','#e0b26a'] },
  MOSS:        { label:'モス', cols:['#5e7d4f','#8fa06a','#3f5b45','#b6b06f'] },
  NEON:        { label:'ネオンヴァイオレット', cols:['#7a5aa8','#c05a92','#4a8fb0','#d0a05a'] },
};

const PAPERS = {
  STANDARD: { label:'ケント紙', base:'#f5f1e6', grain:.045, warm:1.0 },
  ROUGH:    { label:'ラフ紙',   base:'#f2ecdf', grain:.075, warm:1.02 },
  VELLUM:   { label:'トレペ',   base:'#f8f6ec', grain:.030, warm:.98 },
  BLUEGRID: { label:'方眼紙',   base:'#f0f2ec', grain:.042, warm:.93, grid:true },
};

/* ---------------- ジャンルとモード ---------------- */
const MODES = {
  /* 建築 */
  thinshell:   { g:'arch', no:'01', jp:'シンシェル',      en:'THIN SHELL',    sheet:'THIN SHELL DIAGRAM' },
  modernisme:  { g:'arch', no:'02', jp:'モデルニスモ',    en:'MODERNISME',    sheet:'MODERNISME DIAGRAM' },
  geodesic:    { g:'arch', no:'03', jp:'ジオデシック',    en:'GEODESIC',      sheet:'GEODESIC DIAGRAM' },
  prairie:     { g:'arch', no:'04', jp:'プレーリー',      en:'PRAIRIE',       sheet:'PRAIRIE DIAGRAM' },
  metabolism:  { g:'arch', no:'05', jp:'メタボリズム',    en:'METABOLISM',    sheet:'CAPSULE DIAGRAM' },
  arcology:    { g:'arch', no:'06', jp:'アーコロジー',    en:'ARCOLOGY',      sheet:'ARCOLOGY DIAGRAM' },
  orbital:     { g:'arch', no:'07', jp:'オービタル',      en:'ORBITAL',       sheet:'ORBITAL DIAGRAM' },
  brutalist:   { g:'arch', no:'08', jp:'ブルータリズム',  en:'BRUTALIST',     sheet:'MONOLITH DIAGRAM' },
  /* ロボット */
  laborer:     { g:'mecha', no:'01', jp:'労働機',   en:'LABORER',   sheet:'LABOR FRAME DIAGRAM' },
  tactical:    { g:'mecha', no:'02', jp:'戦術機',   en:'TACTICAL',  sheet:'TACTICAL FRAME DIAGRAM' },
  artillery:   { g:'mecha', no:'03', jp:'重砲機',   en:'ARTILLERY', sheet:'SIEGE FRAME DIAGRAM' },
  colossus:    { g:'mecha', no:'04', jp:'巨神',     en:'COLOSSUS',  sheet:'COLOSSUS DIAGRAM' },
  /* 航空機 */

/* ---------------- 紙テクスチャ ---------------- */
let paperTex = null, paperKey = '';
function makePaper(w,h,type){
  const P = PAPERS[type];
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const g = c.getContext('2d');
  g.fillStyle = P.base; g.fillRect(0,0,w,h);
  // 大きなムラ
  const rr2 = mulberry32(999);
  for(let i=0;i<70;i++){
    const x=rr2()*w, y=rr2()*h, r=60+rr2()*260;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    const dark = rr2()<.5;
    gr.addColorStop(0, dark?'rgba(120,105,80,.045)':'rgba(255,253,245,.06)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  // 粒子
  const id = g.getImageData(0,0,w,h), d = id.data, amp = P.grain*255;
  for(let i=0;i<d.length;i+=4){
    const n = (rr2()-.5)*amp;
    d[i]=clamp(d[i]+n*1.02,0,255); d[i+1]=clamp(d[i+1]+n,0,255); d[i+2]=clamp(d[i+2]+n*.94,0,255);
  }
  g.putImageData(id,0,0);
  // 繊維
  g.globalAlpha=.05; g.strokeStyle='#8a7c60'; g.lineWidth=.6;
  for(let i=0;i<160;i++){
    const x=rr2()*w, y=rr2()*h, a=rr2()*6.28, l=6+rr2()*30;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke();
  }
  // 方眼
  if(P.grid){
    g.globalAlpha=.18; g.strokeStyle='#7b93a8'; g.lineWidth=.5;
    for(let x=0;x<w;x+=w/90){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
    for(let y=0;y<h;y+=w/90){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  }
  // 折り目・汚れ
  g.globalAlpha=.05; g.strokeStyle='#6b5c40'; g.lineWidth=1.4;
  for(let i=0;i<3;i++){
    const vert = rr2()<.5;
    const p = (.2+rr2()*.6);
    g.beginPath();
    if(vert){ g.moveTo(w*p,0); g.lineTo(w*p+ (rr2()-.5)*10, h); } else { g.moveTo(0,h*p); g.lineTo(w, h*p+(rr2()-.5)*10); }
    g.stroke();
  }
  g.globalAlpha=1;
  return c;
}
function paperFor(type){
  const key = type+'@'+SW+'x'+SH;
  if(key!==paperKey){ paperTex = makePaper(SW,SH,type); paperKey=key; }
  return paperTex;
}

/* ---------------- 投影 ---------------- */
const V = { rot:0, s:1, cx:SW/2, cy:SH*0.60 };
const C30 = Math.cos(Math.PI/6), S30 = 0.5;
let MEASURE = false, BX = null;
let TR = null;   /* {ox,oy,oz,s,rz} 機体を並べるときの配置変換 */
function TX(x,y,z){
  if(!TR) return [x,y,z];
  const c=Math.cos(TR.rz), s=Math.sin(TR.rz);
  return [TR.ox+(x*c-y*s)*TR.s, TR.oy+(x*s+y*c)*TR.s, TR.oz+z*TR.s];
}
function P(x,y,z){
  if(TR){ const t=TX(x,y,z); x=t[0]; y=t[1]; z=t[2]; }
  const c = Math.cos(V.rot), s = Math.sin(V.rot);
  const X = x*c - y*s, Y = x*s + y*c;
  const px = V.cx + (X - Y)*C30*V.s, py = V.cy + ((X + Y)*S30 - z)*V.s;
  if(MEASURE){
    if(px<BX.x0)BX.x0=px; if(px>BX.x1)BX.x1=px;
    if(py<BX.y0)BX.y0=py; if(py>BX.y1)BX.y1=py;
  }
  return [px,py];
}
function DEP(x,y,z){
  if(TR){ const t=TX(x,y,z); x=t[0]; y=t[1]; z=t[2]; }
  const c = Math.cos(V.rot), s = Math.sin(V.rot);
  return (x*c - y*s) + (x*s + y*c) + z*0.9;
}

/* ---------------- 鉛筆ストローク ---------------- */
let INK = 'rgba(62,60,64,1)';
let INKW = 1.0;
let ROUGH = 1.0;

function wob(a,b,amp){
  const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||.001;
  const n = clamp(Math.round(len/18), 2, 14);
  const nx=-dy/len, ny=dx/len;
  const bow = (R()*2-1) * Math.min(2.6, len*0.014) * amp;
  const pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n, env=Math.sin(Math.PI*t);
    const d = bow*env + (R()*2-1)*0.42*amp;
    pts.push([a[0]+dx*t+nx*d, a[1]+dy*t+ny*d]);
  }
  return pts;
}
function stroke(pts,o){
  if(MEASURE) return;
  o = o||{};
  const col = o.color||INK, w = (o.w!=null?o.w:1)*INKW;
  const a = (o.a!=null?o.a:.80), passes = o.passes!=null?o.passes:2;
  const j = (o.jit!=null?o.jit:.5)*ROUGH;
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=col;
  strokes++;
  for(let p=0;p<passes;p++){
    const ox=(R()*2-1)*j*.8, oy=(R()*2-1)*j*.8;
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const x=pts[i][0]+ox+(R()*2-1)*j*.35, y=pts[i][1]+oy+(R()*2-1)*j*.35;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.globalAlpha = a*(p===0?1:.5+R()*.25);
    ctx.lineWidth = w*(p===0?1:.72);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
/* 2D 線 */
function ln2(a,b,o){
  if(MEASURE) return;
  o=o||{};
  const amp = o.amp!=null?o.amp:1;
  let A=a, B=b;
  if(o.over){ // 描き越し
    const dx=B[0]-A[0], dy=B[1]-A[1], L=Math.hypot(dx,dy)||1;
    const e=o.over*ROUGH;
    A=[A[0]-dx/L*e*R(), A[1]-dy/L*e*R()];
    B=[B[0]+dx/L*e*R(), B[1]+dy/L*e*R()];
  }
  stroke(wob(A,B,amp), o);
}
/* 3D 線 */
function ln3(p,q,o){ ln2(P(p[0],p[1],p[2]), P(q[0],q[1],q[2]), o); }
/* 3D ポリライン */
function poly3(list,o){
  const pts=list.map(p=>P(p[0],p[1],p[2]));
  for(let i=0;i<pts.length-1;i++) ln2(pts[i],pts[i+1],o);
}
function poly2(pts,o,close){
  for(let i=0;i<pts.length-1;i++) ln2(pts[i],pts[i+1],o);
  if(close) ln2(pts[pts.length-1],pts[0],o);
}

/* ---------------- 色鉛筆ハッチング ---------------- */
function hatch2(pts, o){
  if(MEASURE) return;
  o=o||{};
  const col = o.color||'#888';
  const sp  = o.sp || 4.2;
  const ang = o.ang!=null?o.ang : -Math.PI/4;
  const a   = (o.a!=null?o.a:.20) * (S.color/42);
  if(a<=0.005 || pts.length<3) return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  const w=x1-x0, h=y1-y0;
  if(w<1.2||h<1.2) return;
  ctx.save();
  ctx.beginPath();
  pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.closePath();
  ctx.clip();
  if(o.wash){ ctx.globalAlpha=a*.55; ctx.fillStyle=col; ctx.fillRect(x0-2,y0-2,w+4,h+4); }
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const dx=Math.cos(ang), dy=Math.sin(ang);
  const nx=-dy, ny=dx;
  const L=Math.hypot(w,h)*.62;
  const steps=Math.ceil(L*2/sp);
  ctx.strokeStyle=col; ctx.lineCap='round';
  ctx.globalCompositeOperation='multiply';
  for(let i=-steps;i<=steps;i++){
    const off=i*sp + (R()*2-1)*sp*.22;
    const sx=cx+nx*off, sy=cy+ny*off;
    // ペンシルらしく途切れさせる
    let t0=-L, t1=L;
    if(R()<.30){ t0 += R()*L*.7; }
    if(R()<.30){ t1 -= R()*L*.7; }
    const A=[sx+dx*t0,sy+dy*t0], B=[sx+dx*t1,sy+dy*t1];
    ctx.globalAlpha = a*(.55+R()*.75);
    ctx.lineWidth = (o.w||1.05)*(.75+R()*.6);
    const seg = wob(A,B,1.1);
    ctx.beginPath();
    seg.forEach((p,k)=> k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.stroke();
  }
  if(o.cross){
    const dx2=Math.cos(ang+1.15), dy2=Math.sin(ang+1.15);
    const nx2=-dy2, ny2=dx2;
    for(let i=-steps;i<=steps;i+=1){
      const off=i*sp*1.5 + (R()*2-1)*sp*.2;
      const sx=cx+nx2*off, sy=cy+ny2*off;
      ctx.globalAlpha = a*(.35+R()*.45);
      ctx.lineWidth = (o.w||1)*(.7+R()*.5);
      const seg = wob([sx+dx2*-L,sy+dy2*-L],[sx+dx2*L,sy+dy2*L],1.1);
      ctx.beginPath();
      seg.forEach((p,k)=> k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.restore();
}
let SOL=0, PAPERC='#f0ebdd';
function fillPoly(pts,c,a){
  if(MEASURE||!a||pts.length<3) return;
  ctx.save(); ctx.beginPath();
  pts.forEach(function(p,i){ i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
  ctx.closePath(); ctx.globalAlpha=a; ctx.fillStyle=c; ctx.fill(); ctx.restore();
}
function face3(list,o){
  o=o||{};
  const pts=list.map(p=>P(p[0],p[1],p[2]));
  if(o.solid) fillPoly(pts,PAPERC,o.solid);
  if(o.color) hatch2(pts,o);
  if(o.edge!==false) poly2(pts,{w:o.w||.9,a:o.ea!=null?o.ea:.78,passes:o.passes||1,over:o.over||1.5},true);
  return pts;
}

let OPS = [];
function op(d,f){
  const tr=TR;
  OPS.push({d:d,c:CTXMODE,f:tr? function(){ const s=TR; TR=tr; f(); TR=s; } : f});
}

/* 可視面の判定 */
function visX(){ const c=Math.cos(V.rot), s=Math.sin(V.rot); return (c+s)>0?1:-1; }
function visY(){ const c=Math.cos(V.rot), s=Math.sin(V.rot); return (c-s)>0?1:-1; }

/* 凡例カウンタ */
let LEG = [];
let CTXMODE=false;
function leg(name,n){
  const f = LEG.find(l=>l.name===name);
  if(f) f.n += n; else LEG.push({name:name, n:n, ci:LEG.length});
}

/* パレット取得 */
let COLS = PALETTES.MONOCHROME.cols;
const col = i => COLS[((i%COLS.length)+COLS.length)%COLS.length];

/* =========================================================================
   基本立体
   ========================================================================= */
/* 直方体 */
function prism(x,y,z,w,d,h,o){
  o = o||{};
  op(o.dep!=null?o.dep:DEP(x+w/2,y+d/2,z+h/2), function(){ drawPrism(x,y,z,w,d,h,o); });
}
function drawPrism(x,y,z,w,d,h,o){
  const x2=x+w, y2=y+d, z2=z+h;
  const sx=visX(), sy=visY();
  const fx = sx>0?x2:x, bx = sx>0?x:x2;
  const fy = sy>0?y2:y, by = sy>0?y:y2;
  const a = o.a!=null?o.a:.17;
  const c = o.col||null;
  const sp = o.sp||4.4;
  const lw = o.lw||1;
  const ea = o.ea!=null?o.ea:.80;

  /* 隠れ線(薄く) */
  if(o.hidden!==false && S.detail!=='MINIMAL'){
    const hl={w:.55,a:.13,passes:1,jit:.5};
    ln3([bx,by,z],[bx,by,z2],hl);
    ln3([bx,by,z],[fx,by,z],hl); ln3([bx,by,z],[bx,fy,z],hl);
  }
  /* 面 */
  const fX=[[fx,y,z],[fx,y2,z],[fx,y2,z2],[fx,y,z2]];
  const fY=[[x,fy,z],[x2,fy,z],[x2,fy,z2],[x,fy,z2]];
  const fT=[[x,y,z2],[x2,y,z2],[x2,y2,z2],[x,y2,z2]];
  if(o.order==='topfirst'){
    face3(fT,{color:c,a:a*.62,sp:sp*1.15,ang:-1.25,w:lw,ea:ea,wash:o.wash});
    face3(fX,{color:c,a:a,sp:sp,ang:-0.52,w:lw,ea:ea,wash:o.wash});
    face3(fY,{color:c,a:a*1.22,sp:sp*.94,ang:0.55,w:lw,ea:ea,wash:o.wash,cross:o.cross});
  }else{
    face3(fX,{color:c,a:a,sp:sp,ang:-0.52,w:lw,ea:ea,wash:o.wash});
    face3(fY,{color:c,a:a*1.22,sp:sp*.94,ang:0.55,w:lw,ea:ea,wash:o.wash,cross:o.cross});
    if(h>0.01) face3(fT,{color:c,a:a*.62,sp:sp*1.15,ang:-1.25,w:lw,ea:ea,wash:o.wash});
  }
  /* 立面の割付 */
  if(o.fl){
    const fine={w:.5,a:.30,passes:1,jit:.4};
    for(let i=1;i<o.fl;i++){
      const zz=z+h*i/o.fl;
      ln3([fx,y,zz],[fx,y2,zz],fine);
      ln3([x,fy,zz],[x2,fy,zz],fine);
    }
  }
  if(o.win){
    winGrid([fx,y,z],[fx,y2,z],[fx,y2,z2],[fx,y,z2], o.win, o.fl||Math.max(1,Math.round(h/14)), o);
    winGrid([x,fy,z],[x2,fy,z],[x2,fy,z2],[x,fy,z2], o.win, o.fl||Math.max(1,Math.round(h/14)), o);
  }
}
/* 面上の窓割り */
function winGrid(p00,p10,p11,p01,nu,nv,o){
  const at=(u,v)=>[
    p00[0]+(p10[0]-p00[0])*u+(p01[0]-p00[0])*v+(p11[0]-p10[0]-p01[0]+p00[0])*u*v,
    p00[1]+(p10[1]-p00[1])*u+(p01[1]-p00[1])*v+(p11[1]-p10[1]-p01[1]+p00[1])*u*v,
    p00[2]+(p10[2]-p00[2])*u+(p01[2]-p00[2])*v+(p11[2]-p10[2]-p01[2]+p00[2])*u*v ];
  const fine={w:.5,a:.34,passes:1,jit:.45};
  for(let i=0;i<nu;i++){
    for(let j=0;j<nv;j++){
      if(R()<.14) continue;
      const u0=(i+.22)/nu, u1=(i+.80)/nu, v0=(j+.26)/nv, v1=(j+.78)/nv;
      const q=[at(u0,v0),at(u1,v0),at(u1,v1),at(u0,v1)].map(p=>P(p[0],p[1],p[2]));
      if(o&&o.winCol && R()<.55) hatch2(q,{color:o.winCol,a:.22,sp:3,ang:-.5});
      poly2(q,fine,true);
    }
  }
}
/* 4点で張る格子面(メッシュ・グレージング・床グリッド) */
function quadGrid(p00,p10,p11,p01,nu,nv,o){
  o=o||{};
  const at=(u,v)=>[
    p00[0]+(p10[0]-p00[0])*u+(p01[0]-p00[0])*v+(p11[0]-p10[0]-p01[0]+p00[0])*u*v,
    p00[1]+(p10[1]-p00[1])*u+(p01[1]-p00[1])*v+(p11[1]-p10[1]-p01[1]+p00[1])*u*v,
    p00[2]+(p10[2]-p00[2])*u+(p01[2]-p00[2])*v+(p11[2]-p10[2]-p01[2]+p00[2])*u*v ];
  const st={w:o.w||.6,a:o.a!=null?o.a:.40,passes:1,jit:.45,color:o.color};
  for(let i=0;i<=nu;i++) ln3(at(i/nu,0),at(i/nu,1),st);
  for(let j=0;j<=nv;j++) ln3(at(0,j/nv),at(1,j/nv),st);
  if(o.diag) for(let i=0;i<nu;i++) for(let j=0;j<nv;j++)
    ln3(at(i/nu,j/nv),at((i+1)/nu,(j+1)/nv),{w:.45,a:.20,passes:1,jit:.5});
}
/* 柱(テーパー付き・節あり) */
function column(x,y,z,h,r,o){
  o=o||{};
  op(DEP(x,y,z+h/2), function(){
    const taper = o.taper!=null?o.taper:.72;
    const seg = o.seg||4;
    const st={w:o.w||1.05,a:.66,passes:2,jit:.5};
    const rt = r*taper;
    for(const s of [-1,1]){
      const pts=[];
      for(let i=0;i<=seg;i++){
        const t=i/seg, rr2=lerp(r,rt,t);
        const bulge = o.organic? Math.sin(t*Math.PI*2.2+ (x+y))*r*.22 : 0;
        pts.push(P(x+s*(rr2+bulge)*.7, y-s*(rr2+bulge)*.7, z+h*t));
      }
      poly2(pts,st,false);
    }
    /* 手前側の稜線 */
    {
      const pts=[];
      for(let i=0;i<=seg;i++){
        const t=i/seg, rr2=lerp(r,rt,t);
        pts.push(P(x+rr2*.7, y+rr2*.7, z+h*t));
      }
      poly2(pts,{w:(o.w||1.05)*.7,a:.34,passes:1,jit:.5},false);
    }
    /* 節 */
    if(S.detail!=='MINIMAL'){
      for(let i=1;i<seg;i++){
        const t=i/seg, rr2=lerp(r,rt,t);
        ln3([x-rr2*.7,y+rr2*.7,z+h*t],[x+rr2*.7,y-rr2*.7,z+h*t],{w:.5,a:.3,passes:1});
      }
    }
    if(o.col) hatch2([P(x-r*.7,y+r*.7,z),P(x+r*.7,y-r*.7,z),P(x+rt*.7,y-rt*.7,z+h),P(x-rt*.7,y+rt*.7,z+h)],
      {color:o.col,a:.20,sp:3.6,ang:-1.35});
    /* 頭部ブラケット */
    if(o.cap){
      const cr=r*o.cap;
      for(let k=0;k<4;k++){
        const a=k*Math.PI/2+Math.PI/4;
        ln3([x,y,z+h-o.capH*1.0],[x+Math.cos(a)*cr,y+Math.sin(a)*cr,z+h],{w:.8,a:.5,passes:1});
      }
    }
    /* 基礎 */
    if(o.base){
      const b=r*2.2;
      face3([[x-b,y-b,z],[x+b,y-b,z],[x+b,y+b,z],[x-b,y+b,z]],{color:o.col,a:.10,sp:5,ang:-.9,w:.7,ea:.45});
    }
  });
}
/* ラチス柱(4本組+ブレース) */
function lattice(x,y,z,h,r,o){
  o=o||{};
  op(DEP(x,y,z+h/2), function(){
    const st={w:1.0,a:.68,passes:2,jit:.45};
    const c=[[x-r,y-r],[x+r,y-r],[x+r,y+r],[x-r,y+r]];
    for(const p of c) ln3([p[0],p[1],z],[p[0],p[1],z+h],st);
    const n=o.rings||Math.max(3,Math.round(h/16));
    for(let i=0;i<=n;i++){
      const zz=z+h*i/n;
      for(let k=0;k<4;k++){
        const a=c[k], b=c[(k+1)%4];
        ln3([a[0],a[1],zz],[b[0],b[1],zz],{w:.62,a:.5,passes:1,jit:.4});
      }
      if(i<n){
        const z2=z+h*(i+1)/n;
        for(let k=0;k<4;k++){
          const a=c[k], b=c[(k+1)%4];
          ln3([a[0],a[1],zz],[b[0],b[1],z2],{w:.5,a:.36,passes:1,jit:.5});
        }
      }
    }
  });
}
/* 回転体(ドーム/シェル/リング) */
function revolve(cx,cy,cz,fn,nu,nv,o){
  o=o||{};
  op(o.dep!=null?o.dep:DEP(cx,cy,cz), function(){
    const at=(u,v)=>{ const p=fn(u,v); return [cx+p[0],cy+p[1],cz+p[2]]; };
    const st={w:o.w||.62,a:o.a!=null?o.a:.50,passes:1,jit:.45};
    for(let i=0;i<nu;i++){
      const pts=[];
      for(let j=0;j<=nv;j++) pts.push(P.apply(null,at(i/nu,j/nv)));
      poly2(pts,st,false);
    }
    for(let j=0;j<=nv;j++){
      const pts=[];
      for(let i=0;i<=nu;i++) pts.push(P.apply(null,at(i/nu,j/nv)));
      pts.push(pts[0]);
      poly2(pts,st,false);
    }
    if(o.geo){ /* 三角分割(ジオデシック) */
      for(let j=0;j<nv;j++) for(let i=0;i<nu;i++){
        const A=P.apply(null,at(i/nu,j/nv)), B=P.apply(null,at((i+1)/nu,(j+1)/nv));
        ln2(A,B,{w:.42,a:.26,passes:1,jit:.5});
      }
    }
    if(o.col){
      for(let j=0;j<nv;j+=1) for(let i=0;i<nu;i+=1){
        if(R()>(o.fillP!=null?o.fillP:.3)) continue;
        const q=[at(i/nu,j/nv),at((i+1)/nu,j/nv),at((i+1)/nu,(j+1)/nv),at(i/nu,(j+1)/nv)].map(p=>P(p[0],p[1],p[2]));
        hatch2(q,{color:o.col,a:.20,sp:3,ang:-.6+R()*.4});
      }
    }
  });
}
function domeFn(r,rz,open){
  return (u,v)=>{
    const a=u*Math.PI*2, b=(open? .12+v*.88 : v)*Math.PI/2;
    return [Math.cos(a)*r*Math.cos(b), Math.sin(a)*r*Math.cos(b), Math.sin(b)*rz];
  };
}
function sphereFn(r){
  return (u,v)=>{
    const a=u*Math.PI*2, b=(v-.5)*Math.PI*.96;
    return [Math.cos(a)*r*Math.cos(b), Math.sin(a)*r*Math.cos(b), Math.sin(b)*r];
  };
}
function ringFn(R0,r0){
  return (u,v)=>{
    const a=u*Math.PI*2, b=v*Math.PI*2;
    return [(R0+r0*Math.cos(b))*Math.cos(a), (R0+r0*Math.cos(b))*Math.sin(a), r0*Math.sin(b)];
  };
}
/* 波打つ薄殻キャノピー */
function shellField(cx,cy,cz,w,d,nu,nv,amp,o){
  o=o||{};
  op(DEP(cx,cy,cz+amp), function(){
    const hgt=(u,v)=>{
      const X=(u-.5)*2, Y=(v-.5)*2;
      const scal=(o.mods||2);
      return Math.cos(X*Math.PI*scal)*Math.cos(Y*Math.PI*scal)*amp
           - (X*X+Y*Y)*amp*.16;
    };
    const at=(u,v)=>[cx+(u-.5)*w, cy+(v-.5)*d, cz+hgt(u,v)];
    const st={w:o.w||.5,a:o.a!=null?o.a:.42,passes:1,jit:.5};
    for(let i=0;i<=nu;i++){
      const pts=[]; for(let j=0;j<=nv;j++) pts.push(P.apply(null,at(i/nu,j/nv)));
      poly2(pts,st,false);
    }
    for(let j=0;j<=nv;j++){
      const pts=[]; for(let i=0;i<=nu;i++) pts.push(P.apply(null,at(i/nu,j/nv)));
      poly2(pts,st,false);
    }
    /* 縁を強調 */
    const edge={w:1.15,a:.72,passes:2,jit:.5};
    for(const uv of [[0,null],[1,null]]){
      const pts=[]; for(let j=0;j<=nv;j++) pts.push(P.apply(null,at(uv[0],j/nv)));
      poly2(pts,edge,false);
    }
    for(const uv of [[null,0],[null,1]]){
      const pts=[]; for(let i=0;i<=nu;i++) pts.push(P.apply(null,at(i/nu,uv[1])));
      poly2(pts,edge,false);
    }
    if(o.col){
      for(let i=0;i<nu;i++) for(let j=0;j<nv;j++){
        if(R()>.22) continue;
        const q=[at(i/nu,j/nv),at((i+1)/nu,j/nv),at((i+1)/nu,(j+1)/nv),at(i/nu,(j+1)/nv)].map(p=>P(p[0],p[1],p[2]));
        hatch2(q,{color:o.col,a:.18,sp:3.2,ang:-.7});
      }
    }
  });
}
/* 傘(パラソル) */
function parasol(x,y,z,r,h,ribs,o){
  o=o||{};
  op(DEP(x,y,z), function(){
    const st={w:.6,a:.45,passes:1,jit:.45};
    for(let k=0;k<ribs;k++){
      const a=k/ribs*Math.PI*2;
      ln3([x,y,z+h],[x+Math.cos(a)*r,y+Math.sin(a)*r,z],st);
    }
    for(const t of [.55,1]){
      const pts=[];
      for(let k=0;k<=ribs;k++){
        const a=k/ribs*Math.PI*2;
        pts.push(P(x+Math.cos(a)*r*t, y+Math.sin(a)*r*t, z+h*(1-t)));
      }
      poly2(pts,{w:.7,a:.5,passes:1,jit:.45},false);
    }
    if(o.col){
      const pts=[]; for(let k=0;k<=ribs;k++){ const a=k/ribs*Math.PI*2; pts.push(P(x+Math.cos(a)*r,y+Math.sin(a)*r,z)); }
      hatch2(pts,{color:o.col,a:.13,sp:4,ang:-.8});
    }
  });
}
/* 尖塔 */
function spire(x,y,z,h,r,o){
  o=o||{};
  op(DEP(x,y,z+h*.6), function(){
    const st={w:.85,a:.6,passes:2,jit:.5};
    const n=6;
    for(const s of [[-1,0],[1,0],[0,-1],[0,1]]){
      const pts=[];
      for(let i=0;i<=n;i++){
        const t=i/n, rr2=r*(1-t)*(1-t*.2);
        pts.push(P(x+s[0]*rr2, y+s[1]*rr2, z+h*t));
      }
      poly2(pts,st,false);
    }
    for(let i=1;i<n;i++){
      const t=i/n, rr2=r*(1-t)*(1-t*.2);
      const pts=[];
      for(let k=0;k<=4;k++){ const a=k*Math.PI/2; pts.push(P(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2,z+h*t)); }
      poly2(pts,{w:.5,a:.32,passes:1},false);
      if(o.knob && i%2===0) circle3(x,y,z+h*t,r*.55,{w:.6,a:.4});
    }
    if(o.cross){
      ln3([x,y,z+h],[x,y,z+h+r*2.2],{w:.9,a:.6,passes:2});
      ln3([x-r*.9,y,z+h+r*1.5],[x+r*.9,y,z+h+r*1.5],{w:.9,a:.6,passes:2});
      ln3([x,y-r*.9,z+h+r*1.5],[x,y+r*.9,z+h+r*1.5],{w:.9,a:.6,passes:2});
    }
    if(o.col){
      hatch2([P(x-r,y-r,z),P(x+r,y+r,z),P(x,y,z+h)],{color:o.col,a:.16,sp:3.4,ang:-1.1});
    }
  });
}
/* 切妻屋根 */
function gable(x,y,z,w,d,h,o){
  o=o||{};
  op(DEP(x+w/2,y+d/2,z+h*.6), function(){
    const mx=x+w/2;
    const a=o.a!=null?o.a:.18;
    face3([[x,y,z],[x,y+d,z],[mx,y+d,z+h],[mx,y,z+h]],{color:o.col,a:a,sp:4,ang:-.6,w:1.0,ea:.78});
    face3([[x+w,y,z],[x+w,y+d,z],[mx,y+d,z+h],[mx,y,z+h]],{color:o.col,a:a*1.2,sp:4,ang:.6,w:1.0,ea:.78});
    face3([[x,y,z],[x+w,y,z],[mx,y,z+h]],{color:o.col,a:a*.7,sp:5,ang:-1.2,w:.9,ea:.7});
    face3([[x,y+d,z],[x+w,y+d,z],[mx,y+d,z+h]],{color:o.col,a:a*.7,sp:5,ang:-1.2,w:.9,ea:.7});
    const n=Math.max(2,Math.round(d/9));
    for(let i=1;i<n;i++){
      const yy=y+d*i/n;
      ln3([x,yy,z],[mx,yy,z+h],{w:.5,a:.3,passes:1});
      ln3([x+w,yy,z],[mx,yy,z+h],{w:.5,a:.3,passes:1});
    }
  });
}
/* 3D 円(水平) */
function circle3(x,y,z,r,o){
  const pts=[];
  for(let k=0;k<=28;k++){ const a=k/28*Math.PI*2; pts.push(P(x+Math.cos(a)*r,y+Math.sin(a)*r,z)); }
  poly2(pts,o||{w:.6,a:.4,passes:1},false);
  return pts;
}
/* 樹木(スクリブル) */
function tree(x,y,z,s,c){
  op(DEP(x,y,z+s), function(){
    const b=P(x,y,z), t=P(x,y,z+s*1.1);
    ln2(b,t,{w:.7,a:.5,passes:1,jit:.4});
    const cx=t[0], cy=t[1], r=s*V.s*.42;
    const st={w:.6,a:.42,passes:1,jit:.6};
    for(let k=0;k<3;k++){
      const pts=[];
      const n=13, rr2=r*(.7+k*.16);
      for(let i=0;i<=n;i++){
        const a=i/n*Math.PI*2;
        const rad=rr2*(.78+R()*.44);
        pts.push([cx+Math.cos(a)*rad, cy+Math.sin(a)*rad*.85-r*.5]);
      }
      poly2(pts,st,true);
    }
    if(c) hatch2([[cx-r,cy-r*1.3],[cx+r,cy-r*1.3],[cx+r,cy+r*.4],[cx-r,cy+r*.4]],{color:c,a:.16,sp:3,ang:-.7});
  });
}
/* 人物(スケール表示) */
function figure(x,y,z){
  op(DEP(x,y,z+2), function(){
    const b=P(x,y,z), h=5.6*V.s;
    const st={w:.65,a:.5,passes:1,jit:.35};
    ln2([b[0],b[1]],[b[0],b[1]-h*.62],st);
    ln2([b[0],b[1]-h*.62],[b[0]-h*.2,b[1]-h*.42],st);
    ln2([b[0],b[1]-h*.62],[b[0]+h*.2,b[1]-h*.42],st);
    ln2([b[0],b[1]],[b[0]-h*.16,b[1]+h*.02],st);
    const pts=[]; for(let i=0;i<=9;i++){ const a=i/9*6.283; pts.push([b[0]+Math.cos(a)*h*.11, b[1]-h*.75+Math.sin(a)*h*.11]); }
    poly2(pts,st,true);
  });
}
/* 低木・岩・瓦礫 */
function scrub(x,y,z,s){
  op(DEP(x,y,z), function(){
    const b=P(x,y,z), r=s*V.s;
    const st={w:.55,a:.4,passes:1,jit:.6};
    for(let k=0;k<2;k++){
      const pts=[]; const n=9;
      for(let i=0;i<=n;i++){ const a=i/n*6.283; pts.push([b[0]+Math.cos(a)*r*(.6+R()*.6), b[1]+Math.sin(a)*r*.5*(.6+R()*.6)]); }
      poly2(pts,st,true);
    }
  });
}

/* =========================================================================
   ベクトル演算 — 機械・船体など、軸に沿わない立体のために
   ========================================================================= */
const vad=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const vsb=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const vml=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const vlp=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const vln=a=>Math.hypot(a[0],a[1],a[2]);
const vnm=a=>{ const l=vln(a)||1; return [a[0]/l,a[1]/l,a[2]/l]; };
const vcr=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
/* 軸に直交する正規直交基底 */
function frame(w){
  w=vnm(w);
  const t = Math.abs(w[2])>.88 ? [1,0,0] : [0,0,1];
  const u = vnm(vcr(t,w));
  return [u, vcr(w,u), w];
}
/* 視線に対して面が手前を向いているか */
function facing(n){
  const c=Math.cos(V.rot), s=Math.sin(V.rot);
  return (n[0]*c-n[1]*s) + (n[0]*s+n[1]*c) + n[2];
}
const HANG=[-0.52, 0.55, -1.25];  /* 面ごとのハッチ角 */

/* =========================================================================
   自由な向きの立体
   ========================================================================= */
/* 任意方向の直方体: 中心 c と 3本の半径ベクトル */
function ebox(c,ax,ay,az,o){
  o=o||{};
  op(o.dep!=null?o.dep:DEP(c[0],c[1],c[2]), function(){ drawEbox(c,ax,ay,az,o); });
}
function drawEbox(c,ax,ay,az,o){
  const C=(sx,sy,sz)=>[c[0]+sx*ax[0]+sy*ay[0]+sz*az[0],
                       c[1]+sx*ax[1]+sy*ay[1]+sz*az[1],
                       c[2]+sx*ax[2]+sy*ay[2]+sz*az[2]];
  const F=[
    {n:ax,           a:HANG[0], p:[C(1,-1,-1),C(1,1,-1),C(1,1,1),C(1,-1,1)]},
    {n:vml(ax,-1),   a:HANG[0], p:[C(-1,-1,-1),C(-1,-1,1),C(-1,1,1),C(-1,1,-1)]},
    {n:ay,           a:HANG[1], p:[C(-1,1,-1),C(-1,1,1),C(1,1,1),C(1,1,-1)]},
    {n:vml(ay,-1),   a:HANG[1], p:[C(-1,-1,-1),C(1,-1,-1),C(1,-1,1),C(-1,-1,1)]},
    {n:az,           a:HANG[2], p:[C(-1,-1,1),C(1,-1,1),C(1,1,1),C(-1,1,1)]},
    {n:vml(az,-1),   a:HANG[2], p:[C(-1,-1,-1),C(-1,1,-1),C(1,1,-1),C(1,-1,-1)]},
  ];
  const a = o.a!=null?o.a:.20, lw=o.lw||1, ea=o.ea!=null?o.ea:.78;
  const back=[], front=[];
  for(const f of F) (facing(f.n)>0?front:back).push(f);
  if(o.hidden!==false && S.detail!=='MINIMAL')
    for(const f of back) poly2(f.p.map(p=>P(p[0],p[1],p[2])),{w:.5,a:.13,passes:1,jit:.5},true);
  front.sort((x,y)=>facing(x.n)-facing(y.n));
  const sol = o.glass? 0 : (o.solid!=null?o.solid:SOL);
  for(const f of front)
    face3(f.p,{color:o.col,a:a*(f.a===HANG[2]?.68:f.a===HANG[1]?1.18:1),
               sp:o.sp||4.2,ang:f.a,w:lw,ea:ea,wash:o.wash,cross:o.cross,solid:sol});
  /* パネルライン */
  if(o.panel && S.detail!=='MINIMAL'){
    const n=o.panel;
    for(const f of front){
      for(let i=1;i<n;i++){
        const t=i/n;
        ln3(vlp(f.p[0],f.p[1],t), vlp(f.p[3],f.p[2],t),{w:.45,a:.26,passes:1,jit:.4});
      }
    }
  }
}
/* 汎用メッシュ: get(i,j) -> [x,y,z] */
function meshQuads(get,nu,nv,o){
  o=o||{};
  const st={w:o.w||.6,a:o.a!=null?o.a:.42,passes:1,jit:.45};
  const wrap=o.wrap!==false;
  /* 稜線 */
  for(let i=0;i<(wrap?nu:nu+1);i++){
    const pts=[]; for(let j=0;j<=nv;j++) pts.push(P.apply(null,get(i%nu,j)));
    poly2(pts,st,false);
  }
  for(let j=0;j<=nv;j+=(o.vstep||1)){
    const pts=[]; for(let i=0;i<=(wrap?nu:nu); i++) pts.push(P.apply(null,get(i%nu,j)));
    poly2(pts,st,false);
  }
  /* 手前の面だけ淡く塗る */
  if(o.col && !MEASURE){
    const qs=[];
    for(let i=0;i<(wrap?nu:nu);i++) for(let j=0;j<nv;j++){
      const A=get(i,j), B=get((i+1)%nu,j), C=get((i+1)%nu,j+1), D=get(i,j+1);
      const n=vcr(vsb(B,A),vsb(D,A));
      if(facing(n)<=0) continue;
      qs.push({d:DEP((A[0]+C[0])/2,(A[1]+C[1])/2,(A[2]+C[2])/2), p:[A,B,C,D]});
    }
    qs.sort((a,b)=>a.d-b.d);
    const sol = o.glass? 0 : (o.solid!=null?o.solid:SOL);
    for(const q of qs){
      const sp2=q.p.map(p=>P(p[0],p[1],p[2]));
      if(sol) fillPoly(sp2,PAPERC,sol);
      hatch2(sp2,{color:o.col,a:(o.ca!=null?o.ca:.18),sp:o.sp||3.4,ang:o.ang!=null?o.ang:-.6,wash:o.wash});
    }
  }
}
/* 円筒・円錐(多角形断面) */
function tube(p0,p1,r0,r1,sides,o){
  o=o||{};
  op(o.dep!=null?o.dep:DEP((p0[0]+p1[0])/2,(p0[1]+p1[1])/2,(p0[2]+p1[2])/2), function(){
    const f=frame(vsb(p1,p0));
    const get=(i,j)=>{
      const a=i/sides*Math.PI*2, t=j, r=lerp(r0,r1,t);
      const c=vlp(p0,p1,t);
      return [c[0]+(f[0][0]*Math.cos(a)+f[1][0]*Math.sin(a))*r,
              c[1]+(f[0][1]*Math.cos(a)+f[1][1]*Math.sin(a))*r,
              c[2]+(f[0][2]*Math.cos(a)+f[1][2]*Math.sin(a))*r];
    };
    meshQuads(get,sides,1,{col:o.col,a:o.ea!=null?o.ea:.46,ca:o.a!=null?o.a:.17,w:o.lw||.7,sp:o.sp||3.6,wash:o.wash,glass:o.glass});
    if(o.cap!==false){
      for(const t of [0,1]){
        const r=t?r1:r0; if(r<.2) continue;
        const pts=[]; for(let i=0;i<=sides;i++) pts.push(P.apply(null,get(i%sides,t)));
        poly2(pts,{w:o.lw||.75,a:.58,passes:1,jit:.4},false);
      }
    }
  });
}
/* 平板(planar polygon を法線方向に厚みづけ): 主翼・尾翼・甲板・装甲板 */
function plate3(poly,nrm,th,o){
  o=o||{};
  const n=vnm(nrm), h=vml(n,th/2);
  const cx=poly.reduce((s,p)=>vad(s,p),[0,0,0]);
  const c=vml(cx,1/poly.length);
  op(o.dep!=null?o.dep:DEP(c[0],c[1],c[2]), function(){
    const up=poly.map(p=>vad(p,h)), dn=poly.map(p=>vsb(p,h));
    const a=o.a!=null?o.a:.19;
    const upFront = facing(n)>0;
    const top = upFront?up:dn, bot = upFront?dn:up;
    /* 側面 */
    const sides=[];
    for(let i=0;i<poly.length;i++){
      const j=(i+1)%poly.length;
      const q=[dn[i],dn[j],up[j],up[i]];
      const sn=vcr(vsb(poly[j],poly[i]),n);
      if(facing(sn)>0) sides.push({d:DEP((q[0][0]+q[2][0])/2,(q[0][1]+q[2][1])/2,(q[0][2]+q[2][2])/2),q:q,n:sn});
    }
    poly2(bot.map(p=>P(p[0],p[1],p[2])),{w:.5,a:.2,passes:1,jit:.5},true);
    sides.sort((x,y)=>x.d-y.d);
    const sol = o.glass? 0 : (o.solid!=null?o.solid:SOL);
    for(const s of sides) face3(s.q,{color:o.col,a:a*1.15,sp:3.2,ang:.4,w:(o.lw||.85)*.9,ea:.6,solid:sol});
    face3(top,{color:o.col,a:a,sp:o.sp||4,ang:o.ang!=null?o.ang:-1.05,w:o.lw||.95,ea:o.ea!=null?o.ea:.78,wash:o.wash,solid:sol});
    /* リブ・桁 */
    if(o.ribs && S.detail!=='MINIMAL'){
      for(let i=1;i<o.ribs;i++){
        const t=i/o.ribs;
        ln3(vlp(top[0],top[1],t), vlp(top[3],top[2],t),{w:.45,a:.26,passes:1,jit:.4});
      }
    }
  });
}
/* ロフト(断面列をつないだ胴体・船体) */
function loft(st,o){
  o=o||{};
  const nu=o.sides||10;
  const mid=st[Math.floor(st.length/2)];
  op(o.dep!=null?o.dep:DEP(mid.c[0],mid.c[1],mid.c[2]), function(){
    const get=(i,j)=>{
      const s=st[j], a=i/nu*Math.PI*2;
      const ca=Math.cos(a), sa=Math.sin(a);
      const p=s.p||2.2;
      const ex=Math.sign(ca)*Math.pow(Math.abs(ca),2/p);
      const ez=Math.sign(sa)*Math.pow(Math.abs(sa),2/p);
      const zz=ez>=0? s.h*(s.ku!=null?s.ku:1) : s.h*(s.kd!=null?s.kd:1);
      return [s.c[0], s.c[1]+ex*s.w, s.c[2]+ (ez>=0? Math.abs(ez)*zz : -Math.abs(ez)*zz)];
    };
    meshQuads(get,nu,st.length-1,
      {col:o.col,a:o.ea!=null?o.ea:.44,ca:o.a!=null?o.a:.17,w:o.lw||.72,vstep:o.vstep||1,sp:o.sp||3.6,wash:o.wash,glass:o.glass});
  });
}
/* 断面列を作る補助 */
function stations(x0,x1,n,fw,fh,zc,p){
  const out=[];
  for(let i=0;i<=n;i++){
    const t=i/n, x=lerp(x0,x1,t);
    out.push({c:[x,0,zc(t)], w:Math.max(.4,fw(t)), h:Math.max(.4,fh(t)), p:p?p(t):2.4});
  }
  return out;
}

const GRIDN = { SMALL:16, MEDIUM:11, LARGE:7 };
function plate(x,y,z,w,d,n,o){
  o=o||{};
  op(o.dep!=null?o.dep:DEP(x,y,z)-4000, function(){
    const p00=[x-w/2,y-d/2,z], p10=[x+w/2,y-d/2,z], p11=[x+w/2,y+d/2,z], p01=[x-w/2,y+d/2,z];
    if(o.col) hatch2([p00,p10,p11,p01].map(p=>P(p[0],p[1],p[2])),{color:o.col,a:o.a!=null?o.a:.10,sp:5,ang:-1.0,wash:o.wash});
    quadGrid(p00,p10,p11,p01,n,Math.max(1,Math.round(n*d/w)),{w:.5,a:o.ga!=null?o.ga:.33});
    poly2([p00,p10,p11,p01].map(p=>P(p[0],p[1],p[2])),{w:.95,a:.55,passes:2,over:2},true);
  });
}
const GR = 78;   /* 敷地の半径(これを基準に周辺要素を配置する) */
function ground(){
  const W = GR*2, D = GR*2;
  /* 外周の点線と刻み */
  op(-99000, function(){
    const p=[[-W/2,-D/2,0],[W/2,-D/2,0],[W/2,D/2,0],[-W/2,D/2,0]];
    const sc=p.map(q=>P(q[0],q[1],q[2]));
    for(let i=0;i<4;i++){
      const a=sc[i], b=sc[(i+1)%4];
      const n=34;
      for(let k=0;k<n;k++){
        if(k%2) continue;
        const t0=k/n, t1=(k+.62)/n;
        ln2([lerp(a[0],b[0],t0),lerp(a[1],b[1],t0)],[lerp(a[0],b[0],t1),lerp(a[1],b[1],t1)],{w:.5,a:.28,passes:1});
      }
    }
  });
  /* 敷地マーカー(小さな × と点) */
  if(S.density!=='FEW'){
    const n = S.density==='MANY'? 46 : 24;
    for(let i=0;i<n;i++){
      const side=ri(0,3);
      let x,y;
      const m = GR*(1.02 + R()*.20);
      if(side===0){ x=rr(-m,m); y=-m; } else if(side===1){ x=m; y=rr(-m,m); }
      else if(side===2){ x=rr(-m,m); y=m; } else { x=-m; y=rr(-m,m); }
      op(DEP(x,y,0), (function(x,y){ return function(){
        const b=P(x,y,0), r=2.4*V.s;
        const st={w:.5,a:.32,passes:1,jit:.5};
        ln2([b[0]-r,b[1]-r*.5],[b[0]+r,b[1]+r*.5],st);
        ln2([b[0]-r,b[1]+r*.5],[b[0]+r,b[1]-r*.5],st);
      };})(x,y));
    }
    leg('MARKERS', n);
  }
}
function siteContext(){
  const site=S.site, dens=S.density;
  const N = dens==='MANY'?1.0 : dens==='MODERATE'?.6 : .3;
  const away=(x,y)=>Math.max(Math.abs(x),Math.abs(y))>GR*.90;
  const spread=(count,f)=>{
    let made=0;
    for(let i=0;i<count*3 && made<count;i++){
      const x=rr(-GR*1.18,GR*1.18), y=rr(-GR*1.18,GR*1.18);
      if(!away(x,y)) continue;
      f(x,y); made++;
    }
    return made;
  };
  if(site==='FOREST'){
    leg('TREES', spread(Math.round(70*N),(x,y)=>tree(x,y,0,rr(9,17),col(1))));
    leg('SCRUB', spread(Math.round(24*N),(x,y)=>scrub(x,y,0,rr(2,4))));
  } else if(site==='HILLSIDE'){
    /* 等高線 */
    const nc=Math.round(4*N)+2;
    for(let k=0;k<nc;k++){
      const rad=GR*1.0+k*GR*.075, ph=R()*6.28;
      op(-98000+k, (function(rad,ph){ return function(){
        const pts=[];
        for(let i=0;i<=46;i++){
          const a=i/46*6.283;
          const rr2=rad*(1+Math.sin(a*2.3+ph)*.10+Math.sin(a*3.7+ph*2)*.05);
          pts.push(P(Math.cos(a)*rr2, Math.sin(a)*rr2*.9, 0));
        }
        poly2(pts,{w:.55,a:.26,passes:1,jit:.6},false);
      };})(rad,ph));
    }
    leg('CONTOURS', nc);
    leg('SCRUB', spread(Math.round(30*N),(x,y)=>scrub(x,y,0,rr(2.5,5))));
    leg('TREES', spread(Math.round(14*N),(x,y)=>tree(x,y,0,rr(8,13),col(1))));
  } else if(site==='INDUSTRIAL'){
    /* 低層の工場・倉庫 */
    const nb=Math.round(5*N)+2;
    for(let i=0;i<nb;i++){
      const side=ri(0,3);
      const w=rr(22,50), d=rr(15,26), h=rr(12,42);
      let x,y; const o0=GR*1.00, o1=GR*1.18, sp0=GR*.84;
      if(side===0){ x=rr(-sp0,sp0); y=rr(o0,o1); } else if(side===1){ x=rr(o0,o1); y=rr(-sp0,sp0); }
      else if(side===2){ x=rr(-sp0,sp0); y=rr(-o1,-o0); } else { x=rr(-o1,-o0); y=rr(-sp0,sp0); }
      prism(x-w/2,y-d/2,0,w,d,h,{col:col(3),a:.10,fl:Math.max(1,Math.round(h/13)),win:R()<.6?Math.round(w/8):0,lw:.75,ea:.45});
    }
    leg('BLOCKS', nb);
    /* フェンス */
    op(-97000, function(){
      const st={w:.5,a:.3,passes:1};
      const q=GR*1.16;
      for(let s=0;s<2;s++){
        const y=s?q:-q;
        ln3([-q,y,0],[q,y,0],st);
        ln3([-q,y,7],[q,y,7],st);
        for(let x=-q;x<=q;x+=11) ln3([x,y,0],[x,y,7],{w:.4,a:.22,passes:1});
      }
    });
    leg('FENCE', 2);
  } else if(site==='COASTAL'){
    op(-98000, function(){
      for(let k=0;k<7;k++){
        const pts=[];
        for(let i=0;i<=40;i++){
          const t=i/40;
          pts.push(P(lerp(-GR*1.24,GR*1.24,t), GR*1.02+k*7+Math.sin(t*9+k)*4, 0));
        }
        poly2(pts,{w:.5,a:.22,passes:1,jit:.7},false);
      }
    });
    leg('TIDE LINES', 7);
    leg('SCRUB', spread(Math.round(18*N),(x,y)=>scrub(x,y,0,rr(2,4))));
  } else if(site==='URBAN'){
    const nb=Math.round(8*N)+3;
    for(let i=0;i<nb;i++){
      const w=rr(16,30), d=rr(16,30), h=rr(20,90);
      const ang=R()*6.283, rad=rr(GR*1.02,GR*1.20);
      const x=Math.cos(ang)*rad, y=Math.sin(ang)*rad;
      prism(x-w/2,y-d/2,0,w,d,h,{col:col(3),a:.09,fl:Math.round(h/12),win:Math.round(w/7),lw:.7,ea:.4});
    }
    leg('BLOCKS', nb);
  } else { /* DESERT */
    leg('ROCKS', spread(Math.round(26*N),(x,y)=>scrub(x,y,0,rr(3,7))));
    op(-98000, function(){
      for(let k=0;k<5;k++){
        const pts=[]; const yy=rr(-GR*1.16,GR*1.16);
        for(let i=0;i<=30;i++){ const t=i/30; pts.push(P(lerp(-GR*1.26,GR*1.26,t), yy+Math.sin(t*7+k)*8, 0)); }
        poly2(pts,{w:.45,a:.18,passes:1,jit:.8},false);
      }
    });
  }
  /* スケール人物 */
  if(S.detail!=='MINIMAL'){
    const nf = ri(2,5);
    for(let i=0;i<nf;i++){
      const a=R()*6.283, rad=rr(GR*.72,GR*1.06);
      figure(Math.cos(a)*rad, Math.sin(a)*rad*.9, 0);
    }
    leg('FIGURES', nf);
  }
}
/* 舗装プロット(離れた区画) */
function plots(n){
  const sv=CTXMODE; CTXMODE=true;
  for(let i=0;i<n;i++){
    const ang=R()*6.283, rad=rr(GR*.94,GR*1.18);
    const x=Math.cos(ang)*rad, y=Math.sin(ang)*rad*.85;
    const w=rr(24,38), d=rr(18,30);
    plate(x,y,0,w,d,ri(3,6),{col:col(3),a:.07,ga:.22,dep:-96000-i});
    if(chance(.6)) scrub(x+rr(-8,8),y+rr(-8,8),0,rr(2,4));
  }
  if(n) leg('PAVED', n);
  CTXMODE=sv;
}

/* =========================================================================
   ジャンル別の環境

function estSpan(){
  const sz=S.floors;
  if(S.genre==='mecha') return (52+sz*10)*1.25;
  if(S.genre==='air')   return (96+sz*9)*1.05;
  if(S.genre==='ship')  return (150+sz*16)*1.0;
  return GR*2;
}
/* 床・地面の共通処理 */
function bayPlate(w,d,o){
  o=o||{};
  plate(0,0,0,w,d,GRIDN[S.grid],{col:col(3),a:.06,ga:.28});
  op(-99000, function(){
    const p=[[-w/2,-d/2,0],[w/2,-d/2,0],[w/2,d/2,0],[-w/2,d/2,0]].map(q=>P(q[0],q[1],q[2]));
    for(let i=0;i<4;i++){
      const a=p[i], b=p[(i+1)%4], n=30;
      for(let k=0;k<n;k+=2){
        ln2([lerp(a[0],b[0],k/n),lerp(a[1],b[1],k/n)],
            [lerp(a[0],b[0],(k+.6)/n),lerp(a[1],b[1],(k+.6)/n)],{w:.5,a:.26,passes:1});
      }
    }
  });
}
function markCircle(r,z){
  op(-95000, function(){
    circle3(0,0,z||.2,r,{w:1.0,a:.34,passes:1});
    circle3(0,0,z||.2,r*.86,{w:.5,a:.22,passes:1});
    for(let k=0;k<8;k++){ const a=k/8*6.283;
      ln3([Math.cos(a)*r*.86,Math.sin(a)*r*.86,.2],[Math.cos(a)*r,Math.sin(a)*r,.2],{w:.5,a:.24,passes:1}); }
  });
  leg('DECK MARKS',1);
}
function scaleFigures(n,rad){
  for(let i=0;i<n;i++){
    const a=R()*6.283;
    figure(Math.cos(a)*rad*rr(.6,1), Math.sin(a)*rad*rr(.6,1), 0);
  }
  leg('FIGURES',n);
}
function envBefore(){
  const g=S.genre, SP=estSpan();
  if(g==='arch') return ground();
  if(g==='mecha'){
    if(S.site==='WASTES') return;
    bayPlate(SP*1.15, SP*1.05);
    markCircle(SP*.36);
    return;
  }
  if(g==='air'){
    if(S.site==='INFLIGHT') return;
    if(S.site==='RUNWAY'){
      bayPlate(SP*1.9, SP*.72);
      op(-95000, function(){
        for(let i=-9;i<=9;i++)
          ln3([i*SP*.10,0,.2],[i*SP*.10+SP*.05,0,.2],{w:1.2,a:.34,passes:1});
      });
      leg('CENTRELINE',19);
    }else{
      bayPlate(SP*1.25, SP*1.15);
      markCircle(SP*.34);
    }
    return;
  }
  if(g==='ship'){
    if(S.site==='VOID'){
      op(-99500, function(){
        for(let i=0;i<160;i++){
          const x=rr(FR.x0,FR.x1), y=rr(FR.y0,FR.y1);
          ctx.globalAlpha=.10+R()*.28; ctx.fillStyle='rgba(70,66,70,.9)';
          ctx.fillRect(x,y,R()<.14?1.8:1,R()<.14?1.8:1); ctx.globalAlpha=1;
        }
      });
      leg('STARFIELD',160);
      return;
    }
    if(S.site==='DRYDOCK'){
      bayPlate(SP*1.12, SP*.62);
      return;
    }
    /* 水面 */
    op(-99000, function(){
      const w=SP*1.25, d=SP*.9;
      for(let k=0;k<22;k++){
        const y=-d/2+d*k/21;
        const pts=[];
        for(let i=0;i<=34;i++){
          const t=i/34;
          pts.push(P(lerp(-w/2,w/2,t), y+Math.sin(t*11+k*1.7)*d*.012, 0));
        }
        poly2(pts,{w:.5,a:.17,passes:1,jit:.9},false);
      }
    });
    leg('SEA STATE',22);
    return;
  }
}
function envAfter(){
  const g=S.genre;
  if(g==='arch'){
    for(let i=1;i<S.bldgs;i++) satellite(i);

  extraUnits();

    } else if(S.site==='CITY'){
      const nb = S.density==='MANY'?9 : S.density==='MODERATE'?6 : 3;
      for(let i=0;i<nb;i++){
        const a=R()*6.283, rd=SP*rr(.62,.92);
        const w=SP*rr(.10,.20), h=SP*rr(.20,.72);
        prism(Math.cos(a)*rd-w/2, Math.sin(a)*rd-w/2, 0, w, w*rr(.7,1.3), h,
              {col:col(3),a:.10,fl:Math.round(h/(SP*.05)),win:3,lw:.75,ea:.5});
      }
      leg('BLOCKS',nb);
    } else {
      const nr = S.density==='MANY'?26 : S.density==='MODERATE'?14 : 7;
      for(let i=0;i<nr;i++){
        const a=R()*6.283, rd=SP*rr(.42,.95);
        scrub(Math.cos(a)*rd, Math.sin(a)*rd*.9, 0, SP*rr(.012,.035));
      }
      leg('RUBBLE',nr);

/* =========================================================================
   平面形
   ========================================================================= */
function footprint(shape,W){
  const h=W/2;
  switch(shape){
    case 'TSHAPE':  return [[-h,-h*.5,W,W*.5],[-W*.22,-h,W*.44,h*.5]];
    case 'LSHAPE':  return [[-h,-h,W*.5,W],[-h*.0,-h,W*.5,W*.45]];
    case 'DIAGONAL':return [[-h,-h,W*.5,W*.5],[-W*.18,-W*.18,W*.5,W*.5],[W*.14,W*.14,W*.5,W*.5]];
    case 'CROSS':   return [[-h,-W*.22,W,W*.44],[-W*.22,-h,W*.44,W]];
    case 'RADIAL':  return [[-W*.2,-W*.2,W*.4,W*.4],[-W*.52,-W*.16,W*.32,W*.32],[W*.2,-W*.16,W*.32,W*.32],[-W*.16,W*.2,W*.32,W*.32]];
    case 'COURT':   return [[-h,-h,W,W*.26],[-h,h-W*.26,W,W*.26],[-h,-h,W*.26,W],[h-W*.26,-h,W*.26,W]];
    default:        return [[-h,-h*.8,W,W*.8]];
  }
}

  const R0=rad*1.12, r0=rr(7,11);
  revolve(0,0,H, ringFn(R0,r0), S.detail==='DETAILED'?26:16, 8, {col:col(1),a:.5,w:.72,fillP:.3,dep:DEP(0,0,H)});
  leg('RING', 1); leg('SEGMENTS', S.detail==='DETAILED'?26:16);
  /* スポーク */
  const ns = S.struct==='MANY'?12:8;
  op(DEP(0,0,H)-1, function(){
    for(let k=0;k<ns;k++){
      const a=k/ns*6.283;
      ln3([0,0,H+2],[Math.cos(a)*R0,Math.sin(a)*R0,H],{w:.6,a:.4,passes:1});
    }
  });
  leg('SPOKES', ns);
  revolve(0,0,H+6, sphereFn(11), 12, 6, {geo:true,col:col(0),a:.42,fillP:.2,dep:DEP(0,0,H+6)});
  leg('HUB', 1);
  /* 中央シャフト */
  prism(-8,-8,0,16,16,H,{col:col(3),a:.18,fl:F,lw:1.1,ea:.72});
  /* 発射台 */
  const np=ri(1,3);
  for(let k=0;k<np;k++){
    const a=R()*6.283, rd=rr(GR*.86,GR*1.24);
    const x=Math.cos(a)*rd, y=Math.sin(a)*rd*.85;
    op(-95000-k, (function(x,y){ return function(){
      circle3(x,y,0,14,{w:1.0,a:.5,passes:2});
      circle3(x,y,0,9,{w:.6,a:.35,passes:1});
      for(let i=0;i<6;i++){ const a2=i/6*6.283;
        ln3([x+Math.cos(a2)*9,y+Math.sin(a2)*9,0],[x+Math.cos(a2)*14,y+Math.sin(a2)*14,0],{w:.5,a:.3,passes:1}); }
    };})(x,y));
  }
  leg('PADS', np); leg('GANTRY', ri(1,3)); leg('TETHERS', ri(3,8));
},
/* ---------- 08 ブルータリズム ---------- */
brutalist(){
  const F=Math.max(2,S.floors), H=F*FH;
  setLevels(F,FH,0);
  SCENE.top=H+6;
  plate(0,0,0,126,120,GRIDN[S.grid],{col:col(3),a:.06,ga:.2});
  const rects=footprint(S.shape,72);
  /* 基壇 */
  for(const r of rects) prism(r[0]-6,r[1]-6,0,r[2]+12,r[3]+12,6,{col:col(3),a:.16,lw:1.0});
  let nb=0;
  for(let f=0;f<F;f++){
    const z=6+f*FH;
    for(const r of rects){
      const flip = f%2===1;
      const ox = flip? -8 : 6, oy = flip? 7 : -6;
      const w = r[2]*(flip?1.06:.94), d = r[3]*(flip?.92:1.08);
      prism(r[0]+ox, r[1]+oy, z, w, d, FH*.9,
        {col:col(f%2?3:0),a:.19,lw:1.0,fl:2,win:Math.max(3,Math.round(w/8)),winCol:col(1),cross:f%2===0,wash:true});
      nb++;
    }
  }
  leg('MASSES', nb); leg('BAYS', nb*4); leg('CANTILEVER', Math.floor(F/2));
  /* シャフト */
  const nsh=ri(1,2);
  for(let k=0;k<nsh;k++){
    const x=rr(-34,26), y=rr(-30,22);
    prism(x,y,0,14,14,H+FH*rr(.4,1.2),{col:col(3),a:.22,lw:1.1,cross:true});
  }
  leg('SHAFTS', nsh); leg('SLOTS', ri(6,16)); leg('RIBS', ri(8,20)); leg('PLINTH', rects.length);
  plots(ri(1,3));
},

function limb(p0,p1,w,d,o){

function mecha(cfg){
  const c0=col(0), c1=col(1), c2=col(2), c3=col(3);
  const HT  = cfg.ht*(52+S.floors*10);
  const bw  = cfg.bulk;
  const arm = S.variant!=='NONE';
  const legs= S.shape;
  const det = S.detail;
  const pan = det==='DETAILED'?3 : det==='MODERATE'?2 : 0;
  let u, hipZ;

  if(legs==='QUAD'){ u=HT/4.8; hipZ=quadLegs(u,bw,cfg); }
  else if(legs==='HOVER'){ u=HT/6.6; hipZ=hoverBase(u,bw,cfg); }
  else if(legs==='TRACK'){ u=HT/6.6; hipZ=trackBase(u,bw,cfg); }
  else { u=HT/8; hipZ=bipedLegs(u,bw,cfg); }

  if(!TR){ SCENE.span=HT*.95; SCENE.top=HT; setLevels(5,HT/5,0); }

  if(legs==='QUAD'){
    /* 砲塔 */
    const tz=hipZ;
    tube([0,0,tz],[0,0,tz+.34*u],.86*u*bw,.78*u*bw,10,{col:c3,a:.20,lw:.9});
    ebox([0,0,tz+.86*u],[.95*u*bw,0,0],[0,.78*u*bw,0],[0,0,.5*u],{col:c0,a:.22,lw:1.05,panel:pan});
    for(const sy of [.24,-.24]){
      tube([.9*u,sy*u,tz+.82*u],[3.0*u,sy*u,tz+.86*u],.14*u,.115*u,6,{col:c1,a:.22,lw:.85});

    }
    ebox([.7*u,0,tz+1.28*u],[.3*u,0,0],[0,.42*u,0],[0,0,.2*u],{col:c1,a:.28,lw:.8});
    leg('TURRET',1); leg('SENSORS',ri(2,5));
    if(arm) mechaPods(u,bw,[0,0,tz+.9*u],cfg,c1);
    return;
  }

  /* --- 腰 --- */
  ebox([0,0,hipZ+.32*u],[.58*u*bw,0,0],[0,.84*u*bw,0],[0,0,.46*u],{col:c3,a:.22,lw:1.0,panel:pan});
  leg('PELVIS',1);
  /* --- 胸部 --- */
  const chZ = hipZ+1.45*u;
  ebox([0,0,chZ],[.74*u*bw,0,0],[0,1.10*u*bw,0],[0,0,.90*u],{col:c0,a:.22,lw:1.1,panel:pan,cross:cfg.ornate});
  leg('TORSO',1);
  /* 操縦席ハッチ */
  plate3([[.80*u*bw,-.42*u,chZ-.2*u],[.80*u*bw,.42*u,chZ-.2*u],
          [.80*u*bw,.34*u,chZ+.42*u],[.80*u*bw,-.34*u,chZ+.42*u]],[1,0,0],.1*u,
         {col:c1,a:.34,lw:.8,wash:true,glass:true});
  leg('COCKPIT',1);
  /* 排熱スリット */
  if(det!=='MINIMAL') for(let i=0;i<4;i++)
    ln3([.82*u*bw,-.5*u+i*.1*u,chZ-.55*u],[.82*u*bw,.5*u-i*.1*u,chZ-.55*u],{w:.5,a:.3,passes:1});
  /* --- 頭部 --- */
  const hdZ = chZ+1.18*u;
  tube([0,0,chZ+.86*u],[0,0,hdZ-.34*u],.26*u,.24*u,8,{col:c3,a:.2,lw:.8});
  ebox([.06*u,0,hdZ],[.44*u,0,0],[0,.5*u,0],[0,0,.42*u],{col:c3,a:.24,lw:1.0});
  plate3([[.46*u,-.32*u,hdZ+.02*u],[.46*u,.32*u,hdZ+.02*u],[.46*u,.28*u,hdZ+.22*u],[.46*u,-.28*u,hdZ+.22*u]],
         [1,0,0],.08*u,{col:c1,a:.42,lw:.75,wash:true,glass:true});
  if(cfg.head==='crown'){
    for(let k=0;k<5;k++){ const a=(k-2)*.5;
      tube([0,Math.sin(a)*.4*u,hdZ+.34*u],[-.2*u,Math.sin(a)*.6*u,hdZ+.95*u],.06*u,.02*u,4,{col:c1,a:.3}); }
    leg('CREST',5);
  } else if(cfg.head!=='drum'){
    tube([-.1*u,.3*u,hdZ+.3*u],[-.3*u,.44*u,hdZ+1.0*u],.05*u,.02*u,4,{col:c1,a:.3});
    leg('ANTENNA',1);
  }
  leg('HEAD',1);
  /* --- 肩・腕 --- */
  const shZ = chZ+.5*u;
  for(const sg of [1,-1]){

    ebox([0,sy*1.10,shZ],[.62*u*bw,0,0],[0,.50*u*bw,0],[0,0,.58*u],{col:c0,a:.24,lw:1.0,panel:pan});
    leg('PAULDRON',1);
    const sh=[0,sy*1.06,shZ-.24*u], el=[.14*u,sy*1.24,shZ-1.55*u], wr=[.38*u,sy*1.30,shZ-2.85*u];

    leg('THRUSTERS',2);
  } else if(cfg.pack==='tank'){
    for(const sg of [1,-1]) tube([bx-.35*u,sg*.6*u,chZ-.7*u],[bx-.35*u,sg*.6*u,chZ+.8*u],.28*u,.28*u,8,{col:c2,a:.24,lw:.85});

  /* --- ロールケージ --- */

    }
    tube([.55*u,-1.25*u,chZ+1.1*u],[.55*u,1.25*u,chZ+1.1*u],.07*u,.07*u,4,{col:c2,a:.3,lw:.8});
    leg('CAGE',3);
  }
  /* --- 武装 --- */
  if(arm) mechaPods(u,bw,[0,0,shZ],cfg,c1);
  if(arm && cfg.arm!=='claw'){
    const sg=-1, wy=sg*1.52*u*bw*1.12, wz=shZ-2.9*u;

    tube([1.2*u,wy,wz-.26*u],[3.1*u,wy,wz-.26*u],.11*u,.09*u,6,{col:c0,a:.22,lw:.85});
    ebox([.2*u,wy,wz-.62*u],[.16*u,0,0],[0,.1*u,0],[0,0,.3*u],{col:c3,a:.26,lw:.8});
    leg('RIFLE',1);

      const ly=-wy;

      plate3([[.36*u,ly-.55*u,wz-1.0*u],[.36*u,ly+.55*u,wz-1.0*u],[.36*u,ly+.5*u,wz+.95*u],[.36*u,ly-.5*u,wz+.95*u]],
             [1,0,0],.12*u,{col:c2,a:.26,lw:1.0,ribs:3});

  /* --- 支持脚(重砲機) --- */

function bipedLegs(u,bw,cfg){

    tube(hip,knee,.42*u*bw,.34*u*bw,6,{col:c3,a:.18,lw:.9});
    tube([knee[0],knee[1]-.34*u,knee[2]],[knee[0],knee[1]+.34*u,knee[2]],.30*u,.30*u,8,{col:c1,a:.26,lw:.85});
    limb(knee,ank,.33*u*bw,.40*u*bw,{col:c0,a:.22,lw:1.05,panel:pan});

function aircraft(cfg){
  const c0=col(0), c1=col(1), c2=col(2), c3=col(3);
  const L = cfg.len*(96+S.floors*9);
  const fly = S.site==='INFLIGHT';
  const W = cfg.slim? L*.10 : L*.13;
  const det=S.detail;
  const ns = det==='DETAILED'?16 : det==='MODERATE'?12 : 9;
  const zc = fly? L*.30 : L*.16;
  if(!TR){ SCENE.span=L*1.05; SCENE.top=zc+L*.16; setLevels(4,(zc+L*.14)/4,0); }

  /* --- 胴体 --- */
  const nose=cfg.nose;
  const st = stations(-L*.5, L*.5, ns,
    t=>{ const s=Math.sin(Math.pow(t,nose==='sharp'?.62:.5)*Math.PI);
         return W*(nose==='bulb'? Math.max(.34,Math.pow(s,.5)) : s*(1-t*.28)+W*.02/W); },
    t=>{ const s=Math.sin(Math.pow(t,.55)*Math.PI);
         return W*.82*(s*(1-t*.24)+.04); },
    t=>zc + Math.sin(t*Math.PI)*L*.012,
    t=>2.0+t*1.4);
  loft(st,{col:c0,a:.17,lw:.8,sides:det==='MINIMAL'?8:12,vstep:1,wash:true});
  leg('FUSELAGE',1); leg('FRAMES',ns);
  /* コクピット */
  const cx0=L*.16, cx1=L*.34;
  loft(stations(cx0,cx1,5,
      t=>W*.44*Math.sin(t*Math.PI+.5), t=>W*.34*Math.sin(t*Math.PI+.6),
      t=>zc+W*.76, ()=>2.6),
    {col:c1,a:.34,lw:.8,sides:8,wash:true,glass:true});
  leg('CANOPY',1);
  /* --- 主翼 --- */
  const wing=S.shape;
  const b   = cfg.wing*L*(wing==='DELTA'?.40:.46);
  const swp = wing==='DELTA'?.95 : wing==='SWEPT'?.55 : wing==='FSWEPT'?-.34 : .70;
  const Cr  = L*(wing==='DELTA'?.52:.34), Ct = L*(wing==='DELTA'?.06:.13);
  const xLE = L*(cfg.high?.06:.04);
  const zw  = zc + (cfg.high? W*.55 : -W*.18);
  for(const sg of [1,-1]){
    const poly=[[xLE,sg*W*.5,zw],[xLE-swp*b,sg*(W*.5+b),zw],
                [xLE-swp*b-Ct,sg*(W*.5+b),zw],[xLE-Cr,sg*W*.5,zw]];
    plate3(poly,[0,0,1],L*.016,{col:c0,a:.20,lw:1.0,ribs:det==='MINIMAL'?0:4});
    leg('WING',1);
    if(wing==='VARIABLE'){
      op(DEP(xLE-swp*b*.4,sg*(W*.5+b*.4),zw)+2, (function(sg){ return function(){
        circle3(xLE-L*.10, sg*(W*.5+b*.32), zw+L*.01, L*.022, {w:.7,a:.42,passes:1});
      };})(sg));
      leg('PIVOT',1);
    }
    /* 兵装 */
    const nh=Math.round((cfg.hard!=null?cfg.hard:1)*(S.variant==='HEAVY'?3:S.variant==='LIGHT'?2:0));
    for(let i=0;i<nh;i++){
      const t=.32+i*.22;
      const px=xLE-swp*b*t-Cr*.35, py=sg*(W*.5+b*t);
      ebox([px,py,zw-L*.022],[L*.02,0,0],[0,L*.008,0],[0,0,L*.012],{col:c3,a:.24,lw:.75});
      tube([px+L*.055,py,zw-L*.042],[px-L*.055,py,zw-L*.042],L*.012,L*.012,6,{col:c2,a:.26,lw:.75});
      for(let k=0;k<4;k++){ const a=k*Math.PI/2+.78;
        plate3([[px-L*.05,py,zw-L*.042],[px-L*.05,py+Math.cos(a)*L*.024,zw-L*.042+Math.sin(a)*L*.024],
                [px-L*.02,py+Math.cos(a)*L*.02,zw-L*.042+Math.sin(a)*L*.02],[px-L*.02,py,zw-L*.042]],
               [0,0,1],L*.003,{col:c2,a:.2,lw:.6,edge:true}); }
      leg('STORES',1);
    }
  }
  /* --- カナード --- */
  if(cfg.canard) for(const sg of [1,-1]){
    plate3([[L*.28,sg*W*.42,zc],[L*.20,sg*(W*.42+b*.30),zc],
            [L*.13,sg*(W*.42+b*.30),zc],[L*.14,sg*W*.42,zc]],[0,0,1],L*.010,{col:c0,a:.2,lw:.9});
    leg('CANARD',1);
  }
  /* --- 尾翼 --- */
  const tx=-L*.30, th=L*(cfg.tail==='tall'?.20:.15);
  if(cfg.tail==='vee'){
    for(const sg of [1,-1]) plate3([[tx,sg*W*.3,zc],[tx-L*.14,sg*(W*.3+th*.8),zc+th*.8],
       [tx-L*.24,sg*(W*.3+th*.8),zc+th*.8],[tx-L*.20,sg*W*.3,zc]],[0,0,1],L*.010,{col:c0,a:.2,lw:.9});
    leg('VEE TAIL',2);
  }else{
    for(let k=0;k<cfg.fins;k++){
      const sg = cfg.fins===1?0:(k?1:-1);
      const fy = sg*W*.58;
      plate3([[tx,fy,zc+W*.4],[tx-L*.10,fy,zc+W*.4+th],[tx-L*.20,fy,zc+W*.4+th],[tx-L*.19,fy,zc+W*.4]],
             [0,1,0],L*.012,{col:c0,a:.22,lw:.95,ribs:3});
      leg('FIN',1);
    }
    for(const sg of [1,-1]){
      plate3([[tx-L*.06,sg*W*.3,zc],[tx-L*.16,sg*(W*.3+b*.26),zc],
              [tx-L*.24,sg*(W*.3+b*.26),zc],[tx-L*.22,sg*W*.3,zc]],[0,0,1],L*.010,{col:c0,a:.2,lw:.9});
      leg('STABILATOR',1);
    }
  }
  /* --- 発動機 --- */
  const ne=cfg.eng;
  for(let k=0;k<ne;k++){
    const sg = ne===1?0 : (k%2?1:-1);
    const off = ne>2? (1+Math.floor(k/2)*1.1) : 1;
    const ey = sg*W*.42*off;
    if(cfg.high && ne>2){
      /* 主翼下のポッド */
      const px=xLE-swp*b*(.3+Math.floor(k/2)*.28)-Cr*.2, py=sg*(W*.5+b*(.3+Math.floor(k/2)*.28));
      tube([px+L*.09,py,zw-L*.05],[px-L*.09,py,zw-L*.05],L*.035,L*.030,8,{col:c3,a:.2,lw:.85});
      circle3(px+L*.09,py,zw-L*.05,L*.034,{w:.7,a:.4,passes:1});
    }else{
      tube([-L*.34,ey,zc],[-L*.52,ey,zc],W*.34,W*.30,8,{col:c3,a:.20,lw:.9});
      op(DEP(-L*.52,ey,zc)+3, (function(ey){ return function(){
        const pts=[]; for(let i=0;i<=16;i++){ const a=i/16*6.283;
          pts.push(P(-L*.52, ey+Math.cos(a)*W*.24, zc+Math.sin(a)*W*.24)); }
        poly2(pts,{w:.7,a:.44,passes:1,jit:.4},true);
        hatch2(pts,{color:c2,a:.24,sp:3,ang:-.7});
      };})(ey));
      /* 吸気口 */
      ebox([L*.02,ey*1.5,zc-W*.2],[L*.10,0,0],[0,W*.22,0],[0,0,W*.34],{col:c3,a:.2,lw:.85});
    }
    leg('ENGINE',1);
  }
  /* --- 脚 or 影 --- */
  if(!fly){
    const gz=zc-W*.86;
    const gear=[[L*.26,0],[-L*.06,W*.62],[-L*.06,-W*.62]];
    for(const g of gear){
      tube([g[0],g[1],gz+W*.2],[g[0],g[1],L*.03],L*.008,L*.008,5,{col:c3,a:.22,lw:.8});
      tube([g[0],g[1]-L*.012,L*.03],[g[0],g[1]+L*.012,L*.03],L*.028,L*.028,10,{col:c2,a:.26,lw:.8});
      leg('GEAR',1);
    }
  }else{
    const sv=CTXMODE; CTXMODE=true;
    op(-88000, function(){
      for(let k=0;k<6;k++){
        const y=(k-2.5)*L*.12, x0=-L*.6-R()*L*.5;
        ln3([x0,y,zc+ (R()-.5)*L*.1],[x0-L*(.3+R()*.5),y,zc+(R()-.5)*L*.1],{w:.5,a:.14,passes:1,jit:1.2});
      }
    });
    CTXMODE=sv;
    leg('SLIPSTREAM',6);
  }
  leg('PANELS',ri(14,36)); leg('RIVETS',ri(20,60));
}

/* =========================================================================
   艦船
   ========================================================================= */
function vessel(cfg){
  const c0=col(0), c1=col(1), c2=col(2), c3=col(3);
  const L  = cfg.len*(150+S.floors*16);
  const B  = cfg.beam*L*.115;
  const D  = L*.055;                       /* 喫水 */
  const F  = L*.045;                       /* 乾舷 */
  const det=S.detail;
  const ns = det==='DETAILED'?18 : det==='MODERATE'?13 : 9;
  const sub = cfg.sub, voidc = cfg.voidc;
  const wl = 0;
  if(!TR){ SCENE.span=L*1.02; SCENE.top=F+L*.16; setLevels(4,(F+L*.14)/4,-D); }

  /* --- 船体 --- */
  const bowT = .06;
  const st = stations(L*.5, -L*.5, ns,
     t=>B*Math.max(.10, Math.sin(Math.pow(Math.min(1,t*1.06),.42)*Math.PI*.98)*(sub?1:1-t*.12)+ (t>.94?.0:0)),
     t=>((F+D)/2)*(sub?1:1-Math.max(0,t-.86)*1.6),
     t=>(F-D)/2 + (sub?0:Math.pow(Math.max(0,.9-t),3)*L*.05),
     t=>sub?2.6:(t<bowT?1.5:2.0+Math.min(t,.7)*2.2));
  loft(st,{col:c0,a:.18,lw:.85,sides:det==='MINIMAL'?8:12,wash:true});
  leg('HULL',1); leg('FRAMES',ns);
  /* 喫水線 */
  if(!sub && !voidc){
    op(DEP(0,0,0)+1, function(){
      for(const sg of [1,-1]){
        const pts=[];
        for(let i=0;i<=ns;i++){ const s2=st[i]; pts.push(P(s2.c[0], sg*s2.w, 0)); }
        poly2(pts,{w:.9,a:.5,passes:2,jit:.4},false);
      }
    });
    leg('WATERLINE',1);
  }
  /* --- 甲板 --- */
  const deckZ=F;
  const dk=[]; for(let i=0;i<=ns;i++) dk.push([st[i].c[0], st[i].w*.98, deckZ]);
  const dk2=[]; for(let i=ns;i>=0;i--) dk2.push([st[i].c[0], -st[i].w*.98, deckZ]);
  if(!sub){
    plate3(dk.concat(dk2),[0,0,1],L*.008,{col:c3,a:.16,lw:.9,sp:5});
    leg('DECK',1);
  }
  /* --- 飛行甲板(空母) --- */
  if(cfg.deck){
    const dw=B*1.42, x0=L*.46, x1=-L*.48;
    plate3([[x0,-dw*.35,deckZ+L*.028],[x0,dw*.5,deckZ+L*.028],
            [x1,dw*.72,deckZ+L*.028],[x1,-dw*.62,deckZ+L*.028]],[0,0,1],L*.012,
           {col:c3,a:.15,lw:1.05,sp:5.5});
    op(DEP(0,0,deckZ+L*.04)+4, function(){
      /* 甲板標識 */
      for(let i=0;i<9;i++){
        const t=i/9;
        ln3([lerp(x0*.9,x1*.9,t), -dw*.1, deckZ+L*.036],[lerp(x0*.9,x1*.9,t)-L*.03,-dw*.1,deckZ+L*.036],{w:1.1,a:.4,passes:1});
      }
      ln3([x0*.86,dw*.42,deckZ+L*.036],[x1*.86,-dw*.1,deckZ+L*.036],{w:.7,a:.3,passes:1});
    });
    /* 艦載機 */
    const na = S.density==='MANY'?7 : S.density==='MODERATE'?4 : 2;
    for(let i=0;i<na;i++){
      const px=lerp(x0*.8,x1*.85,R()), py=rr(-dw*.4,dw*.55), aw=L*.055;
      op(DEP(px,py,deckZ+L*.05), (function(px,py,aw){ return function(){
        const z=deckZ+L*.046;
        poly2([P(px+aw*1.5,py,z),P(px-aw*.9,py+aw*1.5,z),P(px-aw*1.4,py+aw*1.4,z),
               P(px-aw*.9,py+aw*.2,z),P(px-aw*.9,py-aw*.2,z),P(px-aw*1.4,py-aw*1.4,z),
               P(px-aw*.9,py-aw*1.5,z)],{w:.7,a:.44,passes:1,jit:.5},true);
      };})(px,py,aw));
      leg('AIRCRAFT',1);
    }
    leg('FLIGHT DECK',1); leg('ARRESTORS',9);
  }
  /* --- 上部構造 --- */
  const supX = cfg.sup==='island'? -L*.02 : cfg.sup==='sail'? L*.10 : L*.04;
  const supY = cfg.sup==='island'? B*1.02 : 0;
  const supZ = deckZ + (cfg.deck? L*.04 : 0);
  if(cfg.sup==='sail'){
    ebox([supX,0,supZ+L*.055],[L*.075,0,0],[0,B*.22,0],[0,0,L*.055],{col:c0,a:.22,lw:1.05,panel:3});
    for(const sg of [1,-1])
      plate3([[supX+L*.01,sg*B*.2,supZ+L*.05],[supX+L*.01,sg*B*.75,supZ+L*.05],
              [supX-L*.03,sg*B*.75,supZ+L*.05],[supX-L*.03,sg*B*.2,supZ+L*.05]],[0,0,1],L*.006,
             {col:c3,a:.2,lw:.85});
    tube([supX+L*.03,0,supZ+L*.11],[supX+L*.03,0,supZ+L*.19],L*.006,L*.005,6,{col:c2,a:.26,lw:.8});
    leg('SAIL',1); leg('DIVE PLANES',2); leg('MASTS',1);
  }else if(cfg.sup==='spine'){
    for(let i=0;i<4;i++){
      const x=L*.20-i*L*.13;
      ebox([x,0,supZ+L*.05],[L*.055,0,0],[0,B*(.5-i*.05),0],[0,0,L*.05],
           {col:i%2?c3:c0,a:.2,lw:1.0,panel:3});
    }
    /* 放熱板 */
    for(const sg of [1,-1]) for(let i=0;i<3;i++){
      const x=L*.10-i*L*.14;
      plate3([[x+L*.05,sg*B*.6,supZ+L*.02],[x+L*.05,sg*B*1.5,supZ+L*.10],
              [x-L*.05,sg*B*1.5,supZ+L*.10],[x-L*.05,sg*B*.6,supZ+L*.02]],
             vnm([0,-sg*.7,.7]),L*.004,{col:c1,a:.26,lw:.8,ribs:4});
      leg('RADIATOR',1);
    }
    leg('SPINE',4);
  }else{
    const nlv = cfg.sup==='island'? 5 : 4;
    for(let i=0;i<nlv;i++){
      const w=L*(cfg.sup==='island'?.045:.085)*(1-i*.14);
      const d=B*(cfg.sup==='island'?.34:.62)*(1-i*.16);
      ebox([supX+i*L*.006, supY, supZ+L*.032+i*L*.055],[w,0,0],[0,d,0],[0,0,L*.028],
           {col:i%2?c0:c3,a:.22,lw:1.0,panel:3});
      leg('SUPERSTRUCTURE',1);
    }
    /* 艦橋窓 */
    op(DEP(supX,supY,supZ+L*.09)+2, function(){
      const sgn=visX(), fx=supX+sgn*L*(cfg.sup==='island'?.045:.085);
      for(let i=0;i<4;i++)
        ln3([fx, supY-B*.2+i*0, supZ+L*.075+i*L*.006],[fx, supY+B*.2, supZ+L*.075+i*L*.006],{w:.5,a:.3,passes:1});
    });
    /* 煙突 */
    if(!voidc && cfg.sup!=='island'){
      tube([supX-L*.10,0,supZ+L*.05],[supX-L*.12,0,supZ+L*.14],L*.022,L*.018,8,{col:c2,a:.24,lw:.9});
      leg('FUNNEL',1);
    }
  }
  /* --- マスト・レーダー --- */
  for(let k=0;k<cfg.mast;k++){
    const mx = supX - k*L*.10;
    lattice(mx, supY, supZ+L*.14, L*.13, L*.012, {rings:4});
    plate3([[mx-L*.03,supY-B*.16,supZ+L*.25],[mx-L*.03,supY+B*.16,supZ+L*.25],
            [mx+L*.01,supY+B*.16,supZ+L*.27],[mx+L*.01,supY-B*.16,supZ+L*.27]],
           vnm([-.3,0,1]),L*.004,{col:c1,a:.3,lw:.8,ribs:3});
    leg('MAST',1); leg('RADAR',1);
  }
  /* --- 兵装 --- */
  const guns = S.variant==='NONE'?0 : cfg.guns*(S.variant==='HEAVY'?2:1);
  for(let k=0;k<guns;k++){
    const gx = k%2? -L*.30 : L*.30;
    const gz = deckZ+L*.012;
    tube([gx,0,gz],[gx,0,gz+L*.012],L*.030,L*.028,10,{col:c3,a:.24,lw:.85});
    ebox([gx,0,gz+L*.032],[L*.032,0,0],[0,L*.026,0],[0,0,L*.020],{col:c0,a:.24,lw:1.0,panel:2});
    for(const sg of [1,-1])
      tube([gx+L*.02,sg*L*.008,gz+L*.036],[gx+L*.12,sg*L*.008,gz+L*.040],L*.006,L*.005,6,{col:c1,a:.24,lw:.8});
    leg('MAIN GUN',1); leg('BARRELS',2);
  }
  if(S.variant!=='NONE' && !sub){
    /* VLS */
    const vx=L*.16;
    op(DEP(vx,0,deckZ)+3, function(){
      quadGrid([vx+L*.06,-B*.3,deckZ+L*.006],[vx+L*.06,B*.3,deckZ+L*.006],
               [vx-L*.06,B*.3,deckZ+L*.006],[vx-L*.06,-B*.3,deckZ+L*.006],6,4,{w:.5,a:.36});
    });
    leg('VLS CELLS',24);
  }
  /* --- 推進 --- */
  if(voidc){
    for(let k=0;k<3;k++){
      const sg=k-1;
      revolve(-L*.52, sg*B*.5, (F-D)/2, domeFn(L*.05,L*.06,false), 12, 4,
              {col:c1,a:.44,fillP:.35,dep:DEP(-L*.52,sg*B*.5,0)});
      leg('DRIVE BELL',1);
    }
  }else if(sub){
    tube([-L*.48,0,(F-D)/2],[-L*.54,0,(F-D)/2],B*.30,B*.26,12,{col:c2,a:.24,lw:.85});
    for(const sg of [1,-1]) for(const vz of [1,-1])
      plate3([[-L*.40,0,(F-D)/2],[-L*.44,sg*B*.9,(F-D)/2+vz*B*.9],
              [-L*.50,sg*B*.9,(F-D)/2+vz*B*.9],[-L*.48,0,(F-D)/2]],
             vnm([0,-vz*sg,1]),L*.004,{col:c3,a:.22,lw:.85});
    leg('PROPULSOR',1); leg('X-PLANES',4);
  }else{
    for(const sg of [1,-1]){
      tube([-L*.42,sg*B*.34,-D*.55],[-L*.52,sg*B*.34,-D*.5],L*.008,L*.008,6,{col:c3,a:.22,lw:.8});
      op(DEP(-L*.52,sg*B*.34,-D*.5)+2, (function(sg){ return function(){
        for(let k=0;k<4;k++){ const a=k*Math.PI/2+.4;
          ln3([-L*.52,sg*B*.34,-D*.5],[-L*.52,sg*B*.34+Math.cos(a)*L*.026,-D*.5+Math.sin(a)*L*.026],{w:.6,a:.4,passes:1}); }
      };})(sg));
      leg('SCREW',1);
    }
  }
  leg('PLATING',ri(20,50)); leg('FITTINGS',ri(10,28));
}

/* =========================================================================
   手書き文字(1文字ずつ揺らして製図の手書きレタリング風に)
   ========================================================================= */
function twidth(str,size,tr){
  ctx.font = size+'px "Courier New",ui-monospace,monospace';
  let w=0; for(const ch of str) w += ctx.measureText(ch).width + tr;
  return w-tr;
}
function tech(str,x,y,size,o){
  o=o||{};
  const tr = o.tr!=null?o.tr:size*.20;
  ctx.save();
  ctx.font = (o.bold?'bold ':'')+size+'px "Courier New",ui-monospace,monospace';
  ctx.fillStyle = o.color||'rgba(66,63,66,.86)';
  ctx.textBaseline='alphabetic';
  let cx = x;
  if(o.align==='center') cx = x - twidth(str,size,tr)/2;
  else if(o.align==='right') cx = x - twidth(str,size,tr);
  ctx.font = (o.bold?'bold ':'')+size+'px "Courier New",ui-monospace,monospace';
  const j = (o.jit!=null?o.jit:.34)*ROUGH;
  for(const ch of str){
    const w = ctx.measureText(ch).width;
    if(ch!==' '){
      ctx.save();
      ctx.translate(cx+w/2+(R()*2-1)*j, y+(R()*2-1)*j*1.1);
      ctx.rotate((R()*2-1)*.017);
      ctx.globalAlpha = o.a!=null?o.a:(.78+R()*.22);
      ctx.fillText(ch,-w/2,0);
      if(o.bold){ ctx.globalAlpha*=.5; ctx.fillText(ch,-w/2+.35,.3); }
      ctx.restore();
    }
    cx += w + tr;
  }
  ctx.restore();
  return cx-x-tr;
}
function boxr(x0,y0,x1,y1,o){
  o=o||{w:.7,a:.42,passes:1};
  poly2([[x0,y0],[x1,y0],[x1,y1],[x0,y1]],o,true);
}

/* =========================================================================
   図面枠・タイトルブロック・凡例
   ========================================================================= */
const M = { x0:30, y0:30, x1:SW-30, y1:SH-30 };
const TB = { y0:40, y1:96 };
const FR = { x0:104, y0:112, x1:SW-44, y1:1152 };
const BB = { y0:1176, y1:1248 };

function alnum(n){ const s='0123456789ABCDEFGHJKLMNPRSTUVWXYZ'; let o=''; for(let i=0;i<n;i++) o+=s[Math.floor(R()*s.length)]; return o; }

function chrome(){
  const md = MODES[S.mode];
  const nm = SCENE.name;
  const dwg = 'IS-' + alnum(6);
  const proj = '#' + ri(1000,99999);
  const q = [];
  const thin = {w:.62,a:.4,passes:1,jit:.4};
  const thin2 = {w:.5,a:.26,passes:1,jit:.4};

  /* --- タイトルブロック --- */
  q.push(function(){
    boxr(44,TB.y0,SW-44,TB.y1,thin);
    ln2([300,TB.y0],[300,TB.y1],thin);
    ln2([560,TB.y0],[560,TB.y1],thin);
    ln2([SW-118,TB.y0],[SW-118,TB.y1],thin);
    ln2([44,TB.y1-16],[300,TB.y1-16],thin2);
    tech(md.sheet, 52, TB.y0+21, 15, {tr:2.6,bold:true,color:'rgba(58,56,58,.9)'});
    tech(nm.style+' / '+nm.sub, 52, TB.y0+35, 8.5, {tr:1.5,color:'rgba(90,86,84,.85)'});

    const rows=[['VIEW:','AXONOMETRIC'],['DETAIL:',S.detail],['DENSITY:',S.density],[SITEL[S.genre].en+':',S.site]];
    rows.forEach(function(r,i){
