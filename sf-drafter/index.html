      tech(r[1], 384, y, 7.4, {tr:1.0,color:'rgba(70,66,66,.88)'});
    });
    /* 色見本 */
    for(let i=0;i<4;i++){
      const x=596+i*32, y=TB.y0+20;
      ctx.save();
      hatch2([[x,y],[x+17,y],[x+17,y+17],[x,y+17]],{color:col(i),a:.5,sp:2.6,ang:-.7,wash:true});
      ctx.restore();
      boxr(x,y,x+17,y+17,{w:.6,a:.4,passes:1});
    }
    /* 方位 */
    const nx=SW-81, ny=TB.y0+30;
    const pts=[]; for(let k=0;k<=24;k++){ const a=k/24*6.283; pts.push([nx+Math.cos(a)*17,ny+Math.sin(a)*17]); }
    poly2(pts,{w:.7,a:.45,passes:1,jit:.4},true);
    ln2([nx,ny+11],[nx,ny-11],{w:.8,a:.5,passes:1});
    ln2([nx-4,ny-5],[nx,ny-11],{w:.8,a:.5,passes:1});
    ln2([nx+4,ny-5],[nx,ny-11],{w:.8,a:.5,passes:1});
    tech('N', nx, TB.y0+7, 8.5, {align:'center',tr:0,color:'rgba(70,66,66,.85)'});
  });

  /* --- 図面枠 --- */
  q.push(function(){
    boxr(FR.x0,FR.y0,FR.x1,FR.y1,{w:.55,a:.22,passes:1,jit:.5});
  });

  /* --- 階高マーカー --- */
  q.push(function(){
    const lv=SCENE.levels;
    if(!lv.length) return;
    const xs=44;
    const ys=lv.map(function(l){ return P(0,0,l.z)[1]; });
    const top=Math.min.apply(null,ys)-14, bot=Math.max.apply(null,ys);
    ln2([xs,top],[xs,bot],{w:.55,a:.3,passes:1,jit:.4});
    ln2([xs-4,top],[xs+4,top],{w:.55,a:.3,passes:1});
    ln2([xs-4,bot],[xs+4,bot],{w:.55,a:.3,passes:1});
    lv.forEach(function(l,i){
      const y=ys[i];
      ln2([xs,y],[xs+9,y],{w:.6,a:.34,passes:1});
      tech(l.label, xs+13, y+3, 8.4, {tr:1.0,color:'rgba(88,84,82,.82)'});
    });
  });

  /* --- 下部ブロック --- */
  q.push(function(){
    /* 凡例 */
    boxr(44,BB.y0,300,BB.y1,thin);
    tech('LEGEND', 52, BB.y0+11, 8.2, {tr:1.6,color:'rgba(80,76,74,.85)'});
    ln2([44,BB.y0+16],[300,BB.y0+16],thin2);
    const items = LEG.slice().sort(function(a,b){ return b.n-a.n; }).slice(0,12);
    items.forEach(function(it,i){
      const cx = 52 + (i%2)*126, cy = BB.y0+30 + Math.floor(i/2)*11;
      glyph(cx, cy-3.4, i);
      tech(it.name+'('+it.n+')', cx+11, cy, 6.6, {tr:.6,color:'rgba(96,92,88,.8)'});
    });
    /* 中央: プロジェクト番号とスケール */
    tech('PROJECT '+proj, 470, BB.y0+11, 8.6, {align:'center',tr:1.6,color:'rgba(74,70,70,.85)'});
    const sx0=386, sx1=556, sy=BB.y0+38;
    ln2([sx0,sy],[sx1,sy],{w:.7,a:.45,passes:1});
    for(let i=0;i<=4;i++){
      const x=lerp(sx0,sx1,i/4);
      ln2([x,sy-4],[x,sy+4],{w:.6,a:.4,passes:1});
      if(i%2===0 && i<4) hatch2([[x,sy],[lerp(sx0,sx1,(i+1)/4),sy],[lerp(sx0,sx1,(i+1)/4),sy+4],[x,sy+4]],{color:'#55525a',a:.35,sp:1.8,ang:-.9});
    }
    tech('0', sx0-8, sy+3, 7, {align:'right',color:'rgba(96,92,88,.75)'});
    tech('M', sx1+8, sy+3, 7, {color:'rgba(96,92,88,.75)'});
    tech('1:100', 470, sy-8, 7, {align:'center',tr:1.2,color:'rgba(96,92,88,.75)'});
    tech(SCENE.name.sub, 470, BB.y1-6, 8, {align:'center',tr:1.6,color:'rgba(80,76,74,.8)'});
    /* 仕様表 */
    boxr(614,BB.y0,SW-44,BB.y1,thin);
    tech('ISOMETRIC STRATA', 622, BB.y0+11, 8.2, {tr:1.5,color:'rgba(80,76,74,.85)'});
    ln2([614,BB.y0+16],[SW-44,BB.y0+16],thin2);
    const gg=S.genre;
    const L=[['STYLE:',SCENE.name.style],[SHAPEL[gg].en+':',S.shape],['PALETTE:',S.palette],['PAPER:',S.paper],
             [UNITL[gg].en+':',String(S.bldgs)]];
    const Rr=[[SIZEL[gg].en+':',String(S.floors)],['GRID:',S.grid],['INK:',S.ink],
              [gg==='arch'?'STRUCT:':VARL[gg].en+':', gg==='arch'?S.struct:S.variant],['MODE:',MODES[S.mode].en]];
    L.forEach(function(r,i){
      const y=BB.y0+29+i*10;
      tech(r[0], 622, y, 6.5, {tr:.5,color:'rgba(112,108,102,.8)'});
      tech(r[1], 668, y, 6.5, {tr:.5,color:'rgba(72,68,68,.85)'});
    });
    Rr.forEach(function(r,i){
      const y=BB.y0+29+i*10;
      tech(r[0], 766, y, 6.5, {tr:.5,color:'rgba(112,108,102,.8)'});
      tech(r[1], 816, y, 6.5, {tr:.5,color:'rgba(72,68,68,.85)'});
    });
  });

  /* --- 端の細かい記号 --- */
  q.push(function(){
    for(let k=0;k<3;k++){
      const x = k===1? SW-52 : 42+ (k===2? SW-96:0);
      const y = 380+k*300+R()*120;
      for(let i=0;i<12;i++){
        const px=x+(i%4)*3.2, py=y+Math.floor(i/4)*3.2;
        if(R()<.45) continue;
        ctx.globalAlpha=.35; ctx.fillStyle='rgba(90,86,84,.8)';
        ctx.fillRect(px,py,2.4,2.4); ctx.globalAlpha=1;
      }
    }
    /* 走り書きの補助線 */
    const nstray = S.detail==='DETAILED'? 5 : 2;
    for(let i=0;i<nstray;i++){
      const a=[rr(FR.x0,FR.x1),rr(FR.y0,FR.y1)];
      const l=rr(120,420), ang=rr(-1.2,-.2);
      ln2(a,[a[0]+Math.cos(ang)*l,a[1]+Math.sin(ang)*l],{w:.5,a:.075,passes:1,jit:1.2});
    }
  });
  return q;
}
function glyph(x,y,i){
  const st={w:.55,a:.4,passes:1,jit:.35};
  const k=i%6, s=5;
  if(k===0) boxr(x,y,x+s,y+s,st);
  else if(k===1){ const p=[]; for(let t=0;t<=10;t++){ const a=t/10*6.283; p.push([x+s/2+Math.cos(a)*s/2,y+s/2+Math.sin(a)*s/2]); } poly2(p,st,true); }
  else if(k===2) poly2([[x,y+s],[x+s/2,y],[x+s,y+s]],st,true);
  else if(k===3){ ln2([x,y],[x+s,y+s],st); ln2([x,y+s],[x+s,y],st); }
  else if(k===4){ ln2([x,y+s/2],[x+s,y+s/2],st); ln2([x+s/2,y],[x+s/2,y+s],st); }
  else { boxr(x,y,x+s,y+s,st); ln2([x,y+s],[x+s,y],st); }
}

let grainTex=null;
function finishSheet(){
  if(!grainTex){
    const g=document.createElement('canvas'); g.width=200; g.height=200;
    const gg=g.getContext('2d'); const id=gg.createImageData(200,200), d=id.data;
    const r2=mulberry32(7);
    for(let i=0;i<d.length;i+=4){
      const v=r2()*255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=26;
    }
    gg.putImageData(id,0,0); grainTex=g;
  }
  ctx.save();
  ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=.17;
  const p=ctx.createPattern(grainTex,'repeat');
  ctx.fillStyle=p; ctx.fillRect(0,0,SW,SH);
  ctx.restore();
  /* 周辺の陰り */
  const g2=ctx.createRadialGradient(SW/2,SH*.45,SW*.28,SW/2,SH*.45,SW*.95);
  g2.addColorStop(0,'rgba(0,0,0,0)'); g2.addColorStop(1,'rgba(92,78,54,.085)');
  ctx.fillStyle=g2; ctx.fillRect(0,0,SW,SH);
}

function satellite(i){
  const a = (i*2.1+1.1), rad = rr(GR*.78,GR*1.10);
  const x = Math.cos(a)*rad, y = Math.sin(a)*rad*.85;
  const w = rr(20,32), d = rr(18,28), h = rr(30,110)*(S.floors/6);
  const f = Math.max(2,Math.round(h/14));
  prism(x-w/2,y-d/2,0,w,d,h,{col:col(i%4),a:.14,fl:f,win:Math.max(2,Math.round(w/8)),winCol:col(0),lw:.85,ea:.55});
  prism(x-w/2-4,y-d/2-4,0,w+8,d+8,3,{col:col(3),a:.12,lw:.75});
  if(chance(.5)) lattice(x+w*.8,y,0,h*rr(.6,1.1),3,{rings:4});
  leg('ANNEX', 1);
}

   生成 → 描画パイプライン

let strokes=0, queue=[], qi=0, raf=0, t0=0, lastMs=0;
const progEl=document.getElementById('prog'), progBar=document.getElementById('progBar'), progTxt=document.getElementById('progTxt');

/* 実際に描かれる範囲を採寸してから、図面枠いっぱいに収める */
function fitScene(){
  MEASURE=true;
  BX={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
  V.s=1; V.cx=0; V.cy=0;
  let core=OPS.filter(function(o){ return !o.c; });
  if(!core.length) core=OPS;
  for(const o of core) o.f();
  MEASURE=false;
  const bw=Math.max(1,BX.x1-BX.x0), bh=Math.max(1,BX.y1-BX.y0);
  const FW=(FR.x1-FR.x0)*0.86, FHh=(FR.y1-FR.y0)*0.84;
  V.s=Math.min(FW/bw, FHh/bh);
  V.cx=(FR.x0+FR.x1)/2 - (BX.x0+BX.x1)/2*V.s;
  V.cy=(FR.y0+FR.y1)/2 - (BX.y0+BX.y1)/2*V.s;
}
function generate(){
  R = mulberry32((S.seed>>>0)||1);
  COLS = PALETTES[S.palette].cols;
  INKW = S.ink==='FINE'?.80 : S.ink==='BOLD'?1.75 : 1.24;
  ROUGH = 0.35 + (S.rough/100)*1.9;
  INK = S.palette==='CYANOTYPE' ? 'rgba(44,58,82,1)' : 'rgba(54,52,58,1)';
  PAPERC = PAPERS[S.paper].base;
  SOL = S.genre==='arch' ? 0 : .60;
  OPS=[]; LEG=[]; strokes=0;
  SCENE.name = genName();
  if(S.title.trim()){
    const t=S.title.trim().toUpperCase();
    const sp=t.indexOf(' ');
    SCENE.name={ style:t, sub: sp>0? t.slice(0,sp) : (MODES[S.mode].en.split(' ')[0]) };
  }
  SCENE.levels=[]; SCENE.top=120;
  V.rot = S.rot*Math.PI/2;

  SCENE.span = estSpan();
  CTXMODE=true; envBefore(); CTXMODE=false;
  BUILD[S.mode]();
  CTXMODE=true; envAfter(); CTXMODE=false;
  TR=null;

  OPS.sort(function(a,b){ return a.d-b.d; });
  fitScene();
  R = mulberry32((((S.seed>>>0)||1) ^ 0x5f356495)>>>0);

  queue = [];
  queue.push(function(){
    ctx.setTransform(EX,0,0,EX,0,0);
    ctx.clearRect(0,0,SW,SH);
    ctx.drawImage(paperFor(S.paper),0,0,SW,SH);
  });
  for(const o of OPS) queue.push(o.f);
  for(const f of chrome()) queue.push(f);
  queue.push(finishSheet);
  qi=0; t0=performance.now();
  if(raf) cancelAnimationFrame(raf);
  progEl.hidden=false; progTxt.textContent='DRAWING';
  raf=requestAnimationFrame(flush);
}
function flush(){
  const budget = S.animate? 10 : 46;
  const st=performance.now();
  while(qi<queue.length && performance.now()-st<budget){ queue[qi++](); }
  progBar.style.width = Math.round(qi/queue.length*100)+'%';
  if(qi<queue.length){ raf=requestAnimationFrame(flush); }
  else{
    raf=0; lastMs=Math.round(performance.now()-t0);
    progEl.hidden=true; progBar.style.width='0%';
    renderInfo();
  }
}
function renderSync(){
  qi=0;
  while(qi<queue.length) queue[qi++]();
}

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function hexa(h,a){
  const n=parseInt(h.slice(1),16);

let deb=0;
function regen(now){

  if(now) generate(); else deb=setTimeout(generate,190);

document.body.addEventListener('click',function(e){
  const b=e.target.closest('[data-k][data-v]');
  if(!b) return;
  const k=b.dataset.k, v=b.dataset.v;
  if(k==='genre'){
    if(S.genre===v) return;
    S.genre=v;
    S.mode=modesOf(v)[0];
    S.shape=Object.keys(SHAPESETS[v])[0];
    S.site=Object.keys(SITESETS[v])[0];
    if(VARSETS[v]) S.variant=Object.keys(VARSETS[v])[1]||Object.keys(VARSETS[v])[0];
    buildTabs(); buildOpts(); sync(); generate();
    return;
  }
  S[k]= (k==='floors'||k==='bldgs') ? +v : v;
  sync(); regen(true);
});
optsEl.addEventListener('input',function(e){
  const r=e.target;
  if(r.type==='range'){ S[r.dataset.k]=+r.value; sync(); regen(); return; }
  if(r.id==='fTitle'){ S.title=r.value; regen(); return; }
  if(r.id==='fSeed'){
    const n=parseInt(r.value.replace(/\D/g,''),10);
    if(!isNaN(n)){ S.seed=n; regen(); }
  }
});
optsEl.addEventListener('click',function(e){
  if(e.target.closest('#btnSeedRoll')) newSeed();
});
document.getElementById('btnRoll').addEventListener('click',newSeed);
function newSeed(){
  S.seed=Math.floor(Math.random()*99999)+1;
  document.getElementById('fSeed').value=S.seed;
  generate();
}
document.getElementById('btnRedraw').addEventListener('click',function(){ generate(); });
document.getElementById('btnAnim').addEventListener('click',function(){ S.animate=!S.animate; sync(); });
document.getElementById('btnRotL').addEventListener('click',function(){ S.rot=(S.rot+3)%4; generate(); });
document.getElementById('btnRotR').addEventListener('click',function(){ S.rot=(S.rot+1)%4; generate(); });

/* ズーム・パン */
const wrap=document.getElementById('sheetWrap'), vp=document.getElementById('viewport');
let base=1;
function fitView(){
  const r=vp.getBoundingClientRect();
  base=Math.min((r.height-112)/SH,(r.width-44)/SW);
  applyView();
}
function applyView(){
  wrap.style.transform='translate('+S.panx+'px,'+S.pany+'px) scale('+(base*S.zoom)+')';
}
document.getElementById('btnZoomIn').addEventListener('click',function(){ S.zoom=clamp(S.zoom*1.25,.4,5); applyView(); });
document.getElementById('btnZoomOut').addEventListener('click',function(){ S.zoom=clamp(S.zoom/1.25,.4,5); applyView(); });
document.getElementById('btnFit').addEventListener('click',function(){ S.zoom=1; S.panx=0; S.pany=0; applyView(); });
vp.addEventListener('wheel',function(e){
  e.preventDefault();
  S.zoom=clamp(S.zoom*(e.deltaY<0?1.12:1/1.12),.4,5); applyView();
},{passive:false});
let drag=null;
vp.addEventListener('pointerdown',function(e){
  /* ツールバー等の操作を邪魔しない */
  if(e.target.closest('.toolbar, #prog, .hint')) return;
  drag={x:e.clientX,y:e.clientY,px:S.panx,py:S.pany};
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove',function(e){
  if(!drag) return;
  S.panx=drag.px+(e.clientX-drag.x); S.pany=drag.py+(e.clientY-drag.y); applyView();
});
vp.addEventListener('pointerup',function(){ drag=null; });
vp.addEventListener('pointercancel',function(){ drag=null; });
window.addEventListener('resize',fitView);
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT') return;
  if(e.key==='r'||e.key==='R') newSeed();
  if(e.key==='ArrowLeft'){ S.rot=(S.rot+3)%4; generate(); }
  if(e.key==='ArrowRight'){ S.rot=(S.rot+1)%4; generate(); }
});

/* 書き出し */
function download(name,after){
  cv.toBlob(function(b){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
    if(after) after();
  },'image/png');
}
function fname(){
  return (SCENE.name.style.replace(/[^A-Z0-9]+/g,'_')||'DRAWING')+'_'+S.seed+'.png';
}
document.getElementById('btnPng').addEventListener('click',function(){
  if(raf){ cancelAnimationFrame(raf); raf=0; renderSync(); progEl.hidden=true; renderInfo(); }
  download(fname());
});
document.getElementById('btnPng2').addEventListener('click',function(){
  const old=EX; EX=3.6;
  cv.width=SW*EX; cv.height=SH*EX;
  if(raf){ cancelAnimationFrame(raf); raf=0; }
  progEl.hidden=false; progTxt.textContent='HI-RES';
  generate(); renderSync();
  progEl.hidden=true; progBar.style.width='0%';
  download(fname().replace('.png','_HQ.png'), function(){
    EX=old; cv.width=SW*EX; cv.height=SH*EX;
    generate();
  });
});

/* =========================================================================
   起動
   ========================================================================= */
function boot(){
  cv.width=SW*EX; cv.height=SH*EX;
  cv.style.width=SW+'px'; cv.style.height=SH+'px';
  /* 机のテクスチャ */
  const dt=makePaper(240,240,'ROUGH');
  document.documentElement.style.setProperty('--desk-tex','url('+dt.toDataURL()+')');
  buildTabs(); buildOpts(); sync(); fitView();
  generate();
}
boot();
</script>
</body>
</html>
