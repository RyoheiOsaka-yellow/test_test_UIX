合」の累積コストを並べ、前提の数値を画面上で変えて確かめられるようにする。`,to:`/properties/P-0001`,toLabel:`将来修繕シミュレーションを見る`,sources:[3,1]},{title:`修繕は入居率・家賃に直結する`,facts:[`計画修繕を実施したオーナーの約3割が「高い入居率を確保できた」「家賃水準を維持できた」と回答。`,`入居者の7割が、住み替え先選びで「住宅のいたみ・劣化」「維持管理」を重視。`],answer:`修繕の履歴と前後写真を残し、「手入れされている物件」であることをオーナーにも示せるようにする。`,to:`/records?tab=repairs`,toLabel:`修繕履歴を見る`,sources:[0]},{title:`オーナーへの報告が抜けやすく、法令上のリスクにもなる`,facts:[`管理を委託していても、修繕の実施状況を把握していない家主が12.3%いる。`,`令和7年度の国交省の立入検査では168社中118社が是正指導を受け、定期報告義務の違反は17件。`,`修繕履歴は少なくとも「実施期間・工事内容・金額・施工業者名」を記録することが求められている。`],answer:`点検・提案・連絡・工事を物件ごとに1本の時系列で残し、オーナーに何を伝えたかを後から確認できるようにする。`,to:`/properties/P-0001`,toLabel:`連携記録を見る`,sources:[2,5,0]},{title:`情報が分散し、対応が止まっても気づけない`,facts:[`点検報告書・見積・オーナーとのやり取りが別々の場所にあると、指摘が「誰のボールか」分からなくなる。`,`この項目を数値で示す公的・業界団体の調査は見つかっていません。プロダクトの前提としている仮説で、社内ヒアリングでの検証が必要です。`],answer:`指摘ごとに対応状況を持たせ、停滞日数と推奨時期で並べる。`,to:`/`,toLabel:`ダッシュボードを見る`,sources:[]}];function Zq(){return(0,F.jsxs)(F.Fragment,{children:[(0,F.jsx)(`div`,{className:`page-head`,children:(0,F.jsxs)(`div`,{children:[(0,F.jsx)(`h1`,{children:`修繕の課題と、このプロダクトの狙い`}),(0,F.jsx)(`p`,{className:`sub`,children:`公的資料などで確認できた事実と、それに対応する画面をまとめています`})]})}),(0,F.jsx)(`div`,{className:`issues`,children:Xq.map((e,t)=>(0,F.jsxs)(`section`,{className:`card issue`,children:[(0,F.jsx)(`div`,{className:`issue-no`,children:t+1}),(0,F.jsxs)(`div`,{children:[(0,F.jsx)(`h2`,{children:e.title}),(0,F.jsx)(`ul`,{children:e.facts.map(e=>(0,F.jsx)(`li`,{children:e},e))}),e.sources.length>0&&(0,F.jsxs)(`p`,{className:`src`,children:[`出典:`,` `,e.sources.map(e=>(0,F.jsxs)(`a`,{href:Yq[e].url,target:`_blank`,rel:`noreferrer`,children:[Yq[e].label,` `]},e))]})]}),(0,F.jsxs)(`div`,{className:`issue-answer`,children:[(0,F.jsx)(`small`,{children:`このプロダクトでの対応`}),(0,F.jsx)(`p`,{children:e.answer}),(0,F.jsx)(Dn,{to:e.to,className:`btn`,children:e.toLabel})]})]},e.title))})]})}function Qq(){let{findings:e}=Gi(),[t,n]=(0,v.useState)(``),[r,i]=(0,v.useState)(!1),a=(0,v.useRef)(null),o=pt(),s=ut();(0,v.useEffect)(()=>{i(!1),n(``)
