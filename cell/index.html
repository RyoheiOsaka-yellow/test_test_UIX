<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顕微鏡標本 手描きスケッチャー / HAND-DRAWN MICROSCOPY</title>
<style>
:root{
  --ink:#3b3742;
  --ink-soft:#6b6570;
  --ink-faint:#9a94a0;
  --paper:#e7e4dc;
  --paper-2:#f3f0e8;
  --paper-3:#fbf9f4;
  --line:#c8c2c4;
  --accent:#a8397e;
  --accent-2:#3f6b78;
  --tape:rgba(200,196,150,.42);
  --red:#a44a3f;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Zen Kurenaido",-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--paper);
  overflow:hidden;
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
  font-size:13px;
}
body::before{
  /* 実験台の紙目 */
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:var(--desk-tex);
  opacity:.5; mix-blend-mode:multiply;
}
/* ---------- 手描き風の囲み ---------- */
.sk{ position:relative; }
.sk::before{
  content:''; position:absolute; inset:0;
  border:1.4px solid var(--ink);
  border-radius:5px;
  filter:url(#rough);
  pointer-events:none;
  opacity:.62;
}
.sk.dbl::after{
  content:''; position:absolute; inset:2px 1px 0 2px;
  border:1px solid var(--ink);
  border-radius:6px; opacity:.22;
  filter:url(#rough2);
  pointer-events:none;
}
.hand{ filter:url(#ink); }

/* ---------- ヘッダ ---------- */
header{
  position:relative; z-index:2;
  display:flex; align-items:center; gap:14px;
  padding:8px 16px 9px;
  background:linear-gradient(180deg,var(--paper-3),var(--paper-2));
  border-bottom:1.5px solid var(--line);
  flex-wrap:wrap;
}
header::after{
  content:''; position:absolute; left:0; right:0; bottom:-3px; height:3px;
  background:repeating-linear-gradient(90deg,var(--ink-faint) 0 7px,transparent 7px 15px);
  opacity:.25;
}
h1{
  font-size:15px; font-weight:700; letter-spacing:.04em; white-space:nowrap; line-height:1.25;
}
h1 small{
  display:block; font-size:8.5px; letter-spacing:.22em; color:var(--accent);
  font-weight:700; font-family:"Courier New",monospace;
}
.tabs{ display:flex; gap:5px; flex:1; min-width:0; flex-wrap:wrap; }
.genres{ display:flex; gap:5px; flex:none; padding-right:10px; margin-right:2px; border-right:1.5px dashed var(--line); }
.gbtn{
  font:inherit; font-size:11.5px; font-weight:700; cursor:pointer;
  padding:6px 10px 7px; background:transparent; color:var(--ink-soft);
  border:none; white-space:nowrap; position:relative;
}
.gbtn::before{
  content:''; position:absolute; inset:0; border:1.4px solid var(--accent);
  border-radius:13px 11px 14px 12px; opacity:.28; filter:url(#rough); transition:opacity .15s;
}
.gbtn:hover{ color:var(--accent); } .gbtn:hover::before{ opacity:.6; }
.gbtn.on{ color:#fff; background:var(--accent); border-radius:13px 11px 14px 12px; }
.gbtn.on::before{ opacity:1; }
.gbtn span{ position:relative; }
.tab{
  font:inherit; font-size:11.5px; font-weight:600; cursor:pointer;
  padding:6px 11px 7px; background:transparent; color:var(--ink-soft);
  border:none; white-space:nowrap; position:relative;
}
.tab::before{
  content:''; position:absolute; inset:0; border:1.3px solid var(--ink);
  border-radius:14px 12px 15px 11px; opacity:.3; filter:url(#rough);
  transition:opacity .15s;
}
.tab:hover{ color:var(--ink); }
.tab:hover::before{ opacity:.6; }
.tab.on{ color:#fff; background:var(--ink); border-radius:14px 12px 15px 11px; }
.tab.on::before{ opacity:1; }
.tab span{ position:relative; }
.tab em{
  font-style:normal; font-family:"Courier New",monospace; font-size:9px;
  opacity:.6; margin-right:4px; letter-spacing:.05em;
}

/* ---------- 本体 ---------- */
main{ flex:1; display:flex; min-height:0; position:relative; z-index:1; }
aside{
  width:272px; flex:none; overflow-y:auto; overflow-x:hidden;
  background:var(--paper-2);
  border-right:1.5px solid var(--line);
  padding:14px 14px 60px;
}
aside.right{ width:296px; border-right:none; border-left:1.5px solid var(--line); }
aside::-webkit-scrollbar{ width:9px; }
aside::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }

.sec{ margin-bottom:20px; }
.sec > h3{
  font-size:10.5px; letter-spacing:.16em; color:var(--accent);
  font-weight:700; margin-bottom:9px; padding-bottom:5px;
  font-family:"Courier New",monospace;
  border-bottom:1.2px dashed var(--line);
  display:flex; justify-content:space-between; align-items:baseline;
}
.sec > h3 b{ font-family:inherit; font-size:11px; letter-spacing:0; color:var(--ink-soft); font-weight:600; }
h4{ font-size:11px; color:var(--ink-soft); margin:11px 0 5px; font-weight:600; letter-spacing:.02em; }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; }
.chip{
  font:inherit; font-size:11px; cursor:pointer; padding:6px 4px 7px;
  background:transparent; color:var(--ink-soft); border:none;
  position:relative; text-align:center; line-height:1.3;
}
.chip::before{
  content:''; position:absolute; inset:0; border:1.2px solid var(--ink);
  border-radius:4px 6px 4px 7px; opacity:.28; filter:url(#rough2);
}
.chip:hover{ color:var(--ink); }
.chip:hover::before{ opacity:.55; }
.chip.on{ color:var(--ink); font-weight:700; background:rgba(168,57,126,.13); border-radius:4px 6px 4px 7px; }
.chip.on::before{ opacity:.95; border-width:1.6px; }
.chip small{ display:block; font-size:8.5px; font-family:"Courier New",monospace; opacity:.55; letter-spacing:.06em; }

.row{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
.row label{ font-size:11px; color:var(--ink-soft); width:58px; flex:none; font-weight:600; }
.row .val{
  min-width:46px; text-align:right; font-family:"Courier New",monospace;
  font-size:11.5px; font-weight:700; color:var(--ink);
}
input[type=range]{
  flex:1; min-width:0; -webkit-appearance:none; appearance:none;
  height:16px; background:transparent; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:3px; border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 8px);
  opacity:.5;
}
input[type=range]::-moz-range-track{
  height:3px; border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 8px);
  opacity:.5;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:15px; height:15px; margin-top:-6px;
  border-radius:50% 45% 52% 48%; background:var(--paper-3);
  border:1.8px solid var(--ink); box-shadow:1px 1.5px 0 rgba(59,55,66,.25);
}
input[type=range]::-moz-range-thumb{
  width:14px; height:14px; border-radius:50%; background:var(--paper-3);
  border:1.8px solid var(--ink);
}
input[type=text]{
  font:inherit; font-size:12px; width:100%; padding:6px 8px;
  background:transparent; border:none; color:var(--ink);
  position:relative; z-index:1;
}
input[type=text]:focus{ outline:none; }
.field{ position:relative; margin-bottom:7px; }
.field::before{
  content:''; position:absolute; inset:0; border:1.2px solid var(--ink);
  border-radius:4px; opacity:.3; filter:url(#rough2); pointer-events:none;
}

.swatches{ display:flex; gap:7px; flex-wrap:wrap; }
.sw{
  width:33px; height:33px; cursor:pointer; position:relative;
  border-radius:50% 48% 52% 47%; padding:3px;
  display:flex; flex-wrap:wrap; overflow:hidden;
}
.sw::before{
  content:''; position:absolute; inset:0; border:1.5px solid var(--ink);
  border-radius:50% 48% 52% 47%; opacity:.3; filter:url(#rough2);
}
.sw.on::before{ opacity:1; border-width:2.2px; }
.sw.on::after{
  content:''; position:absolute; inset:-4px; border:1.2px dashed var(--accent);
  border-radius:50%; opacity:.85;
}
.sw i{ width:50%; height:50%; display:block; }

.note{ font-size:10px; color:var(--ink-faint); line-height:1.6; margin-top:7px; }
.tray{ display:flex; gap:6px; flex-wrap:wrap; }
.pen{
  width:30px; height:30px; padding:3px; cursor:pointer; background:transparent;
  border:none; position:relative; border-radius:50% 47% 53% 48%;
}
.pen::before{
  content:''; position:absolute; inset:0; border:1.4px solid var(--ink);
  border-radius:50% 47% 53% 48%; opacity:.26; filter:url(#rough2);
}
.pen i{ display:block; width:100%; height:100%; border-radius:50%; }
.pen.erase i{ background:repeating-linear-gradient(45deg,#f2efe4 0 4px,#d8d2c0 4px 8px); }
.pen.on::before{ opacity:1; border-width:2.4px; }
.pen.on::after{
  content:''; position:absolute; inset:-4px; border:1.2px dashed var(--accent);
  border-radius:50%; opacity:.9;
}

/* ---------- ビューポート ---------- */
#viewport{
  flex:1; position:relative; min-width:0; overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.5),transparent 60%),
    linear-gradient(160deg,#d9d6cc,#cbc7bd 60%,#c0bcb2);
  display:flex; align-items:center; justify-content:center;
  cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26'><g transform='rotate(35 13 13)'><rect x='11' y='3' width='4' height='15' fill='%23c9a227' stroke='%233b3742' stroke-width='.8'/><path d='M11 18 L13 23 L15 18 Z' fill='%23f0e6d0' stroke='%233b3742' stroke-width='.8'/><path d='M12.2 21 L13 23 L13.8 21 Z' fill='%233b3742'/></g></svg>") 3 23, crosshair;
}
#sheetWrap{
  position:relative;
  box-shadow:0 10px 34px rgba(40,35,35,.35), 0 2px 6px rgba(40,35,35,.25);
  transition:transform .18s ease-out;
  will-change:transform;
}
#sheet{ display:block; background:#efeade; }
#sheetWrap::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 0 60px rgba(84,74,66,.10);
}
.tape{
  position:absolute; width:74px; height:23px; background:var(--tape);
  border-left:1px solid rgba(255,255,255,.35); border-right:1px solid rgba(150,140,90,.3);
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.tape.tl{ left:-24px; top:-11px; transform:rotate(-38deg); }
.tape.tr{ right:-24px; top:-11px; transform:rotate(38deg); }
.tape.bl{ left:-24px; bottom:-11px; transform:rotate(38deg); }
.tape.br{ right:-24px; bottom:-11px; transform:rotate(-38deg); }

/* ---------- ツールバー ---------- */
.toolbar{
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
  display:flex; align-items:center; gap:6px; z-index:4;
  background:rgba(250,247,240,.94); padding:7px 12px;
  border-radius:24px 22px 25px 23px;
  box-shadow:0 5px 20px rgba(50,42,40,.22);
  flex-wrap:wrap; justify-content:center; max-width:min(94%,760px);
}
.toolbar::before{
  content:''; position:absolute; inset:0; border:1.5px solid var(--ink);
  border-radius:24px 22px 25px 23px; opacity:.5; filter:url(#rough);
  pointer-events:none;
}
.tbtn{
  font:inherit; font-size:11px; font-weight:600; cursor:pointer;
  padding:5px 10px 6px; background:transparent; color:var(--ink-soft);
  border:none; position:relative; white-space:nowrap;
}
.tbtn::before{
  content:''; position:absolute; inset:0; border:1.2px solid var(--ink);
  border-radius:12px 10px 13px 11px; opacity:.3; filter:url(#rough2);
}
.tbtn:hover{ color:var(--ink); } .tbtn:hover::before{ opacity:.62; }
.tbtn.on{ color:#fff; background:var(--ink); border-radius:12px 10px 13px 11px; }
.tbtn.on::before{ opacity:1; }
.tbtn.big{ font-size:11.5px; padding:6px 13px 7px; font-weight:700; color:var(--ink);
  background:rgba(168,57,126,.14); border-radius:12px 10px 13px 11px; }
.tbtn.big::before{ opacity:.75; }
.tsep{ width:1px; height:19px; background:var(--line); }

/* ---------- 右パネル ---------- */
.plate{ background:var(--paper-3); padding:11px 12px 12px; margin-bottom:13px; }
.plate h2{
  font-size:13px; font-weight:700; letter-spacing:.02em; margin-bottom:2px;
  font-family:"Courier New",monospace; font-style:italic;
}
.plate .sub{ font-size:9.5px; color:var(--accent); letter-spacing:.16em; font-family:"Courier New",monospace; }
table.spec{ width:100%; border-collapse:collapse; font-size:10.5px; font-family:"Courier New",monospace; margin-top:8px; }
table.spec td{ padding:3.5px 2px; border-bottom:1px dotted var(--line); letter-spacing:.04em; }
table.spec td:first-child{ color:var(--ink-faint); width:44%; }
table.spec td:last-child{ text-align:right; font-weight:700; }
table.leg{ width:100%; border-collapse:collapse; font-size:10.5px; font-family:"Courier New",monospace; }
table.leg td{ padding:3px 2px; border-bottom:1px dotted var(--line); }
table.leg td.k{ width:16px; }
table.leg td.n{ text-align:right; font-weight:700; width:38px; }
table.leg i{ display:inline-block; width:10px; height:10px; border:1.2px solid var(--ink); border-radius:2px; }
.stat{ display:flex; justify-content:space-between; font-size:10.5px; font-family:"Courier New",monospace; padding:2.5px 0; color:var(--ink-soft); }
.stat b{ color:var(--ink); }

/* ---------- 進捗 ---------- */
#prog{
  position:absolute; left:50%; top:14px; transform:translateX(-50%);
  background:rgba(250,247,240,.95); padding:5px 14px 6px; border-radius:20px;
  font-size:10.5px; font-family:"Courier New",monospace; letter-spacing:.1em;
  display:flex; align-items:center; gap:9px; z-index:5;
  box-shadow:0 3px 12px rgba(50,42,40,.2);
}
#prog[hidden]{ display:none; }
#prog .bar{ width:96px; height:4px; background:rgba(59,55,66,.15); border-radius:3px; overflow:hidden; }
#prog .bar i{ display:block; height:100%; width:0; background:var(--accent); transition:width .1s linear; }
.pencil{ animation:scratch .45s infinite alternate ease-in-out; display:inline-block; }
@keyframes scratch{ from{ transform:translate(-1px,1px) rotate(-6deg);} to{ transform:translate(1px,-1px) rotate(4deg);} }

.hint{
  position:absolute; right:12px; bottom:16px; z-index:3;
  font-size:9.5px; color:rgba(60,52,52,.55); font-family:"Courier New",monospace;
  letter-spacing:.08em; text-align:right; line-height:1.7; pointer-events:none;
}
@media (max-width:1100px){
  aside{ width:232px; } aside.right{ width:246px; }
}
@media (max-width:820px){
  main{ flex-direction:column; }
  aside{ width:100%; max-height:172px; border-right:none; border-bottom:1.5px solid var(--line); padding-bottom:14px; }
  aside.right{ width:100%; max-height:210px; border-left:none; border-top:1.5px solid var(--line); }
  #viewport{ min-height:400px; flex:1 1 400px; }
  .grid2{ grid-template-columns:repeat(4,1fr); }
  .grid3{ grid-template-columns:repeat(6,1fr); }
  .sec{ margin-bottom:14px; }
  .row label{ width:48px; }
  h1{ font-size:13px; }
  .hint{ display:none; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="rough">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough2">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="ink">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="0.9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header>
  <h1><small>HAND-DRAWN MICROSCOPY</small>顕微鏡標本 手描きスケッチャー</h1>
  <div class="genres" id="genres"></div>
  <div class="tabs" id="tabs"></div>
  <button class="tbtn big" id="btnRoll">🎲 新しい標本</button>
</header>

<main>
  <aside id="opts" class="hand"></aside>

  <div id="viewport">
    <div id="prog" hidden><span class="pencil">✎</span><span id="progTxt">DRAWING</span><span class="bar"><i id="progBar"></i></span></div>
    <div id="sheetWrap">
      <span class="tape tl"></span><span class="tape tr"></span>
      <span class="tape bl"></span><span class="tape br"></span>
      <canvas id="sheet"></canvas>
    </div>
    <div class="toolbar">
      <button class="tbtn" id="btnRotL">◀ 視野回転</button>
      <button class="tbtn" id="btnRotR">視野回転 ▶</button>
      <span class="tsep"></span>
      <button class="tbtn" id="btnZoomOut">−</button>
      <button class="tbtn" id="btnZoomIn">＋</button>
      <button class="tbtn" id="btnFit">原寸</button>
      <span class="tsep"></span>
      <button class="tbtn" id="btnLineart">塗り絵(線画)</button>
      <button class="tbtn on" id="btnAnim">描画アニメ</button>
      <button class="tbtn" id="btnRedraw">引き直す</button>
      <span class="tsep"></span>
      <button class="tbtn" id="btnPng">PNG保存</button>
      <button class="tbtn" id="btnPng2">高解像度</button>
    </div>
    <div class="hint">DRAG: 標本を動かす<br>WHEEL: ズーム / R: 再抽選</div>
  </div>

  <aside class="right hand" id="info"></aside>
</main>
<script>
"use strict";
/* =========================================================================
   顕微鏡標本 手描きスケッチャー
   染色したプレパラートを覗いて写生したような細胞スケッチを生成するエディター
   ========================================================================= */

/* ---------------- 乱数 (シード固定) ---------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let R = mulberry32(20270101);
const rnd = () => R();
const rr  = (a,b) => a + (b-a)*R();
const ri  = (a,b) => Math.floor(a + (b-a+1)*R());
const pick = a => a[Math.floor(R()*a.length)];
const chance = p => R() < p;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const TAU = Math.PI*2;

/* ---------------- 染色(色鉛筆パレット) ---------------- */
/* line: 細胞壁・輪郭の色 / deep: 核・濃染部の色 / cols: 塗りとハッチング */
const PALETTES = {
  SAFRANIN:  { label:'サフラニン',       line:'#c4218f', deep:'#151a86', cols:['#e07ab0','#cf3f9d','#9c4390','#e6a8c8'] },
  HE:        { label:'H-E染色',          line:'#b8447a', deep:'#3b2f80', cols:['#e493b0','#bc5b85','#7d5da6','#dcaec0'] },
  METHYLENE: { label:'メチレンブルー',   line:'#2f5fa8', deep:'#132257', cols:['#6b93c8','#3f6aa8','#8fb0d8','#2b4b86'] },
  IODINE:    { label:'ヨウ素ヨウ化カリ', line:'#8a5a1e', deep:'#3a2710', cols:['#c48f45','#a86a2a','#dcb573','#7a5320'] },
  GIEMSA:    { label:'ギムザ染色',       line:'#7a4aa8', deep:'#20176b', cols:['#9f75c4','#c07aa8','#6785c4','#b9a0d4'] },
  GRAM:      { label:'グラム染色',       line:'#5a2a8c', deep:'#2a1160', cols:['#7f4fac','#c2465a','#9463c4','#d4748c'] },
  TOLUIDINE: { label:'トルイジン青',     line:'#2f6f86', deep:'#0f3448', cols:['#4f93a8','#7cb7c6','#356f86','#a8cdd6'] },
  UNSTAINED: { label:'無染色(位相差)',   line:'#59555f', deep:'#33313c', cols:['#8c8a92','#6e6c78','#a6a29c','#585661'] },
};

const PAPERS = {
  BRIGHT:  { label:'明視野',     base:'#eceade', grain:.032, warm:1.0 },
  SKETCH:  { label:'スケッチ紙', base:'#f4efe3', grain:.062, warm:1.02 },
  GRAPH:   { label:'方眼紙',     base:'#eef1ea', grain:.040, warm:.95, grid:true },
  VELLUM:  { label:'トレペ',     base:'#f8f6ec', grain:.026, warm:.98 },
  WHITE:   { label:'白紙',       base:'#fcfaf5', grain:.016, warm:1.0 },
};

/* ---------------- ジャンルとモード ---------------- */
const MODES = {
  /* 藻類・原生生物 */

/* ---------------- 紙テクスチャ ---------------- */
let paperTex = null, paperKey = '';
function makePaper(w,h,type){
  const P = PAPERS[type];
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const g = c.getContext('2d');
  g.fillStyle = P.base; g.fillRect(0,0,w,h);
  const rr2 = mulberry32(999);
  for(let i=0;i<70;i++){
    const x=rr2()*w, y=rr2()*h, r=60+rr2()*260;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    const dark = rr2()<.5;
    gr.addColorStop(0, dark?'rgba(110,102,88,.045)':'rgba(255,253,248,.06)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  const id = g.getImageData(0,0,w,h), d = id.data, amp = P.grain*255;
  for(let i=0;i<d.length;i+=4){
    const n = (rr2()-.5)*amp;
    d[i]=clamp(d[i]+n*1.02,0,255); d[i+1]=clamp(d[i+1]+n,0,255); d[i+2]=clamp(d[i+2]+n*.94,0,255);
  }
  g.putImageData(id,0,0);
  g.globalAlpha=.05; g.strokeStyle='#8a7c68'; g.lineWidth=.6;
  for(let i=0;i<160;i++){
    const x=rr2()*w, y=rr2()*h, a=rr2()*6.28, l=6+rr2()*30;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke();
  }
  if(P.grid){
    g.globalAlpha=.18; g.strokeStyle='#7b93a8'; g.lineWidth=.5;
    for(let x=0;x<w;x+=w/90){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
    for(let y=0;y<h;y+=w/90){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  }
  g.globalAlpha=.05; g.strokeStyle='#6b5c50'; g.lineWidth=1.4;
  for(let i=0;i<3;i++){
    const vert = rr2()<.5;
    const p = (.2+rr2()*.6);
    g.beginPath();
    if(vert){ g.moveTo(w*p,0); g.lineTo(w*p+ (rr2()-.5)*10, h); } else { g.moveTo(0,h*p); g.lineTo(w, h*p+(rr2()-.5)*10); }
    g.stroke();
  }
  g.globalAlpha=1;
  return c;
}
function paperFor(type){
  const key = type+'@'+SW+'x'+SH;
  if(key!==paperKey){ paperTex = makePaper(SW,SH,type); paperKey=key; }
  return paperTex;
}

/* ---------------- 視野(2D投影) ---------------- */
const FRAD = 300;                       /* 視野の基準半径(ワールド単位) */
let ASPY = 1.38;                        /* 視野の縦横比(用紙にあわせる) */
let FIELD = { cx:0, cy:0, rx:FRAD, ry:FRAD*1.38 };
/* 視野のなかのランダムな位置 */
function FPOS(k){
  const a=R()*TAU, t=Math.sqrt(R())*(k!=null?k:1);
  return [Math.cos(a)*t*FRAD, Math.sin(a)*t*FRAD*ASPY];
}
/* 画面上のずれ(u,v)をワールド座標に戻す */
function unrot(u,v){
  const c=Math.cos(-V.rot), s=Math.sin(-V.rot);
  return [u*c - v*s, u*s + v*c];
}
const V = { rot:0, s:1, cx:SW/2, cy:SH*0.47 };
let MEASURE = false, BX = null;
let TR = null;   /* {ox,oy,s,rz} 群体を並べるときの配置変換 */
function TX(x,y){
  if(!TR) return [x,y];
  const c=Math.cos(TR.rz), s=Math.sin(TR.rz);
  return [TR.ox+(x*c-y*s)*TR.s, TR.oy+(x*s+y*c)*TR.s];
}
function P(x,y){
  if(TR){ const t=TX(x,y); x=t[0]; y=t[1]; }
  const c = Math.cos(V.rot), s = Math.sin(V.rot);
  const px = V.cx + (x*c - y*s)*V.s, py = V.cy + (x*s + y*c)*V.s;
  if(MEASURE){
    if(px<BX.x0)BX.x0=px; if(px>BX.x1)BX.x1=px;
    if(py<BX.y0)BX.y0=py; if(py>BX.y1)BX.y1=py;
  }
  return [px,py];
}
/* ワールド長 → 画面長 */
const PS = v => v*V.s*(TR?TR.s:1);
/* ポリゴン(ワールド) → 画面 */
const SCR = pts => pts.map(p=>P(p[0],p[1]));

/* ---------------- 鉛筆・ペンのストローク ---------------- */
let INK = 'rgba(62,60,64,1)';
let INKW = 1.0;
let ROUGH = 1.0;
let strokes = 0;

function wob(a,b,amp){
  const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||.001;
  const n = clamp(Math.round(len/18), 2, 14);
  const nx=-dy/len, ny=dx/len;
  const bow = (R()*2-1) * Math.min(2.6, len*0.014) * amp;
  const pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n, env=Math.sin(Math.PI*t);
    const d = bow*env + (R()*2-1)*0.42*amp;
    pts.push([a[0]+dx*t+nx*d, a[1]+dy*t+ny*d]);
  }
  return pts;
}
function stroke(pts,o){
  if(MEASURE) return;
  o = o||{};
  const col = o.color||INK, w = (o.w!=null?o.w:1)*INKW;
  const a = (o.a!=null?o.a:.80), passes = o.passes!=null?o.passes:2;
  const j = (o.jit!=null?o.jit:.5)*ROUGH;
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=col;
  strokes++;
  for(let p=0;p<passes;p++){
    const ox=(R()*2-1)*j*.8, oy=(R()*2-1)*j*.8;
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const x=pts[i][0]+ox+(R()*2-1)*j*.35, y=pts[i][1]+oy+(R()*2-1)*j*.35;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.globalAlpha = a*(p===0?1:.5+R()*.25);
    ctx.lineWidth = w*(p===0?1:.72);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
/* 画面座標の線 */
function ln2(a,b,o){
  if(MEASURE) return;
  o=o||{};
  const amp = o.amp!=null?o.amp:1;
  let A=a, B=b;
  if(o.over){
    const dx=B[0]-A[0], dy=B[1]-A[1], L=Math.hypot(dx,dy)||1;
    const e=o.over*ROUGH;
    A=[A[0]-dx/L*e*R(), A[1]-dy/L*e*R()];
    B=[B[0]+dx/L*e*R(), B[1]+dy/L*e*R()];
  }
  stroke(wob(A,B,amp), o);
}
/* ワールド座標の線 */
function lnw(p,q,o){ ln2(P(p[0],p[1]), P(q[0],q[1]), o); }
function poly2(pts,o,close){
  for(let i=0;i<pts.length-1;i++) ln2(pts[i],pts[i+1],o);
  if(close) ln2(pts[pts.length-1],pts[0],o);
}
/* なめらかな閉曲線(細胞の輪郭)を一筆で描く */
function curve2(pts,o,close){
  if(MEASURE) return;
  o=o||{};
  const col=o.color||INK, w=(o.w!=null?o.w:1)*INKW;
  const a=(o.a!=null?o.a:.8), passes=o.passes!=null?o.passes:2;
  const j=(o.jit!=null?o.jit:.4)*ROUGH;
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=col;
  strokes++;
  const n=pts.length;
  for(let p=0;p<passes;p++){
    const ox=(R()*2-1)*j*.7, oy=(R()*2-1)*j*.7;
    ctx.beginPath();
    const first = close ? [(pts[0][0]+pts[n-1][0])/2, (pts[0][1]+pts[n-1][1])/2] : pts[0];
    ctx.moveTo(first[0]+ox, first[1]+oy);
    const end = close ? n : n-1;
    for(let i=0;i<end;i++){
      const c=pts[i], d=pts[(i+1)%n];
      const mx=(c[0]+d[0])/2+ox+(R()*2-1)*j*.3, my=(c[1]+d[1])/2+oy+(R()*2-1)*j*.3;
      ctx.quadraticCurveTo(c[0]+ox+(R()*2-1)*j*.3, c[1]+oy+(R()*2-1)*j*.3, mx, my);
    }
    if(!close) ctx.lineTo(pts[n-1][0]+ox, pts[n-1][1]+oy);
    ctx.globalAlpha=a*(p===0?1:.48+R()*.28);
    ctx.lineWidth=w*(p===0?1:.7);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* ---------------- 色鉛筆ハッチング ---------------- */
function hatch2(pts, o){
  if(MEASURE) return;
  o=o||{};
  let col = o.color||'#888';
  let sp  = o.sp || 4.2;
  const ang = o.ang!=null?o.ang : -Math.PI/4;
  let a   = (o.a!=null?o.a:.20) * (S.color/42);
  let wash = o.wash;
  if(!o.raw){
    if(o.reg!==false) regPush(pts);
    const pc = PAINT[CURPART];
    if(pc!=null){ col=pc; a=PAINTO.a; sp=PAINTO.sp; wash=true; }
    else if(LINEART) return;
  }else{
    a = (o.a!=null?o.a:.20);
  }
  if(a<=0.005 || pts.length<3) return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  const w=x1-x0, h=y1-y0;
  if(w<1.2||h<1.2) return;
  ctx.save();
  ctx.beginPath();
  pts.forEach(function(p,i){ i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
  ctx.closePath();
  ctx.clip();
  if(wash){ ctx.globalAlpha=a*.55; ctx.fillStyle=col; ctx.fillRect(x0-2,y0-2,w+4,h+4); }
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const dx=Math.cos(ang), dy=Math.sin(ang);
  const nx=-dy, ny=dx;
  const L=Math.hypot(w,h)*.62;
  const steps=Math.ceil(L*2/sp);
  ctx.strokeStyle=col; ctx.lineCap='round';
  ctx.globalCompositeOperation='multiply';
  for(let i=-steps;i<=steps;i++){
    const off=i*sp + (R()*2-1)*sp*.22;
    const sx=cx+nx*off, sy=cy+ny*off;
    let t0=-L, t1=L;
    if(R()<.30){ t0 += R()*L*.7; }
    if(R()<.30){ t1 -= R()*L*.7; }
    const A=[sx+dx*t0,sy+dy*t0], B=[sx+dx*t1,sy+dy*t1];
    ctx.globalAlpha = a*(.55+R()*.75);
    ctx.lineWidth = (o.w||1.05)*(.75+R()*.6);
    const seg = wob(A,B,1.1);
    ctx.beginPath();
    seg.forEach(function(p,k){ k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
    ctx.stroke();
  }
  if(o.cross){
    const dx2=Math.cos(ang+1.15), dy2=Math.sin(ang+1.15);
    const nx2=-dy2, ny2=dx2;
    for(let i=-steps;i<=steps;i++){
      const off=i*sp*1.5 + (R()*2-1)*sp*.2;
      const sx=cx+nx2*off, sy=cy+ny2*off;
      ctx.globalAlpha = a*(.35+R()*.45);
      ctx.lineWidth = (o.w||1)*(.7+R()*.5);
      const seg = wob([sx+dx2*-L,sy+dy2*-L],[sx+dx2*L,sy+dy2*L],1.1);
      ctx.beginPath();
      seg.forEach(function(p,k){ k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.restore();
}
let PAPERC='#f0ebdd';
/* --- 塗り絵 --- */
let LINEART=false;              /* 線画モード(自動彩色を止める) */
let PAINT={};                   /* 部位番号 -> 色 */
let REGIONS=[];                 /* 当たり判定用 {p:部位番号, pts:画面座標} */
let CURPART=-1;                 /* いま描いている部位 */
function regPush(pts){ if(!MEASURE && CURPART>=0) REGIONS.push({p:CURPART,pts:pts}); }
function inPoly(pts,x,y){
  let c=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const a=pts[i], b=pts[j];
    if(((a[1]>y)!==(b[1]>y)) && (x < (b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])) c=!c;
  }
  return c;
}
function hitPart(x,y){
  for(let i=REGIONS.length-1;i>=0;i--) if(inPoly(REGIONS[i].pts,x,y)) return REGIONS[i].p;
  return -1;
}
const PAINTO = {a:.34,sp:3.2,wash:true,raw:true};
function fillPoly(pts,c,a){
  if(MEASURE||!a||pts.length<3) return;
  ctx.save(); ctx.beginPath();
  pts.forEach(function(p,i){ i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
  ctx.closePath(); ctx.globalAlpha=a; ctx.fillStyle=c; ctx.fill(); ctx.restore();
}

/* パレット取得 */
let COLS = PALETTES.SAFRANIN.cols;
let WALL = PALETTES.SAFRANIN.line;

const col = i => COLS[((i%COLS.length)+COLS.length)%COLS.length];

/* =========================================================================
   幾何ヘルパ
   ========================================================================= */
function polyCentroid(pts){
  let a=0,cx=0,cy=0;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const f = pts[j][0]*pts[i][1] - pts[i][0]*pts[j][1];
    a += f; cx += (pts[j][0]+pts[i][0])*f; cy += (pts[j][1]+pts[i][1])*f;
  }
  if(Math.abs(a)<1e-9){
    let sx=0,sy=0; for(const p of pts){ sx+=p[0]; sy+=p[1]; }
    return [sx/pts.length, sy/pts.length];
  }
  a*=0.5;
  return [cx/(6*a), cy/(6*a)];
}
function polyArea(pts){
  let a=0;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++) a += pts[j][0]*pts[i][1] - pts[i][0]*pts[j][1];
  return Math.abs(a/2);
}
function shrinkPoly(pts,k,c){
  c = c || polyCentroid(pts);
  return pts.map(function(p){ return [lerp(c[0],p[0],k), lerp(c[1],p[1],k)]; });
}
function movePoly(pts,dx,dy){ return pts.map(function(p){ return [p[0]+dx,p[1]+dy]; }); }
function rotPoly(pts,a,c){
  c=c||[0,0];
  const co=Math.cos(a), si=Math.sin(a);
  return pts.map(function(p){
    const x=p[0]-c[0], y=p[1]-c[1];
    return [c[0]+x*co-y*si, c[1]+x*si+y*co];
  });
}
function chaikin(pts,n){
  let p=pts;
  for(let k=0;k<(n||1);k++){
    const q=[];
    for(let i=0;i<p.length;i++){
      const a=p[i], b=p[(i+1)%p.length];
      q.push([a[0]*.75+b[0]*.25, a[1]*.75+b[1]*.25]);
      q.push([a[0]*.25+b[0]*.75, a[1]*.25+b[1]*.75]);
    }
    p=q;
  }
  return p;
}
/* ゆがんだ円(細胞・群体の輪郭) */
function wobRing(cx,cy,r,o){
  o=o||{};
  const n = o.n||36;
  const lobes = o.lobes!=null?o.lobes:ri(4,7);
  const amp = o.amp!=null?o.amp:.10;
  const ph1=R()*TAU, ph2=R()*TAU, lb2=lobes+ri(2,5);
  const ry = r*(o.ry!=null?o.ry:1);
  const pts=[];
  for(let i=0;i<n;i++){
    const a=i/n*TAU;
    const m = 1 + Math.sin(a*lobes+ph1)*amp + Math.sin(a*lb2+ph2)*amp*.45 + (R()*2-1)*amp*.16;
    pts.push([cx+Math.cos(a)*r*m, cy+Math.sin(a)*ry*m]);
  }
  return o.rot? rotPoly(pts,o.rot,[cx,cy]) : pts;
}
function ellipsePts(cx,cy,rx,ry,rot,n){
  n=n||28; const pts=[];
  const co=Math.cos(rot||0), si=Math.sin(rot||0);
  for(let i=0;i<n;i++){
    const a=i/n*TAU, x=Math.cos(a)*rx, y=Math.sin(a)*ry;
    pts.push([cx+x*co-y*si, cy+x*si+y*co]);
  }
  return pts;
}
/* 半平面クリップ(a側を残す) */
function clipHalf(poly,ax,ay,bx,by){
  const mx=(ax+bx)/2, my=(ay+by)/2, nx=bx-ax, ny=by-ay;
  const out=[];
  const sd = function(p){ return (p[0]-mx)*nx + (p[1]-my)*ny; };
  for(let i=0;i<poly.length;i++){
    const A=poly[i], B=poly[(i+1)%poly.length];
    const da=sd(A), db=sd(B);
    if(da<=0) out.push(A);
    if((da<=0)!==(db<=0)){
      const t=da/(da-db);
      out.push([A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t]);
    }
  }
  return out;
}
function voronoiCells(sites,bound){
  return sites.map(function(s,i){
    let poly=bound;
    for(let j=0;j<sites.length;j++){
      if(i===j) continue;
      poly = clipHalf(poly, s[0],s[1], sites[j][0],sites[j][1]);
      if(poly.length<3) break;
    }
    return poly;
  });
}
/* 多角形の内側に散らばる種点 */
function sitesIn(poly,spacing){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of poly){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  const out=[];
  for(let y=y0+spacing*.4; y<y1; y+=spacing*.88){
    const off = ((Math.round((y-y0)/spacing)%2)? spacing*.5 : 0);
    for(let x=x0+spacing*.4+off; x<x1; x+=spacing){
      const p=[x+(R()*2-1)*spacing*.24, y+(R()*2-1)*spacing*.24];
      if(inPoly(poly,p[0],p[1])) out.push(p);
    }
  }
  return out;
}
/* 組織のように細胞で埋める */
function tissue(outline,spacing,o){
  o=o||{};
  let sites=sitesIn(outline,spacing);
  if(!sites.length) sites=[polyCentroid(outline)];
  const relax = o.relax!=null?o.relax:2;
  for(let k=0;k<relax;k++){
    const cs=voronoiCells(sites,outline);
    sites=cs.map(function(c,i){ return c.length>2? polyCentroid(c) : sites[i]; });
  }
  return voronoiCells(sites,outline)
    .filter(function(c){ return c.length>2 && polyArea(c)>spacing*spacing*.10; })
    .map(function(c){ return chaikin(shrinkPoly(c, o.gap!=null?o.gap:.88), o.smooth!=null?o.smooth:2); });
}

/* =========================================================================
   細胞の描画

/* ワールド多角形をひとつの細胞として描く */
function cellDraw(w,o){
  o=o||{};
  const pts=SCR(w);
  if(o.solid!==0) fillPoly(pts, PAPERC, o.solid!=null?o.solid:.55);
  hatch2(pts,{ color:o.color||col(0), a:o.a!=null?o.a:.17, sp:o.sp||3.6,
               ang:o.ang!=null?o.ang:-.7, wash:o.wash!==false, cross:o.cross });
  const lw=o.lw!=null?o.lw:1.15;
  curve2(pts,{ w:lw, a:o.ea!=null?o.ea:.82, color:o.wallc||WALL, passes:o.passes||2, jit:.35 }, true);
  if(o.inner){
    const k = (o.inner===true)? .84 : o.inner;
    curve2(SCR(shrinkPoly(w,k)),{ w:lw*.6, a:.30, color:o.wallc||WALL, passes:1, jit:.3 }, true);
  }
  return pts;
}
/* 深度つきで積む */
function putCell(w,o,d){
  const dd = (d!=null)? d : polyCentroid(w)[1];
  op(dd, function(){ cellDraw(w,o); });
}
/* 小さな粒(細菌・顆粒) */
function dotW(x,y,r,o){
  o=o||{};
  const c=P(x,y), rp=PS(r);
  if(MEASURE) return;
  ctx.save();
  ctx.globalAlpha=o.a!=null?o.a:.85;
  ctx.fillStyle=o.color||DEEP;
  ctx.beginPath();
  const n=9;
  for(let i=0;i<n;i++){
    const a=i/n*TAU, rad=rp*(1+(R()*2-1)*.16);
    const x2=c[0]+Math.cos(a)*rad, y2=c[1]+Math.sin(a)*rad;
    i?ctx.lineTo(x2,y2):ctx.moveTo(x2,y2);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
  strokes++;
  if(o.ring) curve2(SCR(wobRing(x,y,r*1.5,{n:12,lobes:3,amp:.07})),{w:.7,a:.4,color:o.color||DEEP,passes:1},true);
}
/* 核 — 分裂期に応じて中身が変わる */
function nucleusW(cx,cy,r,o){
  o=o||{};
  const st = o.stage||S.stage;
  const c=P(cx,cy);
  if(st==='INTER'){
    const w=wobRing(cx,cy,r,{n:16,lobes:3,amp:.07});
    const pts=SCR(w);
    if(o.solid!==false){
      fillPoly(pts, o.color||DEEP, o.a!=null?o.a:.62);
    }
    curve2(pts,{w:.9,a:.55,color:o.color||DEEP,passes:1},true);
    if(o.nucleolus && PS(r)>5) dotW(cx+r*.2,cy-r*.15,r*.30,{color:o.color||DEEP,a:.9});
    return;
  }
  /* 分裂像 */
  const dc = o.color||DEEP;
  if(st==='PRO'){
    curve2(SCR(wobRing(cx,cy,r*1.15,{n:18,lobes:4,amp:.09})),{w:.7,a:.3,color:dc,passes:1},true);
    for(let i=0;i<6;i++){
      const a=R()*TAU, rad=r*rr(.2,.85);
      const p0=[cx+Math.cos(a)*rad, cy+Math.sin(a)*rad];
      const pts=[p0];
      let ang=R()*TAU;
      for(let k=0;k<4;k++){ ang+=rr(-1.4,1.4); pts.push([pts[k][0]+Math.cos(ang)*r*.30, pts[k][1]+Math.sin(ang)*r*.30]); }
      curve2(SCR(pts),{w:1.5,a:.62,color:dc,passes:1},false);
    }
  }else if(st==='META'){
    for(let i=0;i<6;i++){
      const t=(i/5-.5)*1.7*r;
      lnw([cx+t*.32, cy+t],[cx-t*.32+r*.42, cy+t],{w:2.2,a:.66,color:dc,passes:1,jit:.3});
    }
    for(let i=0;i<8;i++){
      const t=(i/7-.5)*1.8*r;
      lnw([cx-r*1.5, cy], [cx+r*.2, cy+t*.9],{w:.55,a:.22,color:dc,passes:1});
      lnw([cx+r*1.5, cy], [cx+r*.2, cy+t*.9],{w:.55,a:.22,color:dc,passes:1});
    }
  }else{ /* ANA */
    for(const sg of [1,-1]) for(let i=0;i<5;i++){
      const t=(i/4-.5)*1.3*r;
      lnw([cx+sg*r*.85, cy+t],[cx+sg*r*1.35, cy+t*.7],{w:2.0,a:.62,color:dc,passes:1,jit:.3});
    }
    for(let i=0;i<7;i++){
      const t=(i/6-.5)*1.4*r;
      lnw([cx-r*1.45, cy+t*.5],[cx+r*1.45, cy+t*.5],{w:.5,a:.20,color:dc,passes:1});
    }
  }
}
/* 色素体・葉緑体のような濃い短線 */
function barsW(cx,cy,r,n,o){
  o=o||{};
  for(let i=0;i<n;i++){
    const a=R()*TAU, rad=r*rr(0,.5);
    const x=cx+Math.cos(a)*rad, y=cy+Math.sin(a)*rad;
    const ang=o.ang!=null?o.ang:R()*TAU, L=r*rr(.35,.72);
    lnw([x-Math.cos(ang)*L,y-Math.sin(ang)*L],[x+Math.cos(ang)*L,y+Math.sin(ang)*L],
        {w:(o.w||2.1),a:o.a!=null?o.a:.5,color:o.color||WALL,passes:1,jit:.4});
  }
}
/* 顆粒 */
function granulesW(cx,cy,r,n,o){
  o=o||{};
  for(let i=0;i<n;i++){
    const a=R()*TAU, rad=r*Math.sqrt(R())*.85;
    dotW(cx+Math.cos(a)*rad, cy+Math.sin(a)*rad, r*rr(.05,.11), {color:o.color||col(1), a:o.a!=null?o.a:.4});
  }
}
/* 平行な条線(珪藻の条線・筋の横紋) */
function striaeW(pts,n,ang,o){
  o=o||{};
  const c=polyCentroid(pts);
  let rad=0; for(const p of pts) rad=Math.max(rad,Math.hypot(p[0]-c[0],p[1]-c[1]));
  const dx=Math.cos(ang), dy=Math.sin(ang), nx=-dy, ny=dx;
  const sp=2*rad/n;
  for(let i=-n/2;i<=n/2;i++){
    const off=i*sp;
    const A=[c[0]+nx*off-dx*rad, c[1]+ny*off-dy*rad];
    const B=[c[0]+nx*off+dx*rad, c[1]+ny*off+dy*rad];
    const seg=clipSeg(pts,A,B);
    if(seg) lnw(seg[0],seg[1],{w:o.w||.8,a:o.a!=null?o.a:.4,color:o.color||WALL,passes:1,jit:.35});
  }
}
/* 多角形と線分の交差(内側だけ残す) */
function clipSeg(poly,A,B){
  const ts=[0,1];
  for(let i=0;i<poly.length;i++){
    const C=poly[i], D=poly[(i+1)%poly.length];
    const d=(B[0]-A[0])*(D[1]-C[1])-(B[1]-A[1])*(D[0]-C[0]);
    if(Math.abs(d)<1e-9) continue;
    const t=((C[0]-A[0])*(D[1]-C[1])-(C[1]-A[1])*(D[0]-C[0]))/d;
    const u=((C[0]-A[0])*(B[1]-A[1])-(C[1]-A[1])*(B[0]-A[0]))/d;
    if(u>=0&&u<=1&&t>=0&&t<=1) ts.push(t);
  }
  ts.sort(function(a,b){ return a-b; });
  for(let i=0;i<ts.length-1;i++){
    const m=(ts[i]+ts[i+1])/2;
    const px=A[0]+(B[0]-A[0])*m, py=A[1]+(B[1]-A[1])*m;
    if(inPoly(poly,px,py)){
      return [[A[0]+(B[0]-A[0])*ts[i], A[1]+(B[1]-A[1])*ts[i]],
              [A[0]+(B[0]-A[0])*ts[i+1], A[1]+(B[1]-A[1])*ts[i+1]]];
    }
  }
  return null;
}
/* しなやかな毛(鞭毛・繊毛・根毛) */
function hairW(x,y,ang,len,o){
  o=o||{};
  const pts=[[x,y]];
  let a=ang;
  const n=o.n||9;
  for(let i=0;i<n;i++){
    a += (o.curl!=null?o.curl:.28)*(R()*2-1) + (o.bend||0);
    pts.push([pts[i][0]+Math.cos(a)*len/n, pts[i][1]+Math.sin(a)*len/n]);
  }
  curve2(SCR(pts),{w:o.w||.75,a:o.a!=null?o.a:.5,color:o.color||WALL,passes:1,jit:.35},false);
  return pts;
}
/* ゆらぐ経路 */
function walkPath(x,y,ang,seg,steps,curl){
  const pts=[[x,y]];
  let a=ang;
  for(let i=0;i<steps;i++){
    a += (R()*2-1)*curl;
    pts.push([pts[i][0]+Math.cos(a)*seg, pts[i][1]+Math.sin(a)*seg]);
  }
  return pts;
}
/* 経路に沿って細胞を数珠つなぎにする */
function filamentCells(path,w,cellLen,o){
  o=o||{};
  const N=path.length;
  if(N<2) return [];
  const cum=[0];
  for(let i=1;i<N;i++) cum.push(cum[i-1]+Math.hypot(path[i][0]-path[i-1][0], path[i][1]-path[i-1][1]));
  const total=cum[N-1];
  if(total<cellLen*.6) return [];
  const n=Math.max(1,Math.round(total/cellLen));
  const at=function(s){
    s=clamp(s,0,total);
    let i=1; while(i<N-1 && cum[i]<s) i++;
    const t=(s-cum[i-1])/Math.max(1e-6,cum[i]-cum[i-1]);
    const x=lerp(path[i-1][0],path[i][0],t), y=lerp(path[i-1][1],path[i][1],t);
    const dx=path[i][0]-path[i-1][0], dy=path[i][1]-path[i-1][1], L=Math.hypot(dx,dy)||1;
    return [x,y,dx/L,dy/L];
  };
  const cells=[];
  for(let k=0;k<n;k++){
    const s0=total*k/n, s1=total*(k+1)/n;
    const m=9, LL=[], RG=[];
    for(let i=0;i<=m;i++){
      const t=i/m, s=lerp(s0,s1,t);
      const p=at(s);
      let ww=w*(.80+.20*Math.sin(Math.PI*t));
      if(!o.blunt){
        if(k===0)   ww *= (s<w? Math.sqrt(clamp(s/w,.10,1)) : 1);
        if(k===n-1){ const d=total-s; ww *= (d<w? Math.sqrt(clamp(d/w,.10,1)) : 1); }
      }
      const nx=-p[3], ny=p[2];
      LL.push([p[0]+nx*ww, p[1]+ny*ww]);
      RG.push([p[0]-nx*ww, p[1]-ny*ww]);
    }
    RG.reverse();
    cells.push(chaikin(LL.concat(RG),2));
  }
  return cells;
}
/* 視野に漂う雑菌・デブリ */
function debrisField(){
  const n = S.density==='MANY'? 34 : S.density==='MODERATE'? 18 : 7;
  const cr = CELLR()*.10;
  for(let i=0;i<n;i++){
    const a=R()*TAU, t=Math.sqrt(R())*.99;
    const d=unrot(Math.cos(a)*t*FIELD.rx, Math.sin(a)*t*FIELD.ry);
    const x=FIELD.cx+d[0], y=FIELD.cy+d[1];
    const r=Math.max(1.6, cr*rr(.7,1.5));
    const rod = chance(.22);
    op(-8000+i, function(){
      if(rod){
        const ang=R()*TAU;
        lnw([x-Math.cos(ang)*r*1.6,y-Math.sin(ang)*r*1.6],[x+Math.cos(ang)*r*1.6,y+Math.sin(ang)*r*1.6],
            {w:PS(r)*1.5,a:.62,color:DEEP,passes:1,jit:.3});
      }else{
        dotW(x,y,r,{color:DEEP,a:.72});
      }
    });
  }
  leg('DEBRIS',n);
  /* ピントの外れたぼんやりした影 */
  const nb = S.detail==='MINIMAL'? 2 : 5;
  for(let i=0;i<nb;i++){
    const a=R()*TAU, t=rr(.3,1.0);
    const d=unrot(Math.cos(a)*t*FIELD.rx, Math.sin(a)*t*FIELD.ry);
    const x=FIELD.cx+d[0], y=FIELD.cy+d[1], r=FIELD.rx*rr(.05,.13);
    op(-9000+i, function(){
      const pts=SCR(wobRing(x,y,r,{n:20,lobes:4,amp:.2}));
      hatch2(pts,{color:col(2),a:.05,sp:5.2,ang:-.5,wash:true,raw:true});
    });
  }
}
/* 視野いっぱいを採寸させる基準(描かれない) */
function fieldBounds(){
  op(-99999, function(){
    if(!MEASURE) return;
    const c=P(FIELD.cx,FIELD.cy);
    if(c[0]-FIELD.rx<BX.x0) BX.x0=c[0]-FIELD.rx;
    if(c[0]+FIELD.rx>BX.x1) BX.x1=c[0]+FIELD.rx;
    if(c[1]-FIELD.ry<BX.y0) BX.y0=c[1]-FIELD.ry;
    if(c[1]+FIELD.ry>BX.y1) BX.y1=c[1]+FIELD.ry;
  });
}
/* 描いた標本の広がりから視野の大きさを決める */
function measureField(){
  const rot=V.rot, sc=V.s, cx=V.cx, cy=V.cy;
  V.rot=0; V.s=1; V.cx=0; V.cy=0;
  MEASURE=true; BX={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
  for(const o of OPS) o.f();
  MEASURE=false;
  V.rot=rot; V.s=sc; V.cx=cx; V.cy=cy;
  const AR=(FR.y1-FR.y0)/(FR.x1-FR.x0);
  if(BX.x1<BX.x0){ FIELD={cx:0,cy:0,rx:FRAD,ry:FRAD*AR}; return; }
  const mx=(BX.x0+BX.x1)/2, my=(BX.y0+BX.y1)/2;
  let rx=Math.max(24,(BX.x1-BX.x0)/2)*1.10, ry=Math.max(24,(BX.y1-BX.y0)/2)*1.10;
  if(S.fieldsh==='CIRCLE'){ const r=Math.max(rx,ry); rx=r; ry=r; }
  else if(ry/rx < AR) ry=rx*AR; else rx=ry/AR;
  FIELD={ cx:mx, cy:my, rx:rx, ry:ry };
}
/* 細胞半径(スライダー由来) */
function CELLR(){ return 9 + S.size*3.2; }
function ORGN(){ return S.organ==='MANY'? 1.5 : S.organ==='MODERATE'? 1 : .45; }
function DETN(){ return S.detail==='DETAILED'? 1.4 : S.detail==='MODERATE'? 1 : .55; }

/* =========================================================================
   帯状に細胞を並べる(組織・上皮・菌糸で共用)
   ========================================================================= */
function bandCells(path,h0,h1,cellLen,o){
  o=o||{};
  const N=path.length;
  if(N<2) return [];
  const cum=[0];
  for(let i=1;i<N;i++) cum.push(cum[i-1]+Math.hypot(path[i][0]-path[i-1][0], path[i][1]-path[i-1][1]));
  const total=cum[N-1];
  const n=Math.max(1,Math.round(total/cellLen));
  const at=function(s){
    s=clamp(s,0,total);
    let i=1; while(i<N-1 && cum[i]<s) i++;
    const t=(s-cum[i-1])/Math.max(1e-6,cum[i]-cum[i-1]);
    const dx=path[i][0]-path[i-1][0], dy=path[i][1]-path[i-1][1], L=Math.hypot(dx,dy)||1;
    return [lerp(path[i-1][0],path[i][0],t), lerp(path[i-1][1],path[i][1],t), dx/L, dy/L];
  };
  const gap = o.gap!=null?o.gap:.06;
  const cells=[];
  for(let k=0;k<n;k++){
    const s0=total*(k+gap*.5)/n, s1=total*(k+1-gap*.5)/n;
    const m=o.m||5, A=[], B=[];
    for(let i=0;i<=m;i++){
      const t=i/m, s=lerp(s0,s1,t), p=at(s);
      const nx=-p[3], ny=p[2];
      const bulge = o.bulge? (1+o.bulge*Math.sin(Math.PI*t)) : 1;
      A.push([p[0]+nx*h0*bulge, p[1]+ny*h0*bulge]);
      B.push([p[0]+nx*h1*bulge, p[1]+ny*h1*bulge]);
    }
    B.reverse();
    cells.push(chaikin(A.concat(B), o.smooth!=null?o.smooth:2));
  }
  return cells;
}
/* まっすぐな行 */
function rowCells(x0,x1,y0,y1,n,o){
  return bandCells([[x0,(y0+y1)/2],[x1,(y0+y1)/2]], (y0-y1)/2, (y1-y0)/2, Math.abs(x1-x0)/Math.max(1,n), o);
}
/* 円環にならぶ細胞 */
function ringCells(cx,cy,r0,r1,n,o){
  o=o||{};
  const cells=[];
  const ph=R()*TAU;
  for(let i=0;i<n;i++){
    const a0=ph+i/n*TAU+rr(-.01,.01), a1=ph+(i+1)/n*TAU-rr(.005,.02);
    const pts=[];
    for(let k=0;k<=5;k++){ const a=lerp(a0,a1,k/5); pts.push([cx+Math.cos(a)*r0, cy+Math.sin(a)*r0]); }
    for(let k=5;k>=0;k--){ const a=lerp(a0,a1,k/5); pts.push([cx+Math.cos(a)*r1, cy+Math.sin(a)*r1]); }
    cells.push(chaikin(shrinkPoly(pts,.93), o.smooth!=null?o.smooth:1));
  }
  return cells;
}
/* 縁をうねらせる(表皮のジグソー細胞) */
function wavyEdges(poly,amp,waves){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const A=poly[i], B=poly[(i+1)%poly.length];
    const dx=B[0]-A[0], dy=B[1]-A[1], L=Math.hypot(dx,dy)||1;
    const a2=Math.min(amp, L*.30);
    const lobes=Math.max(1, Math.min(waves||2, Math.round(L/(a2*3.2))));
    const nx=-dy/L, ny=dx/L, ph=chance(.5)?0:Math.PI, m=Math.max(5,lobes*5);
    for(let j=0;j<m;j++){
      const t=j/m;
      const d=Math.sin(t*Math.PI*lobes+ph)*a2*Math.sin(Math.PI*t);
      out.push([A[0]+dx*t+nx*d, A[1]+dy*t+ny*d]);
    }
  }
  return out;
}
/* 群ごとに配置を変えて呼ぶ */
function forGroups(fn){
  const n=S.groups;
  if(n<=1){ fn(0); return; }
  for(let i=0;i<n;i++){
    const a = i*2.35+1.1;
    TR = { ox:Math.cos(a)*FRAD*rr(.34,.56), oy:Math.sin(a)*FRAD*rr(.30,.50),
           s: (i===0? .70 : rr(.42,.62)), rz: rr(-3.1,3.1) };
    fn(i);
    TR=null;
  }
}

/* ---------- 藻類 01 糸状体 ---------- */
filament(){
  SCENE.cellUm = 22;
  forGroups(function(){
    const w = CELLR()*.52;
    const spiral = S.shape==='SPIRAL';
    const curl = spiral? .40 : S.shape==='CLUSTER'? .30 : .13;
    const roots = S.shape==='CLUSTER'? ri(3,5) : 1;
    let total=0;
    for(let g=0; g<roots; g++){
      const a0 = S.shape==='CLUSTER'? g/roots*TAU+rr(-.4,.4) : rr(-.7,.7);
      const x0 = S.shape==='CLUSTER'? 0 : -Math.cos(a0)*FRAD*.62;
      const y0 = S.shape==='CLUSTER'? 0 : -Math.sin(a0)*FRAD*.62;
      const steps = S.shape==='CLUSTER'? ri(8,14) : ri(16,24);
      const paths = [ walkPath(x0,y0,a0,w*1.5,steps,curl) ];
      if(S.shape==='BRANCHED'){
        const nb=ri(1,3);
        for(let b=0;b<nb;b++){
          const base=paths[0][ri(3,paths[0].length-3)];
          paths.push(walkPath(base[0],base[1], rr(0,TAU), w*1.5, ri(5,11), curl+.1));
        }
      }
      for(const path of paths){
        const cells = filamentCells(path, w, w*rr(1.5,2.1));
        total += cells.length;
        cells.forEach(function(cp,i){
          putCell(cp,{ color:col(i%2), a:.15, sp:3.4, ang:-.7, inner:.80, lw:1.2 });
          const c=polyCentroid(cp);
          op(polyCentroid(cp)[1]+.4, function(){
            if(spiral){
              const pts=[];
              for(let k=0;k<=16;k++){
                const t=k/16;
                pts.push([lerp(cp[0][0],cp[Math.floor(cp.length/2)][0],t)+Math.sin(t*7)*w*.55,
                          lerp(cp[0][1],cp[Math.floor(cp.length/2)][1],t)+Math.cos(t*7)*w*.55]);
              }
              curve2(SCR(pts),{w:Math.max(1.4,PS(w)*.22),a:.5,color:col(1),passes:1},false);
            }else{
              barsW(c[0],c[1],w*.75,Math.round(3*ORGN()),{color:col(1),a:.45,w:Math.max(1.3,PS(w)*.20)});
            }
            if(ORGN()>1 || S.stage!=='INTER') nucleusW(c[0],c[1],w*.24,{a:.5});
            if(DETN()>1) granulesW(c[0],c[1],w*.7,3,{color:col(2),a:.3});
          });
        });
      }
    }
    leg('CELLS',total); leg('FILAMENT',roots);
    if(S.shape==='SPIRAL') leg('SPIRAL CHLOROPLAST',total);
    else leg('CHLOROPLAST',total);
  });
  note(-CELLR()*.6, 0, 'CELL WALL', -1);
  note(CELLR()*.4, CELLR()*.8, 'CHLOROPLAST', 1);
},

/* ---------- 藻類 02 群体 ---------- */
colony(){
  SCENE.cellUm = 26;
  forGroups(function(gi){
    const attach = (S.shape!=='CLUSTER');
    const cx = attach? FRAD*.24 : 0, cy = attach? -FRAD*.10 : 0;
    const rad = FRAD*(attach? .40 : .48);
    const outline = wobRing(cx,cy,rad,{n:72, lobes:ri(8,13), amp:.075});
    const sp = CELLR()*.95;
    const cells = tissue(outline, sp, {gap:.87, smooth:2, relax:2});
    const big = cells.length? ri(0,cells.length-1) : 0;
    cells.forEach(function(cp,i){
      putCell(cp,{ color:col(i%3), a:.16, sp:3.4, ang:-.7+((i%3)*.5), inner:.82, lw:1.15 });
      const c=polyCentroid(cp);
      let r=0; for(const p of cp) r=Math.max(r,Math.hypot(p[0]-c[0],p[1]-c[1]));
      op(c[1]+.4, function(){
        barsW(c[0],c[1],r*.7,Math.round(3*ORGN()),{color:col(1),a:.5,w:Math.max(1.4,PS(r)*.24)});
        if(i===big) nucleusW(c[0],c[1],r*.34,{a:.85});
        else if(S.stage!=='INTER' || (ORGN()>1.2 && chance(.35))) nucleusW(c[0],c[1],r*.20,{a:.5});
        if(DETN()>1) granulesW(c[0],c[1],r*.75,2,{color:col(2),a:.3});
      });
    });
    leg('COLONY CELLS',cells.length); leg('COLONY',1);
    /* 群体から伸びる糸状体 */
    if(attach){
      const nf = S.density==='FEW'? 1 : ri(1,2);
      for(let k=0;k<nf;k++){
        const a = Math.PI + rr(-.5,.5) - k*.55;
        const sx = cx+Math.cos(a)*rad*.98, sy = cy+Math.sin(a)*rad*.98;
        const w = CELLR()*.46;
        const path = walkPath(sx,sy,a,w*1.6,ri(14,22),.30);
        const fc = filamentCells(path,w,w*rr(1.5,2.0));
        fc.forEach(function(cp,i){
          putCell(cp,{ color:col(i%2), a:.13, sp:3.6, ang:-.6, inner:.80, lw:1.15 });
          const c=polyCentroid(cp);
          op(c[1]+.4, function(){
            granulesW(c[0],c[1],w*.62,Math.round(4*ORGN()),{color:col(1),a:.34});
            if(DETN()>1.2) barsW(c[0],c[1],w*.6,1,{color:col(1),a:.3,w:Math.max(1,PS(w)*.14)});
          });
        });
        leg('FILAMENT CELLS',fc.length);
        if(S.shape==='BRANCHED' && chance(.8)){
          const base = path[ri(4,path.length-4)];
          const bp = walkPath(base[0],base[1], rr(0,TAU), w*1.5, ri(5,9), .3);
          const bc = filamentCells(bp,w*.92,w*1.7);
          bc.forEach(function(cp,i){
            putCell(cp,{ color:col(i%2), a:.13, sp:3.6, ang:-.6, inner:.80, lw:1.1 });
          });
          leg('BRANCH',1); leg('FILAMENT CELLS',bc.length);
        }
      }
    }
  });
  note(FRAD*.24, -FRAD*.10, 'NUCLEUS', 1);
  note(-FRAD*.30, FRAD*.05, 'FILAMENT', -1);
},

/* ---------- 藻類 03 珪藻 ---------- */
diatom(){
  SCENE.cellUm = 64;
  const n = S.density==='MANY'? ri(6,9) : S.density==='MODERATE'? ri(4,6) : ri(2,3);
  let centric=0, pennate=0;
  for(let i=0;i<n;i++){
    const fp=FPOS(.74);
    const cx=fp[0], cy=fp[1];
    const sc=rr(.7,1.25)*(i===0?1.25:1);
    const r=CELLR()*.9*sc;
    const kind = (S.shape==='STRAIGHT')? 'pennate' : (S.shape==='CLUSTER')? (chance(.5)?'centric':'pennate')
               : (S.shape==='SPIRAL')? 'pennate' : 'centric';
    const rot=R()*TAU;
    if(kind==='centric'){
      centric++;
      const poly = wobRing(cx,cy,r,{n:48,lobes:ri(14,22),amp:.035});
      putCell(poly,{ color:col(0), a:.12, sp:4.2, ang:-.7, inner:.90, lw:1.25 });
      op(cy+.4, function(){
        const m=Math.round(rr(22,34));
        for(let k=0;k<m;k++){
          const aa=k/m*TAU+rot;
          lnw([cx+Math.cos(aa)*r*.30, cy+Math.sin(aa)*r*.30],
              [cx+Math.cos(aa)*r*.94, cy+Math.sin(aa)*r*.94],
              {w:.75,a:.42,color:WALL,passes:1,jit:.35});
        }
        curve2(SCR(wobRing(cx,cy,r*.28,{n:20,lobes:5,amp:.05})),{w:.9,a:.5,color:WALL,passes:1},true);
        if(ORGN()>.5) barsW(cx,cy,r*.6,Math.round(4*ORGN()),{color:col(1),a:.35,w:Math.max(1.2,PS(r)*.09)});
        dotW(cx,cy,r*.07,{color:DEEP,a:.7});
      });
    }else{
      pennate++;
      const L=r*1.75, W=r*.46;
      const pts=[];
      for(let k=0;k<=26;k++){
        const t=k/26, x=lerp(-L,L,t);
        const y=W*Math.pow(Math.max(0,1-Math.pow(Math.abs(x)/L,2.2)),.62);
        pts.push([x,y]);
      }
      for(let k=26;k>=0;k--){
        const t=k/26, x=lerp(-L,L,t);
        const y=-W*Math.pow(Math.max(0,1-Math.pow(Math.abs(x)/L,2.2)),.62);
        pts.push([x,y]);
      }
      const poly = movePoly(rotPoly(pts,rot),cx,cy);
      putCell(poly,{ color:col(1), a:.12, sp:4.0, ang:rot-.6, inner:.88, lw:1.25 });
      op(cy+.4, function(){
        striaeW(poly, Math.round(rr(16,26)), rot+Math.PI/2, {w:.7,a:.4});
        lnw([cx-Math.cos(rot)*L*.86, cy-Math.sin(rot)*L*.86],
            [cx+Math.cos(rot)*L*.86, cy+Math.sin(rot)*L*.86],{w:1.3,a:.55,color:WALL,passes:1});
        dotW(cx,cy,r*.10,{color:DEEP,a:.72});
        if(ORGN()>.8){
          for(const sg of [1,-1])
            dotW(cx+Math.cos(rot)*L*.42*sg, cy+Math.sin(rot)*L*.42*sg, r*.12, {color:col(1),a:.45});
        }
      });
    }
  }
  if(centric) leg('CENTRIC FRUSTULE',centric);
  if(pennate) leg('PENNATE FRUSTULE',pennate);
  leg('STRIAE',ri(180,420));
  note(0,0,'RAPHE',1);
},

/* ---------- 藻類 04 鞭毛藻 ---------- */
flagellate(){
  SCENE.cellUm = 34;
  const n = S.density==='MANY'? ri(7,11) : S.density==='MODERATE'? ri(4,7) : ri(2,4);
  for(let i=0;i<n;i++){
    const fp=FPOS(.76);
    const cx=fp[0], cy=fp[1];
    const r=CELLR()*.82*rr(.75,1.25)*(i===0?1.3:1);
    const rot=R()*TAU;
    /* 洋なし形 */
    const pts=[];
    for(let k=0;k<32;k++){
      const t=k/32*TAU;
      const rr2 = r*(1 + .30*Math.cos(t) - .10*Math.cos(2*t));
      pts.push([Math.cos(t)*rr2*.72, Math.sin(t)*rr2*1.15]);
    }
    const poly = movePoly(rotPoly(chaikin(pts,1),rot),cx,cy);
    putCell(poly,{ color:col(0), a:.15, sp:3.4, ang:rot, inner:.84, lw:1.2 });
    op(cy+.5, function(){
      const c=polyCentroid(poly);
      barsW(c[0],c[1],r*.66,Math.round(4*ORGN()),{color:col(1),a:.45,w:Math.max(1.3,PS(r)*.13)});
      nucleusW(c[0]-Math.cos(rot)*r*.35, c[1]-Math.sin(rot)*r*.35, r*.26,{a:.6,nucleolus:true});
      dotW(c[0]+Math.cos(rot+.5)*r*.55, c[1]+Math.sin(rot+.5)*r*.55, r*.13,{color:PALETTES[S.palette].cols[1],a:.8});
      if(DETN()>.8) curve2(SCR(wobRing(c[0]-Math.cos(rot)*r*.75, c[1]-Math.sin(rot)*r*.75, r*.20,{n:14,lobes:3,amp:.05})),
                           {w:.8,a:.42,color:WALL,passes:1},true);
      const nf = S.shape==='BRANCHED'? 1 : 2;
      for(let k=0;k<nf;k++){
        const ang = rot - Math.PI/2 + (k?-.35:.35);
        hairW(c[0]+Math.cos(rot+Math.PI/2)*r*.9, c[1]+Math.sin(rot+Math.PI/2)*r*.9,
              ang+Math.PI, r*rr(2.0,3.0), {curl:.45,w:.8,a:.5,n:12});
      }
    });
  }
  leg('FLAGELLATE CELLS',n); leg('FLAGELLA',n*2);
  leg('EYESPOT',n); leg('CHLOROPLAST',n*Math.round(4*ORGN()));
  note(0,0,'EYESPOT',1);
},

/* ---------- 植物 01 葉の断面 ---------- */
leaf(){
  SCENE.cellUm = 42;
  const X = FRAD*.95, u = CELLR()*.80;
  let y = -u*5.2;
  const lay=[];
  /* クチクラ */
  const ycut=y;
  op(-100, function(){
    const pts=[];
    for(let i=0;i<=40;i++) pts.push([lerp(-X,X,i/40), ycut-u*.30+Math.sin(i*.8)*u*.06]);
    curve2(SCR(pts),{w:1.5,a:.5,color:WALL,passes:1},false);
  });
  lay.push({y:ycut-u*.3, label:'CUTICLE'});
  /* 上表皮 */
  const upper = rowCells(-X,X, y, y+u*.95, Math.round(2*X/(u*1.15)), {smooth:2,bulge:.05});
  upper.forEach(function(cp,i){ putCell(cp,{color:col(3),a:.10,sp:4.2,ang:-.5,lw:1.1}); });
  leg('UPPER EPIDERMIS',upper.length);
  lay.push({y:y+u*.5, label:'UPPER EPID.'});
  y += u*.95;
  /* 柵状組織 */
  const rows = S.shape==='DICOT'? 2 : 1;
  let pal=0;
  for(let rw=0; rw<rows; rw++){
    const h = u*2.0*(rw?0.85:1);
    const cells = rowCells(-X,X, y, y+h, Math.round(2*X/(u*.72)), {smooth:2,bulge:.05});
    cells.forEach(function(cp,i){
      putCell(cp,{color:col(0),a:.15,sp:3.4,ang:-.75,inner:.84,lw:1.1});
      const c=polyCentroid(cp);
      op(c[1]+.4, function(){
        granulesW(c[0],c[1],u*.60,Math.round(6*ORGN()),{color:col(1),a:.5});
        if(ORGN()>1.2) nucleusW(c[0],c[1]+h*.28,u*.20,{a:.5});
      });
    });
    pal+=cells.length; y+=h;
  }
  leg('PALISADE',pal); leg('CHLOROPLAST',pal*Math.round(6*ORGN()));
  lay.push({y:y-u*1.0, label:'PALISADE'});
  /* 海綿状組織 */
  const spH = u*3.4;
  const spOut = [[-X,y],[X,y],[X,y+spH],[-X,y+spH]];
  const spongy = tissue(spOut, u*1.25, {gap:.74, smooth:2, relax:1});
  spongy.forEach(function(cp,i){
    if(chance(.18)) return;                    /* 細胞間隙 */
    putCell(cp,{color:col(0),a:.13,sp:3.8,ang:-.6,lw:1.05});
    const c=polyCentroid(cp);
    op(c[1]+.4, function(){ granulesW(c[0],c[1],u*.42,Math.round(4*ORGN()),{color:col(1),a:.44}); });
  });
  leg('SPONGY MESOPHYLL',spongy.length); leg('AIR SPACE',Math.round(spongy.length*.18));
  lay.push({y:y+spH*.5, label:'SPONGY'});
  /* 維管束 */
  const vx = rr(-X*.35, X*.35), vy = y+spH*.5, vr=u*1.5;
  op(vy, function(){
    curve2(SCR(wobRing(vx,vy,vr*1.25,{n:30,lobes:7,amp:.06})),{w:1.2,a:.5,color:WALL,passes:1},true);
  });
  const xy = ringCells(vx,vy-vr*.25, 0, vr*.7, 5, {});
  xy.forEach(function(cp){ putCell(cp,{color:col(2),a:.26,sp:2.8,ang:-.9,lw:1.2,cross:true}, vy+1); });
  const ph = ringCells(vx,vy+vr*.55, 0, vr*.42, 7, {});
  ph.forEach(function(cp){ putCell(cp,{color:col(3),a:.16,sp:3.2,ang:.6,lw:1.0}, vy+1); });
  leg('XYLEM',xy.length); leg('PHLOEM',ph.length); leg('VASCULAR BUNDLE',1);
  y += spH;
  /* 下表皮と気孔 */
  const lower = rowCells(-X,X, y, y+u*.9, Math.round(2*X/(u*1.15)), {smooth:2,bulge:.05});
  lower.forEach(function(cp){ putCell(cp,{color:col(3),a:.10,sp:4.2,ang:-.5,lw:1.1}); });
  leg('LOWER EPIDERMIS',lower.length);
  lay.push({y:y+u*.45, label:'LOWER EPID.'});
  const ns = S.detail==='MINIMAL'? 1 : ri(2,3);
  for(let i=0;i<ns;i++){
    const sx = rr(-X*.8, X*.8), sy = y+u*.45;
    op(sy+2, function(){ stoma(sx,sy,u*.62,Math.PI/2); });
  }
  leg('STOMATA',ns);
  SCENE.layers = lay;
  note(0, -u*4.2, 'CUTICLE', -1);
  note(vx, vy, 'VASCULAR BUNDLE', 1);
},
/* ---------- 植物 02 茎の断面 ---------- */
stem(){
  SCENE.cellUm = 46;
  const RO = FRAD*.86, u=CELLR()*.55;
  const mono = S.shape==='MONOCOT';
  /* 表皮 */
  const nEp = Math.max(24, Math.round(TAU*RO/(u*1.1)));
  ringCells(0,0,RO*.94,RO,nEp,{}).forEach(function(cp){
    putCell(cp,{color:col(3),a:.13,sp:3.4,ang:-.5,lw:1.15});
  });
  leg('EPIDERMIS',nEp);
  /* 皮層 */
  let r1=RO*.94, cort=0;
  for(let k=0;k<3;k++){
    const r0=r1-u*rr(1.1,1.5);
    const nn=Math.max(14,Math.round(TAU*(r0+r1)/2/(u*1.35)));
    ringCells(0,0,r0,r1,nn,{}).forEach(function(cp,i){
      putCell(cp,{color:col(0),a:.12,sp:3.8,ang:-.7,lw:1.05});
      if(ORGN()>1 && chance(.5)){
        const c=polyCentroid(cp);
        op(c[1]+.4, function(){ granulesW(c[0],c[1],u*.42,3,{color:col(1),a:.36}); });
      }
    });
    cort+=nn; r1=r0;
  }
  leg('CORTEX',cort);
  /* 髄 */
  const pith = tissue(wobRing(0,0,r1*(mono?.98:.72),{n:44,lobes:6,amp:.03}), u*2.0, {gap:.86,smooth:2});
  pith.forEach(function(cp){ putCell(cp,{color:col(0),a:.09,sp:4.6,ang:-.6,lw:1.0}); });
  leg('PITH',pith.length);
  /* 維管束 */
  const nb = mono? ri(7,11) : ri(6,9);
  for(let i=0;i<nb;i++){
    const a = i/nb*TAU + rr(-.05,.05);
    const rad = mono? r1*rr(.42,.86) : r1*.85;
    const bx=Math.cos(a)*rad, by=Math.sin(a)*rad;
    const br=u*1.7;
    op(by, function(){
      curve2(SCR(wobRing(bx,by,br*1.15,{n:26,lobes:6,amp:.07})),{w:1.15,a:.45,color:WALL,passes:1},true);
    });
    const xr = ringCells(bx+Math.cos(a)*br*.25, by+Math.sin(a)*br*.25, 0, br*.62, 4, {});
    xr.forEach(function(cp){ putCell(cp,{color:col(2),a:.26,sp:2.8,ang:-.9,lw:1.2,cross:true}, by+1); });
    const pr = ringCells(bx-Math.cos(a)*br*.55, by-Math.sin(a)*br*.55, 0, br*.40, 6, {});
    pr.forEach(function(cp){ putCell(cp,{color:col(3),a:.16,sp:3.0,ang:.6,lw:1.0}, by+1); });
    if(S.detail!=='MINIMAL'){
      const fx=bx-Math.cos(a)*br*1.05, fy=by-Math.sin(a)*br*1.05;
      op(by+1.5, function(){
        hatch2(SCR(wobRing(fx,fy,br*.45,{n:18,lobes:4,amp:.1})),{color:col(1),a:.30,sp:2.4,ang:a,wash:true});
      });
      leg('FIBRE CAP',1);
    }
    leg('VASCULAR BUNDLE',1); leg('XYLEM',xr.length); leg('PHLOEM',pr.length);
  }
  note(0,0,'PITH',1);
  note(0,-FRAD*.86,'EPIDERMIS',-1);
},

/* ---------- 植物 03 根端 ---------- */
roottip(){
  SCENE.cellUm = 26;
  const u=CELLR()*.60, W=FRAD*.34, H=FRAD*1.45;
  const yTip = H*.46;                       /* 先端(下)の位置 */
  const yCap = yTip - W*.62;                /* 根冠のすぐ内側 */
  /* --- 行をつくる(先端ほど細胞が小さい) --- */
  const rows=[];
  let y=yCap;
  while(y > -H*.56 && rows.length<70){
    const d = clamp((yCap-y)/(H*.60), 0, 1);          /* 先端からの距離 */
    const hh = u*(0.62 + 2.3*d);
    rows.push({ y0:y-hh, y1:y, d:d, h:hh });
    y -= hh*1.03;
  }
  const halfW=function(yy){
    const t = clamp((yCap-yy)/(W*1.25), 0, 1);        /* 先端ほど細くする */
    return W*(0.46+0.54*t);
  };
  let stn=0, con=0, mit=0;
  rows.forEach(function(row,ri2){
    const wid = halfW((row.y0+row.y1)/2);
    const sw  = wid*0.28;
    const young = row.d < .28;
    /* 中心柱 */
    const nS = Math.max(2, Math.round(2*sw/(u*1.05)));
    rowCells(-sw,sw,row.y0,row.y1,nS,{smooth:2}).forEach(function(cp){
      putCell(cp,{color:col(2),a:.17,sp:3.0,ang:-.9,lw:1.05});
      const c=polyCentroid(cp);
      if(young || ORGN()>1)
        op(c[1]+.5, function(){ nucleusW(c[0],c[1],Math.min(u*.22,row.h*.28),{a:.5}); });
    });
    stn+=nS;
    /* 皮層と表皮 */
    for(const sg of [1,-1]){
      const nC = Math.max(2, Math.round((wid-sw)/(u*1.10)));
      const cs = rowCells(sg*sw, sg*wid, row.y0, row.y1, nC, {smooth:2});
      cs.forEach(function(cp,i){
        const outer = (i===cs.length-1);
        putCell(cp,{color:outer?col(3):col(0), a:outer?.13:.10, sp:3.8, ang:-.6, lw:outer?1.2:1.05});
        const c=polyCentroid(cp);
        const mitotic = young && S.stage!=='INTER' && chance(.35);
        if(mitotic){ op(c[1]+.6, function(){ nucleusW(c[0],c[1],Math.min(u*.30,row.h*.34),{a:.6}); }); mit++; }
        else if(young || (ORGN()>1 && chance(.45)))
          op(c[1]+.5, function(){ nucleusW(c[0],c[1],Math.min(u*.22,row.h*.26),{a:.45,nucleolus:false}); });
      });
      con+=nC;
      /* 根毛(成熟部の表皮から) */
      if(row.d>.55 && chance(.55)){
        const hy=(row.y0+row.y1)/2, hx=sg*wid;
        const hl=u*rr(2.6,4.6);
        op(hy+1, function(){
          const hp=walkPath(hx,hy,sg>0?rr(-.5,.5):Math.PI+rr(-.5,.5),hl/4,4,.22);
          const hc=filamentCells(hp,u*.17,hl*2,{blunt:false})[0];
          if(hc) cellDraw(hc,{color:col(3),a:.10,sp:4.2,ang:-.5,lw:.95,solid:.3});
        });
        leg('ROOT HAIRS',1);
      }
    }
  });
  leg('STELE',stn); leg('CORTEX',con);
  if(mit) leg('MITOTIC FIGURES',mit);
  leg('MERISTEM',Math.round((stn+con)*.22));
  /* --- 根の輪郭 --- */
  op(-60, function(){
    for(const sg of [1,-1]){
      const side=[];
      for(let i=0;i<=26;i++){
        const yy=lerp(-H*.56,yCap,i/26);
        side.push([sg*halfW(yy), yy]);
      }
      curve2(SCR(side),{w:1.5,a:.42,color:WALL,passes:1},false);
    }
  });
  /* --- 根冠(先端を包む層) --- */
  let capn=0;
  const cy0 = yCap - W*.55;
  for(let layer=0; layer<2; layer++){
    const r0 = W*(0.62+layer*0.30), r1 = W*(0.90+layer*0.30);
    const m = 7+layer*2;
    for(let i=0;i<m;i++){
      const a0 = Math.PI*(0.02 + 0.96*(i/m)), a1 = Math.PI*(0.02 + 0.96*((i+1)/m)) - .02;
      const pts=[];
      for(let k=0;k<=5;k++){ const a=lerp(a0,a1,k/5); pts.push([Math.cos(a)*r0, cy0+Math.sin(a)*r0*.92]); }
      for(let k=5;k>=0;k--){ const a=lerp(a0,a1,k/5); pts.push([Math.cos(a)*r1, cy0+Math.sin(a)*r1*.92]); }
      putCell(chaikin(shrinkPoly(pts,.93),2),{color:col(3),a:.12,sp:3.8,ang:-.5,lw:1.05});
      capn++;
    }
  }
  leg('ROOT CAP',capn);
  /* 分泌された粘液 */
  if(S.detail!=='MINIMAL'){
    op(-70, function(){
      const pts=[];
      for(let i=0;i<=40;i++){
        const a=Math.PI*(i/40);
        pts.push([Math.cos(a)*W*1.34, cy0+Math.sin(a)*W*1.30]);
      }
      curve2(SCR(pts),{w:.8,a:.16,color:WALL,passes:1},false);
    });
    leg('MUCIGEL',1);
  }
  SCENE.layers = [{y:cy0+W*.9,label:'ROOT CAP'},{y:yCap-H*.06,label:'MERISTEM'},
                  {y:yCap-H*.28,label:'ELONGATION'},{y:-H*.45,label:'MATURATION'}];
  note(0, yCap-H*.04, 'MERISTEM', 1);
  note(0, -H*.32, 'STELE', -1);
},


/* ---------- 植物 04 表皮 ---------- */
epidermis(){
  SCENE.cellUm = 52;
  const X=FRAD*.92, Y=FRAD*ASPY*.92;
  const region=[[-X,-Y],[X,-Y],[X,Y],[-X,Y]];
  const raw = tissue(region, CELLR()*2.3, {gap:.92, smooth:0, relax:2});
  const jig = S.shape==='DICOT'||S.shape==='AQUATIC';
  const cells = raw.map(function(c){
    return chaikin(jig? wavyEdges(c, CELLR()*.42, 3) : wavyEdges(c, CELLR()*.10, 1), 2);
  });
  const stom=[];
  cells.forEach(function(cp,i){
    const c=polyCentroid(cp);
    const isSt = chance(S.density==='MANY'? .16 : S.density==='MODERATE'? .10 : .05) && polyArea(cp)>CELLR()*CELLR();
    if(isSt){ stom.push(c); return; }
    putCell(cp,{color:col(0),a:.11,sp:4.0,ang:-.65,inner:.90,lw:1.2});
    if(ORGN()>.5){
      op(c[1]+.4, function(){
        nucleusW(c[0]+rr(-.2,.2)*CELLR(), c[1]+rr(-.2,.2)*CELLR(), CELLR()*.16,{a:.5,nucleolus:true});
        if(DETN()>1) granulesW(c[0],c[1],CELLR()*.7,3,{color:col(1),a:.28});
      });
    }
  });
  leg('EPIDERMAL CELLS',cells.length-stom.length);
  stom.forEach(function(c){
    op(c[1]+2, function(){ stoma(c[0],c[1],CELLR()*.62,R()*TAU); });
  });
  leg('STOMATA',stom.length); leg('GUARD CELLS',stom.length*2);
  note(stom.length?stom[0][0]:0, stom.length?stom[0][1]:0, 'GUARD CELL', 1);
},

/* ---------- 動物 01 血液塗抹 ---------- */
blood(){
  SCENE.cellUm = 16;
  const r = CELLR()*.5;
  const n = S.density==='MANY'? 78 : S.density==='MODERATE'? 46 : 24;
  const pos=[];
  for(let i=0;i<n*3 && pos.length<n;i++){
    const p=FPOS(.95);
    let ok=true;
    for(const q of pos) if(Math.hypot(p[0]-q[0],p[1]-q[1])<r*1.55){ ok=false; break; }
    if(ok) pos.push(p);
  }
  pos.forEach(function(p,i){
    const rc=r*rr(.9,1.1);
    const poly=wobRing(p[0],p[1],rc,{n:24,lobes:ri(3,5),amp:.05});
    putCell(poly,{color:col(1),a:.20,sp:3.0,ang:-.7,lw:1.05,ea:.7});
    op(p[1]+.4, function(){
      /* 中央のうすい窪み */
      fillPoly(SCR(wobRing(p[0],p[1],rc*.45,{n:16,lobes:3,amp:.06})), PAPERC, .38);
      curve2(SCR(wobRing(p[0],p[1],rc*.45,{n:16,lobes:3,amp:.06})),{w:.6,a:.22,color:WALL,passes:1},true);
    });
  });
  leg('ERYTHROCYTES',pos.length);
  /* 白血球 */
  const nw = S.detail==='MINIMAL'? 1 : ri(2,4);
  for(let i=0;i<nw;i++){
    const fp=FPOS(.72);
    const cx=fp[0], cy=fp[1], rc=r*rr(1.4,1.9);
    const poly=wobRing(cx,cy,rc,{n:28,lobes:ri(4,7),amp:.07});
    putCell(poly,{color:col(0),a:.14,sp:3.4,ang:-.6,lw:1.15});
    const lobed = chance(.6);
    op(cy+.6, function(){
      if(lobed){
        const nl=ri(3,4);
        for(let k=0;k<nl;k++){
          const aa=k/nl*TAU+rr(-.3,.3), rd=rc*.42;
          nucleusW(cx+Math.cos(aa)*rd, cy+Math.sin(aa)*rd, rc*.30,{a:.7,solid:true});
        }
      }else{
        nucleusW(cx,cy,rc*.62,{a:.72,nucleolus:false});
      }
      granulesW(cx,cy,rc*.85,Math.round(9*ORGN()),{color:col(2),a:.4});
    });
    leg(lobed?'NEUTROPHIL':'LYMPHOCYTE',1);
  }
  /* 血小板 */
  const np = S.density==='FEW'? 3 : ri(6,12);
  for(let i=0;i<np;i++){
    const fp=FPOS(.94);
    const x=fp[0], y=fp[1];
    op(y, function(){
      const pl=wobRing(x,y,r*.22,{n:12,lobes:4,amp:.18});
      hatch2(SCR(pl),{color:col(2),a:.5,sp:2.0,ang:-.6,wash:true});
      curve2(SCR(pl),{w:.7,a:.5,color:WALL,passes:1},true);
    });
  }
  leg('PLATELETS',np);
  note(0,0,'ERYTHROCYTE',-1);
},

/* ---------- 動物 02 上皮 ---------- */
epithelium(){
  SCENE.cellUm = 24;
  const u=CELLR()*1.35;
  const base = walkPath(-FRAD*.95, rr(-FRAD*.1,FRAD*.2), rr(-.14,.14), FRAD*.24, 9, .16);
  const strat = S.shape==='STRATIFIED';
  const tall = S.shape==='COLUMNAR'? 3.0 : S.shape==='SMOOTH'? .9 : 1.9;
  /* 基底膜 */
  op(-50, function(){
    curve2(SCR(base),{w:1.8,a:.55,color:WALL,passes:2},false);
    const p2=base.map(function(p){ return [p[0],p[1]+u*.22]; });
    curve2(SCR(p2),{w:.7,a:.25,color:WALL,passes:1},false);
  });
  leg('BASEMENT MEMBRANE',1);
  const layers = strat? 4 : 1;
  let tot=0;
  for(let L=0;L<layers;L++){
    const h0 = -u*(tall*(L)+.1), h1 = -u*(tall*(L+1)-.1);
    const sc = strat? (1 - L*0.16) : 1;
    const cells = bandCells(base, h0*sc, h1*sc, u*(strat? 1.15+L*.25 : 1.0), {bulge:.06,smooth:2});
    cells.forEach(function(cp,i){
      putCell(cp,{color:col(L%2),a:.13,sp:3.6,ang:-.7,lw:1.1});
      const c=polyCentroid(cp);
      const goblet = (S.shape==='COLUMNAR') && chance(.18);
      op(c[1]+.5+L, function(){
        if(goblet){
          hatch2(SCR(shrinkPoly(cp,.72)),{color:col(3),a:.34,sp:2.4,ang:.7,wash:true});
          leg('GOBLET CELL',1);
          nucleusW(c[0], c[1]+u*tall*.30, u*.22,{a:.6});
        }else{
          nucleusW(c[0], c[1]+(strat?0:u*tall*.18), u*(strat? .30-L*.04 : .26),{a:.62,nucleolus:DETN()>1});
        }
        if(DETN()>1) granulesW(c[0],c[1],u*.5,3,{color:col(2),a:.26});
      });
    });
    tot+=cells.length;
  }
  leg(strat?'STRATIFIED CELLS':'EPITHELIAL CELLS',tot);
  /* 微絨毛 */
  if(S.shape==='COLUMNAR'){
    const top = base.map(function(p){ return [p[0], p[1]-u*tall-u*.1]; });
    op(500, function(){
      for(let i=0;i<Math.round(2*FRAD/(u*.16));i++){
        const t=i/Math.round(2*FRAD/(u*.16));
        const idx=clamp(Math.floor(t*(top.length-1)),0,top.length-2);
        const p=[lerp(top[idx][0],top[idx+1][0],(t*(top.length-1))%1), lerp(top[idx][1],top[idx+1][1],(t*(top.length-1))%1)];
        lnw(p,[p[0],p[1]-u*.28],{w:.55,a:.35,color:WALL,passes:1,jit:.4});
      }
    });
    leg('BRUSH BORDER',1);
  }
  /* 結合組織側 */
  const nf = S.density==='FEW'? 4 : ri(8,16);
  for(let i=0;i<nf;i++){
    const t=R(), idx=clamp(Math.floor(t*(base.length-1)),0,base.length-2);
    const bx=lerp(base[idx][0],base[idx+1][0],R()), by=lerp(base[idx][1],base[idx+1][1],R())+u*rr(1.0,5.0);
    op(by, function(){
      const e=ellipsePts(bx,by,u*.42,u*.16,rr(-.6,.6),14);
      hatch2(SCR(e),{color:col(2),a:.3,sp:2.2,ang:-.5,wash:true});
      curve2(SCR(e),{w:.75,a:.45,color:WALL,passes:1},true);
      if(chance(.6)) hairW(bx-u*rr(1,3), by+u*rr(-1,1), rr(-.4,.4), u*rr(2,4),{curl:.12,w:.6,a:.28});
    });
  }
  leg('FIBROBLASTS',nf);
  SCENE.layers=[{y:base[0][1]-u*tall,label:'APICAL'},{y:base[0][1],label:'BASAL'}];
  note(base[4][0], base[4][1]-u*tall*.5, 'EPITHELIAL CELL', 1);
},

/* ---------- 動物 03 神経細胞 ---------- */
neuron(){
  SCENE.cellUm = 40;
  const r=CELLR()*1.55;
  const cx=-FRAD*.18, cy=-FRAD*.12;
  const nd = S.shape==='SIMPLE'? 3 : S.shape==='SMOOTH'? 2 : ri(4,6);
  /* 樹状突起 */
  let branches=0;
  function dend(x,y,ang,len,w,depth){
    const path=walkPath(x,y,ang,len/5,5,.20);
    op(y, function(){
      curve2(SCR(path),{w:Math.max(.7,PS(w)),a:.62,color:WALL,passes:1,jit:.4},false);
      if(w>r*.06) curve2(SCR(path.map(function(p,i){ return [p[0]+PS(0)+w*.0, p[1]]; })),{w:Math.max(.5,PS(w)*.4),a:.16,color:WALL,passes:1},false);
    });
    branches++;
    const end=path[path.length-1];
    if(depth>0 && len>r*.5){
      const spread=rr(.5,.95);
      dend(end[0],end[1],ang-spread,len*rr(.55,.78),w*.62,depth-1);
      dend(end[0],end[1],ang+spread,len*rr(.55,.78),w*.62,depth-1);
    }else if(DETN()>1){
      op(end[1]+1, function(){ dotW(end[0],end[1],r*.045,{color:WALL,a:.45}); });
    }
  }
  const ang0=R()*TAU;
  for(let i=0;i<nd;i++) dend(cx,cy, ang0+i/nd*TAU+rr(-.2,.2), r*rr(1.3,2.1), r*.16, S.detail==='MINIMAL'?1:3);
  leg('DENDRITES',branches);
  /* 細胞体 */
  const soma=[];
  for(let i=0;i<40;i++){
    const a=i/40*TAU;
    let m=1+.10*Math.sin(a*3+ang0);
    for(let k=0;k<nd;k++){
      const da=Math.abs(((a-(ang0+k/nd*TAU))%TAU+TAU+Math.PI)%TAU-Math.PI);
      if(da<.5) m += .45*Math.cos(da*Math.PI/1.0);
    }
    soma.push([cx+Math.cos(a)*r*m, cy+Math.sin(a)*r*m]);
  }
  putCell(chaikin(soma,1),{color:col(0),a:.16,sp:3.2,ang:-.7,lw:1.35}, cy+2);
  op(cy+3, function(){
    nucleusW(cx,cy,r*.34,{a:.55,nucleolus:true});
    granulesW(cx,cy,r*.85,Math.round(16*ORGN()),{color:col(1),a:.42});
  });
  leg('SOMA',1); leg('NISSL BODIES',Math.round(16*ORGN()));
  /* 軸索 */
  const axAng = ang0+Math.PI*.55;
  const ax = walkPath(cx+Math.cos(axAng)*r, cy+Math.sin(axAng)*r, axAng, FRAD*.18, 8, .12);
  const seg = bandCells(ax, -r*.20, r*.20, FRAD*.30, {bulge:.22,smooth:2});
  seg.forEach(function(cp,i){
    putCell(cp,{color:col(2),a:.14,sp:3.4,ang:axAng,lw:1.1});
    const c=polyCentroid(cp);
    if(ORGN()>.5) op(c[1]+.5, function(){ nucleusW(c[0]+r*.28,c[1]+r*.16,r*.10,{a:.6}); });
  });
  op(9, function(){
    curve2(SCR(ax),{w:Math.max(.8,PS(r*.06)),a:.45,color:WALL,passes:1},false);
  });
  leg('MYELIN SEGMENTS',seg.length); leg('NODES OF RANVIER',Math.max(0,seg.length-1));
  leg('SCHWANN NUCLEI',seg.length);
  /* グリア */
  const ng = S.density==='MANY'? ri(10,16): S.density==='MODERATE'? ri(5,9) : ri(2,4);
  for(let i=0;i<ng;i++){
    const fp=FPOS(.80);
    const x=fp[0], y=fp[1];
    op(y, function(){ nucleusW(x,y,r*.13,{a:.5,stage:'INTER'}); });
  }
  leg('GLIAL CELLS',ng);
  note(cx,cy,'NUCLEUS',-1);
  note(ax[4][0],ax[4][1],'AXON',1);
},

/* ---------- 動物 04 筋線維 ---------- */
muscle(){
  SCENE.cellUm = 46;
  const smooth = S.shape==='SMOOTH';
  const cardiac = S.shape==='STRATIFIED';
  if(smooth){
    const n = S.density==='MANY'? 26 : S.density==='MODERATE'? 16 : 9;
    for(let i=0;i<n;i++){
      const a=rr(-.35,.35), fp=FPOS(.86);
      const cx=fp[0], cy=fp[1];
      const L=CELLR()*rr(2.2,3.4), W=CELLR()*.34;
      const pts=[];
      for(let k=0;k<=24;k++){
        const t=k/24, x=lerp(-L,L,t);
        pts.push([x, W*Math.pow(Math.max(0,1-Math.pow(Math.abs(x)/L,2)),.7)]);
      }
      for(let k=24;k>=0;k--){
        const t=k/24, x=lerp(-L,L,t);
        pts.push([x, -W*Math.pow(Math.max(0,1-Math.pow(Math.abs(x)/L,2)),.7)]);
      }
      const poly=movePoly(rotPoly(chaikin(pts,1),a+rr(-.2,.2)),cx,cy);
      putCell(poly,{color:col(0),a:.14,sp:3.4,ang:a,lw:1.1});
      op(cy+.5, function(){ nucleusW(cx,cy,W*.55,{a:.62,nucleolus:DETN()>1}); });
    }
    leg('SMOOTH MUSCLE CELLS',n); leg('NUCLEI',n);
    note(0,0,'SPINDLE CELL',1);
    return;
  }
  const nf = S.density==='MANY'? 6 : S.density==='MODERATE'? 4 : 3;
  const h = FRAD*1.6/nf;
  for(let i=0;i<nf;i++){
    const y0 = -FRAD*.8 + i*h + h*.5;
    const path = walkPath(-FRAD*.98, y0, rr(-.05,.05), FRAD*.33, 6, .06);
    const w = h*.36;
    const cells = cardiac? bandCells(path,-w,w, FRAD*.55, {bulge:.05,smooth:2})
                         : [ bandCells(path,-w,w, FRAD*2.4, {smooth:2})[0] ];
    cells.forEach(function(cp,k){
      if(!cp) return;
      putCell(cp,{color:col(i%2),a:.15,sp:3.6,ang:-.15,lw:1.25});
      op(polyCentroid(cp)[1]+.5, function(){
        /* 横紋 */
        const nst = Math.round((cardiac? 26:70)*DETN());
        striaeW(cp, nst, Math.PI/2, {w:.65,a:.30});
        if(DETN()>1) striaeW(cp, Math.round(nst/3), Math.PI/2, {w:1.1,a:.22});
      });
      /* 核 */
      const nn = cardiac? 1 : Math.round(4*DETN());
      for(let m=0;m<nn;m++){
        const t=(m+.5)/nn;
        const idx=clamp(Math.floor(t*(path.length-1)),0,path.length-2);
        const px=lerp(path[idx][0],path[idx+1][0],(t*(path.length-1))%1);
        const py=lerp(path[idx][1],path[idx+1][1],(t*(path.length-1))%1);
        const off = cardiac? 0 : (chance(.5)?1:-1)*w*.72;
        op(py+1, function(){ nucleusW(px+rr(-w,w), py+off, w*.22,{a:.6}); });
      }
      leg('NUCLEI',nn);
    });
    /* 介在板 */
    if(cardiac){
      leg('INTERCALATED DISCS',cells.length-1);
    }
    leg(cardiac?'CARDIAC FIBRE':'SKELETAL FIBRE',1);
    leg('MYOFIBRILS',Math.round(24*DETN()));
    /* 筋内膜のすきま */
    op(y0+w*1.2, function(){
      const p2=path.map(function(p){ return [p[0],p[1]+w*1.16]; });
      curve2(SCR(p2),{w:.6,a:.18,color:WALL,passes:1},false);
    });
  }
  note(-FRAD*.4, -FRAD*.6, 'CROSS STRIATION', -1);
},

/* ---------- 微生物 01 桿菌 ---------- */
bacilli(){
  SCENE.cellUm = 3.2;
  const w = CELLR()*.30, L = w*rr(2.6,3.6);
  const groups = S.shape==='SINGLE'? 40 : S.shape==='CHAIN'? 11 : S.shape==='PALISADE'? 13 : 14;
  const gm = S.density==='MANY'? 1.5 : S.density==='MODERATE'? 1 : .55;
  let cells=0, spores=0;
  for(let g=0; g<Math.round(groups*gm); g++){
    const fp=FPOS(.86);
    const gx=fp[0], gy=fp[1];
    const dir=R()*TAU;
    const n = S.shape==='CHAIN'? ri(4,9) : S.shape==='CLUMP'? ri(3,6) : S.shape==='PALISADE'? ri(3,6) : 1;
    for(let i=0;i<n;i++){
      let x=gx, y=gy, ang=dir;
      if(S.shape==='CHAIN'){ x+=Math.cos(dir)*i*L*2.25; y+=Math.sin(dir)*i*L*2.25; ang=dir+rr(-.10,.10); }
      else if(S.shape==='PALISADE'){ x+=Math.cos(dir+Math.PI/2)*i*w*2.7; y+=Math.sin(dir+Math.PI/2)*i*w*2.7; ang=dir+rr(-.12,.12); }
      else if(S.shape==='CLUMP'){ const aa=R()*TAU, rd=w*rr(0,3.2); x+=Math.cos(aa)*rd; y+=Math.sin(aa)*rd; ang=R()*TAU; }
      const path=[[x-Math.cos(ang)*L, y-Math.sin(ang)*L],[x+Math.cos(ang)*L, y+Math.sin(ang)*L]];
      const poly=filamentCells(path,w,L*1.6)[0];
      if(!poly) continue;
      cells++;
      putCell(poly,{color:col(0),a:.30,sp:2.4,ang:ang-.6,lw:1.1,ea:.85});
      const spore = chance(.16) && S.detail!=='MINIMAL';
      op(y+.4, function(){
        if(spore){
          const e=ellipsePts(x+Math.cos(ang)*L*.45, y+Math.sin(ang)*L*.45, w*.85, w*.72, ang, 14);
          fillPoly(SCR(e),PAPERC,.85);
          curve2(SCR(e),{w:.9,a:.6,color:WALL,passes:1},true);
        }
        if(ORGN()>1 && !spore) dotW(x,y,w*.28,{color:DEEP,a:.5});
        if(S.stage!=='INTER' && chance(.3))
          lnw([x+Math.cos(ang+Math.PI/2)*w, y+Math.sin(ang+Math.PI/2)*w],
              [x-Math.cos(ang+Math.PI/2)*w, y-Math.sin(ang+Math.PI/2)*w],{w:1.2,a:.6,color:WALL,passes:1});
      });
      if(spore) spores++;
      if(DETN()>1.2 && chance(.25)){
        op(y, function(){
          for(let k=0;k<3;k++) hairW(x+Math.cos(ang)*L, y+Math.sin(ang)*L, ang+rr(-.7,.7), L*rr(1.2,2.2),{curl:.5,w:.5,a:.30});
        });
        leg('FLAGELLA',3);
      }
    }
  }
  leg('BACILLI',cells);
  if(spores) leg('ENDOSPORES',spores);
  note(0,0,'ROD-SHAPED CELL',1);
},

/* ---------- 微生物 02 球菌 ---------- */
cocci(){

  const groups = Math.round((S.shape==='SINGLE'? 28 : 13)*gm);

  for(let g=0; g<groups; g++){

      if(ORGN()>1) op(y+.3, function(){ dotW(x,y,rc*.3,{color:DEEP,a:.4}); });
    };

      for(let i=0;i<n;i++){ ang+=rr(-.35,.35); put(x,y,r*rr(.9,1.1)); x+=Math.cos(ang)*r*1.95; y+=Math.sin(ang)*r*1.95; }

/* ---------- 微生物 03 酵母 ---------- */
yeast(){

  const r=CELLR()*.48;
  const n = S.density==='MANY'? 26 : S.density==='MODERATE'? 17 : 10;
  let buds=0;

        putCell(bp,{color:col(1),a:.20,sp:2.6,ang:ang,inner:.82,lw:1.1}, by+.2);

/* ---------- 微生物 04 菌糸 ---------- */
mycelium(){
  SCENE.cellUm = 9;
  const w=CELLR()*.29;
  const roots = S.shape==='SINGLE'? 2 : S.shape==='CHAIN'? 2 : 3;
  let comp=0, tips=[];
  function hypha(x,y,ang,steps,depth){
    const path=walkPath(x,y,ang,w*3.0,steps,.20);
    const cells=filamentCells(path,w,w*rr(5,8),{blunt:true});
    cells.forEach(function(cp,i){
      putCell(cp,{color:col(i%2),a:.13,sp:3.2,ang:ang-.5,lw:1.05});
      if(ORGN()>1){
        const c=polyCentroid(cp);
        op(c[1]+.4, function(){ granulesW(c[0],c[1],w*.6,Math.round(3*ORGN()),{color:col(1),a:.32}); });
      }
    });
    comp+=cells.length;
    const end=path[path.length-1];
    tips.push([end[0],end[1],ang]);
    if(depth>0){
      const nb=ri(1,2);
      for(let b=0;b<nb;b++){
        const base=path[ri(2,path.length-2)];
        hypha(base[0],base[1], ang+rr(-1.2,1.2), Math.max(4,Math.round(steps*.6)), depth-1);
      }
    }
  }
  for(let g=0;g<roots;g++){
    const a=g/roots*TAU+rr(-.4,.4);
    hypha(-Math.cos(a)*FRAD*.75, -Math.sin(a)*FRAD*ASPY*.7, a, ri(9,14), S.detail==='MINIMAL'?1:2);
  }
  leg('HYPHAL COMPARTMENTS',comp); leg('SEPTA',Math.max(0,comp-roots));
  /* 胞子のう */
  const ns = S.detail==='MINIMAL'? 1 : Math.min(tips.length, ri(2,4));
  for(let i=0;i<ns;i++){
    const t=tips[Math.floor(R()*tips.length)];
    const hr=w*rr(2.6,3.8);
    const hx=t[0]+Math.cos(t[2])*hr*.8, hy=t[1]+Math.sin(t[2])*hr*.8;
    const head=wobRing(hx,hy,hr,{n:30,lobes:ri(5,9),amp:.06});
    putCell(head,{color:col(2),a:.22,sp:2.8,ang:-.6,lw:1.3}, hy+2);
    op(hy+3, function(){
      const nsp=Math.round(rr(8,16)*DETN());
      for(let k=0;k<nsp;k++){
        const aa=R()*TAU, rd=hr*Math.sqrt(R())*.8;
        dotW(hx+Math.cos(aa)*rd, hy+Math.sin(aa)*rd, hr*.12,{color:DEEP,a:.55});
      }
    });
    leg('SPORANGIA',1); leg('SPORES',Math.round(12*DETN()));
  }
  note(0,0,'SEPTUM',1);
},
