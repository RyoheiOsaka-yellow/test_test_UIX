<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XBUILD | Crypto.com Arena デジタルツイン — 1to1 マーケティング基盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b12; --panel:#111622; --panel2:#18202f; --line:#28324a;
  --txt:#e9edf6; --sub:#8590a8;
  --acc:#00c2ff;            /* アリーナ外装LEDブルー */
  --accdim:#0a4a6b;
  --gold:#fdb927;           /* Lakers gold */
  --purple:#8a5cc4;         /* Lakers purple (明度up) */
  --ok:#3ddc84; --warn:#ff6b5e; --blue:#4da3ff; --pink:#ff5fa2;
  --mono:'Oswald','Noto Sans JP',sans-serif; --jp:'Noto Sans JP',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--jp);background:var(--bg);color:var(--txt);overflow:hidden;font-size:13px}
#canvas-wrap{position:fixed;inset:0}
#canvas-wrap.pc-grad{background:linear-gradient(180deg,#01060f 0%,#04243f 55%,#0d5f8f 125%)}
#canvas-wrap.bp-grad{background:#0a1836}
canvas{display:block}

/* ===== Header ===== */
#hdr{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:linear-gradient(180deg,rgba(8,11,18,.94),rgba(8,11,18,.75) 70%,transparent);
  z-index:30;pointer-events:none}
#hdr>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .x{font-family:var(--mono);font-size:19px;font-weight:600;color:#fff;letter-spacing:.5px}
.brand .nm{font-size:12px;color:var(--sub);letter-spacing:.08em}
.hdr-title{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--txt);
  border-left:2px solid var(--acc);padding-left:10px}
.hdr-title small{display:block;font-size:9.5px;color:var(--sub);font-weight:400;letter-spacing:.04em}
#lvl-crumb{display:flex;gap:6px;margin-left:auto;font-family:var(--mono);font-size:11px}
.crumb{padding:5px 12px;display:flex;align-items:center;gap:6px;border-radius:20px;border:1px solid var(--line);color:var(--sub);cursor:pointer;
  letter-spacing:.06em;transition:.2s;background:rgba(17,22,34,.8)}
.crumb.active{border-color:var(--acc);color:var(--acc);background:rgba(0,194,255,.1)}
.crumb:hover{color:var(--txt)}

/* ===== Left panel ===== */
#panel{position:fixed;top:62px;left:12px;width:306px;max-height:calc(100vh - 150px);
  background:rgba(17,22,34,.94);border:1px solid var(--line);border-radius:12px;z-index:25;
  display:flex;flex-direction:column;backdrop-filter:blur(8px);overflow:hidden}
#panel-body{overflow-y:auto;padding:12px}
#panel-body::-webkit-scrollbar{width:6px}
#panel-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.sec{margin-bottom:14px}
.sec-t{font-size:10px;letter-spacing:.13em;color:var(--sub);margin-bottom:7px;font-weight:700}
.sec-t b{color:var(--acc)}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--acc);line-height:1.15}
.kpi .v small{font-size:11px;color:var(--sub);font-family:var(--jp);font-weight:400}
.kpi .v.g{color:var(--gold)} .kpi .v.p{color:var(--purple)} .kpi .v.k{color:var(--ok)}
.kpi .l{font-size:10px;color:var(--sub);margin-top:2px}

.mode-list{display:flex;flex-direction:column;gap:5px}
.mode-btn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);cursor:pointer;transition:.15s;color:var(--txt);font-size:12px;text-align:left;
  font-family:var(--jp);width:100%}
.mode-btn:hover{border-color:#3d4a6b}
.mode-btn.active{border-color:var(--acc);background:rgba(0,194,255,.09)}
.mode-btn .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.mode-btn .desc{font-size:10px;color:var(--sub);display:block;margin-top:1px}

.row-btns{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);color:var(--sub);
  cursor:pointer;font-size:11px;transition:.15s;font-family:var(--jp)}
.chip.active{border-color:var(--acc);color:var(--acc);background:rgba(0,194,255,.08)}
.chip:hover{color:var(--txt)}
.chip.sm{padding:4px 9px;font-size:10px}

.tool-btn{width:100%;padding:8px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px dashed var(--line);background:transparent;
  color:var(--sub);cursor:pointer;font-size:11px;font-family:var(--jp);transition:.15s}
.tool-btn:hover{border-color:var(--acc);color:var(--acc)}
.tool-btn.active{border-style:solid;border-color:var(--acc);color:var(--acc);background:rgba(0,194,255,.08)}

.legend{display:flex;flex-direction:column;gap:3px}
.legend .li{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--sub)}
.legend .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.hint{font-size:10px;color:var(--sub);line-height:1.55;background:rgba(0,194,255,.05);
  border-left:2px solid var(--accdim);padding:6px 8px;border-radius:0 6px 6px 0}
.hint b{color:var(--acc)}
.grad-bar{height:8px;border-radius:4px;background:linear-gradient(90deg,#1b2a55,#2e7fb8,#3ddc84,#fdb927,#ff6b5e)}
.grad-lbl{display:flex;justify-content:space-between;font-size:9px;color:var(--sub);margin-top:3px}

.bar-row{display:flex;align-items:center;gap:6px;font-size:10.5px;margin-bottom:3px}
.bar-row span{width:86px;color:var(--sub);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bar{flex:1;height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;border-radius:4px}
.bar-row b{width:44px;text-align:right;font-family:var(--mono);font-weight:500;color:var(--txt)}


/* ===== アイコン / 折りたたみ / レール / ツールチップ ===== */
.ic{display:inline-block;vertical-align:-2px;flex-shrink:0}
#ui-tip{position:fixed;z-index:80;display:none;pointer-events:none;background:#0b0f19;
  border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:10.5px;color:var(--txt);
  box-shadow:0 4px 18px rgba(0,0,0,.6);white-space:nowrap}
#viz-tip{position:fixed;z-index:80;display:none;pointer-events:none;background:rgba(11,15,25,.97);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:10.5px;color:var(--txt);
  box-shadow:0 6px 22px rgba(0,0,0,.7);line-height:1.6;max-width:250px}
#viz-tip b{color:var(--acc)}
#viz-tip div{margin-top:2px;color:var(--sub)}
#viz-tip div b{color:var(--txt)}
#viz-tip i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

#panel-top{display:flex;align-items:center;gap:8px;padding:9px 11px 7px;border-bottom:1px solid var(--line);
  flex-shrink:0}
#panel-title{font-size:10.5px;letter-spacing:.13em;color:var(--acc);font-weight:700;flex:1}
#panel-fold{background:transparent;border:1px solid var(--line);color:var(--sub);border-radius:6px;
  width:24px;height:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#panel-fold:hover{border-color:var(--acc);color:var(--acc)}
#panel-fold .ic{transform:rotate(90deg)}

.sec-c{margin-bottom:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  overflow:hidden}
.sec-hd{display:flex;align-items:center;gap:7px;padding:7px 9px;cursor:pointer;user-select:none;
  transition:.12s}
.sec-hd:hover{background:rgba(0,194,255,.06)}
.sec-ic{color:var(--acc);display:flex}
.sec-ti{font-size:11px;font-weight:700;letter-spacing:.03em;flex:1}
.sec-bd{font-size:9px;color:var(--sub);font-family:var(--mono);background:var(--panel);
  border-radius:9px;padding:1px 7px}
.sec-ch{color:var(--sub);display:flex;transition:transform .18s}
.sec-c.off .sec-ch{transform:rotate(-90deg)}
.sec-bd-wrap{padding:2px 9px 9px;overflow:hidden}
.sec-c.off .sec-bd-wrap{display:none}

#rail-wrap{position:fixed;top:62px;left:12px;z-index:25;display:none}
#rail{background:rgba(17,22,34,.94);border:1px solid var(--line);border-radius:11px;padding:5px;
  display:flex;flex-direction:column;gap:3px;backdrop-filter:blur(8px)}
.rail-b{width:34px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;
  color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  transition:.12s}
.rail-b:hover{background:rgba(0,194,255,.1);color:var(--acc);border-color:var(--line)}
.rail-x{color:var(--acc);border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;margin-bottom:2px}
.rail-x .ic{transform:rotate(-90deg)}

/* アイコンボタン群 */
.ibar{display:flex;gap:4px;flex-wrap:wrap}
.ib{width:32px;height:29px;border-radius:7px;border:1px solid var(--line);background:var(--panel);
  color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  transition:.12s}
.ib:hover{color:var(--txt);border-color:#3d4a6b}
.ib.active{border-color:var(--acc);color:var(--acc);background:rgba(0,194,255,.1)}
.ib.wide{width:auto;padding:0 10px;gap:6px;font-size:10.5px;font-family:var(--jp)}
.ib.on{border-color:var(--ok);color:var(--ok);background:rgba(25,158,112,.12)}

/* レイヤー選択（アイコン + 短いラベル） */
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.lg{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:2px;transition:.12s}
.lg span{font-size:8.5px;line-height:1.1;text-align:center}
.lg:hover{color:var(--txt);border-color:#3d4a6b}
.lg.active{border-color:var(--acc);color:var(--acc);background:rgba(0,194,255,.12)}

canvas[data-viz]{width:100%;display:block;border-radius:6px}


/* ===== 分析画面のライトサーフェス =====
   3Dビューはダークのまま、分析パネル（ボード / セグメント / ジャーニー /
   オートメーション / 2D席図）だけを白基調に切り替える。 */
.lightsurf{
  --panel:#ffffff; --panel2:#f4f6fa; --line:#dfe4ec;
  --txt:#14181f; --sub:#4c5563;
  --acc:#1668c4; --accdim:#9cc4ee;
  --gold:#a97800; --purple:#5b3fa8; --ok:#1a7f56; --warn:#c62d2c;
  --blue:#2a78d6; --pink:#c14b7f;
  color:var(--txt);
}
.lightsurf .bcard,.lightsurf .kpi{background:#f7f9fc;border-color:#e2e7ef}
.lightsurf .kpi .v{color:#1668c4}
.lightsurf .kpi .v.g{color:#a97800}
.lightsurf .kpi .v.p{color:#5b3fa8}
.lightsurf .kpi .v.k{color:#1a7f56}
.lightsurf .hint{background:#eef4fb;border-left-color:#9cc4ee;color:#3d4654}
.lightsurf .hint b{color:#1668c4}
.lightsurf .sec-t{color:#5a6373}
.lightsurf .sec-t b{color:#1668c4}
.lightsurf table.dt th{color:#5a6373;border-bottom-color:#dfe4ec}
.lightsurf table.dt td{border-bottom-color:#eef1f6}
.lightsurf .chip{background:#fff;border-color:#d8dee8;color:#4c5563}
.lightsurf .chip:hover{color:#14181f;border-color:#a9b6c8}
.lightsurf .chip.active{background:#e7f1fd;border-color:#1668c4;color:#1668c4}
.lightsurf .ib{background:#fff;border-color:#d8dee8;color:#4c5563}
.lightsurf .ib:hover{color:#14181f;border-color:#a9b6c8}
.lightsurf .ib.active{background:#e7f1fd;border-color:#1668c4;color:#1668c4}
.lightsurf .tool-btn{border-color:#c8d2e0;color:#4c5563;background:#fff}
.lightsurf .tool-btn:hover{border-color:#1668c4;color:#1668c4;background:#f2f7fe}
.lightsurf .close-x{background:#f4f6fa;border-color:#dfe4ec;color:#5a6373}
.lightsurf .bar-row .bar{background:#e8ecf3}
.lightsurf .bar-row b{color:#14181f}
.lightsurf .bar-row span{color:#5a6373}
.lightsurf .ck-row{color:#4c5563}
.lightsurf .jb-in{background:#fff;border-color:#d8dee8;color:#14181f}
.lightsurf .fc-kpi div{background:#f4f6fa;border-color:#e2e7ef}
.lightsurf .fc-kpi .v{color:#a97800}
.lightsurf .fc-kpi .l{color:#78818f}
.lightsurf canvas[data-viz]{background:#fff}
.lightsurf .grad-bar{background:linear-gradient(90deg,#dbeafd,#6fb0ea,#1baf7a,#eda100,#e34948)}
.lightsurf .grad-lbl{color:#78818f}

/* 分析モーダルの外枠を白に */
#board-box.lightsurf,#segb-box.lightsurf,#jb-box.lightsurf,#m2-box.lightsurf{
  background:#ffffff;border-color:#dfe4ec;box-shadow:0 24px 70px rgba(10,16,28,.55)}
#autopage.lightsurf{background:#f2f5f9}
#autopage.lightsurf #ap-left,#autopage.lightsurf #ap-mid,#autopage.lightsurf #ap-right{
  background:#ffffff;border-color:#e2e7ef;box-shadow:0 1px 3px rgba(16,24,40,.06)}
#autopage.lightsurf .ap-j{background:#f7f9fc;border-color:#e2e7ef}
#autopage.lightsurf .ap-j:hover{border-color:#a9b6c8}
#autopage.lightsurf .ap-ev{background:#f7f9fc}
#autopage.lightsurf .ap-ev:hover{background:#eef2f8}
#autopage.lightsurf .ap-ev-m{color:#3d4654}
#autopage.lightsurf .ap-ev-b,#autopage.lightsurf .ap-j-m{color:#5a6373}
#autopage.lightsurf .ap-j-w{color:#78818f}
#autopage.lightsurf .ap-h{color:#5a6373}
#autopage.lightsurf .ap-new{background:#fff}
#autopage.lightsurf .ap-edit{background:#fff;border-color:#d8dee8}
#m2-cv.lightcv{background:#ffffff;border-color:#dfe4ec}
.lightsurf #viz-tip,.lightsurf #ui-tip{background:#fff;color:#14181f;border-color:#dfe4ec}


/* ===== アクション・スタジオ ===== */
#actpage{position:fixed;top:52px;left:0;right:0;bottom:62px;z-index:36;display:none;
  flex-direction:column;gap:10px;padding:12px 14px}
#ac-kpi{display:flex;gap:8px;align-items:center;flex-shrink:0}
#ac-kpi .kpi{flex:0 0 auto;min-width:112px}
#ac-grid{flex:1;display:grid;grid-template-columns:330px 1fr 380px;gap:10px;overflow:hidden}
#ac-left,#ac-mid,#ac-right{background:#fff;border:1px solid #e2e7ef;border-radius:12px;padding:11px;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 3px rgba(16,24,40,.06)}
#ac-l,#ac-m,#ac-r{overflow-y:auto;flex:1}
#ac-l::-webkit-scrollbar,#ac-m::-webkit-scrollbar,#ac-r::-webkit-scrollbar{width:5px}
#ac-l::-webkit-scrollbar-thumb,#ac-m::-webkit-scrollbar-thumb,
#ac-r::-webkit-scrollbar-thumb{background:#d8dee8;border-radius:3px}
.ac-f{margin-bottom:7px}
.ac-f label{display:block;font-size:9.5px;color:#5a6373;margin-bottom:3px;letter-spacing:.04em}
.ac-f input[type=text],.ac-f input[type=number],.ac-f textarea{width:100%;background:#fff;
  border:1px solid #d8dee8;border-radius:7px;padding:6px 9px;font-size:11.5px;color:#14181f;
  font-family:var(--jp);resize:vertical}
.ac-f input:focus,.ac-f textarea:focus{outline:none;border-color:#1668c4}
.ac-f input[type=range]{width:100%;accent-color:#1668c4}
.ac-form{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;margin-top:10px}
.ac-form .ac-f:nth-child(1),.ac-form .ac-f:nth-child(2){grid-column:1/-1}
.ac-prev{display:flex;justify-content:center;padding:12px 4px;background:
  repeating-linear-gradient(45deg,#f4f6fa,#f4f6fa 10px,#eef2f8 10px,#eef2f8 20px);
  border-radius:10px;border:1px solid #e2e7ef}

/* クリエイティブ */
.cr{width:290px;border-radius:12px;overflow:hidden;box-shadow:0 6px 22px rgba(16,24,40,.18);
  font-family:var(--jp)}
.cr-hd{display:flex;align-items:center;gap:8px;padding:9px 12px 0}
.cr-br{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;opacity:.85}
.cr-tag{margin-left:auto;font-size:8.5px;letter-spacing:.14em;border:1px solid currentColor;
  border-radius:9px;padding:1px 7px;opacity:.8}
.cr-big{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;padding:6px 12px 0}
.cr-big small{font-size:16px;margin-left:3px}
.cr-pr{font-size:12.5px;font-weight:700;padding:4px 12px 0}
.cr-bd{font-size:10.5px;line-height:1.6;padding:6px 12px;opacity:.9}
.cr-ft{display:flex;gap:12px;font-size:9px;padding:0 12px 8px;opacity:.85;flex-wrap:wrap}
.cr-ft b{font-weight:700}
.cr-bar{display:flex;gap:1.5px;align-items:flex-end;height:26px;padding:0 12px;margin-top:2px}
.cr-bar i{background:currentColor;height:100%;display:block;opacity:.85}
.cr-code{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;padding:3px 12px 10px;opacity:.7}
.cr-coupon{background:linear-gradient(135deg,#0f2f52,#123f73);color:#fff;
  border:2px dashed rgba(255,255,255,.35)}
.cr-coupon .cr-big{color:#ffd166}
.cr-perf{height:1px;border-top:1px dashed rgba(255,255,255,.3);margin:6px 12px}
.cr-ticket{display:flex;background:#fff;color:#14181f;border:1px solid #dfe4ec}
.cr-stub{width:62px;background:linear-gradient(180deg,#552583,#3b1a5e);color:#fdb927;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border-right:2px dashed rgba(255,255,255,.4)}
.cr-st1{font-family:var(--mono);font-size:17px;font-weight:600}
.cr-st2{font-size:8px;text-align:center;letter-spacing:.1em;color:#fff;opacity:.8}
.cr-main{flex:1;min-width:0}
.cr-ticket .cr-big{color:#552583;font-size:36px}
.cr-ticket .cr-br,.cr-ticket .cr-tag{color:#5a6373}
.cr-sample{background:linear-gradient(135deg,#0d3b2e,#12563f);color:#fff}
.cr-sample .cr-gift{display:flex;justify-content:center;color:#6ee7b7;padding:6px 0 2px}
.cr-ad{background:#fff;color:#14181f;border:1px solid #dfe4ec;width:300px}
.cr-adimg{height:104px;background:linear-gradient(120deg,#123f73,#2a78d6);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.cr-adimg span{font-family:var(--mono);font-size:15px;letter-spacing:.1em}
.cr-adbody{padding:10px 12px 12px}
.cr-tag2{font-size:8.5px;letter-spacing:.14em;color:#78818f}
.cr-adh{font-size:13px;font-weight:700;margin-top:3px}
.cr-ad .cr-bd{padding:6px 0}
.cr-cta{display:inline-block;background:#1668c4;color:#fff;border-radius:7px;padding:6px 14px;
  font-size:11px;font-weight:700;margin-top:4px}

.ac-go{width:100%;margin-top:12px;padding:11px;border-radius:9px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#1668c4,#0f4f9a);color:#fff;font-size:12.5px;font-weight:700;
  font-family:var(--jp);display:flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 3px 12px rgba(22,104,196,.32)}
.ac-go:hover{filter:brightness(1.08)}
.ac-go.off{background:#c8d2e0;color:#7d8798;box-shadow:none;cursor:not-allowed}
.ac-live{background:#f7f9fc;border:1px solid #e2e7ef;border-radius:9px;padding:8px 10px;
  margin-bottom:6px}
.ac-live-h{display:flex;align-items:center;gap:6px;font-size:11px;color:#14181f}
.ac-live-h b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-stop{background:transparent;border:1px solid #d8dee8;color:#8a93a3;border-radius:5px;
  width:20px;height:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ac-stop:hover{border-color:#c62d2c;color:#c62d2c}
.ac-live-b{font-size:9.5px;color:#5a6373;margin-top:2px}
.ac-live-b b{color:#14181f}
.ac-live-bar{height:4px;background:#e8ecf3;border-radius:2px;margin-top:5px;overflow:hidden}
.ac-live-bar i{display:block;height:100%;background:#1668c4;border-radius:2px}

/* ===== Timeline ===== */
#tl{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(760px,calc(100vw - 40px));
  background:rgba(17,22,34,.94);border:1px solid var(--line);border-radius:12px;padding:9px 14px;z-index:25;
  display:flex;align-items:center;gap:12px;backdrop-filter:blur(8px)}
#tl button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  color:var(--acc);cursor:pointer;font-size:12px;flex-shrink:0}
#tl-clock{font-family:var(--mono);font-size:16px;color:var(--acc);width:56px;flex-shrink:0}
#tl-track{flex:1;height:26px;position:relative;cursor:pointer}
#tl-track .rail{position:absolute;top:11px;left:0;right:0;height:4px;background:var(--panel2);border-radius:2px}
#tl-track .fill{position:absolute;top:11px;left:0;height:4px;background:var(--acc);border-radius:2px}
#tl-track .knob{position:absolute;top:6px;width:14px;height:14px;border-radius:50%;background:var(--acc);
  margin-left:-7px;box-shadow:0 0 10px rgba(0,194,255,.6)}
#tl-track .ph{position:absolute;top:0;font-size:8.5px;color:var(--sub);transform:translateX(-50%);white-space:nowrap}
#tl-phase{font-size:11px;color:var(--sub);width:118px;text-align:right;flex-shrink:0}

/* ===== 右上 情報カード / トースト ===== */
#info{position:fixed;top:62px;right:12px;width:280px;background:rgba(17,22,34,.95);border:1px solid var(--line);
  border-radius:12px;padding:12px;z-index:25;display:none;backdrop-filter:blur(8px);
  max-height:calc(100vh - 150px);overflow-y:auto}
#info .t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
#info .d{font-size:11px;color:var(--sub);line-height:1.6}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(17,22,34,.96);
  border:1px solid var(--acc);border-radius:9px;padding:9px 16px;font-size:11.5px;z-index:40;display:none;
  max-width:min(660px,90vw);text-align:center;line-height:1.55}
#toast b{color:var(--acc)}
#loading{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px}
#loading .lg{font-family:var(--mono);font-size:26px;letter-spacing:.14em;color:var(--acc)}
#loading .st{font-size:11px;color:var(--sub)}
#loading .pb{width:220px;height:3px;background:var(--panel2);border-radius:2px;overflow:hidden}
#loading .pb i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}

/* ===== 個客カード (1to1) ===== */
#fan-card{position:fixed;right:12px;bottom:60px;width:318px;background:rgba(17,22,34,.97);
  border:1px solid var(--acc);border-radius:12px;padding:12px;z-index:28;display:none;
  backdrop-filter:blur(10px);max-height:calc(100vh - 190px);overflow-y:auto;
  box-shadow:0 8px 40px rgba(0,0,0,.6)}
#fan-card::-webkit-scrollbar{width:5px}
#fan-card::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.fc-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fc-id{font-family:var(--mono);font-size:15px;color:var(--acc);letter-spacing:.04em}
.fc-seat{font-size:10px;color:var(--sub);margin-top:1px}
.fc-x{border:1px solid var(--line);background:var(--panel2);color:var(--sub);border-radius:6px;
  width:22px;height:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;padding:0}
.fc-badge{display:inline-block;padding:2px 8px;border-radius:11px;font-size:9.5px;font-weight:700;
  letter-spacing:.05em;margin:6px 4px 0 0}
.fc-kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:9px 0}
.fc-kpi div{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 7px}
.fc-kpi .v{font-family:var(--mono);font-size:14px;color:var(--gold)}
.fc-kpi .l{font-size:9px;color:var(--sub);margin-top:1px}
.fc-nba{background:linear-gradient(135deg,rgba(0,194,255,.14),rgba(138,92,196,.14));
  border:1px solid var(--acc);border-radius:8px;padding:8px 10px;margin-top:8px}
.fc-nba .h{font-size:9.5px;letter-spacing:.12em;color:var(--acc);font-weight:700}
.fc-nba .b{font-size:11.5px;margin-top:3px;line-height:1.5}
.fc-nba .u{font-size:10px;color:var(--gold);margin-top:4px;font-family:var(--mono)}
.fc-tl{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 3px 0;
  margin-top:2px}
.fc-lg{display:flex;gap:9px;flex-wrap:wrap;font-size:9px;color:var(--sub);margin-top:5px}
.fc-lg i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:3px}

/* ===== 2D席図モーダル ===== */
#m2{position:fixed;inset:0;background:rgba(4,6,11,.9);z-index:45;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#m2-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;
  width:min(1080px,95vw);height:min(760px,92vh);display:flex;flex-direction:column;gap:9px}
#m2-hd{display:flex;align-items:center;gap:10px}
#m2-hd .t{font-size:13px;font-weight:700;color:var(--acc)}
#m2-cv{flex:1;border-radius:10px;background:#0b0f19;border:1px solid var(--line);cursor:crosshair}
#m2-ft{display:flex;gap:10px;align-items:center;font-size:10.5px;color:var(--sub);flex-wrap:wrap}

/* ===== ジャーニービルダー ===== */
#jb{position:fixed;inset:0;background:rgba(4,6,11,.92);z-index:47;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#jb-box{background:var(--panel);border:1px solid var(--purple);border-radius:14px;padding:16px;
  width:min(1180px,96vw);height:min(840px,94vh);display:flex;flex-direction:column;gap:10px;overflow:hidden}
#jb-hd{display:flex;align-items:center;gap:12px}
#jb-hd .t{font-size:14px;font-weight:700;color:var(--purple)}
#jb-body{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
#jb-body::-webkit-scrollbar{width:6px}
#jb-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.jb-in{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:7px;padding:7px 9px;font-size:11.5px;font-family:var(--jp);resize:vertical}
.jb-in:focus{outline:none;border-color:var(--acc)}
.ap-new{float:right;display:inline-flex;align-items:center;justify-content:center;width:26px;height:19px;background:var(--panel2);border:1px solid var(--purple);color:var(--purple);
  border-radius:14px;padding:2px 10px;font-size:10px;cursor:pointer;font-family:var(--jp)}
.ap-new:hover{background:rgba(138,92,196,.16)}
.ap-edit{margin-top:5px;display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid var(--line);color:var(--sub);
  border-radius:6px;padding:2px 9px;font-size:9.5px;cursor:pointer;font-family:var(--jp)}
.ap-edit:hover{border-color:var(--acc);color:var(--acc)}

/* ===== 席視点 HUD ===== */
#pov-hud{position:fixed;inset:0;z-index:29;pointer-events:none;display:none}
#pov-hud::before{content:'';position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 180px rgba(0,0,0,.55)}
.pv-x{position:absolute;top:64px;left:50%;transform:translateX(-50%);pointer-events:auto;
  background:rgba(17,22,34,.94);border:1px solid var(--acc);color:var(--acc);border-radius:20px;
  padding:7px 18px;font-size:11.5px;cursor:pointer;letter-spacing:.04em}
.pv-x:hover{background:rgba(0,194,255,.14)}
.pv-card{position:absolute;right:14px;top:64px;width:302px;pointer-events:auto;
  background:rgba(17,22,34,.95);border:1px solid var(--line);border-radius:12px;padding:12px;
  backdrop-filter:blur(8px)}
.pv-t{font-family:var(--mono);font-size:16px;color:var(--acc);letter-spacing:.03em}
.pv-s{font-size:10.5px;color:var(--sub);margin-top:3px}
.pv-s b{color:var(--gold)}
.pv-g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.pv-g div{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.pv-g b{font-family:var(--mono);font-size:16px;color:var(--txt);display:block}
.pv-g span{font-size:9px;color:var(--sub)}
.pv-h{font-size:9.5px;letter-spacing:.12em;color:var(--sub);font-weight:700;margin:9px 0 5px}
.pv-b{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--sub);margin-bottom:3px}
.pv-b span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-b i{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.pv-b em{font-style:normal;font-family:var(--mono);color:var(--txt);width:14px;text-align:right}
.pv-f{font-size:10.5px;color:var(--sub);line-height:1.7}
.pv-n{font-size:9.5px;color:#5f6b83;line-height:1.6;margin-top:9px;border-top:1px solid var(--line);
  padding-top:7px}

/* ===== オートメーション・コンソール ===== */
#autopage{position:fixed;top:52px;left:0;right:0;bottom:62px;background:rgba(8,11,18,.97);
  z-index:35;display:none;flex-direction:column;gap:10px;padding:12px 14px;backdrop-filter:blur(6px)}
#ap-kpi{display:flex;gap:8px;align-items:center;flex-shrink:0}
#ap-kpi .kpi{flex:0 0 auto;min-width:118px}
.ap-title{font-size:14px;font-weight:700;color:var(--acc);margin-right:10px;line-height:1.3}
.ap-title small{display:block;font-size:9.5px;color:var(--sub);font-weight:400;margin-top:2px}
#ap-grid{flex:1;display:grid;grid-template-columns:330px 1fr 340px;gap:10px;overflow:hidden}
#ap-left,#ap-mid,#ap-right{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:10px;display:flex;flex-direction:column;overflow:hidden}
.ap-h{font-size:10.5px;letter-spacing:.13em;color:var(--sub);font-weight:700;margin-bottom:8px;flex-shrink:0}
.ap-h span{color:var(--acc);float:right;font-family:var(--mono);letter-spacing:.04em}
#ap-jlist,#ap-stream,#ap-sum{overflow-y:auto;flex:1}
#ap-jlist::-webkit-scrollbar,#ap-stream::-webkit-scrollbar,#ap-sum::-webkit-scrollbar{width:5px}
#ap-jlist::-webkit-scrollbar-thumb,#ap-stream::-webkit-scrollbar-thumb,
#ap-sum::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.ap-ph{font-size:9.5px;letter-spacing:.12em;font-weight:700;margin:9px 0 5px;
  border-left:2px solid;padding-left:7px}
.ap-j{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  margin-bottom:6px;cursor:pointer;transition:.15s}
.ap-j:hover{border-color:#3d4a6b}
.ap-j.off{opacity:.38}
.ap-j-t{font-size:11.5px;font-weight:700;line-height:1.4;display:flex;align-items:flex-start;gap:6px}
.ap-sw{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-left:auto;margin-top:3px}
.ap-j-m{font-size:10px;color:var(--sub);margin-top:3px}
.ap-j-w{font-size:9.5px;color:#6d7a94;margin-top:3px;line-height:1.5;font-style:italic}
.ap-live{background:var(--ok);color:#04140b;border-radius:4px;padding:0 5px;font-size:8.5px;
  font-weight:700;letter-spacing:.08em;margin-left:4px}
#ap-chart{width:100%;flex-shrink:0;margin-bottom:8px}
.ap-ev{background:var(--panel2);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;
  padding:7px 10px;margin-bottom:5px;cursor:pointer;transition:.12s}
.ap-ev:hover{background:#1f2836}
.ap-ev-h{font-size:10.5px;color:var(--txt);display:flex;align-items:center;gap:6px}
.ap-ev-h b{font-family:var(--mono);color:var(--acc)}
.ap-ev-ch{margin-left:auto;font-size:9.5px;color:var(--sub);border:1px solid var(--line);
  border-radius:10px;padding:1px 7px}
.ap-ev-b{font-size:10px;color:var(--sub);margin-top:2px}
.ap-ev-m{font-size:10.5px;color:#c3cde0;margin-top:3px;line-height:1.5}
.ap-empty{font-size:11px;color:var(--sub);text-align:center;padding:40px 20px;line-height:1.8}

/* ===== セグメントビルダー ===== */
#segb{position:fixed;inset:0;background:rgba(4,6,11,.9);z-index:46;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#segb-box{background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:16px;
  width:min(1240px,96vw);height:min(860px,94vh);display:flex;flex-direction:column;gap:10px;overflow:hidden}
#segb-hd{display:flex;align-items:center;gap:12px}
#segb-hd .t{font-size:14px;font-weight:700;color:var(--acc)}
#segb-body{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
#segb-body::-webkit-scrollbar{width:6px}
#segb-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* ===== 分析ボード ===== */
#board{position:fixed;inset:0;background:rgba(4,6,11,.9);z-index:45;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#board-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
  width:min(1180px,95vw);height:min(800px,93vh);display:flex;flex-direction:column;gap:10px;overflow:hidden}
#board-hd{display:flex;align-items:center;gap:12px}
#board-hd .t{font-size:14px;font-weight:700;color:var(--acc)}
#board-body{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
#board-body::-webkit-scrollbar{width:6px}
#board-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.bcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.bcard h4{font-size:11px;color:var(--acc);letter-spacing:.08em;margin-bottom:9px;font-weight:700}
.bcard.wide{grid-column:1/-1}
.bcard canvas{width:100%;display:block}
table.dt{width:100%;border-collapse:collapse;font-size:10.5px}
table.dt th{color:var(--sub);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);
  font-size:9.5px;letter-spacing:.06em}
table.dt td{padding:4px 6px;border-bottom:1px solid rgba(40,50,74,.5)}
table.dt td.n{font-family:var(--mono);text-align:right}
.close-x{margin-left:auto;border:1px solid var(--line);background:var(--panel2);color:var(--sub);
  border-radius:7px;width:26px;height:26px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;padding:0}
.close-x:hover{border-color:var(--warn);color:var(--warn)}
.ck-row{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--sub);margin-bottom:3px;cursor:pointer}
.ck-row input{accent-color:var(--acc)}
</style>
</head>
