const CLAT = SEAM.center.lat, CLON = SEAM.center.lon;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1220);
scene.fog = new THREE.Fog(0x0a1220, 90000, 420000);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 2, 900000);
const renderer = new THREE.WebGLRenderer({antialias:true});

});

const toastEl = document.getElementById('toast');
let toastTm = 0;
function toast(msg, ms=2600){
  toastEl.textContent = msg; toastEl.style.opacity = 1;
  clearTimeout(toastTm); toastTm = setTimeout(()=> toastEl.style.opacity = 0, ms);
}

/* ================= カメラコントロール（軌道+パン+ズーム） ================= */
const ctrl = {
  target: new THREE.Vector3(0, 0, 0),
  radius: 150000, phi: 0.62, theta: -0.15,
  minR: 900, maxR: 260000,
  apply(){
    this.radius = Math.max(this.minR, Math.min(this.maxR, this.radius));
    this.phi = Math.max(0.12, Math.min(1.45, this.phi));
    camera.position.set(
      this.target.x + this.radius*Math.sin(this.phi)*Math.sin(this.theta),
      this.target.y + this.radius*Math.cos(this.phi),
      this.target.z + this.radius*Math.sin(this.phi)*Math.cos(this.theta));
    camera.lookAt(this.target);
  }
};
let drag = null;
renderer.domElement.addEventListener('contextmenu', e=> e.preventDefault());
renderer.domElement.addEventListener('pointerdown', e=>{
  drag = {b:e.button, x:e.clientX, y:e.clientY};
});
addEventListener('pointerup', ()=> drag = null);
addEventListener('pointermove', e=>{
  if(!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if(drag.b === 0){
    ctrl.theta -= dx*0.005; ctrl.phi -= dy*0.005;
  } else {
    const s = ctrl.radius*0.0012;
    const fx = new THREE.Vector3(Math.sin(ctrl.theta), 0, Math.cos(ctrl.theta));
    const rx = new THREE.Vector3(fx.z, 0, -fx.x);
    ctrl.target.addScaledVector(rx, -dx*s);
    ctrl.target.addScaledVector(fx, dy*s);
  }
  ctrl.apply(); fly.active = false;
});
renderer.domElement.addEventListener('wheel', e=>{
  e.preventDefault();
  ctrl.radius *= (e.deltaY > 0 ? 1.13 : 0.885);
  ctrl.apply(); fly.active = false;
}, {passive:false});

/* フライト */
const fly = {active:false, t:0, dur:1, from:null, to:null};
function flyTo(tx, tz, radius, phi, theta, dur=1800){
  fly.from = {t:ctrl.target.clone(), r:ctrl.radius, p:ctrl.phi, h:ctrl.theta};
  fly.to = {t:new THREE.Vector3(tx, 0, tz), r:radius, p:phi, h:theta};
  fly.t = 0; fly.dur = dur/1000; fly.active = true;
}
function flyStep(dt){
  if(!fly.active) return;
  fly.t += dt;
  let k = Math.min(1, fly.t/fly.dur);
  k = k*k*(3-2*k);
  ctrl.target.lerpVectors(fly.from.t, fly.to.t, k);
  ctrl.radius = fly.from.r + (fly.to.r - fly.from.r)*k;
  ctrl.phi = fly.from.p + (fly.to.p - fly.from.p)*k;
  ctrl.theta = fly.from.h + (fly.to.h - fly.from.h)*k;
  ctrl.apply();
  if(k >= 1) fly.active = false;
}

/* ================= GSIタイル LOD ================= */
const EQ = 40075016.686;
function lon2tx(lon, z){ return (lon+180)/360*Math.pow(2, z); }
function lat2ty(lat, z){ return (1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*Math.pow(2, z); }
const COSC = Math.cos(CLAT*Math.PI/180);
function tileMeters(z){ return EQ*COSC/Math.pow(2, z); }
const tileGroup = new THREE.Group();
scene.add(tileGroup);
const tileCache = new Map();       /* key -> {mesh, z, last} */
const texLoader = new THREE.TextureLoader();
texLoader.crossOrigin = 'anonymous';
let tileTick = 0;
function tileKey(z, tx, ty){ return z + '/' + tx + '/' + ty; }
function addTile(z, tx, ty, yBase){
  const key = tileKey(z, tx, ty);
  let e = tileCache.get(key);
  if(e){ e.last = tileTick; e.mesh.visible = true; return; }
  const mpt = tileMeters(z);
  const ctx = lon2tx(CLON, z), cty = lat2ty(CLAT, z);
  const tex = texLoader.load(`https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/${z}/${tx}/${ty}.jpg`);
  tex.minFilter = THREE.LinearFilter;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(mpt, mpt),
    new THREE.MeshBasicMaterial({map:tex, color:0x9aa4bc}));
  mesh.rotation.x = -Math.PI/2;
  mesh.position.set((tx+0.5-ctx)*mpt, yBase, (ty+0.5-cty)*mpt);
  tileGroup.add(mesh);
  tileCache.set(key, {mesh, z, last:tileTick});
}
/* ベース: z10 全域 */
(function baseTiles(){
  const z = 10;
  const x0 = Math.floor(lon2tx(137.35, z)), x1 = Math.floor(lon2tx(139.15, z));
  const y0 = Math.floor(lat2ty(35.42, z)),  y1 = Math.floor(lat2ty(34.52, z));
  for(let tx=x0; tx<=x1; tx++) for(let ty=y0; ty<=y1; ty++) addTile(z, tx, ty, -30);
})();
function pickZoom(r){
  if(r > 90000) return 11;
  if(r > 42000) return 12;
  if(r > 19000) return 13;
  if(r > 8500)  return 14;
  if(r > 3800)  return 15;
  return 16;
}
let lastTileUpd = 0;
function updateTiles(force){
  const now = performance.now();
  if(!force && now - lastTileUpd < 350) return;
  lastTileUpd = now; tileTick++;
  const z = pickZoom(ctrl.radius);
  document.getElementById('st-z').textContent = z;
  document.getElementById('st-r').textContent = (ctrl.radius/1000).toFixed(1);
  /* 対象タイル: 注視点周辺 N×N */
  const N = 3;
  const mpt = tileMeters(z);
  const ctx = lon2tx(CLON, z), cty = lat2ty(CLAT, z);
  const tx0 = Math.floor(ctx + ctrl.target.x/mpt), ty0 = Math.floor(cty + ctrl.target.z/mpt);
  if(z > 10){
    for(let dx=-N; dx<=N; dx++) for(let dy=-N; dy<=N; dy++)
      addTile(z, tx0+dx, ty0+dy, -30 + (z-10)*1.6);
  }
  /* 現ズーム以外の動的タイルは非表示・古いものは破棄 */
  let visible = 0;
  tileCache.forEach((e, key)=>{
    if(e.z === 10){ visible++; return; }
    const keep = (e.z === z && e.last === tileTick);
    e.mesh.visible = keep;
    if(keep) visible++;
    else if(tileTick - e.last > 260){
      tileGroup.remove(e.mesh);
      e.mesh.material.map && e.mesh.material.map.dispose();
      e.mesh.material.dispose(); e.mesh.geometry.dispose();
      tileCache.delete(key);
    }
  });
  document.getElementById('st-t').textContent = visible;
}

/* ================= 形状ヘルパー ================= */
function polyShape(pts){
  const s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for(let i=1; i<pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  return s;
}
function extrudeLocal(pts, h, mat, y0=0){
  /* pts: グローバル[x, y北] — rotation -90°で world(x, h, -y北) になる */
  const g = new THREE.ExtrudeGeometry(polyShape(pts), {depth:h, bevelEnabled:false});
  const m = new THREE.Mesh(g, mat);
  m.rotation.x = -Math.PI/2;
  m.position.y = y0;
  return m;
}
function mergedExtrude(items, mat){
  const arrs = []; let total = 0;
  items.forEach(it=>{
    try{
      let g = new THREE.ExtrudeGeometry(polyShape(it.p), {depth:it.h || 5, bevelEnabled:false});
      if(g.index) g = g.toNonIndexed();
      arrs.push(g.attributes.position.array); total += g.attributes.position.array.length;
    }catch(e){}
  });
  const pos = new Float32Array(total); let o = 0;
  arrs.forEach(a=>{ pos.set(a, o); o += a.length; });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI/2;
  return m;
}
function segLines(polys, color, op, y){
  const pts = [];
  polys.forEach(pl=>{
    for(let i=0; i<pl.length-1; i++){
      pts.push(new THREE.Vector3(pl[i][0], y, -pl[i][1]), new THREE.Vector3(pl[i+1][0], y, -pl[i+1][1]));
    }
  });
  return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color, transparent:true, opacity:op}));
}
const LABELS = [];
function makeLabel(text, size, color){
  const cv = document.createElement('canvas');
  const meas = cv.getContext('2d');
  meas.font = "700 64px 'Noto Sans JP', sans-serif";
  const tw = meas.measureText(text).width;
  cv.width = Math.min(2048, Math.max(256, Math.ceil(tw)+48)); cv.height = 128;
  const c = cv.getContext('2d');
  c.font = "700 64px 'Noto Sans JP', sans-serif";
  c.fillStyle = color; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = 'rgba(0,0,0,.75)'; c.shadowBlur = 14;
  c.fillText(text, cv.width/2, 64);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthTest:false}));
  sp.userData.baseW = size*(cv.width/128); sp.userData.baseH = size;
  sp.scale.set(sp.userData.baseW, size, 1);
  LABELS.push(sp);
  return sp;
}
function updateLabels(){
  /* カメラ距離に応じてスケール（画面上でほぼ一定サイズ） */
  const k = Math.max(0.028, Math.min(1, ctrl.radius/140000));
  LABELS.forEach(sp=>{
    sp.scale.set(sp.userData.baseW*k, sp.userData.baseH*k, 1);
  });
}

/* ================= アリーナ描画 ================= */
const BEAMS = [];
const matBldg = new THREE.MeshStandardMaterial({color:0x3b4460, roughness:0.9});
const matPodium = new THREE.MeshStandardMaterial({color:0x232838, roughness:0.55, metalness:0.25});
const matHall = new THREE.MeshStandardMaterial({color:0x2a4664, roughness:0.18, metalness:0.6});
const matRoof = new THREE.MeshStandardMaterial({color:0xe9e6de, roughness:0.5, metalness:0.15});
SEAM.arenas.forEach(a=>{
  const g = new THREE.Group();
  /* 周辺建物 */
  if(a.bldg.length) g.add(mergedExtrude(a.bldg, matBldg));
  /* 幹線道路 */
  const r2 = a.roads.filter(r=>r.c===2).map(r=>r.p);
  const r1 = a.roads.filter(r=>r.c===1).map(r=>r.p);
  g.add(segLines(r2, 0x8f9cc0, 0.85, 2.2));
  g.add(segLines(r1, 0x5a6580, 0.6, 2.0));
  /* 鉄道（路線色） */
  const byCol = {};
  a.rails.forEach(r=>{ (byCol[r.c] = byCol[r.c] || []).push(r.p); });
  Object.keys(byCol).forEach(c=> g.add(segLines(byCol[c], +c, 0.95, 2.6)));
  /* アリーナ本体 */
  g.add(extrudeLocal(a.outer, 6, matPodium));
  g.add(extrudeLocal(a.main, 20, matHall));
  g.add(extrudeLocal(a.main, 1.6, matRoof, 20.2));
  if(a.pool) g.add(extrudeLocal(a.pool, 14, matHall));
  /* 黄エッジ + ビーム */
  const ep = a.main.map(p=>new THREE.Vector3(p[0], 21.4, -p[1])); ep.push(ep[0].clone());
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ep),
    new THREE.LineBasicMaterial({color:0xf5c400})));
  const cx = a.off[0], cz = -a.off[1];
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(a.home?120:80, a.home?170:115, a.home?7000:5200, 8, 1, true),
    new THREE.MeshBasicMaterial({color:0xf5c400, transparent:true, opacity:a.home?0.5:0.34,
      blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
  beam.position.set(cx, (a.home?7000:5200)/2, cz);
  beam.userData.baseOp = a.home?0.5:0.34;
  BEAMS.push(beam);
  g.add(beam);
  const lb = makeLabel(a.name + (a.home?' ★HOME':''), 3300, '#f5c400');
  lb.position.set(cx, a.home?8300:6400, cz);
  g.add(lb);
  if(a.stn){
    const sl = makeLabel(a.stn.n + '駅', 1500, '#9ec5ff');
    sl.position.set(a.stn.p[0], 1400, -a.stn.p[1]);
    g.add(sl);
    const sm = new THREE.Mesh(new THREE.CylinderGeometry(26, 26, 46, 6),
      new THREE.MeshStandardMaterial({color:0x4da3ff, emissive:0x14335c, roughness:0.5}));
    sm.position.set(a.stn.p[0], 23, -a.stn.p[1]);
    g.add(sm);
  }
  scene.add(g);
});

/* ================= 連携ネットワーク（OD風・グラデーション帯） ================= */
const netGroup = new THREE.Group();
scene.add(netGroup);
const HOME = SEAM.arenas.find(a=>a.home);
const HX = HOME.off[0], HZ = -HOME.off[1];
const arcUnis = [];
function arcMesh(x0, z0, x1, z1, radius, colv){
  const A = new THREE.Vector3(x0, 260, z0), B = new THREE.Vector3(x1, 260, z1);
  const d = A.distanceTo(B);
  const mid = A.clone().add(B).multiplyScalar(0.5); mid.y = 1900 + d*0.11;
  const curve = new THREE.QuadraticBezierCurve3(A, mid, B);
  const geo = new THREE.TubeGeometry(curve, 64, radius, 6, false);
  const uni = {uCol:{value:new THREE.Color(colv)}, uTime:{value:Math.random()*4}, uAct:{value:0}};
  const mat = new THREE.ShaderMaterial({
    uniforms:uni, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:[
      'varying vec2 vUv; uniform vec3 uCol; uniform float uTime,uAct;',
      'void main(){',
      '  float band=pow(0.5+0.5*sin((vUv.x*3.0-uTime)*6.28318),3.0);',
      '  float head=smoothstep(0.0,0.06,vUv.x)*smoothstep(1.0,0.94,vUv.x);',
      '  float a=uAct*(0.10+0.55*band)*head;',
      '  gl_FragColor=vec4(uCol*(0.55+0.75*band), a);',
      '}'].join('\n')
  });
  const m = new THREE.Mesh(geo, mat);
  netGroup.add(m);
  arcUnis.push(uni);
  return uni;
}
/* 来場圏グラビティ */
const cityW = (function(){
  const raw = SEAM.cities.map(c=>{
    const d = Math.hypot(c.p[0]-HOME.off[0], c.p[1]-HOME.off[1])/1000 + 8;
    return c.pop / Math.pow(d, 1.5);
  });
  const s = raw.reduce((a,b)=>a+b, 0);
  return raw.map(v=>v/s);
})();
const maxW = Math.max(...cityW);
/* ソフトブロブ */
const blobTex = (function(){
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(128,128,0,128,128,126);
  g.addColorStop(0,'rgba(255,255,255,.9)'); g.addColorStop(0.4,'rgba(255,255,255,.4)'); g.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(cv);
})();
const blobMats = [];
SEAM.cities.forEach((c,i)=>{
  const wn = cityW[i]/maxW;
  const arcU = arcMesh(c.p[0], -c.p[1], HX, HZ, 110 + 640*Math.pow(wn, 0.75), 0xff8a1e);
  arcU.uAct.value = 0.5 + 0.5*wn;
  const r = 2600 + 10500*Math.pow(wn, 0.65);
  const bm = new THREE.Mesh(new THREE.PlaneGeometry(r*2, r*2),
    new THREE.MeshBasicMaterial({map:blobTex, color:0xff7a1e, transparent:true, opacity:0.14 + 0.26*wn,
      blending:THREE.AdditiveBlending, depthWrite:false}));
  bm.rotation.x = -Math.PI/2;
  bm.position.set(c.p[0], 100, -c.p[1]);
  netGroup.add(bm);
  blobMats.push(bm.material);
  const ring = new THREE.Mesh(new THREE.RingGeometry(1400, 1750, 40),
    new THREE.MeshBasicMaterial({color:0xff8a1e, transparent:true, opacity:0.5, side:THREE.DoubleSide, depthWrite:false}));
  ring.rotation.x = -Math.PI/2;
  ring.position.set(c.p[0], 80, -c.p[1]);
  const s = 0.75 + 2.4*Math.pow(wn, 0.8);
  ring.scale.set(s, s, 1);
  netGroup.add(ring);
  const lb = makeLabel(c.n + '  ' + (cityW[i]*100).toFixed(1) + '%', 2100, '#ffb066');
  lb.position.set(c.p[0], 5200, -c.p[1]);
  netGroup.add(lb);
  const lb2 = makeLabel(c.a, 1000, '#c8cede');
  lb2.position.set(c.p[0], 3500, -c.p[1]);
  netGroup.add(lb2);
});
SEAM.arenas.filter(a=>!a.home).forEach(a=>{
  const u = arcMesh(HX, HZ, a.off[0], -a.off[1], 230, 0xf5c400);
  u.uAct.value = 0.8;
});

/* ================= 広域動線（実形状） ================= */
const corrGroup = new THREE.Group();
scene.add(corrGroup);
SEAM.corridors.forEach(L=>{
  const pts = [];
  L.segs.forEach(sg=>{
    for(let i=0; i<sg.length-1; i++){
      pts.push(new THREE.Vector3(sg[i][0], L.rail?260:150, -sg[i][1]),
               new THREE.Vector3(sg[i+1][0], L.rail?260:150, -sg[i+1][1]));
    }
  });
  corrGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:L.c, transparent:true, opacity:L.rail?0.9:0.6})));
  let best = null, bl = 0;
  L.segs.forEach(sg=>{
    let len = 0;
    for(let i=1; i<sg.length; i++) len += Math.hypot(sg[i][0]-sg[i-1][0], sg[i][1]-sg[i-1][1]);
    if(len > bl){ bl = len; best = sg; }
  });
  if(best){
    const q = best[Math.floor(best.length*0.35)];
    const lb = makeLabel(L.n, 1600, '#' + L.c.toString(16).padStart(6, '0'));
    lb.position.set(q[0], 2500, -q[1]);
    corrGroup.add(lb);
  }
});

/* ================= UI ================= */
const btns = document.getElementById('btns');
const card = document.getElementById('card');
function addBtn(txt, cls, fn){
  const d = document.createElement('div');
  d.className = 'crumb ' + cls; d.textContent = txt; d.onclick = fn;
  btns.appendChild(d); return d;
}
const wideBtn = addBtn('🗾 全域', 'active', ()=>{ focusWide(); });
const arenaBtns = [];
SEAM.arenas.forEach((a, i)=>{
  const b = addBtn(a.name.replace('アリーナ','').replace('静岡市',''), 'gold', ()=> focusArena(i));
  arenaBtns.push(b);
});
let tourTimer = null;
const tourBtn = addBtn('▶ 巡回', '', ()=>{
  if(tourTimer){ clearInterval(tourTimer); tourTimer = null; tourBtn.classList.remove('active'); toast('巡回を停止しました'); return; }
  tourBtn.classList.add('active');
  let i = 0;
  focusArena(0);
  tourTimer = setInterval(()=>{ i = (i+1) % SEAM.arenas.length; focusArena(i, true); }, 7000);
  toast('自動巡回: 7秒ごとに次のアリーナへ移動します', 3200);
});
const netBtn = addBtn('連携ON', 'active', ()=>{
  const on = !netBtn.classList.contains('active');
  netBtn.classList.toggle('active', on);
  netBtn.textContent = on ? '連携ON' : '連携OFF';
});
function setActive(idx){
  wideBtn.classList.toggle('active', idx === -1);
  arenaBtns.forEach((b, i)=> b.classList.toggle('active', i === idx));
}
function focusWide(){
  setActive(-1); card.style.display = 'none';
  flyTo(-6000, 12000, 165000, 0.6, -0.15, 2000);
}
function focusArena(i, keepTour){
  if(!keepTour && tourTimer){ clearInterval(tourTimer); tourTimer = null; tourBtn.classList.remove('active'); }
  const a = SEAM.arenas[i];
  setActive(i);
  flyTo(a.off[0], -a.off[1], 2600, 0.85, -0.6, 2300);
  card.style.display = 'block';
  card.innerHTML = '<h3>' + a.name + (a.home ? ' <span style="font-size:10px">★HOME</span>' : '') + '</h3>'
    + '<div class="row">所在地: <b>' + a.city + '</b></div>'
    + '<div class="row">規模: <b>' + a.cap + '</b></div>'
    + '<div class="row">周辺: 建物 <b>' + a.bldg.length + '</b>棟 / 幹線 <b>' + a.roads.length + '</b>本（OSM実データ）</div>'
    + '<a href="all.html#' + a.file + '" target="_blank" rel="noopener">フル機能ツインを開く（点群・人流・渋滞・避難などタブUI） ↗</a>'
    + '<div class="row" style="margin-top:5px;font-size:9.5px">※ all.html・各アリーナHTMLと同じフォルダに置いてください</div>';
  toast(a.name + ' へ移動中 — ズームで航空写真が高精細化します', 2600);
}

/* ================= ループ ================= */
let last = performance.now();
(function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (now-last)/1000); last = now;
  flyStep(dt);
  arcUnis.forEach(u=> u.uTime.value += dt*0.30);
  /* 近接時は県域ネットワーク・ビームを自動フェード（詳細閲覧の邪魔をしない） */
  const fade = Math.max(0, Math.min(1, (ctrl.radius - 4500) / 9000));
  netGroup.visible = fade > 0.03 && netBtn.classList.contains('active');
  const bf = Math.max(0, Math.min(1, (ctrl.radius - 2600) / 7000));
  BEAMS.forEach(b=>{ b.material.opacity = b.userData.baseOp * bf; b.visible = bf > 0.02; });
  updateTiles(false);
  updateLabels();
  renderer.render(scene, camera);
})(performance.now());

ctrl.apply();
focusWide();
updateTiles(true);
toast('6アリーナを1つのマップに統合 — アリーナボタンか「▶ 巡回」で移動できます', 4200);
</script>
