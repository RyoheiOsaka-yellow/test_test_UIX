<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Studio — 仮想撮影スタジオ / 撮影指示書ジェネレーター</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- SFシンボル風 ストロークアイコン -->
<svg id="iconSprite" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 17v1.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V17"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 14V4m0 0L8 8m4-4l4 4M5 17v1.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V17"/></symbol>
    <symbol id="i-board" viewBox="0 0 24 24"><rect x="3.2" y="5" width="17.6" height="14" rx="2.5"/><path d="M8.5 5v14M15.5 5v14M3.2 9.6h5.3M3.2 14.4h5.3M15.5 9.6h5.3M15.5 14.4h5.3"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6.5 3.5h7L18.5 8v10a2 2 0 0 1-2 2h-10a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2Z"/><path d="M13.5 3.5V8h5M8.5 12.5h7M8.5 16h7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
    <symbol id="i-dup" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 5.5v-.2a1.8 1.8 0 0 0-1.8-1.8H5.5a2 2 0 0 0-2 2v8.2a1.8 1.8 0 0 0 1.8 1.8h.2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v1.5m3.5 0-.8 12a2 2 0 0 1-2 1.9H8.8a2 2 0 0 1-2-1.9l-.8-12M10 10.5v6M14 10.5v6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="10.5" height="10.5" rx="2"/><path d="M15 6V5.8A1.8 1.8 0 0 0 13.2 4H6a2 2 0 0 0-2 2v7.2A1.8 1.8 0 0 0 5.8 15H6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4.2 4.2L19 7.5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M6 18.5l4.8-4.8a1.5 1.5 0 0 1 2.1 0l2.3 2.3 1.8-1.8a1.5 1.5 0 0 1 2.1 0l1.4 1.4"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3.5v9m0 0l-3.5-3.5M12 12.5l3.5-3.5"/><path d="M4 13.5l1.2 5A2 2 0 0 0 7.1 20h9.8a2 2 0 0 0 1.9-1.5l1.2-5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15.5 15.5 20 20"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.3 8.3 0 1 1 9.5 4.1 6.6 6.6 0 0 0 20 14.5Z"/></symbol>
    <symbol id="i-autotheme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.6"/><path d="M12 4.4a7.6 7.6 0 0 1 0 15.2Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.2 5.5v13L18.8 12Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5.5v13M15 5.5v13"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5.5 12h13"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M9 3.5H5.5A2 2 0 0 0 3.5 5.5V9M15 3.5h3.5a2 2 0 0 1 2 2V9M9 20.5H5.5a2 2 0 0 1-2-2V15M15 20.5h3.5a2 2 0 0 0 2-2V15"/></symbol>
    <symbol id="i-wand" viewBox="0 0 24 24"><path d="M5 19 16.5 7.5M14.5 5.5l4 4M18 3v2.5M19.25 4.25h-2.5M8 3.5v2M9 4.5H7M20 10.5v2M21 11.5h-2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-braces" viewBox="0 0 24 24"><path d="M8.5 3.5C6.8 3.5 6 4.4 6 6v3c0 1.4-.8 2.3-2 3 1.2.7 2 1.6 2 3v3c0 1.6.8 2.5 2.5 2.5M15.5 3.5c1.7 0 2.5.9 2.5 2.5v3c0 1.4.8 2.3 2 3-1.2.7-2 1.6-2 3v3c0 1.6-.8 2.5-2.5 2.5"/></symbol>
    <symbol id="i-dmx" viewBox="0 0 24 24"><path d="M6 4v16M12 4v16M18 4v16"/><rect x="4" y="9" width="4" height="3.6" rx="1.2" fill="currentColor" stroke="none"/><rect x="10" y="13.5" width="4" height="3.6" rx="1.2" fill="currentColor" stroke="none"/><rect x="16" y="6" width="4" height="3.6" rx="1.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v6c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8v-6M4.5 11.5v6c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8v-6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M7 8V4.5h10V8M7 17H5a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 5 9h14a1.5 1.5 0 0 1 1.5 1.5v5A1.5 1.5 0 0 1 19 17h-2"/><rect x="7" y="14" width="10" height="5.5" rx="1"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 6.5A2 2 0 0 1 5.5 4.5h4l2 2.5h7a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/></symbol>
  </defs>
</svg>

<header id="appHeader">
  <div class="brand">
    <span class="brand-mark"></span>
    <h1>Virtual Studio</h1>
    <span class="brand-sub">仮想撮影スタジオ</span>
  </div>
  <nav id="modeTabs" role="tablist" aria-label="スタジオモード">
    <button class="mode-tab active" data-mode="video" role="tab">動画</button>
    <button class="mode-tab" data-mode="still" role="tab">スチール</button>
    <button class="mode-tab" data-mode="outdoor" role="tab">屋外・ドローン</button>
  </nav>
  <div class="header-actions">
    <button id="btnProjPage" class="icon-btn" title="プロジェクト (保存・切替)" aria-label="プロジェクト">
      <svg class="ic"><use href="#i-folder"/></svg>
    </button>
    <button id="btnEquipPage" class="icon-btn" title="機材データベース (131機種)" aria-label="機材データベース">
      <svg class="ic"><use href="#i-db"/></svg>
    </button>
    <button id="btnTheme" class="icon-btn" title="テーマ切替" aria-label="テーマ切替">
      <svg class="ic"><use href="#i-autotheme"/></svg>
    </button>
    <span class="v-sep" aria-hidden="true"></span>
    <button id="btnExportJson" class="icon-btn" title="プロジェクトを保存 (JSON)" aria-label="プロジェクトを保存">
      <svg class="ic"><use href="#i-download"/></svg>
    </button>
    <button id="btnImportJson" class="icon-btn" title="プロジェクトを開く (JSON)" aria-label="プロジェクトを開く">
      <svg class="ic"><use href="#i-upload"/></svg>
    </button>
    <button id="btnExportCanonical" class="icon-btn" title="Canonical Shot JSON を書き出す (CineOS ベンダー中立形式)" aria-label="Canonical Shot JSON">
      <svg class="ic"><use href="#i-braces"/></svg>
    </button>
    <input type="file" id="fileImport" accept=".json" hidden>
    <span class="v-sep" aria-hidden="true"></span>
    <button id="btnExportDmx" class="icon-btn" title="DMXキューシートを書き出す (パッチ表+カット毎のキュー)" aria-label="DMXキューシート">
      <svg class="ic"><use href="#i-dmx"/></svg>
    </button>
    <button id="btnExportBoard" class="btn" title="絵コンテを書き出す (1ページ6コマ / 印刷・PDF)">
      <svg class="ic"><use href="#i-board"/></svg><span>絵コンテ</span>
    </button>
    <button id="btnExportDoc" class="btn primary" title="撮影指示書を書き出す (印刷・PDF)">
      <svg class="ic"><use href="#i-doc"/></svg><span>指示書</span>
    </button>
  </div>
</header>

<main id="appMain">
  <!-- 左: 技法ライブラリ -->
  <aside id="libraryPanel">
    <div class="panel-head">
      <span class="panel-title">技法ライブラリ</span>
      <button id="btnImportMd" class="icon-btn small" title="技法mdを取り込む (FORMAT.md形式・複数可)" aria-label="技法mdを取り込む">
        <svg class="ic"><use href="#i-import"/></svg>
      </button>
    </div>
    <input type="file" id="fileMdImport" accept=".md,.markdown,.txt" multiple hidden>
    <div class="search-field">
      <svg class="ic"><use href="#i-search"/></svg>
      <input type="search" id="presetSearch" placeholder="技法を検索">
    </div>
    <div id="presetList"></div>
  </aside>

  <!-- 中央: スタジオキャンバス -->
  <section id="studioPanel">
    <!-- IntentParser: 自由文からカットを自動設計 -->
    <div id="intentBar">
      <svg class="ic wand"><use href="#i-wand"/></svg>
      <input id="intentInput" type="text"
        placeholder="シーンを言葉で書くとカットを自動設計 — 例: 夜の豪雨。主人公が路地を走り、後方で大きな爆発。35mm映画の緊張感。">
      <button id="btnIntent" class="btn primary small">設計</button>
    </div>
    <div id="intentResult" hidden>
      <div class="intent-result-head">
        <span class="panel-title small">解釈した前提 <small>クリックした項目は右のインスペクターで調整できます</small></span>
        <div>
          <button id="btnCoverage" class="btn tiny" title="引き(状況)→メイン→寄り(感情)の3カット構成に展開">3カットに展開</button>
          <button id="btnIntentClose" class="icon-btn small" aria-label="閉じる"><svg class="ic"><use href="#i-close"/></svg></button>
        </div>
      </div>
      <div id="intentChips"></div>
    </div>
    <div class="studio-toolbar">
      <span class="panel-title">スタジオ
        <span id="viewToggle" role="group" aria-label="ビュー切替">
          <button class="view-tab active" data-view="2d">2D 俯瞰</button>
          <button class="view-tab" data-view="3d">3D</button>
          <button class="view-tab" data-view="pov" title="カメラ視点 (レンズの画角で見る)">POV</button>
        </span>
        <small id="viewHint">ドラッグで機材を移動</small>
      </span>
      <div class="add-equipment">
        <select id="equipTypeSelect" aria-label="追加する機材"></select>
        <button id="btnAddEquip" class="icon-btn accent" title="選択した機材を追加" aria-label="機材を追加">
          <svg class="ic"><use href="#i-plus"/></svg>
        </button>
        <button id="btnDownloadPlan" class="icon-btn" title="俯瞰図をSVG画像で保存" aria-label="俯瞰図を画像保存">
          <svg class="ic"><use href="#i-image"/></svg>
        </button>
      </div>
    </div>
    <div id="canvasWrap">
      <svg id="studioCanvas" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
      <canvas id="studio3d" hidden></canvas>
      <div id="zoomControls">
        <button id="btnZoomIn" class="icon-btn" title="拡大 (ホイールでも可)" aria-label="拡大"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button id="btnZoomOut" class="icon-btn" title="縮小" aria-label="縮小"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button id="btnZoomReset" class="icon-btn" title="全体表示に戻す" aria-label="全体表示"><svg class="ic"><use href="#i-fit"/></svg></button>
      </div>
    </div>

    <!-- 下: カット割り -->
    <div id="storyboard">
      <div class="storyboard-head">
        <span class="panel-title">カット割り</span>
        <div class="storyboard-actions">
          <button id="btnAddCut" class="icon-btn" title="カットを追加" aria-label="カットを追加">
            <svg class="ic"><use href="#i-plus"/></svg>
          </button>
          <button id="btnDupCut" class="icon-btn" title="カットを複製" aria-label="カットを複製">
            <svg class="ic"><use href="#i-dup"/></svg>
          </button>
          <button id="btnDelCut" class="icon-btn danger" title="カットを削除" aria-label="カットを削除">
            <svg class="ic"><use href="#i-trash"/></svg>
          </button>
        </div>
      </div>
      <div id="cutStrip"></div>
    </div>
  </section>

  <!-- 右: プレビュー + インスペクター -->
  <aside id="rightPanel">
    <div class="preview-head">
      <span class="panel-title">想定カット</span>
      <div id="aspectChips" role="group" aria-label="アスペクト比"></div>
    </div>
    <div id="previewWrap">
      <div id="previewFrame"></div>
      <button id="btnPlayPreview" class="icon-btn play-btn" title="カメラワークを再生" aria-label="カメラワークを再生">
        <svg class="ic"><use href="#i-play"/></svg>
      </button>
    </div>
    <div id="explainBox">
      <div class="panel-title small">この配置だとこう写る</div>
      <ul id="explainList"></ul>
    </div>
    <div id="feasBox" hidden>
      <div class="panel-title small">フィージビリティ / 安全チェック</div>
      <ul id="feasList"></ul>
    </div>
    <div id="promptPreview">
      <div class="prompt-head">
        <span class="panel-title small">AIプロンプト</span>
        <select id="promptModelSelect" title="モデル別のプロンプト方言に切り替え"></select>
        <button id="btnCopySequence" class="icon-btn small" title="全カットを繋いだSeedanceマルチショット・シーケンスプロンプトをコピー" aria-label="シーケンスプロンプトをコピー">
          <svg class="ic"><use href="#i-board"/></svg>
        </button>
        <button id="btnCopyPrompt" class="icon-btn small" title="このカットのプロンプトをコピー" aria-label="プロンプトをコピー">
          <svg class="ic"><use href="#i-copy"/></svg>
        </button>
      </div>
      <div id="promptHint" class="insp-hint"></div>
      <textarea id="promptText" readonly></textarea>
    </div>
    <div id="inspector"></div>
  </aside>
</main>

<!-- プロジェクトページ (ブラウザ内保存・切替) -->
<div id="projOverlay" class="overlay" hidden>
  <div class="overlay-bar">
    <button id="btnProjBack" class="btn small"><svg class="ic"><use href="#i-back"/></svg> スタジオに戻る</button>
    <span class="panel-title">プロジェクト <small id="projStorageNote"></small></span>
    <span class="overlay-spacer"></span>
    <button id="btnProjNew" class="btn small"><svg class="ic"><use href="#i-plus"/></svg> 新規プロジェクト</button>
  </div>
  <div id="projCurrent">
    <span class="panel-title small">現在のプロジェクト</span>
    <input type="text" id="projName" placeholder="プロジェクト名">
    <button id="btnProjSave" class="btn small primary">保存</button>
    <span id="projSavedMsg" class="insp-hint"></span>
  </div>
  <div id="projGrid"></div>
</div>

<!-- 機材データベースページ (アプリ内オーバーレイ) -->
<div id="equipOverlay" class="overlay" hidden>
  <div class="overlay-bar">
    <button id="btnEquipBack" class="btn small"><svg class="ic"><use href="#i-back"/></svg> スタジオに戻る</button>
    <span class="panel-title">機材データベース <small id="equipCount"></small></span>
    <div class="search-field overlay-search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input type="search" id="equipSearch" placeholder="機材を検索 (メーカー・機種・用途)">
    </div>
  </div>
  <div id="equipFilters"></div>
  <div id="equipAssignHint" class="insp-hint"></div>
  <div id="equipGrid"></div>
</div>

<!-- ドキュメントビューア (指示書/絵コンテ/DMX — アプリ内で開き、戻れる) -->
<div id="docOverlay" class="overlay" hidden>
  <div class="overlay-bar">
    <button id="btnDocBack" class="btn small"><svg class="ic"><use href="#i-back"/></svg> スタジオに戻る</button>
    <span class="panel-title" id="docOverlayTitle"></span>
    <span class="overlay-spacer"></span>
    <button id="btnDocPrint" class="btn small primary"><svg class="ic"><use href="#i-printer"/></svg> 印刷 / PDF保存</button>
    <button id="btnDocDownload" class="btn small">HTMLで保存</button>
  </div>
  <iframe id="docFrame" title="書き出しドキュメント"></iframe>
</div>

<script src="js/data.js"></script>
<script src="js/equipment_db.js"></script>
<script src="js/engine.js"></script>
<script src="js/intent.js"></script>
<script src="js/studio3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
