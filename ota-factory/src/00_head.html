<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YELLOW フュージョン・ファクトリー 大田区 — 開発一体型工場 3D構想モデル v0.1</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22d9; --line:#30363d; --txt:#e6edf3; --sub:#9da7b3; --acc:#f2c744; --acc2:#58a6ff; --good:#3fb950; --bad:#f85149; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); overflow:hidden;
              font-family:-apple-system,"Helvetica Neue","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif; }
  #app { position:fixed; inset:0; } canvas { display:block; }
  .panel { position:absolute; background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12px; z-index:10; }
  .btn { background:#21262d; color:var(--txt); border:1px solid var(--line); border-radius:7px; padding:6px 10px; cursor:pointer; font-size:12px; line-height:1.2; white-space:nowrap; }
  .btn:hover { border-color:var(--acc); } .btn.on { background:var(--acc); color:#1a1400; border-color:var(--acc); font-weight:700; }
  .btn.sm { padding:4px 8px; font-size:11px; } .btn:disabled { opacity:.4; cursor:default; }
  h3 { margin:0 0 8px; font-size:12px; color:var(--sub); font-weight:600; letter-spacing:.04em; }
  .row { display:flex; justify-content:space-between; align-items:baseline; margin:4px 0; gap:10px; } .row .v { font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }
  .sep { height:1px; background:var(--line); margin:8px 0; } .sub { color:var(--sub); font-size:11px; line-height:1.55; }
  #brand { font-weight:800; letter-spacing:.06em; font-size:13px; color:var(--acc); padding:0 6px; } #brand small { color:var(--sub); font-weight:500; margin-left:6px; letter-spacing:0; }
  #nav { top:12px; left:12px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; max-width:60vw; }
  #views { top:58px; left:12px; display:flex; gap:5px; align-items:center; flex-wrap:wrap; max-width:60vw; }
  #views span.lbl { color:var(--sub); font-size:11px; margin-right:2px; }
  #tools { top:12px; right:292px; display:flex; gap:6px; align-items:center; }
  #stats { top:12px; right:12px; width:268px; max-height:calc(100vh - 24px); overflow:auto; }
  #stats table { width:100%; border-collapse:collapse; font-size:11px; } #stats td { padding:2px 0; } #stats td.n { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11px; color:var(--sub); } .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  #ledger { left:12px; bottom:12px; width:300px; max-height:46vh; display:flex; flex-direction:column; }
  #ledger input { width:100%; background:#0d1117; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:12px; margin-bottom:6px; }
  #ledgerList { overflow:auto; flex:1; } .eq { display:flex; gap:8px; padding:5px 6px; border-radius:6px; cursor:pointer; align-items:baseline; } .eq:hover { background:#21262d; } .eq.on { background:#2b3340; }
  .eq b { font-size:11px; color:var(--acc2); min-width:46px; font-variant-numeric:tabular-nums; } .eq span { flex:1; } .eq small { color:var(--sub); }
  #info { right:12px; bottom:12px; width:300px; max-height:52vh; overflow:auto; display:none; } #info h2 { margin:0 0 4px; font-size:14px; } #info table { width:100%; font-size:11px; border-collapse:collapse; } #info td { padding:3px 0; vertical-align:top; border-top:1px solid #21262d; } #info td:first-child { color:var(--sub); width:34%; }
  #layers { top:104px; left:12px; width:230px; display:none; } #layers label { display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer; } #layers input { accent-color:var(--acc); }
  #section { top:104px; left:12px; width:260px; display:none; } #section input[type=range] { width:100%; accent-color:var(--acc); }
  #hint { bottom:12px; left:324px; max-width:360px; color:var(--sub); font-size:11px; line-height:1.6; pointer-events:none; }
  kbd { background:#21262d; border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:10px; }
  #photos { top:104px; right:292px; width:420px; max-height:calc(100vh - 130px); overflow:auto; display:none; } #photos .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; } #photos img { width:100%; border-radius:6px; cursor:pointer; display:block; } #photos figcaption { font-size:10px; color:var(--sub); margin-top:2px; line-height:1.3; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; z-index:100; align-items:center; justify-content:center; flex-direction:column; gap:10px; cursor:zoom-out; } #lightbox img { max-width:92vw; max-height:84vh; border-radius:8px; } #lightbox p { color:#fff; margin:0; font-size:13px; }
  #tourCard { bottom:70px; left:50%; transform:translateX(-50%); width:560px; max-width:92vw; display:none; } #tourCard h2 { margin:0 0 6px; font-size:15px; } #tourCard p { margin:0 0 8px; line-height:1.6; font-size:12.5px; } #tourCard .ctl { display:flex; gap:6px; justify-content:flex-end; }
  #loading { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; z-index:200; color:var(--sub); font-size:13px; } #loading b { color:var(--acc); font-size:18px; letter-spacing:.08em; }
  #crumb { position:absolute; left:12px; top:104px; color:var(--sub); font-size:11px; pointer-events:none; z-index:5; } #crumb b { color:var(--txt); }
  body.walk #app { cursor:crosshair; }
  @media (max-width:1200px){ #tools { right:12px; top:auto; bottom:12px; } #stats { display:none; } #photos { right:12px; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading"><b>YELLOW FUSION FACTORY · OTA</b><span id="loadMsg">3Dモデルを構築しています…</span></div>

<div id="nav" class="panel">
  <span id="brand">YELLOW <small>FUSION FACTORY · 大田区</small></span>
  <button class="btn on" data-mode="ext">外観</button>
  <button class="btn" data-mode="1">1F ホール</button>
  <button class="btn" data-mode="2">2F ソフト</button>
  <button class="btn" data-mode="3">3F 設計</button>
  <button class="btn" id="secBtn">断面</button>
  <button class="btn" id="walkBtn">歩行 (WASD)</button>
</div>
<div id="views" class="panel"><span class="lbl">視点</span></div>
<div id="crumb"></div>

<div id="tools" class="panel">
  <button class="btn sm on" data-day="day">昼</button><button class="btn sm" data-day="dusk">夕</button><button class="btn sm" data-day="night">夜</button>
  <button class="btn sm on" id="playBtn">⏸ 稼働</button>
  <button class="btn sm" id="layersBtn">レイヤー</button>
  <button class="btn sm" id="photosBtn">構想イメージ</button>
  <button class="btn sm" id="tourBtn">▶ ガイドツアー</button>
  <button class="btn sm" id="shotBtn" title="PNGで保存">📷</button>
</div>

<div id="stats" class="panel">
  <h3>計画概要 — 大田区 開発一体型工場（構想 v0.1）</h3>
  <div id="statsBody"></div>
</div>

<div id="layers" class="panel"><h3>表示レイヤー</h3><div id="layerList"></div></div>
<div id="section" class="panel"><h3>断面カット</h3>
  <div class="row"><span>方向</span><span><button class="btn sm on" data-ax="y">水平（高さ）</button> <button class="btn sm" data-ax="z">南北</button> <button class="btn sm" data-ax="x">東西</button></span></div>
  <input id="secRange" type="range" min="0" max="100" value="55">
  <div class="row sub"><span id="secLabel">高さ 10.0 m 以上をカット</span><button class="btn sm" id="secOff">解除</button></div>
</div>

<div id="ledger" class="panel"><h3>設備台帳 <span id="eqCount" style="color:var(--acc)"></span></h3><input id="eqFilter" placeholder="設備名・ID・ゾーンで絞込み"><div id="ledgerList"></div></div>
<div id="info" class="panel"></div>
<div id="hint">左ドラッグ 回転 ／ 右ドラッグ・<kbd>Shift</kbd>＋ドラッグ 平行移動 ／ ホイール ズーム ／ 設備クリックで詳細 ／ 歩行モード <kbd>W A S D</kbd> <kbd>Q E</kbd> 上下 <kbd>Esc</kbd> 終了 ／ <kbd>1</kbd>〜<kbd>4</kbd> 階切替 <kbd>T</kbd> ツアー</div>

<div id="photos" class="panel"><h3>構想イメージ（クリックで拡大）</h3><div class="grid" id="photoGrid"></div></div>
<div id="lightbox"><img id="lbImg" alt=""><p id="lbCap"></p></div>
<div id="tourCard" class="panel"><div class="sub" id="tourStep"></div><h2 id="tourTitle"></h2><p id="tourText"></p><div class="ctl"><button class="btn sm" id="tourPrev">‹ 前へ</button><button class="btn sm" id="tourNext">次へ ›</button><button class="btn sm" id="tourStop">終了</button></div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
