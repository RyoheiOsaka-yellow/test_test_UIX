function sRand(seed){ let h = 1779033703 ^ seed.length; for (let i=0;i<seed.length;i++){ h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = (h<<13)|(h>>>19); }
  return function(){ h = Math.imul(h ^ (h>>>16), 2246822507); h = Math.imul(h ^ (h>>>13), 3266489909); h ^= h>>>16; return (h>>>0)/4294967296; }; }
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));
const lerp = (a,b,t)=> a+(b-a)*t;
const pe = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const texCache = {};
function canvasTex(key, size, draw, opts={}){
  if (texCache[key]) return texCache[key];
  const cvs = document.createElement("canvas"); cvs.width = size; cvs.height = opts.h || size;
  const c = cvs.getContext("2d"); draw(c, cvs.width, cvs.height, sRand(key));
  const t = new THREE.CanvasTexture(cvs); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  t.colorSpace = THREE.SRGBColorSpace; if (opts.repeat) t.repeat.set(...opts.repeat);
  texCache[key] = t; return t;
}
function noiseFill(c, w, h, base, amp, n, rnd){
  c.fillStyle = base; c.fillRect(0,0,w,h);
  for (let i=0;i<n;i++){ const v = Math.floor(rnd()*amp); c.fillStyle = `rgba(${v},${v},${v},${(0.15+rnd()*0.35).toFixed(2)})`; c.fillRect(rnd()*w, rnd()*h, 1.5+rnd()*2, 1.5+rnd()*2); }
}

const G = {
  box: (w,h,d)=> new THREE.BoxGeometry(w,h,d),
  cyl: (r,h,seg=24,rt)=> new THREE.CylinderGeometry(rt??r, r, h, seg),
  sph: (r,seg=16)=> new THREE.SphereGeometry(r, seg, Math.max(8, seg/2|0)),
  plane: (w,h)=> new THREE.PlaneGeometry(w,h),
};
function mesh(geo, mat, x=0, y=0, z=0, opts={}){
  const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z);
  if (opts.rot) m.rotation.set(...opts.rot);
  if (opts.ry !== undefined) m.rotation.y = opts.ry;
  m.castShadow = opts.cast ?? true; m.receiveShadow = opts.recv ?? true;
  if (opts.name) m.name = opts.name;
  return m;
}
// box 配置ヘルパ: 底面中心基準 (x, yBottom, z)
function boxAt(parent, w,h,d, mat, x, yb, z, opts={}){ const m = mesh(G.box(w,h,d), mat, x, yb+h/2, z, opts); parent.add(m); return m; }
function cylAt(parent, r,h, mat, x, yb, z, opts={}){ const m = mesh(G.cyl(r,h,opts.seg||24,opts.rt), mat, x, yb+h/2, z, opts); parent.add(m); return m; }

// ---- 静的ジオメトリの材質別マージ（描画コール削減） ----
class Merger {
  constructor(){ this.buckets = new Map(); }
  add(geo, mat, matrix){ const g = geo.clone(); if (matrix) g.applyMatrix4(matrix); if(!this.buckets.has(mat)) this.buckets.set(mat, []); this.buckets.get(mat).push(g); geo.dispose?.(); }
  box(w,h,d, mat, x, yb, z, ry=0){ const mtx = new THREE.Matrix4().makeRotationY(ry).setPosition(x, yb+h/2, z); this.add(G.box(w,h,d), mat, mtx); }
  boxC(w,h,d, mat, x, y, z, rot){ const mtx = new THREE.Matrix4(); if(rot) mtx.makeRotationFromEuler(new THREE.Euler(...rot)); mtx.setPosition(x,y,z); this.add(G.box(w,h,d), mat, mtx); }
  cyl(r,h, mat, x, yb, z, seg=16, rot){ const mtx = new THREE.Matrix4(); if(rot) mtx.makeRotationFromEuler(new THREE.Euler(...rot)); mtx.setPosition(x, rot? yb : yb+h/2, z); this.add(G.cyl(r,h,seg), mat, mtx); }
  flush(parent, opts={}){
    for (const [mat, geos] of this.buckets){
      if (!geos.length) continue;
      const g = mergeGeometries(geos, false); geos.forEach(x=>x.dispose());
      const m = new THREE.Mesh(g, mat); m.castShadow = opts.cast ?? true; m.receiveShadow = opts.recv ?? true;
      if (opts.name) m.name = opts.name; if (opts.layer) m.userData.layer = opts.layer;
      parent.add(m);
    }
    this.buckets.clear();
  }
}

function refitLabels(){ const a = innerWidth/innerHeight; for (const sp of LABELS) sp.scale.set(sp.userData.aspect * sp.userData.hN / a, sp.userData.hN, 1); }
function makeLabel(text, opts={}){
  const scale = opts.scale ?? 1, color = opts.color ?? "#ffffff", bg = opts.bg ?? "rgba(13,17,23,0.78)";
  const cvs = document.createElement("canvas"); const c = cvs.getContext("2d");
  const fs = 44; c.font = `700 ${fs}px -apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif`;
  const tw = c.measureText(text).width; cvs.width = Math.ceil(tw + 56); cvs.height = fs + 36;
  c.font = `700 ${fs}px -apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif`;
  c.fillStyle = bg; c.beginPath(); c.roundRect(0,0,cvs.width,cvs.height,16); c.fill();
  if (opts.accent){ c.fillStyle = opts.accent; c.fillRect(0, 0, 10, cvs.height); }
  c.fillStyle = color; c.textBaseline = "middle"; c.fillText(text, 28, cvs.height/2 + 2);
  const t = new THREE.CanvasTexture(cvs); t.colorSpace = THREE.SRGBColorSpace; t.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, transparent:true, depthTest:false, depthWrite:false, sizeAttenuation:false }));
  const hN = 0.032 * scale; sp.scale.set(cvs.width/cvs.height * hN / (innerWidth/innerHeight), hN, 1); sp.renderOrder = 50; sp.userData.isLabel = true; sp.userData.aspect = cvs.width/cvs.height; sp.userData.hN = hN;
  LABELS.push(sp); return sp;
}

// ================= カメラ制御（軌道 + 歩行） =================
const camState = { yaw:-0.75, pitch:0.55, dist:190, target:new THREE.Vector3(0,6,0) };
const camGoal  = { yaw:-0.75, pitch:0.55, dist:190, target:new THREE.Vector3(0,6,0) };
const walk = { on:false, pos:new THREE.Vector3(-30, 1.65, 26), yaw:Math.PI, pitch:0, keys:{} };
let camDirty = true;
function setCam(goal, instant=false){
  if (goal.yaw !== undefined) camGoal.yaw = goal.yaw; if (goal.pitch !== undefined) camGoal.pitch = goal.pitch;
  if (goal.dist !== undefined) camGoal.dist = goal.dist; if (goal.target) camGoal.target.set(...goal.target);
  if (instant){ camState.yaw=camGoal.yaw; camState.pitch=camGoal.pitch; camState.dist=camGoal.dist; camState.target.copy(camGoal.target); }
  camDirty = true;
}
function applyCam(){
  if (walk.on){
    const dir = new THREE.Vector3(Math.sin(walk.yaw)*Math.cos(walk.pitch), Math.sin(walk.pitch), Math.cos(walk.yaw)*Math.cos(walk.pitch));
    camera.position.copy(walk.pos); camera.lookAt(walk.pos.clone().add(dir)); return;
  }
  const s = camState, g = camGoal, k = 0.12;
  s.yaw = lerp(s.yaw, g.yaw, k); s.pitch = lerp(s.pitch, g.pitch, k); s.dist = lerp(s.dist, g.dist, k); s.target.lerp(g.target, k);
  const p = clamp(s.pitch, 0.02, 1.55);
  camera.position.set(s.target.x + s.dist*Math.cos(p)*Math.sin(s.yaw), s.target.y + s.dist*Math.sin(p), s.target.z + s.dist*Math.cos(p)*Math.cos(s.yaw));
  camera.lookAt(s.target);
  if (Math.abs(s.yaw-g.yaw)+Math.abs(s.pitch-g.pitch)+Math.abs(s.dist-g.dist)+s.target.distanceTo(g.target) < 0.002) camDirty = false;
}
// マウス操作
const drag = { on:false, btn:0, x:0, y:0, moved:0 };
const cvsEl = renderer.domElement;
cvsEl.addEventListener("pointerdown", e => { drag.on = true; drag.btn = e.button; drag.x = e.clientX; drag.y = e.clientY; drag.moved = 0; cvsEl.setPointerCapture(e.pointerId); });
cvsEl.addEventListener("pointermove", e => {
  if (walk.on && document.pointerLockElement === cvsEl){ walk.yaw -= e.movementX*0.0025; walk.pitch = clamp(walk.pitch - e.movementY*0.0025, -1.2, 1.2); return; }
  if (!drag.on) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx)+Math.abs(dy);
  if (drag.btn === 2 || e.shiftKey){
    const right = new THREE.Vector3(Math.cos(camGoal.yaw), 0, -Math.sin(camGoal.yaw));
    const fwd = new THREE.Vector3(-Math.sin(camGoal.yaw), 0, -Math.cos(camGoal.yaw));
    const k = camGoal.dist * 0.0012;
    camGoal.target.addScaledVector(right, -dx*k).addScaledVector(fwd, -dy*k);
  } else { camGoal.yaw -= dx*0.006; camGoal.pitch = clamp(camGoal.pitch + dy*0.005, 0.02, 1.55); }
  camDirty = true;
});
cvsEl.addEventListener("pointerup", e => { drag.on = false; });
cvsEl.addEventListener("contextmenu", e => e.preventDefault());
cvsEl.addEventListener("wheel", e => { e.preventDefault(); if (walk.on) return; camGoal.dist = clamp(camGoal.dist * (1 + Math.sign(e.deltaY)*0.12), 3, 600); camDirty = true; }, { passive:false });
addEventListener("keydown", e => { walk.keys[e.code] = true; });
addEventListener("keyup", e => { walk.keys[e.code] = false; });
addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); refitLabels(); camDirty = true; });

function updateWalk(dt){
  if (!walk.on) return;
  const sp = (walk.keys.ShiftLeft ? 6 : 2.4) * dt;
  const f = new THREE.Vector3(Math.sin(walk.yaw), 0, Math.cos(walk.yaw)), r = new THREE.Vector3(f.z, 0, -f.x);
  if (walk.keys.KeyW || walk.keys.ArrowUp) walk.pos.addScaledVector(f, sp);
  if (walk.keys.KeyS || walk.keys.ArrowDown) walk.pos.addScaledVector(f, -sp);
  if (walk.keys.KeyA || walk.keys.ArrowLeft) walk.pos.addScaledVector(r, sp);
  if (walk.keys.KeyD || walk.keys.ArrowRight) walk.pos.addScaledVector(r, -sp);
  if (walk.keys.KeyQ) walk.pos.y = clamp(walk.pos.y - sp, 1.2, 16);
  if (walk.keys.KeyE) walk.pos.y = clamp(walk.pos.y + sp, 1.2, 16);
  walk.pos.x = clamp(walk.pos.x, -SITE.w/2-20, SITE.w/2+20); walk.pos.z = clamp(walk.pos.z, -SITE.d/2-20, SITE.d/2+30);
}

// ================= 敷地・周辺環境（大田区 工業地域） =================
const LAYERS = {};  // name -> Group
function layer(name){ if(!LAYERS[name]){ const g = new THREE.Group(); g.name = name; LAYERS[name] = g; scene.add(g); } return LAYERS[name]; }

function buildSite(){
  const site = layer("site"), ctx = layer("context"), green = layer("green");
  const mg = new Merger();
  const hw = SITE.w/2, hd = SITE.d/2;  // 60, 40

  // ---- 広域地面 ----
  const ground = mesh(G.plane(1600,1600), std(0x9a9c98,{roughness:1}), 0, -0.05, 0, { rot:[-Math.PI/2,0,0], cast:false }); ground.name="ground"; ctx.add(ground);

  // ---- 前面道路（南）幅員12m、歩道3m ----
  const road = mesh(G.plane(SITE.w+300, 12), M.asphalt, 0, 0.0, hd+3+6, { rot:[-Math.PI/2,0,0], cast:false }); ctx.add(road);
  for (const z of [hd+1.5, hd+12+1.5+3]){ const sw = mesh(G.plane(SITE.w+300, 3), M.paving, 0, 0.12, z, { rot:[-Math.PI/2,0,0], cast:false }); ctx.add(sw);
    mg.box(SITE.w+300, 0.15, 0.25, M.curb, 0, 0, z + (z<hd+5? 1.5 : -1.5)); }
  // 東側道路（トラック進入）幅8m
  const roadE = mesh(G.plane(8, SITE.d+60), M.asphalt, hw+2+4, 0.0, 0, { rot:[-Math.PI/2,0,0], cast:false }); ctx.add(roadE);
  const swE = mesh(G.plane(2, SITE.d+60), M.paving, hw+1, 0.12, 0, { rot:[-Math.PI/2,0,0], cast:false }); ctx.add(swE);
  // 車線・横断歩道
  for (let x=-hw-140; x<hw+140; x+=8) mg.box(4, 0.02, 0.15, M.lineWhite, x+2, 0.01, hd+3+6);
  for (let i=0;i<12;i++) mg.box(0.45, 0.02, 10, M.lineWhite, -hw-4 + i*1.0, 0.012, hd+3+6);
  for (let i=0;i<12;i++) mg.box(0.45, 0.02, 10, M.lineWhite, 22 + i*1.0, 0.012, hd+3+6);
  // 街灯・電柱・架線（大田区の街路らしさ）
  const poles = [];
  for (let x=-hw-130; x<=hw+130; x+=30){ const z = hd+12+3+2.0; mg.cyl(0.18, 11, M.pole, x, 0, z, 10); mg.box(2.2, 0.12, 0.12, M.pole, x, 10.2, z); mg.box(2.2, 0.12, 0.12, M.pole, x, 9.4, z); poles.push([x,z]); }
  const wireMat = new THREE.LineBasicMaterial({ color:0x2a2a2a });
  for (const dy of [10.2, 9.4]) for (const dx of [-1, 1]){ const pts = []; for (const [x,z] of poles){ pts.push(new THREE.Vector3(x+dx*0.9, dy, z)); if (poles.indexOf) {} }
    const geo = new THREE.BufferGeometry().setFromPoints(pts); const l = new THREE.Line(geo, wireMat); ctx.add(l); }
  for (let x=-hw+10; x<hw; x+=24){ mg.cyl(0.12, 8, M.darkSteel, x, 0, hd+1.2, 8); mg.box(1.6, 0.12, 0.3, M.darkSteel, x+0.8, 8, hd+1.2); mg.box(0.5, 0.12, 0.25, M.lamp, x+1.4, 7.9, hd+1.2); }

  // ---- 隣接建物（低層工場・倉庫・集合住宅の群）----
  const rnd = sRand("ota-neighbors");
  const nb = new Merger();
  function block(x, z, w, d, h, kind){
    const mat = kind===0? M.neighbor : kind===1? M.neighbor2 : std(0xdedbd3,{roughness:0.85});
    nb.box(w, h, d, mat, x, 0, z);
    if (kind===0){ // 鋸屋根工場
      const n = Math.max(1, Math.round(w/8)); for (let i=0;i<n;i++) nb.boxC(w/n*0.98, 2.2, d*0.98, M.neighborRoof, x - w/2 + w/n*(i+0.5), h+0.9, z, [0,0,0.25]);
    } else if (kind===1){ nb.box(w*0.96, 0.6, d*0.96, M.neighborRoof, x, h, z); nb.box(3, 2.4, 3, M.neighbor2, x+w/4, h+0.6, z+d/4); }
    else { for (let f=1; f<h/3; f++) for (let i=0;i<Math.floor(w/4);i++) nb.box(2.2, 1.4, 0.15, M.glassTint, x-w/2+2+i*4, f*3+1.0, z+d/2+0.05); nb.box(w*0.96, 0.4, d*0.96, M.neighborRoof, x, h, z); }

// ================= 建屋：架構・外皮・床・コア =================
const FL = {};      // 階ごとのグループ（表示切替用）: 1,2,3, roof
function floorGroup(f){ if(!FL[f]){ const g = new THREE.Group(); g.name = "floor_"+f; FL[f] = g; scene.add(g); } return FL[f]; }

// 屋根プロファイル補間 y(z)
function roofY(z){
  const p = BLD.roofProfile; if (z <= p[0][0]) return p[0][1]; if (z >= p[p.length-1][0]) return p[p.length-1][1];
  for (let i=0;i<p.length-1;i++){ const [z0,y0]=p[i], [z1,y1]=p[i+1]; if (z>=z0 && z<=z1) return lerp(y0, y1, (z-z0)/(z1-z0)); }
  return BLD.eave;
}

function buildBuilding(){
  const { x0, x1, z0, zh, z1, terraceZ, eaveZ, lv, eave, craneRail, grid } = BLD;
  const S = new Merger();   // 構造（1Fに属させ常時表示）
  const R = new Merger();   // 屋根まわり
  const E1 = new Merger(), E2 = new Merger(), E3 = new Merger(); // 階別 外皮・床・壁
  const g1 = floorGroup(1), g2 = floorGroup(2), g3 = floorGroup(3), gr = floorGroup("roof");
  const W = x1 - x0;

  // ---------- 柱 ----------
  const cols = []; for (let x=x0; x<=x1+0.01; x+=grid) cols.push(x);
  for (const x of cols){
    S.box(0.7, eave, 0.7, M.yellow, x, 0, z0+0.6);                 // 北側 主柱（黄）
    S.box(0.7, eave, 0.7, M.yellow, x, 0, zh-0.6);                  // ホール南側 主柱（黄）
    S.box(0.45, lv[2]+4.1, 0.45, M.steel, x, 0, z1-0.5);           // 南ファサード 柱
    if (x>x0 && x<x1) S.box(0.45, lv[2]+4.1, 0.45, M.steel, x, 0, 10); // ストリップ中間柱
    // クレーン受けブラケット + ランウェイ
    S.box(1.0, 0.5, 0.9, M.yellow, x, craneRail-1.3, z0+1.35); S.box(1.0, 0.5, 0.9, M.yellow, x, craneRail-1.3, zh-1.35);
  }
  for (const zr of [z0+1.35, zh-1.35]){ S.box(W+1, 0.9, 0.4, M.darkSteel, (x0+x1)/2, craneRail-0.9, zr); S.box(W+1, 0.12, 0.12, M.steel, (x0+x1)/2, craneRail, zr); }
  // 壁つなぎ（胴縁）北面
  for (const y of [3, 6, 9, 12]) S.box(W, 0.15, 0.15, M.darkSteel, (x0+x1)/2, y, z0+0.95);

  // ---------- 屋根トラス（各通り）----------
  const prof = BLD.roofProfile;
  function trussAt(x, m){
    // 上弦材：プロファイルに沿う
    for (let i=0;i<prof.length-1;i++){ const [za,ya]=prof[i], [zb,yb]=prof[i+1]; const L = Math.hypot(zb-za, yb-ya); const ang = Math.atan2(yb-ya, zb-za);
      m.boxC(0.25, 0.3, L, M.darkSteel, x, (ya+yb)/2 - 0.5, (za+zb)/2, [-ang, 0, 0]); }
    // 下弦材：ホール部は水平 y=12.8、ストリップ部は y=13.3
    m.box(0.25, 0.25, (zh - z0) + 0.5, M.darkSteel, x, 12.8, (z0+zh)/2 - 0.25);
    m.box(0.25, 0.25, (eaveZ - zh) - 0.5, M.darkSteel, x, 13.3, (zh+eaveZ)/2);
    // 束材・斜材
    for (let z=z0; z<=eaveZ-0.5; z+=4){ const yb = z<zh? 12.8 : 13.3, yt = roofY(z)-0.5; const h = yt - yb; if (h<0.3) continue;
      m.box(0.12, h, 0.12, M.steel, x, yb, z);
      const zn = Math.min(z+4, eaveZ); const ytn = roofY(zn)-0.5; const L = Math.hypot(zn-z, ytn-yb); const ang = Math.atan2(ytn-yb, zn-z);
      m.boxC(0.08, 0.08, L, M.steel, x, (yb+ytn)/2, (z+zn)/2, [-ang, 0, 0]); }
  }
  for (const x of cols) trussAt(x, R);
  // 母屋（屋根下面、東西方向）
  for (let z=z0+1; z<eaveZ; z+=2){ const y = roofY(z)-0.28; const sl = (roofY(z+0.5)-roofY(z-0.5)); R.boxC(W+2, 0.18, 0.12, M.steel, (x0+x1)/2, y, z, [-Math.atan(sl), 0, 0]); }
  // 2F/3F 床梁（東西・南北）
  for (const [f, y] of [[2, lv[1]], [3, lv[2]]]){ const m = f===2? E2 : E3;
    for (const x of cols) m.box(0.3, 0.6, (f===2? terraceZ : z1) - zh + 2, M.darkSteel, x, y-0.65, ((f===2? terraceZ : z1) + zh - 2)/2);
    for (const z of [zh-1.0, 10, z1-0.5]) m.box(W, 0.6, 0.3, M.darkSteel, (x0+x1)/2, y-0.65, z); }

  // ---------- 屋根（折板）----------
  function roofExtrude(offset, thick, mat, zFrom, zTo, xa, xb, target){
    const pts = prof.filter(p=>p[0]>=zFrom-0.01 && p[0]<=zTo+0.01).map(([z,y])=>[z, y+offset]);
    if (pts[0][0] > zFrom) pts.unshift([zFrom, roofY(zFrom)+offset]); if (pts[pts.length-1][0] < zTo) pts.push([zTo, roofY(zTo)+offset]);
    const shape = new THREE.Shape(); shape.moveTo(-pts[0][0], pts[0][1]); for (let i=1;i<pts.length;i++) shape.lineTo(-pts[i][0], pts[i][1]);
    for (let i=pts.length-1;i>=0;i--) shape.lineTo(-pts[i][0], pts[i][1]-thick); shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth: xb-xa, bevelEnabled:false });
    const m = new THREE.Mesh(geo, mat); m.rotation.y = Math.PI/2; m.position.x = xa; m.castShadow = true; m.receiveShadow = true; target.add(m); return m;
  }
  roofExtrude(0, 0.45, M.roofMetal, z0-1, eaveZ, x0-1.2, x1+1.2, gr).name = "roofTop";
  // ホール内側 デッキ（薄グレー）と、ストリップ・キャンチ部の木天井
  roofExtrude(-0.5, 0.05, std(0xd9dcdf,{roughness:0.8, side:THREE.DoubleSide}), z0-0.5, zh, x0, x1, gr);
  const soffit = mesh(G.plane(W+2.4, eaveZ - zh), M.timber, (x0+x1)/2, 13.65, (zh+eaveZ)/2, { rot:[Math.PI/2,0,0], cast:false }); soffit.material = M.timber.clone(); soffit.material.map = TEX.timber([1, 44]); gr.add(soffit);
  // 木ルーバー（軒下に 30cm ピッチ）
  for (let z=zh+0.3; z<eaveZ-0.3; z+=0.3) R.box(W+2.4, 0.12, 0.06, M.timber, (x0+x1)/2, 13.45, z);
  // 鋸歯型トップライト（北向き）
  for (const zc of [-27, -22, -17]){ const yb = roofY(zc); const h = 2.2; const lidZ = 3.6; const ye = roofY(zc+lidZ)+0.05;
    const glass = mesh(G.plane(W-2, h), M.glass, (x0+x1)/2, yb+h/2, zc, { cast:false, ry:Math.PI }); gr.add(glass);
    const L = Math.hypot(lidZ, ye-(yb+h)); R.boxC(W-1.6, 0.25, L, M.roofMetal, (x0+x1)/2, (yb+h+ye)/2, zc+lidZ/2, [-Math.atan2(ye-(yb+h), lidZ), 0, 0]);
    for (let x=x0+1; x<x1; x+=2) R.box(0.1, h, 0.1, M.mullion, x, yb, zc);
    R.box(W-1.6, 0.15, 0.3, M.roofMetal, (x0+x1)/2, yb+h-0.1, zc); R.boxC(0.3, h, lidZ, M.roofMetal, x0+0.9, yb+h/2, zc+lidZ/2); R.boxC(0.3, h, lidZ, M.roofMetal, x1-0.9, yb+h/2, zc+lidZ/2); }
  // 妻壁（東・西）: 屋根プロファイルに合わせたパネル（ホール部のみ。ストリップ部はガラス/折板）
  function gableShape(zFrom, zTo, yBase){ const sh = new THREE.Shape(); sh.moveTo(-zFrom, yBase); for (let z=zFrom; z<=zTo; z+=1) sh.lineTo(-z, roofY(z)-0.45); sh.lineTo(-zTo, roofY(zTo)-0.45); sh.lineTo(-zTo, yBase); sh.closePath(); return sh; }
  // 東妻壁：折板（出荷扉含む）
  { const geo = new THREE.ExtrudeGeometry(gableShape(z0, zh, 0), { depth:0.3, bevelEnabled:false }); const m = new THREE.Mesh(geo, M.wallMetal); m.rotation.y = Math.PI/2; m.position.x = x1-0.3; m.castShadow = m.receiveShadow = true; g1.add(m); }
  // 西妻壁：ホール部は全面ガラス（駐車場側から機械が見える）、上部三角は折板
  { const geo = new THREE.ExtrudeGeometry(gableShape(z0, zh, 12.5), { depth:0.3, bevelEnabled:false }); const m = new THREE.Mesh(geo, M.wallMetal); m.rotation.y = Math.PI/2; m.position.x = x0; g1.add(m); }
  // 東側 折れファサード（ストリップ部 z 2〜24：屋根が壁として折り下がる）
  { const sh = new THREE.Shape(); sh.moveTo(-zh, 0); sh.lineTo(-eaveZ, 0); sh.lineTo(-eaveZ, roofY(eaveZ)-0.4); sh.lineTo(-zh, roofY(zh)-0.4); sh.closePath();
    const geo = new THREE.ExtrudeGeometry(sh, { depth:0.35, bevelEnabled:false }); const m = new THREE.Mesh(geo, M.wallMetal); m.rotation.y = Math.PI/2; m.position.set(x1-0.2, 0, 0); m.rotation.z = 0.0; m.castShadow = m.receiveShadow = true;
    // 上端を外へ 1.2m 倒す（折れ感）
    m.geometry.applyMatrix4(new THREE.Matrix4().makeShear(0, 0, 0, 0, 0, 0.085)); g1.add(m); }

  // ---------- 外壁・カーテンウォール ----------
  const mullV = [], mullH = [];   // インスタンス化用 [x,y,z,h,ry]
  function curtain(target, m, xa, xb, za, zb, yb, yt, opts={}){
    // 平面 (xa,za)-(xb,zb) の鉛直ガラス面 + マリオン
    const L = Math.hypot(xb-xa, zb-za), ry = Math.atan2(xb-xa, zb-za) + Math.PI/2; const cx=(xa+xb)/2, cz=(za+zb)/2;
    const gl = mesh(G.plane(L, yt-yb), opts.mat || M.glass, cx, (yb+yt)/2, cz, { ry, cast:false }); gl.userData.layer="envelope"; target.add(gl);
    const n = Math.round(L/(opts.pitch||2)); for (let i=0;i<=n;i++){ const t=i/n; mullV.push([lerp(xa,xb,t), yb, lerp(za,zb,t), yt-yb, ry]); }
    for (const y of (opts.transoms||[])) if (y>yb && y<yt) m.boxC(L, 0.1, 0.12, M.mullion, cx, y, cz, [0, ry, 0]);
    m.boxC(L, 0.15, 0.2, M.mullion, cx, yb+0.08, cz, [0, ry, 0]); m.boxC(L, 0.15, 0.2, M.mullion, cx, yt-0.08, cz, [0, ry, 0]);

// グループ内の静的メッシュを材質ごとに結合（描画コール削減）。userData.dyn / joints を持つ部分は除外。
function compactGroup(grp){
  grp.updateMatrixWorld(true); const buckets = new Map(), remove = [];
  grp.traverse(o => { if (!o.isMesh || o.isInstancedMesh || o.isSprite || o.userData.dyn || Array.isArray(o.material)) return;
    let p = o.parent; while (p && p !== grp){ if (p.userData.joints || p.userData.dyn) return; p = p.parent; }
    const g = o.geometry.clone().applyMatrix4(o.matrixWorld); if (!buckets.has(o.material)) buckets.set(o.material, []); buckets.get(o.material).push(g); remove.push(o); });
  remove.forEach(o => o.parent.remove(o));
  for (const [mat, geos] of buckets){ const m = new THREE.Mesh(mergeGeometries(geos, false), mat); geos.forEach(g=>g.dispose()); m.castShadow = m.receiveShadow = true; grp.add(m); }
}

class PathMover {
  constructor(obj, pts, speed, opts={}){ this.obj = obj; this.pts = pts.map(p=>new THREE.Vector3(p[0], p[1]??0, p[2]??p[1])); this.speed = speed; this.loop = opts.loop ?? true; this.pause = opts.pause ?? 0; this.seg = 0; this.t = 0; this.wait = 0; this.yoff = opts.yoff ?? 0; this.smoothTurn = opts.smoothTurn ?? true;
    this.lens = []; for (let i=0;i<this.pts.length-1;i++) this.lens.push(this.pts[i].distanceTo(this.pts[i+1])); this.obj.position.copy(this.pts[0]); this.obj.position.y += this.yoff; this.moving = true; }
  update(dt){
    if (this.wait > 0){ this.wait -= dt; this.moving = false; return; } this.moving = true;
    const n = this.pts.length - 1; if (n < 1) return;
    let a = this.pts[this.seg], b = this.pts[(this.seg+1) % this.pts.length]; if (!this.loop && this.seg >= n) return;
    const L = a.distanceTo(b) || 0.001; this.t += this.speed*dt / L;
    while (this.t >= 1){ this.t -= 1; this.seg = (this.seg + 1) % (this.loop ? this.pts.length : n); if (this.pause) this.wait = this.pause; a = this.pts[this.seg]; b = this.pts[(this.seg+1) % this.pts.length]; if (!this.loop && this.seg >= n){ this.t = 0; break; } }
    const p = a.clone().lerp(b, this.t); this.obj.position.set(p.x, p.y + this.yoff, p.z);
    const dir = b.clone().sub(a); if (dir.lengthSq() > 1e-6){ const yaw = Math.atan2(dir.x, dir.z); this.obj.rotation.y = this.smoothTurn ? lerpAngle(this.obj.rotation.y, yaw, Math.min(1, dt*6)) : yaw; }
  }
}
function lerpAngle(a, b, t){ let d = b - a; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; return a + d*t; }

  <tr><td>想定人員</td><td class="n">${staff} 名</td><td class="sub">${EQUIP.length} 設備</td></tr></table><div class="sep"></div><h3>人員内訳</h3><table>`;
  for (const [name, num, t] of STAFF) h += `<tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#${ZTYPE[t].c.toString(16).padStart(6,"0")};margin-right:6px"></i>${pe(name)}</td><td class="n">${num} 名</td></tr>`;
  h += `</table><div class="sep"></div><h3>ゾーン凡例</h3><div class="legend">`;
  for (const k in ZTYPE) h += `<span><i style="background:#${ZTYPE[k].c.toString(16).padStart(6,"0")}"></i>${pe(ZTYPE[k].n)}</span>`;
  h += `</div><div class="sep"></div><div class="sub">${pe(SITE.road)}。${pe(SITE.heightNote)}。数値は構想段階の想定値で、敷地確定後に SITE / BLD の差替えで更新。</div>`;
  $("statsBody").innerHTML = h;
}

// ---- 設備台帳・詳細 ----
let selectedId = null, hoverId = null; const hiCache = new Map();
function setHighlight(id, on){ const o = EQ_OBJ[id]; if (!o) return; o.group.traverse(m => { if (!m.isMesh || !m.material || !m.material.emissive) return; if (on){ if (!hiCache.has(m)) hiCache.set(m, [m.material, m.material.clone()]); const mat = hiCache.get(m)[1]; mat.emissive.set(0xf2c744); mat.emissiveIntensity = 0.45; m.material = mat; } else if (hiCache.has(m)){ m.material = hiCache.get(m)[0]; } }); }
function zoneName(id){ const z = ZONES.find(z => z[0] === id); return z ? z[1] : id; }
function showInfo(e){
  const p = $("info"); if (!e){ p.style.display = "none"; return; }
  const z = ZONES.find(z => z[0] === e.zone); let h = `<div class="sub">${pe(e.id)} · ${pe(zoneName(e.zone))}${z ? ` · ${z[2] ? z[2]+"F" : "屋外"}` : ""}</div><h2>${pe(e.name)}</h2><table>`;
  for (const k in e.spec) h += `<tr><td>${pe(k)}</td><td>${pe(e.spec[k])}</td></tr>`;
  h += `<tr><td>位置</td><td>x ${e.x} m, z ${e.z} m</td></tr></table><div class="sep"></div><div style="display:flex;gap:6px;justify-content:flex-end"><button class="btn sm" id="infoGo">設備へ寄る</button><button class="btn sm" id="infoClose">閉じる</button></div>`;
  p.innerHTML = h; p.style.display = "block"; $("infoGo").onclick = () => focusEq(e.id); $("infoClose").onclick = () => selectEq(null);
}
function selectEq(id){ if (selectedId) setHighlight(selectedId, false); selectedId = id; if (id) setHighlight(id, true); document.querySelectorAll(".eq").forEach(el => el.classList.toggle("on", el.dataset.id === id)); showInfo(id ? EQUIP.find(e => e.id === id) : null); }
function focusEq(id){ const e = EQUIP.find(x => x.id === id); if (!e) return; const f = ZONES.find(z => z[0] === e.zone)?.[2] ?? 1; if (walk.on) toggleWalk(false); if (mode === "ext" || Number(mode) < f) setMode(f); const y = BLD.lv[f - 1] + (e.kind === "crane" ? 10 : 2); const big = ["gantry","testcell","assembly","crane","server"].includes(e.kind); setCam({ yaw: camGoal.yaw, pitch:0.38, dist: big ? 34 : 18, target:[e.x, y, e.z] }); selectEq(id); }
function renderLedger(){ const q = ($("eqFilter").value || "").trim().toLowerCase(); const list = $("ledgerList"); list.innerHTML = ""; let n = 0;
  for (const e of EQUIP){ const zn = zoneName(e.zone); if (q && !(e.id + e.name + zn + e.kind).toLowerCase().includes(q)) continue; n++;
    const d = document.createElement("div"); d.className = "eq" + (e.id === selectedId ? " on" : ""); d.dataset.id = e.id; d.innerHTML = `<b>${pe(e.id)}</b><span>${pe(e.name)}<br><small>${pe(zn)}</small></span>`; d.onclick = () => focusEq(e.id); list.appendChild(d); }
  $("eqCount").textContent = `${n}/${EQUIP.length}`; }
$("eqFilter").oninput = renderLedger;

// ---- ピック ----
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
function pickAt(x, y){ ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const targets = [FL[1], FL[2], FL[3]].filter(g => g.visible); const hits = ray.intersectObjects(targets, true);
  for (const h of hits){ if (h.object.isSprite) continue; let o = h.object; while (o){ if (o.userData.eqId) return o.userData.eqId; o = o.parent; } return null; } return null; }
cvsEl.addEventListener("pointerup", e => { if (walk.on || drag.moved > 6 || e.button !== 0) return; const id = pickAt(e.clientX, e.clientY); if (id) { selectEq(id); } else selectEq(null); });
let hoverTimer = 0;
cvsEl.addEventListener("pointermove", e => { if (walk.on || drag.on) return; const now = performance.now(); if (now - hoverTimer < 80) return; hoverTimer = now; const id = pickAt(e.clientX, e.clientY); if (id !== hoverId){ if (hoverId && hoverId !== selectedId) setHighlight(hoverId, false); hoverId = id; if (id && id !== selectedId) setHighlight(id, true); cvsEl.style.cursor = id ? "pointer" : ""; } });

// ---- 構想イメージ ----
{ const g = $("photoGrid"); PHOTOS.forEach(p => { const f = document.createElement("figure"); f.style.margin = 0; f.innerHTML = `<img src="${p.f}" alt="${pe(p.t)}" loading="lazy"><figcaption>${pe(p.t)}</figcaption>`; f.querySelector("img").onclick = () => { $("lbImg").src = p.f; $("lbCap").textContent = p.t; $("lightbox").style.display = "flex"; }; g.appendChild(f); }); }
$("lightbox").onclick = () => $("lightbox").style.display = "none";
$("photosBtn").onclick = () => { const p = $("photos"); const on = p.style.display !== "block"; p.style.display = on ? "block" : "none"; $("photosBtn").classList.toggle("on", on); };

// ---- ガイドツアー ----
let tourIdx = -1, tourTimer = null;
function tourGo(i){ if (i < 0 || i >= TOUR.length){ tourStop(); return; } tourIdx = i; const s = TOUR[i]; if (walk.on) toggleWalk(false);
  if (s.mode === "ext") setMode("ext"); else setMode(s.floor); setCam(s.cam);
  $("tourStep").textContent = `ガイドツアー ${i + 1} / ${TOUR.length}`; $("tourTitle").textContent = s.title; $("tourText").textContent = s.text; $("tourCard").style.display = "block";
  clearTimeout(tourTimer); tourTimer = setTimeout(() => tourGo(i + 1), 11000); }
function tourStop(){ clearTimeout(tourTimer); tourTimer = null; tourIdx = -1; $("tourCard").style.display = "none"; $("tourBtn").classList.remove("on"); }
$("tourBtn").onclick = () => { if (tourIdx >= 0) tourStop(); else { $("tourBtn").classList.add("on"); tourGo(0); } };
$("tourNext").onclick = () => tourGo(tourIdx + 1); $("tourPrev").onclick = () => tourGo(Math.max(0, tourIdx - 1)); $("tourStop").onclick = tourStop;

// ---- スクリーンショット ----
$("shotBtn").onclick = () => { renderer.render(scene, camera); const a = document.createElement("a"); a.download = `yellow-ota-factory-${Date.now()}.png`; a.href = renderer.domElement.toDataURL("image/png"); a.click(); };

// ---- キーボード ----
addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; const k = e.key;
  if (k === "1") { setMode(1); } else if (k === "2") { setMode(2); } else if (k === "3") { setMode(3); } else if (k === "4" || k === "0") { setMode("ext"); }
  else if (k === "t" || k === "T") $("tourBtn").click(); else if (k === "Escape") { if (walk.on) toggleWalk(false); selectEq(null); tourStop(); } });

// ================= 構築 & メインループ =================
function build(){
  buildSite(); buildBuilding(); buildInterior(); buildMovers();
  for (const k in LAYERS) { if (k === "green" || k === "context") LAYERS[k].userData.layer = k; }
  // 人・車両レイヤー：階グループ内の作業者にも付与
  scene.traverse(o => { if (o.userData.legs) o.userData.layer = "people"; });
  renderStats(); renderLedger(); setDay("day"); setMode("ext"); setCam(VIEWS[0][1], true); refitLabels();
  $("loading").style.display = "none";
}
const clock = new THREE.Clock(); let frame = 0;
function updateLabels(){
  const d = walk.on ? 12 : camGoal.dist; const f = mode === "ext" ? 0 : Number(mode);
  for (const sp of LABELS){ const k = sp.userData.kind; if (!k){ sp.visible = layerState.labels; continue; }
    if (k === "zone") sp.visible = layerState.labels && !walk.on && d > 28 && (sp.userData.floor === 0 ? (d > 60 && mode === "ext") : (mode !== "ext" && sp.userData.floor === f));
    else sp.visible = layerState.labels && d < 90 && (walk.on || mode !== "ext") && (mode === "ext" || sp.userData.floor <= f); }
}
function loop(){
  requestAnimationFrame(loop); const dt = Math.min(0.05, clock.getDelta()); frame++;
  updateLabels();
  if (playing) updateMovers(dt);
  updateWalk(dt); applyCam();
  if (shadowDirty || (playing && frame % 3 === 0)){ renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
  renderer.render(scene, camera);
}
$("loadMsg").textContent = "敷地・建屋・設備を生成しています…";
setTimeout(() => { try { build(); } catch (err) { $("loadMsg").textContent = "構築エラー: " + err.message; console.error(err); throw err; } loop(); }, 30);
window.__factory = { scene, camera, renderer, EQUIP, ZONES, BLD, SITE, setMode, setCam, setDay, focusEq, FL, LAYERS };
</script>
